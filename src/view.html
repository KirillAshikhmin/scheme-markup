<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-text="view.title"></title>
    <!-- Значок вкладки тот же, что у «Разметки»: это один сервис, и двух
         рисунков у него быть не должно. Отличается не рисунок, а адрес
         запуска — он в своём манифесте (G20.1). -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230d1117'/%3E%3Crect%20x='6'%20y='6.5'%20width='20'%20height='19'%20fill='none'%20stroke='%23e6edf3'%20stroke-width='2.4'/%3E%3Cpath%20d='M6%2014h20'%20fill='none'%20stroke='%23e6edf3'%20stroke-width='2.4'/%3E%3Ccircle%20cx='18.5'%20cy='19.8'%20r='3.9'%20fill='%231f6feb'%20stroke='%230d1117'%20stroke-width='1.4'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#0d1117" />
    <!-- Свой манифест (G20.1): значок с домашнего экрана ведёт в просмотр, а не
         в «Разметку». Имя, короткое имя и описание — свои, значки те же два,
         `start_url` указывает на эту страницу. Ссылка обязательна — её
         проверяет `assertLocalLinks`. -->
    <link rel="manifest" href="view.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ——— страница просмотра объекта (таск 01 просмотра) ————————————————
         Та же сборка, что у «Разметки»: тот же код и те же стили, **другая
         разметка**. Панель монтируется только там, где для неё есть узел
         (`app.mountPanel` молча проходит мимо отсутствующего), поэтому список
         точек монтирования здесь и есть состав страницы: правки объекта на
         ней нет ни одной — ни «Чертежа», ни постановки меток, ни полей, ни
         «Сохранить файл», ни отмены, ни справочника, ни таблиц, ни выгрузок,
         ни списка объектов.

         Разметки мало: на широком экране правку разрешает раскладка. Поэтому
         корень несёт род страницы (`data-app="view"`), а запрет выражен тем же
         перечнем умений, что решает раскладки (`app.VIEW_ABILITIES`,
         `app.appAllows`). -->
    <div id="app" data-app="view">
      <header id="app-header">
        <span id="app-title" data-text="view.title"></span>
        <!-- Имя объекта, дата выгрузки и меню страницы («Открыть другой
             файл», «Забыть этот объект», «Сценарии и журнал») заводит сама
             панель просмотра: своих узлов в шапке она не требует — так же
             поступает панель файла с кнопкой «Открыть файл». -->
        <!-- Поиск метки по номеру (G02): то же поле, что в «Разметке». -->
        <div id="header-search" class="mount"></div>
      </header>

      <!-- Левая колонка: параметры «Объёма» (все семь групп) и список схем.
           Список схем — переключатель схем и этажей (R04.2), и он же поднимает
           подложку схемы в состояние сеанса; завести, заменить и удалить схему
           в нём нечем — это правка (`editSchemes`). -->
      <aside id="panel-left" class="panel">
        <section class="panel__section panel__section--screen" data-section-id="volumeTools">
          <h2 class="panel__head">
            <button class="panel__fold" type="button" data-section-fold="volumeTools" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
            </button>
            <button class="panel__title" type="button" data-section="volumeTools">
              <span class="panel__name" data-text="panels.volumeTools"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-volume-tools" class="panel__body mount"></div>
        </section>
        <section class="panel__section panel__section--grow" data-section-id="schemes">
          <h2 class="panel__head">
            <button class="panel__fold" type="button" data-section-fold="schemes" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
            </button>
            <button class="panel__title" type="button" data-section="schemes">
              <span class="panel__name" data-text="panels.schemes"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-schemes" class="panel__body mount"></div>
        </section>
      </aside>

      <main id="canvas-area">
        <div id="canvas-host" class="mount"></div>
        <!-- Поверхностей две, а не четыре: «Чертежа» и «Сценариев» на этой
             странице нет вовсе. Режимы переключает тот же ряд кнопок, что в
             «Разметке» (`screensFor` спрашивает те же умения). -->
        <div id="screen-volume" class="screen mount"></div>
        <div id="canvas-overlay" class="mount"></div>
        <div id="canvas-modes" class="mount"></div>
        <!-- Карточка метки снизу поля: в просмотре она и есть способ прочитать
             метку и управлять устройством. -->
        <div id="canvas-card" class="mount"></div>
        <!-- Полоса дома и журнал: дом на этой странице идёт, пока она открыта. -->
        <div id="sim-bar" class="mount"></div>
        <div id="sim-journal" class="mount"></div>
        <!-- Слот объекта: пустое состояние, строка о предпросмотре и память
             одного объекта (`panels/viewStart.js`). Пока объекта нет, поле
             пустое, и страница говорит, что делать. -->
        <div id="view-start" class="mount"></div>
        <p id="canvas-empty" data-text="view.empty"></p>
      </main>

      <!-- Правая колонка: список меток с поиском (G02). Параметров метки в нём
           нет — поля гаснут умением `editMarks`, которого в просмотре нет. -->
      <aside id="panel-right" class="panel">
        <section class="panel__section panel__section--grow panel__section--screen" data-section-id="markList">
          <h2 class="panel__head">
            <button class="panel__fold" type="button" data-section-fold="markList" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
            </button>
            <button class="panel__title" type="button" data-section="markList">
              <span class="panel__name" data-text="panels.markList"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-marks" class="panel__body mount"></div>
        </section>
      </aside>

      <!-- Ручки колонок: на планшете поле дороже колонок, и прячутся они той же
           кнопкой, что в «Разметке». -->
      <button class="panel-handle panel-handle--left" type="button" data-panel-toggle="left"></button>
      <button class="panel-handle panel-handle--right" type="button" data-panel-toggle="right"></button>

      <!-- Узкий экран: план во весь экран, колонки приходят листом снизу. -->
      <nav id="mobile-bar">
        <button class="mobile-bar__btn" type="button" data-sheet-button="none" data-text="mobile.plan"></button>
        <button class="mobile-bar__btn" type="button" data-sheet-button="schemes" data-text="mobile.schemes"></button>
        <button class="mobile-bar__btn" type="button" data-sheet-button="marks" data-text="mobile.marks"></button>
      </nav>

      <div id="dialog-host" class="mount"></div>
      <div id="notifications"></div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
