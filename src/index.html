<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-text="app.title"></title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="app-header">
        <div id="app-brand">
          <span id="app-title" data-text="app.title"></span>
          <span id="app-subtitle" data-text="app.subtitle"></span>
        </div>
        <div id="project-bar">
          <span id="project-label" data-text="header.project"></span>
          <span id="project-name" data-text="header.noProject"></span>
          <div id="project-actions" class="mount"></div>
        </div>
        <!-- Имя открытой схемы: на узком экране списка схем на виду нет,
             и без этой строки непонятно, что вообще открыто. -->
        <span id="scheme-name"></span>
        <div id="header-actions" class="mount"></div>
        <!-- Переход к полной версии показывается только там, где экран сам
             выбрал просмотр: на десктопе кнопки нет. -->
        <button id="layout-toggle" class="ui-btn" type="button" hidden></button>
      </header>

      <!-- Разделы обеих колонок устроены одинаково: кликабельный заголовок
           сворачивает раздел, заголовок липнет к верху колонки, тело листается
           под ним. Растущий раздел в колонке один — список, которому нужно
           место: слева схемы, справа метки. -->
      <aside id="panel-left" class="panel">
        <section class="panel__section" data-section-id="marks">
          <h2 class="panel__head">
            <button class="panel__title" type="button" data-section="marks" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
              <span class="panel__name" data-text="panels.marks"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-tools" class="panel__body mount"></div>
        </section>
        <section class="panel__section" data-section-id="rooms">
          <h2 class="panel__head">
            <button class="panel__title" type="button" data-section="rooms" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
              <span class="panel__name" data-text="panels.rooms"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-rooms" class="panel__body mount"></div>
        </section>
        <section class="panel__section panel__section--grow" data-section-id="schemes">
          <h2 class="panel__head">
            <button class="panel__title" type="button" data-section="schemes" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
              <span class="panel__name" data-text="panels.schemes"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-schemes" class="panel__body mount"></div>
        </section>
        <section class="panel__section" data-section-id="sizes">
          <h2 class="panel__head">
            <button class="panel__title" type="button" data-section="sizes" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
              <span class="panel__name" data-text="panels.sizes"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-sizes" class="panel__body mount"></div>
        </section>
      </aside>

      <main id="canvas-area">
        <div id="canvas-host" class="mount"></div>
        <div id="canvas-overlay" class="mount"></div>
        <p id="canvas-empty" data-text="panels.canvasEmpty"></p>
      </main>

      <aside id="panel-right" class="panel">
        <section class="panel__section panel__section--grow" data-section-id="markList">
          <h2 class="panel__head">
            <button class="panel__title" type="button" data-section="markList" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
              <span class="panel__name" data-text="panels.markList"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-marks" class="panel__body mount"></div>
        </section>
        <section class="panel__section" data-section-id="properties">
          <h2 class="panel__head">
            <button class="panel__title" type="button" data-section="properties" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
              <span class="panel__name" data-text="panels.properties"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-properties" class="panel__body mount"></div>
        </section>
      </aside>

      <!-- Узкий экран: план во весь экран, колонки приходят листом снизу по
           одной. Кнопки крупные — с телефоном в одной руке иначе не попасть. -->
      <nav id="mobile-bar">
        <button class="mobile-bar__btn" type="button" data-sheet-button="none" data-text="mobile.plan"></button>
        <button class="mobile-bar__btn" type="button" data-sheet-button="schemes" data-text="mobile.schemes"></button>
        <button class="mobile-bar__btn" type="button" data-sheet-button="marks" data-text="mobile.marks"></button>
      </nav>

      <div id="dialog-host" class="mount"></div>
      <div id="notifications"></div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
