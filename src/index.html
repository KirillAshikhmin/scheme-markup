<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-text="app.title"></title>
    <!-- Значок вкладки: план из двух помещений и метка на нём — то, что делает
         сам инструмент. Нарисован здесь же: страница самодостаточна, внешних
         ссылок в ней нет, поэтому рисунок лежит в самом адресе `data:`.
         Проверен в размере вкладки (16×16), а не только крупно. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230d1117'/%3E%3Crect%20x='6'%20y='6.5'%20width='20'%20height='19'%20fill='none'%20stroke='%23e6edf3'%20stroke-width='2.4'/%3E%3Cpath%20d='M6%2014h20'%20fill='none'%20stroke='%23e6edf3'%20stroke-width='2.4'/%3E%3Ccircle%20cx='18.5'%20cy='19.8'%20r='3.9'%20fill='%231f6feb'%20stroke='%230d1117'%20stroke-width='1.4'/%3E%3C/svg%3E" />
    <!-- Цвет шапки браузера и системной полосы в установленном приложении:
         тот же, что у шапки страницы. -->
    <meta name="theme-color" content="#0d1117" />
    <!-- Манифест нужен только для установки с сайта: со страницы на диске
         браузер его не достанет и просто не предложит установку — всё остальное
         работает как работало. Единственной ссылкой на соседний файл он быть
         перестал (ADR 006: рядом лежит ещё шрифт), но остался обязательным —
         пропади он, и установку перестанут предлагать молча, поэтому `build.js`
         проверяет его наличие отдельно. Все ссылки страницы по-прежнему
         относительные и ведут только в `dist/`. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="app-header">
        <span id="app-title" data-text="app.title"></span>
        <!-- Имя объекта в шапке не пишется: рядом стоит список объектов, и
             текстом оно повторяло бы выбранную строку списка. -->
        <div id="project-actions" class="mount"></div>
        <!-- Имени открытой схемы в шапке больше нет (таск 175, G271): «в
             мобильном интерфейсе в шапке убери надпись». Стояло оно только на
             узком экране и только там и мешало — на 360 точках ему доставалось
             полсотни, то есть «Схема до…». Названа открытая схема в листе
             «Схемы», который на телефоне открывается кнопкой снизу. -->
        <!-- Поиск по всему объекту и отмена: и то, и другое относится ко
             всему сразу, поэтому живёт в шапке, а не в разделе «Метки». -->
        <div id="header-search" class="mount"></div>
        <div id="header-history" class="mount"></div>
        <!-- Место счётчика предупреждений (таск 52): последний в левой группе,
             перед отступом, который разводит шапку на две стороны. Пустая точка
             монтирования ничего не занимает — правило `:empty` в styles.css. -->
        <div id="header-warnings" class="mount"></div>
        <!-- Переключатель связей (таск 79): сосед счётчика предупреждений
             справа — заказчик просил именно там. Связи ничего не правят, это
             разбор, поэтому кнопка есть и в режиме просмотра. -->
        <div id="header-links" class="mount"></div>
        <div id="header-actions" class="mount"></div>
        <!-- «Интерфейс проекта» окном (таск 175, G272): на узком экране раздел
             левой колонки в лист не приходит вовсе, и до размера меток,
             подписей, слоёв и масштаба с телефона было не добраться. Кнопка
             стоит рядом со значком принтера — обе открывают, а не правят, — и
             на большом экране её нет: там раздел на своём месте в колонке.
             Поля в окно собирает тот же код, что и в колонке. -->
        <div id="header-sizes" class="mount"></div>
        <!-- Переход к полной версии показывается только там, где экран сам
             выбрал просмотр: на десктопе кнопки нет. -->
        <button id="layout-toggle" class="ui-btn" type="button" hidden></button>
      </header>

      <!-- Разделы обеих колонок устроены одинаково: кликабельный заголовок
           сворачивает раздел, заголовок липнет к верху колонки, тело листается
           под ним. Растущий раздел в колонке один — список, которому нужно
           место: слева схемы, справа метки.

           Кнопок в заголовке две (таск 198). Галочка слева сворачивает раздел —
           всегда, где бы заголовок ни был нарисован. Имя сворачивает, пока
           заголовок стоит на своём месте, и **перелистывает к разделу**, когда
           он нарисован у кромки колонки: там он указатель, а не кнопка
           («нажал — прыгнуло туда»). Решает это `panels/rail.js` — разметка о
           прокрутке не знает ничего. -->
      <aside id="panel-left" class="panel">
        <!-- Верхний блок левой колонки свой в каждом режиме (таск 153): в Схеме
             «Метки», в Чертеже инструменты, в Объёме вид и этаж. Три раздела
             стоят рядом, а виден ровно один — тот, чей режим включён. Ниже
             «Помещения», «Схемы» и «Интерфейс проекта» общие на все три. -->
        <section class="panel__section panel__section--screen" data-section-id="drawTools">
          <h2 class="panel__head">
            <button class="panel__fold" type="button" data-section-fold="drawTools" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
            </button>
            <button class="panel__title" type="button" data-section="drawTools">
              <span class="panel__name" data-text="panels.drawTools"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-draw-tools" class="panel__body mount"></div>
        </section>
        <section class="panel__section panel__section--screen" data-section-id="volumeTools">
          <h2 class="panel__head">
            <button class="panel__fold" type="button" data-section-fold="volumeTools" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
            </button>
            <button class="panel__title" type="button" data-section="volumeTools">
              <span class="panel__name" data-text="panels.volumeTools"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-volume-tools" class="panel__body mount"></div>
        </section>
        <section class="panel__section panel__section--screen" data-section-id="marks">
          <h2 class="panel__head">
            <button class="panel__fold" type="button" data-section-fold="marks" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
            </button>
            <button class="panel__title" type="button" data-section="marks">
              <span class="panel__name" data-text="panels.marks"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-tools" class="panel__body mount"></div>
        </section>
        <section class="panel__section" data-section-id="rooms">
          <h2 class="panel__head">
            <button class="panel__fold" type="button" data-section-fold="rooms" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
            </button>
            <button class="panel__title" type="button" data-section="rooms">
              <span class="panel__name" data-text="panels.rooms"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-rooms" class="panel__body mount"></div>
        </section>
        <section class="panel__section panel__section--grow" data-section-id="schemes">
          <h2 class="panel__head">
            <button class="panel__fold" type="button" data-section-fold="schemes" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
            </button>
            <button class="panel__title" type="button" data-section="schemes">
              <span class="panel__name" data-text="panels.schemes"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-schemes" class="panel__body mount"></div>
        </section>
        <section class="panel__section" data-section-id="sizes">
          <h2 class="panel__head">
            <button class="panel__fold" type="button" data-section-fold="sizes" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
            </button>
            <button class="panel__title" type="button" data-section="sizes">
              <span class="panel__name" data-text="panels.sizes"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-sizes" class="panel__body mount"></div>
        </section>
      </aside>

      <main id="canvas-area">
        <div id="canvas-host" class="mount"></div>
        <!-- Чертёж и объём — содержимое основного экрана, а не окна (таск 153).
             Лежат там же, где план, и видна ровно одна поверхность: невидимые
             не прячутся из раскладки, а только гаснут (`visibility`), и поэтому
             держат свой размер — вернувшись, человек находит тот же кадр, а не
             пересчитанный с нуля. -->
        <div id="screen-drawing" class="screen mount"></div>
        <div id="screen-volume" class="screen mount"></div>
        <div id="canvas-overlay" class="mount"></div>
        <!-- Переключатель «Чертёж · Схема · Объём»: по центру того же ряда, где
             слева подсказка, а справа полный экран. Своя точка монтирования —
             наложение собирает canvas.js, а переключатель лежит в панелях,
             которые его импортируют. -->
        <div id="canvas-modes" class="mount"></div>
        <!-- Карточка выделенной метки в просмотре: снизу, поверх плана.
             Верхние углы заняты подсказкой и полным экраном, и драться с ними
             ей незачем. -->
        <div id="canvas-card" class="mount"></div>
        <!-- Имитация умного дома (таск 08): полоса запуска и часов сверху
             плана, журнал в нижнем углу. Видны только в «Схеме». -->
        <div id="sim-bar" class="mount"></div>
        <div id="sim-journal" class="mount"></div>
        <p id="canvas-empty" data-text="panels.canvasEmpty"></p>
      </main>

      <aside id="panel-right" class="panel">
        <!-- Правая колонка своя в каждом режиме (таск 153): в Чертеже — три
             списка элементов, в Схеме и в Объёме — тот же список меток
             (выделение у них общее).

             Три раздела, а не один с группами внутри (таск 187, G280): слова
             заказчика — «справа раздели в 3 отдельных списка раскрывающихся и
             не объединяй в группу Элементы чертежа». Сворачиваются и помнятся
             они как все остальные, счётчик в заголовке говорит, сколько там
             строк, а параметры выделенного раскрываются прямо в его строке —
             ровно как у метки в списке меток. -->
        <section class="panel__section panel__section--screen" data-section-id="drawWalls">
          <h2 class="panel__head">
            <button class="panel__fold" type="button" data-section-fold="drawWalls" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
            </button>
            <button class="panel__title" type="button" data-section="drawWalls">
              <span class="panel__name" data-text="panels.drawWalls"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-draw-walls" class="panel__body mount"></div>
        </section>
        <section class="panel__section panel__section--screen" data-section-id="drawOpenings">
          <h2 class="panel__head">
            <button class="panel__fold" type="button" data-section-fold="drawOpenings" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
            </button>
            <button class="panel__title" type="button" data-section="drawOpenings">
              <span class="panel__name" data-text="panels.drawOpenings"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-draw-openings" class="panel__body mount"></div>
        </section>
        <section class="panel__section panel__section--screen" data-section-id="drawObjects">
          <h2 class="panel__head">
            <button class="panel__fold" type="button" data-section-fold="drawObjects" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
            </button>
            <button class="panel__title" type="button" data-section="drawObjects">
              <span class="panel__name" data-text="panels.drawObjects"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-draw-objects" class="panel__body mount"></div>
        </section>
        <section class="panel__section panel__section--grow panel__section--screen" data-section-id="markList">
          <h2 class="panel__head">
            <button class="panel__fold" type="button" data-section-fold="markList" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
            </button>
            <button class="panel__title" type="button" data-section="markList">
              <span class="panel__name" data-text="panels.markList"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-marks" class="panel__body mount"></div>
        </section>
        <!-- Справочник типов — про метки: в Чертеже и в Объёме править типы
             незачем, и место в колонке дороже. -->
        <section class="panel__section panel__section--screen" data-section-id="properties">
          <h2 class="panel__head">
            <button class="panel__fold" type="button" data-section-fold="properties" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
            </button>
            <button class="panel__title" type="button" data-section="properties">
              <span class="panel__name" data-text="panels.properties"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-properties" class="panel__body mount"></div>
        </section>
      </aside>

      <!-- Ручки колонок: полоска у края самой колонки. Прячут её целиком —
           на планшете две колонки по 264 точки не оставляли плану ничего.
           Кнопки в шапке у этого нет нарочно: там и так тесно, а ручка стоит
           ровно там, где колонка кончается, и после сворачивания остаётся на
           том же месте у края экрана. -->
      <button class="panel-handle panel-handle--left" type="button" data-panel-toggle="left"></button>
      <button class="panel-handle panel-handle--right" type="button" data-panel-toggle="right"></button>

      <!-- Узкий экран: план во весь экран, колонки приходят листом снизу по
           одной. Кнопки крупные — с телефоном в одной руке иначе не попасть. -->
      <nav id="mobile-bar">
        <button class="mobile-bar__btn" type="button" data-sheet-button="none" data-text="mobile.plan"></button>
        <button class="mobile-bar__btn" type="button" data-sheet-button="schemes" data-text="mobile.schemes"></button>
        <button class="mobile-bar__btn" type="button" data-sheet-button="marks" data-text="mobile.marks"></button>
      </nav>

      <div id="dialog-host" class="mount"></div>
      <div id="notifications"></div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
