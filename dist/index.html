  const bytes = new Uint8Array(size);
  return { bytes, view: new DataView(bytes.buffer) };
}

/**
 * Собирает zip из списка {name, data, compress}. `data` — Uint8Array, ArrayBuffer,
 * строка или Blob. Размеры известны заранее, дескрипторов данных нет — архив
 * открывается штатным распаковщиком ОС.
 */
async function writeZip(files, options = {}) {
  const allowCompression = options.compress !== false && hasCompression();
  const stamp = dosStamp(options.date instanceof Date ? options.date : new Date());
  const onProgress = typeof options.onProgress === "function" ? options.onProgress : null;
  const list = [...files];

  const parts = [];
  const central = [];
  let offset = 0;

  for (let index = 0; index < list.length; index += 1) {
    const entry = list[index];
    const nameBytes = encodeText(entry.name);
    const source = await toBytes(entry.data);
    const wantCompression = entry.compress === false ? false : allowCompression;

    let method = METHOD_STORED;
    let payload = source;
    if (wantCompression && source.length > 0) {
      const packed = await deflateRaw(source);
      if (packed.length < source.length) {
        method = METHOD_DEFLATE;
        payload = packed;
      }
    }
    const crc = crc32(source);

    const local = headerBuffer(LOCAL_HEADER_SIZE + nameBytes.length);
    local.view.setUint32(0, LOCAL_SIGNATURE, true);
    local.view.setUint16(4, 20, true);
    local.view.setUint16(6, UTF8_FLAG, true);
    local.view.setUint16(8, method, true);
    local.view.setUint16(10, stamp.time, true);
    local.view.setUint16(12, stamp.date, true);
    local.view.setUint32(14, crc, true);
    local.view.setUint32(18, payload.length, true);
    local.view.setUint32(22, source.length, true);
    local.view.setUint16(26, nameBytes.length, true);
    local.view.setUint16(28, 0, true);
    local.bytes.set(nameBytes, LOCAL_HEADER_SIZE);

    parts.push(local.bytes, payload);
    central.push({ nameBytes, method, crc, packedSize: payload.length, size: source.length, offset });
    offset += local.bytes.length + payload.length;
    if (offset > MAX_ZIP_BYTES) throw fileError("archiveTooBig");
    if (onProgress) onProgress({ done: index + 1, total: list.length, name: entry.name });
  }

  const directoryOffset = offset;
  let directorySize = 0;
  for (const entry of central) {
    const header = headerBuffer(CENTRAL_HEADER_SIZE + entry.nameBytes.length);
    header.view.setUint32(0, CENTRAL_SIGNATURE, true);
    header.view.setUint16(4, 20, true);
    header.view.setUint16(6, 20, true);
    header.view.setUint16(8, UTF8_FLAG, true);
    header.view.setUint16(10, entry.method, true);
    header.view.setUint16(12, stamp.time, true);
    header.view.setUint16(14, stamp.date, true);
    header.view.setUint32(16, entry.crc, true);
    header.view.setUint32(20, entry.packedSize, true);
    header.view.setUint32(24, entry.size, true);
    header.view.setUint16(28, entry.nameBytes.length, true);
    header.view.setUint32(42, entry.offset, true);
    header.bytes.set(entry.nameBytes, CENTRAL_HEADER_SIZE);
    parts.push(header.bytes);
    directorySize += header.bytes.length;
  }

  const end = headerBuffer(END_HEADER_SIZE);
  end.view.setUint32(0, END_SIGNATURE, true);
  end.view.setUint16(8, central.length, true);
  end.view.setUint16(10, central.length, true);
  end.view.setUint32(12, directorySize, true);
  end.view.setUint32(16, directoryOffset, true);
  parts.push(end.bytes);
  if (directoryOffset + directorySize + END_HEADER_SIZE > MAX_ZIP_BYTES) throw fileError("archiveTooBig");

  return new Blob(parts, { type: "application/zip" });
}

// ——— чтение zip ——————————————————————————————————————————————————————

function findEndHeader(bytes, view) {
  const limit = Math.max(0, bytes.length - 0xffff - END_HEADER_SIZE);
  for (let at = bytes.length - END_HEADER_SIZE; at >= limit; at -= 1) {
    if (view.getUint32(at, true) === END_SIGNATURE) return at;
  }
  return -1;
}

/** Распаковывает zip в Map «имя файла → байты». Понимает stored и deflate. */
async function readZip(blob) {
  const bytes = await toBytes(blob);
  if (bytes.length < END_HEADER_SIZE) throw fileError("notAProject");
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

  const endAt = findEndHeader(bytes, view);
  if (endAt < 0) throw fileError("notAProject");

  const count = view.getUint16(endAt + 10, true);
  const directorySize = view.getUint32(endAt + 12, true);
  const directoryOffset = view.getUint32(endAt + 16, true);
  if (directoryOffset === ZIP64_MARK || directorySize === ZIP64_MARK || count === 0xffff) {
    throw fileError("zip64Unsupported");
  }
  if (directoryOffset + directorySize > bytes.length) throw fileError("archiveBroken");

  const entries = new Map();
  let at = directoryOffset;
  for (let index = 0; index < count; index += 1) {
    if (at + CENTRAL_HEADER_SIZE > bytes.length) throw fileError("archiveBroken");
    if (view.getUint32(at, true) !== CENTRAL_SIGNATURE) throw fileError("archiveBroken");
    const method = view.getUint16(at + 10, true);
    const crc = view.getUint32(at + 16, true);
    const packedSize = view.getUint32(at + 20, true);
    const size = view.getUint32(at + 24, true);
    const nameLength = view.getUint16(at + 28, true);
    const extraLength = view.getUint16(at + 30, true);
    const commentLength = view.getUint16(at + 32, true);
    const localOffset = view.getUint32(at + 42, true);
    const name = decodeText(bytes.subarray(at + CENTRAL_HEADER_SIZE, at + CENTRAL_HEADER_SIZE + nameLength));
    at += CENTRAL_HEADER_SIZE + nameLength + extraLength + commentLength;

    if (name.endsWith("/")) continue;
    if (packedSize === ZIP64_MARK || size === ZIP64_MARK || localOffset === ZIP64_MARK) {
      throw fileError("zip64Unsupported");
    }
    if (localOffset + LOCAL_HEADER_SIZE > bytes.length) throw fileError("archiveBroken");
    if (view.getUint32(localOffset, true) !== LOCAL_SIGNATURE) throw fileError("archiveBroken");

    const localNameLength = view.getUint16(localOffset + 26, true);
    const localExtraLength = view.getUint16(localOffset + 28, true);
    const dataAt = localOffset + LOCAL_HEADER_SIZE + localNameLength + localExtraLength;
    if (dataAt + packedSize > bytes.length) throw fileError("archiveBroken");

    const payload = bytes.subarray(dataAt, dataAt + packedSize);
    let content;
    if (method === METHOD_STORED) content = payload.slice();
    else if (method === METHOD_DEFLATE) content = await inflateRaw(payload);
    else throw fileError("archiveBroken");

    if (content.length !== size || crc32(content) !== crc) throw fileError("archiveBroken");
    entries.set(name, content);
  }
  return entries;
}

// ——— файл проекта ————————————————————————————————————————————————————

function extensionFor(type) {
  const found = IMAGE_TYPES.find((pair) => pair[0] === String(type || "").toLowerCase());
  return found ? found[1] : "bin";
}

function typeForExtension(extension) {
  const found = IMAGE_TYPES.find((pair) => pair[1] === String(extension || "").toLowerCase());
  return found ? found[0] : "";
}

// Идентификатор изображения попадает в имя файла: кодируем, чтобы «/» и прочее
// не разъехались по папкам, и раскодируем обратно — id восстанавливается точно.
function encodeImageId(id) {
  return encodeURIComponent(String(id));
}

function decodeImageId(name) {
  try {
    return decodeURIComponent(name);
  } catch {
    return name;
  }
}

// Поставщик один — store отдаёт Map. Всё остальное отвергается: тихо вернуть
// пустой список значило бы упаковать объект без единого плана и промолчать.
function imageEntries(images) {
  if (images == null) return [];
  if (!(images instanceof Map)) throw fileError("imagesNotMap");
  return [...images.entries()];
}

function looksLikeProject(value) {
  return (
    Boolean(value) &&
    typeof value === "object" &&
    !Array.isArray(value) &&
    typeof value.id === "string" &&
    Array.isArray(value.categories) &&
    Array.isArray(value.markTypes) &&
    Array.isArray(value.schemes) &&
    Array.isArray(value.marks)
  );
}

// Единственное место, где живут миграции формата: версия из будущего отвергается,
// прошлые версии доводятся до текущей здесь.
function migrateProject(loaded) {
  const version = Number(loaded.formatVersion);
  if (!Number.isFinite(version) || version < 1) throw fileError("foreignProject");
  if (version > FORMAT_VERSION) {
    throw fileError("futureVersion", { version, current: FORMAT_VERSION });
  }
  return {
    ...loaded,
    formatVersion: FORMAT_VERSION,
    rooms: Array.isArray(loaded.rooms) ? loaded.rooms : [],
    // Файл версии 1 контуров не знает: поле дописывается здесь, чтобы дальше
    // по коду `project.outlines` всегда был списком, а не «иногда undefined».
    outlines: Array.isArray(loaded.outlines) ? loaded.outlines : [],
    groups: Array.isArray(loaded.groups) ? loaded.groups : [],
    counters: loaded.counters && typeof loaded.counters === "object" ? loaded.counters : {},
  };
}

function readmeText(project, date) {
  return text("file.readme", {
    name: project.name || strings.project.untitled,
    date: date.toISOString(),
    schemes: project.schemes.length,
    marks: project.marks.length,
    version: FORMAT_VERSION,
  }) + "\n";
}

/** Имя для выгрузки: «<объект>-<дата>.zip». */
function projectFileName(project, now) {
  const date = now instanceof Date ? now : new Date();
  const day = date.toISOString().slice(0, 10);
  const raw = String((project && project.name) || strings.project.untitled);
  const safe = raw
    .replace(/[\\/:*?"<>|\x00-\x1f]+/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .slice(0, 60);
  return (safe || strings.project.untitled) + "-" + day + ".zip";
}

/**
 * Упаковывает объект и планы в один zip.
 * `images` — Map «imageId → Blob» (или ничего, если планов нет); картинки кладутся
 * как есть, без пережатия. `options.onProgress({done, total, name})`.
 */
async function packProject(project, images, options = {}) {
  if (!looksLikeProject(project)) throw fileError("foreignProject");
  const date = options.date instanceof Date ? options.date : new Date();
  const forFile = { ...project, formatVersion: FORMAT_VERSION };

  const files = [{ name: PROJECT_ENTRY, data: JSON.stringify(forFile, null, 2) }];
  for (const [id, blob] of imageEntries(images)) {
    if (!id || !blob) continue;
    const extension = extensionFor(blob.type);
    files.push({
      name: SCHEMES_DIR + encodeImageId(id) + "." + extension,
      data: blob,
      compress: false,
    });
  }
  files.push({ name: README_ENTRY, data: readmeText(forFile, date) });

  return writeZip(files, {
    date,
    compress: options.compress,
    onProgress: options.onProgress,
  });
}

// Свой архив кладёт project.json в корень; перепакованный вместе с папкой —
// на уровень глубже. Из нескольких кандидатов берётся самый неглубокий:
// сравниваются префиксы с префиксами, а не имя файла с префиксом.
function projectPrefix(entries) {
  let prefix = null;
  for (const name of entries.keys()) {
    if (name === PROJECT_ENTRY) return "";
    if (name.endsWith("/" + PROJECT_ENTRY)) {
      const candidate = name.slice(0, -PROJECT_ENTRY.length);
      if (prefix === null || candidate.length < prefix.length) prefix = candidate;
    }
  }
  return prefix;
}

/**
 * Читает файл проекта: `{project, images}`, где images — Map «imageId → Blob».
 * Чужой или битый файл отвергается ошибкой с `.code` из strings.errors,
 * текущий объект при этом не трогается — вызывающий получает исключение
 * до того, как что-то заменит.
 */
async function unpackProject(blob, options = {}) {
  if (!blob) throw fileError("notAProject");
  const entries = await readZip(blob);

  const prefix = projectPrefix(entries);
  if (prefix === null) throw fileError("noProjectJson");

  let loaded;
  try {
    loaded = JSON.parse(decodeText(entries.get(prefix + PROJECT_ENTRY)));
  } catch {
    throw fileError("brokenProjectJson");
  }
  if (!looksLikeProject(loaded)) throw fileError("foreignProject");
  const project = migrateProject(loaded);

  const onProgress = typeof options.onProgress === "function" ? options.onProgress : null;
  const imageNames = [...entries.keys()].filter(
    (name) => name.startsWith(prefix + SCHEMES_DIR) && name.length > (prefix + SCHEMES_DIR).length,
  );
  const images = new Map();
  for (let index = 0; index < imageNames.length; index += 1) {
    const name = imageNames[index];
    const tail = name.slice((prefix + SCHEMES_DIR).length);
    const dot = tail.lastIndexOf(".");
    const id = decodeImageId(dot > 0 ? tail.slice(0, dot) : tail);
    const type = typeForExtension(dot > 0 ? tail.slice(dot + 1) : "");
    images.set(id, new Blob([entries.get(name)], type ? { type } : undefined));
    if (onProgress) onProgress({ done: index + 1, total: imageNames.length, name });
  }

  return { project, images };
}

// src/autosave.js
// Файл проекта на диске: приёмка загруженного архива, автосохранение в папку
// и отметка «когда в последний раз выгружали».
//
// Почему отдельно от панели: здесь нет ни одной строки DOM — значит, приёмку
// загрузки (самое опасное место: чужие идентификаторы) можно проверить тестом,
// а панель остаётся тонкой. Zip читает и пишет только `projectFile.js`.




// Ключи настроек: ручка папки (структурно клонируется в IndexedDB как есть)
// и отметки последней выгрузки по объектам.
const AUTOSAVE_FOLDER_KEY = "autosaveFolder";
const AUTOSAVE_EXPORT_KEY = "lastFileExport";
// Задержка больше, чем у сохранения в браузер (400 мс): запись на диск дороже,
// и пачка правок должна уложиться в одну запись.
const AUTOSAVE_DELAY_MS = 1500;

let autosaveHandle = null;
let autosavePermission = "none"; // none | prompt | granted | denied
let autosaveExports = null;
let autosaveTimer = null;
let autosaveRunning = false;
let autosavePending = null;
let autosaveLastError = null;
const autosaveListeners = new Set();

// ——— приёмка загруженного файла ———————————————————————————————————————

// Архив приходит с чужими идентификаторами: и объекта, и картинок. Оставить их
// как есть нельзя — вторая загрузка того же файла перезаписала бы объект в базе
// и перемешала картинки с чужими. Поэтому всё переприсваивается здесь, разом,
// вместе со ссылками `scheme.imageId`; ссылка на картинку, которой в архиве не
// оказалось, обнуляется — схема без плана честнее схемы со ссылкой в никуда.
function adoptLoadedProject(loaded, options = {}) {
  const source = loaded && loaded.project ? loaded.project : null;
  if (!source) throw new Error(strings.errors.foreignProject);
  const mode = options.mode === "replace" ? "replace" : "new";
  const newId = typeof options.newId === "function" ? options.newId : () => crypto.randomUUID();

  const sourceImages = loaded.images instanceof Map ? loaded.images : new Map(loaded.images || []);
  // Идентификаторы картинок приходят снаружи, когда их уже выдало хранилище
  // браузера (`store.putImage`): переприсваивание остаётся одной операцией,
  // и панели не приходится перекладывать ссылки второй раз.
  const given = options.imageIds instanceof Map ? options.imageIds : null;
  const remap = new Map();
  const images = new Map();
  for (const [oldId, blob] of sourceImages) {
    if (!blob) continue;
    const id = (given && given.get(oldId)) || newId();
    remap.set(oldId, id);
    images.set(id, blob);
  }

  const schemes = (source.schemes || []).map((scheme) => ({
    ...scheme,
    imageId: scheme.imageId && remap.has(scheme.imageId) ? remap.get(scheme.imageId) : null,
  }));

  const base = {
    ...source,
    id: mode === "replace" && options.currentId ? options.currentId : newId(),
    schemes,
  };
  // Отметку времени ставит модель: свой мутатор объекта в сборке не заводится.
  return { project: updateProject(base).project, images, mode };
}

// Картинки текущего объекта для упаковки: `packProject` принимает только Map.
async function autosaveCollectImages(project) {
  const images = new Map();
  for (const scheme of (project && project.schemes) || []) {
    if (!scheme.imageId || images.has(scheme.imageId)) continue;
    const blob = await getImage(scheme.imageId);
    if (blob) images.set(scheme.imageId, blob);
  }
  return images;
}

// Имя снимка в папке автосохранения. Файл в папке живёт рядом с чужими и
// переписывается сам, поэтому одного имени объекта мало: два объекта с
// одинаковым именем (а такие заводятся сами — например, файл, загруженный
// дважды) писали бы в один файл и затирали друг друга. Имя строит всё тот же
// `projectFileName`, идентификатор дописывается к нему.
function autosaveSnapshotName(project, date) {
  const base = projectFileName(project, date);
  const tag = String((project && project.id) || "").replace(/[^0-9a-z]/gi, "").slice(0, 8).toLowerCase();
  return tag ? base.replace(/\.zip$/, "-" + tag + ".zip") : base;
}

// Один путь упаковки на всю панель: и «Сохранить в файл», и запись в папку.
async function autosavePack(project, options = {}) {
  const images = await autosaveCollectImages(project);
  const date = options.date instanceof Date ? options.date : new Date();
  const blob = await packProject(project, images, { date, onProgress: options.onProgress });
  return { blob, name: projectFileName(project, date), images };
}

// ——— папка ————————————————————————————————————————————————————————————

function autosaveSupported() {
  return typeof window !== "undefined" && typeof window.showDirectoryPicker === "function";
}
function autosaveReady() {
  return Boolean(autosaveHandle) && autosavePermission === "granted";
}
function autosaveStatus() {
  return {
    supported: autosaveSupported(),
    folder: autosaveHandle ? autosaveHandle.name : null,
    permission: autosavePermission,
    busy: autosaveRunning,
    error: autosaveLastError,
  };
}
function onAutosaveChange(listener) {
  autosaveListeners.add(listener);
  return () => autosaveListeners.delete(listener);
}

function autosaveAnnounce() {
  const status = autosaveStatus();
  for (const listener of [...autosaveListeners]) {
    try {
      listener(status);
    } catch (ignored) {
      /* подписчик не должен ломать запись */
    }
  }
}

async function autosaveQueryPermission(handle) {
  if (!handle) return "none";
  if (typeof handle.queryPermission !== "function") return "granted";
  try {
    return await handle.queryPermission({ mode: "readwrite" });
  } catch (error) {
    return "denied";
  }
}

// При старте: ручка из прошлого сеанса ещё жива, но разрешение могло
// «остыть» — тогда панель покажет кнопку «Разрешить», и второй раз выбирать
// папку не придётся.
async function autosaveRestore() {
  autosaveExports = (await getSetting(AUTOSAVE_EXPORT_KEY)) || {};
  if (!autosaveSupported()) return autosaveStatus();
  let handle = null;
  try {
    handle = await getSetting(AUTOSAVE_FOLDER_KEY);
  } catch (error) {
    handle = null;
  }
  if (!handle || typeof handle.getFileHandle !== "function") {
    autosaveHandle = null;
    autosavePermission = "none";
    return autosaveStatus();
  }
  autosaveHandle = handle;
  autosavePermission = await autosaveQueryPermission(handle);
  autosaveAnnounce();
  return autosaveStatus();
}

// Только из обработчика клика: браузер спрашивает папку лишь по жесту.
async function autosavePickFolder() {
  if (!autosaveSupported()) return autosaveStatus();
  const handle = await window.showDirectoryPicker({ id: "scheme-markup", mode: "readwrite" });
  autosaveHandle = handle;
  autosavePermission = await autosaveQueryPermission(handle);
  if (autosavePermission !== "granted") await autosaveGrant();
  autosaveLastError = null;
  await setSetting(AUTOSAVE_FOLDER_KEY, handle);
  autosaveAnnounce();
  return autosaveStatus();
}
async function autosaveGrant() {
  if (!autosaveHandle || typeof autosaveHandle.requestPermission !== "function") return autosaveStatus();
  try {
    autosavePermission = await autosaveHandle.requestPermission({ mode: "readwrite" });
  } catch (error) {
    autosavePermission = "denied";
  }
  autosaveAnnounce();
  return autosaveStatus();
}
async function autosaveForget() {
  autosaveHandle = null;
  autosavePermission = "none";
  autosaveLastError = null;
  if (autosaveTimer) {
    clearTimeout(autosaveTimer);
    autosaveTimer = null;
  }
  autosavePending = null;
  await setSetting(AUTOSAVE_FOLDER_KEY, null);
  autosaveAnnounce();
  return autosaveStatus();
}

// ——— запись ———————————————————————————————————————————————————————————
async function autosaveWrite(project, options = {}) {
  if (!project) return { ok: false, reason: "noProject" };
  if (!autosaveReady()) return { ok: false, reason: "noFolder" };
  autosaveRunning = true;
  autosaveAnnounce();
  try {
    const date = options.date instanceof Date ? options.date : new Date();
    const packedFile = await autosavePack(project, { ...options, date });
    const name = autosaveSnapshotName(project, date);
    const fileHandle = await autosaveHandle.getFileHandle(name, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(packedFile.blob);
    await writable.close();
    autosaveLastError = null;
    const at = await autosaveNoteExport(project.id, options.at);
    // Объект возвращается вместе с результатом: пока шла запись, пользователь
    // мог успеть поправить ещё раз — панели надо знать, что именно легло в файл.
    return { ok: true, name, at, project };
  } catch (error) {
    // Разрешение могли отозвать между правками — тогда панель снова покажет
    // кнопку «Разрешить», а не будет молча терять записи.
    if (error && error.name === "NotAllowedError") autosavePermission = "prompt";
    autosaveLastError = error;
    return { ok: false, error };
  } finally {
    autosaveRunning = false;
    autosaveAnnounce();
  }
}

// Правки идут пачками: пишем не чаще, чем раз в AUTOSAVE_DELAY_MS, и никогда
// двумя записями сразу — правка, пришедшая во время записи, ждёт её конца.
function autosaveSchedule(project, options = {}) {
  if (!autosaveReady() || !project) return false;
  autosavePending = project;
  if (autosaveTimer) clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => {
    autosaveTimer = null;
    autosaveFlush(options);
  }, typeof options.delay === "number" ? options.delay : AUTOSAVE_DELAY_MS);
  return true;
}

// Есть ли незаписанная правка: отложенная, ожидающая очереди или та, что
// пишется прямо сейчас. Вкладка спрашивает об этом перед закрытием.
function autosavePendingWrite() {
  return Boolean(autosaveTimer || autosavePending || autosaveRunning);
}
async function autosaveFlush(options = {}) {
  if (autosaveTimer) {
    clearTimeout(autosaveTimer);
    autosaveTimer = null;
  }
  if (autosaveRunning || !autosavePending) return { ok: false, reason: "idle" };
  const project = autosavePending;
  autosavePending = null;
  const result = await autosaveWrite(project, options);
  if (typeof options.onDone === "function") options.onDone(result);
  // Пока писали, могла прийти новая правка — её запись ставим в очередь.
  if (autosavePending) autosaveSchedule(autosavePending, options);
  return result;
}

// ——— «выгружено N назад» ———————————————————————————————————————————————
async function autosaveNoteExport(projectId, at) {
  const stamp = at || new Date().toISOString();
  if (!projectId) return stamp;
  if (!autosaveExports) autosaveExports = (await getSetting(AUTOSAVE_EXPORT_KEY)) || {};
  autosaveExports = { ...autosaveExports, [projectId]: stamp };
  await setSetting(AUTOSAVE_EXPORT_KEY, autosaveExports);
  autosaveAnnounce();
  return stamp;
}
function autosaveLastExport(projectId) {
  if (!projectId || !autosaveExports) return null;
  return autosaveExports[projectId] || null;
}

// Русские числительные: «1 минуту», «2 минуты», «5 минут». Одиннадцать —
// исключение из правила последней цифры, поэтому второй десяток проверяется
// отдельно.
function autosavePlural(count, forms) {
  const tail = Math.abs(count) % 100;
  const last = tail % 10;
  if (tail > 10 && tail < 20) return forms[2];
  if (last === 1) return forms[0];
  if (last > 1 && last < 5) return forms[1];
  return forms[2];
}

// «в файл выгружено: 3 дня назад». Момент сравнения передаётся явно — так
// строку можно проверить тестом, не подменяя часы.
function autosaveAgoText(at, now) {
  const words = strings.autosave.ago;
  const stamp = at ? Date.parse(at) : Number.NaN;
  if (Number.isNaN(stamp)) return words.never;
  const moment = now instanceof Date ? now.getTime() : Date.now();
  const minutes = Math.floor(Math.max(0, moment - stamp) / 60000);
  if (minutes < 1) return words.justNow;
  if (minutes < 60) return text("autosave.ago.pattern", { count: minutes, word: autosavePlural(minutes, words.minutes) });
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return text("autosave.ago.pattern", { count: hours, word: autosavePlural(hours, words.hours) });
  const days = Math.floor(hours / 24);
  return text("autosave.ago.pattern", { count: days, word: autosavePlural(days, words.days) });
}

// src/app.js
// Каркас сеанса: состояние, реестр панелей, уведомления.
// Панели других тасков монтируются по идентификатору контейнера из index.html
// и не правят ни этот файл, ни разметку.

// Контейнеры-точки монтирования (идентификаторы из src/index.html).
const PANEL_IDS = {
  tools: "panel-tools",
  schemes: "panel-schemes",
  marks: "panel-marks",
  properties: "panel-properties",
  canvas: "canvas-host",
  overlay: "canvas-overlay",
  headerActions: "header-actions",
  projectActions: "project-actions",
  dialogs: "dialog-host",
};

const appState = {
  project: null,
  schemeId: null,
  selectedMarkIds: [],
  activeTypeId: null,
  mode: "select",
  filter: { categoryIds: null, typeIds: null, roomId: null, query: "" },
  view: { zoom: 1, offsetX: 0, offsetY: 0 },
  dirty: false,
};

const appSubscribers = new Set();
const appPanels = new Map();
const appMounted = new Map();
let appStarted = false;

// Снимок: вложенные filter/view/selectedMarkIds копируются, чтобы правка
// на месте в панели не меняла состояние сеанса мимо setState.
function getState() {
  return {
    ...appState,
    selectedMarkIds: [...appState.selectedMarkIds],
    filter: { ...appState.filter },
    view: { ...appState.view },
  };
}
function setState(patch) {
  if (!patch) return getState();
  const changed = {};
  for (const [key, value] of Object.entries(patch)) {
    if (appState[key] !== value) {
      appState[key] = value;
      changed[key] = value;
    }
  }
  if (Object.keys(changed).length === 0) return getState();
  const snapshot = getState();
  for (const subscriber of [...appSubscribers]) {
    try {
      subscriber(snapshot, changed);
    } catch (error) {
      reportAppError(error);
    }
  }
  syncCanvasClass();
  syncProjectName();
  return snapshot;
}
function subscribe(listener) {
  appSubscribers.add(listener);
  return () => appSubscribers.delete(listener);
}

// Регистрация панели: если каркас уже поднят — монтируем сразу.
function registerPanel(id, mountFn) {
  if (typeof mountFn !== "function") return;
  appPanels.set(id, mountFn);
  if (appStarted) mountPanel(id);
}
function panelApi() {
  return { getState, setState, subscribe, notify, strings, text };
}

function mountPanel(id) {
  const mountFn = appPanels.get(id);
  const host = document.getElementById(id);
  if (!mountFn || !host || appMounted.get(id) === mountFn) return;
  try {
    mountFn(host, panelApi());
    appMounted.set(id, mountFn);
  } catch (error) {
    reportAppError(error);
  }
}
function notify(message, kind = "info") {
  const host = typeof document === "undefined" ? null : document.getElementById("notifications");
  if (!host) return null;
  const toast = document.createElement("div");
  toast.className = "toast toast--" + kind;
  toast.textContent = String(message);
  toast.title = strings.notify.close;
  toast.addEventListener("click", () => toast.remove());
  host.append(toast);
  setTimeout(() => toast.remove(), kind === "error" ? 12000 : 6000);
  return toast;
}

function reportAppError(error) {
  notify(error && error.message ? error.message : String(error), "error");
}

// Все видимые строки приходят из словаря: разметка держит только ключи.
function applyStrings(root) {
  const scope = root || document;
  for (const node of scope.querySelectorAll("[data-text]")) {
    node.textContent = text(node.dataset.text);
  }
  for (const node of scope.querySelectorAll("[data-title]")) {
    node.title = text(node.dataset.title);
  }
}

function syncProjectName() {
  const node = document.getElementById("project-name");
  if (!node) return;
  node.textContent = appState.project ? appState.project.name : strings.header.noProject;
}

function syncCanvasClass() {
  const app = document.getElementById("app");
  if (!app) return;
  app.classList.toggle("has-scheme", Boolean(appState.schemeId));
}
function startApp() {
  if (appStarted) return;
  appStarted = true;
  applyStrings(document);
  syncProjectName();
  syncCanvasClass();
  for (const id of appPanels.keys()) mountPanel(id);
}

// Старт откладывается за границу текущего скрипта: в собранном файле панели
// и модели определяются ниже по бандлу, и каркас не должен опережать их.
if (typeof document !== "undefined") {
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startApp, { once: true });
  } else {
    setTimeout(startApp, 0);
  }
}

// src/render.js
// Рисование схемы и попадание по метке.
//
// Две системы координат. В объекте метки лежат долями плана (0…1) — так поворот
// и обрезка картинки не двигают разметку. На экране (и в экспорте) точка плана
// превращается в пиксели одной формулой planToScreen: смещение плюс доля,
// умноженная на размер плана и на масштаб.
//
// `view` для рисования — это `{zoom, offsetX, offsetY, markSize, labelSize}`:
// первые три приходят из состояния сеанса (`state.view`), последние два — из
// объекта (`project.view`), их двигает ползунок в панели инструментов. Размер
// метки задан в пикселях плана, поэтому метка живёт на плане как наклейка:
// приближение увеличивает и её, а экспорт в двойном разрешении даёт тот же вид.
const SHAPES = SHAPE_NAMES;

// Доля радиуса, на которую внутренние вершины звезды ближе к центру.
const STAR_INNER = 0.45;
// Запас в пикселях вокруг метки, чтобы попадать по ней не идеально точно.
const HIT_SLACK_PX = 4;
// Ширина буквы относительно кегля — оценка, одинаковая в тесте и на холсте.
// Доля кегля на знак в оценке ширины подписи. Мерить по-настоящему тут нечем:
// `labelBox` зовут и попадание по клику, и тесты, а холста у них нет. Значит,
// оценка берётся с запасом: 0,62 — про строчную латиницу, а коды заказчик
// пишет прописной кириллицей, которая шире примерно на шестую часть. Занижение
// стоит дважды: подпись у края плана не уезжает влево, когда пора, и клик по
// ней промахивается мимо прямоугольника.
const LABEL_CHAR_RATIO = 0.75;
// Насколько далеко от метки стоит подпись, если её не оттаскивали.
const LABEL_GAP = 1.5;
// Ручки «+» стоят от центра метки на столько её радиусов.
const HANDLE_GAP = 2.4;
const HANDLE_RADIUS = 9;

const RENDER_VIEW_DEFAULTS = { zoom: 1, offsetX: 0, offsetY: 0, markSize: 10, labelSize: 12 };

// Рамка легенды в высотах строки: отступ до текста, минимальная и предельная
// ширина. Предел — чтобы длинный код не растянул легенду на полплана.
const LEGEND_TEXT_EM = 2.2;
const LEGEND_MIN_EM = 16;
const LEGEND_MAX_EM = 34;

// Строка легенды по ширине рамки: остаток обрезается многоточием. Мерить
// нужно тем же `ctx`, которым будем рисовать, — шрифт уже выставлен.
function legendClip(ctx, value, limit) {
  if (ctx.measureText(value).width <= limit) return value;
  let cut = value;
  while (cut.length > 1 && ctx.measureText(cut + "…").width > limit) cut = cut.slice(0, -1);
  return cut + "…";
}

// Контур помещения: тонкая линия цветом комнаты и полупрозрачная заливка.
// На бумаге («pale») и линия, и заливка бледнее — контур там подсказка,
// а не главное на листе: главное — метки.
const OUTLINE_STYLE = {
  normal: { line: 1.6, fill: 0.1, label: 0.95 },
  pale: { line: 1, fill: 0.05, label: 0.6 },
};
// Запас в пикселях, с которым попадают по стенке контура.
const OUTLINE_HIT_PX = 6;
// Радиус ручки вершины и ручки «+» на середине стенки.
const OUTLINE_HANDLE_PX = 6;
const OUTLINE_COLOR_FALLBACK = "#57606a";

// Углы вершин, градусы от «вверх». Все фигуры вписаны в окружность радиуса size.
const SHAPE_ANGLES = {
  square: [-135, -45, 45, 135],
  triangle: [-90, 30, 150],
  "triangle-down": [90, 210, 330],
  diamond: [-90, 0, 90, 180],
  hexagon: [-90, -30, 30, 90, 150, 210],
};

// Родня фигур: контур берётся у базовой, а отличает их засечка внутри.
// Так «розетка» и «розетка двойная» различаются в 14 пикселях, а на плане
// по-прежнему рисуются одним `drawShape`.
const SHAPE_BASE = {
  "circle-cross": "circle",
  "circle-dot": "circle",
  "circle-fill": "circle",
  "circle-half": "circle",
  "square-cross": "square",
  "square-fill": "square",
  "diamond-fill": "diamond",
};

// Засечка внутри: перекрестье, точка, сплошная заливка, залитая нижняя половина.
const SHAPE_DECOR = {
  "circle-cross": "cross",
  "square-cross": "cross",
  "circle-dot": "dot",
  "circle-fill": "fill",
  "square-fill": "fill",
  "diamond-fill": "fill",
  "circle-half": "half",
};

// Доля радиуса, на которую отступает от края «талия» плюса.
const PLUS_WAIST = 0.36;
// Точка внутри знака: меньше — сливается с пустым кругом на распечатке.
const DOT_RADIUS = 0.42;

function renderView(view) {
  const merged = { ...RENDER_VIEW_DEFAULTS, ...(view || {}) };
  if (!(merged.zoom > 0)) merged.zoom = 1;
  return merged;
}

function polarPoint(x, y, radius, degrees) {
  const angle = (degrees * Math.PI) / 180;
  return { x: x + radius * Math.cos(angle), y: y + radius * Math.sin(angle) };
}

// Геометрия фигуры в экранных пикселях: круг или список вершин плюс засечка,
// которую рисуют поверх контура.
function shapeGeometry(shape, x, y, size) {
  const radius = Math.max(1, size);
  const base = SHAPE_BASE[shape] || shape;
  const decor = SHAPE_DECOR[shape] || null;
  const shell = {
    cx: x,
    cy: y,
    r: radius,
    line: Math.max(1, radius * 0.22),
    cross: decor === "cross",
    decor: decor === "cross" ? null : decor,
  };

  if (base === "star") {
    const points = [];
    for (let index = 0; index < 10; index += 1) {
      const long = index % 2 === 0;
      points.push(polarPoint(x, y, long ? radius : radius * STAR_INNER, -90 + index * 36));
    }
    return { kind: "polygon", points, ...shell };
  }
  if (base === "plus") {
    // Двенадцать вершин: четыре конца по осям и «талия» между ними.
    const arm = radius;
    const waist = radius * PLUS_WAIST;
    const points = [
      { x: x - waist, y: y - arm },
      { x: x + waist, y: y - arm },
      { x: x + waist, y: y - waist },
      { x: x + arm, y: y - waist },
      { x: x + arm, y: y + waist },
      { x: x + waist, y: y + waist },
      { x: x + waist, y: y + arm },
      { x: x - waist, y: y + arm },
      { x: x - waist, y: y + waist },
      { x: x - arm, y: y + waist },
      { x: x - arm, y: y - waist },
      { x: x - waist, y: y - waist },
    ];
    return { kind: "polygon", points, ...shell };
  }
  const angles = SHAPE_ANGLES[base];
  if (angles) {
    return { kind: "polygon", points: angles.map((degrees) => polarPoint(x, y, radius, degrees)), ...shell };
  }
  return { kind: "circle", points: [], ...shell };
}

// Начинка знака: что закрашивается внутри контура и чем. Единственное описание
// закраски в сборке — по нему рисует `drawShape`, по нему же тест снимает
// отпечаток, так что разойтись правилам негде.
// `role` — смысл («сплошная», «половина», «точка», «крест»), `mask` — область
// краски: вся внутренность, прямоугольник, круг или линии заданной толщины.
function shapeInternals(geometry) {
  const parts = [];
  if (geometry.decor === "fill") {
    parts.push({ role: "fill", mask: "interior" });
  } else if (geometry.decor === "half") {
    // Залита нижняя половина: прямоугольник от центра вниз, обрезанный контуром.
    parts.push({
      role: "half",
      mask: "rect",
      x: geometry.cx - geometry.r,
      y: geometry.cy,
      width: geometry.r * 2,
      height: geometry.r,
    });
  } else if (geometry.decor === "dot") {
    parts.push({
      role: "dot",
      mask: "disc",
      cx: geometry.cx,
      cy: geometry.cy,
      r: Math.max(1, geometry.r * DOT_RADIUS),
    });
  }
  if (geometry.cross) {
    const arm = geometry.r * Math.SQRT1_2;
    parts.push({
      role: "cross",
      mask: "lines",
      width: geometry.line,
      segments: [
        [
          { x: geometry.cx - arm, y: geometry.cy - arm },
          { x: geometry.cx + arm, y: geometry.cy + arm },
        ],
        [
          { x: geometry.cx + arm, y: geometry.cy - arm },
          { x: geometry.cx - arm, y: geometry.cy + arm },
        ],
      ],
    });
  }
  return parts;
}

// Одна фигура — одним кодом и на экране, и в экспорте.
function drawShape(ctx, shape, x, y, size, color) {
  const geometry = shapeGeometry(shape, x, y, size);
  ctx.save();
  ctx.lineJoin = "round";
  ctx.lineWidth = geometry.line;
  ctx.fillStyle = "#ffffff";
  ctx.strokeStyle = color;
  ctx.beginPath();
  if (geometry.kind === "circle") {
    ctx.arc(geometry.cx, geometry.cy, geometry.r, 0, Math.PI * 2);
  } else {
    geometry.points.forEach((point, index) => {
      if (index === 0) ctx.moveTo(point.x, point.y);
      else ctx.lineTo(point.x, point.y);
    });
    ctx.closePath();
  }
  ctx.fill();
  ctx.stroke();
  // Заливка и засечка идут поверх белой подложки, контур — поверх них: так
  // фигура читается и на тёмной линии плана, и на чёрно-белой распечатке.
  for (const part of shapeInternals(geometry)) {
    if (part.mask === "interior") {
      ctx.fillStyle = color;
      ctx.fill();
      ctx.stroke();
    } else if (part.mask === "rect") {
      ctx.save();
      ctx.clip();
      ctx.fillStyle = color;
      ctx.fillRect(part.x, part.y, part.width, part.height);
      ctx.restore();
      ctx.stroke();
    } else if (part.mask === "disc") {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(part.cx, part.cy, part.r, 0, Math.PI * 2);
      ctx.fill();
    } else if (part.mask === "lines") {
      ctx.lineWidth = part.width;
      ctx.beginPath();
      for (const [from, to] of part.segments) {
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
      }
      ctx.stroke();
    }
  }
  ctx.restore();
}

// Значок фигуры для списков и сеток: тот же `drawShape` на маленьком холсте.
// Одна функция на весь интерфейс — в справочнике, в списке меток и в сетке
// выбора видно ровно то, что попадёт на план и на распечатку.
function shapeIcon(shape, color, size = 22) {
  const canvas = document.createElement("canvas");
  canvas.className = "shape-icon";
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext ? canvas.getContext("2d") : null;
  if (ctx) drawShape(ctx, shape, size / 2, size / 2, size * 0.34, color);
  return canvas;
}

// ——— координаты —————————————————————————————————————————————————————
function planToScreen(point, scheme, view) {
  const state = renderView(view);
  return {
    x: state.offsetX + point.x * schemeWidth(scheme) * state.zoom,
    y: state.offsetY + point.y * schemeHeight(scheme) * state.zoom,
  };
}
function screenToPlan(point, scheme, view) {
  const state = renderView(view);
  return {
    x: (point.x - state.offsetX) / (schemeWidth(scheme) * state.zoom),
    y: (point.y - state.offsetY) / (schemeHeight(scheme) * state.zoom),
  };
}

function schemeWidth(scheme) {
  return scheme && scheme.width > 0 ? scheme.width : 1000;
}

function schemeHeight(scheme) {
  return scheme && scheme.height > 0 ? scheme.height : 1000;
}

// Радиус метки на экране: размер задан в пикселях плана и растёт с масштабом.
function markRadius(view) {
  const state = renderView(view);
  return Math.max(2, state.markSize * state.zoom);
}

function labelFontSize(view) {
  const state = renderView(view);
  return Math.max(6, state.labelSize * state.zoom);
}

// Вписать план в прямоугольник холста.
function fitView(scheme, viewport) {
  const width = schemeWidth(scheme);
  const height = schemeHeight(scheme);
  const boxWidth = Math.max(1, viewport.width);
  const boxHeight = Math.max(1, viewport.height);
  const zoom = Math.min(boxWidth / width, boxHeight / height) * 0.96;
  return {
    zoom,
    offsetX: (boxWidth - width * zoom) / 2,
    offsetY: (boxHeight - height * zoom) / 2,
  };
}

// ——— видимость ———————————————————————————————————————————————————————

// Фильтр панели меток: скрытая метка не рисуется и по ней не кликается.
function markVisible(project, mark, filter) {
  if (!filter) return true;
  if (Array.isArray(filter.typeIds) && !filter.typeIds.includes(mark.typeId)) return false;
  if (Array.isArray(filter.categoryIds)) {
    const type = findType(project, mark.typeId);
    if (!type || !filter.categoryIds.includes(type.categoryId)) return false;
  }
  if (filter.roomId && mark.roomId !== filter.roomId) return false;
  const query = (filter.query || "").trim().toLowerCase();
  if (!query) return true;
  const haystack = [labelOf(project, mark.id), mark.location, mark.original]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();
  return haystack.includes(query);
}
function visibleMarks(project, scheme, filter) {
  if (!project || !scheme) return [];
  return project.marks.filter((mark) => mark.schemeId === scheme.id && markVisible(project, mark, filter));
}

// ——— подписи —————————————————————————————————————————————————————————

// Точка привязки подписи: для одиночной метки — её точка, для группы — середина
// между входящими метками. Смещение подписи хранится в пикселях плана, поэтому
// поворот плана уносит её вместе с меткой.
function labelOrigin(project, target) {
  if (target.markIds) {
    const points = labelMemberIds(target)
      .map((id) => project.marks.find((mark) => mark.id === id))
      .filter(Boolean)
      .map((mark) => mark.points[0]);
    if (points.length === 0) return { x: 0, y: 0 };
    const sum = points.reduce((acc, point) => ({ x: acc.x + point.x, y: acc.y + point.y }), { x: 0, y: 0 });
    return { x: sum.x / points.length, y: sum.y / points.length };
  }
  return target.points[0];
}

// Метки блока, по которым собирается подпись: под фильтром — только видимые
// (`shownIds` кладёт labelTargets), иначе весь блок. Смещение подписи это не
// трогает: его держит первая метка блока, видимая она или нет.
function labelMemberIds(target) {
  return target.shownIds || target.markIds;
}

// Ведущая метка подписи: у блока — та, с которой подпись начинается,
// у одиночной метки — она сама. По ней берётся цвет подписи: подпись
// «В1, Р1» красится зелёным выключателя, а не красным розетки.
function labelLead(project, target) {
  if (!target) return null;
  if (!target.markIds) return target;
  const [lead] = blockMembers(project, labelMemberIds(target));
  return lead || null;
}

// Смещение подписи. У группы своего поля модель не заводит — её подпись стоит
// по смещению первой метки блока (собственной подписи у этой метки нет,
// подпись у блока одна), и правится оно обычным updateMark.
function labelOffsetOf(project, target) {
  if (!target.markIds) return target.labelOffset || null;
  if (target.labelOffset) return target.labelOffset;
  const first = project.marks.find((mark) => mark.id === target.markIds[0]);
  return first && first.labelOffset ? first.labelOffset : null;
}

// Текст подписи: у блока — свёрнутый в диапазон список, у одиночной метки — её
// обозначение.
function labelTextOf(project, target) {
  return (target.markIds ? blockLabel(project, labelMemberIds(target)) : labelOf(project, target.id)) || "";
}

// Ключ цели в раскладке. Группа и метка живут в разных пространствах
// идентификаторов, но в одной таблице — отсюда приставка.
function labelKeyOf(target) {
  return (target.markIds ? "g:" : "m:") + target.id;
}

// Технический код ошибки контракта — как в `store.js`, наружу он не выходит:
// это промах вызывающего, а не сообщение пользователю.
const LABEL_FILTER_ERROR = "label-layout-instead-of-filter";

// Пятый аргумент — **фильтр**, ровно тот же, что у `hitTest`, `drawScheme` и
// `visibleMarks`: раскладка считается по тем подписям, которые видит
// вызывающий. Передать сюда готовую раскладку нельзя — `Map` молча сошла бы за
// «фильтра нет», подписи разделили бы места со скрытыми, и клик разошёлся бы с
// картинкой. Внутри модуля для уже посчитанной раскладки есть `labelBoxIn`.
function labelBox(project, scheme, target, view, filter) {
  if (filter instanceof Map) {
    const error = new Error(LABEL_FILTER_ERROR);
    error.code = LABEL_FILTER_ERROR;
    throw error;
  }
  const state = renderView(view);
  return labelBoxIn(project, scheme, target, state, labelLayout(project, scheme, filter, state));
}

// То же самое с уже посчитанной раскладкой: кадр холста и попадание по клику
// считают её один раз на все подписи схемы, а не заново на каждую.
function labelBoxIn(project, scheme, target, state, layout) {
  const font = labelFontSize(state);
  const anchor = planToScreen(labelOrigin(project, target), scheme, state);
  const value = labelTextOf(project, target);
  const width = Math.max(font * 0.8, value.length * font * LABEL_CHAR_RATIO);
  const place = labelPlaceOf(project, target, state, layout);
  return {
    text: value,
    x: anchor.x + place.dx * state.zoom,
    y: anchor.y + place.dy * state.zoom,
    width,
    height: font * 1.2,
    font,
    // Смещение подписи в пикселях плана — в тех же единицах, что `labelOffset`
    // у метки. Отсюда его берёт перетаскивание: подпись, которую разводка
    // отодвинула, не прыгает обратно, когда за неё взялись мышью.
    dx: place.dx,
    dy: place.dy,
    row: place.row,
    crowded: place.crowded,
  };
}

// Где стоит подпись. Оттащенная руками — строго по своему смещению: его задал
// пользователь, и трогать его нельзя. Остальные — по месту из раскладки.
function labelPlaceOf(project, target, state, layout) {
  const manual = labelOffsetOf(project, target);
  if (manual) return { dx: manual.dx, dy: manual.dy, row: 0, crowded: false };
  const place = layout.get(labelKeyOf(target));
  if (place) return place;
  // Цели в раскладке нет — значит она в неё и не входила: метку спрятал фильтр
  // или она с другой схемы. Такая подпись не рисуется; место ей даётся
  // стандартное, то самое, где подпись стояла всегда.
  const [slot] = labelSlots(labelPlanSizes(state).gap, 0, 0);
  return { dx: slot.dx, dy: slot.dy, row: 0, crowded: false };
}

// Подписи рисуются у меток без группы и по одной на группу. Цель группы несёт
// `shownIds` — метки блока, прошедшие фильтр: на листе розеток от смешанного
// блока остаётся «Р1», а не «В1, Р1» с невидимым выключателем.
function labelTargets(project, scheme, filter) {
  const marks = visibleMarks(project, scheme, filter);
  const targets = [];
  const byGroup = new Map();
  for (const mark of marks) {
    if (!mark.groupId) {
      targets.push(mark);
      continue;
    }
    let target = byGroup.get(mark.groupId);
    if (!target) {
      const group = findGroup(project, mark.groupId);
      if (!group) {
        targets.push(mark);
        continue;
      }
      target = { ...group, shownIds: [] };
      byGroup.set(mark.groupId, target);
      targets.push(target);
    }
    target.shownIds.push(mark.id);
  }
  return targets;
}

// ——— разведение подписей ——————————————————————————————————————————————
//
// Метка стоит там, где стоит железка на стене, и двигать её нельзя. Двигать
// можно только подпись — а подписи соседних меток запросто перекрывают друг
// друга: код типа бывает в шестнадцать букв, а розетки стоят в сорока
// пикселях одна от другой. Перекрытая подпись съедает номер, а номер —
// единственное, ради чего подпись на плане и стоит.
//
// Раскладка перебирает для каждой подписи короткий список мест вокруг её
// метки и берёт первое свободное. Три свойства, ради которых всё считается
// именно так:
//
// 1. Считается в пикселях плана, а не экрана. Экран и выгрузка отличаются
//    только масштабом, и подпись уезжает на `dx × zoom` — значит распечатка
//    повторяет то, что видел инженер, знак в знак.
// 2. Порядок обхода — сверху вниз, слева направо, при равенстве по ключу.
//    Одна и та же схема, открытая дважды, раскладывается одинаково.
// 3. Жадность вместо оптимума: перебор мест у каждой подписи ограничен, чужие
//    подписи уже расставлены и не переставляются. Полсотни меток — это полсотни
//    коротких переборов, а не поиск идеальной раскладки.

// Сколько рядов вверх и вниз пробует раскладка, прежде чем сдаться. Ряд — это
// высота подписи: дальше подпись уже не читается как «эта, у этой метки».
const LABEL_ROWS = 3;
// Просвет между соседними подписями в пикселях плана: вплотную поставленные
// строки читаются как одна.
const LABEL_PAD = 2;

// Кегль и отступ в пикселях плана. Те же нижние границы, что у экранных
// `labelFontSize` и `markRadius` при единичном масштабе.
function labelPlanSizes(state) {
  return { font: Math.max(6, state.labelSize), gap: Math.max(2, state.markSize) * LABEL_GAP };
}

// Места вокруг метки в порядке убывания желанности: сперва четыре угла вплотную
// (справа сверху — то самое место, где подпись стояла всегда), потом те же
// четыре ряд за рядом дальше по вертикали. `dx` — смещение левого края подписи,
// `dy` — её середины: слева подпись отодвигается на всю свою ширину.
function labelSlots(gap, width, height) {
  // Шаг ряда — высота подписи и два просвета: соседние ряды обязаны разойтись
  // с запасом, иначе проверка наложения упирается в ноль и решает исход по
  // погрешности последнего разряда.
  const step = height + LABEL_PAD * 2;
  const slots = [];
  for (let row = 0; row <= LABEL_ROWS; row += 1) {
    const up = -gap - row * step;
    const down = gap + row * step;
    slots.push({ dx: gap, dy: up, row });
    slots.push({ dx: gap, dy: down, row });
    slots.push({ dx: -gap - width, dy: up, row });
    slots.push({ dx: -gap - width, dy: down, row });
  }
  return slots;
}

// Подпись в пикселях плана: `x`, `y` — точка привязки (сама метка), размеры —
// оценка по числу знаков, та же, что у экранного `labelBox`.
function labelPlanBox(project, scheme, target, sizes) {
  const origin = labelOrigin(project, target);
  const text = labelTextOf(project, target);
  return {
    text,
    x: origin.x * schemeWidth(scheme),
    y: origin.y * schemeHeight(scheme),
    width: Math.max(sizes.font * 0.8, text.length * sizes.font * LABEL_CHAR_RATIO),
    height: sizes.font * 1.2,
  };
}

function labelRect(box, offset) {
  return { x: box.x + offset.dx, y: box.y + offset.dy, width: box.width, height: box.height };
}

// Площадь наложения двух подписей с учётом обязательного просвета. Ноль — место
// свободно; иначе число тем больше, чем хуже: по нему выбирается наименее
// плохое место, когда свободных не осталось.
function labelOverlap(a, b) {
  const wide = Math.min(a.x + a.width, b.x + b.width) - Math.max(a.x, b.x) + LABEL_PAD;
  const tall =
    Math.min(a.y + a.height / 2, b.y + b.height / 2) - Math.max(a.y - a.height / 2, b.y - b.height / 2) + LABEL_PAD;
  return wide > 0 && tall > 0 ? wide * tall : 0;
}

// Подпись целиком на плане. Выгрузка «весь план» рисует ровно прямоугольник
// плана — всё, что за его краем, на картинке просто отрезано.
function labelInsidePlan(rect, width, height) {
  return (
    rect.x >= 0 && rect.x + rect.width <= width && rect.y - rect.height / 2 >= 0 && rect.y + rect.height / 2 <= height
  );
}

// Фильтр меняет состав подписей, а значит и раскладку: ключ кэша обязан его
// учитывать.
function labelFilterKey(filter) {
  if (!filter) return "-";
  return [
    Array.isArray(filter.categoryIds) ? filter.categoryIds.join(",") : "*",
    Array.isArray(filter.typeIds) ? filter.typeIds.join(",") : "*",
    filter.roomId || "",
    (filter.query || "").trim().toLowerCase(),
  ].join("|");
}

function labelPlaceAll(project, scheme, filter, sizes) {
  const planWidth = schemeWidth(scheme);
  const planHeight = schemeHeight(scheme);
  const layout = new Map();
  const entries = labelTargets(project, scheme, filter)
    .map((target) => ({
      key: labelKeyOf(target),
      box: labelPlanBox(project, scheme, target, sizes),
      offset: labelOffsetOf(project, target),
    }))
    .filter((entry) => entry.box.text);
  entries.sort((a, b) => a.box.y - b.box.y || a.box.x - b.box.x || (a.key < b.key ? -1 : a.key > b.key ? 1 : 0));

  // Оттащенные руками подписи в раскладку не попадают, но остаются на плане:
  // их места заняты, и остальные их обходят.
  const placed = entries.filter((entry) => entry.offset).map((entry) => labelRect(entry.box, entry.offset));

  for (const entry of entries) {
    if (entry.offset) continue;
    const slots = labelSlots(sizes.gap, entry.box.width, entry.box.height);
    let best = null;
    for (const slot of slots) {
      const rect = labelRect(entry.box, slot);
      const inside = labelInsidePlan(rect, planWidth, planHeight);
      let overlap = 0;
      for (const other of placed) overlap += labelOverlap(rect, other);
      if (overlap === 0 && inside) {
        best = { slot, rect, overlap, inside };
        break;
      }
      // Свободного и целиком помещающегося места пока нет — запоминаем лучшее
      // из виденных: сперва по наложению, при равном наложении — то, что не
      // свешивается с плана.
      if (!best || overlap < best.overlap || (overlap === best.overlap && inside && !best.inside)) {
        best = { slot, rect, overlap, inside };
      }
    }
    placed.push(best.rect);
    layout.set(entry.key, { dx: best.slot.dx, dy: best.slot.dy, row: best.slot.row, crowded: best.overlap > 0 });
  }
  return layout;
}

// Кэш раскладки: объект после любой правки — новый (все функции модели чистые),
// поэтому WeakMap по объекту сам забывает устаревшее. Внутри — по схеме,
// размерам и фильтру: раскладка считается один раз, а зовут её и кадр холста,
// и попадание по клику на каждое движение мыши.
const labelLayoutCache = new WeakMap();

// Раскладка подписей схемы: ключ цели → смещение в пикселях плана.
// Оттащенных руками подписей в ней нет — у них своё смещение, и оно главнее.
function labelLayout(project, scheme, filter, view) {
  if (!project || !scheme) return new Map();
  const state = renderView(view);
  const sizes = labelPlanSizes(state);
  const key = [scheme.id, sizes.font, sizes.gap, labelFilterKey(filter)].join("|");
  let byKey = labelLayoutCache.get(project);
  if (!byKey) {
    byKey = new Map();
    labelLayoutCache.set(project, byKey);
  }
  let value = byKey.get(key);
  if (!value) {
    value = labelPlaceAll(project, scheme, filter, sizes);
    byKey.set(key, value);
  }
  return value;
}

// ——— контуры помещений ————————————————————————————————————————————————

// Цвет комнаты с прозрачностью: заливка контура не должна перебивать план,
// поэтому она всегда полупрозрачна, а линия — нет.
function outlineTint(color, alpha) {
  const hex = /^#[0-9a-fA-F]{6}$/.test(String(color || "")) ? color : OUTLINE_COLOR_FALLBACK;
  const value = parseInt(hex.slice(1), 16);
  return `rgba(${(value >> 16) & 255}, ${(value >> 8) & 255}, ${value & 255}, ${alpha})`;
}

function outlineScreen(scheme, outline, view) {
  return outline.points.map((point) => planToScreen(point, scheme, view));
}

// Середина многоугольника для подписи: центр по площади, а не по вершинам, —
// у Г-образной комнаты он ближе к её телу, чем среднее углов.
function outlineCenter(points) {
  let area = 0;
  let cx = 0;
  let cy = 0;
  for (let i = 0, j = points.length - 1; i < points.length; j = i, i += 1) {
    const cross = points[j].x * points[i].y - points[i].x * points[j].y;
    area += cross;
    cx += (points[j].x + points[i].x) * cross;
    cy += (points[j].y + points[i].y) * cross;
  }
  if (Math.abs(area) < 1e-9) {
    const sum = points.reduce((acc, point) => ({ x: acc.x + point.x, y: acc.y + point.y }), { x: 0, y: 0 });
    return { x: sum.x / points.length, y: sum.y / points.length };
  }
  return { x: cx / (3 * area), y: cy / (3 * area) };
}

// Контуры схемы, прошедшие фильтр: сужение списка меток до одного помещения
// оставляет на плане и его контур — иначе лист по комнате обещает не ту комнату.
function visibleOutlines(project, scheme, filter) {
  if (!project || !scheme) return [];
  const roomId = filter && filter.roomId ? filter.roomId : null;
  return outlinesInOrder(project, scheme.id).filter((outline) => !roomId || outline.roomId === roomId);
}

function outlineColor(project, outline) {
  const room = findRoom(project, outline.roomId);
  return (room && room.color) || OUTLINE_COLOR_FALLBACK;
}

// Ручки правки: вершины (их двигают и удаляют) и «+» на середине каждой стенки
// (по нему вершина добавляется). Замыкающая стенка — такая же, как все.
function outlineHandles(scheme, outline, view) {
  const state = renderView(view);
  const screen = outlineScreen(scheme, outline, state);
  const handles = [];
  screen.forEach((point, index) => {
    handles.push({ kind: "vertex", index, x: point.x, y: point.y, r: OUTLINE_HANDLE_PX });
    const next = screen[(index + 1) % screen.length];
    handles.push({
      kind: "insert",
      index,
      x: (point.x + next.x) / 2,
      y: (point.y + next.y) / 2,
      r: OUTLINE_HANDLE_PX - 1,
    });
  });
  return handles;
}

/**
 * Попадание по контуру. Клик по метке всегда важнее — поэтому холст зовёт
 * сперва `hitTest`, и только потом это. Внутренность контура не ловится:
 * иначе заливка комнаты перехватывала бы клики по пустому плану.
 * `selectedOutlineId` — у выделенного контура ловятся ещё и ручки вершин.
 */
function hitOutline(project, scheme, point, view, filter, selectedOutlineId) {
  if (!project || !scheme) return null;
  const state = renderView(view);
  const outlines = visibleOutlines(project, scheme, filter);
  const selected = outlines.find((outline) => outline.id === selectedOutlineId);
  if (selected) {
    for (const handle of outlineHandles(scheme, selected, state)) {
      if (Math.hypot(point.x - handle.x, point.y - handle.y) <= handle.r + 2) {
        return { outlineId: selected.id, part: handle.kind, index: handle.index };
      }
    }
  }
  // Меньший контур лежит в порядке последним и ловится первым: у комнаты
  // внутри комнаты стенки могут совпасть со стенками большей.
  for (let index = outlines.length - 1; index >= 0; index -= 1) {
    const outline = outlines[index];
    const screen = outlineScreen(scheme, outline, state);
    for (let i = 0; i < screen.length; i += 1) {
      const a = screen[i];
      const b = screen[(i + 1) % screen.length];
      if (distanceToSegment(point, a, b) <= OUTLINE_HIT_PX) {
        return { outlineId: outline.id, part: "edge", index: i };
      }
    }
    const label = outlineLabelBox(project, scheme, outline, state);
    if (label && insideBox(point, label)) return { outlineId: outline.id, part: "label", index: 0 };
  }
  return null;
}

function outlineLabelBox(project, scheme, outline, view) {
  const room = findRoom(project, outline.roomId);
  if (!room || !room.name) return null;
  const state = renderView(view);
  const font = Math.max(9, labelFontSize(state) * 0.95);
  const center = planToScreen(outlineCenter(outline.points), scheme, state);
  const width = room.name.length * font * LABEL_CHAR_RATIO;
  return { text: room.name, x: center.x - width / 2, y: center.y, width, height: font * 1.2, font };
}

/**
 * Контуры помещений под метками: тонкая линия цветом комнаты, полупрозрачная
 * заливка и название внутри. `mode` — `"pale"` для бумаги.
 */
function drawOutlines(ctx, { project, scheme, filter, view, mode, selectedOutlineId }) {
  const outlines = visibleOutlines(project, scheme, filter);
  if (outlines.length === 0) return;
  const state = renderView(view);
  const style = OUTLINE_STYLE[mode === "pale" ? "pale" : "normal"];
  for (const outline of outlines) {
    const color = outlineColor(project, outline);
    const screen = outlineScreen(scheme, outline, state);
    ctx.save();
    ctx.beginPath();
    screen.forEach((point, index) => (index === 0 ? ctx.moveTo(point.x, point.y) : ctx.lineTo(point.x, point.y)));
    ctx.closePath();
    ctx.fillStyle = outlineTint(color, style.fill);
    ctx.fill();
    ctx.lineJoin = "round";
    ctx.lineWidth = style.line;
    ctx.strokeStyle = outline.id === selectedOutlineId ? "#0969da" : outlineTint(color, 0.9);
    if (outline.id === selectedOutlineId) ctx.setLineDash([6, 4]);
    ctx.stroke();
    ctx.restore();

    const label = outlineLabelBox(project, scheme, outline, state);
    if (!label) continue;
    ctx.save();
    ctx.font = `600 ${label.font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineWidth = Math.max(2, label.font * 0.3);
    ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
    ctx.strokeText(label.text, label.x + label.width / 2, label.y);
    ctx.fillStyle = outlineTint(color, style.label);
    ctx.fillText(label.text, label.x + label.width / 2, label.y);
    ctx.restore();
  }
}

// Ручки выделенного контура: квадрат на вершине, «+» на середине стенки.
function drawOutlineHandles(ctx, scheme, outline, view, color) {
  const tint = color || "#0969da";
  for (const handle of outlineHandles(scheme, outline, renderView(view))) {
    ctx.save();
    ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
    ctx.strokeStyle = tint;
    ctx.lineWidth = 1.5;
    if (handle.kind === "vertex") {
      ctx.beginPath();
      ctx.rect(handle.x - handle.r, handle.y - handle.r, handle.r * 2, handle.r * 2);
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(handle.x, handle.y, handle.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      const arm = handle.r * 0.55;
      ctx.moveTo(handle.x - arm, handle.y);
      ctx.lineTo(handle.x + arm, handle.y);
      ctx.moveTo(handle.x, handle.y - arm);
      ctx.lineTo(handle.x, handle.y + arm);
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ——— попадание ———————————————————————————————————————————————————————

function pointInPolygon(point, points) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i, i += 1) {
    const a = points[i];
    const b = points[j];
    const crosses = a.y > point.y !== b.y > point.y;
    if (crosses && point.x < ((b.x - a.x) * (point.y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}

function distanceToSegment(point, a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const lengthSq = dx * dx + dy * dy;
  if (lengthSq === 0) return Math.hypot(point.x - a.x, point.y - a.y);
  let t = ((point.x - a.x) * dx + (point.y - a.y) * dy) / lengthSq;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(point.x - (a.x + t * dx), point.y - (a.y + t * dy));
}

function insideBox(point, box) {
  return (
    point.x >= box.x - 2 &&
    point.x <= box.x + box.width + 2 &&
    point.y >= box.y - box.height / 2 &&
    point.y <= box.y + box.height / 2
  );
}

// Точка — в экранных пикселях холста. Возвращает `{markId, part, index}`:
// `part` — `label` (подпись, её таскают отдельно), `mark` (точка или вершина
// линии), `line` (сегмент ломаной). Сверху вниз: подписи, потом метки в обратном
// порядке постановки — поздняя метка лежит выше ранней.
function hitTest(project, scheme, point, view, filter) {
  if (!project || !scheme) return null;
  const state = renderView(view);
  const radius = markRadius(state);
  const slack = radius + HIT_SLACK_PX;

  const targets = labelTargets(project, scheme, filter);
  const layout = labelLayout(project, scheme, filter, state);
  for (let index = targets.length - 1; index >= 0; index -= 1) {
    const target = targets[index];
    const box = labelBoxIn(project, scheme, target, state, layout);
    if (box.text && insideBox(point, box)) {
      // Подпись блока выбирает первую из тех меток, что в ней перечислены:
      // под фильтром скрытая метка в подписи не стоит и выбираться не должна.
      const markId = target.markIds ? labelMemberIds(target)[0] : target.id;
      return { markId, part: "label", groupId: target.markIds ? target.id : null, index: 0 };
    }
  }

  const marks = visibleMarks(project, scheme, filter);
  for (let index = marks.length - 1; index >= 0; index -= 1) {
    const mark = marks[index];
    const style = styleOf(project, mark.typeId);
    const screen = mark.points.map((item) => planToScreen(item, scheme, state));
    for (let vertex = 0; vertex < screen.length; vertex += 1) {
      const geometry = shapeGeometry(style.shape, screen[vertex].x, screen[vertex].y, radius);
      const near =
        geometry.kind === "circle"
          ? Math.hypot(point.x - geometry.cx, point.y - geometry.cy) <= slack
          : pointInPolygon(point, geometry.points) ||
            Math.hypot(point.x - geometry.cx, point.y - geometry.cy) <= slack;
      if (near) return { markId: mark.id, part: "mark", groupId: mark.groupId, index: vertex };
    }
    if (mark.kind === "line" && screen.length > 1) {
      const last = mark.closed ? screen.length : screen.length - 1;
      for (let segment = 0; segment < last; segment += 1) {
        const a = screen[segment];
        const b = screen[(segment + 1) % screen.length];
        if (distanceToSegment(point, a, b) <= Math.max(4, radius * 0.6)) {
          return { markId: mark.id, part: "line", groupId: mark.groupId, index: segment };
        }
      }
    }
  }
  return null;
}

// ——— ручки блока —————————————————————————————————————————————————————

// Четыре «+» вокруг выделенной точки: клик ставит соседнюю точку блока.
// Ради них таск и существует: два десятка розеток ставятся без диалогов.
function handlePositions(scheme, mark, view) {
  if (!mark || mark.kind !== "point") return [];
  const state = renderView(view);
  const radius = markRadius(state);
  const gap = radius * HANDLE_GAP;
  const base = planToScreen(mark.points[mark.points.length - 1], scheme, state);
  const handleRadius = Math.max(7, Math.min(HANDLE_RADIUS, radius));
  return [
    { side: "left", x: base.x - gap, y: base.y, r: handleRadius },
    { side: "right", x: base.x + gap, y: base.y, r: handleRadius },
    { side: "up", x: base.x, y: base.y - gap, r: handleRadius },
    { side: "down", x: base.x, y: base.y + gap, r: handleRadius },
  ];
}
function hitHandle(scheme, mark, point, view) {
  for (const handle of handlePositions(scheme, mark, view)) {
    if (Math.hypot(point.x - handle.x, point.y - handle.y) <= handle.r + 2) return handle.side;
  }
  return null;
}

// ——— рисование ———————————————————————————————————————————————————————

// Поводок к отведённой подписи: тонкая линия от метки к ближнему краю текста.
// Рисуется только тем, кого раскладка увела на ряд и дальше, — у подписи
// вплотную к метке и так видно, чья она.
function drawLabelLeader(ctx, anchor, box, color) {
  if (!box.text) return;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = Math.max(1, box.font * 0.08);
  ctx.beginPath();
  ctx.moveTo(anchor.x, anchor.y);
  ctx.lineTo(box.x < anchor.x ? box.x + box.width : box.x, box.y);
  ctx.stroke();
  ctx.restore();
}

function drawLabel(ctx, box, color) {
  if (!box.text) return;
  ctx.save();
  ctx.font = `600 ${box.font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  // Обводка-подложка: подпись читается и поверх тёмных линий плана.
  ctx.lineWidth = Math.max(2, box.font * 0.3);
  ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(255, 255, 255, 0.92)";
  ctx.strokeText(box.text, box.x, box.y);
  ctx.fillStyle = color;
  ctx.fillText(box.text, box.x, box.y);
  ctx.restore();
}

function drawMarkBody(ctx, project, scheme, mark, view, selected) {
  const style = styleOf(project, mark.typeId);
  const radius = markRadius(view);
  const screen = mark.points.map((point) => planToScreen(point, scheme, view));
  if (mark.kind === "line" && screen.length > 1) {
    ctx.save();
    ctx.strokeStyle = style.color;
    ctx.lineWidth = Math.max(2, radius * 0.5);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    screen.forEach((point, index) => (index === 0 ? ctx.moveTo(point.x, point.y) : ctx.lineTo(point.x, point.y)));
    if (mark.closed) ctx.closePath();
    ctx.stroke();
    ctx.restore();
    for (const point of screen) drawShape(ctx, "circle", point.x, point.y, Math.max(2, radius * 0.45), style.color);
  } else {
    for (const point of screen) drawShape(ctx, style.shape, point.x, point.y, radius, style.color);
  }
  if (!selected) return;
  ctx.save();
  ctx.strokeStyle = "#0969da";
  ctx.setLineDash([4, 3]);
  ctx.lineWidth = 2;
  for (const point of screen) {
    ctx.beginPath();
    ctx.arc(point.x, point.y, radius * 1.6, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

// Ручки «+» рисуются только у выделенной точки. `color` — цвет типа, который
// эта ручка поставит: в смешанном блоке она красится в цвет ставящейся метки,
// а без него остаётся цветом выделения.
function drawHandles(ctx, scheme, mark, view, color) {
  const tint = color || "#0969da";
  for (const handle of handlePositions(scheme, mark, view)) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(handle.x, handle.y, handle.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
    ctx.strokeStyle = tint;
    ctx.lineWidth = 1.5;
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    const arm = handle.r * 0.5;
    ctx.moveTo(handle.x - arm, handle.y);
    ctx.lineTo(handle.x + arm, handle.y);
    ctx.moveTo(handle.x, handle.y - arm);
    ctx.lineTo(handle.x, handle.y + arm);
    ctx.strokeStyle = tint;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }
}

// Черновик линии: уже поставленные вершины плюс резинка до курсора.
function drawDraft(ctx, scheme, draft, view, color) {
  if (!draft || draft.points.length === 0) return;
  const radius = markRadius(view);
  const screen = draft.points.map((point) => planToScreen(point, scheme, view));
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(2, radius * 0.5);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  screen.forEach((point, index) => (index === 0 ? ctx.moveTo(point.x, point.y) : ctx.lineTo(point.x, point.y)));
  if (draft.cursor) {
    const cursor = planToScreen(draft.cursor, scheme, view);
    ctx.lineTo(cursor.x, cursor.y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  for (const point of screen) drawShape(ctx, "circle", point.x, point.y, Math.max(3, radius * 0.5), color);
  // Первая вершина крупнее: по ней замыкают контур.
  drawShape(ctx, "circle", screen[0].x, screen[0].y, Math.max(4, radius * 0.75), color);
}

function legendRows(project, scheme, filter) {
  const used = new Set(visibleMarks(project, scheme, filter).map((mark) => mark.typeId));
  const rows = [];
  for (const group of typesInOrder(project)) {
    for (const type of group.types) {
      if (!used.has(type.id)) continue;
      rows.push({ code: type.code, name: type.name, category: group.category.name, ...styleOf(project, type.id) });
    }
  }
  return rows;
}

// Легенда — для выгрузки: список типов, встреченных на схеме.
function drawLegend(ctx, { project, scheme, filter, view, box }) {
  const rows = legendRows(project, scheme, filter);
  if (rows.length === 0) return;
  const state = renderView(view);
  const font = Math.max(11, labelFontSize(state) * 0.9);
  const step = font * 1.7;
  const x = box ? box.x : 12;
  const y = box ? box.y : 12;
  ctx.save();
  ctx.font = `${font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  // Ширина рамки — по самой длинной строке: код типа бывает и в шестнадцать
  // букв, а рамка фиксированной ширины оставляла «ПОДСВЕТКА — подсветка ниши»
  // лежать поверх плана. Шире предела легенда сама закрывает план, и строка
  // обрезается многоточием.
  const textX = font * LEGEND_TEXT_EM;
  const pad = font * 0.8;
  const texts = rows.map((row) => legendClip(ctx, `${row.code} — ${row.name}`, font * LEGEND_MAX_EM - textX - pad));
  const widest = texts.reduce((max, value) => Math.max(max, ctx.measureText(value).width), 0);
  const width = Math.max(font * LEGEND_MIN_EM, textX + widest + pad);
  const height = step * rows.length + font;
  ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
  ctx.strokeStyle = "#d0d7de";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.rect(x, y, width, height);
  ctx.fill();
  ctx.stroke();
  rows.forEach((row, index) => {
    const lineY = y + font * 0.6 + step * (index + 0.5);
    drawShape(ctx, row.shape, x + font * 1.1, lineY, font * 0.55, row.color);
    ctx.fillStyle = "#1f2328";
    ctx.fillText(texts[index], x + textX, lineY);
  });
  ctx.restore();
}

// Весь кадр: план, метки, подписи, при надобности легенда. Тот же код и на
// экране, и в экспорте — меняется только масштаб во `view`.
function drawScheme(ctx, {
  project,
  scheme,
  image,
  filter,
  view,
  legend,
  selectedIds,
  draft,
  draftColor,
  outlines,
  selectedOutlineId,
}) {
  const state = renderView(view);
  if (image) {
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(
      image,
      state.offsetX,
      state.offsetY,
      schemeWidth(scheme) * state.zoom,
      schemeHeight(scheme) * state.zoom,
    );
    ctx.restore();
  }
  if (!project || !scheme) return;
  // Контуры ложатся под метки: метка на стене комнаты должна остаться видна.
  if (outlines !== false && outlines !== null) {
    drawOutlines(ctx, { project, scheme, filter, view: state, mode: outlines, selectedOutlineId });
  }
  const selected = new Set(selectedIds || []);
  for (const mark of visibleMarks(project, scheme, filter)) {
    drawMarkBody(ctx, project, scheme, mark, state, selected.has(mark.id));
  }
  // Подписи — после меток и в два прохода: сперва поводки у тех, кого развели
  // от соседа, потом сам текст. Иначе поводок ляжет поверх уже нарисованной
  // подписи и перечеркнёт её.
  const layout = labelLayout(project, scheme, filter, state);
  const labels = labelTargets(project, scheme, filter).map((target) => ({
    box: labelBoxIn(project, scheme, target, state, layout),
    anchor: planToScreen(labelOrigin(project, target), scheme, state),
    color: styleOf(project, (labelLead(project, target) || {}).typeId).color,
  }));
  for (const item of labels) {
    if (item.box.row > 0) drawLabelLeader(ctx, item.anchor, item.box, item.color);
  }
  for (const item of labels) drawLabel(ctx, item.box, item.color);
  if (draft) drawDraft(ctx, scheme, draft, state, draftColor || "#0969da");
  if (legend) drawLegend(ctx, { project, scheme, filter, view: state, box: legend === true ? null : legend });
}

// Дверь для тестов — не для панелей: за ней внутренности drawScheme, которые
// снаружи вызывать незачем, но проверить нужно (геометрия, видимость, запас
// попадания). Панели и экспорт берут только именованные экспорты выше.
const renderInternals = {
  shapeGeometry,
  outlineCenter,
  outlineTint,
  outlineLabelBox,
  shapeInternals,
  labelFontSize,
  labelTargets,
  labelOrigin,
  markVisible,
  handlePositions,
  drawDraft,
  HIT_SLACK_PX,
  LABEL_CHAR_RATIO,
  LABEL_GAP,
  HANDLE_GAP,
};

// src/history.js
// Отмена — стек команд в памяти. В файл история не пишется: пользователь просил
// отмену, а не версии.
//
// Команда — это пара функций: `undo()` возвращает как было, `redo()` — как стало.
// Холст кладёт сюда снимки объекта, которые вернула модель; своего мутатора
// объекта здесь нет и быть не должно.
const HISTORY_DEPTH = 100;

const historyDone = [];
const historyUndone = [];
const historyListeners = new Set();

function historyChanged() {
  for (const listener of [...historyListeners]) listener();
}
function pushCommand(command) {
  if (!command || typeof command.undo !== "function" || typeof command.redo !== "function") return null;
  historyDone.push(command);
  // Ветка «отменил и сделал иначе»: возвращать уже нечего.
  historyUndone.length = 0;
  while (historyDone.length > HISTORY_DEPTH) historyDone.shift();
  historyChanged();
  return command;
}
function undo() {
  const command = historyDone.pop();
  if (!command) return null;
  command.undo();
  historyUndone.push(command);
  historyChanged();
  return command;
}
function redo() {
  const command = historyUndone.pop();
  if (!command) return null;
  command.redo();
  historyDone.push(command);
  historyChanged();
  return command;
}
function canUndo() {
  return historyDone.length > 0;
}
function canRedo() {
  return historyUndone.length > 0;
}
function undoLabel() {
  const command = historyDone[historyDone.length - 1];
  return command && command.label ? command.label : "";
}
function redoLabel() {
  const command = historyUndone[historyUndone.length - 1];
  return command && command.label ? command.label : "";
}

// Стек живёт в пределах объекта: при переключении объекта его чистят.
function clearHistory() {
  historyDone.length = 0;
  historyUndone.length = 0;
  historyChanged();
}

// Кнопки «Отменить»/«Вернуть» подсвечиваются по этому событию, и слушателей у
// него столько, сколько подписалось: панель инструментов, список меток и всё,
// что появится дальше. Возвращённая функция снимает только свою подписку.
function onHistoryChange(listener) {
  if (typeof listener !== "function") return () => {};
  historyListeners.add(listener);
  return () => historyListeners.delete(listener);
}

// src/panels/ui.js
// Общие кирпичи панелей: элементы, кнопки, модальные диалоги.
// Отдельный модуль, потому что ими пользуются все панели: тянуть их из чужой
// панели значило бы тянуть вместе с ней её регистрацию и подписки.
function uiEl(tag, options = {}, children = []) {
  const node = document.createElement(tag);
  if (options.class) node.className = options.class;
  if (options.text != null) node.textContent = options.text;
  if (options.title) node.title = options.title;
  if (options.type) node.type = options.type;
  if (options.value != null) node.value = options.value;
  if (options.placeholder) node.placeholder = options.placeholder;
  if (options.attrs) {
    for (const [name, value] of Object.entries(options.attrs)) node.setAttribute(name, value);
  }
  if (options.on) {
    for (const [name, handler] of Object.entries(options.on)) node.addEventListener(name, handler);
  }
  for (const child of Array.isArray(children) ? children : [children]) {
    if (child) node.append(child);
  }
  return node;
}
function uiButton(label, options = {}) {
  return uiEl("button", {
    class: options.class || "ui-btn",
    text: label,
    title: options.title || "",
    type: "button",
    on: options.on,
    attrs: options.attrs,
  });
}

// Диалоги складываются стопкой: подтверждение поверх редактора плана —
// обычное дело. Виден верхний, Escape закрывает только его, Enter нажимает его
// основное действие, нижние ждут своей очереди и закрываются своими же close().
// Пока стопка не пуста, #dialog-host не пустой — значит затемнение на месте
// (правило `:empty` из styles.css). Клавиатура не должна оставаться в панели
// под затемнением: диалог забирает фокус, а закрываясь — возвращает его тому,
// кто его открыл.
const uiDialogs = [];
let uiEscapeListener = null;
function uiDialogDepth() {
  return uiDialogs.length;
}

function uiRefreshDialogs() {
  const host = document.getElementById("dialog-host");
  uiDialogs.forEach((entry, index) => {
    entry.card.hidden = index !== uiDialogs.length - 1;
  });
  if (uiDialogs.length === 0) {
    if (host) host.replaceChildren();
    if (uiEscapeListener) {
      document.removeEventListener("keydown", uiEscapeListener);
      uiEscapeListener = null;
