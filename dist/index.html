<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-text="app.title"></title>
    <style>
/* Холст разметки, подсказка поверх него и панель инструментов. */

.canvas {
  display: block;
  touch-action: none; /* щипок и панорама разбираются сами, браузер не мешает */
  background: transparent;
}

.canvas-hint {
  position: absolute;
  left: 12px;
  top: 12px;
  max-width: 460px;
  padding: 6px 10px;
  border: 1px solid var(--canvas-line);
  border-left-width: 4px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.92);
  color: #57606a;
  font-size: 12px;
  line-height: 1.35;
}

.tools {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.tools__label {
  margin: 6px 0 0;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--panel-muted);
}

.tools__type {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--panel-line);
  background: #21262d;
  color: var(--panel-text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.tools__type.is-set {
  border-color: var(--accent);
}

.tools__type:hover {
  border-color: var(--panel-muted);
}

/* Подпись «Выбрать» у плашки: по ней видно, что плашка нажимается. */
.tools__pick {
  flex: none;
  margin-left: auto;
  padding: 2px 6px;
  border-radius: 5px;
  border: 1px solid var(--panel-line);
  background: #30363d;
  color: var(--panel-text);
  font-size: 11px;
  white-space: nowrap;
}

.tools__type:hover .tools__pick,
.tools__room:hover .tools__pick {
  border-color: var(--accent);
}

.tools__code {
  font-weight: 700;
  font-size: 15px;
}

.tools__typeName {
  color: var(--panel-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Помещение для обводки — та же плитка, что и выбранный тип метки. */
.tools__room {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 8px;
  border-radius: 8px;
  border: 1px solid var(--panel-line);
  background: #21262d;
  color: var(--panel-text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.tools__room.is-set {
  border-color: var(--accent);
}

.tools__room:hover {
  border-color: var(--panel-muted);
}

/* Кружок цвета помещения: им же обводится контур на схеме. */
.rooms__swatch {
  flex: none;
  display: inline-block;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.35);
}

.tools__row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tools__row--modes .ui-btn {
  flex: 1 1 auto;
}

.ui-btn.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.tools__field {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--panel-muted);
}

.tools__field > span {
  min-width: 68px;
}

.tools__slider {
  flex: 1 1 auto;
  min-width: 0;
  accent-color: var(--accent);
}

/* Окно выбора типа */

.picker {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(420px, 78vw);
}

.picker__list {
  max-height: 46vh;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.picker__group {
  margin-top: 8px;
  padding: 2px 0 2px 8px;
  border-left: 3px solid var(--panel-line);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.picker__row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--panel-text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.picker__row:hover,
.picker__row.is-active {
  background: #21262d;
  border-color: var(--panel-line);
}

/* Значок фигуры (`render.shapeIcon`) в строке списка и на кнопке типа
   не сжимается вместе с текстом. */
.picker__row .shape-icon,
.tools__type .shape-icon {
  flex: 0 0 auto;
}

.picker__code {
  font-weight: 700;
  min-width: 26px;
}

.picker__name {
  color: var(--panel-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.picker__create {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--panel-line);
}

.picker__create:empty {
  display: none;
}

.picker__createTitle {
  margin: 0;
  font-size: 12px;
  color: var(--panel-muted);
}

.picker__field {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--panel-muted);
}

.picker__field > span {
  min-width: 82px;
}

.picker__error {
  margin: 0;
  color: #ff9aa2;
  font-size: 12px;
}

.picker__error:empty {
  display: none;
}

/* ——— окно выбора цвета ————————————————————————————————————————————————
   Слева палитра объекта, справа — поле оттенка и числа. Всё, что здесь
   делается мышью, делается и с клавиатуры, поэтому у каждого управляемого
   элемента есть видимая рамка фокуса. */

.colorpick {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  align-items: flex-start;
}

.colorpick__side {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.colorpick__caption {
  margin: 0;
  font-size: 12px;
  color: var(--panel-muted);
}

.colorpick__palette {
  display: grid;
  grid-template-columns: repeat(6, 32px);
  gap: 6px;
}

.colorpick__swatch {
  position: relative;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 6px;
  cursor: pointer;
}

.colorpick__swatch:hover {
  border-color: var(--panel-text);
}

.colorpick__swatch.is-active {
  box-shadow: 0 0 0 2px var(--panel-bg), 0 0 0 4px var(--panel-text);
}

/* Занятый цвет не запрещён, но помечен: повтор цвета на плане должен быть
   сознательным, а не случайным. */
.colorpick__swatch.is-used::after {
  content: "";
  position: absolute;
  right: 3px;
  top: 3px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(13, 17, 23, 0.75);
  border: 1px solid rgba(255, 255, 255, 0.6);
}

.colorpick__field {
  display: block;
  width: 232px;
  height: 168px;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  cursor: crosshair;
  touch-action: none;
}

.colorpick__hue {
  display: block;
  width: 232px;
  height: 18px;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  cursor: ew-resize;
  touch-action: none;
}

.colorpick__swatch:focus-visible,
.colorpick__field:focus-visible,
.colorpick__hue:focus-visible,
.colorpick__button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.colorpick__bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.colorpick__preview {
  display: flex;
  align-items: center;
  gap: 6px;
}

.colorpick__chip {
  flex: none;
  display: inline-block;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.35);
}

.colorpick__chip--before {
  width: 18px;
  height: 18px;
  opacity: 0.8;
}

/* Предпросмотр «как на плане»: белый лист, линия контура цветом и его же
   разведённая заливка. Цвет линии и заливки проставляются на месте. */
.colorpick__plan {
  flex: none;
  display: inline-block;
  width: 26px;
  height: 26px;
  border: 2px solid transparent;
  border-radius: 4px;
  background: #ffffff;
}

.colorpick__value {
  font-size: 12px;
  color: var(--panel-muted);
  font-variant-numeric: tabular-nums;
}

.colorpick__numbers {
  display: flex;
  gap: 6px;
}

.colorpick__number-box {
  display: flex;
  align-items: center;
  gap: 4px;
}

.colorpick__number-label {
  font-size: 12px;
  color: var(--panel-muted);
}

.colorpick__number {
  width: 54px;
  padding: 4px 6px;
  text-align: right;
}

.colorpick__random {
  align-self: flex-start;
}

/* Кнопка цвета в строке помещения или категории — она же предпросмотр. */
.colorpick__button {
  flex: none;
  width: 32px;
  height: 28px;
  padding: 0;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  cursor: pointer;
}

.colorpick__button:hover {
  border-color: var(--panel-text);
}

/* Работа с файлом проекта в шапке: строка «выгружено N назад», папка
   автосохранения, «Открыть файл» и «Сохранить в файл». */

#file-actions {
  display: flex;
  align-items: center;
  margin-left: 12px;
}

.file {
  display: flex;
  align-items: center;
  gap: 8px;
}

.file__status {
  color: var(--panel-muted);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 28ch;
}

/* Несохранённая работа заметна, но не кричит: цвет, а не модальное окно. */
.file.is-dirty .file__status {
  color: #d29922;
}

.file.is-busy .file__status {
  opacity: 0.6;
}

/* Папка выбрана и разрешена — кнопка выглядит включённой. */
.file .ui-btn.is-on {
  border-color: var(--ok);
  color: var(--ok);
}

.file__picker {
  display: none;
}

/* Список меток, фильтры и справочник объекта. Панель узкая, поэтому поля
   строки стоят столбиком: подписи заменяют подсказки-title. */

.filters {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--panel-line);
}

.filters__details {
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  padding: 4px 6px;
  background: var(--panel-bg-deep);
}

.filters__summary {
  cursor: pointer;
  color: var(--panel-muted);
  font-size: 12px;
  list-style: none;
}

.filters__summary::before {
  content: "▸ ";
}

.filters__details[open] .filters__summary::before {
  content: "▾ ";
}

.filters__tree {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 220px;
  overflow: auto;
  padding: 6px 0 2px;
}

.filters__category,
.filters__type {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--panel-text);
  font-size: 12px;
  cursor: pointer;
}

.filters__category {
  font-weight: 600;
  margin-top: 4px;
}

.filters__type {
  padding-left: 16px;
  color: var(--panel-muted);
}

.filters__check {
  margin: 0;
  accent-color: var(--accent);
}

.filters__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex: none;
}

.filters__code {
  min-width: 22px;
  font-weight: 600;
  color: var(--panel-text);
}

.filters__name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.marks__count {
  margin: 8px 0 4px;
  color: var(--panel-muted);
  font-size: 12px;
}

.marks {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.mark-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  background: var(--panel-bg-deep);
  cursor: pointer;
}

.mark-row.is-current {
  border-color: var(--accent);
}

.mark-row__head {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Код типа в строке. Длинный код («ПОДСВЕТКА») сжимается многоточием, а не
   выдавливает поле номера за край панели: панель узкая, 264 пикселя, и рядом
   стоит полное название типа. */
.mark-row__label {
  font-weight: 700;
  color: var(--panel-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Номер правится в строке: поле узкое, но цифру видно и попасть в него легко. */
.mark-row__number {
  flex: none;
  width: 56px;
  padding: 2px 4px;
  font-weight: 700;
  text-align: center;
}

/* Повтор номера — приём, а не ошибка: жёлтая пометка, а не красная. */
.mark-row__repeat {
  color: #e36209;
  border: 1px solid #e36209;
  border-radius: 999px;
  padding: 0 5px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.mark-row__type {
  color: var(--panel-muted);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Справочник объекта */

.dict-panel {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.dict {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 520px;
  max-height: 60vh;
  overflow: auto;
}

.dict__title {
  margin: 10px 0 2px;
  color: var(--panel-text);
  font-size: 13px;
}

.dict__group {
  margin: 8px 0 0;
  color: var(--panel-muted);
  font-size: 12px;
}

.dict__row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.dict__row--add {
  padding-top: 6px;
  border-top: 1px dashed var(--panel-line);
}

.dict__row .ui-input {
  flex: 1;
  min-width: 0;
}

/* Код типа — до шестнадцати букв (`CODE_MAX_LENGTH`), поэтому поле шире
   прежних двух знаков; длинное название типа ужимается рядом само. */
.dict__code {
  flex: none;
  width: 120px;
  text-align: center;
  font-weight: 700;
}

.dict__count {
  flex: none;
  min-width: 28px;
  text-align: right;
  color: var(--panel-muted);
  font-size: 12px;
}

/* Предпросмотр уплотнения: список замен «было → стало». */
.compact {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 320px;
}

.compact__rows {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 40vh;
  overflow: auto;
}

.compact__row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 4px;
  border-radius: 4px;
  background: var(--panel-bg-deep);
}

/* Номер остался прежним — строка есть, но глаз за неё не цепляется. */
.compact__row.is-same {
  background: none;
  color: var(--panel-muted);
}

.compact__label {
  font-weight: 700;
  min-width: 44px;
}

.compact__arrow {
  color: var(--panel-muted);
}

.compact__repeat {
  margin-left: auto;
  color: #e36209;
  font-size: 11px;
}

.compact__warning {
  margin: 0;
  color: #e36209;
  font-size: 12px;
}

.rooms__box {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 360px;
}

.rooms {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 50vh;
  overflow: auto;
}

.rooms__row,
.rooms__add {
  display: flex;
  align-items: center;
  gap: 6px;
}

.rooms__row .ui-input,
.rooms__add .ui-input {
  flex: 1;
  min-width: 0;
}

/* Вписанное руками помещение подчёркнуто: по контуру оно больше не меняется. */
.marks__room.is-manual {
  border-color: var(--accent);
}

.rooms__count {
  flex: none;
  color: var(--panel-muted);
  font-size: 12px;
}

/* Выбор формы: сетка нарисованных обозначений вместо списка названий. */

.dict__shape {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  background: #21262d;
  cursor: pointer;
}

.dict__shape:hover {
  border-color: var(--panel-muted);
}

.dict__shape--inherit {
  border-style: dashed;
}

.shapes {
  display: grid;
  grid-template-columns: repeat(5, 52px);
  gap: 6px;
}

.shapes__cell {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  height: 52px;
  padding: 0;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  background: #21262d;
  cursor: pointer;
}

.shapes__cell:hover {
  border-color: var(--panel-muted);
}

.shapes__cell.is-active {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

/* «Как у категории»: та же фигура, но пунктиром — видно, что она не своя. */
.shapes__cell--inherit {
  border-style: dashed;
  border-color: var(--panel-muted);
}

.shapes__icon {
  display: block;
}

/* Кнопки, поля, диалоги и списки панелей. Тёмная панель — светлый холст. */

.ui-btn {
  font: inherit;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--panel-line);
  background: #21262d;
  color: var(--panel-text);
  cursor: pointer;
  white-space: nowrap;
}

.ui-btn:hover:not(:disabled) {
  border-color: var(--panel-muted);
}

.ui-btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.ui-btn--accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.ui-btn--danger:hover:not(:disabled) {
  border-color: var(--danger);
  color: #ff9aa2;
}

.ui-btn--wide {
  display: block;
  width: 100%;
  padding: 7px 8px;
  margin-bottom: 10px;
}

.ui-select,
.ui-input {
  font: inherit;
  padding: 4px 6px;
  border-radius: 6px;
  border: 1px solid var(--panel-line);
  background: #21262d;
  color: var(--panel-text);
  max-width: 220px;
}

.ui-input {
  width: 100%;
  max-width: none;
}

#project-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ——— диалоги ——————————————————————————————————————————————————————— */

.modal {
  width: min(92vw, 720px);
  max-height: 90vh;
  overflow: auto;
  padding: 16px 18px;
  border-radius: 10px;
  border: 1px solid var(--panel-line);
  background: var(--panel-bg);
  color: var(--panel-text);
  box-shadow: 0 24px 64px rgba(1, 4, 9, 0.6);
}

.modal__title {
  margin: 0 0 10px;
  font-size: 15px;
}

.modal__text {
  margin: 0;
  color: var(--panel-text);
}

.modal__hint {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--panel-muted);
}

.modal__actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 14px;
}

/* ——— правка плана ——————————————————————————————————————————————————— */

.plan-editor__tools {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

.plan-stage {
  position: relative;
  display: flex;
  justify-content: center;
  background: var(--panel-bg-deep);
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  padding: 8px;
  user-select: none;
  touch-action: none;
}

.plan-stage__img {
  max-width: 100%;
  max-height: 58vh;
  display: block;
  cursor: crosshair;
}

.plan-frame {
  position: absolute;
  border: 1px dashed var(--accent);
  background: rgba(31, 111, 235, 0.18);
  pointer-events: none;
}

/* ——— список схем ————————————————————————————————————————————————————— */

.scheme-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.scheme-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 2px 6px;
  padding: 5px 6px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: #1c2129;
}

.scheme-row--current {
  border-color: var(--accent);
}

.scheme-row__name {
  font: inherit;
  text-align: left;
  padding: 0;
  border: 0;
  background: none;
  color: var(--panel-text);
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.scheme-row__meta {
  grid-column: 1;
  font-size: 11px;
  color: var(--panel-muted);
}

.scheme-row__tools {
  grid-column: 2;
  grid-row: 1 / span 2;
  display: flex;
  gap: 2px;
}

.scheme-row__tools .ui-btn {
  padding: 2px 5px;
  font-size: 12px;
}

#canvas-area.is-dropping::after {
  content: attr(data-drop);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #0b4ea2;
  font-weight: 600;
  position: absolute;
  inset: 8px;
  border: 2px dashed var(--accent);
  border-radius: 10px;
  background: rgba(31, 111, 235, 0.08);
  pointer-events: none;
  z-index: 5;
}

/* ——— окно «Тип метки»: категории колонками ————————————————————————————
   Один длинный столбец заставлял листать: «Свет» занимал экран, а
   «Выключатели» уходили за нижний край, и справа половина окна пустовала.
   Теперь категории стоят рядом, а ширину окна задаёт их число — столько
   колонок, сколько нашлось, но не больше `PICKER_MAX_COLUMNS`. */

/* Ширину этой карточки задаёт содержимое, а не общая мера диалогов. */
.modal--wide {
  width: auto;
  max-width: 96vw;
}

.picker--types {
  width: min(90vw, calc(var(--picker-columns, 1) * 240px));
}

.picker__columns {
  display: grid;
  grid-template-columns: repeat(var(--picker-columns, 1), minmax(150px, 1fr));
  gap: 2px 14px;
  align-items: start;
  max-height: 56vh;
  /* Прокрутка — на крайний случай: колонок больше шести (вертикальная)
     или окно уже, чем помещается колонка (горизонтальная). */
  overflow: auto;
}

.picker__column {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

/* Заголовок категории в её цвете остаётся виден при прокрутке. */
.picker__column .picker__group {
  position: sticky;
  top: 0;
  z-index: 1;
  margin: 0 0 2px;
  padding-top: 2px;
  background: var(--panel-bg);
}

/* Код бывает до шестнадцати букв. Место в строке уступает название: оно
   сжимается первым (основа 0), и только когда ужимать больше нечего,
   многоточие получает и код. Целиком строка остаётся в подсказке. */
.picker__column .picker__code {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.picker__column .picker__name {
  flex: 1 1 0;
  min-width: 0;
}

.picker__columns > .panel__empty {
  grid-column: 1 / -1;
}

/* Печатная раскладка и предпросмотр таблицы.
   Один и тот же узел .print-doc показывается в диалоге выгрузки и уходит в
   печать: на бумаге оказывается ровно то, что видно на экране. Экран прячется
   только на время нашей печати — по классу printing на body. */

#print-root {
  display: none;
}

.print-doc {
  background: #ffffff;
  color: #1f2328;
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  padding: 4px 2px 12px;
}

.print-doc__head {
  margin-bottom: 10px;
}

.print-doc__title {
  font-size: 18px;
  font-weight: 600;
  margin: 0;
}

/* Комната — вторым заголовком под именем объекта: лист по одной комнате
   должен отличаться от полного с первого взгляда. */
.print-doc__room {
  font-size: 15px;
  font-weight: 600;
  margin: 2px 0 0;
}

/* Пометка о сужении фильтром: не украшение, а предупреждение о неполном листе. */
.print-doc__note {
  font-size: 12px;
  font-weight: 600;
  margin: 2px 0 0;
}

.print-doc__swatch {
  border: 1px solid rgba(0, 0, 0, 0.25);
  border-radius: 2px;
  display: inline-block;
  height: 10px;
  margin-right: 6px;
  vertical-align: -1px;
  width: 10px;
}

.print-doc__sub {
  color: #57606a;
  font-size: 12px;
  margin: 2px 0 0;
}

.print-doc__group {
  margin-bottom: 14px;
}

/* Заголовок категории — её цветом, с полосой под ним: так же, как разделены
   категории на рукописном листе заказчика. */
.print-doc__group-title {
  border-bottom: 2px solid var(--print-color, #d0d7de);
  color: var(--print-color, #1f2328);
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 6px;
  padding-bottom: 3px;
}

.print-doc__table {
  border-collapse: collapse;
  width: 100%;
}

.print-doc__table th {
  border-bottom: 1px solid #d0d7de;
  color: #57606a;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px 3px 0;
  text-align: left;
  text-transform: uppercase;
}

.print-doc__table td {
  border-bottom: 1px solid #eaeef2;
  padding: 3px 8px 3px 0;
  vertical-align: top;
}

/* Цветная полоса слева у строки: по ней категория видна и там, где заголовок
   группы остался на предыдущей странице. */
.print-doc__row td:first-child {
  border-left: 3px solid var(--print-row-color, transparent);
  padding-left: 7px;
}

.print-doc__label {
  font-weight: 600;
  white-space: nowrap;
}

.print-doc__image {
  display: block;
  max-width: 100%;
}

.print-doc__foot {
  color: #57606a;
  font-size: 11px;
  margin-top: 10px;
}

/* Предпросмотр в диалоге: лист в рамке, прокрутка внутри. */
.export__preview {
  background: #ffffff;
  border: 1px solid #d0d7de;
  border-radius: 8px;
  max-height: 46vh;
  overflow: auto;
  padding: 12px 14px;
}

/* Кнопки выгрузки в шапке и поля диалогов. */
.export {
  display: flex;
  gap: 8px;
}

.export__body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 520px;
}

.export__controls {
  align-items: end;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.export__field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.export__field-label {
  color: var(--muted, #8b949e);
  font-size: 11px;
  text-transform: uppercase;
}

.export__toggle {
  align-items: center;
  display: flex;
  gap: 6px;
  padding-bottom: 6px;
}

.export__hint {
  color: var(--muted, #8b949e);
  font-size: 12px;
  margin: 0;
}

@media print {
  @page {
    margin: 12mm 10mm 16mm;
  }

  body.printing #app,
  body.printing #notifications {
    display: none !important;
  }

  body.printing #print-root {
    display: block;
  }

  body.printing {
    background: #ffffff;
  }

  /* Цвета категорий — смысл листа, а не украшение: без этого принтер съедает
     и заголовки, и полосы слева. */
  .print-doc,
  .print-doc * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .print-doc {
    font-size: 10.5pt;
    padding: 0;
  }

  .print-doc__title {
    font-size: 15pt;
  }

  .print-doc__room {
    font-size: 12.5pt;
  }

  .print-doc__group-title {
    break-after: avoid;
    page-break-after: avoid;
  }

  /* Шапка колонок повторяется на каждой странице, строка не рвётся пополам. */
  .print-doc__table thead {
    display: table-header-group;
  }

  .print-doc__row {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* Имя объекта — в колонтитуле на каждой странице. */
  .print-doc__foot {
    bottom: 0;
    left: 0;
    position: fixed;
    right: 0;
    border-top: 1px solid #d0d7de;
    padding-top: 3px;
  }

  .print-doc--scheme .print-doc__image {
    max-height: 96vh;
    object-fit: contain;
  }
}

/* Колонка делится так: секция по содержимому стоит на своём, растущая
   забирает остаток и прокручивается внутри себя. Раньше обе секции сжимались
   пропорционально своей высоте, и список из полусотни меток выдавливал
   «Свойства» за нижний край экрана — до них было не добраться. */
.panel__section {
  display: flex;
  flex-direction: column;
  min-height: 0;
  /* Не растёт: столько, сколько нужно содержимому. Пустая секция — это только
     заголовок, места у списка она не отнимает. Сжаться даёт себе только на
     низком экране, когда растущей секции уже нечего отдавать: лучше короткая
     секция со своей прокруткой, чем обрезанная нижним краем. */
  flex: 0 1 auto;
  /* Но и колонку целиком не занимает: дальше прокручивается своим телом. */
  max-height: 50%;
  border-bottom: 1px solid var(--panel-line);
}

.panel__section--grow {
  /* Основа ноль — иначе высота содержимого снова стала бы стартовым размером. */
  flex: 1 1 0;
  max-height: none;
  /* Список остаётся списком даже рядом с высокой соседкой. */
  min-height: 96px;
}

.panel__section:last-child {
  border-bottom: none;
}

.panel__title {
  margin: 0;
  padding: 10px 12px 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--panel-muted);
}

.panel__body {
  padding: 0 12px 12px;
  overflow: auto;
  min-height: 0;
}

#canvas-area {

  background: var(--canvas-bg);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#canvas-host,

  position: absolute;

}

#canvas-overlay {

}

#canvas-empty {

// strings.errors.codeTaken и подобные — шаблоны с {переменными}.
function text(key, vars) {
  let value = key.split(".").reduce((node, part) => (node == null ? node : node[part]), strings);
  if (typeof value !== "string") return key;
  if (vars) {
    for (const [name, replacement] of Object.entries(vars)) {
      value = value.split("{" + name + "}").join(String(replacement));
    }
  }
  return value;
}

// ——— арифметика цвета ——————————————————————————————————————————————————
//
// Переводы нужны окну выбора цвета: поле «насыщенность/яркость» живёт в HSV,
// поля R, G, B — в байтах, а хранится и рисуется всё в hex. Отдельно —
// расстояние между цветами: сравнивать сырые байты бесполезно, два далёких
// по числам цвета глаз читает как один. Поэтому цвета переводятся в CIE Lab
// (sRGB, D65) и меряются по ΔE76: ΔE ≈ 2 — предел различимости рядом,
// ΔE > 20 — «явно разные цвета».
function hexToRgb(value) {
  const hex = String(value == null ? "" : value).trim();
  if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return null;
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16),
  };
}

function colorByte(value) {
  const number = Math.round(Number(value));
  if (!Number.isFinite(number)) return 0;
  return Math.min(255, Math.max(0, number));
}
function rgbToHex(rgb) {
  const parts = [colorByte(rgb && rgb.r), colorByte(rgb && rgb.g), colorByte(rgb && rgb.b)];
  return "#" + parts.map((part) => part.toString(16).padStart(2, "0").toUpperCase()).join("");
}

// Оттенок — градусы 0…360 (360 сворачивается в 0), насыщенность и яркость — доли.
function rgbToHsv(rgb) {
  const r = colorByte(rgb && rgb.r) / 255;
  const g = colorByte(rgb && rgb.g) / 255;
  const b = colorByte(rgb && rgb.b) / 255;
  const max = Math.max(r, g, b);
  const min = Math.min(r, g, b);
  const span = max - min;
  let h = 0;
  if (span > 0) {
    if (max === r) h = 60 * (((g - b) / span) % 6);
    else if (max === g) h = 60 * ((b - r) / span + 2);
    else h = 60 * ((r - g) / span + 4);
  }
  if (h < 0) h += 360;
  return { h, s: max === 0 ? 0 : span / max, v: max };
}
function hsvToRgb(hsv) {
  const h = ((Number(hsv && hsv.h) || 0) % 360 + 360) % 360;
  const s = Math.min(1, Math.max(0, Number(hsv && hsv.s) || 0));
  const v = Math.min(1, Math.max(0, Number(hsv && hsv.v) || 0));
  const c = v * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = v - c;
  const sector = Math.floor(h / 60) % 6;
  const table = [
    [c, x, 0],
    [x, c, 0],
    [0, c, x],
    [0, x, c],
    [x, 0, c],
    [c, 0, x],
  ][sector];
  return {
    r: Math.round((table[0] + m) * 255),
    g: Math.round((table[1] + m) * 255),
    b: Math.round((table[2] + m) * 255),
  };
}

function colorLinear(byte) {
  const channel = byte / 255;
  return channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4;
}

// sRGB → XYZ (D65) → Lab. Константы — из определения пространства.
function colorToLab(rgb) {
  const r = colorLinear(rgb.r);
  const g = colorLinear(rgb.g);
  const b = colorLinear(rgb.b);
  const x = (r * 0.4124564 + g * 0.3575761 + b * 0.1804375) / 0.95047;
  const y = r * 0.2126729 + g * 0.7151522 + b * 0.072175;
  const z = (r * 0.0193339 + g * 0.119192 + b * 0.9503041) / 1.08883;
  const f = (t) => (t > 216 / 24389 ? Math.cbrt(t) : (841 / 108) * t + 4 / 29);
  return [116 * f(y) - 16, 500 * (f(x) - f(y)), 200 * (f(y) - f(z))];
}

// Неизвестный цвет ничего не ограничивает: расстояние до него бесконечно,
// и проверка «занят ли цвет» такой цвет просто не замечает.
function colorDistance(first, second) {
  const a = hexToRgb(first);
  const b = hexToRgb(second);
  if (!a || !b) return Number.POSITIVE_INFINITY;
  const left = colorToLab(a);
  const right = colorToLab(b);
  return Math.hypot(left[0] - right[0], left[1] - right[1], left[2] - right[2]);
}

// Ближе этого расстояния два цвета читаются как один и тот же: цвет палитры,
// рядом с которым уже стоит чужой, свободным не считается.
const COLOR_SAME_DISTANCE = 10;

// Свободный цвет: первый в палитре, рядом с которым ещё ничего не покрашено.
// Палитра кончилась — берём тот, что стоит дальше всех от занятых, а при
// равенстве самый редкий: слепой круг «следующий по счёту» повторял бы цвет
// соседней комнаты, даже когда в палитре есть менее ходовой.
function freeColor(used, options = {}) {
  const palette = Array.isArray(options.palette) && options.palette.length > 0 ? options.palette : ROOM_PALETTE;
  const limit = Number.isFinite(options.minDistance) ? options.minDistance : COLOR_SAME_DISTANCE;
  const taken = (Array.isArray(used) ? used : [])
    .map((value) => (hexToRgb(value) ? String(value).trim().toUpperCase() : null))
    .filter(Boolean);
  let best = null;
  for (const color of palette) {
    const key = String(color).trim().toUpperCase();
    let nearest = Number.POSITIVE_INFINITY;
    let count = 0;
    for (const other of taken) {
      const distance = colorDistance(color, other);
      if (distance < nearest) nearest = distance;
      if (other === key) count += 1;
    }
    if (nearest >= limit) return color;
    if (!best || nearest > best.nearest || (nearest === best.nearest && count < best.count)) {
      best = { color, nearest, count };
    }
  }
  return best ? best.color : palette[0];
}

// Заливка контура комнаты — её цвет, разведённый белизной плана. Метка
// рисуется поверх этой заливки цветом своей категории, поэтому смешивание
// нужно и окну выбора (показать, как цвет ляжет на план), и проверке
// «не потеряется ли метка в заливке».
function colorBlend(color, base, alpha) {
  const over = hexToRgb(color);
  const under = hexToRgb(base);
  if (!over || !under) return rgbToHex(over || under || { r: 0, g: 0, b: 0 });
  const share = Math.min(1, Math.max(0, Number(alpha) || 0));
  return rgbToHex({
    r: over.r * share + under.r * (1 - share),
    g: over.g * share + under.g * (1 - share),
    b: over.b * share + under.b * (1 - share),
  });
}

// Поле «насыщенность/яркость» окна выбора цвета: курсор ходит по прямоугольнику
// в долях от его размера — слева направо растёт насыщенность, сверху вниз
// падает яркость. Перевод в обе стороны живёт здесь, а не в панели: от него
// зависит, какой цвет получит пользователь, а ошибается он молча — цвет просто
// оказывается не тем, куда щёлкнули.
function colorFieldToHsv({ h, x, y }) {
  return {
    h: (((Number(h) || 0) % 360) + 360) % 360,
    s: Math.min(1, Math.max(0, Number(x) || 0)),
    v: 1 - Math.min(1, Math.max(0, Number(y) || 0)),
  };
}
function colorHsvToField(hsv) {
  return {
    x: Math.min(1, Math.max(0, Number(hsv && hsv.s) || 0)),
    y: 1 - Math.min(1, Math.max(0, Number(hsv && hsv.v) || 0)),
  };
}

// «Цвет уже занят»: не побайтное совпадение, а близость на глаз — иначе
// сосед, отличающийся на единицу в последнем разряде, считался бы свободным.
function colorTaken(color, used, minDistance = COLOR_SAME_DISTANCE) {
  return (Array.isArray(used) ? used : []).some((other) => colorDistance(color, other) < minDistance);
}

// Цвет, который глаз читает как «другой»: ΔE ниже — уже оттенок того же.
const COLOR_FAR_DISTANCE = 22;
// Границы яркости, в которых цвет виден и на белом плане, и на карандашных
// стенах (те же, по которым подобрана палитра).
const COLOR_MIN_LUMINANCE = 0.075;
const COLOR_MAX_LUMINANCE = 0.3;
const COLOR_RANDOM_TRIES = 60;

function colorLuminance(rgb) {
  return 0.2126 * colorLinear(rgb.r) + 0.7152 * colorLinear(rgb.g) + 0.0722 * colorLinear(rgb.b);
}

// Случайный цвет для кнопки «Случайный цвет»: наугад берётся оттенок, но
// годится не любой — слишком светлый потеряется на плане, слишком тёмный
// сольётся со стенами, а похожий на занятый не отличить от соседней комнаты.
// Не нашлось за отведённые попытки — отдаём свободный цвет палитры: лучше
// предсказуемый цвет, чем похожий на чужой.
function randomColor(used, options = {}) {
  const random = typeof options.random === "function" ? options.random : Math.random;
  const goal = Number.isFinite(options.minDistance) ? options.minDistance : COLOR_FAR_DISTANCE;
  const taken = (Array.isArray(used) ? used : []).filter((value) => hexToRgb(value));
  for (let attempt = 0; attempt < COLOR_RANDOM_TRIES; attempt += 1) {
    const rgb = hsvToRgb({ h: random() * 360, s: 0.5 + random() * 0.35, v: 0.42 + random() * 0.42 });
    const light = colorLuminance(rgb);
    if (light < COLOR_MIN_LUMINANCE || light > COLOR_MAX_LUMINANCE) continue;
    const color = rgbToHex(rgb);
    if (taken.every((other) => colorDistance(color, other) >= goal)) return color;
  }
  return freeColor(taken, { ...options, minDistance: goal });
}

// Первая метка с таким обозначением. Номер может повторяться намеренно
// (три светильника одной группы — Т1), и тогда это первая из них в порядке
// объекта; все повторы перечисляет `repeatedNumbers`.
function markByCode(project, code, number) {
  return (
    project.marks.find((mark) => {
      const type = findType(project, mark.typeId);
      return type && type.code === code && mark.number === number;
    }) || null
  );
}

function requireScheme(project, schemeId) {
  const scheme = findScheme(project, schemeId);
  if (!scheme) throw modelError("schemeNotFound");
  return scheme;
}

function requireType(project, typeId) {
  const type = findType(project, typeId);
  if (!type) throw modelError("typeNotFound");
  return type;
}

function requireMark(project, markId) {
  const mark = findMark(project, markId);
  if (!mark) throw modelError("markNotFound");
  return mark;
}

// ——— схемы ———————————————————————————————————————————————————————————
function addScheme(project, { name, imageId = null, width = 0, height = 0 } = {}) {
  const scheme = {
    id: newId(),
    name: String(name || "").trim() || strings.project.defaultSchemeName,
    imageId,
    width,
    height,
    order: project.schemes.length,
  };
  return { project: withProject(project, { schemes: [...project.schemes, scheme] }), scheme };
}
function updateScheme(project, schemeId, patch) {
  requireScheme(project, schemeId);
  const allowed = ["name", "imageId", "width", "height", "order"];
  const schemes = project.schemes.map((scheme) =>
    scheme.id === schemeId ? { ...scheme, ...pick(patch, allowed) } : scheme,
  );
  return { project: withProject(project, { schemes }), scheme: schemes.find((s) => s.id === schemeId) };
}

// Смена подложки: картинка другая, разметка та же. Доли меток и контуров не
// трогаются — при той же пропорции всё встаёт на свои места само, при другой
// разметка поедет, и спросить об этом обязан вызывающий, до правки.
// Пересчитывается только то, что задано в пикселях плана, — смещения подписей:
// на картинке вдвое крупнее прежние 12 px означали бы вдвое меньший отступ.
function replaceSchemeImage(project, schemeId, { imageId, width, height } = {}) {
  const scheme = requireScheme(project, schemeId);
  if (typeof imageId !== "string" || imageId === "") throw modelError("imageRequired");
  const nextWidth = Math.round(Number(width));
  const nextHeight = Math.round(Number(height));
  if (!(nextWidth > 0) || !(nextHeight > 0)) throw modelError("planSizeInvalid");
  const scaleX = scheme.width > 0 ? nextWidth / scheme.width : 1;
  const scaleY = scheme.height > 0 ? nextHeight / scheme.height : 1;
  const scaleOffset = (offset) =>
    offset ? { dx: roundOffset(offset.dx * scaleX), dy: roundOffset(offset.dy * scaleY) } : offset;
  const schemes = project.schemes.map((item) =>
    item.id === schemeId ? { ...item, imageId, width: nextWidth, height: nextHeight } : item,
  );
  const marks = project.marks.map((mark) =>
    mark.schemeId === schemeId && mark.labelOffset ? { ...mark, labelOffset: scaleOffset(mark.labelOffset) } : mark,
  );
  const groups = project.groups.map((group) =>
    group.schemeId === schemeId && group.labelOffset
      ? { ...group, labelOffset: scaleOffset(group.labelOffset) }
      : group,
  );
  return {
    project: withProject(project, { schemes, marks, groups }),
    scheme: schemes.find((item) => item.id === schemeId),
  };
}

function roundOffset(value) {
  return Math.round(Number(value) * 100) / 100;
}

// Какие картинки объекту нужны: по этому списку хранилище понимает, что в нём
// осталось от прежних подложек и больше никому не принадлежит.
function usedImageIds(project) {
  const ids = new Set();
  for (const scheme of (project && project.schemes) || []) {
    if (scheme.imageId) ids.add(scheme.imageId);
  }
  return ids;
}
function deleteScheme(project, schemeId) {
  requireScheme(project, schemeId);
  const marks = project.marks.filter((mark) => mark.schemeId !== schemeId);
  const groups = project.groups.filter((group) => group.schemeId !== schemeId);
  // Контуры помещений живут на схеме — вместе с ней и уходят.
  const outlines = outlinesOf(project).filter((outline) => outline.schemeId !== schemeId);
  const schemes = project.schemes
    .filter((scheme) => scheme.id !== schemeId)
    .map((scheme, index) => ({ ...scheme, order: index }));
  return { project: withProject(project, { schemes, marks, groups, outlines }) };
}

// Единственный порядок справочника: категории по своему order, типы внутри —
// по своему. Им пользуются и окно выбора типа, и легенда в выгрузке, и таблицы:
// разойдись они — на бумаге окажется не тот порядок, что на экране.
function typesInOrder(project) {
  if (!project) return [];
  return project.categories
    .map((category, index) => ({ category, order: category.order == null ? index : category.order }))
    .sort((a, b) => a.order - b.order)
    .map(({ category }) => ({
      category,
      types: project.markTypes
        .filter((type) => type.categoryId === category.id)
        .map((type, index) => ({ type, order: type.order == null ? index : type.order }))
        .sort((a, b) => a.order - b.order)
        .map((item) => item.type),
    }))
    .filter((group) => group.types.length > 0);
}

// Поиск типа по строке из окна «Тип метки»: по коду с начала и по названию
// в любом месте, без учёта регистра. Точное совпадение кода идёт первым —
// и в своей категории, и среди категорий: «Р» — это Розетка, а не «Подсветка
// кровати», где та же буква стоит в середине названия. Порядок всего
// остального — порядок справочника, своей сортировки здесь нет.
// Пустой запрос отдаёт справочник целиком.
function typeMatchesQuery(type, needle) {
  if (!needle) return true;
  return type.code.toLowerCase().startsWith(needle) || type.name.toLowerCase().includes(needle);
}

function typeExactRank(type, needle) {
  return type && needle && type.code.toLowerCase() === needle ? 1 : 0;
}
function searchTypes(project, query) {
  const needle = String(query == null ? "" : query).trim().toLowerCase();
  const groups = typesInOrder(project)
    .map(({ category, types }) => ({
      category,
      types: types
        .filter((type) => typeMatchesQuery(type, needle))
        .sort((a, b) => typeExactRank(b, needle) - typeExactRank(a, needle)),
    }))
    .filter((group) => group.types.length > 0);
  return groups.sort((a, b) => typeExactRank(b.types[0], needle) - typeExactRank(a.types[0], needle));
}

// Порядок помещений — порядок появления: их заводят по ходу разметки, и этот
// порядок пользователю знаком. Живёт рядом со schemesInOrder и typesInOrder:
// порядок сущностей объекта — правило объекта, а не панели.
function roomsInOrder(project) {
  return project && Array.isArray(project.rooms) ? [...project.rooms] : [];
}

// Порядок схем объекта — одно правило на всех: нумерация, панели и выгрузки
// обходят схемы одинаково.
function schemesInOrder(project) {
  return project.schemes
    .map((scheme, index) => ({ scheme, index }))
    .sort((a, b) => {
      const orderA = a.scheme.order ?? a.index;
      const orderB = b.scheme.order ?? b.index;
      return orderA === orderB ? a.index - b.index : orderA - orderB;
    })
    .map((item) => item.scheme);
}

function pick(source, allowed) {
  const result = {};
  if (!source) return result;
  for (const key of allowed) {
    if (Object.prototype.hasOwnProperty.call(source, key)) result[key] = clone(source[key]);
  }
  return result;
}

// ——— метки ———————————————————————————————————————————————————————————

function normalizePoints(points) {
  if (!Array.isArray(points) || points.length === 0) throw modelError("noPoints");
  return points.map((point) => ({ x: Number(point.x), y: Number(point.y) }));
}

// Самый большой номер, выданный меткам этого кода типа.
function highestNumber(project, code) {
  let top = 0;
  for (const mark of project.marks) {
    const type = findType(project, mark.typeId);
    if (type && type.code === code && mark.number > top) top = mark.number;
  }
  return top;
}

// Следующий свободный номер типа. Счётчик ведёт нумерацию и только растёт, но
// выше него может оказаться номер, поставленный вручную, или счётчик, потерянный
// при переносе объекта, — поэтому на занятые номера смотрим тоже: новая метка
// получает свободный номер, а не молчаливый дубль.
function nextNumber(project, counters, code) {
  return Math.max(counters[code] || 0, highestNumber(project, code)) + 1;
}

function makeMark({ schemeId, typeId, kind, points, number, groupId = null }) {
  return {
    id: newId(),
    schemeId,
    typeId,
    number,
    kind,
    points,
    closed: false,
    groupId,
    labelOffset: null,
    roomId: null,
    // Помещение проставляет автоматика по контуру, пока пользователь не вписал
    // его руками: после этого метка принадлежит ему, а не сервису.
    roomManual: false,
    location: "",
    original: "",
  };
}
function addMark(project, { schemeId, typeId, kind = "point", points, blockMode } = {}) {
  requireScheme(project, schemeId);
  const type = requireType(project, typeId);
  if (!MARK_KINDS.includes(kind)) throw modelError("unknownKind");
  const vertices = normalizePoints(points);
  if (kind === "line" && vertices.length < 2) throw modelError("shortLine");

  const mode = blockMode || type.blockMode || "each";
  if (!BLOCK_MODES.includes(mode)) throw modelError("unknownBlockMode");

  const counters = { ...project.counters };
  const created = [];

  if (kind === "point" && vertices.length > 1 && mode === "each") {
    for (const point of vertices) {
      const number = nextNumber(project, counters, type.code);
      counters[type.code] = number;
      created.push(makeMark({ schemeId, typeId, kind, points: [point], number }));
    }
  } else {
    const number = nextNumber(project, counters, type.code);
    counters[type.code] = number;
    created.push(makeMark({ schemeId, typeId, kind, points: vertices, number }));
  }

  let groups = project.groups;
  let group = null;
  if (created.length > 1) {
    group = {
      id: newId(),
      schemeId,
      markIds: created.map((mark) => mark.id),
      labelOffset: null,
    };
    for (const mark of created) mark.groupId = group.id;
    groups = [...groups, group];
  }

  const next = withProject(project, { marks: [...project.marks, ...created], groups, counters });
  return { project: next, mark: created[0], marks: created, group };
}

// ——— обозначения —————————————————————————————————————————————————————
function labelOf(project, id) {
  const mark = findMark(project, id);
  if (mark) return markLabel(project, mark);
  const group = findGroup(project, id);
  if (group) return blockLabel(project, group.markIds);
  return "";
}

function markLabel(project, mark) {
  const type = findType(project, mark.typeId);
  return (type ? type.code : "?") + mark.number;
}

// Порядок меток внутри блока — один на всё приложение: сперва порядок типа
// в справочнике (тот же typesInOrder, что у легенды и таблиц), потом номер.
// По нему собирается подпись и по нему же берут ведущую метку блока — ту,
// с которой подпись начинается. В смешанном блоке это не обязательно та,
// которую поставили первой.
function blockMembers(project, markIds) {
  const order = new Map();
  let index = 0;
  for (const { types } of typesInOrder(project)) for (const type of types) order.set(type.id, index++);
  const rank = (mark) => (order.has(mark.typeId) ? order.get(mark.typeId) : Number.MAX_SAFE_INTEGER);
  return (markIds || [])
    .map((markId, position) => ({ mark: findMark(project, markId), position }))
    .filter((item) => item.mark)
    .sort((a, b) => {
      if (rank(a.mark) !== rank(b.mark)) return rank(a.mark) - rank(b.mark);
      if (a.mark.number !== b.mark.number) return a.mark.number - b.mark.number;
      return a.position - b.position;
    })
    .map((item) => item.mark);
}

// Подпись блока: подряд идущие номера одного типа склеиваются слитно,
// разнородные — через запятую («В1, Р1» — выключатель и розетка в одной рамке).
// Список меток задаёт вызывающий: у группы это её метки, а на плане под
// фильтром — только видимые, иначе подпись обещает то, чего на листе нет.
function blockLabel(project, markIds) {
  const runs = [];
  let previous = null;
  // Повторённый номер называется один раз: подпись перечисляет обозначения,
  // а не метки, и «Т1, Т1» на плане говорит о двух точках ровно то же, что «Т1».
  const named = new Set();
  for (const mark of blockMembers(project, markIds)) {
    const type = findType(project, mark.typeId);
    const code = type ? type.code : "?";
    const key = code + "\u0000" + mark.number;
    if (named.has(key)) continue;
    named.add(key);
    const sameRun = previous && previous.code === code && mark.number === previous.number + 1;
    if (sameRun) runs[runs.length - 1].numbers.push(mark.number);
    else runs.push({ code, numbers: [mark.number] });
    previous = { code, number: mark.number };
  }
  return runs.map(blockRunLabel).join(", ");
}

// Подряд идущие номера одного типа: короткий код склеивается слитно («В1В2В3»),
// длинный сворачивается в диапазон («ПОДСВЕТКА1–3») — иначе подпись блока на
// плане нечитаема.
function blockRunLabel(run) {
  if ([...run.code].length <= CODE_GLUE_MAX) return run.numbers.map((number) => run.code + number).join("");
  if (run.numbers.length === 1) return run.code + run.numbers[0];
  return run.code + run.numbers[0] + "–" + run.numbers[run.numbers.length - 1];
}

// Хозяин новой точки в режиме «одна метка на блок» — метка того же типа:
// сама соседка, если тип совпал, иначе первая метка этого типа в блоке.
// Своей метки этого типа в блоке может и не быть — тогда её ставят первой.
function blockHost(project, mark, typeId) {
  if (mark.typeId === typeId) return mark;
  const group = findGroup(project, mark.groupId);
  if (!group) return null;
  for (const id of group.markIds) {
    const member = findMark(project, id);
    if (member && member.typeId === typeId && member.kind === "point") return member;
  }
  return null;
}

// Режим блока берётся у типа ставящейся метки, а не у соседней: в смешанном
// блоке выключатели могут идти «каждая своя», а розетки — «одна на блок».
// Исключение одно: метка, уже собранная как «одна на блок», растёт точками
// независимо от умолчания типа — её собственная форма важнее справочника.
function blockModeOf(mark, type) {
  if (mark.typeId === type.id && mark.kind === "point" && mark.points.length > 1) return "single";
  return type.blockMode || "each";
}

// Соседняя точка блока: сдвиг на шаг плана в долях от размера схемы.
// `options.typeId` — тип ставящейся метки (в одной рамке подрозетника рядом
// с выключателем стоит розетка); по умолчанию — тип соседней метки.
// Номер новая метка получает по счётчику своего типа.
function addToGroup(project, markId, side, options = {}) {
  const mark = requireMark(project, markId);
  if (mark.kind !== "point") throw modelError("blockOnlyForPoints");
  if (!BLOCK_SIDES.includes(side)) throw modelError("unknownSide");
  const scheme = requireScheme(project, mark.schemeId);
  const type = requireType(project, options.typeId || mark.typeId);
  const stepPx = options.step || BLOCK_STEP_PX;
  const dx = stepPx / (scheme.width > 0 ? scheme.width : BLOCK_FALLBACK_SIZE_PX);
  const dy = stepPx / (scheme.height > 0 ? scheme.height : BLOCK_FALLBACK_SIZE_PX);
  const from = mark.points[mark.points.length - 1];
  const point = {
    x: clampFraction(from.x + (side === "left" ? -dx : side === "right" ? dx : 0)),
    y: clampFraction(from.y + (side === "up" ? -dy : side === "down" ? dy : 0)),
  };

  const mode = options.blockMode || blockModeOf(mark, type);
  const host = mode === "single" ? blockHost(project, mark, type.id) : null;
  if (host) {
    const grown = updateMark(project, host.id, { points: [...host.points, point] });
    return { project: grown.project, mark: grown.mark, group: findGroup(project, mark.groupId) };
  }

  const counters = { ...project.counters };
  const number = nextNumber(project, counters, type.code);
  counters[type.code] = number;
  const created = makeMark({
    schemeId: mark.schemeId,
    typeId: type.id,
    kind: "point",
    points: [point],
    number,
    groupId: mark.groupId,
  });

  let groups = project.groups;
  let group = findGroup(project, mark.groupId);
  let marks = [...project.marks, created];
  if (group) {
    groups = groups.map((item) =>
      item.id === group.id ? { ...item, markIds: [...item.markIds, created.id] } : item,
    );
    group = groups.find((item) => item.id === group.id);
  } else {
    group = { id: newId(), schemeId: mark.schemeId, markIds: [markId, created.id], labelOffset: null };
    created.groupId = group.id;
    groups = [...groups, group];
    marks = marks.map((item) => (item.id === markId ? { ...item, groupId: group.id } : item));
  }
  return { project: withProject(project, { marks, groups, counters }), mark: created, group };
}

function clampFraction(value) {
  return Math.min(1, Math.max(0, value));
}

const MARK_PATCH_FIELDS = ["points", "closed", "labelOffset", "roomId", "roomManual", "location", "original"];
function updateMark(project, markId, patch) {
  requireMark(project, markId);
  const changes = pick(patch, MARK_PATCH_FIELDS);
  if (Object.prototype.hasOwnProperty.call(changes, "points")) {
    changes.points = normalizePoints(changes.points);
  }
  const marks = project.marks.map((mark) => (mark.id === markId ? { ...mark, ...changes } : mark));
  return { project: withProject(project, { marks }), mark: marks.find((mark) => mark.id === markId) };
}

// Счётчик не трогаем: номер остаётся дырой, чтобы распечатка не протухла.
function deleteMark(project, markId) {
  const mark = requireMark(project, markId);
  const marks = project.marks.filter((item) => item.id !== markId);
  const groups = [];
  const dissolved = [];
  for (const group of project.groups) {
    if (!group.markIds.includes(markId)) {
      groups.push(group);
      continue;
    }
    const markIds = group.markIds.filter((id) => id !== markId);
    if (markIds.length >= 2) groups.push({ ...group, markIds });
    else dissolved.push({ ...group, markIds });
  }
  const freed = new Set(dissolved.flatMap((group) => group.markIds));
  const cleaned = marks.map((item) => (freed.has(item.id) ? { ...item, groupId: null } : item));
  return { project: withProject(project, { marks: cleaned, groups }), deleted: mark };
}

// ——— нумерация ———————————————————————————————————————————————————————

// Верхняя граница ручного номера: опечатка в поле не должна унести счётчик типа
// в тысячи и выдать следующей метке Т100001.
const MARK_NUMBER_MAX = 9999;

function normalizeNumber(value) {
  const number = typeof value === "string" ? Number(value.trim()) : Number(value);
  if (!Number.isInteger(number) || number < 1) throw modelError("badNumber");
  if (number > MARK_NUMBER_MAX) throw modelError("numberTooBig", { max: MARK_NUMBER_MAX });
  return number;
}

// Номер ставится руками: несколько одинаковых светильников, подключённых к одной
// группе, носят на схеме один номер — Т1, Т1, Т1. Повтор здесь приём, а не
// ошибка, поэтому он не запрещён; видимым его делает `validate`.
function setMarkNumber(project, markId, number) {
  const mark = requireMark(project, markId);
  const value = normalizeNumber(number);
  if (mark.number === value) return { project, mark };
  const marks = project.marks.map((item) => (item.id === markId ? { ...item, number: value } : item));
  // Счётчик не опускается ниже занятого номера: следующая новая метка типа
  // должна получить свободный номер, а не повторить поставленный вручную.
  const type = findType(project, mark.typeId);
  const counters = type
    ? { ...project.counters, [type.code]: Math.max(project.counters[type.code] || 0, value) }
    : project.counters;
  return { project: withProject(project, { marks, counters }), mark: marks.find((item) => item.id === markId) };
}

// Порядок обхода: схемы по order, внутри схемы — порядок постановки меток.
function marksInOrder(project, filter) {
  const schemeOrder = new Map(schemesInOrder(project).map((scheme, index) => [scheme.id, index]));
  return project.marks
    .map((mark, index) => ({ mark, index }))
    .filter((item) => (filter ? filter(item.mark) : true))
    .sort((a, b) => {
      const orderA = schemeOrder.has(a.mark.schemeId) ? schemeOrder.get(a.mark.schemeId) : Number.MAX_SAFE_INTEGER;
      const orderB = schemeOrder.has(b.mark.schemeId) ? schemeOrder.get(b.mark.schemeId) : Number.MAX_SAFE_INTEGER;
      return orderA === orderB ? a.index - b.index : orderA - orderB;
    })
    .map((item) => item.mark);
}

// Возвращает список замен и уже уплотнённый объект; применять или нет —
// решает вызывающий: исходный project не меняется.
function compactNumbers(project, typeId) {
  const type = requireType(project, typeId);
  const ordered = marksInOrder(project, (mark) => mark.typeId === typeId);
  const changes = [];
  const numbers = new Map();
  // Номер выдаётся не метке, а номеру: первое появление старого номера в порядке
  // обхода забирает следующий свободный, а всякий его повтор получает тот же

  // уплотнение, а ряд номеров смыкается без дыр.
  const renumbered = new Map();

}

// Повторяющиеся обозначения: метки одного типа с одним номером. Повтор
// разрешён — три точечных светильника одной группы носят Т1, — но собирается
// сюда, чтобы список меток и `validate` показали его, а случайный дубль не

    .filter((item) => item.markIds.length > 1)
    .map((item) => ({ ...item, count: item.markIds.length }))
    .sort((a, b) => (rank(a.typeId) === rank(b.typeId) ? a.number - b.number : rank(a.typeId) - rank(b.typeId)));

// Новый номер по новому типу; старый номер остаётся дырой.
function changeMarkType(project, markId, typeId) {
  const mark = requireMark(project, markId);

  const counters = { ...project.counters };
  const number = nextNumber(project, counters, type.code);
  counters[type.code] = number;

    item.id === markId ? { ...item, typeId, number } : item,

// ——— справочник ———————————————————————————————————————————————————————

/**

 * Это единственный ответ на вопрос во всей сборке — панелям своей копии

// Все цвета объекта, которые уже чем-то заняты: и комнаты, и категории.
// Одним списком, потому что на плане они встречаются — метка категории лежит
// поверх заливки комнаты, и повтор цвета там означает потерянную метку.

    if (category.id === options.exceptCategoryId) continue;
    if (category.color) colors.push(category.color);
  }
  for (const room of project.rooms || []) {
    if (room.id === options.exceptRoomId) continue;
    if (room.color) colors.push(room.color);

// Цвет новой комнаты: незанятый цвет палитры — незанятый и комнатами,

    const next = { ...room };

    if (Object.prototype.hasOwnProperty.call(patch, "color")) {

  // «без помещения» остаётся решением пользователя, и контур его не перебьёт.
  const marks = project.marks.map((mark) => (mark.roomId === roomId ? { ...mark, roomId: null } : mark));
  const outlines = outlinesOf(project).filter((outline) => outline.roomId !== roomId);
  return { project: withProject(project, { rooms, marks, outlines }), deleted: room };
}

// ——— контуры помещений ————————————————————————————————————————————————
//
// План загружается на весь объект одной картинкой, а комната обводится по
// стенам замкнутым многоугольником — с эркерами, нишами и Г-образной формой.
// Контур принадлежит схеме: у одной комнаты на разных этажах свои обводки.

// Площадь многоугольника (формула шнурков) в долях плана. Знак обхода не важен:
// сравнивать площади надо и у контура, нарисованного по часовой, и против.
function outlineArea(points) {
  const list = Array.isArray(points) ? points : [];
  if (list.length < OUTLINE_MIN_POINTS) return 0;
  let sum = 0;
  for (let i = 0, j = list.length - 1; i < list.length; j = i, i += 1) {
    sum += (list[j].x + list[i].x) * (list[j].y - list[i].y);
  }
  return Math.abs(sum) / 2;
}

// Точка внутри многоугольника — луч вправо и счёт пересечений. Форма любая:
// для невыпуклой комнаты вырез считается наружной частью, ради чего всё и
// затевалось (рамка Г-образной комнаты накрывает вырез, контур — нет).
function pointInOutline(point, points) {
  const list = Array.isArray(points) ? points : [];
  if (!point || list.length < OUTLINE_MIN_POINTS) return false;
  let inside = false;
  for (let i = 0, j = list.length - 1; i < list.length; j = i, i += 1) {
    const a = list[i];
    const b = list[j];
    const crosses = a.y > point.y !== b.y > point.y;
    if (crosses && point.x < ((b.x - a.x) * (point.y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
  }

// Порядок контуров схемы — от большего к меньшему. Один порядок на всё:
// рисование (меньший ложится поверх большего) и попадание точки (комната
// внутри комнаты выигрывает). Своей сортировки заводить негде.

  return outlinesOf(project)
    .filter((outline) => !schemeId || outline.schemeId === schemeId)
    .map((outline) => ({ outline, area: outlineArea(outline.points) }))
    .sort((a, b) => b.area - a.area)

// Контур под точкой: последний из порядка, то есть наименьший по площади.

// ——— правка вершин контура ————————————————————————————————————————————
//
// Обводка по стенам с первого раза не выходит: вершину двигают, добавляют
// между соседними и удаляют. Всё через updateOutline — второго места, где
// меняются точки контура, нет.

// ——— автопривязка метки к помещению ——————————————————————————————————
//
// Решение заказчика: «Подставлять автоматически, ручная правка главнее».
// Метка внутри контура получает его помещение сама, вне всех контуров — поле
// пустое. Метку, которой помещение вписали руками (`roomManual`), автоматика
// не трогает больше никогда: ни при перемещении, ни при перерисовке контура.
// Вписано ли помещение метки руками. Объекты, размеченные до появления
// контуров, признака не знают вовсе — и там помещение могло взяться только
// из рук: такую метку автоматика тоже не трогает, иначе первая же правка

  const changed = [];

    if (markRoomManual(mark)) return mark;
    if (schemeId && mark.schemeId !== schemeId) return mark;
    const point = Array.isArray(mark.points) && mark.points.length > 0 ? mark.points[0] : null;
    const roomId = point ? roomAtPoint(project, mark.schemeId, point) : null;
    if ((mark.roomId || null) === roomId) return mark;

  const next = {};

  if (Object.prototype.hasOwnProperty.call(patch, "view")) next.view = { ...project.view, ...patch.view };

// Цвет — всегда у категории; форма у типа, если задана, иначе у категории.
function styleOf(project, typeId) {
  const type = findType(project, typeId);

    color: category ? category.color : FALLBACK_COLOR,

// ——— проверка объекта —————————————————————————————————————————————————

// Вид проблемы: «error» — объект поломан, «warning» — сделано намеренно, но
// стоит увидеть. Повтор номера — единственное предупреждение: запрещать его
// нельзя, молчать о нём тоже.
function problem(code, vars, ref, kind) {
  return { code, message: text("problems." + code, vars), ref: ref || null, kind: kind || "error" };
}
function validate(project) {
  const problems = [];

  const seenCodes = new Map();
  for (const type of project.markTypes) {
    const key = type.code.toUpperCase();
    if (seenCodes.has(key)) problems.push(problem("duplicateCode", { code: type.code }, type.id));
    else seenCodes.set(key, type.id);
    if (!findCategory(project, type.categoryId)) problems.push(problem("typeWithoutCategory", null, type.id));
  }

  const behindTypes = new Map();
  for (const mark of project.marks) {
    const type = findType(project, mark.typeId);
    if (!type) problems.push(problem("markWithoutType", null, mark.id));
    if (!findScheme(project, mark.schemeId)) problems.push(problem("markWithoutScheme", null, mark.id));
    if (mark.roomId && !findRoom(project, mark.roomId)) problems.push(problem("markWithoutRoom", null, mark.id));
    if (!Array.isArray(mark.points) || mark.points.length === 0) problems.push(problem("emptyPoints", null, mark.id));
    else if (mark.kind === "line" && mark.points.length < 2) problems.push(problem("shortLine", null, mark.id));

    if (type) {
      const counter = project.counters[type.code] || 0;
      if (mark.number > counter) behindTypes.set(type.id, type.code);
    }
  }

  // Отставший счётчик — свойство типа, а не каждой его метки.
  for (const [id, code] of behindTypes) problems.push(problem("counterBehind", { code }, id));

  // Повтор номера — приём заказчика, а не поломка: одно предупреждение на
  // обозначение, с числом меток, чтобы случайный дубль было видно.
  for (const item of repeatedNumbers(project)) {
    problems.push(problem("repeatedNumber", { label: item.label, count: item.count }, item.markIds[0], "warning"));
  }

  for (const outline of outlinesOf(project)) {
    if (!findScheme(project, outline.schemeId)) problems.push(problem("outlineWithoutScheme", null, outline.id));
    if (!findRoom(project, outline.roomId)) problems.push(problem("outlineWithoutRoom", null, outline.id));
    if (!Array.isArray(outline.points) || outline.points.length < OUTLINE_MIN_POINTS) {
      problems.push(problem("shortOutline", null, outline.id));
    }
  }

  for (const group of project.groups) {
    const members = group.markIds.map((markId) => findMark(project, markId)).filter(Boolean);
    if (members.length < 2) problems.push(problem("smallGroup", null, group.id));
    if (new Set(members.map((mark) => mark.schemeId)).size > 1) {
      problems.push(problem("groupAcrossSchemes", null, group.id));
    }
  }

  return problems;
}

// src/store.js
// Хранение в браузере: IndexedDB своими руками, без единой зависимости.
// База `scheme-markup`, хранилища `projects` (документ объекта), `images`
// (Blob планов) и `settings` (ключ-значение).
//
// Правило файла: потеря хранилища не должна ронять приложение. По file://
// IndexedDB доступен не везде, в приватном окне запись может отказать в любой
// момент — тогда store переходит в память, сообщает о беде подписчикам
// (панель показывает строку и советует выгрузить проект в файл) и продолжает
// работать. Данные сеанса живут в памяти в любом случае.
const STORE_DB_NAME = "scheme-markup";
const STORE_DB_VERSION = 1;
const STORE_NAMES = { projects: "projects", images: "images", settings: "settings" };
// Ниже этого порога свободного места пользователя предупреждают заранее.
const STORE_LOW_SPACE_BYTES = 50 * 1024 * 1024;
// Открытие базы иногда не отвечает вовсе (приватное окно, заблокированная
// вкладка): ждём ограниченное время и уходим в память.
const STORE_OPEN_TIMEOUT_MS = 4000;

const storeMemory = { projects: new Map(), images: new Map(), settings: new Map() };
const storeListeners = new Set();
let storeDb = null;
let storeModeValue = "unknown";
let storeOpening = null;
let storeReported = false;
let storeWriteReported = false;
function storeMode() {
  return storeModeValue;
}
function onStoreProblem(listener) {
  storeListeners.add(listener);
  return () => storeListeners.delete(listener);
}

function reportStoreProblem(kind, error) {
  const problem = { kind, error: error || null };
  for (const listener of [...storeListeners]) {
    try {
      listener(problem);
    } catch (ignored) {
      /* подписчик не должен ломать запись */
    }
  }
}

function newStoreId() {
  return crypto.randomUUID();
}

function idbRequest(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("indexeddb-failed"));
  });
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined" || indexedDB === null) {
      reject(new Error("indexeddb-unavailable"));
      return;
    }
    let settled = false;
    const finish = (fn, value) => {
      if (settled) return;
      settled = true;
      fn(value);
    };
    const timer = setTimeout(() => finish(reject, new Error("indexeddb-timeout")), STORE_OPEN_TIMEOUT_MS);
    let request;
    try {
      request = indexedDB.open(STORE_DB_NAME, STORE_DB_VERSION);
    } catch (error) {
      clearTimeout(timer);
      finish(reject, error);
      return;
    }
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(STORE_NAMES.projects)) {
        db.createObjectStore(STORE_NAMES.projects, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(STORE_NAMES.images)) {
        db.createObjectStore(STORE_NAMES.images, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(STORE_NAMES.settings)) {
        db.createObjectStore(STORE_NAMES.settings, { keyPath: "key" });
      }
    };
    request.onsuccess = () => {
      clearTimeout(timer);
      finish(resolve, request.result);
    };
    request.onerror = () => {
      clearTimeout(timer);
      finish(reject, request.error || new Error("indexeddb-failed"));
    };
    request.onblocked = () => {
      clearTimeout(timer);
      finish(reject, new Error("indexeddb-blocked"));
    };
  });
}
async function openStore() {
  if (storeModeValue !== "unknown") return storeModeValue;
  if (!storeOpening) {
    storeOpening = openDatabase()
      .then((db) => {
        storeDb = db;
        storeModeValue = "idb";
        db.onclose = () => degradeToMemory(new Error("indexeddb-closed"));
        return storeModeValue;
      })
      .catch((error) => {
        degradeToMemory(error);
        return storeModeValue;
      });
  }
  return storeOpening;
}

function degradeToMemory(error) {
  storeDb = null;
  storeModeValue = "memory";
  if (storeReported) return;
  storeReported = true;
  reportStoreProblem("unavailable", error);
}

// Одна транзакция — одно действие: запись документа объекта атомарна, вкладка,
// закрытая посреди сохранения, оставляет прежнее состояние, а не половину.
async function runTransaction(name, mode, action) {
  await openStore();
  if (storeModeValue !== "idb" || !storeDb) return { ok: false, memory: true };
  try {
    return await new Promise((resolve, reject) => {
      const tx = storeDb.transaction(name, mode);
      let result;
      tx.oncomplete = () => {
        if (mode === "readwrite") storeWriteReported = false;
        resolve({ ok: true, result });
      };
      tx.onerror = () => reject(tx.error || new Error("indexeddb-failed"));
      tx.onabort = () => reject(tx.error || new Error("indexeddb-aborted"));
      Promise.resolve(action(tx.objectStore(name)))
        .then((value) => {
          result = value;
        })
        .catch((error) => {
          try {
            tx.abort();
          } catch (ignored) {
            /* транзакция уже завершилась */
          }
          reject(error);
        });
    });
  } catch (error) {
    // Автосохранение идёт на каждую правку: об отказавшей записи говорим один
    // раз — до тех пор, пока запись снова не пройдёт.
    if (mode === "readwrite" && !storeWriteReported) {
      storeWriteReported = true;
      reportStoreProblem("writeFailed", error);
    }
    return { ok: false, error };
  }
}

// ——— объекты ——————————————————————————————————————————————————————————
async function listProjects() {
  const summaries = new Map();
  const read = await runTransaction(STORE_NAMES.projects, "readonly", (store) => idbRequest(store.getAll()));
  if (read.ok) {
    for (const doc of read.result || []) summaries.set(doc.id, summaryOf(doc));
  }
  for (const doc of storeMemory.projects.values()) summaries.set(doc.id, summaryOf(doc));
  return [...summaries.values()].sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
}

function summaryOf(project) {
  return {
    id: project.id,
    name: project.name,
    updatedAt: project.updatedAt,
    schemes: (project.schemes || []).length,
    marks: (project.marks || []).length,
  };
}
async function loadProject(id) {
  if (!id) return null;
  if (storeMemory.projects.has(id)) return storeMemory.projects.get(id);
  const read = await runTransaction(STORE_NAMES.projects, "readonly", (store) => idbRequest(store.get(id)));
  return read.ok && read.result ? read.result : null;
}

// Отказ записи не теряет работу: документ остаётся в памяти сеанса, а панель
// получает повод предложить выгрузку в файл.
async function saveProject(project) {
  if (!project || !project.id) return { ok: false };
  const written = await runTransaction(STORE_NAMES.projects, "readwrite", (store) =>
    idbRequest(store.put(project)),
  );
  if (written.ok) {
    storeMemory.projects.delete(project.id);
    return { ok: true, mode: "idb" };
  }
  storeMemory.projects.set(project.id, project);
  return { ok: false, mode: "memory", error: written.error || null };
}
async function deleteProject(id) {
  storeMemory.projects.delete(id);
  const removed = await runTransaction(STORE_NAMES.projects, "readwrite", (store) => idbRequest(store.delete(id)));
  return { ok: removed.ok || storeModeValue === "memory" };
}

// ——— изображения ——————————————————————————————————————————————————————
async function putImage(blob) {
  const id = newStoreId();
  const written = await runTransaction(STORE_NAMES.images, "readwrite", (store) =>
    idbRequest(store.put({ id, blob, type: blob.type || "", size: blob.size || 0 })),
  );
  if (!written.ok) storeMemory.images.set(id, blob);
  return id;
}
async function getImage(id) {
  if (!id) return null;
  if (storeMemory.images.has(id)) return storeMemory.images.get(id);
  const read = await runTransaction(STORE_NAMES.images, "readonly", (store) => idbRequest(store.get(id)));
  return read.ok && read.result ? read.result.blob : null;
}
async function deleteImage(id) {
  if (!id) return { ok: true };
  storeMemory.images.delete(id);
  const removed = await runTransaction(STORE_NAMES.images, "readwrite", (store) => idbRequest(store.delete(id)));
  return { ok: removed.ok || storeModeValue === "memory" };
}

// ——— уборка ———————————————————————————————————————————————————————————

// Картинки лежат общей кучей на все объекты, поэтому «ничья» — та, на которую
// не ссылается ни один объект. Чистая половина уборки: её и проверяют тесты.
function orphanImageIds(projects, storedIds) {
  const used = new Set();
  for (const project of projects || []) {
    for (const id of usedImageIds(project)) used.add(id);
  }
  return [...(storedIds || [])].filter((id) => id && !used.has(id));
}

// Не смогли прочитать — возвращаем null: удалять по неполному списку нельзя,
// так теряются чужие планы.
async function allProjectDocs() {
  const read = await runTransaction(STORE_NAMES.projects, "readonly", (store) => idbRequest(store.getAll()));
  if (!read.ok && storeModeValue === "idb") return null;
  const docs = new Map();
  for (const doc of read.result || []) docs.set(doc.id, doc);
  for (const doc of storeMemory.projects.values()) docs.set(doc.id, doc);
  return [...docs.values()];
}
async function listImageIds() {
  const read = await runTransaction(STORE_NAMES.images, "readonly", (store) => idbRequest(store.getAllKeys()));
  if (!read.ok && storeModeValue === "idb") return null;
  const ids = (read.result || []).map((key) => String(key));
  return [...ids, ...storeMemory.images.keys()];
}

// Убирает подложки, которые не нужны ни одному объекту. `extraProjects` —
// то, что ещё не доехало до хранилища (только что открытый объект): его
// картинки тоже не ничьи.
async function sweepOrphanImages(extraProjects = []) {
  const docs = await allProjectDocs();
  const stored = await listImageIds();
  if (!docs || !stored) return { removed: 0, skipped: true };
  const orphans = orphanImageIds([...docs, ...extraProjects], stored);
  for (const id of orphans) await deleteImage(id);
  return { removed: orphans.length, skipped: false };
}

// ——— настройки ————————————————————————————————————————————————————————
async function getSetting(key) {
  if (storeMemory.settings.has(key)) return storeMemory.settings.get(key);
  const read = await runTransaction(STORE_NAMES.settings, "readonly", (store) => idbRequest(store.get(key)));
  return read.ok && read.result ? read.result.value : null;
}
async function setSetting(key, value) {
  const written = await runTransaction(STORE_NAMES.settings, "readwrite", (store) =>
    idbRequest(store.put({ key, value })),
  );
  if (written.ok) storeMemory.settings.delete(key);
  else storeMemory.settings.set(key, value);
  return { ok: written.ok };
}

// ——— место ————————————————————————————————————————————————————————————
async function estimateSpace() {
  const empty = { usage: null, quota: null, free: null, low: false };
  if (typeof navigator === "undefined" || !navigator.storage || !navigator.storage.estimate) return empty;
  try {
    const { usage, quota } = await navigator.storage.estimate();
    if (typeof quota !== "number" || typeof usage !== "number") return empty;
    const free = Math.max(0, quota - usage);
    return { usage, quota, free, low: free < STORE_LOW_SPACE_BYTES };
  } catch (error) {
    return empty;
  }
}

// src/projectFile.js
// Формат файла проекта: один zip с project.json, планами в schemes/ и README.txt.
// Zip пишется и читается здесь же, без библиотек: CompressionStream("deflate-raw")
// там, где он есть, и «stored» (без сжатия) там, где его нет. Читаются оба варианта.
const PROJECT_ENTRY = "project.json";
const SCHEMES_DIR = "schemes/";
const README_ENTRY = "README.txt";

const LOCAL_SIGNATURE = 0x04034b50;
const CENTRAL_SIGNATURE = 0x02014b50;
const END_SIGNATURE = 0x06054b50;
const LOCAL_HEADER_SIZE = 30;
const CENTRAL_HEADER_SIZE = 46;
const END_HEADER_SIZE = 22;
const METHOD_STORED = 0;
const METHOD_DEFLATE = 8;
const UTF8_FLAG = 0x0800;
const ZIP64_MARK = 0xffffffff;
const MAX_ZIP_BYTES = 0xfffffffe;

// Тип картинки восстанавливается по расширению: имя файла в архиве — всё,
// что о ней известно после распаковки.
const IMAGE_TYPES = [
  ["image/png", "png"],
  ["image/jpeg", "jpg"],
  ["image/jpeg", "jpeg"],
];

function fileError(key, vars) {
  const error = new Error(text("errors." + key, vars));
  error.code = key;
  return error;
}

// ——— байты ———————————————————————————————————————————————————————————

const utf8Encoder = new TextEncoder();
const utf8Decoder = new TextDecoder("utf-8");

function encodeText(value) {
  return utf8Encoder.encode(value);
}

function decodeText(bytes) {
  return utf8Decoder.decode(bytes);
}

async function toBytes(data) {
  if (data == null) return new Uint8Array(0);
  if (data instanceof Uint8Array) return data;
  if (typeof data === "string") return encodeText(data);
  if (data instanceof ArrayBuffer) return new Uint8Array(data);
  if (ArrayBuffer.isView(data)) return new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
  if (typeof data.arrayBuffer === "function") return new Uint8Array(await data.arrayBuffer());
  throw fileError("archiveBroken");
}

let crcTable = null;
function crc32(bytes) {
  if (!crcTable) {
    crcTable = new Uint32Array(256);
    for (let n = 0; n < 256; n += 1) {
      let value = n;
      for (let bit = 0; bit < 8; bit += 1) {
        value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
      }
      crcTable[n] = value >>> 0;
    }
  }
  let crc = 0xffffffff;
  for (let i = 0; i < bytes.length; i += 1) {
    crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xff];
  }
  return (crc ^ 0xffffffff) >>> 0;
}

function hasCompression() {
  return typeof CompressionStream === "function" && typeof DecompressionStream === "function";
}

async function collectStream(readable) {
  const reader = readable.getReader();
  const chunks = [];
  let total = 0;
  for (;;) {
    const step = await reader.read();
    if (step.done) break;
    const chunk = step.value instanceof Uint8Array ? step.value : new Uint8Array(step.value);
    chunks.push(chunk);
    total += chunk.length;
  }
  const out = new Uint8Array(total);
  let at = 0;
  for (const chunk of chunks) {
    out.set(chunk, at);
    at += chunk.length;
  }
  return out;
}

// Поток, а не один кусок: большой план не держит вкладку — между чтениями
// управление возвращается странице.
async function pipeBytes(bytes, transform) {
  const source = new Blob([bytes]).stream().pipeThrough(transform);
  return collectStream(source);
}

async function deflateRaw(bytes) {
  return pipeBytes(bytes, new CompressionStream("deflate-raw"));
}

async function inflateRaw(bytes) {
  try {
    return await pipeBytes(bytes, new DecompressionStream("deflate-raw"));
  } catch {
    throw fileError("archiveBroken");
  }
}

// ——— запись zip ——————————————————————————————————————————————————————

function dosStamp(date) {
  const year = date.getUTCFullYear();
  if (year < 1980) return { time: 0, date: (1 << 5) | 1 };
  return {
    time: (date.getUTCHours() << 11) | (date.getUTCMinutes() << 5) | (date.getUTCSeconds() >> 1),
    date: ((year - 1980) << 9) | ((date.getUTCMonth() + 1) << 5) | date.getUTCDate(),
  };
}

function headerBuffer(size) {
