      vendorFilter.replaceChildren(uiEl("option", { value: "", text: strings.equipmentPicker.anyVendor }));
      for (const name of equipmentVendors(current)) {
        vendorFilter.append(uiEl("option", { value: name, text: name }));
      }
      // Модели без производителя отбираются отдельным пунктом: иначе найти их
      // в объекте, где у остальных производитель заполнен, было бы нечем.
      vendorFilter.append(uiEl("option", { value: PICKER_NO_VENDOR, text: strings.equipmentPicker.noVendor }));
      vendorFilter.value = vendor;
    }

    function createModel() {
      const name = search.value.trim();
      if (!name) return;
      try {
        const result = addEquipment(current, {
          name,
          vendor: createVendor ? createVendor.value : "",
          code: createCode ? createCode.value : "",
          typeId: createType ? createType.value : "",
        });
        done({ equipmentId: result.equipment.id, project: result.project, created: true });
      } catch (failure) {
        error.textContent = failure.message;
      }
    }

    let createVendor = null;
    let createCode = null;
    let createType = null;

    function renderCreate(query) {
      createBox.replaceChildren();
      error.textContent = "";
      // Заводить нечего: строка пуста или такая модель уже есть — она стоит
      // первой в списке, и Enter берёт именно её.
      if (!query || matchEquipmentExactly(current, query)) return;
      createVendor = uiEl("input", { class: "ui-input", type: "text", placeholder: strings.equipment.vendorPlaceholder });
      createCode = uiEl("input", { class: "ui-input", type: "text", placeholder: strings.equipment.codePlaceholder });
      createType = uiEl(
        "select",
        { class: "ui-select" },
        [
          uiEl("option", { value: "", text: strings.equipment.typeNone }),
          ...equipmentTypesInOrder(current).map((item) => uiEl("option", { value: item.id, text: item.name })),
        ],
      );
      // Тип из фильтра подставляется в новую модель: если человек сузил список
      // до «Реле 2 канала» и не нашёл свою, она почти наверняка того же типа.
      createType.value = typeFilter.value || "";
      createBox.append(
        uiEl("p", { class: "picker__createTitle", text: text("equipmentPicker.createTitle", { name: query }) }),
        uiEl("label", { class: "picker__field" }, [
          uiEl("span", { text: strings.equipmentPicker.createType }),
          createType,
        ]),
        uiEl("label", { class: "picker__field" }, [
          uiEl("span", { text: strings.equipmentPicker.createVendor }),
          createVendor,
        ]),
        uiEl("label", { class: "picker__field" }, [
          uiEl("span", { text: strings.equipmentPicker.createCode }),
          createCode,
        ]),
        uiButton(strings.equipmentPicker.create, { class: "ui-btn ui-btn--accent", on: { click: createModel } }),
      );
    }

    function modelRow(item) {
      const kind = findEquipmentType(current, item.typeId);
      const about = equipmentPickerAbout(item);
      return uiEl(
        "button",
        {
          class: "picker__row" + (item.id === options.activeId ? " is-active" : ""),
          type: "button",
          title: [item.name, kind ? kind.name : "", about].filter(Boolean).join(" · "),
          on: { click: () => done({ equipmentId: item.id, project: current }) },
        },
        [
          uiEl("span", { class: "picker__code", text: item.name }),
          uiEl("span", { class: "picker__name", text: about }),
        ],
      );
    }

    // Группировка по типу: моделей в объекте немного, но лежат они кучей — с
    // заголовком видно, что реле кончились и пошли блоки питания. Порядок
    // групп — порядок справочника (`equipmentTypesInOrder`), а не порядок
    // заведения моделей: иначе один тип выходил бы двумя заголовками, стоило
    // завести реле, блок питания и снова реле. Модели без типа идут последней
    // группой: спрятать их было бы хуже, чем показать отдельно.
    //
    // Группы только при пустом поиске и без фильтра по типу. Поиск ранжирует
    // список — точное совпадение первым, и его берёт Enter; разложи такой
    // список по группам, и первой строкой оказалась бы не та. Фильтр по типу
    // заголовок и вовсе повторял бы: он уже стоит в самом фильтре.
    function renderList() {
      renderFilters();
      const query = search.value.trim();
      const vendorPick = vendorFilter.value;
      const rows = searchEquipment(current, {
        query,
        typeId: typeFilter.value,
        vendor: vendorPick === PICKER_NO_VENDOR ? "" : vendorPick,
        noVendor: vendorPick === PICKER_NO_VENDOR,
      });
      list.replaceChildren();
      if (rows.length === 0) {
        const hasAny = (current.equipment || []).length > 0;
        list.append(
          uiEl("p", {
            class: "panel__empty",
            text: hasAny ? strings.equipmentPicker.empty : strings.equipmentPicker.emptyAll,
          }),
        );
        renderCreate(query);
        return;
      }
      if (!query && typeFilter.value === "") {
        const byType = new Map();
        for (const item of rows) {
          const key = findEquipmentType(current, item.typeId) ? item.typeId : "";
          if (!byType.has(key)) byType.set(key, []);
          byType.get(key).push(item);
        }
        for (const kind of [...equipmentTypesInOrder(current), null]) {
          const key = kind ? kind.id : "";
          const group = byType.get(key);
          if (!group || group.length === 0) continue;
          list.append(
            uiEl("div", { class: "picker__group", text: kind ? kind.name : strings.equipment.typeNone }),
          );
          for (const item of group) list.append(modelRow(item));
        }
      } else {
        for (const item of rows) list.append(modelRow(item));
      }
      renderCreate(query);
    }

    // Клавиатура по списку. Enter здесь обязателен свой: основное действие
    // диалога — «Отмена», и оно сработало бы раньше, чем браузер превратит
    // Enter в клик по строке, — то есть выбор терялся бы.
    list.addEventListener("keydown", (event) => {
      const row = event.target;
      if (!row || !row.classList || !row.classList.contains("picker__row")) return;
      if (event.key === "Enter") {
        event.preventDefault();
        row.click();
        return;
      }
      const step = { ArrowDown: 1, ArrowUp: -1 }[event.key];
      if (!step) return;
      event.preventDefault();
      const rows = [...list.querySelectorAll(".picker__row")];
      const next = rows[Math.min(rows.length - 1, Math.max(0, rows.indexOf(row) + step))];
      if (next) next.focus();
    });

    renderList();
    body.replaceChildren(
      search,
      uiEl("div", { class: "picker__field" }, [typeFilter, vendorFilter]),
      list,
      createBox,
      error,
    );
    modal = uiModal({
      title: options.title || strings.equipmentPicker.choose,
      body,
      actions: [uiButton(strings.dialog.cancel, { on: { click: () => done(null) } })],
      onCancel: () => resolve(null),
    });
    search.focus();
  });
}

// src/panels/equipment.js
// Оборудование: справочник моделей объекта и планирование, что где стоит.
//
// Заказчик разделил две вещи, и окно держит их рядом, но не путает. Модель —
// товар в справочнике: «Shelly 1PM», одна модель стоит на многих метках, и по
// ней считается закупка. Размещённая единица — «одна штука тут»: модель, метка
// места и связи с другими метками (реле стоит в щите, а связано со
// светильниками и выключателем).
//
// Метку выбирает общее окно выбора из `markControls.js` — второго такого в
// сборке нет: и место, и связи спрашиваются им же.







// Подпись единицы для строки списка меток и для кнопки: модель плюс связи.
function placementSummary(project, placement) {
  const model = findEquipment(project, placement.equipmentId);
  const links = placementLinkIds(placement)
    .map((id) => labelOf(project, id))
    .filter(Boolean);
  return { name: model ? model.name : "", vendor: model ? model.vendor : "", links };
}
function openEquipmentWindow(api, options = {}) {
  const markId = options.markId || null;
  const body = uiEl("div", { class: "equip" });

  function project() {
    return api.getState().project;
  }

  function editable() {
    return layoutAllows("editMarks", api.getState().layout);
  }

  function fail(error) {
    api.notify(error && error.message ? error.message : String(error), "error");
    render();
  }

  // Перерисовка приходит подпиской на объект: так окно обновляется и от своей
  // команды, и от чужой — например, от Ctrl+Z, пока оно открыто.
  function commit(build, label) {
    try {
      canvasCommit(project(), build(project()), label);
    } catch (error) {
      fail(error);
    }
  }

  // ——— справочник моделей ———

  function modelRow(item) {
    const used = equipmentUsage(project(), item.id);
    const remove = uiIconButton("trash", {
      class: "ui-btn ui-btn--danger",
      title: used > 0 ? text("errors.equipmentInUse", { name: item.name, count: used }) : strings.equipment.removeModel,
      on: { click: () => removeModel(item) },
    });
    remove.disabled = used > 0;
    return uiEl("div", { class: "equip__row" }, [
      uiEl("input", {
        class: "ui-input equip__name",
        type: "text",
        value: item.name,
        title: strings.equipment.name,
        on: {
          change: (event) =>
            commit((current) => updateEquipment(current, item.id, { name: event.target.value }).project, strings.history.editEquipment),
        },
      }),
      uiEl("input", {
        class: "ui-input",
        type: "text",
        value: item.vendor,
        placeholder: strings.equipment.vendorPlaceholder,
        title: strings.equipment.vendor,
        on: {
          change: (event) =>
            commit((current) => updateEquipment(current, item.id, { vendor: event.target.value }).project, strings.history.editEquipment),
        },
      }),
      uiEl("input", {
        class: "ui-input equip__code",
        type: "text",
        value: item.code,
        placeholder: strings.equipment.codePlaceholder,
        title: strings.equipment.code,
        on: {
          change: (event) =>
            commit((current) => updateEquipment(current, item.id, { code: event.target.value }).project, strings.history.editEquipment),
        },
      }),
      typeSelect(item.typeId, (typeId) =>
        commit((current) => updateEquipment(current, item.id, { typeId }).project, strings.history.editEquipment),
      ),
      uiEl("span", { class: "equip__used", text: text("equipment.used", { count: used }) }),
      remove,
    ]);
  }

  // ——— типы оборудования ———

  // Выбор типа у модели. Пустой тип — законное значение: у моделей, заведённых
  // до появления справочника, типа нет, и заставлять его выбирать не за что.
  function typeSelect(value, onPick) {
    const select = uiEl("select", {
      class: "ui-select",
      title: strings.equipment.type,
      on: { change: (event) => onPick(event.target.value) },
    });
    select.append(uiEl("option", { value: "", text: strings.equipment.typeNone }));
    for (const item of equipmentTypesInOrder(project())) {
      select.append(uiEl("option", { value: item.id, text: item.name }));
    }
    select.value = value && findEquipmentType(project(), value) ? value : "";
    return select;
  }

  function typeRow(item) {
    const used = equipmentTypeUsage(project(), item.id);
    const remove = uiIconButton("trash", {
      class: "ui-btn ui-btn--danger",
      title:
        used > 0
          ? text("errors.equipmentTypeInUse", { name: item.name, count: used })
          : strings.equipment.removeType,
      on: { click: () => removeType(item) },
    });
    remove.disabled = used > 0;
    return uiEl("div", { class: "equip__row" }, [
      uiEl("input", {
        class: "ui-input equip__name",
        type: "text",
        value: item.name,
        title: strings.equipment.typeName,
        on: {
          change: (event) =>
            commit(
              (current) => updateEquipmentType(current, item.id, { name: event.target.value }).project,
              strings.history.editEquipmentType,
            ),
        },
      }),
      uiEl("span", { class: "equip__used", text: text("equipment.typesUsed", { count: used }) }),
      remove,
    ]);
  }

  async function removeType(item) {
    const agreed = await uiConfirm({
      title: strings.equipment.removeTypeTitle,
      message: text("equipment.removeTypeMessage", { name: item.name }),
      confirmLabel: strings.dialog.confirm,
    });
    if (!agreed) return;
    commit((current) => deleteEquipmentType(current, item.id).project, strings.history.removeEquipmentType);
  }

  function addTypeRow() {
    const name = uiEl("input", {
      class: "ui-input equip__name",
      type: "text",
      placeholder: strings.equipment.typeNamePlaceholder,
      title: strings.equipment.typeName,
    });
    return uiEl("div", { class: "equip__row equip__row--add" }, [
      name,
      uiButton(strings.equipment.addType, {
        class: "ui-btn ui-btn--accent",
        on: {
          click: () =>
            commit((current) => addEquipmentType(current, { name: name.value }).project, strings.history.addEquipmentType),
        },
      }),
    ]);
  }

  // Объект, размеченный до появления типов, открывается с пустым справочником:
  // стартовый набор в него не заезжает сам — правка шаблона до размеченного
  // объекта не доходит никогда. Но и оставлять человека набивать сорок строк
  // руками незачем: кнопка предлагает готовый список, решение за ним.
  function seedTypesRow() {
    return uiEl("div", { class: "equip__row equip__row--add" }, [
      uiEl("span", { class: "equip__used", text: strings.equipment.typesSeedHint }),
      uiButton(strings.equipment.typesSeed, {
        class: "ui-btn ui-btn--accent",
        on: {
          click: () => {
            const seeds = equipmentTypeTemplate();
            commit((current) => {
              let next = current;
              for (const seed of seeds) next = addEquipmentType(next, { name: seed.name }).project;
              return next;
            }, strings.history.seedEquipmentTypes);
            api.notify(text("equipment.typesSeedDone", { count: seeds.length }), "success");
          },
        },
      }),
    ]);
  }

  async function removeModel(item) {
    const agreed = await uiConfirm({
      title: strings.equipment.removeModelTitle,
      message: text("equipment.removeModelMessage", { name: item.name }),
      confirmLabel: strings.dialog.confirm,
    });
    if (!agreed) return;
    commit((current) => deleteEquipment(current, item.id).project, strings.history.removeEquipment);
  }

  function addModelRow() {
    const name = uiEl("input", {
      class: "ui-input equip__name",
      type: "text",
      placeholder: strings.equipment.namePlaceholder,
      title: strings.equipment.name,
    });
    const vendor = uiEl("input", {
      class: "ui-input",
      type: "text",
      placeholder: strings.equipment.vendorPlaceholder,
      title: strings.equipment.vendor,
    });
    const code = uiEl("input", {
      class: "ui-input equip__code",
      type: "text",
      placeholder: strings.equipment.codePlaceholder,
      title: strings.equipment.code,
    });
    let typeId = "";
    return uiEl("div", { class: "equip__row equip__row--add" }, [
      name,
      vendor,
      code,
      typeSelect("", (value) => {
        typeId = value;
      }),
      uiButton(strings.equipment.addModel, {
        class: "ui-btn ui-btn--accent",
        on: {
          click: () =>
            commit(
              (current) =>
                addEquipment(current, { name: name.value, vendor: vendor.value, code: code.value, typeId }).project,
              strings.history.addEquipment,
            ),
        },
      }),
    ]);
  }

  // ——— размещение ———

  // Модель выбирают окном выбора, а не выпадающим списком. Слова заказчика:
  // «не показывай Справочник моделей, просто выбор, но выбор сделай красивым
  // окном, с фильтрацией по модели, типом и т.д.». Список из сорока моделей в
  // `select` нельзя ни отфильтровать, ни найти в нём по производителю — а
  // именно это и нужно в момент, когда выбирают.
  //
  // Окно одно на всю сборку, как окно выбора метки: и в строке размещения, и
  // в строке добавления спрашивается им же.
  function modelButton(value, title, onPick) {
    const chosen = value ? findEquipment(project(), value) : null;
    const button = uiButton(chosen ? chosen.name : strings.equipmentPicker.choose, {
      class: "ui-btn ui-btn--wide equip__name" + (chosen ? " is-set" : ""),
      title: strings.equipment.name,
      on: {
        click: async () => {
          const picked = await openEquipmentPicker(project(), { activeId: value || null, title });
          if (!picked) return;
          onPick(picked);
        },
      },
    });
    return button;
  }

  async function pickPlace(placement) {
    const chosen = await openMarkPicker(project(), {
      title: text("equipment.placeTitle", { name: placementSummary(project(), placement).name }),
      chosen: [placement.markId],
      multiple: false,
    });
    if (!chosen || chosen.length === 0) return;
    commit((current) => updatePlacement(current, placement.id, { markId: chosen[0] }).project, strings.history.editPlacement);
  }

  async function pickLinks(placement) {
    const chosen = await openMarkPicker(project(), {
      title: text("equipment.linksTitle", { name: placementSummary(project(), placement).name }),
      hint: strings.equipment.linksHint,
      chosen: placementLinkIds(placement),
      exclude: placement.markId,
      multiple: true,
      // Реле стоит в щите, а связывают его с метками своей комнаты — тот же
      // частый случай, что у «Чем управляет». Значение только начальное:
      // «Все помещения» на месте, и уже отмеченные метки из других помещений
      // фильтр прячет, но не теряет.
      roomId: markControlsInitialRoom(project(), placement.markId),
    });
    if (!chosen) return;
    commit((current) => updatePlacement(current, placement.id, { links: chosen }).project, strings.history.editPlacement);
  }

  function placementRow(placement) {
    const summary = placementSummary(project(), placement);
    const place = findMark(project(), placement.markId);
    return uiEl("div", { class: "equip__row" }, [
      modelButton(placement.equipmentId, text("equipment.placeTitle", { name: summary.name }), (picked) =>
        // Модель могли завести прямо в окне выбора: тогда объект берётся
        // оттуда, и оба изменения — новая модель и её подстановка в единицу —
        // ложатся одним шагом истории. Двумя шагами Ctrl+Z сперва отцеплял бы
        // модель, а потом удалял её же.
        commit(
          (current) =>
            updatePlacement(picked.created ? picked.project : current, placement.id, {
              equipmentId: picked.equipmentId,
            }).project,
          picked.created ? strings.history.addEquipment : strings.history.editPlacement,
        ),
      ),
      uiButton(place ? labelOf(project(), placement.markId) : strings.equipment.placeChoose, {
        class: "ui-btn equip__place",
        title: strings.equipment.place,
        on: { click: () => pickPlace(placement) },
      }),
      uiButton(summary.links.length > 0 ? summary.links.join(", ") : strings.equipment.linksEmpty, {
        class: "ui-btn ui-btn--wide equip__links" + (summary.links.length > 0 ? " is-set" : ""),
        title: strings.equipment.links,
        on: { click: () => pickLinks(placement) },
      }),
      uiIconButton("trash", {
        class: "ui-btn ui-btn--danger",
        title: strings.equipment.removePlacement,
        on: {
          click: () =>
            commit((current) => deletePlacement(current, placement.id).project, strings.history.removePlacement),
        },
      }),
    ]);
  }

  // Набранное в строке добавления живёт дольше одной отрисовки. Окно
  // перерисовывается от любой правки объекта — в том числе от своей же, — и
  // выбранная модель с меткой иначе слетали бы на каждый чужой шаг.
  const draft = { equipmentId: "", placeId: markId || "" };

  function addPlacementRow() {
    const modelPick = modelButton(draft.equipmentId, strings.equipmentPicker.choose, (picked) => {
      draft.equipmentId = picked.equipmentId;
      // Модель, заведённая в окне выбора, попадает в справочник сразу, не
      // дожидаясь «Разместить». Человек её завёл — значит, она у него есть; а
      // передумай он размещать, модель осталась бы потерянной вместе с
      // нажатием, которого он не сделал.
      if (picked.created) {
        commit(() => picked.project, strings.history.addEquipment);
        return;
      }
      render();
    });
    const placeButton = uiButton(
      draft.placeId ? labelOf(project(), draft.placeId) : strings.equipment.placeChoose,
      {
        class: "ui-btn equip__place",
        title: strings.equipment.place,
        on: {
          click: async () => {
            const chosen = await openMarkPicker(project(), {
              title: strings.equipment.placeChoose,
              chosen: draft.placeId ? [draft.placeId] : [],
              multiple: false,
            });
            if (!chosen || chosen.length === 0) return;
            draft.placeId = chosen[0];
            placeButton.textContent = labelOf(project(), draft.placeId);
          },
        },
      },
    );
    const add = uiButton(strings.equipment.addPlacement, {
      class: "ui-btn ui-btn--accent",
      title: strings.equipment.addPlacementHint,
      on: {
        click: () => {
          if (!draft.equipmentId) {
            api.notify(strings.equipment.needModel);
            return;
          }
          if (!draft.placeId) {
            api.notify(strings.equipment.addPlacementHint);
            return;
          }
          // Строка добавления чистится до записи, а не после: перерисовка
          // приходит подпиской прямо изнутри `commit`, и очистка следом
          // досталась бы уже мёртвой строке — на экране осталась бы прежняя
          // модель. Следующая единица почти всегда другая, и оставшаяся модель
          // подсовывала бы не ту.
          const chosen = draft.equipmentId;
          draft.equipmentId = "";
          commit(
            (current) => addPlacement(current, { equipmentId: chosen, markId: draft.placeId }).project,
            strings.history.addPlacement,
          );
        },
      },
    });
    return uiEl("div", { class: "equip__row equip__row--add" }, [modelPick, placeButton, add]);
  }

  function render() {
    const current = project();
    if (!current) {
      body.replaceChildren();
      return;
    }
    const models = equipmentInOrder(current);
    const kinds = equipmentTypesInOrder(current);
    // На метке — только её единицы: окно открыто из строки этой метки.
    const placed = markId ? placementsAt(current, markId) : placementsInOrder(current);
    // У метки справочников нет вовсе — ни моделей, ни типов. Слова заказчика:
    // «при нажатии у метки Оборудование — не показывай Справочник моделей,
    // просто выбор». Здесь отвечают на один вопрос: что стоит на этой метке.
    // Модель выбирают окном выбора, а заводят и правят по-прежнему в
    // справочнике объекта — он открывается кнопкой «Оборудование» без метки.
    const catalog = markId
      ? []
      : [
          uiEl("h4", { class: "equip__title", text: strings.equipment.models }),
          ...(models.length > 0
            ? models.map((item) => modelRow(item))
            : [uiEl("p", { class: "panel__empty", text: strings.equipment.modelsEmpty })]),
          addModelRow(),
          uiEl("h4", { class: "equip__title", text: strings.equipment.types }),
          ...(kinds.length > 0
            ? kinds.map((item) => typeRow(item))
            : [uiEl("p", { class: "panel__empty", text: strings.equipment.typesEmpty })]),
          addTypeRow(),
          ...(kinds.length === 0 ? [seedTypesRow()] : []),
        ];
    body.replaceChildren(
      ...catalog,
      uiEl("h4", { class: "equip__title", text: strings.equipment.placed }),
      ...(placed.length > 0
        ? placed.map((placement) => placementRow(placement))
        : [
            uiEl("p", {
              class: "panel__empty",
              text: markId ? strings.equipment.placedEmptyAtMark : strings.equipment.placedEmpty,
            }),
          ]),
      addPlacementRow(),
    );
    // Режим просмотра: окно читается, но ничего не правит — как и список меток.
    if (!editable()) {
      for (const field of body.querySelectorAll("input")) field.readOnly = true;
      for (const field of body.querySelectorAll("select")) field.disabled = true;
      for (const button of body.querySelectorAll("button")) button.disabled = true;
    }
  }

  render();
  const unsubscribe = api.subscribe((state, changed) => {
    if ("project" in changed || "layout" in changed) render();
  });
  const modal = uiModal({
    title: markId ? text("equipment.atMarkTitle", { label: labelOf(project(), markId) }) : strings.equipment.title,
    body,
    actions: [uiButton(strings.dialog.close, { on: { click: () => close() } })],
    onCancel: () => unsubscribe(),
  });
  function close() {
    unsubscribe();
    modal.close();
  }
  return { close };
}

// src/panels/export.js
// Панель выгрузки: две кнопки в шапке и два диалога — таблица и схема.
//
// Панель ничего не считает сама: таблицу строит `tables.js`, картинку и печать
// делает `exporter.js`. Здесь — выбор разбивки, области и множителя, да связь
// с состоянием сеанса: фильтр, схема и её план берутся ровно те, что на экране,
// поэтому скрытое фильтром не попадает ни в таблицу, ни в картинку, ни в легенду.









// Выбор пользователя живёт между открытиями диалога: разбивку и множитель
// выставляют один раз на объект, а выгружают много раз.
const exportChoice = {
  kind: "marks",
  groupBy: "category",
  // Галка «разбить по помещениям» и разбивка внутри — два разных выбора:
  // лист «Спальня → СВЕТ, ВЫКЛЮЧАТЕЛИ» заказчик читает как два уровня.
  byRoom: false,
  // Помещение листа таблицы: null — весь объект. Комнату листа выбирают здесь,
  // а не галочками панели меток (см. exportFilterOf).
  roomId: null,
  currentScheme: false,
  // Область схемы: "all" | "view" | "room:<id>".
  area: "all",
  legend: true,
  outlines: true,
  tableScale: 2,
  schemeScale: 2,
};

function exportField(labelText, control) {
  return uiEl("label", { class: "export__field" }, [
    uiEl("span", { class: "export__field-label", text: labelText }),
    control,
  ]);
}

function exportSelect(options, value, onChange) {
  const select = uiEl("select", { class: "ui-input export__select", on: { change: () => onChange(select.value) } });
  for (const option of options) {
    const node = uiEl("option", { text: option.label, value: option.value });
    node.value = option.value;
    if (option.disabled) node.disabled = true;
    if (option.value === value) node.selected = true;
    select.append(node);
  }
  return select;
}

function exportCheck(labelText, checked, onChange) {
  const input = uiEl("input", { class: "export__check", type: "checkbox", on: { change: () => onChange(input.checked) } });
  input.checked = checked;
  return uiEl("label", { class: "export__toggle" }, [input, uiEl("span", { text: labelText })]);
}

function exportScaleSelect(value, onChange) {
  return exportSelect(
    EXPORT_SCALES.map((scale) => ({ value: String(scale), label: scale + "×" })),
    String(value),
    (next) => onChange(Number(next)),
  );
}

// Прямоугольник «как вижу» в пикселях плана: углы холста переводятся в доли
// плана тем же screenToPlan, что и клики по холсту.
function exportViewArea(state, scheme) {
  const host = document.getElementById("canvas-host");
  if (!host) return "all";
  const box = host.getBoundingClientRect();
  if (box.width < 2 || box.height < 2) return "all";
  const width = scheme.width > 0 ? scheme.width : 1000;
  const height = scheme.height > 0 ? scheme.height : 1000;
  const from = screenToPlan({ x: 0, y: 0 }, scheme, state.view);
  const to = screenToPlan({ x: box.width, y: box.height }, scheme, state.view);
  return {
    x: from.x * width,
    y: from.y * height,
    width: (to.x - from.x) * width,
    height: (to.y - from.y) * height,
  };
}

// Выбранная область: вся схема, видимое на экране или габариты помещения.
// Комната без контура на этой схеме области не даёт — лист берётся целиком.
function exportAreaOf(state, scheme) {
  if (exportChoice.area === "view") return exportViewArea(state, scheme);
  if (exportChoice.area.startsWith("room:")) {
    return exportRoomArea(state.project, scheme, exportChoice.area.slice(5)) || "all";
  }
  return "all";
}

function exportAreaRoomId() {
  return exportChoice.area.startsWith("room:") ? exportChoice.area.slice(5) : null;
}

// Кадр листа вместе с полями под подписи — тот же расчёт, что и в выгрузке:
// размер в диалоге обязан совпасть с тем, что ляжет на бумагу.
function exportFittedOf(state, scheme) {
  return exportFitArea(state.project, scheme, { area: exportAreaOf(state, scheme), filter: state.filter });
}

function exportAreaSize(state, scheme) {
  const { area } = exportFittedOf(state, scheme);
  return { width: area.width, height: area.height };
}

// План схемы для рисования: уже разобранный на холсте — как есть, чужой —
// из хранилища. Разобранный здесь план здесь же и освобождается.
async function exportSchemeImage(state, scheme) {
  const loaded = state.schemeImage;
  if (loaded && loaded.schemeId === scheme.id && loaded.image) return { image: loaded.image, release: null };
  if (!scheme.imageId) return { image: null, release: null };
  const blob = await getImage(scheme.imageId);
  if (!blob) return { image: null, release: null };
  const decoded = await decodePlanImage(blob);
  return { image: decoded.image, release: () => releasePlanImage(decoded) };
}

// Комнату листа задаёт диалог, всё остальное (категории, типы, поиск) —
// панель меток. Два способа сузить одно и то же не спорят: на открытии диалог
// берёт комнату с экрана, дальше владеет ею он, и в списке видно, какая стоит.
function exportFilterOf(state) {
  const filter = { ...state.filter, roomId: exportChoice.roomId || null };
  if (exportChoice.currentScheme && state.schemeId) filter.schemeId = state.schemeId;
  return filter;
}

function exportSyncRoom(state) {
  const fromScreen = state.filter && state.filter.roomId;
  exportChoice.roomId = fromScreen && findRoom(state.project, fromScreen) ? fromScreen : null;
}

function exportTableOf(state) {
  if (exportChoice.kind === "types") return typesTable(state.project);
  if (exportChoice.kind === "links") {
    return linksTable(state.project, exportFilterOf(state), { byRoom: exportChoice.byRoom });
  }
  if (exportChoice.kind === "equipment") {
    return equipmentTable(state.project, exportFilterOf(state), { byRoom: exportChoice.byRoom });
  }
  return marksTable(state.project, exportFilterOf(state), exportChoice.groupBy, { byRoom: exportChoice.byRoom });
}

function exportSubtitleOf(state, table) {
  const scheme = state.schemeId ? findScheme(state.project, state.schemeId) : null;
  const parts = [text("exportPanel.rows", { count: tableRowCount(table) })];
  // Лист связей молчит о метках без связей — а их отсутствие на листе не
  // означает, что на объекте всё связано.
  if (table.kind === "links" && table.unlinked > 0) {
    parts.push(text("tables.unlinked", { count: table.unlinked }));
  }
  if (exportChoice.currentScheme && scheme) parts.push(scheme.name);
  return parts.join(" · ");
}

// Имя файла называет то, чем лист сужен: схему и помещение. Иначе три выгрузки
// одного объекта лягут в папку одинаковыми именами и затрут друг друга.
function exportBaseName(state, suffix) {
  const parts = [];
  const scheme = exportChoice.currentScheme && state.schemeId ? findScheme(state.project, state.schemeId) : null;
  if (scheme) parts.push(scheme.name);
  const room = exportChoice.roomId ? findRoom(state.project, exportChoice.roomId) : null;
  if (room) parts.push(room.name);
  // Три таблицы одного объекта иначе легли бы в папку загрузок одним именем:
  // лист связей затёр бы лист меток, и молча.
  if (exportChoice.kind === "links") parts.push(strings.exportPanel.kindLinks);
  else if (exportChoice.kind === "equipment") parts.push(strings.exportPanel.kindEquipment);
  else if (exportChoice.kind === "types") parts.push(strings.exportPanel.kindTypes);
  return exportFileName(state.project, parts.join(" — "), suffix);
}

// ——— диалог таблицы ———————————————————————————————————————————————————

function exportTableDialog(api) {
  const { getState, notify } = api;
  const state = getState();
  exportSyncRoom(state);
  // Галка и «по помещениям» в списке — один и тот же уровень: вместе они
  // не живут, и список переводится на категории ещё до отрисовки.
  if (exportChoice.byRoom && exportChoice.groupBy === "room") exportChoice.groupBy = "category";
  const preview = uiEl("div", { class: "export__preview" });
  const hint = uiEl("p", { class: "export__hint" });
  let table = exportTableOf(state);

  const refresh = () => {
    table = exportTableOf(state);
    preview.replaceChildren(
      exportTableNode(table, { title: table.title || state.project.name, subtitle: exportSubtitleOf(state, table) }),
    );
    hint.textContent = exportTableSizeText(table, exportChoice.tableScale);
  };

  const groupSelect = exportSelect(
    [
      { value: "category", label: strings.exportPanel.groupByCategory },
      { value: "type", label: strings.exportPanel.groupByType },
      { value: "room", label: strings.exportPanel.groupByRoom },
    ],
    exportChoice.groupBy,
    (value) => {
      exportChoice.groupBy = value;
      refresh();
    },
  );

  // Подпись переключателя меняется вместе с галкой: без неё «Разбивка» рядом
  // с «Разбить по помещениям» читается как второй способ сделать то же самое.
  const groupLabel = uiEl("span", {
    class: "export__field-label",
    text: exportChoice.byRoom ? strings.exportPanel.groupByInside : strings.exportPanel.groupBy,
  });
  const groupField = uiEl("label", { class: "export__field" }, [groupLabel, groupSelect]);
  const roomOption = [...groupSelect.options].find((option) => option.value === "room");
  if (roomOption) roomOption.disabled = exportChoice.byRoom;

  const byRoomField = exportCheck(strings.exportPanel.splitByRoom, exportChoice.byRoom, (on) => {
    exportChoice.byRoom = on;
    groupLabel.textContent = on ? strings.exportPanel.groupByInside : strings.exportPanel.groupBy;
    if (roomOption) roomOption.disabled = on;
    // «По помещениям» внутри помещений — тот же уровень дважды.
    if (on && groupSelect.value === "room") {
      groupSelect.value = "category";
      exportChoice.groupBy = "category";
    }
    refresh();
  });
  const byRoomInput = byRoomField.querySelector("input");

  // Весь объект или одно помещение. «Что на экране» здесь нет и быть не должно:
  // таблица не про кадр.
  const roomSelect = exportSelect(
    [
      { value: "", label: strings.exportPanel.roomAll },
      ...roomsInOrder(state.project).map((room) => ({ value: room.id, label: room.name })),
    ],
    exportChoice.roomId || "",
    (value) => {
      exportChoice.roomId = value || null;
      refresh();
    },
  );

  const kindSelect = exportSelect(
    [
      { value: "marks", label: strings.exportPanel.kindMarks },
      { value: "links", label: strings.exportPanel.kindLinks },
      { value: "equipment", label: strings.exportPanel.kindEquipment },
      { value: "types", label: strings.exportPanel.kindTypes },
    ],
    exportChoice.kind,
    (value) => {
      exportChoice.kind = value;
      // У связей верхний уровень занят направлением («Управляет» и обратно),
      // поэтому разбивка внутри там не выбирается; помещения и галка — работают.
      groupSelect.disabled = value !== "marks";
      roomSelect.disabled = value === "types";
      byRoomInput.disabled = value === "types";
      refresh();
    },
  );
  groupSelect.disabled = exportChoice.kind !== "marks";
  roomSelect.disabled = exportChoice.kind === "types";
  byRoomInput.disabled = exportChoice.kind === "types";

  const controls = uiEl("div", { class: "export__controls" }, [
    exportField(strings.exportPanel.kind, kindSelect),
    exportField(strings.exportPanel.area, roomSelect),
    groupField,
    byRoomField,
    exportField(
      strings.exportPanel.scale,
      exportScaleSelect(exportChoice.tableScale, (value) => {
        exportChoice.tableScale = value;
        hint.textContent = exportTableSizeText(table, value);
      }),
    ),
    exportCheck(strings.exportPanel.currentScheme, exportChoice.currentScheme, (on) => {
      exportChoice.currentScheme = on;
      refresh();
    }),
  ]);

  const saved = (name) => notify(text("exportPanel.saved", { name }), "success");
  const guard = async (run) => {
    try {
      await run();
    } catch (error) {
      notify(error && error.message ? error.message : strings.exportPanel.failed, "error");
    }
  };

  const actions = [
    uiButton(strings.exportPanel.csv, {
      on: {
        click: () =>
          guard(async () => {
            const name = exportBaseName(state, "csv");
            exportText(toCsv(table), name, "text/csv;charset=utf-8");
            saved(name);
          }),
      },
    }),
    uiButton(strings.exportPanel.markdown, {
      on: {
        click: () =>
          guard(async () => {
            const name = exportBaseName(state, "md");
            exportText(toMarkdown(table), name, "text/markdown;charset=utf-8");
            saved(name);
          }),
      },
    }),
    uiButton(strings.exportPanel.copy, {
      on: {
        click: () =>
          guard(async () => {
            const ok = await exportCopy(toTsv(table));
            notify(ok ? strings.exportPanel.copied : strings.exportPanel.copyFailed, ok ? "success" : "error");
          }),
      },
    }),
    uiButton(strings.exportPanel.png, {
      on: {
        click: () =>
          guard(async () => {
            const blob = await tablePng(table, {
              scale: exportChoice.tableScale,
              title: table.title || state.project.name,
              subtitle: exportSubtitleOf(state, table),
            });
            const name = exportBaseName(state, "png");
            exportDownload(blob, name);
            saved(name);
          }),
      },
    }),
    uiButton(strings.exportPanel.print, {
      class: "ui-btn ui-btn--accent",
      on: {
        click: () =>
          guard(() =>
            printView("table", {
              table,
              title: table.title || state.project.name,
              subtitle: exportSubtitleOf(state, table),
              footer: state.project.name,
            }),
          ),
      },
    }),
  ];

  const modal = uiModal({
    title: strings.exportPanel.tableDialog,
    body: uiEl("div", { class: "export__body" }, [controls, hint, preview]),
    actions: [uiButton(strings.dialog.close, { on: { click: () => modal.close() } }), ...actions],
    primary: actions[actions.length - 1],
  });
  refresh();
}

// Заголовок листа схемы: объект, схема и — когда лист режется по комнате —
// её имя. Иначе распечатка по комнате неотличима от полной.
function exportSchemeTitle(state, scheme) {
  const room = exportRoomName(state.project, exportAreaRoomId());
  return [state.project.name, scheme.name, room].filter(Boolean).join(" · ");
}

// ——— диалог схемы —————————————————————————————————————————————————————

function exportSchemeDialog(api) {
  const { getState, notify } = api;
  const state = getState();
  const scheme = findScheme(state.project, state.schemeId);
  const hint = uiEl("p", { class: "export__hint" });
  // Комната, выбранная раньше, могла остаться без контура на этой схеме —
  // тогда лист берётся целиком, а не молча по пустой рамке.
  if (exportAreaRoomId() && !exportRoomArea(state.project, scheme, exportAreaRoomId())) exportChoice.area = "all";

  const refreshHint = () => {
    const size = exportAreaSize(state, scheme);
    hint.textContent = exportSizeText(size.width, size.height, exportChoice.schemeScale);
  };

  const controls = uiEl("div", { class: "export__controls" }, [
    exportField(
      strings.exportPanel.area,
      exportSelect(
        [
          { value: "all", label: strings.exportPanel.areaAll },
          { value: "view", label: strings.exportPanel.areaView },
          // Помещение режет лист по габаритам контура с полями. Комната без
          // контура на этой схеме остаётся в списке, но недоступна — и строка
          // говорит, почему: искать пропавший вариант хуже, чем прочесть причину.
          ...roomsInOrder(state.project).map((room) => {
            const has = Boolean(exportRoomArea(state.project, scheme, room.id));
            return {
              value: "room:" + room.id,
              label: has
                ? text("exportPanel.areaRoom", { name: room.name })
                : text("exportPanel.roomNoOutline", { name: room.name }),
              disabled: !has,
            };
          }),
        ],
        exportChoice.area,
        (value) => {
          exportChoice.area = value;
          refreshHint();
        },
      ),
    ),
    exportField(
      strings.exportPanel.scale,
      exportScaleSelect(exportChoice.schemeScale, (value) => {
        exportChoice.schemeScale = value;
        refreshHint();
      }),
    ),
    exportCheck(strings.exportPanel.withLegend, exportChoice.legend, (on) => {
      exportChoice.legend = on;
    }),
    exportCheck(strings.exportPanel.withRooms, exportChoice.outlines, (on) => {
      exportChoice.outlines = on;
    }),
  ]);

  const guard = async (run) => {
    try {
      await run();
    } catch (error) {
      notify(error && error.message ? error.message : strings.exportPanel.failed, "error");
    }
  };

  const renderScheme = async () => {
    const { image, release } = await exportSchemeImage(state, scheme);
    // План может быть не загружен — метки тогда лягут на белый лист, и лучше
    // сказать об этом, чем отдать «пустую» на вид картинку молча.
    if (!image) notify(strings.exportPanel.noImage, "info");
    // Подпись, оттащенную далеко от метки, поля не догоняют: о таких говорим
    // до выгрузки — потерянное на бумаге обозначение молчать не должно.
    const { missed } = exportFittedOf(state, scheme);
    if (missed.length > 0) {
      notify(text("exportPanel.labelsOutside", { names: missed.slice(0, 5).join(", ") }), "error");
    }
    try {
      return await schemePng(state.project, scheme, image, {
        area: exportAreaOf(state, scheme),
        scale: exportChoice.schemeScale,
        legend: exportChoice.legend,
        outlines: exportChoice.outlines,
        filter: state.filter,
      });
    } finally {
      if (release) release();
    }
  };

  const actions = [
    uiButton(strings.exportPanel.allSchemes, {
      on: {
        click: () =>
          guard(async () => {
            notify(strings.exportPanel.busy, "info");
            const images = new Map();
            for (const item of schemesInOrder(state.project)) {
              if (!item.imageId || images.has(item.imageId)) continue;
              const blob = await getImage(item.imageId);
              if (blob) images.set(item.imageId, blob);
            }
            const zip = await allSchemesZip(state.project, images, {
              scale: exportChoice.schemeScale,
              legend: exportChoice.legend,
              outlines: exportChoice.outlines,
              filter: state.filter,
            });
            const name = exportFileName(state.project, strings.exportPanel.schemesSuffix, "zip");
            exportDownload(zip, name);
            notify(text("exportPanel.schemesDone", { count: state.project.schemes.length }), "success");
          }),
      },
    }),
    uiButton(strings.exportPanel.print, {
      on: {
        click: () =>
          guard(async () => {
            const blob = await renderScheme();
            await printView("scheme", { blob, title: exportSchemeTitle(state, scheme) });
          }),
      },
    }),
    uiButton(strings.exportPanel.download, {
      class: "ui-btn ui-btn--accent",
      on: {
        click: () =>
          guard(async () => {
            const blob = await renderScheme();
            const room = exportRoomName(state.project, exportAreaRoomId());
            const name = exportFileName(state.project, room ? scheme.name + " — " + room : scheme.name, "png");
            exportDownload(blob, name);
            notify(text("exportPanel.saved", { name }), "success");
          }),
      },
    }),
  ];

  const modal = uiModal({
    title: strings.exportPanel.schemeDialog,
    body: uiEl("div", { class: "export__body" }, [controls, hint]),
    actions: [uiButton(strings.dialog.close, { on: { click: () => modal.close() } }), ...actions],
    primary: actions[actions.length - 1],
  });
  refreshHint();
}

function mountExportPanel(host, api) {
  const { getState, subscribe } = api;
  const tableButton = uiButton(strings.exportPanel.tableTitle, {
    on: { click: () => exportTableDialog(api) },
  });
  const schemeButton = uiButton(strings.exportPanel.schemeTitle, {
    on: { click: () => exportSchemeDialog(api) },
  });
  host.replaceChildren(uiEl("div", { class: "export" }, [tableButton, schemeButton]));

  // Пустая выгрузка никому не нужна: без меток кнопки гаснут и говорят почему.
  const sync = (state) => {
    const marks = state.project ? state.project.marks.length : 0;
    const scheme = state.project && state.schemeId ? findScheme(state.project, state.schemeId) : null;
    tableButton.disabled = marks === 0;
    tableButton.title = marks === 0 ? strings.exportPanel.noMarks : strings.exportPanel.tableDialog;
    schemeButton.disabled = marks === 0 || !scheme;
    schemeButton.title = !scheme
      ? strings.exportPanel.noScheme
      : marks === 0
        ? strings.exportPanel.noMarks
        : strings.exportPanel.schemeDialog;
  };

  subscribe(sync);
  sync(getState());
}
