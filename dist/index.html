// src/panels/projects.js
// Объекты: список в шапке, переключение, переименование, удаление,
// первый запуск и автосохранение в браузер.
const LAST_PROJECT_KEY = "lastProjectId";
const SAVE_DELAY_MS = 400;

function uniqueProjectName(list) {
  const base = strings.project.untitled;
  const taken = new Set(list.map((item) => item.name));
  if (!taken.has(base)) return base;
  let index = 2;
  while (taken.has(base + " " + index)) index += 1;
  return base + " " + index;
}

function mountProjectsPanel(host, api) {
  const { getState, setState, notify, subscribe } = api;
  let known = [];
  let saveTimer = null;
  let lowSpaceReported = false;

  const select = uiEl("select", {
    class: "ui-select",
    title: strings.projects.switch,
    on: {
      change: () => {
        const id = select.value;
        if (id && id !== currentId()) openProjectById(id);
      },
    },
  });
  // Значки, а не символы шрифта: рядом в шапке стоят отмена, возврат и поиск,
  // нарисованные линиями, и «＋» с корзиной-эмодзи выпадали из ряда — у них
  // своя толщина, свой размер и свой цвет. Слово у каждой кнопки осталось:
  // оно в подсказке и в `aria-label`.
  const renameButton = uiIconButton("edit", {
    label: strings.projects.rename,
    on: { click: () => renameCurrent() },
  });
  const createButton = uiIconButton("plus", {
    label: strings.projects.create,
    on: { click: () => createAndOpen() },
  });
  // Опасность удаления несла красная эмодзи; теперь её несёт сама кнопка —
  // красной рамкой и подложкой под курсором (`.ui-btn--danger` в panels.css).
  const removeButton = uiIconButton("trash", {
    class: "ui-btn ui-btn--danger",
    label: strings.projects.remove,
    on: { click: () => removeCurrent() },
  });
  host.replaceChildren(select, createButton, renameButton, removeButton);

  function currentId() {
    const state = getState();
    return state.project ? state.project.id : "";
  }

  function renderList() {
    const id = currentId();
    select.replaceChildren();
    if (known.length === 0) {
      select.append(uiEl("option", { value: "", text: strings.projects.empty }));
    }
    for (const item of known) {
      select.append(uiEl("option", { value: item.id, text: item.name }));
    }
    select.value = id;
    const has = Boolean(id);
    renameButton.disabled = !has;
    removeButton.disabled = !has;
    // Режим просмотра: объект выбирается, но не заводится, не переименовывается
    // и не удаляется — на объекте с телефоном это только риск.
    const editable = layoutAllows("editProject", getState().layout);
    createButton.hidden = !editable;
    renameButton.hidden = !editable;
    removeButton.hidden = !editable;
  }

  async function refreshList() {
    known = await listProjects();
    renderList();
  }

  async function openProjectById(id) {
    const stored = await loadProject(id);
    if (!stored) {
      await refreshList();
      return;
    }
    // Объект из базы браузера мимо `projectFile.migrateProject` не проходит,
    // а вид типа (точка или линия) у прежних объектов не записан. Дописывается
    // он тем же правилом, что и при чтении файла, — иначе один и тот же объект
    // открывался бы по-разному из базы и из архива.
    const project = migrateTypeKinds(stored).project;
    setState({
      project,
      schemeId: project.schemes.length > 0 ? project.schemes[0].id : null,
      selectedMarkIds: [],
      activeTypeId: null,
    });
    await setSetting(LAST_PROJECT_KEY, id);
    renderList();
  }

  // Новый объект начинается с сохранённого справочника, если он есть: копия
  // шаблона с новыми идентификаторами, дальше объект живёт своей жизнью.
  async function createAndOpen() {
    const saved = await getSetting(TYPE_TEMPLATE_KEY);
    const template = typesTemplateFrom(saved);
    const project = createProject({ name: uniqueProjectName(known), ...(template || {}) });
    await saveProject(project);
    await refreshList();
    setState({ project, schemeId: null, selectedMarkIds: [], activeTypeId: null });
    await setSetting(LAST_PROJECT_KEY, project.id);
    renderList();
    notify(text("projects.created", { name: project.name }), "success");
    return project;
  }

  async function renameCurrent() {
    const state = getState();
    if (!state.project) return;
    const name = await uiPrompt({
      title: strings.projects.renameTitle,
      value: state.project.name,
      placeholder: strings.projects.namePlaceholder,
    });
    if (!name || name === state.project.name) return;
    const next = updateProject(state.project, { name });
    setState({ project: next.project });
    await refreshList();
  }

  async function removeCurrent() {
    const state = getState();
    if (!state.project) return;
    const project = state.project;
    const agreed = await uiConfirm({
      title: strings.projects.removeTitle,
      message: text("projects.removeMessage", { name: project.name }),
      confirmLabel: strings.dialog.confirm,
    });
    if (!agreed) return;
    for (const scheme of project.schemes) {
      if (scheme.imageId) await deleteImage(scheme.imageId);
    }
    await deleteProject(project.id);
    setState({ project: null, schemeId: null, selectedMarkIds: [], activeTypeId: null });
    notify(text("projects.removed", { name: project.name }), "success");
    await refreshList();
    if (known.length > 0) await openProjectById(known[0].id);
    else showWelcome();
  }

  // Первый запуск: не пустая серая страница, а одна кнопка.
  function showWelcome() {
    const modal = uiModal({
      title: strings.projects.welcomeTitle,
      dismissable: false,
      body: uiEl("p", { class: "modal__text", text: strings.projects.welcomeText }),
      actions: [
        uiButton(strings.projects.createTitle, {
          class: "ui-btn ui-btn--accent",
          on: {
            click: async () => {
              modal.close();
              await createAndOpen();
            },
          },
        }),
      ],
    });
  }

  function scheduleSave(project) {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      saveTimer = null;
      const result = await saveProject(project);
      if (result.ok) {
        known = known.map((item) =>
          item.id === project.id
            ? { ...item, name: project.name, updatedAt: project.updatedAt, schemes: project.schemes.length, marks: project.marks.length }
            : item,
        );
        renderList();
        await checkSpace();
      }
    }, SAVE_DELAY_MS);
  }

  async function checkSpace() {
    if (lowSpaceReported) return;
    const space = await estimateSpace();
    if (!space.low) return;
    lowSpaceReported = true;
    notify(text("storage.lowSpace", { free: formatMegabytes(space.free) }), "error");
  }

  onStoreProblem((problem) => {
    notify(problem.kind === "unavailable" ? strings.storage.memory : strings.storage.writeFailed, "error");
  });

  subscribe((state, changed) => {
    if ("layout" in changed) renderList();
    if (!("project" in changed)) return;
    renderList();
    if (state.project) scheduleSave(state.project);
  });

  (async () => {
    await openStore();
    await refreshList();
    const lastId = await getSetting(LAST_PROJECT_KEY);
    const target = known.find((item) => item.id === lastId) || known[0] || null;
    if (target) await openProjectById(target.id);
    else showWelcome();
    await checkSpace();
    if (storeMode() === "memory") renderList();
  })();
}

registerPanel(PANEL_IDS.projectActions, mountProjectsPanel);

// src/panels/file.js
// Файл проекта: «Экспорт», «Открыть файл», папка автосохранения и отметка
// свежести выгрузки в шапке.
//
// Панель тонкая: zip пишет и читает `projectFile.js`, переприсваивание
// идентификаторов и работу с папкой держит `autosave.js`. Здесь — кнопки,
// диалоги и связь с состоянием сеанса.
//
// Своей точки монтирования в разметке у панели нет: она создаёт контейнер в
// шапке сама, после того как каркас поднялся (`startApp` откладывается на конец
// загрузки, и наш обработчик встаёт в очередь следом).










// Отметка «выгружено N назад» стареет сама по себе: раз в минуту обновляем.
const FILE_TICK_MS = 60000;
// Сутки без выгрузки — уже «давно»: работа целого дня живёт только в браузере.
const FILE_OLD_MS = 24 * 60 * 60 * 1000;
// Четыре состояния отметки у кнопки экспорта. Цвет различает три — «выгружено
// и правок нет», «пора выгрузить», «ни разу», — а словами подсказка говорит,
// что именно случилось.
const FILE_EXPORT_STATE = {
  fresh: "file.exportStateFresh",
  stale: "file.exportStateStale",
  old: "file.exportStateOld",
  never: "file.exportStateNever",
};

// Выбор при загрузке: по умолчанию новый объект, перезапись — отдельной
// кнопкой и с подтверждением. Возвращает "new" | "replace" | null.
function fileAskMode(project, hasCurrent) {
  return new Promise((resolve) => {
    let modal;
    const answer = (value) => {
      modal.close();
      resolve(value);
    };
    const asNew = uiButton(strings.file.loadAsNew, {
      class: "ui-btn ui-btn--accent",
      on: { click: () => answer("new") },
    });
    const actions = [uiButton(strings.dialog.cancel, { on: { click: () => answer(null) } })];
    if (hasCurrent) {
      actions.push(uiButton(strings.file.loadReplace, { on: { click: () => answer("replace") } }));
    }
    actions.push(asNew);
    modal = uiModal({
      title: strings.file.loadTitle,
      body: [
        uiEl("p", {
          class: "modal__text",
          text: text("file.loadSummary", {
            name: project.name,
            schemes: (project.schemes || []).length,
            marks: (project.marks || []).length,
          }),
        }),
        uiEl("p", { class: "modal__hint", text: strings.file.loadHint }),
      ],
      actions,
      primary: asNew,
      onCancel: () => resolve(null),
    });
  });
}

function mountFilePanel(host, api) {
  const { getState, setState, notify, subscribe } = api;
  // Ссылка на объект, который целиком уехал в файл: сравнение по ссылке
  // честнее флага — правка, пришедшая во время упаковки, оставит dirty.
  let fileSavedProject = null;
  let fileFailReported = false;
  // Опрос общей папки заводится один раз на выбранную папку.
  let fileWatching = false;

  const saveButton = uiButton(strings.file.save, {
    class: "ui-btn ui-btn--accent",
    title: strings.file.saveHint,
    on: { click: () => saveToFile() },
  });
  // Состояние выгрузки — не кнопка, и кричать громче кнопок ему нечего: раньше
  // жёлтая строка занимала полшапки, теперь это точка на самой кнопке
  // экспорта, а словами состояние названо в её подсказке.
  const exportDot = uiEl("span", { class: "file__dot", attrs: { "aria-hidden": "true" } });
  saveButton.prepend(exportDot);
  const openButton = uiButton(strings.file.open, {
    title: strings.file.openHint,
    on: { click: () => picker.click() },
  });
  const folderButton = uiButton(strings.autosave.pick, {
    title: strings.autosave.pickHint,
    on: { click: () => folderClick() },
  });
  const picker = uiEl("input", {
    class: "file__picker",
    type: "file",
    attrs: { accept: ".zip,application/zip", hidden: "hidden" },
    on: {
      change: async () => {
        const chosen = picker.files && picker.files[0];
        picker.value = "";
        if (chosen) await openFromFile(chosen);
      },
    },
  });

  const row = uiEl("div", { class: "file" }, [folderButton, openButton, saveButton, picker]);
  host.replaceChildren(row);

  // ——— сохранение в файл ————————————————————————————————————————————

  async function saveToFile() {
    const project = getState().project;
    if (!project) {
      notify(strings.file.noProject, "error");
      return;
    }
    const line = uiEl("p", { class: "modal__text", text: strings.file.packing });
    const modal = uiModal({
      title: strings.file.packingTitle,
      body: line,
      actions: [],
      dismissable: false,
    });
    try {
      // Упаковка идёт через await на каждой записи: вкладка остаётся живой,
      // а строка прогресса успевает перерисоваться.
      const packedFile = await autosavePack(project, {
        onProgress: ({ done, total, phase }) => {
          // Сверка идёт после упаковки и на большом объекте занимает заметное
          // время: молчащее окно выглядело бы как зависшая вкладка.
          line.textContent =
            phase === "check" ? strings.file.checking : text("file.packingProgress", { done, total });
        },
      });
      exportDownload(packedFile.blob, packedFile.name);
      await autosaveNoteExport(project.id);
      markSaved(project);
      notify(text("file.saved", { name: packedFile.name }), "success");
    } catch (error) {
      notify((error && error.message) || strings.file.saveFailed, "error");
    } finally {
      modal.close();
      renderStatus();
    }
  }

  // ——— загрузка из файла ————————————————————————————————————————————

  async function openFromFile(chosen) {
    const line = uiEl("p", { class: "modal__text", text: strings.file.reading });
    const modal = uiModal({
      title: strings.file.readingTitle,
      body: line,
      actions: [],
      dismissable: false,
    });
    let loaded = null;
    try {
      loaded = await unpackProject(chosen, {
        onProgress: ({ done, total }) => {
          line.textContent = text("file.packingProgress", { done, total });
        },
      });
    } catch (error) {
      // Отказ ничего не трогает: текущий объект на экране и в базе как был.
      modal.close();
      notify((error && error.message) || strings.errors.notAProject, "error");
      return;
    }
    modal.close();

    const current = getState().project;
    const mode = await fileAskMode(loaded.project, Boolean(current));
    if (!mode) return;
    if (mode === "replace") {
      const agreed = await uiConfirm({
        title: strings.file.replaceTitle,
        message: text("file.replaceMessage", { name: current.name }),
        confirmLabel: strings.file.replaceConfirm,
      });
      if (!agreed) return;
    }
    await applyLoaded(loaded, mode, current);
  }

  async function applyLoaded(loaded, mode, current) {
    const line = uiEl("p", { class: "modal__text", text: strings.file.reading });
    const modal = uiModal({ title: strings.file.readingTitle, body: line, actions: [], dismissable: false });
    try {
      // Картинки сперва ложатся в хранилище — идентификаторы выдаёт оно,
      // и ровно эти идентификаторы получает приёмка объекта. Второго
      // переприсваивания в сборке нет: ссылки схем чинятся один раз.
      const imageIds = new Map();
      for (const [oldId, blob] of loaded.images) imageIds.set(oldId, await putImage(blob));
      const adopted = adoptLoadedProject(loaded, {
        mode,
        currentId: current ? current.id : null,
        imageIds,
      });
      await saveProject(adopted.project);
      await setSetting(LAST_PROJECT_KEY, adopted.project.id);

      const schemes = schemesInOrder(adopted.project);
      setState({
        project: adopted.project,
        schemeId: schemes.length > 0 ? schemes[0].id : null,
        selectedMarkIds: [],
        activeTypeId: null,
      });
      // Объект только что пришёл из файла — он и есть копия файла,
      // и отметка выгрузки принадлежит уже новому идентификатору.
      await autosaveNoteExport(adopted.project.id);
      markSaved(adopted.project);
      // Заменённый объект унёс с собой свои планы: картинки под старыми
      // идентификаторами больше никому не нужны.
      if (mode === "replace" && current) {
        for (const scheme of current.schemes || []) {
          if (scheme.imageId) await deleteImage(scheme.imageId);
        }
      }
      notify(text("file.loaded", { name: adopted.project.name }), "success");
    } catch (error) {
      notify((error && error.message) || strings.errors.notAProject, "error");
    } finally {
      modal.close();
      renderStatus();
    }
  }

  // ——— папка автосохранения ————————————————————————————————————————

  async function folderClick() {
    const status = autosaveStatus();
    if (!status.supported) {
      notify(strings.autosave.unsupported, "info");
      return;
    }
    if (status.folder && status.permission !== "granted") {
      await autosaveGrant();
      if (autosaveReady()) await writeToFolder();
      renderStatus();
      return;
    }
    if (status.folder) {
      folderDialog();
      return;
    }
    await pickFolder();
  }

  async function pickFolder() {
    try {
      await autosavePickFolder();
    } catch (error) {
      // Отмена в системном окне выбора папки — не ошибка. Отказ по file://
      // (SecurityError) — не поломка, а известное ограничение: страница,
      // открытая с диска, в папку сохранять не умеет.
      const name = error && error.name;
      if (name === "SecurityError" || name === "NotAllowedError") notify(strings.autosave.unsupported, "info");
      else if (name !== "AbortError") notify(strings.autosave.failed, "error");
      renderStatus();
      return;
    }
    if (autosaveReady()) await writeToFolder();
    renderStatus();
  }

  function folderDialog() {
    const status = autosaveStatus();
    let modal;
    modal = uiModal({
      title: strings.autosave.dialogTitle,
      body: uiEl("p", {
        class: "modal__text",
        text: text("autosave.dialogText", { name: status.folder, file: currentFileName() }),
      }),
      actions: [
        uiButton(strings.dialog.close, { on: { click: () => modal.close() } }),
        uiButton(strings.autosave.off, {
          class: "ui-btn ui-btn--danger",
          on: {
            click: async () => {
              modal.close();
              await autosaveForget();
              notify(strings.autosave.offDone, "info");
              renderStatus();
            },
          },
        }),
        uiButton(strings.autosave.change, {
          class: "ui-btn ui-btn--accent",
          on: {
            click: async () => {
              modal.close();
              await pickFolder();
            },
          },
        }),
      ],
    });
  }

  function currentFileName() {
    const project = getState().project;
    return project ? autosaveSnapshotName(project) : "";
  }

  // Первая запись сразу после выбора папки: пользователь должен увидеть файл
  // на месте, а не ждать следующей правки.
  async function writeToFolder() {
    const project = getState().project;
    if (!project || !autosaveReady()) return;
    onFolderWritten(await autosaveWrite(project));
  }

  // Об отказавшей записи говорим один раз — правок много, а беда одна.
  function onFolderWritten(result) {
    if (result && result.ok) {
      fileFailReported = false;
      if (result.project) markSaved(result.project);
    } else if (result && result.error && !fileFailReported) {
      fileFailReported = true;
      // Не прошедшая сверка — не то же, что «не смогли записать»: файл в папке
      // есть, но верить ему нельзя, и сказать надо именно это.
      const failed =
        result.error.code === "fileCheckFailed" ? strings.autosave.checkFailed : strings.autosave.failed;
      notify(failed, "error");
    }
    renderStatus();
  }

  // ——— чужие правки в общей папке ————————————————————————————————————

  // Что пришло со стороны, построчно. Показывается, только когда есть о чём
  // говорить: тост сообщает факт, список — подробности.
  function mergeReport(result) {
    const body = [uiEl("p", { class: "modal__text", text: text("merge.from", { file: result.file }) })];
    const sections = [
      [
        strings.merge.incoming,
        result.changes.map((change) => text("merge." + change.action, { label: change.label || change.id })),
      ],
      [
        strings.merge.conflicts,
        result.conflicts.map((conflict) =>
          text("merge." + conflict.code, {
            label: conflict.label || conflict.id,
            side: conflict.kept === "theirs" ? strings.merge.sideTheirs : strings.merge.sideOurs,
          }),
        ),
      ],
      [strings.merge.renumbered, result.renumbered.map((item) => text("merge.renumberedItem", item))],
    ];
    for (const [title, lines] of sections) {
      if (lines.length === 0) continue;
      body.push(uiEl("p", { class: "modal__text", text: title }));
      const list = uiEl("ul", { class: "merge-list" });
      for (const line of lines) list.append(uiEl("li", { text: line }));
      body.push(list);
    }
    if (result.plans) {
      body.push(uiEl("p", { class: "modal__text", text: text("merge.plans", { count: result.plans }) }));
    }
    body.push(uiEl("p", { class: "modal__text", text: strings.merge.historyCleared }));

    const modal = uiModal({
      title: strings.merge.title,
      body,
      actions: [uiButton(strings.merge.close, { on: { click: () => modal.close() } })],
    });
  }

  // Слияние пришло со стороны — применяем его к сеансу и сразу публикуем
  // обратно в папку: второй инженер должен увидеть сложенный объект, а не
  // только свою половину.
  function applyExternal(result) {
    const state = getState();
    if (!result || !result.project || !state.project) return;
    // Пока читали папку, объект могли переключить — тогда это не его правка.
    if (result.project.id !== state.project.id) return;
    setState({ project: result.project, dirty: true });
    // Ctrl+Z отменяет действия пользователя, а не чужие: откат поверх слияния
    // стёр бы чужую работу молча, поэтому стек истории здесь обрывается.
    clearHistory();
    const loud = result.counts.conflicts > 0;
    notify(loud ? strings.merge.toastConflicts : text("merge.toast", result.counts), loud ? "error" : "info");
    if (loud || result.counts.renumbered > 0) mergeReport(result);
    autosaveSchedule(result.project, { onDone: onFolderWritten });
    renderStatus();
  }

  function syncWatch() {
    const ready = autosaveReady();
    if (ready && !fileWatching) {
      fileWatching = true;
      autosaveWatch({ getProject: () => getState().project, onExternal: applyExternal });
    } else if (!ready && fileWatching) {
      fileWatching = false;
      autosaveStopWatch();
    }
  }

  // ——— состояние и строка в шапке ————————————————————————————————————

  function markSaved(project) {
    fileSavedProject = project;
    if (getState().project === project) setState({ dirty: false });
  }

  function renderStatus() {
    const state = getState();
    const status = autosaveStatus();
    const projectId = state.project ? state.project.id : null;
    // Режим просмотра: файл открывают, чтобы посмотреть. Сохранять нечего —
    // объект не менялся, — поэтому на узком экране остаётся одна кнопка.
    const saving = layoutAllows("saveFile", state.layout);
    saveButton.hidden = !saving;
    const exported = autosaveLastExport(projectId);
    const stamp = exported ? Date.parse(exported) : Number.NaN;
    let mark = "never";
    if (!Number.isNaN(stamp)) {
      if (state.dirty) mark = "stale";
      else mark = Date.now() - stamp > FILE_OLD_MS ? "old" : "fresh";
    }
    exportDot.className = "file__dot is-" + mark;
    const said = text(FILE_EXPORT_STATE[mark], { ago: autosaveAgoText(exported) });
    // Папка автосохранения бывает недоступна (страница открыта с диска) — и
    // сказать об этом больше негде: кнопки папки в этом случае нет вовсе.
    saveButton.title =
      strings.file.saveHint + " · " + said + (status.supported ? "" : " · " + strings.autosave.unsupported);
    row.classList.toggle("is-busy", Boolean(status.busy));
    row.classList.toggle("is-dirty", Boolean(state.dirty));

    folderButton.hidden = !status.supported || !saving;
    if (!status.supported || !saving) return;
    if (!status.folder) {
      folderButton.textContent = strings.autosave.pick;
      folderButton.title = strings.autosave.pickHint;
      folderButton.classList.remove("is-on");
      return;
    }
    if (status.permission !== "granted") {
      folderButton.textContent = strings.autosave.allow;
      folderButton.title = text("autosave.allowHint", { name: status.folder });
      folderButton.classList.remove("is-on");
      return;
    }
    folderButton.textContent = text("autosave.folder", { name: status.folder });
    folderButton.title = strings.autosave.dialogTitle;
    folderButton.classList.add("is-on");
  }

  // Список объектов держит своя панель и перечитывает его по своим поводам:
  // объект, пришедший из файла, ей неизвестен. Чиним ровно одно — чтобы в
  // выпадающем списке стоял тот объект, который на экране.
  function syncProjectSelect(project) {
    const select = document.querySelector("#project-actions select");
    if (!select || !project) return;
    let option = [...select.options].find((item) => item.value === project.id);
    if (!option) {
      option = uiEl("option", { value: project.id, text: project.name });
      select.append(option);
    }
    option.textContent = project.name;
    select.value = project.id;
  }

  // Панель объектов перечитывает свой список только по своим поводам, в том
  // числе отложенно, после сохранения в браузер, — и объект, пришедший из
  // файла, ей неизвестен. Поэтому чиним не однажды, а на каждую перерисовку
  // списка: в нём должен стоять тот объект, который сейчас на экране.
  const projectSelect = document.querySelector("#project-actions select");
  if (projectSelect && typeof MutationObserver === "function") {
    new MutationObserver(() => syncProjectSelect(getState().project)).observe(projectSelect, { childList: true });
  }

  subscribe((state, changed) => {
    if ("layout" in changed) renderStatus();
    if (!("project" in changed)) {
      // Отметка у кнопки экспорта живёт на том же признаке: правка, ещё не
      // уехавшая в файл, обязана быть видна сразу.
      if ("dirty" in changed) renderStatus();
      return;
    }
    syncProjectSelect(state.project);
    if (state.project && state.project !== fileSavedProject) {
      // Не вложенным вызовом: подписчики сейчас в середине обхода.
      queueMicrotask(() => {
        if (getState().project !== fileSavedProject) setState({ dirty: true });
      });
      // Пока папка выбрана, «несохранённого» состояния почти не бывает:
      // запись уходит сама, с задержкой и по одной за раз.
      autosaveSchedule(state.project, { onDone: onFolderWritten });
    }
    renderStatus();
  });

  // Ctrl+S — привычка, а не сюрприз: браузерное «сохранить страницу» здесь
  // бесполезно. Пока открыт диалог, горячие клавиши молчат.
  document.addEventListener("keydown", (event) => {
    if (!(event.ctrlKey || event.metaKey) || event.key !== "s") return;
    if (uiDialogDepth() > 0) return;
    event.preventDefault();
    saveToFile();
  });

  // Вкладку прячут чаще, чем закрывают, и это единственный момент, когда
  // дослать отложенную запись можно по-настоящему: обработчик закрытия уже
  // ничего не дождётся.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && autosavePendingWrite()) autosaveFlush({ onDone: onFolderWritten });
  });

  // Работа, которой нет ни в папке, ни в файле, не должна уезжать молча.
  // Отложенную запись досылаем прямо здесь — она успеет, если пользователь
  // задержится на вопросе или передумает закрывать. Пообещать это нельзя,
  // поэтому, пока запись не легла, вопрос задаётся и при выбранной папке.
  window.addEventListener("beforeunload", (event) => {
    const waiting = autosavePendingWrite();
    if (waiting) autosaveFlush({ onDone: onFolderWritten });
    if (!getState().dirty) return;
    if (autosaveReady() && !waiting) return;
    event.preventDefault();
    event.returnValue = "";
  });

  onAutosaveChange(() => {
    renderStatus();
    syncWatch();
  });
  setInterval(() => renderStatus(), FILE_TICK_MS);

  (async () => {
    await autosaveRestore();
    syncWatch();
    renderStatus();
  })();
  renderStatus();
}

// Контейнер в шапке панель заводит сама: точки монтирования для неё в разметке
// нет, а править разметку последним таском — лишний повод сломать сборку.
function startFilePanel() {
  const header = document.getElementById("app-header");
  if (!header || document.getElementById("file-actions")) return;
  const host = uiEl("div", { class: "mount" });
  host.id = "file-actions";
  header.append(host);
  mountFilePanel(host, panelApi());
}

if (typeof document !== "undefined") {
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startFilePanel, { once: true });
  } else {
    setTimeout(startFilePanel, 0);
  }
}

// src/panels/rooms.js
// Помещения объекта: раздел левой колонки со списком комнат, цветом, числом
// меток и контурами. Заводятся они и на ходу — из поля «Помещение» в списке
// меток, — поэтому главное здесь не список, а `roomsEnsure`: одно и то же
// название не должно плодить двойников.
//
// Дом у помещений один — этот раздел. Ни окна, ни кнопки в правой колонке
// больше нет: заводить, переименовывать, красить, считать метки и удалять
// можно только здесь.






// Кнопка цвета помещения: открывает своё окно выбора. Занятыми в него уходят
// и цвета соседних комнат, и цвета категорий: контуров на плане бывает
// десяток, а метка своей же комнаты не должна повторять цвет её заливки.
function roomColorField(project, room, onChange) {
  return colorPickerButton({
    value: room.color,
    used: colorsInUse(project, { exceptRoomId: room.id }),
    title: strings.rooms.color,
    onPick: onChange,
  });
}

function roomsKey(name) {
  return String(name == null ? "" : name).trim().toLowerCase();
}
function roomsFind(project, name) {
  const key = roomsKey(name);
  if (!key) return null;
  return project.rooms.find((room) => roomsKey(room.name) === key) || null;
}

// «Было или заведём»: пустое название — это «без помещения», а не комната
// с пустым именем.
function roomsEnsure(project, name) {
  const found = roomsFind(project, name);
  if (found) return { project, room: found };
  if (!roomsKey(name)) return { project, room: null };
  const created = addRoom(project, name);
  return { project: created.project, room: created.room };
}
function roomsUsage(project, roomId) {
  return project.marks.filter((mark) => mark.roomId === roomId).length;
}

// Строки списка: комната, сколько у неё меток и есть ли контур на этой схеме.
// Чистая функция — на ней и стоят тесты раздела.
function roomsRows(project, schemeId) {
  const outlines = schemeId ? outlinesInOrder(project, schemeId) : [];
  return roomsInOrder(project).map((room) => {
    const outline = outlines.find((item) => item.roomId === room.id) || null;
    return { room, marks: roomsUsage(project, room.id), outlineId: outline ? outline.id : null };
  });
}

// Что делает поле добавления: завести комнату или — если такая уже есть —
// сразу обвести её заново. Вторая ветка и заменяет прежний выбор помещения
// из раздела «Метки»: там можно было взять комнату с контуром и обвести ещё раз.
function roomsAddAction(project, name) {
  const trimmed = String(name == null ? "" : name).trim();
  if (!trimmed) return { kind: "none", roomId: null, name: "" };
  const found = roomsFind(project, trimmed);
  return found
    ? { kind: "draw", roomId: found.id, name: trimmed }
    : { kind: "create", roomId: null, name: trimmed };
}

// Что делает кнопка контура: нарисовать новый или править вершины прежнего.
// Правка — это режим выбора с выделенным контуром: дальше вершины таскаются
// на холсте, «+» на стенке добавляет, двойной клик убирает.
function roomsOutlineAction(row) {
  return row && row.outlineId ? "edit" : "draw";
}

function mountRoomsPanel(host, api) {
  const { getState, setState, subscribe, notify } = api;
  const list = uiEl("div", { class: "rooms" });
  const input = uiEl("input", {
    class: "ui-input",
    type: "text",
    placeholder: strings.rooms.namePlaceholder,
    on: {
      keydown: (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        addAndDraw();
      },
    },
  });
  const addButton = uiButton(strings.rooms.addAndDraw, {
    class: "ui-btn ui-btn--accent",
    title: strings.rooms.addAndDrawHint,
    on: { click: () => addAndDraw() },
  });
  host.replaceChildren(list, uiEl("div", { class: "rooms__add" }, [input, addButton]));

  function project() {
    return getState().project;
  }

  function fail(error) {
    notify(error && error.message ? error.message : String(error), "error");
  }

  function commit(after, label, options) {
    canvasCommit(project(), after, label, options);
  }

  // Комната заводится и сразу берётся в обводку: режим рисования включается тем
  // же шагом истории, искать его отдельно не нужно.
  function addAndDraw() {
    const state = getState();
    if (!state.project) return;
    const action = roomsAddAction(state.project, input.value);
    if (action.kind === "none") return;
    if (action.kind === "draw") {
      input.value = "";
      startDrawing(action.roomId);
      return;
    }
    try {
      const created = addRoom(state.project, action.name);
      input.value = "";
      canvasCommit(state.project, created.project, strings.history.addRoom, {
        patch: drawPatch(created.room.id),
      });
      if (!state.schemeId) notify(strings.canvas.needScheme);
    } catch (error) {
      fail(error);
    }
  }

  // Без схемы рисовать негде: комната заводится, режим остаётся прежним.
  function drawPatch(roomId) {
    return getState().schemeId
      ? { activeRoomId: roomId, mode: "room", selectedOutlineId: null }
      : { activeRoomId: roomId };
  }

  // Кнопка у комнаты: нет контура — обводим, есть — выделяем его и правим
  // вершины на плане.
  function startOutline(roomId) {
    const state = getState();
    if (!state.schemeId) {
      notify(strings.canvas.needScheme);
      return;
    }
    const row = roomsRows(state.project, state.schemeId).find((item) => item.room.id === roomId);
    if (roomsOutlineAction(row) !== "edit") {
      startDrawing(roomId);
      return;
    }
    setState({ mode: "select", selectedOutlineId: row.outlineId, selectedMarkIds: [], activeRoomId: roomId });
    notify(strings.rooms.outlineEditing);
  }

  // Обводка с нуля — та самая дорога, что была в разделе «Метки»: она осталась
  // и для комнаты, у которой контур уже есть (вписать её название в поле).
  function startDrawing(roomId) {
    if (!getState().schemeId) {
      notify(strings.canvas.needScheme);
      return;
    }
    setState({ activeRoomId: roomId, mode: "room", selectedOutlineId: null });
  }

  function rename(roomId, name) {
    const current = findRoom(project(), roomId);
    if (!current || name.trim() === current.name) return;
    try {
      commit(updateRoom(project(), roomId, { name }).project, strings.history.renameRoom);
    } catch (error) {
      fail(error);
      render();
    }
  }

  function recolor(roomId, color) {
    const current = findRoom(project(), roomId);
    // Поле цвета отдаёт значение в нижнем регистре, модель хранит в верхнем:
    // сравнение без учёта регистра бережёт историю от пустого шага.
    if (!current || String(current.color || "").toUpperCase() === String(color).toUpperCase()) return;
    try {
      commit(updateRoom(project(), roomId, { color }).project, strings.history.roomColor);
    } catch (error) {
      fail(error);
      render();
    }
  }

  async function remove(roomId) {
    const current = findRoom(project(), roomId);
    if (!current) return;
    const agreed = await uiConfirm({
      title: strings.rooms.removeTitle,
      message: text("rooms.removeMessage", { name: current.name, count: roomsUsage(project(), roomId) }),
      confirmLabel: strings.dialog.confirm,
    });
    if (!agreed) return;
    const fresh = project();
    if (!findRoom(fresh, roomId)) return;
    canvasCommit(fresh, deleteRoom(fresh, roomId).project, strings.history.removeRoom);
  }

  function render() {
    const state = getState();
    if (!state.project) {
      list.replaceChildren(uiEl("p", { class: "panel__empty", text: strings.projects.empty }));
      setSectionBadge(SECTION_IDS.rooms, "");
      input.disabled = true;
      addButton.disabled = true;
      return;
    }
    input.disabled = false;
    addButton.disabled = false;
    const rows = roomsRows(state.project, state.schemeId);
    setSectionBadge(SECTION_IDS.rooms, rows.length || "");
    if (rows.length === 0) {
      list.replaceChildren(uiEl("p", { class: "panel__empty", text: strings.rooms.empty }));
      return;
    }
    list.replaceChildren(
      ...rows.map((row) => {
        const drawing = state.mode === "room" && state.activeRoomId === row.room.id;
        const editing = Boolean(row.outlineId) && state.selectedOutlineId === row.outlineId;
        const action = roomsOutlineAction(row);
        return uiEl("div", { class: "rooms__row" + (drawing || editing ? " is-active" : "") }, [
          roomColorField(state.project, row.room, (color) => recolor(row.room.id, color)),
          uiEl("input", {
            class: "ui-input rooms__name",
            type: "text",
            value: row.room.name,
            on: { change: (event) => rename(row.room.id, event.target.value) },
          }),
          // Счётчик числом: в узкой колонке «меток: 3» съедало имя комнаты,
          // а пояснение живёт в подсказке.
          uiEl("span", {
            class: "rooms__count",
            text: String(row.marks),
            title: text("rooms.marks", { count: row.marks }),
          }),
          uiIconButton("outline", {
            class: "ui-btn" + (action === "edit" ? " rooms__outline--set" : ""),
            title: action === "edit" ? strings.rooms.outlineEdit : strings.rooms.outlineDraw,
            on: { click: () => startOutline(row.room.id) },
          }),
          uiIconButton("trash", {
            class: "ui-btn ui-btn--danger",
            title: strings.rooms.remove,
            on: { click: () => remove(row.room.id) },
          }),
        ]);
      }),
    );
  }

  subscribe((state, changed) => {
    if (
      "project" in changed ||
      "schemeId" in changed ||
      "mode" in changed ||
      "activeRoomId" in changed ||
      "selectedOutlineId" in changed
    ) {
      render();
    }
  });
  render();
}

registerPanel(PANEL_IDS.rooms, mountRoomsPanel);

// src/panels/marks.js
// Список меток схемы: обозначение, помещение, расположение и обозначение из
// оригинального проекта — правятся прямо в строке.
//
// Почему список, а не карточка метки: заказчик заполняет «Расположение» и
// «В оригинальной схеме» не в момент постановки, а потом, разом, по списку.
// Поэтому правка здесь на месте, а отдельного окна у метки нет вовсе.










// Строки замен считает справочник — там же, где их считает уплотнение по
// одному типу. Второй нумерации в сборке быть не должно: окно обещало бы одно,
// а команда делала другое.

const MARKS_NEW_ROOM = "--new-room--";
// «По контуру» — метка отдана автоматике: помещение подставляется по контуру
// на схеме. Любой другой выбор в этом поле — ручная правка, и она главнее:
// такую метку автоматика больше не трогает.
const MARKS_AUTO_ROOM = "--auto-room--";

// Холст подводится к метке переводом координат из render.js: доли плана в
// пиксели экрана здесь руками не пересчитываются.
// Подводит холст к метке. Наружу — потому что тем же занят поиск в шапке:
// найденная метка должна оказаться на виду, а не просто выделиться.
function marksCenteredView(scheme, mark, view) {
  const host = document.getElementById(PANEL_IDS.canvas);
  if (!host || !host.clientWidth || !host.clientHeight) return view;
  const local = planToScreen(mark.points[0], scheme, { ...view, offsetX: 0, offsetY: 0 });
  return { ...view, offsetX: host.clientWidth / 2 - local.x, offsetY: host.clientHeight / 2 - local.y };
}

// Кто кем управляет — одним проходом по объекту: спрашивать модель на каждую
// строку значило бы пересортировать все метки полтысячи раз.
function marksControllerIndex(project) {
  const index = new Map();
  if (!project) return index;
  for (const item of project.marks) {
    for (const id of markControlIds(item)) {
      if (!index.has(id)) index.set(id, []);
      index.get(id).push(labelOf(project, item.id));
    }
  }
  return index;
}

// Что показывает строка списка. Свёрнутая — ровно то, что просил заказчик:
// значок и обозначение (плюс отметка повтора номера: три строки «Т1» подряд
// иначе выглядят ошибкой). Раскрытая — прежний вид со всеми полями.
// Решение о полях принимается здесь, а не в разметке: «в модели полей нет»
// означает «в строке их не будет», и проверить это можно без браузера.
function marksRowModel(project, row, options = {}) {
  const mark = row.mark;
  const repeat = options.repeat > 1 ? options.repeat : 0;
  const head = {
    id: mark.id,
    open: Boolean(options.open),
    label: row.label,
    code: row.type ? row.type.code : "?",
    style: row.style,
    typeName: row.type ? row.type.name : "",
    repeat,
    fields: null,
  };
  if (!head.open) return head;
  const controllers = options.controllers instanceof Map ? options.controllers : new Map();
  head.fields = {
    number: mark.number,
    equipment: placementsAt(project, mark.id).length,
    roomId: mark.roomId || null,
    roomManual: markRoomManual(mark),
    location: mark.location || "",
    original: mark.original || "",
    controls: markControls(project, mark.id).map((item) => labelOf(project, item.id)),
    controlledBy: controllers.get(mark.id) || [],
  };
  return head;
}

/**
 * План уплотнения по всему объекту: по группе на тип, внутри — строки
 * «было → стало» того же вида, что в окне одиночного уплотнения. Типы без дыр
 * в план не попадают: на объекте с двадцатью типами список из сотни строк, где
 * значимы три, не читают.
 *
 * Считается по исходному объекту потипно, и это сходится с `compactAllNumbers`:
 * номера каждого типа зависят только от меток этого типа, а их уплотнение
 * соседнего типа не трогает.
 */
function marksCompactPlan(project) {
  if (!project) return [];
  const plan = [];
  for (const { types } of typesInOrder(project)) {
    for (const type of types) {
      const preview = typesCompactPreview(project, type.id);
      if (preview.changes.length === 0) continue;
      plan.push({ typeId: type.id, code: type.code, name: type.name, rows: preview.rows, changes: preview.changes });
    }
  }
  return plan;
}

// Подпись плана: по ней окно и применение договариваются, что речь об одном и
// том же наборе замен. Тот же приём, что у одиночного уплотнения.
function marksCompactSignature(plan) {
  return plan.map((group) => group.typeId + "=" + typesCompactSignature(group)).join("//");
}
function marksCompactTotals(plan) {
  return { types: plan.length, changes: plan.reduce((sum, group) => sum + group.changes.length, 0) };
}

// Уплотнение разрушающее (ADR 003): распечатка на руках у монтажника после
// него начинает врать. Поэтому окно показывает замены целиком, типами, и
// говорит о цене — подтверждение здесь часть команды, а не украшение.
function openMarksCompactAll(plan, { stale } = {}) {
  return new Promise((resolve) => {
    let modal;
    const done = (value) => {
      modal.close();
      resolve(value);
    };
    const totals = marksCompactTotals(plan);
    const groups = plan.map((group) =>
      uiEl("div", { class: "compact__group" }, [
        uiEl("p", {
          class: "compact__groupTitle",
          text: text("marks.compactAllGroup", { code: group.code, name: group.name }),
        }),
        uiEl(
          "div",
          { class: "compact__rows" },
          group.rows.map((row) =>
            uiEl("div", { class: "compact__row" + (row.from === row.to ? " is-same" : "") }, [
              uiEl("span", { class: "compact__label", text: row.fromLabel }),
              uiEl("span", { class: "compact__arrow", text: "→" }),
              uiEl("span", { class: "compact__label", text: row.toLabel }),
              row.count > 1
                ? uiEl("span", { class: "compact__repeat", text: text("dictionary.compactRepeat", { count: row.count }) })
                : null,
            ]),
          ),
        ),
      ]),
    );
    modal = uiModal({
      title: strings.marks.compactAllTitle,
      body: uiEl("div", { class: "compact compact--all" }, [
        stale ? uiEl("p", { class: "compact__warning", text: strings.dictionary.compactStale }) : null,
        uiEl("p", {
          class: "modal__text",
          text: text("marks.compactAllSummary", { count: totals.changes, types: totals.types }),
        }),
        ...groups,
        uiEl("p", { class: "compact__warning", text: strings.dictionary.compactWarning }),
      ]),
      actions: [
        uiButton(strings.dialog.cancel, { on: { click: () => done(false) } }),
        uiButton(strings.dictionary.compactApply, {
          class: "ui-btn ui-btn--danger",
          on: { click: () => done(true) },
        }),
      ],
      onCancel: () => resolve(false),
    });
  });
}

function mountMarksPanel(host, api) {
  const { getState, setState, notify } = api;
  const filters = filtersBox(api);
  const list = uiEl("div", { class: "marks" });
  const count = uiEl("p", { class: "marks__count" });
  // Смыкание номеров — под списком, как просил заказчик: команда про весь
  // объект, а не про открытую схему, и место ей после списка, а не среди
  // фильтров. Уплотнение по одному типу осталось в справочнике.
  const compactButton = uiButton(strings.marks.compactAll, {
    class: "ui-btn ui-btn--wide",
    title: strings.marks.compactAllHint,
    on: { click: () => compactAll() },
  });
  const foot = uiEl("div", { class: "marks__foot" }, [compactButton]);
  host.replaceChildren(uiEl("div", { class: "marks__top" }, [filters.node, count]), list, foot);
  // Пока курсор стоит в текстовом поле строки, список не пересобирается: иначе
  // буква, набранная в «Расположении», выбрасывала бы фокус после каждой правки.
  // Поле поиска сюда не входит: оно живёт над списком, и набор в нём обязан
  // перестраивать список по ходу — ради этого он и набирается.
  let pending = false;
  let shownSelection = "";

  // Номер правится числовым полем — оно тоже держит список от пересборки,
  // иначе набранная цифра выбрасывала бы курсор из поля.
  function typing() {
    const active = document.activeElement;
    if (!active || !list.contains(active) || active.tagName !== "INPUT") return false;
    return active.type === "text" || active.type === "number";
  }

  function fail(error) {
    notify(error && error.message ? error.message : String(error), "error");
  }

  function selectMark(markId) {
    const state = getState();
    const scheme = state.project ? findScheme(state.project, state.schemeId) : null;
    const mark = state.project ? findMark(state.project, markId) : null;
    if (!scheme || !mark) return;
    setState({ selectedMarkIds: [markId], view: marksCenteredView(scheme, mark, state.view) });
  }

  // Уплотнение по всему объекту. Считает и применяет модель
  // (`compactAllNumbers`) — одним вызовом, поэтому и шаг истории один: отмена
  // возвращает весь набор замен целиком, а не тип за типом.
  async function compactAll() {
    const state = getState();
    if (!state.project) {
      notify(strings.marks.compactAllNoProject, "info");
      return;
    }
    let plan = marksCompactPlan(getState().project);
    let stale = false;
    // Пока окно висит открытым, объект могли поменять — поставить метку,
    // вернуть номера чужим Ctrl+Z. Применяем по свежему объекту, но молча
    // подменить одобренный список нельзя: разошлось — показываем новый и
    // спрашиваем заново.
    for (;;) {
      if (plan.length === 0) {
        notify(strings.marks.compactAllNothing, "info");
        return;
      }
      const agreed = await openMarksCompactAll(plan, { stale });
      if (!agreed) return;
      const current = getState().project;
      if (!current) return;
      const fresh = marksCompactPlan(current);
      if (marksCompactSignature(fresh) === marksCompactSignature(plan)) {
        const result = compactAllNumbers(current);
        if (result.project !== current) canvasCommit(current, result.project, strings.history.compactAll);
        return;
      }
      plan = fresh;
      stale = true;
    }
  }

  function setField(markId, field, value) {
    const state = getState();
    const mark = state.project ? findMark(state.project, markId) : null;
    if (!mark) return;
    const next = value.trim();
    if ((mark[field] || "") === next) return;
    try {
      canvasCommit(state.project, updateMark(state.project, markId, { [field]: next }).project, strings.history.markField);
    } catch (error) {
      fail(error);
    }
  }

  // Номер метки ставится руками: несколько одинаковых светильников одной группы
  // носят один номер. Повтор модель разрешает и помечает предупреждением —
  // здесь он только доезжает до истории одним шагом отмены.
  function setNumber(markId, value) {
    const state = getState();
    const mark = state.project ? findMark(state.project, markId) : null;
    if (!mark) return;
    try {
      const next = setMarkNumber(state.project, markId, value);
      if (next.project === state.project) return;
      canvasCommit(state.project, next.project, strings.history.markNumber);
    } catch (error) {
      fail(error);
      render();
    }
  }

  // Комната заводится по ходу: новое название добавляется в справочник объекта
  // и тем же шагом истории проставляется метке.
  function setRoom(markId, name) {
    const state = getState();
    const mark = state.project ? findMark(state.project, markId) : null;
    if (!mark) return;
    try {
      const ensured = roomsEnsure(state.project, name);
      const roomId = ensured.room ? ensured.room.id : null;
      if (roomId === (mark.roomId || null) && markRoomManual(mark) && ensured.project === state.project) return;
      canvasCommit(
        state.project,
        updateMark(ensured.project, markId, { roomId, roomManual: true }).project,
        strings.history.markRoom,
      );
    } catch (error) {
      fail(error);
      render();
    }
  }

  // Возврат метки автоматике: снимаем признак ручной правки, а помещение
  // подставит по контуру canvasCommit — тем же шагом истории.
  function setAutoRoom(markId) {
    const state = getState();
    const mark = state.project ? findMark(state.project, markId) : null;
    if (!mark || !markRoomManual(mark)) return;
    try {
      canvasCommit(
        state.project,
        updateMark(state.project, markId, { roomManual: false }).project,
        strings.history.markRoomAuto,
      );
    } catch (error) {
      fail(error);
      render();
    }
  }

  // Пока окно открыто, объект мог уехать (отмена, чужая правка): список
  // отмеченного сверяется со свежим снимком, прежде чем стать шагом истории.
  async function editControls(markId) {
    const state = getState();
    if (!state.project || !layoutAllows("editMarks", state.layout)) return;
    const picked = await openMarkControlsPicker(state.project, markId);
    if (!picked) return;
    const fresh = getState();
    if (!fresh.project || !findMark(fresh.project, markId)) return;
    try {
      const alive = picked.filter((id) => findMark(fresh.project, id));
      const next = setMarkControls(fresh.project, markId, alive);
      canvasCommit(fresh.project, next.project, strings.history.markControls);
    } catch (error) {
      fail(error);
    }
  }

  async function askNewRoom(markId) {
    const name = await uiPrompt({ title: strings.rooms.newTitle, placeholder: strings.rooms.namePlaceholder });
    if (!name) {
      render();
      return;
    }
    setRoom(markId, name);
  }

  function roomField(state, mark) {
    const manual = markRoomManual(mark);
    const select = uiEl("select", {
      class: "ui-select marks__room" + (manual ? " is-manual" : ""),
      title: manual ? strings.marks.roomManual : strings.marks.roomAuto,
    });
    const auto = mark.roomId ? findRoom(state.project, mark.roomId) : null;
    select.append(
      uiEl("option", {
        value: MARKS_AUTO_ROOM,
        text: auto ? text("rooms.autoOf", { name: auto.name }) : strings.rooms.auto,
      }),
    );
    select.append(uiEl("option", { value: "", text: strings.rooms.none }));
    for (const room of roomsInOrder(state.project)) {
      select.append(uiEl("option", { value: room.id, text: room.name }));
    }
    select.append(uiEl("option", { value: MARKS_NEW_ROOM, text: strings.rooms.newRoom }));
    select.value = manual ? mark.roomId || "" : MARKS_AUTO_ROOM;
    select.addEventListener("change", () => {
      if (select.value === MARKS_NEW_ROOM) {
        askNewRoom(mark.id);
        return;
      }
      if (select.value === MARKS_AUTO_ROOM) {
        setAutoRoom(mark.id);
        return;
      }
      const room = select.value ? roomsInOrder(state.project).find((item) => item.id === select.value) : null;
      setRoom(mark.id, room ? room.name : "");
    });
    return select;
  }

  // Раскрыта та метка, что выделена: клик по строке и клик по метке на плане
  // — один и тот же выбор, и показывать они должны одно и то же. Поэтому
  // отдельного «раскрытого» состояния нет: одно выделение на список и холст.
  function markRow(state, row, selected, repeats, controllers) {
    const mark = row.mark;
    const view = marksRowModel(state.project, row, {
      open: selected,
      repeat: repeats.get(mark.id) || 0,
      controllers,
    });
    const badge =
      view.repeat > 0
        ? uiEl("span", {
            class: "mark-row__repeat",
            text: text("marks.repeatBadge", { count: view.repeat }),
            title: text("problems.repeatedNumber", { label: view.label, count: view.repeat }),
          })
        : null;
    // Свёрнутая строка — значок и обозначение: ровно то, по чему метку ищут
    // глазами. Полей в ней нет и в разметке: при полусотне меток это ещё и
    // полсотни неподнятых полей ввода.
    const head = view.fields
      ? uiEl("div", { class: "mark-row__head" }, [
          // Галочка раскрытия — одна и та же в обоих видах: по ней видно,
          // свёрнута строка или раскрыта, и куда нажать.
          uiEl("span", { class: "mark-row__toggle" }),
          shapeIcon(view.style.shape, view.style.color, 20),
          // Код типа стоит там же, где в свёрнутой строке, — на раскрытии
          // значок и код остаются на месте, меняется только номер: он
          // становится полем правки.
          uiEl("span", { class: "mark-row__label", text: view.code }),
          uiEl("input", {
            class: "ui-input mark-row__number",
            type: "number",
            value: String(view.fields.number),
            title: strings.marks.number,
            attrs: { min: "1", max: String(MARK_NUMBER_MAX), step: "1" },
            on: { change: (event) => setNumber(mark.id, event.target.value) },
          }),
          badge,
          // Название типа — второй строкой головы и приглушённо: по значку тип
          // угадывается не всегда, а в справочнике легко заводятся два похожих.
          // Подсказкой — оно же целиком: в узкой панели длинное имя обрезается.
          uiEl("span", { class: "mark-row__type", text: view.typeName, title: view.typeName }),
        ])
      : uiEl("div", { class: "mark-row__head" }, [
          uiEl("span", { class: "mark-row__toggle" }),
          shapeIcon(view.style.shape, view.style.color, 20),
          uiEl("span", { class: "mark-row__label", text: view.label }),
          badge,
        ]);
    // Оборудование на этой метке: своё окно планирования, открытое сразу на ней.
    const equipmentButton = view.fields
      ? uiButton(
          view.fields.equipment > 0
            ? text("equipment.count", { count: view.fields.equipment })
            : strings.equipment.open,
          {
            class: "ui-btn ui-btn--wide mark-row__equipment" + (view.fields.equipment > 0 ? " is-set" : ""),
            title: strings.equipment.onMark,
            on: { click: () => openEquipmentWindow(api, { markId: mark.id }) },
          },
        )
      : null;
    const controlsButton = view.fields
      ? uiButton(
          view.fields.controls.length > 0
            ? text("marks.controlsOf", { labels: view.fields.controls.join(", ") })
            : strings.marks.controls,
          {
            class: "ui-btn ui-btn--wide mark-row__controls" + (view.fields.controls.length > 0 ? " is-set" : ""),
            title: strings.marks.controlsTitle,
            on: { click: () => editControls(mark.id) },
          },
        )
      : null;
    const node = uiEl(
      "div",
      {
        class: "mark-row" + (view.open ? " is-current is-open" : ""),
        title: strings.marks.focus,
      },
      [
        head,
        view.fields ? roomField(state, mark) : null,
        view.fields
          ? uiEl("input", {
              class: "ui-input",
              type: "text",
              value: view.fields.location,
              placeholder: strings.marks.locationPlaceholder,
              title: strings.marks.location,
              on: { change: (event) => setField(mark.id, "location", event.target.value) },
            })
          : null,
        view.fields
          ? uiEl("input", {
              class: "ui-input",
              type: "text",
              value: view.fields.original,
              placeholder: strings.marks.originalPlaceholder,
              title: strings.marks.original,
              on: { change: (event) => setField(mark.id, "original", event.target.value) },
            })
          : null,
        controlsButton,
        equipmentButton,
        // Обратная сторона связи — строкой и только для чтения: стоя у
        // светильника, надо видеть, какой выключатель его включает, а правится
        // связь там, где её завели, — у выключателя.
        view.fields && view.fields.controlledBy.length > 0
          ? uiEl("p", {
              class: "mark-row__by",
              text: text("marks.controlledBy", { labels: view.fields.controlledBy.join(", ") }),
            })
          : null,
      ],
    );
    node.addEventListener("pointerdown", (event) => {
      if (event.target.closest("input, select, button, option")) return;
      selectMark(mark.id);
    });
    // Режим просмотра: строка читается и подводит к метке на плане, но поля
    // в ней не правятся — правка живёт на широком экране.
    if (!layoutAllows("editMarks", state.layout)) {
      for (const field of node.querySelectorAll("input")) field.readOnly = true;
      for (const field of node.querySelectorAll("select")) field.disabled = true;
      // Кнопка связи — тоже правка: в режиме просмотра она не нажимается.
      for (const button of node.querySelectorAll("button")) button.disabled = true;
    }
    return node;
  }

  // Кнопка с места не исчезает, даже когда смыкать нечего: пользователь
  // спрашивает у неё «а есть ли дыры?» — и получает ответ строкой, а не
  // пустым окном. В режиме просмотра правок нет вовсе, там её не показываем.
  function syncCompact(state) {
    foot.hidden = !layoutAllows("editMarks", state.layout);
    compactButton.disabled = !state.project;
  }

  function render() {
    pending = false;
    const state = getState();
    syncCompact(state);
    if (!state.project || !state.schemeId) {
      count.textContent = "";
      list.replaceChildren(uiEl("p", { class: "panel__empty", text: strings.panels.canvasEmpty }));
      return;
    }
    const rows = filtersMarkRows(state.project, state.schemeId, state.filter);
    const total = state.project.marks.filter((mark) => mark.schemeId === state.schemeId).length;
    count.textContent = total > 0 ? text("marks.count", { shown: rows.length, total }) : "";
    if (rows.length === 0) {
      list.replaceChildren(
        uiEl("p", { class: "panel__empty", text: total > 0 ? strings.marks.nothingFound : strings.panels.marksEmpty }),
      );
      return;
    }
    const selected = new Set(state.selectedMarkIds);
    // Повтор номера ищется по всему объекту, а не по видимым строкам: два Т1 на
    // разных схемах — такой же повтор, и предупредить о нём надо в обеих.
    const repeats = new Map();
    for (const item of repeatedNumbers(state.project)) {
      for (const markId of item.markIds) repeats.set(markId, item.count);
    }
    const controllers = marksControllerIndex(state.project);
    list.replaceChildren(
      ...rows.map((row) => markRow(state, row, selected.has(row.mark.id), repeats, controllers)),
    );
    // Подводим список к выделенной строке только когда выделение сменилось:
    // иначе правка поля в одной строке уводила бы список к другой.
    const selection = state.selectedMarkIds.join(",");
    const current = list.querySelector(".mark-row.is-current");
    if (current && selection !== shownSelection) current.scrollIntoView({ block: "nearest" });
    shownSelection = selection;
  }

  // Отложенная перерисовка: то, что накопилось, пока пользователь печатал.
  host.addEventListener("focusout", () => {
    if (!pending) return;
    setTimeout(() => {
      if (!typing()) render();
    }, 0);
  });
  api.subscribe((state, changed) => {
    if (
      !(
        "project" in changed ||
        "schemeId" in changed ||
        "filter" in changed ||
        "selectedMarkIds" in changed ||
        "layout" in changed
      )
    ) {
      return;
    }
    if (typing()) {
      pending = true;
      return;
    }
    render();
  });
  render();
}
