<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-text="app.title"></title>
    <!-- Значок вкладки: план из двух помещений и метка на нём — то, что делает
         сам инструмент. Нарисован здесь же: страница самодостаточна, внешних
         ссылок в ней нет, поэтому рисунок лежит в самом адресе `data:`.
         Проверен в размере вкладки (16×16), а не только крупно. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230d1117'/%3E%3Crect%20x='6'%20y='6.5'%20width='20'%20height='19'%20fill='none'%20stroke='%23e6edf3'%20stroke-width='2.4'/%3E%3Cpath%20d='M6%2014h20'%20fill='none'%20stroke='%23e6edf3'%20stroke-width='2.4'/%3E%3Ccircle%20cx='18.5'%20cy='19.8'%20r='3.9'%20fill='%231f6feb'%20stroke='%230d1117'%20stroke-width='1.4'/%3E%3C/svg%3E" />
    <style>
/* Холст разметки, подсказка поверх него и панель инструментов. */

.canvas {
  display: block;
  touch-action: none; /* щипок и панорама разбираются сами, браузер не мешает */
  background: transparent;
}

/* Отступ от края холста считает `canvas.canvasHintInset`: линейка занимает
   полосу в RULER_SIZE пикселей сверху и слева, и подсказка начинается за ней.
   Спрятали линейку отметкой в «Размерах» — отступ уходит вместе с ней, пустого
   поля сверху не остаётся. Мера приходит из JS, чтобы размер линейки жил в
   одном месте (`render.RULER_SIZE`), а не двоился здесь числом. */
.canvas-hint {
  position: absolute;
  left: calc(12px + var(--canvas-hint-inset, 0px));
  top: calc(12px + var(--canvas-hint-inset, 0px));
  max-width: min(460px, calc(100% - 24px - var(--canvas-hint-inset, 0px)));
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 6px 10px;
  border: 1px solid var(--canvas-line);
  border-left-width: 4px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.92);
  color: #57606a;
  font-size: 12px;
  line-height: 1.35;
}

/* Свёрнутая подсказка — одна кнопка: рамка, поле и подложка уходят к ней. */
.canvas-hint.is-collapsed {
  padding: 0;
  border: 0;
  background: transparent;
}

.canvas-hint__text {
  margin: 0;
}

.canvas-hint__text[hidden] {
  display: none;
}

/* Единственное место подсказки, которое берёт клики. Само поле подсказки их
   не берёт (`#canvas-overlay` — `pointer-events: none`): под ней план, и метка
   обязана вставать сквозь неё, как вставала до сворачивания. */
.canvas-hint__toggle {
  position: relative;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  margin: -1px 0;
  padding: 0;
  border: 1px solid var(--canvas-line);
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.92);
  color: #57606a;
  cursor: pointer;
  pointer-events: auto;
}

.canvas-hint__toggle:hover,
.canvas-hint__toggle:focus-visible {
  color: var(--accent);
}

.canvas-hint__toggle .ui-icon {
  --ui-icon: 14px;
}

.canvas-hint.is-collapsed .canvas-hint__toggle {
  width: 26px;
  height: 26px;
  margin: 0;
}

.canvas-hint.is-collapsed .canvas-hint__toggle .ui-icon {
  --ui-icon: 16px;
}

/* Текст сменился, пока подсказка была свёрнута: точка на кнопке. Разворачивать
   подсказку самим нельзя — её свернули осознанно, и она выпрыгивала бы под
   рукой на каждую смену типа; но и молча съесть «второй Esc возвращает в
   „Выделение“» нельзя. */
.canvas-hint__toggle.is-new::after {
  content: "";
  position: absolute;
  top: -3px;
  right: -3px;
  width: 8px;
  height: 8px;
  border: 1px solid #fff;
  border-radius: 50%;
  background: var(--accent);
}

/* Палец крупнее курсора: в просмотре кнопка подрастает вместе с остальными. */
#app.is-mobile .canvas-hint__toggle {
  width: 30px;
  height: 30px;
}

.tools {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.tools__label {
  margin: 6px 0 0;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--panel-muted);
}

.tools__type {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--panel-line);
  background: #21262d;
  color: var(--panel-text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.tools__type.is-set {
  border-color: var(--accent);
}

.tools__type:hover {
  border-color: var(--panel-muted);
}

/* Подпись «Выбрать» у плашки: по ней видно, что плашка нажимается. */
.tools__pick {
  flex: none;
  margin-left: auto;
  padding: 2px 6px;
  border-radius: 5px;
  border: 1px solid var(--panel-line);
  background: #30363d;
  color: var(--panel-text);
  font-size: 11px;
  white-space: nowrap;
}

.tools__type:hover .tools__pick,
.tools__room:hover .tools__pick {
  border-color: var(--accent);
}

.tools__code {
  font-weight: 700;
  font-size: 15px;
}

.tools__typeName {
  color: var(--panel-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Что делает «Добавление» при нынешнем типе — словами, под кнопками режима.
   На плашке типа этой строке места нет: она съедала название до «Точе…». */
.tools__note {
  margin: 0;
  color: var(--panel-muted);
  font-size: 11px;
  line-height: 1.35;
}

/* Заголовок выключенного ряда гаснет вместе со своим полем: «Блок точек»
   у линейного типа не работает, и обещать его словом нельзя. */
.tools__label--off {
  opacity: 0.45;
}

/* Помещение для обводки — та же плитка, что и выбранный тип метки. */
.tools__room {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 8px;
  border-radius: 8px;
  border: 1px solid var(--panel-line);
  background: #21262d;
  color: var(--panel-text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.tools__room.is-set {
  border-color: var(--accent);
}

.tools__room:hover {
  border-color: var(--panel-muted);
}

/* Кружок цвета помещения: им же обводится контур на схеме. */
.rooms__swatch {
  flex: none;
  display: inline-block;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.35);
}

.tools__row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tools__row--modes .ui-btn {
  flex: 1 1 auto;
}

.ui-btn.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.tools__field {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--panel-muted);
}

.tools__field > span {
  min-width: 68px;
}

/* Отметка «линейка и направляющие»: галочка слева, подпись во всю строку —
   у неё нет ползунка, и колонка под название ей не нужна. */
.tools__field--check {
  cursor: pointer;
}

.tools__field--check > span {
  min-width: 0;
}

.tools__check {
  flex: none;
  accent-color: var(--accent);
}

.tools__slider {
  flex: 1 1 auto;
  min-width: 0;
  accent-color: var(--accent);
}

/* Окно выбора типа */

.picker {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(420px, 78vw);
}

.picker__list {
  max-height: 46vh;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.picker__group {
  margin-top: 8px;
  padding: 2px 0 2px 8px;
  border-left: 3px solid var(--panel-line);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.picker__row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--panel-text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.picker__row:hover,
.picker__row.is-active {
  background: #21262d;
  border-color: var(--panel-line);
}

/* Значок фигуры (`render.shapeIcon`) в строке списка и на кнопке типа
   не сжимается вместе с текстом. */
.picker__row .shape-icon,
.tools__type .shape-icon {
  flex: 0 0 auto;
}

.picker__code {
  font-weight: 700;
  min-width: 26px;
}

.picker__name {
  color: var(--panel-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.picker__create {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--panel-line);
}

.picker__create:empty {
  display: none;
}

.picker__createTitle {
  margin: 0;
  font-size: 12px;
  color: var(--panel-muted);
}

.picker__field {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--panel-muted);
}

.picker__field > span {
  min-width: 82px;
}

.picker__error {
  margin: 0;
  color: #ff9aa2;
  font-size: 12px;
}

/* Окно сужено до вида метки — строка говорит, почему справочник неполный. */
.picker__note {
  margin: 0;
  color: var(--panel-muted);
  font-size: 12px;
}

.picker__error:empty {
  display: none;
}

/* ——— окно выбора цвета ————————————————————————————————————————————————
   Слева палитра объекта, справа — поле оттенка и числа. Всё, что здесь
   делается мышью, делается и с клавиатуры, поэтому у каждого управляемого
   элемента есть видимая рамка фокуса. */

.colorpick {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  align-items: flex-start;
}

.colorpick__side {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.colorpick__caption {
  margin: 0;
  font-size: 12px;
  color: var(--panel-muted);
}

.colorpick__palette {
  display: grid;
  grid-template-columns: repeat(6, 32px);
  gap: 6px;
}

.colorpick__swatch {
  position: relative;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 6px;
  cursor: pointer;
}

.colorpick__swatch:hover {
  border-color: var(--panel-text);
}

.colorpick__swatch.is-active {
  box-shadow: 0 0 0 2px var(--panel-bg), 0 0 0 4px var(--panel-text);
}

/* Занятый цвет не запрещён, но помечен: повтор цвета на плане должен быть
   сознательным, а не случайным. */
.colorpick__swatch.is-used::after {
  content: "";
  position: absolute;
  right: 3px;
  top: 3px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(13, 17, 23, 0.75);
  border: 1px solid rgba(255, 255, 255, 0.6);
}

.colorpick__field {
  display: block;
  width: 232px;
  height: 168px;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  cursor: crosshair;
  touch-action: none;
}

.colorpick__hue {
  display: block;
  width: 232px;
  height: 18px;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  cursor: ew-resize;
  touch-action: none;
}

.colorpick__swatch:focus-visible,
.colorpick__field:focus-visible,
.colorpick__hue:focus-visible,
.colorpick__button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.colorpick__bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.colorpick__preview {
  display: flex;
  align-items: center;
  gap: 6px;
}

.colorpick__chip {
  flex: none;
  display: inline-block;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.35);
}

.colorpick__chip--before {
  width: 18px;
  height: 18px;
  opacity: 0.8;
}

/* Предпросмотр «как на плане»: белый лист, линия контура цветом и его же
   разведённая заливка. Цвет линии и заливки проставляются на месте. */
.colorpick__plan {
  flex: none;
  display: inline-block;
  width: 26px;
  height: 26px;
  border: 2px solid transparent;
  border-radius: 4px;
  background: #ffffff;
}

.colorpick__value {
  font-size: 12px;
  color: var(--panel-muted);
  font-variant-numeric: tabular-nums;
}

.colorpick__numbers {
  display: flex;
  gap: 6px;
}

.colorpick__number-box {
  display: flex;
  align-items: center;
  gap: 4px;
}

.colorpick__number-label {
  font-size: 12px;
  color: var(--panel-muted);
}

.colorpick__number {
  width: 54px;
  padding: 4px 6px;
  text-align: right;
}

.colorpick__random {
  align-self: flex-start;
}

/* Кнопка цвета в строке помещения или категории — она же предпросмотр. */
.colorpick__button {
  flex: none;
  width: 32px;
  height: 28px;
  padding: 0;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  cursor: pointer;
}

.colorpick__button:hover {
  border-color: var(--panel-text);
}

/* Работа с файлом проекта в шапке: папка автосохранения, «Открыть файл» и
   «Экспорт» с отметкой свежести выгрузки. */

#file-actions {
  display: flex;
  align-items: center;
  margin-left: 12px;
}

.file {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Отметка свежести выгрузки: точка на кнопке экспорта. Зелёная — объект целиком
   в файле, жёлтая — пора выгружать, пустая с жёлтым ободком — не выгружали ни
   разу. Словами состояние названо в подсказке кнопки. */
.file__dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 6px;
  vertical-align: middle;
  border: 1px solid transparent;
  border-radius: 50%;
  background: transparent;
}

.file__dot.is-fresh {
  background: #56d364;
}

.file__dot.is-stale,
.file__dot.is-old {
  background: #ffd33d;
}

.file__dot.is-never {
  border-color: #ffd33d;
}

/* Пока идёт запись, отметка ничего не утверждает. */
.file.is-busy .file__dot {
  opacity: 0.5;
}

/* Папка выбрана и разрешена — кнопка выглядит включённой. */
.file .ui-btn.is-on {
  border-color: var(--ok);
  color: var(--ok);
}

.file__picker {
  display: none;
}

/* Список меток, фильтры и справочник объекта. Панель узкая, поэтому поля
   строки стоят столбиком: подписи заменяют подсказки-title. */

.filters {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--panel-line);
}

.filters__details {
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  padding: 4px 6px;
  background: var(--panel-bg-deep);
}

.filters__summary {
  cursor: pointer;
  color: var(--panel-muted);
  font-size: 12px;
  list-style: none;
}

.filters__summary::before {
  content: "▸ ";
}

.filters__details[open] .filters__summary::before {
  content: "▾ ";
}

.filters__tree {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 220px;
  overflow: auto;
  padding: 6px 0 2px;
}

.filters__category,
.filters__type {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--panel-text);
  font-size: 12px;
  cursor: pointer;
}

.filters__category {
  font-weight: 600;
  margin-top: 4px;
}

.filters__type {
  padding-left: 16px;
  color: var(--panel-muted);
}

.filters__check {
  margin: 0;
  accent-color: var(--accent);
}

.filters__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex: none;
}

.filters__code {
  min-width: 22px;
  font-weight: 600;
  color: var(--panel-text);
}

.filters__name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.marks__count {
  margin: 8px 0 4px;
  color: var(--panel-muted);
  font-size: 12px;
}

.marks {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Свёрнутая строка — одна строка списка: значок и обозначение. Раскрывается
   выделением: выделенная метка раскрыта, остальные свёрнуты, поэтому клик по
   метке на плане и клик по строке показывают одно и то же. */
.mark-row {
  /* Отступ второй строки головы: галочка 10 + значок 20 + два зазора по 6 —
     ровно столько, чтобы название типа встало под код, а не под значок. */
  --mark-row-indent: 42px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 4px 6px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: var(--panel-bg-deep);
  cursor: pointer;
}

.mark-row:hover {
  border-color: var(--panel-line);
}

.mark-row.is-open {
  padding: 6px;
  border-color: var(--panel-line);
}

/* Галочка раскрытия: состояние строки видно до нажатия. */
.mark-row__toggle {
  flex: none;
  width: 10px;
  color: var(--panel-muted);
  font-size: 10px;
  line-height: 1;
}

.mark-row__toggle::before {
  content: "▸";
}

.mark-row.is-open .mark-row__toggle::before {
  content: "▾";
}

.mark-row.is-current {
  border-color: var(--accent);
}

.mark-row__head {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Раскрытая голова — две строки: код с номером и название типа под ними.
   Перенос включается только у раскрытой: у свёрнутой строки голова обязана
   остаться прежней, а перенос уводил бы отметку повтора на вторую строку. */
.mark-row.is-open .mark-row__head {
  flex-wrap: wrap;
}

/* Обозначение в строке: у свёрнутой — целиком («Р3»), у раскрытой — код типа,
   номер рядом полем правки. Занимает всё, что осталось от узкого поля номера,
   и сжимается многоточием: длинный код («ПОДСВЕТКАКРОВАТИ») не должен
   выдавливать номер за край панели — она узкая, 264 пикселя.
   Основа 0 не даёт коду переносить номер на вторую строку. */
.mark-row__label {
  flex: 1 1 0;
  min-width: 0;
  font-weight: 700;
  color: var(--panel-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Номер правится в строке: поле по содержимому — четыре цифры потолка
   (MARK_NUMBER_MAX) со стрелками, — а не во всю ширину строки, иначе номер
   плавает посреди пустоты. Меру приходится защищать от `.ui-input { width:
   100% }`: общие стили панелей идут в сборке после этого файла. */
.mark-row .mark-row__number {
  flex: none;
  width: 56px;
  padding: 2px 4px;
  font-weight: 700;
  text-align: center;
}

/* Повтор номера — приём, а не ошибка: жёлтая пометка, а не красная. */
.mark-row__repeat {
  color: #e36209;
  border: 1px solid #e36209;
  border-radius: 999px;
  padding: 0 5px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

/* Название типа — второй строкой раскрытой головы, под кодом: по значку тип
   угадывается не всегда. Приглушённое и на своей строке, отступ — ровно под
   код, чтобы читалось продолжением обозначения, а не отдельной подписью. */
.mark-row__type {
  flex: 0 0 100%;
  padding-left: var(--mark-row-indent);
  color: var(--panel-muted);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Справочник объекта */

.dict-panel {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.dict {
  display: flex;
  flex-direction: column;
  gap: 6px;
  /* Меры, из которых складывается хвост строки типа: промежуток, кнопка конца
     строки и счётчик меток. Строка добавления считает по ним ширину своей
     кнопки — иначе колонки двух строк сходились бы только случайно, по ширине
     набранного в кнопках текста. */
  --dict-gap: 6px;
  --dict-act: 36px;
  --dict-count: 28px;
  /* Клетка знака: кнопка формы и кнопка начертания стоят в одной колонке и
     потому одной ширины. Мерой, а не числом в трёх местах, — по ней считает
     ширину и кнопка строки добавления категории. */
  --dict-sign: 64px;
  /* Колонок в строке стало больше — значок, код, название, категория,
     переключатель вида, обозначение, счётчик и три кнопки, — и на общей мере
     диалогов название типа ужималось до «Точеч». Ширину задаёт справочник, а
     карточка идёт за ним (`.modal--wide`); на узком экране остаётся вьюпорт,
     и строка прокручивается внутри списка, как и раньше. */
  min-width: min(780px, 92vw);
  max-height: 60vh;
  overflow: auto;
  /* Полоса прокрутки идёт поверх содержимого: без этого поля кнопка строки
     добавления уходит под неё — у строк типа запас даёт корзина, у этой нет. */
  padding-right: 8px;
}

/* Заголовок раздела остаётся виден при прокрутке — тем же приёмом, каким
   липнут заголовки секций левой колонки (`.panel__head`). Своего второго вида
   заголовка в справочнике нет. */
.dict__title {
  position: sticky;
  top: 0;
  z-index: 2;
  margin: 10px 0 2px;
  padding: 2px 0;
  background: var(--panel-bg);
  color: var(--panel-text);
  font-size: 13px;
}

.dict__group {
  margin: 8px 0 0;
  color: var(--panel-muted);
  font-size: 12px;
}

.dict__row {
  display: flex;
  align-items: center;
  gap: var(--dict-gap);
}

/* Строки справочника стоят колонка в колонку независимо от вида типа.
   Меры колонок заданы здесь, а не подбираются в JS: следующий добавленный
   в строку элемент не должен ломать выравнивание заново.

   Ширину диктует не фигура, а образец линии: сплющить его до значка фигуры
   нельзя — точечную линию от штрихпунктирной в 26px не отличить. Поэтому
   фигура садится в клетку той же ширины, что и образец. */
.dict__badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 30px;
}

/* Свотч цвета в строке категории занимает ту же колонку, что значок типа:
   иначе название категории начинается не там, где код типа. */
.dict__row .colorpick__button {
  width: 48px;
  height: 30px;
}

/* Переключатель вида — своя колонка постоянной ширины: «Точка» и «Линия»
   набираются разным числом пикселей, и без меры строки разъезжались бы
   по одной этой причине. */
.dict__kindItem {
  min-width: 58px;
}

.dict__row--add {
  padding-top: 6px;
  border-top: 1px dashed var(--panel-line);
}

/* Кнопки конца строки типа — своей мерой, а не по ширине глифа: «№» и корзина
   набираются разным числом пикселей, и хвост строки, с которым равняется
   строка добавления, перестал бы быть считаемым. */
.dict__act {
  flex: none;
  width: var(--dict-act);
  padding: 4px 0;
}

/* Кнопка строки добавления занимает ровно хвост строки типа — счётчик, две
   кнопки и промежутки между ними. Тогда остаток ширины, который забирают код,
   название и категория, у обеих строк один, и всё до кнопки — значок, поля,
   переключатель вида и знак — стоит колонка в колонку. */
.dict__add {
  flex: none;
  width: calc(var(--dict-count) + var(--dict-act) * 2 + var(--dict-gap) * 2);
}

/* То же самое для строки добавления категории, только хвост у строки категории
   другой: начертание и корзина. Считается мерами, а не подбирается под подпись,
   — поэтому подпись кнопки и укорочена до «Добавить»: «Добавить категорию»
   набиралось 158 px при 106 доступных, и цвет с названием стояли не под теми
   же колонками, что у строк категорий. */
.dict__addCategory {
  flex: none;
  width: calc(var(--dict-sign) + var(--dict-gap) + var(--dict-act));
}

.dict__row .ui-input {
  flex: 1;
  min-width: 0;
}

/* Поле, которое модель не приняла: строка добавления остаётся с набранным, и
   пометка говорит, что править. Снимается с первой буквой правки.
   Рамки мало: курсор встаёт в это же поле, и родное кольцо фокуса рамку
   перекрывает — поэтому ещё и подложка. */
.dict__row .ui-input.is-wrong {
  border-color: var(--danger);
  background: rgba(209, 36, 47, 0.18);
}

/* Код типа — до шестнадцати букв (`CODE_MAX_LENGTH`), поэтому поле шире
   прежних двух знаков; длинное название типа ужимается рядом само. */
.dict__code {
  flex: none;
  width: 120px;
  text-align: center;
  font-weight: 700;
}

.dict__count {
  flex: none;
  min-width: var(--dict-count);
  text-align: right;
  color: var(--panel-muted);
  font-size: 12px;
}

/* Окно «Добавить из общей базы». Классы свои, хотя строки похожи на строки
   справочника и на список уплотнения: отступ строки типа правится вместе с
   каталогом, а не заодно с чужим окном. */
.catalog {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 360px;
}

.catalog__rows {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 50vh;
  overflow: auto;
}

.catalog__row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 4px;
  border-radius: 4px;
  cursor: pointer;
}

.catalog__row:hover {
  background: var(--panel-bg-deep);
}

/* Заголовок категории: её цвет задаёт панель, здесь только вес и воздух. */
.catalog__row--group {
  margin-top: 6px;
  font-weight: 700;
}

/* Строка типа отступает от заголовка — видно, что она внутри категории. */
.catalog__row--type {
  padding-left: 22px;
}

.catalog__code {
  flex: none;
  min-width: 52px;
  font-weight: 700;
}

/* Название ужимается первым: код и значок дороже. */
.catalog__name {
  flex: 1 1 0;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* Предпросмотр уплотнения: список замен «было → стало». */
.compact {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 320px;
}

.compact__rows {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 40vh;
  overflow: auto;
}

.compact__row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 4px;
  border-radius: 4px;
  background: var(--panel-bg-deep);
}

/* Номер остался прежним — строка есть, но глаз за неё не цепляется. */
.compact__row.is-same {
  background: none;
  color: var(--panel-muted);
}

.compact__label {
  font-weight: 700;
  min-width: 44px;
}

.compact__arrow {
  color: var(--panel-muted);
}

.compact__repeat {
  margin-left: auto;
  color: #e36209;
  font-size: 11px;
}

.compact__warning {
  margin: 0;
  color: #e36209;
  font-size: 12px;
}

.rooms {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 50vh;
  overflow: auto;
}

.rooms__row,
.rooms__add {
  display: flex;
  align-items: center;
  gap: 6px;
}

.rooms__row .ui-input,
.rooms__add .ui-input {
  flex: 1;
  min-width: 0;
}

/* Вписанное руками помещение подчёркнуто: по контуру оно больше не меняется. */
.marks__room.is-manual {
  border-color: var(--accent);
}

.rooms__count {
  flex: none;
  color: var(--panel-muted);
  font-size: 12px;
}

/* Выбор формы: сетка нарисованных обозначений вместо списка названий. */

/* Кнопка формы и кнопка начертания стоят в одной колонке строки и потому
   одной ширины — по большей из двух, то есть по образцу линии. */
.dict__shape {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--dict-sign);
  height: 30px;
  padding: 0;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  background: #21262d;
  cursor: pointer;
}

.dict__shape:hover {
  border-color: var(--panel-muted);
}

.dict__shape--inherit {
  border-style: dashed;
}

/* Сетка фигур: восемь колонок. Палитра выросла за полсотни знаков, и при пяти
   колонках окно вытягивалось в столбец высотой в экран. */
.shapes {
  display: grid;
  grid-template-columns: repeat(8, 52px);
  gap: 6px;
}

.shapes__cell {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  height: 52px;
  padding: 0;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  background: #21262d;
  cursor: pointer;
}

.shapes__cell:hover {
  border-color: var(--panel-muted);
}

.shapes__cell.is-active {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

/* «Как у категории»: та же фигура, но пунктиром — и с подписью на всю строку.
   Одного пунктира мало: у категории с круглым знаком первая клетка рисует ровно
   то же, что вторая, и без подписи непонятно, зачем их две. */
.shapes__cell--inherit {
  grid-column: 1 / -1;
  width: auto;
  justify-content: flex-start;
  gap: 10px;
  padding: 0 12px;
  border-style: dashed;
  border-color: var(--panel-muted);
}

/* Заголовок раздела палитры: строка сетки целиком, поэтому следующая фигура
   начинает новый ряд сама — без пустых клеток-заполнителей. Набран тем же
   приглушённым размером, что подпись группы в справочнике: заголовок нужен,
   чтобы глаз цеплялся за границу семьи, а не чтобы читать его вслух. */
.shapes__head {
  grid-column: 1 / -1;
  margin: 8px 0 0;
  color: var(--panel-muted);
  font-size: 12px;
}

.shapes__head:first-child {
  margin-top: 0;
}

.shapes__caption,
.lines__caption {
  color: var(--panel-muted);
  font-size: 12px;
  text-align: left;
}

.shapes__icon {
  display: block;
}

/* Выбор начертания: та же сетка нарисованных образцов, что у фигур, только
   клетка вытянута — в квадрат не поместился бы и один период волны. Классы
   свои: отступ клетки правится вместе с начертаниями, а не заодно с фигурами. */

.dict__line {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--dict-sign);
  height: 30px;
  padding: 0;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  background: #21262d;
  cursor: pointer;
}

.dict__line:hover {
  border-color: var(--panel-muted);
}

.dict__line--inherit {
  border-style: dashed;
}

/* Вид типа: две кнопки одним переключателем, как сегменты, а не два отдельных
   действия — выбран всегда ровно один. */
.dict__kind {
  flex: none;
  display: inline-flex;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  overflow: hidden;
}

.dict__kindItem {
  border: 0;
  border-radius: 0;
  padding: 4px 8px;
  font-size: 12px;
  background: #21262d;
}

.dict__kindItem + .dict__kindItem {
  border-left: 1px solid var(--panel-line);
}

.dict__kindItem.is-active {
  background: var(--accent);
  color: #ffffff;
}

.lines {
  display: grid;
  grid-template-columns: repeat(3, 148px);
  gap: 6px;
}

.lines__cell {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 148px;
  height: 52px;
  padding: 0;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  background: #21262d;
  cursor: pointer;
}

.lines__cell:hover {
  border-color: var(--panel-muted);
}

.lines__cell.is-active {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

/* «Как у категории»: то же начертание, но рамка пунктиром — видно, что оно
   не своё. */
/* Та же строка наследования, что в сетке фигур: на всю ширину и с подписью. */
.lines__cell--inherit {
  grid-column: 1 / -1;
  width: auto;
  justify-content: flex-start;
  gap: 10px;
  padding: 0 12px;
  border-style: dashed;
  border-color: var(--panel-muted);
}

/* Список выведенных видов: строка объясняет, почему вид такой, и тут же
   переключается. */
.kinds {
  min-width: 460px;
}

.kinds__row {
  padding: 4px 0;
  border-top: 1px solid var(--panel-line);
}

.kinds__code {
  width: 96px;
  flex: none;
}

.kinds__name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.kinds__why {
  flex: none;
  color: var(--panel-muted);
  font-size: 12px;
}

/* Кнопка общей базы стоит под строками добавления и занимает строку целиком:
   она относится к разделу, а не к строке типа. */
.dict__row--catalog {
  padding-top: 4px;
}

/* ——— список меток в режиме просмотра ————————————————————————————————————
   Поля в строке только читаются, поэтому и выглядеть должны текстом, а не
   полями ввода: на телефоне четыре рамки в строке съедали список целиком.
   Пустое поле прячется совсем — в нём нечего смотреть. */
#app.is-mobile .mark-row {
  padding: 6px 8px;
  gap: 2px;
}

#app.is-mobile .mark-row .ui-input,
#app.is-mobile .mark-row .ui-select {
  min-height: 0;
  padding: 2px 4px;
  font-size: 14px;
  border-color: transparent;
  background: transparent;
  appearance: none;
}

#app.is-mobile .mark-row .ui-input:placeholder-shown {
  display: none;
}

#app.is-mobile .mark-row__number {
  width: 64px;
  text-align: left;
}

/* «Чем управляет»: кнопка в строке метки и окно выбора. */

.mark-row__controls {
  text-align: left;
  color: var(--panel-muted);
}

.mark-row__controls.is-set {
  color: var(--panel-text);
  border-color: var(--accent);
}

.mark-row__by {
  margin: 0;
  color: var(--panel-muted);
  font-size: 12px;
}

.controls-pick {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 420px;
  max-width: 560px;
}

.controls-pick__list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 46vh;
  overflow: auto;
  padding: 4px;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  background: var(--panel-bg-deep);
}

.controls-pick__row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 6px;
  border-radius: 6px;
  cursor: pointer;
}

.controls-pick__row:hover {
  background: #21262d;
}

.controls-pick__check {
  margin: 0;
  accent-color: var(--accent);
}

.controls-pick__label {
  min-width: 56px;
  font-weight: 700;
  color: var(--panel-text);
}

.controls-pick__name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--panel-text);
}

.controls-pick__room {
  color: var(--panel-muted);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 40%;
}

.controls-pick__note {
  margin: 0;
  color: var(--panel-muted);
  font-size: 12px;
}

/* Оборудование: справочник моделей и размещение. */

.mark-row__equipment {
  text-align: left;
  color: var(--panel-muted);
}

.mark-row__equipment.is-set {
  color: var(--panel-text);
  border-color: var(--ok);
}

.equip {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 560px;
  max-width: 760px;
  max-height: 60vh;
  overflow: auto;
}

.equip__title {
  margin: 10px 0 2px;
  color: var(--panel-text);
  font-size: 13px;
}

.equip__row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.equip__row--add {
  padding-top: 6px;
  border-top: 1px dashed var(--panel-line);
}

.equip__row .ui-input,
.equip__row .ui-select {
  flex: 1;
  min-width: 0;
}

.equip__name {
  flex: 2 1 0;
}

.equip__code {
  flex: none;
  width: 110px;
}

.equip__used {
  flex: none;
  color: var(--panel-muted);
  font-size: 12px;
  white-space: nowrap;
}

.equip__place {
  flex: none;
  min-width: 64px;
  font-weight: 700;
}

.equip__links {
  flex: 2 1 0;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--panel-muted);
}

.equip__links.is-set {
  color: var(--panel-text);
  border-color: var(--accent);
}

/* Выбор одной метки: строка — кнопка, галочки в ней нет. */
.controls-pick__row--one {
  width: 100%;
  border: 1px solid transparent;
  background: none;
  font: inherit;
  text-align: left;
  color: inherit;
}

.controls-pick__row--one.is-active {
  border-color: var(--accent);
}

/* Кнопка под списком меток: смыкание номеров — команда про весь объект, и
   стоит она после списка, а не среди фильтров. Список над ней листается сам,
   кнопка с глаз не уходит. */
.marks__foot {
  position: sticky;
  /* Нижнее поле тела раздела (12px) — часть прокрутки: без отрицательного
     отступа под кнопкой оставалась щель, и в неё проглядывала уехавшая строка
     списка. */
  bottom: -12px;
  padding: 8px 0 12px;
  margin-bottom: -12px;
  background: var(--panel-bg);
}

.marks__foot .ui-btn {
  margin-bottom: 0;
}

/* Предпросмотр по всем типам: группа на тип, заголовок — код и название. */
.compact--all .compact__rows {
  max-height: none;
}

.compact__group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.compact__groupTitle {
  margin: 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--panel-muted);
}

/* Кнопки, поля, диалоги и списки панелей. Тёмная панель — светлый холст. */

.ui-btn {
  font: inherit;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--panel-line);
  background: #21262d;
  color: var(--panel-text);
  cursor: pointer;
  white-space: nowrap;
}

.ui-btn:hover:not(:disabled) {
  border-color: var(--panel-muted);
}

.ui-btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.ui-btn--accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* Опасность живёт в кнопке, а не в рисунке: значки нарисованы одними линиями
   одного цвета, и красная корзина из них выпадала. Под курсором и под
   клавиатурным фокусом кнопка удаления краснеет целиком — рамкой, подложкой и
   линиями значка (он тянется за `currentColor`). */
.ui-btn--danger:hover:not(:disabled),
.ui-btn--danger:focus-visible:not(:disabled) {
  border-color: var(--danger);
  background: rgba(209, 36, 47, 0.22);
  color: #ff9aa2;
}

/* Кнопка-значок: рисунок вместо слова, размер — как у кнопки со словом, чтобы
   в ряду ничего не проседало. */
.ui-btn--icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  /* Поле подобрано так, чтобы кнопка-значок была ровно той же высоты, что
     кнопка со словом: в одном ряду разнобой видно сразу. */
  padding: 5px 7px;
}

/* Мера значка одна на все панели и окна: строки списков плотные, и шапочные
   18 px поднимали их на пару пикселей каждая. В самой шапке мера прежняя —
   она подобрана под тамошние кнопки (таск 55) и менять её незачем. */
.ui-icon {
  width: var(--ui-icon, 16px);
  height: var(--ui-icon, 16px);
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#app-header .ui-icon {
  --ui-icon: 18px;
}

.ui-btn--wide {
  display: block;
  width: 100%;
  padding: 7px 8px;
  margin-bottom: 10px;
}

.ui-select,
.ui-input {
  font: inherit;
  padding: 4px 6px;
  border-radius: 6px;
  border: 1px solid var(--panel-line);
  background: #21262d;
  color: var(--panel-text);
  max-width: 220px;
}

.ui-input {
  width: 100%;
  max-width: none;
}

#project-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Удаление стоит на отлёте: плюс и корзина вплотную — это промах ценой всего
   объекта. Отступ отделяет её от создания и переименования. */
#project-actions .ui-btn--danger {
  margin-left: 10px;
}

/* ——— диалоги ——————————————————————————————————————————————————————— */

.modal {
  width: min(92vw, 720px);
  max-height: 90vh;
  overflow: auto;
  padding: 16px 18px;
  border-radius: 10px;
  border: 1px solid var(--panel-line);
  background: var(--panel-bg);
  color: var(--panel-text);
  box-shadow: 0 24px 64px rgba(1, 4, 9, 0.6);
}

/* Окно, ширину которого задаёт его содержимое, а не общая мера диалогов.
   Общая мера (720px) подобрана под окна с текстом и списками; сетке выбора
   она не нужна — фигуры занимают пять колонок по 52px, и остальные четыреста
   пикселей карточки оставались пустым полем справа, с «Отменой», прижатой к
   дальнему краю. Класс один на все окна-сетки: форма, цвет, начертание. */
.modal--fit {
  width: fit-content;
  max-width: min(92vw, 720px);
}

.modal__title {
  margin: 0 0 10px;
  font-size: 15px;
}

.modal__text {
  margin: 0;
  color: var(--panel-text);
}

.modal__hint {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--panel-muted);
}

.modal__actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 14px;
}

/* ——— правка плана ——————————————————————————————————————————————————— */

.plan-editor__tools {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

.plan-stage {
  position: relative;
  display: flex;
  justify-content: center;
  background: var(--panel-bg-deep);
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  padding: 8px;
  user-select: none;
  touch-action: none;
}

.plan-stage__img {
  max-width: 100%;
  max-height: 58vh;
  display: block;
  cursor: crosshair;
}

.plan-frame {
  position: absolute;
  border: 1px dashed var(--accent);
  background: rgba(31, 111, 235, 0.18);
  pointer-events: none;
}

/* ——— список схем ————————————————————————————————————————————————————— */

.scheme-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.scheme-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 2px 6px;
  padding: 5px 6px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: #1c2129;
}

.scheme-row--current {
  border-color: var(--accent);
}

.scheme-row__name {
  font: inherit;
  text-align: left;
  padding: 0;
  border: 0;
  background: none;
  color: var(--panel-text);
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.scheme-row__meta {
  grid-column: 1;
  font-size: 11px;
  color: var(--panel-muted);
}

.scheme-row__tools {
  grid-column: 2;
  grid-row: 1 / span 2;
  display: flex;
  gap: 2px;
}

.scheme-row__tools .ui-btn {
  padding: 2px 5px;
  font-size: 12px;
}

#canvas-area.is-dropping::after {
  content: attr(data-drop);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #0b4ea2;
  font-weight: 600;
  position: absolute;
  inset: 8px;
  border: 2px dashed var(--accent);
  border-radius: 10px;
  background: rgba(31, 111, 235, 0.08);
  pointer-events: none;
  z-index: 5;
}

/* ——— раздел «Помещения» ————————————————————————————————————————————— */

/* В окне список ограничивал себя сам; в колонке ему растёт раздел, а
   прокрутку даёт тело раздела — второй ползунок внутри был бы лишним. */
#panel-rooms .rooms {
  max-height: none;
  overflow: visible;
  gap: 4px;
}

/* Строка в одну линию: цвет, имя, число меток, контур, удаление. Комнат в
   объекте бывает десяток, и двухстрочные карточки съедали колонку. */
#panel-rooms .rooms__row {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 4px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: #1c2129;
}

#panel-rooms .rooms__row .ui-input {
  flex: 1;
  min-width: 0;
  padding: 3px 5px;
}

#panel-rooms .rooms__count {
  flex: none;
  min-width: 16px;
  text-align: right;
  font-size: 11px;
}

#panel-rooms .rooms__row .ui-btn {
  flex: none;
  padding: 2px 5px;
}

/* Комната, которую сейчас обводят или чей контур правят. */
#panel-rooms .rooms__row.is-active {
  border-color: var(--accent);
}

/* У комнаты уже есть контур на этой схеме — кнопка ведёт в правку вершин. */
.rooms__outline--set {
  color: var(--accent);
  border-color: var(--accent);
}

#panel-rooms .rooms__add {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
  margin-top: 8px;
}

/* Имя схемы — на всю ширину строки: шесть кнопок рядом оставляли от «Этаж 5 —
   план» три буквы. Вторая строка делится между размером и кнопками. */
#panel-schemes .scheme-row {
  grid-template-columns: 1fr auto;
}

#panel-schemes .scheme-row__name {
  grid-column: 1 / -1;
  grid-row: 1;
}

#panel-schemes .scheme-row__meta {
  grid-column: 1;
  grid-row: 2;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#panel-schemes .scheme-row__tools {
  grid-column: 2;
  grid-row: 2;
  justify-self: end;
}

#panel-schemes .scheme-row__tools .ui-btn {
  padding: 1px 4px;
}

/* Шесть кнопок в строке схемы стоят вплотную: значок шире прежнего символа, и
   без этого поля ряд кнопок отъедал у размеров плана треть строки. Меньше уже
   нельзя — рисунок упрётся в рамку. */
#panel-schemes .scheme-row__tools .ui-btn--icon {
  padding: 1px 3px;
}

/* ——— поиск по объекту и отмена в шапке ——————————————————————————————— */

.history-actions {
  display: flex;
  gap: 4px;
}

/* Свёрнутый поиск — один значок; строка появляется, только когда её позвали
   (клик по значку или клавиша «/»), и ужимается первой: рядом с ней в шапке
   живут отмена, выгрузка и файл. Гибкость задаётся контейнеру-точке
   монтирования: именно он — элемент шапки. */
#header-search {
  flex: 0 0 auto;
  min-width: 0;
}

#header-search .search {
  display: none;
}

#header-search.is-open {
  flex: 0 1 auto;
  min-width: 110px;
}

#header-search.is-open .search {
  display: block;
}

.search {
  position: relative;
  flex: 0 1 auto;
  min-width: 110px;
}

.search__input {
  width: 200px;
  max-width: 100%;
  min-width: 110px;
}

.search__drop {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  width: min(440px, 92vw);
  max-height: min(60vh, 460px);
  overflow: auto;
  z-index: 40;
  padding: 4px;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  background: var(--panel-bg);
  box-shadow: 0 18px 44px rgba(1, 4, 9, 0.6);
}

.search__row {
  display: grid;
  grid-template-columns: auto auto 1fr;
  align-items: center;
  gap: 2px 8px;
  width: 100%;
  padding: 6px 8px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--panel-text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.search__row.is-active {
  background: var(--accent);
  color: #fff;
}

.search__label {
  font-weight: 600;
}

.search__type {
  color: var(--panel-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Где метка — второй строкой: три «Т1» из разных комнат иначе неразличимы. */
.search__where,
.search__match {
  grid-column: 1 / -1;
  font-size: 12px;
  color: var(--panel-muted);
}

.search__row.is-active .search__type,
.search__row.is-active .search__where,
.search__row.is-active .search__match {
  color: #dbeafe;
}

.search__empty,
.search__more {
  margin: 6px 8px;
  font-size: 12px;
  color: var(--panel-muted);
}

/* Фильтры списка меток не уезжают вместе со списком. */
.marks__top {
  position: sticky;
  top: 0;
  z-index: 2;
  padding-top: 4px;
  background: var(--panel-bg);
}

/* На телефоне раскрытый поиск занимает свою строку целиком: это главный способ
   найти метку, когда панелей на экране нет. Свёрнутый — тот же значок, что и на
   большом экране, и строки не занимает. */
#app.is-mobile #header-search.is-open {
  flex: 1 0 100%;
  order: 8;
}

#app.is-mobile .search {
  width: 100%;
}

#app.is-mobile .search__input {
  width: 100%;
  max-width: none;
}

#app.is-mobile .search__drop {
  left: 0;
  right: 0;
  width: auto;
}

/* ——— предупреждения ————————————————————————————————————————————————— */

/* Счётчик виден снаружи списка: открывать панель ради проверки не надо.
   Уровень показан цветом самой кнопки — ошибка красным, предупреждение
   жёлтым, вопрос о виде спокойным синим, «всё в порядке» — галочкой без
   числа. */
#header-warnings {
  position: relative;
  flex: 0 0 auto;
}

.warnings__toggle {
  gap: 4px;
  padding: 5px 7px;
}

.warnings__count {
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.warnings__count:empty {
  display: none;
}

.warnings__toggle.is-error {
  color: #ff9aa2;
  border-color: rgba(209, 36, 47, 0.7);
}

.warnings__toggle.is-warning {
  color: #e3b341;
  border-color: rgba(210, 153, 34, 0.7);
}

.warnings__toggle.is-ask {
  color: #79c0ff;
}

.warnings__toggle.is-ok {
  color: var(--panel-muted);
}

.warnings__drop {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  width: min(460px, 92vw);
  max-height: min(70vh, 560px);
  overflow: auto;
  z-index: 40;
  padding: 6px;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  background: var(--panel-bg);
  box-shadow: 0 18px 44px rgba(1, 4, 9, 0.6);
}

.warnings__head {
  margin: 2px 8px 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--panel-muted);
}

.warnings__section {
  margin-bottom: 2px;
}

/* Строка предупреждения и строка-счётчик устроены одинаково: точка уровня,
   текст, справа — знак раскрытия у свёрнутых. Где это на плане — второй
   строкой под текстом, как место метки в поиске. */
.warnings__row,
.warnings__group,
.warnings__jump {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 2px 8px;
  width: 100%;
  padding: 6px 8px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--panel-text);
  font: inherit;
  text-align: left;
}

.warnings__where {
  grid-column: 2 / -1;
  font-size: 12px;
  color: var(--panel-muted);
}

.warnings__row,
.warnings__group,
.warnings__jump {
  cursor: pointer;
}

.warnings__row:disabled {
  cursor: default;
  opacity: 0.6;
}

.warnings__row:hover:not(:disabled),
.warnings__group:hover,
.warnings__jump:hover {
  background: #21262d;
}

.warnings__group .warnings__text {
  font-weight: 600;
}

.warnings__items {
  padding-left: 14px;
  border-left: 1px solid var(--panel-line);
  margin-left: 14px;
}

.warnings__text {
  flex: 1;
  min-width: 0;
}

.warnings__dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  align-self: center;
}

.warnings__dot--error {
  background: var(--danger);
}

.warnings__dot--warning {
  background: #d29922;
}

.warnings__dot--ask {
  background: #58a6ff;
}

.warnings__chevron {
  flex: none;
  width: 16px;
  height: 16px;
  align-self: center;
  transform: rotate(-90deg);
  transition: transform 0.12s ease;
}

.warnings__group.is-open .warnings__chevron {
  transform: none;
}

/* Строка вопроса о виде: слева — тип и почему спрашиваем, справа —
   переключатель, тот же, что в справочнике. Причина уходит второй строкой, как
   место метки в поиске: названия типов бывают в два слова, и в одну строку
   причина налезала на них. */
.warnings__row--kind {
  align-items: center;
  gap: 6px;
  cursor: default;
  padding: 2px 4px;
}

.warnings__jump {
  grid-template-columns: auto auto 1fr;
  padding: 4px 6px;
}

.warnings__code {
  font-weight: 600;
}

.warnings__why {
  font-size: 12px;
  color: var(--panel-muted);
}

.warnings__jump .warnings__why {
  grid-column: 1 / -1;
}

.warnings__kindHint {
  margin: 4px 6px 8px;
}

/* Строка и её крестик стоят в ряд: строка тянется, крестик держит правый край.
   Кнопка в кнопке разметкой не бывает — поэтому обёртка, а не вложение. */
.warnings__line {
  display: flex;
  align-items: flex-start;
  gap: 2px;
}

.warnings__line .warnings__row {
  flex: 1;
  min-width: 0;
}

/* Крестик «так и задумано» и стрелка возврата: рисунок без рамки и подложки,
   приглушённый, пока до строки не дошли. Кнопка-значок в строке списка с
   рамкой выглядит главнее самой строки, а главная здесь строка. */
.warnings__accept,
.warnings__return {
  flex: none;
  align-self: center;
  padding: 4px;
  border-color: transparent;
  background: none;
  color: var(--panel-muted);
}

.warnings__accept:hover:not(:disabled),
.warnings__accept:focus-visible,
.warnings__return:hover:not(:disabled),
.warnings__return:focus-visible {
  border-color: var(--panel-line);
  background: #21262d;
  color: var(--panel-text);
}

.warnings__accept .ui-icon,
.warnings__return .ui-icon {
  width: 14px;
  height: 14px;
}

/* Строка принятого: тот же вид, что у предупреждения, но вести по ней некуда —
   это запись ответа, а не строка списка. Подсветки под курсором у неё нет:
   она обещала бы переход, которого не будет. */
.warnings__row--done,
.warnings__row--done:hover {
  cursor: default;
  background: none;
}

.warnings__dot--accepted {
  background: var(--panel-muted);
}

.warnings__foot {
  display: flex;
  justify-content: flex-end;
  padding: 8px 6px 2px;
}

.warnings__hint {
  margin: 6px 8px 2px;
  padding-top: 6px;
  border-top: 1px solid var(--panel-line);
}

/* Пусто — хорошая новость, и выглядеть должна как новость, а не как пустая
   панель. */
.warnings__ok {
  padding: 14px 10px 16px;
  text-align: center;
}

.warnings__okIcon {
  width: 28px;
  height: 28px;
  margin: 0 auto 6px;
  color: var(--ok);
}

.warnings__okTitle {
  margin: 0 0 4px;
  font-weight: 600;
}

.warnings__ok .warnings__why {
  margin: 0;
}

/* ——— окно «Тип метки»: категории колонками ————————————————————————————
   Один длинный столбец заставлял листать: «Свет» занимал экран, а
   «Выключатели» уходили за нижний край, и справа половина окна пустовала.
   Теперь категории стоят рядом, и в одной колонке их бывает несколько:
   что с чем встанет в колонку, считает `pickerLayout` в typePicker.js —
   здесь колонки только расставляются по ширине окна. */

/* Ширину этой карточки задаёт содержимое, а не общая мера диалогов. */
.modal--wide {
  width: auto;
  max-width: 96vw;
}

/* Ширину задаёт число колонок, но не шире, чем внутренность карточки: 96vw
   самой карточки минус её поля с рамкой. Те же меры считает
   `pickerColumnLimit` — иначе последняя колонка «почти влезает» и окно едет
   вбок. */
.picker--types {
  width: min(calc(96vw - 40px), calc(var(--picker-columns, 1) * 240px));
  /* Пустая выдача («ничего не нашлось») оставляет одну колонку, и в 240px
     селект «Категория» из строки создания упирается в край карточки. */
  min-width: min(calc(96vw - 40px), 330px);
}

.picker__columns {
  display: grid;
  /* 150px — та же мера, что `PICKER_COLUMN_MIN` в typePicker.js: по ней там
     считается, сколько колонок поместится в экран. */
  grid-template-columns: repeat(var(--picker-columns, 1), minmax(150px, 1fr));
  gap: 14px;
  align-items: start;
  max-height: 56vh;
  /* Прокрутка — на крайний случай: категория длиннее, чем половина экрана. */
  overflow: auto;
}

.picker__column {
  display: flex;
  flex-direction: column;
  /* Между категориями в одной колонке — воздух, иначе заголовок читается как
     продолжение списка соседней категории. */
  gap: 10px;
  min-width: 0;
}

.picker__category {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

/* Заголовок категории в её цвете остаётся виден при прокрутке. Липнет он
   внутри своей категории, поэтому следующий заголовок выталкивает предыдущий,
   а не наезжает на него. */
.picker__column .picker__group {
  position: sticky;
  top: 0;
  z-index: 1;
  margin: 0 0 2px;
  padding-top: 2px;
  background: var(--panel-bg);
}

/* Код бывает до шестнадцати букв. Место в строке уступает название: оно
   сжимается первым (основа 0), и только когда ужимать больше нечего,
   многоточие получает и код. Целиком строка остаётся в подсказке. */
.picker__column .picker__code {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.picker__column .picker__name {
  flex: 1 1 0;
  min-width: 0;
}

.picker__columns > .panel__empty {
  grid-column: 1 / -1;
}

/* Печатная раскладка и предпросмотр таблицы.
   Один и тот же узел .print-doc показывается в диалоге выгрузки и уходит в
   печать: на бумаге оказывается ровно то, что видно на экране. Экран прячется
   только на время нашей печати — по классу printing на body. */

#print-root {
  display: none;
}

.print-doc {
  background: #ffffff;
  color: #1f2328;
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  padding: 4px 2px 12px;
}

.print-doc__head {
  margin-bottom: 10px;
}

.print-doc__title {
  font-size: 18px;
  font-weight: 600;
  margin: 0;
}

/* Комната — вторым заголовком под именем объекта: лист по одной комнате
   должен отличаться от полного с первого взгляда. */
.print-doc__room {
  font-size: 15px;
  font-weight: 600;
  margin: 2px 0 0;
}

/* Пометка о сужении фильтром: не украшение, а предупреждение о неполном листе. */
.print-doc__note {
  font-size: 12px;
  font-weight: 600;
  margin: 2px 0 0;
}

.print-doc__sub {
  color: #57606a;
  font-size: 12px;
  margin: 2px 0 0;
}

.print-doc__group {
  margin-bottom: 14px;
}

/* Заголовок категории — её цветом, с полосой под ним: так же, как разделены
   категории на рукописном листе заказчика. */
.print-doc__group-title {
  border-bottom: 2px solid var(--print-color, #d0d7de);
  color: var(--print-color, #1f2328);
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 6px;
  padding-bottom: 3px;
}

/* Разбивка внутри помещения — заголовок помельче и с тонкой чертой:
   вложенность видна размером, строки остаются на одной линии с колонками. */
.print-doc__group--sub {
  margin-bottom: 10px;
  margin-left: 0;
}

.print-doc__group--sub .print-doc__group-title {
  border-bottom-width: 1px;
  font-size: 13px;
}

.print-doc__table {
  border-collapse: collapse;
  width: 100%;
}

.print-doc__table th {
  border-bottom: 1px solid #d0d7de;
  color: #57606a;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px 3px 0;
  text-align: left;
  text-transform: uppercase;
}

.print-doc__table td {
  border-bottom: 1px solid #eaeef2;
  padding: 3px 8px 3px 0;
  vertical-align: top;
}

/* Цветная полоса слева у строки: по ней категория видна и там, где заголовок
   группы остался на предыдущей странице. */
.print-doc__row td:first-child {
  border-left: 3px solid var(--print-row-color, transparent);
  padding-left: 7px;
}

/* Строка с потерянной ссылкой: подчёркнута волной и приглушена — обычной
   связью её не прочесть. */
.print-doc__row--problem td {
  font-style: italic;
  text-decoration: underline wavy rgba(209, 36, 47, 0.6);
  text-underline-offset: 3px;
}

.print-doc__label {
  font-weight: 600;
  white-space: nowrap;
}

/* Подвал «сколько чего»: числа справа, подытог типа приглушён и сдвинут. */
.print-doc__totals .print-doc__table {
  max-width: 420px;
}

.print-doc__count {
  text-align: right;
  white-space: nowrap;
}

.print-doc__totals-row td:first-child {
  border-left: 3px solid var(--print-row-color, transparent);
  font-weight: 600;
  padding-left: 7px;
}

.print-doc__totals-row--sub td {
  color: #57606a;
  font-weight: 400;
}

.print-doc__totals-row--sub td:first-child {
  padding-left: 20px;
}

.print-doc__totals-row--all td {
  border-top: 1px solid #d0d7de;
  font-weight: 600;
}

.print-doc__image {
  display: block;
  max-width: 100%;
}

.print-doc__foot {
  color: #57606a;
  font-size: 11px;
  margin-top: 10px;
}

/* Предпросмотр в диалоге: лист в рамке, прокрутка внутри. */
.export__preview {
  background: #ffffff;
  border: 1px solid #d0d7de;
  border-radius: 8px;
  max-height: 46vh;
  overflow: auto;
  padding: 12px 14px;
}

/* Кнопки выгрузки в шапке и поля диалогов. */
.export {
  display: flex;
  gap: 8px;
}

.export__body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 520px;
}

.export__controls {
  align-items: end;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.export__field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.export__field-label {
  color: var(--muted, #8b949e);
  font-size: 11px;
  text-transform: uppercase;
}

.export__toggle {
  align-items: center;
  display: flex;
  gap: 6px;
  padding-bottom: 6px;
}

.export__hint {
  color: var(--muted, #8b949e);
  font-size: 12px;
  margin: 0;
}

@media print {
  @page {
    margin: 12mm 10mm 16mm;
  }

  body.printing #app,
  body.printing #notifications {
    display: none !important;
  }

  body.printing #print-root {
    display: block;
  }

  body.printing {
    background: #ffffff;
  }

  /* Цвета категорий — смысл листа, а не украшение: без этого принтер съедает
     и заголовки, и полосы слева. */
  .print-doc,
  .print-doc * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .print-doc {
    font-size: 10.5pt;
    padding: 0;
  }

  .print-doc__title {
    font-size: 15pt;
  }

  .print-doc__room {
    font-size: 12.5pt;
  }

  .print-doc__group-title {
    break-after: avoid;
    page-break-after: avoid;
  }

  /* Шапка колонок повторяется на каждой странице, строка не рвётся пополам. */
  .print-doc__table thead {
    display: table-header-group;
  }

  .print-doc__row {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* Имя объекта — в колонтитуле на каждой странице. */
  .print-doc__foot {
    bottom: 0;
    left: 0;
    position: fixed;
    right: 0;
    border-top: 1px solid #d0d7de;
    padding-top: 3px;
  }

  .print-doc--scheme /* Подвал «сколько чего»: числа справа, подытог типа приглушён и сдвинут. */
.print-doc__totals .print-doc__table {
  max-width: 420px;
}

.print-doc__count {
  text-align: right;
  white-space: nowrap;
}

.print-doc__totals-row td:first-child {
  border-left: 3px solid var(--print-row-color, transparent);
  font-weight: 600;
  padding-left: 7px;
}

.print-doc__totals-row--sub td {
  color: #57606a;
  font-weight: 400;
}

.print-doc__totals-row--sub td:first-child {
  padding-left: 20px;
}

.print-doc__totals-row--all td {
  border-top: 1px solid #d0d7de;
  font-weight: 600;
}

.print-doc__image {
    max-height: 96vh;
    object-fit: contain;
  }
}

:root {
  --panel-bg: #161b22;
  --panel-bg-deep: #0d1117;
  --panel-line: #30363d;
  --panel-text: #e6edf3;
  --panel-muted: #8b949e;
  --canvas-bg: #f6f8fa;
  --canvas-line: #d0d7de;
  --canvas-text: #1f2328;
  --accent: #1f6feb;
  --danger: #d1242f;
  --ok: #2da44e;
  --panel-width: 264px;
  --header-height: 48px;
}

* {
  box-sizing: border-box;
}

/* Скрытое скрыто везде. Панели прячут кнопки атрибутом `hidden`, а у многих из
   них класс задаёт `display` — и без этого правила «скрытая» кнопка режима
   просмотра оставалась на экране. */
[hidden] {
  display: none !important;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--canvas-text);
  background: var(--panel-bg-deep);
  overflow: hidden;
}

#app {
  display: grid;
  grid-template-columns: var(--panel-width) 1fr var(--panel-width);
  /* Шапка — одна строка: слова из неё убраны, поиск свёрнут в значок, а
     состояние выгрузки стало отметкой на кнопке, и файловые действия встали
     рядом с остальными. Перенос оставлен запасным выходом: на совсем узком
     окне лучше вторая строка, чем обрезанное правое. */
  grid-template-rows: minmax(var(--header-height), auto) 1fr;
  grid-template-areas:
    "header header header"
    "left canvas right";
  height: 100vh;
}

#app-header {
  grid-area: header;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  row-gap: 4px;
  gap: 12px;
  padding: 0 12px;
  background: var(--panel-bg-deep);
  border-bottom: 1px solid var(--panel-line);
  color: var(--panel-text);
}

#app-title {
  font-weight: 600;
  white-space: nowrap;
}

/* Окно уже полутора тысяч точек: название сервиса уходит первым. Оно
   единственное в шапке ничего не говорит о работе — и уступает место тому,
   ради чего шапку и чистили: одной строке вместо двух. Имя сервиса остаётся
   во вкладке — там теперь и значок, и заголовок. */
@media (max-width: 1060px) {
  #app-title {
    display: none;
  }

  /* Дальше шапка поджимается сама: промежутки и поля кнопок уже, слова те же.
     Раскладка переключается на мобильную при 860 точках — до этой границы
     шапка обязана оставаться одной строкой. */
  #app-header {
    gap: 8px;
  }

  #app-header .ui-btn {
    padding: 4px 6px;
  }

  #file-actions {
    margin-left: 8px;
  }
}

/* Место счётчика предупреждений (таск 52). Пока панель не поднялась, точка
   монтирования пуста, а у шапки есть промежуток между элементами — без этого
   правила пустой контейнер оставлял бы в строке дыру. */
#header-warnings:empty {
  display: none;
}

#header-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel {
  background: var(--panel-bg);
  color: var(--panel-text);
  display: flex;
  flex-direction: column;
  min-height: 0;
  /* Колонка листается сама только тогда, когда разделам уже нечего отдавать
     друг другу; заголовки при этом липнут к верху и остаются на экране. */
  overflow-x: hidden;
  overflow-y: auto;
}

#panel-left {
  grid-area: left;
  border-right: 1px solid var(--panel-line);
}

#panel-right {
  grid-area: right;
  border-left: 1px solid var(--panel-line);
}

/* Одно правило на обе колонки. Колонка делится так: раздел по содержимому
   стоит на своём и не выше половины колонки, дальше листается своим телом;
   растущий раздел (список схем слева, список меток справа) забирает остаток.
   Раньше обе секции сжимались пропорционально своей высоте, и список из
   полусотни меток выдавливал «Свойства» за нижний край экрана — до них было
   не добраться. Свёрнутый раздел из этого дележа выходит вовсе: он занимает
   высоту заголовка и всё остальное отдаёт соседям. */
.panel__section {
  display: flex;
  flex-direction: column;
  min-height: 0;
  /* Не растёт: столько, сколько нужно содержимому. Пустой раздел — это только
     заголовок, места у списка он не отнимает. Сжаться даёт себе только на
     низком экране, когда растущему разделу уже нечего отдавать: лучше короткий
     раздел со своей прокруткой, чем обрезанный нижним краем. */
  flex: 0 1 auto;
  /* Но и колонку целиком не занимает: дальше прокручивается своим телом. */
  max-height: 50%;
  border-bottom: 1px solid var(--panel-line);
}

.panel__section--grow {
  /* Основа ноль — иначе высота содержимого снова стала бы стартовым размером. */
  flex: 1 1 0;
  max-height: none;
  /* Список остаётся списком даже рядом с высокими соседями: в колонке их
     теперь четверо, и на 96 px от списка схем оставалась одна строка. */
  min-height: 140px;
}

.panel__section.is-collapsed,
.panel__section--grow.is-collapsed {
  flex: 0 0 auto;
  max-height: none;
  min-height: 0;
}

.panel__section.is-collapsed > .panel__body {
  display: none;
}

.panel__section:last-child {
  border-bottom: none;
}

/* Заголовок всегда на экране: он липнет к верху колонки, тело листается под
   ним — и внутри раздела, и когда листается вся колонка. */
.panel__head {
  margin: 0;
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--panel-bg);
}

.panel__title {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  margin: 0;
  padding: 9px 12px 7px;
  border: 0;
  background: none;
  cursor: pointer;
  font: inherit;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--panel-muted);
  text-align: left;
}

.panel__title:hover,
.panel__title:focus-visible {
  color: var(--panel-text);
}

.panel__chevron::before {
  content: "▾";
  display: inline-block;
  font-size: 10px;
  line-height: 1;
  transition: transform 0.12s ease;
}

.panel__section.is-collapsed .panel__chevron::before {
  transform: rotate(-90deg);
}

/* Счётчик: по свёрнутому разделу видно, пуст он или там сорок схем. */
.panel__badge {
  margin-left: auto;
  font-size: 10px;
  letter-spacing: 0;
  color: var(--panel-muted);
  background: #21262d;
  border-radius: 8px;
  padding: 1px 6px;
}

.panel__badge:empty {
  display: none;
}

/* Раздел позвали со стороны — подсветить, чтобы глаз нашёл его сам. */
.panel__section.is-called > .panel__head .panel__title {
  color: var(--accent);
}

.panel__body {
  padding: 0 12px 12px;
  overflow: auto;
  min-height: 0;
}

#canvas-area {
  grid-area: canvas;
  position: relative;
  background: var(--canvas-bg);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#canvas-host,
#canvas-overlay {
  position: absolute;
  inset: 0;
}

#canvas-overlay {
  pointer-events: none;
}

#canvas-empty {
  position: relative;
  max-width: 280px;
  padding: 16px 20px;
  border: 1px dashed var(--canvas-line);
  border-radius: 8px;
  color: #57606a;
  background: #fff;
  text-align: center;
}

#app.has-scheme #canvas-empty {
  display: none;
}

#dialog-host:empty {
  display: none;
}

#dialog-host {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(1, 4, 9, 0.55);
}

#notifications {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 360px;
}

.toast {
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid var(--panel-line);
  background: var(--panel-bg);
  color: var(--panel-text);
  box-shadow: 0 8px 24px rgba(1, 4, 9, 0.4);
}

.toast--error {
  border-color: var(--danger);
}

.toast--success {
  border-color: var(--ok);
}

.panel__empty {
  color: var(--panel-muted);
  font-size: 12px;
  margin: 4px 0 0;
}

/* ——— узкий экран: раскладка просмотра —————————————————————————————————
   Правила колонок выше не трогаются: они описывают широкий экран и остаются
   единственным местом, где делится высота колонки. Здесь — только то, что
   добавляется, когда экран сам выбрал просмотр.

   Устройство простое: план во весь экран, снизу три крупные кнопки, а колонки
   приходят листом поверх плана по одной. Две колонки рядом на телефон не лезут,
   вкладки поверх плана съели бы сам план, а лист снизу открывается большим
   пальцем и закрывается той же кнопкой. */

#mobile-bar,
#scheme-name {
  display: none;
}

#app.is-mobile {
  grid-template-columns: 1fr;
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    "header"
    "canvas"
    "bar";
}

@supports (height: 100dvh) {
  #app.is-mobile {
    height: 100dvh;
  }
}

#app.is-mobile #app-header {
  height: auto;
  min-height: 0;
  flex-wrap: wrap;
  gap: 8px;
  row-gap: 2px;
  padding: 6px 10px;
}

/* Название сервиса на объекте не нужно: место дороже. */
#app.is-mobile #app-title {
  display: none;
}

#app.is-mobile #scheme-name {
  display: block;
  width: 100%;
  order: 9;
  font-size: 12px;
  color: var(--panel-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#app.is-mobile #header-actions {
  margin-left: auto;
}

#mobile-bar {
  grid-area: bar;
}

#app.is-mobile #mobile-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--panel-line);
  border-top: 1px solid var(--panel-line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.mobile-bar__btn {
  font: inherit;
  font-size: 13px;
  min-height: 52px;
  border: 0;
  background: var(--panel-bg);
  color: var(--panel-text);
  cursor: pointer;
}

.mobile-bar__btn.is-active {
  background: var(--accent);
  color: #fff;
}

/* Колонка становится листом снизу: поверх плана, на высоту большого пальца. */
#app.is-mobile #panel-left,
#app.is-mobile #panel-right {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(52px + env(safe-area-inset-bottom, 0px));
  top: auto;
  height: min(58vh, 460px);
  z-index: 30;
  display: none;
  border: 0;
  border-top: 1px solid var(--panel-line);
  box-shadow: 0 -12px 32px rgba(1, 4, 9, 0.55);
}

#app.is-mobile[data-sheet="schemes"] #panel-left,
#app.is-mobile[data-sheet="marks"] #panel-right {
  display: flex;
}

/* В листе только то, на что можно смотреть: постановка меток, помещения,
   размеры и справочник в режиме просмотра не живут. */
#app.is-mobile [data-section-id="marks"],
#app.is-mobile [data-section-id="rooms"],
#app.is-mobile [data-section-id="sizes"],
#app.is-mobile [data-section-id="properties"] {
  display: none;
}

/* Лист назван кнопкой снизу, второй заголовок внутри — потерянная строка.
   Свёрнутость с десктопа здесь тоже не в счёт: лист открывают, чтобы смотреть. */
#app.is-mobile .panel__head {
  display: none;
}

#app.is-mobile .panel__section {
  flex: 1 1 auto;
  max-height: none;
  border-bottom: 0;
}

#app.is-mobile .panel__section.is-collapsed > .panel__body {
  display: block;
}

/* Цели под палец. 16 px в полях — иначе iOS приближает страницу при фокусе. */
#app.is-mobile .ui-btn {
  min-height: 40px;
  padding: 8px 12px;
}

#app.is-mobile .ui-select,
#app.is-mobile .ui-input {
  min-height: 40px;
  font-size: 16px;
}

#app.is-mobile .scheme-row {
  padding: 8px;
  gap: 4px;
}

#app.is-mobile .scheme-row__name {
  font-size: 15px;
  padding: 4px 0;
}

#app.is-mobile #canvas-empty {
  max-width: 82vw;
}

#app.is-mobile #project-actions .ui-select {
  max-width: 46vw;
}

/* Уведомления не должны ложиться на нижнюю панель. */
#app.is-mobile #notifications {
  left: 12px;
  right: 12px;
  bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  max-width: none;
}

           место: слева схемы, справа метки. -->

              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-tools" class="panel__body mount"></div>
        </section>
        <section class="panel__section" data-section-id="rooms">
          <h2 class="panel__head">
            <button class="panel__title" type="button" data-section="rooms" aria-expanded="true">

              <span class="panel__name" data-text="panels.rooms"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-rooms" class="panel__body mount"></div>
        </section>
        <section class="panel__section panel__section--grow" data-section-id="schemes">
          <h2 class="panel__head">
            <button class="panel__title" type="button" data-section="schemes" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
              <span class="panel__name" data-text="panels.schemes"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-schemes" class="panel__body mount"></div>
        </section>
        <section class="panel__section" data-section-id="sizes">
          <h2 class="panel__head">
            <button class="panel__title" type="button" data-section="sizes" aria-expanded="true">
              <span class="panel__chevron" aria-hidden="true"></span>
              <span class="panel__name" data-text="panels.sizes"></span>
              <span class="panel__badge"></span>
            </button>
          </h2>
          <div id="panel-sizes" class="panel__body mount"></div>
        </section>
      </aside>

      <main id="canvas-area">
        <div id="canvas-host" class="mount"></div>
        <div id="canvas-overlay" class="mount"></div>
        <p id="canvas-empty" data-text="panels.canvasEmpty"></p>
      </main>

      <aside id="panel-right" class="panel">
        <section class="panel__section panel__section--grow" data-section-id="markList">

            </button>

// strings.errors.codeTaken и подобные — шаблоны с {переменными}.
function text(key, vars) {
  let value = key.split(".").reduce((node, part) => (node == null ? node : node[part]), strings);
  if (typeof value !== "string") return key;
  if (vars) {
    for (const [name, replacement] of Object.entries(vars)) {
      value = value.split("{" + name + "}").join(String(replacement));
    }
  }
  return value;
}
