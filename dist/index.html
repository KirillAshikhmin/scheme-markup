// src/panels/schemes.js
// Схемы объекта: список, загрузка плана кнопкой и перетаскиванием, поворот
// и обрезка, переименование, порядок, удаление.
// Холст рисует другой модуль — сюда он приходит только за картинкой:
// подготовленный план и его размер кладутся в состояние сеанса (`schemeImage`).








// Рамка меньше этой доли считается промахом мыши, а не обрезкой.
const PLAN_FRAME_MIN = 0.02;

// Уборка ничьих подложек сносит данные заказчика, поэтому условия запуска
// названы явно и проверяются отдельно от порядка событий: объект открыт,
// за сеанс ещё не убирали, и — главное — отменять нечего. Пока в стеке отмены
// лежит хоть один шаг, он может вернуть ссылку на «ничью» картинку.
function schemesSweepReady({ project, swept, canUndo: hasUndo }) {
  return Boolean(project) && !swept && !hasUndo;
}

function planNameFromFile(file, project) {
  const raw = String((file && file.name) || "").replace(/\.[^.]+$/, "").trim();
  if (raw) return raw.slice(0, 60);
  return text("schemes.defaultName", { number: project.schemes.length + 1 });
}

// Метка держит доли плана: одно накопленное преобразование двигает и их,
// иначе метки уедут с тех мест, куда их поставил инженер.
function remapMarkForTransform(mark, transform) {
  return {
    points: transformMarkPoints(mark.points || [], transform),
    labelOffset: mark.labelOffset ? transformOffset(mark.labelOffset, transform) : null,
  };
}

function marksPushedOutside(marks, transform) {
  return marks.filter((mark) => countPointsOutside(mark.points || [], transform) > 0).length;
}

// Диалог правки плана. Повороты и рамки копятся в одно преобразование и
// применяются к исходнику: JPEG пережимается один раз, сколько бы шагов ни
// сделал пользователь. `beforeApply` — последнее слово вызывающего перед
// применением (например, спросить про метки, которые вынесет за рамку).
function openPlanEditor({ blob, width, height, title, beforeApply }) {
  return new Promise((resolve) => {
    let transform = identityTransform();
    let preview = { blob, width, height };
    let url = URL.createObjectURL(blob);
    let frame = null;
    let busy = false;
    let modal = null;

    const image = uiEl("img", { class: "plan-stage__img", attrs: { src: url, alt: "" } });
    const box = uiEl("div", { class: "plan-frame" });
    box.hidden = true;
    const stage = uiEl("div", { class: "plan-stage" }, [image, box]);
    const hint = uiEl("p", { class: "modal__hint", text: strings.image.cropHint });

    const rotateLeft = uiIconButton("rotateLeft", {
      title: strings.image.rotateLeft,
      on: { click: () => apply(rotateTransform(transform, -90)) },
    });
    const rotateRight = uiIconButton("rotateRight", {
      title: strings.image.rotateRight,
      on: { click: () => apply(rotateTransform(transform, 90)) },
    });
    const cropButton = uiButton(strings.image.crop, {
      on: { click: () => apply(cropTransform(transform, frame)) },
    });
    const resetButton = uiButton(strings.image.cropReset, { on: { click: () => setFrame(null) } });
    const cancelButton = uiButton(strings.dialog.cancel, { on: { click: () => finish(null) } });
    const applyButton = uiButton(strings.image.apply, {
      class: "ui-btn ui-btn--accent",
      on: { click: () => requestApply() },
    });

    function setFrame(next) {
      frame = next;
      box.hidden = !next;
      cropButton.disabled = !next || busy;
      resetButton.disabled = !next || busy;
      if (!next) return;
      const rect = image.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      box.style.left = rect.left - stageRect.left + next.x * rect.width + "px";
      box.style.top = rect.top - stageRect.top + next.y * rect.height + "px";
      box.style.width = next.width * rect.width + "px";
      box.style.height = next.height * rect.height + "px";
    }

    function setBusy(value) {
      busy = value;
      for (const button of [rotateLeft, rotateRight, applyButton, cancelButton]) button.disabled = value;
      cropButton.disabled = value || !frame;
      resetButton.disabled = value || !frame;
      hint.textContent = value ? strings.image.working : strings.image.cropHint;
    }

    // Предпросмотр всегда пересобирается из исходника по накопленному
    // преобразованию — что видно, то и получится, без цепочки пережатий.
    async function apply(next) {
      if (busy) return;
      setBusy(true);
      try {
        const result = await renderPlanImage(blob, next);
        URL.revokeObjectURL(url);
        preview = result;
        transform = next;
        url = URL.createObjectURL(result.blob);
        image.src = url;
        setFrame(null);
        setBusy(false);
      } catch (error) {
        setBusy(false);
        finish(null);
      }
    }

    async function requestApply() {
      if (busy) return;
      // Спрашиваем всегда, а не только после правки: замене подложки важен
      // итоговый размер, даже когда картинку не крутили.
      if (beforeApply) {
        setBusy(true);
        const agreed = await beforeApply(transform, { width: preview.width, height: preview.height });
        setBusy(false);
        if (!agreed) return;
      }
      finish({ blob: preview.blob, width: preview.width, height: preview.height, transform });
    }

    function finish(result) {
      URL.revokeObjectURL(url);
      if (modal) modal.close();
      resolve(result);
    }

    // Рамка тянется мышью прямо по картинке.
    stage.addEventListener("pointerdown", (event) => {
      if (busy || event.button !== 0) return;
      const rect = image.getBoundingClientRect();
      const startX = Math.min(Math.max(event.clientX, rect.left), rect.right);
      const startY = Math.min(Math.max(event.clientY, rect.top), rect.bottom);
      const move = (moveEvent) => {
        const x = Math.min(Math.max(moveEvent.clientX, rect.left), rect.right);
        const y = Math.min(Math.max(moveEvent.clientY, rect.top), rect.bottom);
        setFrame({
          x: (Math.min(startX, x) - rect.left) / rect.width,
          y: (Math.min(startY, y) - rect.top) / rect.height,
          width: Math.abs(x - startX) / rect.width,
          height: Math.abs(y - startY) / rect.height,
        });
      };
      const up = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        if (frame && (frame.width < PLAN_FRAME_MIN || frame.height < PLAN_FRAME_MIN)) setFrame(null);
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
      event.preventDefault();
    });

    modal = uiModal({
      title: title || strings.image.editTitle,
      body: uiEl("div", { class: "plan-editor" }, [
        uiEl("div", { class: "plan-editor__tools" }, [rotateLeft, rotateRight, cropButton, resetButton]),
        stage,
        hint,
      ]),
      actions: [cancelButton, applyButton],
      onCancel: () => {
        URL.revokeObjectURL(url);
        resolve(null);
      },
    });
    setFrame(null);
  });
}

function mountSchemesPanel(host, api) {
  const { getState, setState, notify, subscribe } = api;
  let decoded = null;
  let imageToken = 0;

  const list = uiEl("div", { class: "scheme-list" });
  const fileInput = uiEl("input", {
    class: "scheme-file",
    type: "file",
    attrs: { accept: "image/png,image/jpeg,.png,.jpg,.jpeg" },
    on: {
      change: async () => {
        const file = fileInput.files && fileInput.files[0];
        fileInput.value = "";
        if (file) await addPlanFromFile(file);
      },
    },
  });
  fileInput.hidden = true;
  let replaceTarget = null;
  const replaceInput = uiEl("input", {
    class: "scheme-file",
    type: "file",
    attrs: { accept: "image/png,image/jpeg,.png,.jpg,.jpeg" },
    on: {
      change: async () => {
        const file = replaceInput.files && replaceInput.files[0];
        const schemeId = replaceTarget;
        replaceInput.value = "";
        replaceTarget = null;
        if (file && schemeId) await replacePlanFromFile(schemeId, file);
      },
    },
  });
  replaceInput.hidden = true;
  const addButton = uiButton(strings.schemes.add, {
    class: "ui-btn ui-btn--accent ui-btn--wide",
    on: { click: () => fileInput.click() },
  });
  const hint = uiEl("p", { class: "panel__empty", text: strings.schemes.addHint });
  host.replaceChildren(addButton, fileInput, replaceInput, list, hint);

  function render() {
    const state = getState();
    const project = state.project;
    // Режим просмотра: схему выбирают, но не грузят, не правят и не удаляют.
    const editable = layoutAllows("editSchemes", state.layout);
    list.replaceChildren();
    addButton.disabled = !project;
    addButton.hidden = !editable;
    // Счётчик в заголовке: свёрнутый раздел не путается с пустым.
    setSectionBadge(SECTION_IDS.schemes, project && project.schemes.length ? project.schemes.length : "");
    if (!project || project.schemes.length === 0) {
      hint.textContent = editable
        ? project
          ? strings.schemes.addHint
          : strings.projects.empty
        : strings.mobile.viewOnly;
      return;
    }
    hint.textContent = "";
    const ordered = schemesInOrder(project);
    ordered.forEach((scheme, index) => {
      const marks = project.marks.filter((mark) => mark.schemeId === scheme.id).length;
      const row = uiEl("div", {
        class: "scheme-row" + (scheme.id === state.schemeId ? " scheme-row--current" : ""),
      });
      // Размеры плана стоят в узкой колонке рядом с рядом кнопок и при длинном
      // числе ужимаются многоточием — поэтому то же самое лежит в подсказке.
      const meta = scheme.imageId
        ? text("schemes.size", { width: scheme.width, height: scheme.height })
        : strings.schemes.noImage;
      row.append(
        uiEl("button", {
          class: "scheme-row__name",
          type: "button",
          text: scheme.name,
          title: scheme.name,
          on: { click: () => setState({ schemeId: scheme.id, selectedMarkIds: [] }) },
        }),
        uiEl("span", { class: "scheme-row__meta", text: meta, title: meta }),
        uiEl("div", { class: "scheme-row__tools", attrs: editable ? {} : { hidden: "hidden" } }, [
          uiIconButton("crop", { title: strings.schemes.edit, on: { click: () => editPlan(scheme.id) } }),
          uiIconButton("swap", {
            title: strings.schemes.replace,
            on: {
              click: () => {
                replaceTarget = scheme.id;
                replaceInput.click();
              },
            },
          }),
          uiIconButton("edit", { title: strings.schemes.rename, on: { click: () => renameScheme(scheme.id) } }),
          uiIconButton("up", {
            title: strings.schemes.up,
            attrs: index === 0 ? { disabled: "disabled" } : {},
            on: { click: () => moveScheme(scheme.id, -1) },
          }),
          uiIconButton("down", {
            title: strings.schemes.down,
            attrs: index === ordered.length - 1 ? { disabled: "disabled" } : {},
            on: { click: () => moveScheme(scheme.id, 1) },
          }),
          uiIconButton("trash", {
            class: "ui-btn ui-btn--danger",
            title: strings.schemes.remove,
            on: { click: () => removeScheme(scheme.id, marks) },
          }),
        ]),
      );
      list.append(row);
    });
  }

  // Новый план: проверка файла, правка картинки, только потом запись.
  async function addPlanFromFile(file) {
    const state = getState();
    if (!state.project) return;
    if (!isPlanImageFile(file)) {
      notify(strings.image.wrongType, "error");
      return;
    }
    let plan;
    hint.textContent = strings.schemes.loading;
    addButton.disabled = true;
    try {
      plan = await readPlanImage(file);
    } catch (error) {
      notify(strings.image.broken, "error");
      return;
    } finally {
      addButton.disabled = false;
      render();
    }
    const edited = await openPlanEditor({
      blob: plan.blob,
      width: plan.width,
      height: plan.height,
      title: strings.image.editTitle,
    });
    if (!edited) return;
    const imageId = await putImage(edited.blob);
    const fresh = getState().project;
    const added = addScheme(fresh, {
      name: planNameFromFile(file, fresh),
      imageId,
      width: edited.width,
      height: edited.height,
    });
    setState({ project: added.project, schemeId: added.scheme.id, selectedMarkIds: [] });
    notify(text("schemes.added", { name: added.scheme.name }), "success");
  }

  // Правка уже загруженного плана: метки пересчитываются тем же преобразованием.
  // Про метки, которые уедут за рамку, спрашиваем до применения — потом
  // прежних мест уже не вернуть.
  async function editPlan(schemeId) {
    const project = getState().project;
    const scheme = findScheme(project, schemeId);
    if (!scheme || !scheme.imageId) return;
    const blob = await getImage(scheme.imageId);
    if (!blob) {
      notify(strings.image.broken, "error");
      return;
    }
    const marksOfScheme = project.marks.filter((mark) => mark.schemeId === schemeId);
    const edited = await openPlanEditor({
      blob,
      width: scheme.width,
      height: scheme.height,
      title: scheme.name,
      beforeApply: async (transform) => {
        const count = marksPushedOutside(marksOfScheme, transform);
        if (count === 0) return true;
        return uiConfirm({
          title: strings.image.outsideTitle,
          message: text("image.marksOutsideAsk", { count }),
          confirmLabel: strings.image.cropAnyway,
        });
      },
    });
    if (!edited || isIdentityTransform(edited.transform)) return;
    const imageId = await putImage(edited.blob);
    let next = updateScheme(getState().project, schemeId, {
      imageId,
      width: edited.width,
      height: edited.height,
    }).project;
    const moved = next.marks.filter((mark) => mark.schemeId === schemeId);
    const pushed = marksPushedOutside(moved, edited.transform);
    for (const mark of moved) {
      const patch = remapMarkForTransform(mark, edited.transform);
      next = updateMark(next, mark.id, patch.labelOffset ? patch : { points: patch.points }).project;
    }
    await deleteImage(scheme.imageId);
    setState({ project: next, schemeImage: null });
    notify(pushed === 0 ? strings.image.applied : text("image.appliedClamped", { count: pushed }), "success");
  }

  // Замена подложки: картинка другая, разметка остаётся вся. Координаты — доли
  // плана, поэтому при той же пропорции всё встаёт само; при другой разметка
  // поедет, и об этом спрашивают до применения, а не показывают кашу после.
  // Прежнее преобразование не переносится: поворот и обрезка запечены в старой
  // картинке, самого преобразования нигде нет. Новый файл правится тем же
  // редактором и теми же руками — с предпросмотром, а не вслепую.
  async function replacePlanFromFile(schemeId, file) {
    const scheme = findScheme(getState().project, schemeId);
    if (!scheme) return;
    if (!isPlanImageFile(file)) {
      notify(strings.image.wrongType, "error");
      return;
    }
    let plan;
    try {
      plan = await readPlanImage(file);
    } catch (error) {
      notify(strings.image.broken, "error");
      return;
    }
    const wasSize = { width: scheme.width, height: scheme.height };
    const edited = await openPlanEditor({
      blob: plan.blob,
      width: plan.width,
      height: plan.height,
      title: text("image.replaceTitle", { name: scheme.name }),
      beforeApply: async (transform, size) => {
        if (sameAspect(wasSize, size)) return true;
        return uiConfirm({
          title: strings.image.aspectTitle,
          message: text("image.aspectAsk", {
            before: text("schemes.size", { width: wasSize.width, height: wasSize.height }),
            after: text("schemes.size", { width: size.width, height: size.height }),
          }),
          confirmLabel: strings.image.replaceAnyway,
        });
      },
    });
    if (!edited) return;
    const imageId = await putImage(edited.blob);
    const before = getState().project;
    if (!findScheme(before, schemeId)) return;
    let after;
    try {
      after = replaceSchemeImage(before, schemeId, {
        imageId,
        width: edited.width,
        height: edited.height,
      }).project;
    } catch (error) {
      notify(error.message, "error");
      return;
    }
    // Через canvasCommit: замену отменяет Ctrl+Z, как и всё остальное. Прежняя
    // картинка поэтому и остаётся в хранилище — её убирает уборка при запуске,
    // когда отменять уже нечего.
    canvasCommit(before, after, strings.history.replaceImage, { schemeId });
    notify(sameAspect(wasSize, edited) ? strings.image.replaced : strings.image.replacedShifted, "success");
  }

  async function renameScheme(schemeId) {
    const project = getState().project;
    const scheme = findScheme(project, schemeId);
    if (!scheme) return;
    const name = await uiPrompt({ title: strings.schemes.renameTitle, value: scheme.name });
    if (!name || name === scheme.name) return;
    setState({ project: updateScheme(getState().project, schemeId, { name }).project });
  }

  function moveScheme(schemeId, delta) {
    const project = getState().project;
    const ordered = schemesInOrder(project);
    const index = ordered.findIndex((scheme) => scheme.id === schemeId);
    const target = index + delta;
    if (index < 0 || target < 0 || target >= ordered.length) return;
    const moved = [...ordered];
    moved.splice(target, 0, moved.splice(index, 1)[0]);
    let next = project;
    moved.forEach((scheme, position) => {
      if (scheme.order !== position) next = updateScheme(next, scheme.id, { order: position }).project;
    });
    setState({ project: next });
  }

  async function removeScheme(schemeId, marks) {
    const project = getState().project;
    const scheme = findScheme(project, schemeId);
    if (!scheme) return;
    const agreed = await uiConfirm({
      title: strings.schemes.removeTitle,
      message: text("schemes.removeMessage", { name: scheme.name, marks }),
    });
    if (!agreed) return;
    const fresh = getState().project;
    const next = deleteScheme(fresh, schemeId).project;
    if (scheme.imageId) await deleteImage(scheme.imageId);
    const rest = schemesInOrder(next);
    setState({
      project: next,
      schemeId: getState().schemeId === schemeId ? (rest[0] ? rest[0].id : null) : getState().schemeId,
      selectedMarkIds: [],
    });
    notify(text("schemes.removed", { name: scheme.name }), "success");
  }

  // Картинка текущей схемы — единственное, что панель отдаёт холсту.
  async function loadSchemeImage(force) {
    const state = getState();
    const scheme = state.project && state.schemeId ? findScheme(state.project, state.schemeId) : null;
    const token = ++imageToken;
    if (!scheme || !scheme.imageId) {
      if (decoded) releasePlanImage(decoded);
      decoded = null;
      if (state.schemeImage) setState({ schemeImage: null });
      return;
    }
    const current = state.schemeImage;
    if (!force && current && current.schemeId === scheme.id && current.imageId === scheme.imageId) return;
    const blob = await getImage(scheme.imageId);
    if (!blob || token !== imageToken) return;
    let next;
    try {
      next = await decodePlanImage(blob);
    } catch (error) {
      notify(strings.image.broken, "error");
      return;
    }
    if (token !== imageToken) {
      releasePlanImage(next);
      return;
    }
    if (decoded) releasePlanImage(decoded);
    decoded = next;
    setState({
      schemeImage: {
        schemeId: scheme.id,
        imageId: scheme.imageId,
        image: next.image,
        url: next.url,
        width: next.width,
        height: next.height,
      },
    });
  }

  // Перетаскивание плана на холст — тот же путь, что и кнопка.
  const area = document.getElementById("canvas-area");
  if (area) {
    area.dataset.drop = strings.schemes.dropHere;
    area.addEventListener("dragover", (event) => {
      event.preventDefault();
      area.classList.add("is-dropping");
    });
    area.addEventListener("dragleave", (event) => {
      if (event.target === area) area.classList.remove("is-dropping");
    });
    area.addEventListener("drop", async (event) => {
      event.preventDefault();
      area.classList.remove("is-dropping");
      const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
      if (file) await addPlanFromFile(file);
    });
  }
  // Файл, брошенный мимо холста, не должен уводить страницу в просмотр картинки.
  document.addEventListener("dragover", (event) => event.preventDefault());
  document.addEventListener("drop", (event) => event.preventDefault());

  // Уборка ничьих подложек — один раз за сеанс, на первом открытом объекте:
  // стек отмены в этот момент пуст, несохранённых правок ещё нет, и удалять
  // безопасно. Мусор, нажитый за сеанс, уйдёт при следующем запуске.
  let swept = false;
  subscribe((state, changed) => {
    if ("layout" in changed) render();
    if ("project" in changed || "schemeId" in changed) {
      render();
      loadSchemeImage(false);
    }
    if (schemesSweepReady({ project: state.project, swept, canUndo: canUndo() })) {
      swept = true;
      sweepOrphanImages([state.project]);
    }
  });
  render();
  loadSchemeImage(false);
}

// src/panels/search.js
// Поиск по объекту: строка в шапке и выпадающий список вариантов.
//
// Ищут не по открытой схеме, а по всему объекту: «где Р14» — вопрос про дом,
// а не про лист. Поэтому выбор варианта не просто выделяет метку, а переключает
// схему, если метка на другой, и подводит к ней холст — ради этого поиск
// и заведён. Подбор вариантов живёт в `model.searchProject`, здесь только
// список, клавиши и прыжок.





// Подводит холст к метке — то же самое делает клик по строке списка меток.

// Больше тридцати строк в выпадающем списке никто не читает: остальное
// сужают запросом, а сколько всего нашлось — сказано внизу списка.
const SEARCH_LIMIT = 30;

function searchRowNode(project, row, active, onPick, onHover) {
  const style = styleOf(project, row.typeId);
  const where = [row.roomName || strings.search.noRoom, row.schemeName].filter(Boolean).join(" · ");
  const parts = [
    shapeIcon(style.shape, style.color, 16),
    uiEl("span", { class: "search__label", text: row.label }),
    uiEl("span", { class: "search__type", text: row.typeName }),
    uiEl("span", { class: "search__where", text: where }),
  ];
  // Совпало не обозначение — показываем, что именно нашлось: иначе строка
  // выглядит случайной.
  if (row.field === "location" || row.field === "original") {
    parts.push(uiEl("span", { class: "search__match", text: row.value }));
  }
  return uiEl(
    "button",
    {
      class: "search__row" + (active ? " is-active" : ""),
      type: "button",
      on: { click: onPick, pointerenter: onHover },
    },
    parts,
  );
}

function mountSearchPanel(host, api) {
  const { getState, setState, subscribe } = api;
  let rows = [];
  let active = 0;
  let pending = null;

  const input = uiEl("input", {
    class: "ui-input search__input",
    type: "search",
    placeholder: strings.search.placeholder,
    title: strings.search.title,
  });
  const drop = uiEl("div", { class: "search__drop" });
  drop.hidden = true;
  const box = uiEl("div", { class: "search" }, [input, drop]);
  // Поиск нужен изредка, а место в шапке занимал всегда: свёрнутый он — значок,
  // развёрнутый — та же строка, что была. Клавиша та же, что в почте и в
  // хранилищах кода: «/» на физической клавише (в русской раскладке — точка),
  // у браузера она не отнята.
  const toggle = uiIconButton("search", {
    label: strings.search.open,
    title: strings.search.openHint,
    on: { click: () => openSearch() },
  });
  host.replaceChildren(toggle, box);

  function close() {
    drop.hidden = true;
    drop.replaceChildren();
    rows = [];
    active = 0;
  }

  // Свернуть — значит убрать строку с глаз. Ни выделение, ни схему, ни
  // подведённый холст это не трогает: найденное остаётся найденным, а набранный
  // запрос ждёт в поле следующего раза.
  function closeSearch() {
    close();
    host.classList.remove("is-open");
    toggle.hidden = false;
    if (document.activeElement === input) input.blur();
  }

  function openSearch() {
    if (host.hidden) return;
    host.classList.add("is-open");
    toggle.hidden = true;
    input.focus();
    input.select();
    if (input.value.trim() !== "") search();
  }

  function render() {
    const project = getState().project;
    if (!project || rows.length === 0) {
      drop.replaceChildren(uiEl("p", { class: "search__empty", text: strings.search.empty }));
      drop.hidden = false;
      return;
    }
    const shown = rows.slice(0, SEARCH_LIMIT);
    const nodes = shown.map((row, index) =>
      searchRowNode(
        project,
        row,
        index === active,
        () => pick(index),
        () => setActive(index, false),
      ),
    );
    if (rows.length > shown.length) {
      nodes.push(
        uiEl("p", {
          class: "search__more",
          text: text("search.more", { shown: shown.length, total: rows.length }),
        }),
      );
    }
    drop.replaceChildren(...nodes);
    drop.hidden = false;
  }

  function setActive(index, scroll = true) {
    const shown = Math.min(rows.length, SEARCH_LIMIT);
    if (shown === 0) return;
    active = ((index % shown) + shown) % shown;
    const nodes = drop.querySelectorAll(".search__row");
    nodes.forEach((node, position) => node.classList.toggle("is-active", position === active));
    if (scroll && nodes[active]) nodes[active].scrollIntoView({ block: "nearest" });
  }

  function search() {
    const state = getState();
    const query = input.value;
    if (!state.project || query.trim() === "") {
      close();
      return;
    }
    rows = searchProject(state.project, query);
    active = 0;
    render();
  }

  // Прыжок к метке: схема, выделение и подведённый холст. Картинка новой схемы
  // приходит не мгновенно, а холст сам вписывает план, когда её дождётся, —
  // поэтому центрируем ещё раз, когда картинка доехала.
  function centerOn(row) {
    const state = getState();
    if (!state.project || state.schemeId !== row.schemeId) return false;
    const scheme = findScheme(state.project, row.schemeId);
    const mark = findMark(state.project, row.markId);
    if (!scheme || !mark) return false;
    setState({ view: marksCenteredView(scheme, mark, state.view) });
    return true;
  }

  function pick(index) {
    const row = rows[index];
    if (!row) return;
    const state = getState();
    const patch = { selectedMarkIds: [row.markId], selectedOutlineId: null };
    if (state.schemeId !== row.schemeId) patch.schemeId = row.schemeId;
    setState(patch);
    pending = row;
    queueMicrotask(() => {
      if (pending === row && centerOn(row)) pending = null;
    });
    drop.hidden = true;
    input.blur();
  }

  input.addEventListener("input", () => search());
  input.addEventListener("focus", () => {
    if (input.value.trim() !== "") search();
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "ArrowDown") {
      event.preventDefault();
      if (drop.hidden) search();
      else setActive(active + 1);
      return;
    }
    if (event.key === "ArrowUp") {
      event.preventDefault();
      setActive(active - 1);
      return;
    }
    if (event.key === "Enter") {
      event.preventDefault();
      // Enter — первый вариант, как и просил пользователь: набрал «Р14», нажал,
      // оказался на нужной схеме.
      if (drop.hidden) search();
      if (rows.length > 0) pick(active);
      return;
    }
    if (event.key === "Escape") {
      event.preventDefault();
      // Первый Esc убирает список вариантов, второй сворачивает поиск в значок.
      if (!drop.hidden) {
        close();
        return;
      }
      closeSearch();
    }
  });
  // Клик мимо списка закрывает его, но не мешает клику по строке.
  box.addEventListener("focusout", () => {
    setTimeout(() => {
      if (!box.contains(document.activeElement)) closeSearch();
    }, 0);
  });

  // Горячая клавиша: «/» без модификаторов, по физической клавише — раскладка
  // роли не играет. Пока открыт диалог или курсор стоит в поле ввода, клавиша
  // принадлежит им.
  document.addEventListener("keydown", (event) => {
    if (event.code !== "Slash" || event.ctrlKey || event.metaKey || event.altKey) return;
    if (host.hidden || uiDialogDepth() > 0) return;
    const target = event.target;
    if (
      target &&
      (target.tagName === "INPUT" ||
        target.tagName === "TEXTAREA" ||
        target.tagName === "SELECT" ||
        target.isContentEditable)
    ) {
      return;
    }
    event.preventDefault();
    openSearch();
  });

  subscribe((state, changed) => {
    if ("layout" in changed) {
      host.hidden = !layoutAllows("search", state.layout);
      if (host.hidden) closeSearch();
    }
    if ("project" in changed && state.project) {
      // Сменился объект — прежние находки к нему не относятся.
      if (!state.project.marks.some((mark) => rows.some((row) => row.markId === mark.id))) close();
    }
    if (pending && ("schemeImage" in changed || "schemeId" in changed || "project" in changed)) {
      if (centerOn(pending)) pending = null;
    }
  });
  host.hidden = !layoutAllows("search", getState().layout);
}

// src/panels/typePicker.js
// Своё окно выбора типа метки: «буква — пояснение», поиск и ввод нового кода
// прямо здесь.
//
// Категории стоят колонками рядом — «Свет», «Выключатели», «Розетки» и так
// далее, — а не одним длинным столбцом: окно открывается десятки раз за сеанс,
// и цель — попасть в нужный тип одним взглядом и одним кликом, без листания.
// В одной колонке категорий бывает несколько: короткие «Розетки» и «Климат»
// встают друг под друга, а не держат каждая свою пустую колонку до низа окна.
// Раскладку считает `pickerLayout`, ширину окна задаёт число получившихся
// колонок (`--picker-columns`) — справа не остаётся пустого поля, и колонки не
// растягиваются, когда поиск оставил одну.
//
// Окно открывается один раз на серию: выбранный тип «залипает» в панели
// инструментов, и дальше метки ставятся кликами без единого диалога.




// Значок типа — цвет категории и форма из справочника, нарисованные общим
// `render.shapeIcon`: в списке видно ровно то, что попадёт на план.
function pickerIcon(project, typeId, size = 22) {
  const style = styleOf(project, typeId);
  return shapeIcon(style.shape, style.color, size);
}

// Больше шести колонок в ряд не ставим: седьмая ужимает остальные до каши.
// Лишние категории уходят не во второй ряд, а вниз по колонкам — вторым рядом
// сетка выравнивала всё по самой высокой категории и оставляла посреди окна
// пустое поле.
const PICKER_MAX_COLUMNS = 6;

// Меры окна, по которым считается, сколько колонок в него влезет. Те же числа
// стоят в `typePicker.css`: ширина колонки (`minmax(150px, 1fr)`), просвет
// между колонками (`gap`), доля экрана под карточку (`max-width: 96vw`) и её
// собственные поля с рамкой (`.modal`: по 18px с каждой стороны плюс рамка,
// здесь с запасом до 40). Считать нужно
// всё это вместе: колонка, которая «почти влезла», даёт горизонтальную
// прокрутку — а на узком экране колонок должно становиться меньше, только и
// всего.
const PICKER_COLUMN_MIN = 150;
const PICKER_COLUMN_GAP = 14;
const PICKER_MODAL_SHARE = 0.96;
const PICKER_MODAL_CHROME = 40;

// Сколько колонок помещается в экран шириной `width`.
function pickerColumnLimit(width) {
  const usable = Math.max(0, Number(width) || 0) * PICKER_MODAL_SHARE - PICKER_MODAL_CHROME;
  const fits = Math.floor((usable + PICKER_COLUMN_GAP) / (PICKER_COLUMN_MIN + PICKER_COLUMN_GAP));
  return Math.max(1, Math.min(PICKER_MAX_COLUMNS, fits));
}

// Высота категории в строках: заголовок плюс её типы. Точные пиксели здесь не
// нужны — раскладка решает, что с чем встанет в одну колонку, а не рисует.
function pickerWeight(group) {
  return 1 + (group && Array.isArray(group.types) ? group.types.length : 0);
}

// Категории кладутся в колонку подряд, пока та не станет выше `height`.
// Порядок справочника сохраняется: колонка читается сверху вниз, колонки —
// слева направо, «Свет» по-прежнему первый, «Щит» последний.
function pickerFill(groups, height) {
  const columns = [];
  let filled = 0;
  for (const group of groups) {
    const weight = pickerWeight(group);
    if (columns.length > 0 && filled + weight <= height) {
      columns[columns.length - 1].push(group);
      filled += weight;
      continue;
    }
    columns.push([group]);
    filled = weight;
  }
  return columns;
}

// Раскладка категорий по колонкам. Сетка выравнивала ряд по самой высокой
// категории: «Свет» с девятью типами держал всю первую строку, и «Щит» с
// «Датчиками» начинались только под ним — между выключателями и датчиками
// зияла пустая половина окна. Здесь колонка набивается подряд до высоты самой
// длинной категории: пустых мест между категориями не остаётся, а колонок
// выходит ровно столько, сколько понадобилось, — не больше `limit`.
function pickerLayout(groups, limit = PICKER_MAX_COLUMNS) {
  const list = Array.isArray(groups) ? groups.filter(Boolean) : [];
  if (list.length === 0) return [];
  const cap = Math.max(1, Math.floor(Number(limit)) || 1);
  const total = list.reduce((sum, group) => sum + pickerWeight(group), 0);
  let height = Math.max(...list.map(pickerWeight));
  let columns = pickerFill(list, height);
  // Категорий больше, чем колонок помещается в окно, — колонка становится
  // выше, и лишние уходят под соседние, а не за край экрана.
  while (columns.length > cap && height < total) {
    height += 1;
    columns = pickerFill(list, height);
  }
  return columns;
}

// Клавиатура по сетке: вверх-вниз — по колонке целиком, через границы
// категорий, если их в колонке несколько; вправо-влево — в соседнюю колонку на
// ту же строку (короткая колонка прижимает к последней строке).
function pickerMove(box, row, dx, dy) {
  const columns = [...box.children].filter((node) => node.classList.contains("picker__column"));
  const rowsOf = (node) => [...node.querySelectorAll(".picker__row")];
  const column = columns.findIndex((node) => node.contains(row));
  if (column < 0) return;
  const index = rowsOf(columns[column]).indexOf(row);
  const rows = rowsOf(columns[Math.min(columns.length - 1, Math.max(0, column + dx))]);
  const next = rows[Math.min(rows.length - 1, Math.max(0, index + dy))];
  if (next) next.focus();
}

// Смена типа у метки идёт внутри её вида: линии — линейные типы, точке —
// точечные. Окно получает вид в `options.kind` и оставляет только свои типы;
// постановка новой метки вид не задаёт и видит справочник целиком.
//
// Вид спрашивается у `typeKindOf`, а не у `type.kind`: у объекта прежнего
// формата поля нет вовсе. Категория, в которой не осталось ни одного типа
// нужного вида, из окна уходит — пустой заголовок держал бы колонку зря.
function pickerGroupsOfKind(project, groups, kind) {
  if (kind !== "point" && kind !== "line") return groups;
  return groups
    .map((group) => ({ ...group, types: group.types.filter((type) => typeKindOf(project, type.id) === kind) }))
    .filter((group) => group.types.length > 0);
}
function openTypePicker(project, options = {}) {
  return new Promise((resolve) => {
    let modal;
    let current = project;
    const done = (result) => {
      modal.close();
      resolve(result || null);
    };

    const box = uiEl("div", { class: "picker__columns" });
    const body = uiEl("div", { class: "picker picker--types" });
    const error = uiEl("p", { class: "picker__error" });
    const createBox = uiEl("div", { class: "picker__create" });
    const search = uiEl("input", {
      class: "ui-input",
      type: "text",
      placeholder: strings.picker.search,
      on: {
        input: () => renderList(),
        keydown: (event) => {
          // Стрелка вниз из поиска — в первую строку сетки: дальше по ней
          // ходят стрелками, не хватаясь за мышь.
          if (event.key === "ArrowDown") {
            const first = box.querySelector(".picker__row");
            if (!first) return;
            event.preventDefault();
            first.focus();
            return;
          }
          if (event.key !== "Enter") return;
          event.preventDefault();
          const first = box.querySelector(".picker__row");
          if (first) first.click();
          else if (createBox.firstChild) createType();
        },
      },
    });

    let createName = null;
    let createCategory = null;

    function createType() {
      const code = search.value.trim();
      if (!createName || !createCategory) return;
      try {
        const result = addType(current, {
          code,
          name: createName.value.trim() || code,
          categoryId: createCategory.value,
          // Окно сужено до вида метки — заведённый здесь тип обязан быть того
          // же вида, иначе его нечем будет выбрать в этом же окне.
          ...(options.kind ? { kind: options.kind } : {}),
        });
        done({ typeId: result.type.id, project: result.project, created: true });
      } catch (failure) {
        error.textContent = failure.message;
      }
    }

    function renderCreate(query) {
      createBox.replaceChildren();
      error.textContent = "";
      // Годится ли код — знает модель, и только она: буквы, длина и занятость
      // проверяются там же, где их проверит `addType`. Своей копии правила
      // здесь нет намеренно — прежняя пережила снятие предела в две буквы и
      // отказывалась заводить «ПОДСВЕТКА».
      // Тип с таким названием или кодом уже есть — второй такой же заводить
      // незачем: он стоит первым в списке, и Enter берёт именно его.
      if (matchTypeExactly(current, query)) return;
      if (codeProblem(current, query)) return;
      createName = uiEl("input", {
        class: "ui-input",
        type: "text",
        placeholder: strings.picker.createNamePlaceholder,
      });
      createCategory = uiEl(
        "select",
        { class: "ui-select" },
        current.categories.map((category) =>
          uiEl("option", { text: category.name, value: category.id, attrs: { value: category.id } }),
        ),
      );
      createBox.append(
        uiEl("p", { class: "picker__createTitle", text: text("picker.createTitle", { code: query }) }),
        uiEl("p", { class: "picker__createTitle", text: text("picker.codeHint", { max: CODE_MAX_LENGTH }) }),
        uiEl("label", { class: "picker__field" }, [
          uiEl("span", { text: strings.picker.createName }),
          createName,
        ]),
        uiEl("label", { class: "picker__field" }, [
          uiEl("span", { text: strings.picker.createCategory }),
          createCategory,
        ]),
        uiButton(strings.picker.create, {
          class: "ui-btn ui-btn--accent",
          on: { click: createType },
        }),
      );
    }

    function typeRow(type) {
      const row = uiEl(
        "button",
        {
          class: "picker__row" + (type.id === options.activeTypeId ? " is-active" : ""),
          type: "button",
          // Длинный код не даёт названию места, и оно ужимается многоточием —
          // подсказка возвращает его целиком.
          title: type.code + " — " + type.name,
          on: { click: () => done({ typeId: type.id, project: current }) },
        },
        [
          pickerIcon(current, type.id),
          uiEl("span", { class: "picker__code", text: type.code }),
          uiEl("span", { class: "picker__name", text: type.name }),
        ],
      );
      return row;
    }

    // Категория — заголовок в её цвете и строки типов. Блок целиком, потому
    // что в колонке их бывает несколько: заголовок должен липнуть к своим
    // строкам и уезжать вместе с ними, а не наезжать на соседнюю категорию.
    function categoryBlock(group) {
      const head = uiEl("div", { class: "picker__group", text: group.category.name });
      head.style.borderColor = group.category.color;
      head.style.color = group.category.color;
      return uiEl("div", { class: "picker__category" }, [head, ...group.types.map(typeRow)]);
    }

    function renderList() {
      const query = search.value.trim();
      // Что за чем показывать, решает модель: поиск по коду и названию,
      // точное совпадение кода первым. Своей сортировки здесь нет.
      const groups = pickerGroupsOfKind(current, searchTypes(current, query), options.kind);
      const width = typeof window === "undefined" ? 0 : window.innerWidth;
      const columns = pickerLayout(groups, pickerColumnLimit(width));
      box.replaceChildren(
        ...columns.map((column) => uiEl("div", { class: "picker__column" }, column.map(categoryBlock))),
      );
      if (groups.length === 0) box.append(uiEl("p", { class: "panel__empty", text: strings.picker.empty }));
      // Ширину окна задаёт число колонок: уместились семь категорий в четыре —
      // окно на четыре колонки и никакого пустого поля справа, одна найденная
      // категория — узкое окно.
      body.style.setProperty("--picker-columns", String(Math.max(columns.length, 1)));
      renderCreate(query);
    }

    // Клавиатура по сетке. Enter здесь обязателен свой: основное действие
    // диалога — «Отмена», и оно сработало бы раньше, чем браузер превратит
    // Enter в клик по строке, — то есть выбор терялся бы.
    box.addEventListener("keydown", (event) => {
      const row = event.target;
      if (!row || !row.classList || !row.classList.contains("picker__row")) return;
      if (event.key === "Enter") {
        event.preventDefault();
        row.click();
        return;
      }
      const step = { ArrowDown: [0, 1], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowLeft: [-1, 0] }[event.key];
      if (!step) return;
      event.preventDefault();
      pickerMove(box, row, step[0], step[1]);
    });

    renderList();
    const note =
      options.kind === "line" || options.kind === "point"
        ? uiEl("p", {
            class: "picker__note",
            text: options.kind === "line" ? strings.picker.onlyLine : strings.picker.onlyPoint,
          })
        : null;
    body.replaceChildren(...[search, note, box, createBox, error].filter(Boolean));
    modal = uiModal({
      title: options.title || strings.picker.title,
      body,
      actions: [uiButton(strings.dialog.cancel, { on: { click: () => done(null) } })],
      onCancel: () => resolve(null),
    });
    // Широкая карточка — только у этого окна: ширину внутри задаёт сетка колонок.
    if (modal.card) modal.card.classList.add("modal--wide");
    search.focus();
  });
}

// src/panels/tools.js
// Два раздела левой колонки. «Метки» — всё про постановку: выбранный тип,
// что ставим, режим блока, отмена. Тип показан крупно и «залипает» — по нему
// видно, что следующий клик по плану поставит именно его. «Размеры» — размер
// меток и подписей и масштаб плана.
//
// Обводки помещений здесь нет вовсе: контур принадлежит комнате, а не метке,
// и запускается из раздела «Помещения» — там и список комнат, и кнопки
// контуров. В этом разделе остаются только режимы про метки.









const TOOLS_MARK_SIZE = { min: 4, max: 36 };
const TOOLS_LABEL_SIZE = { min: 8, max: 40 };
// Крупный значок выбранного типа: цвет категории и форма из справочника,
// нарисованные тем же `render.shapeIcon`, что в списках и на плане.
function toolsTypeIcon(project, typeId, size = 26) {
  const style = styleOf(project, typeId);
  return shapeIcon(style.shape, style.color, size);
}

// Ползунок двигается живьём, а в историю попадает одним действием на всё
// перетаскивание: иначе стек забивался бы тридцатью шагами на один жест.
// Отметка «линейка и направляющие»: состояние сеанса плюс запись в настройки —
// оно переживает перезагрузку, но в объект не попадает.
function toolsGuidesCheck(state, setState) {
  const box = uiEl("input", {
    class: "tools__check",
    type: "checkbox",
    on: {
      change: () => {
        setState({ guidesShown: box.checked });
        setSetting(GUIDES_SETTING, box.checked);
      },
    },
  });
  box.checked = state.guidesShown !== false;
  return box;
}

function toolsSlider(value, range, onInput, onCommit) {
  return uiEl("input", {
    class: "tools__slider",
    type: "range",
    value: String(value),
    attrs: { min: String(range.min), max: String(range.max), step: "1" },
    on: {
      input: (event) => onInput(Number(event.target.value)),
      change: () => onCommit(),
    },
  });
}

function mountToolsPanel(host, api) {
  const { getState, setState, subscribe, notify } = api;
  const box = uiEl("div", { class: "tools" });
  host.replaceChildren(box);

  function activeType(state) {
    return state.project && state.activeTypeId ? findType(state.project, state.activeTypeId) : null;
  }

  async function chooseType(nextMode) {
    const state = getState();
    if (!state.project) return;
    const picked = await openTypePicker(state.project, { activeTypeId: state.activeTypeId });
    if (!picked) return;
    const fresh = getState();
    // Выбрали тип — значит собрались ставить: режим добавления, а что именно
    // встанет, решит вид типа. Отдельного выбора «точка или линия» больше нет.
    const mode = nextMode || "add";
    if (!picked.created) {
      setState({ activeTypeId: picked.typeId, mode });
      return;
    }
    // Новый тип — правка объекта, значит и шаг истории: иначе следующий Ctrl+Z
    // по метке вернул бы объект без этого типа, ни о чём не спросив.
    canvasCommit(fresh.project, picked.project, strings.history.addType, {
      patch: { activeTypeId: picked.typeId, mode },
    });
    const type = findType(picked.project, picked.typeId);
    notify(text("picker.created", { code: type.code, name: type.name }), "success");
  }

  // Смена типа у выделенной метки: модель выдаёт новый номер, старый остаётся
  // дырой — так распечатка вчерашнего дня не протухает.
  async function changeSelectedType() {
    const state = getState();
    const markId = state.selectedMarkIds[0];
    if (!state.project || !markId) return;
    const mark = findMark(state.project, markId);
    if (!mark) return;
    // Сменить тип можно только внутри вида метки: нарисованной линии — другой
    // линейный тип, точке — другой точечный. Окно показывает только их;
    // метка прежнего объекта, чей тип оказался чужого вида, своего текущего
    // типа в списке не увидит — это и правильно, менять его есть на что.
    const picked = await openTypePicker(state.project, {
      title: strings.tools.changeType,
      kind: mark.kind === "line" ? "line" : "point",
      activeTypeId: mark.typeId,
    });
    if (!picked) return;
    const before = picked.created ? state.project : getState().project;
    const base = picked.created ? picked.project : before;
    if (!findMark(base, markId)) return;
    try {
      const after = changeMarkType(base, markId, picked.typeId).project;
      canvasCommit(before, after, strings.history.changeType, { selection: [markId] });
      notify(text("canvas.typeChanged", { label: labelOf(after, markId) }), "success");
    } catch (error) {
      notify(error.message, "error");
    }
  }

  function setMode(mode) {
    const state = getState();
    if (mode !== "select" && !state.schemeId) {
      notify(strings.canvas.needScheme);
      return;
    }
    if (mode !== "select" && !state.activeTypeId) {
      chooseType(mode);
      return;
    }
    setState({ mode });
  }

  function setBlockMode(mode) {
    const state = getState();
    const type = activeType(state);
    if (!type) return;
    canvasCommit(state.project, updateType(state.project, type.id, { blockMode: mode }).project, strings.history.blockMode);
  }

  function render() {
    const state = getState();
    const type = activeType(state);
    // Вид выбранного типа — единственное, что решает, точку или ломаную
    // поставит следующий клик. Спрашивается он у модели: у объекта прежнего
    // формата поля `kind` у типа нет вовсе.
    const kind = type ? typeKindOf(state.project, type.id) : null;
    // Метка, у которой можно сменить тип: пока её нет, кнопки нет тоже —
    // серая кнопка, которая никогда не оживает, хуже её отсутствия.
    const selectedId = state.selectedMarkIds[0];
    const selectedMark = state.project && selectedId ? findMark(state.project, selectedId) : null;

    const typeButton = uiEl(
      "button",
      {
        class: "tools__type" + (type ? " is-set" : ""),
        type: "button",
        title: strings.tools.chooseType,
        on: { click: () => chooseType() },
      },
      type
        ? [
            toolsTypeIcon(state.project, type.id),
            uiEl("span", { class: "tools__code", text: type.code }),
            uiEl("span", { class: "tools__typeName", text: type.name }),
            // Плашка и есть кнопка выбора типа — и должна выглядеть кнопкой:
            // пользователь нажимал её вслепую, а рядом серела мёртвая кнопка.
            uiEl("span", { class: "tools__pick", text: strings.tools.pick }),
          ]
        : [
            uiEl("span", { class: "tools__typeName", text: strings.tools.noType }),
            uiEl("span", { class: "tools__pick", text: strings.tools.pick }),
          ],
    );

    // Режимов два: выделение и добавление. Что именно добавится — точка или
    // ломаная, — решает вид выбранного типа, и строка под кнопками говорит
    // ровно это. Третьей кнопки нет: выбор вида руками пользователя только
    // путал, когда он уже выбрал тип. Строка нужна именно словами: по одному
    // значку типа не видно, ставится метка кликом или тянется линией.
    const modeNote = !kind
      ? strings.canvas.needType
      : kind === "line"
        ? strings.tools.kindLineHint
        : strings.tools.kindPointHint;
    const modeRow = uiEl("div", { class: "tools__row tools__row--modes" }, [
      uiButton(strings.tools.selectMode, {
        class: "ui-btn" + (state.mode === "select" ? " is-active" : ""),
        title: strings.tools.selectModeHint,
        on: { click: () => setMode("select") },
      }),
      uiButton(strings.tools.addMode, {
        class: "ui-btn" + (state.mode === "add" ? " is-active" : ""),
        // Типа нет — кнопка откроет окно выбора, про точку ей обещать нечего.
        title: modeNote,
        on: { click: () => setMode("add") },
      }),
    ]);

    // Блок собирается только из точек — ручки «+» у линии нет и быть не может.
    // При линейном типе выбор гаснет и говорит почему: живой на вид список,
    // который ни на что не влияет, — обещание, которого сборка не держит.
    const blockOff = !type || kind === "line";
    const blockSelect = uiEl(
      "select",
      {
        class: "ui-select",
        title: kind === "line" ? strings.tools.blockLineHint : strings.tools.blockHint,
        on: { change: (event) => setBlockMode(event.target.value) },
      },
      BLOCK_MODES.map((mode) =>
        uiEl("option", { text: strings.blockMode[mode], value: mode, attrs: { value: mode } }),
      ),
    );
    if (type) blockSelect.value = type.blockMode || "each";
    blockSelect.disabled = blockOff;

    // Пустые места отсеиваются: «Сменить тип» появляется только при выделенной
    // метке, а replaceChildren на null вставил бы в панель слово «null».
    const parts = [
      uiEl("p", { class: "tools__label", text: strings.tools.type }),
      typeButton,
      selectedMark
        ? uiButton(text("tools.changeTypeOf", { label: labelOf(state.project, selectedMark.id) }), {
            class: "ui-btn ui-btn--wide",
            title: strings.tools.changeTypeHint,
            on: { click: () => changeSelectedType() },
          })
        : null,
      uiEl("p", { class: "tools__label", text: strings.tools.mode }),
      modeRow,
      uiEl("p", { class: "tools__note", text: modeNote }),
      uiEl("p", { class: "tools__label" + (blockOff ? " tools__label--off" : ""), text: strings.tools.block }),
      blockSelect,
    ];
    box.replaceChildren(...parts.filter(Boolean));
  }

  subscribe((state, changed) => {
    if (
      "project" in changed ||
      "activeTypeId" in changed ||
      "mode" in changed ||
      "selectedMarkIds" in changed ||
      "schemeId" in changed
    ) {
      render();
    }
  });
  onHistoryChange(render);
  render();
}

// Раздел «Размеры»: размер меток и подписей, масштаб плана.
function mountSizesPanel(host, api) {
  const { getState, setState, subscribe } = api;
  const box = uiEl("div", { class: "tools" });
  host.replaceChildren(box);
  // Снимок объекта на время жеста ползунка: пока он есть, раздел не
  // перерисовывается — иначе ползунок исчезал бы из-под пальца.
  let sizeBefore = null;

  function setSize(key, value) {
    const state = getState();
    if (!state.project) return;
    if (!sizeBefore) sizeBefore = state.project;
    setState({ project: updateProject(state.project, { view: { ...state.project.view, [key]: value } }).project });
  }

  // Конец жеста: один шаг истории на всё перетаскивание ползунка.
  function commitSize() {
    if (!sizeBefore) return;
    const before = sizeBefore;
    sizeBefore = null;
    const after = getState().project;
    if (after !== before) canvasCommit(before, after, strings.history.viewSize);
    render();
  }

  function render() {
    const state = getState();
    const sizes = state.project ? state.project.view : { markSize: 10, labelSize: 12 };
    box.replaceChildren(
      uiEl("label", { class: "tools__field" }, [
        uiEl("span", { text: strings.tools.markSize }),
        toolsSlider(sizes.markSize, TOOLS_MARK_SIZE, (value) => setSize("markSize", value), commitSize),
      ]),
      uiEl("label", { class: "tools__field" }, [
        uiEl("span", { text: strings.tools.labelSize }),
        toolsSlider(sizes.labelSize, TOOLS_LABEL_SIZE, (value) => setSize("labelSize", value), commitSize),
      ]),
      // Линейка и направляющие прячутся целиком, не удаляясь: оснастка нужна,
      // пока целишься, и мешает, когда смотришь на план.
      uiEl("label", { class: "tools__field tools__field--check" }, [
        toolsGuidesCheck(state, setState),
        uiEl("span", { text: strings.tools.guides }),
      ]),
      uiEl("p", { class: "tools__label", text: strings.tools.zoom }),
      uiEl("div", { class: "tools__row" }, [
        uiIconButton("minus", { title: strings.tools.zoomOut, on: { click: () => canvasZoomBy(1 / 1.25) } }),
        uiIconButton("plus", { title: strings.tools.zoomIn, on: { click: () => canvasZoomBy(1.25) } }),
        uiButton(strings.tools.zoomFit, { on: { click: () => canvasFitPlan() } }),
        uiButton(strings.tools.zoomReset, { on: { click: () => canvasZoomReset() } }),
      ]),
    );
  }

  subscribe((state, changed) => {
    if (sizeBefore) return;
    if ("project" in changed || "guidesShown" in changed) render();
  });
  render();
}

// Отмена — в шапке: она возвращает не только метки, но и помещения, схемы и
// справочник, и в разделе «Метки» обещала меньше, чем делает. В режиме
// просмотра её нет вовсе: отменять там нечего.
function mountHistoryPanel(host, api) {
  const { getState, subscribe } = api;
  // Значки вместо слов: в шапке рядом с ними живут объект, поиск, выгрузка и
  // файл, и два слова забирали место у того, что словами не скажешь. Что
  // именно отменится — в подсказке, она же называет горячую клавишу.
  const undoButton = uiIconButton("undo", {
    label: strings.tools.undo,
    on: { click: () => canvasUndoStep() },
  });
  const redoButton = uiIconButton("redo", {
    label: strings.tools.redo,
    on: { click: () => canvasRedoStep() },
  });
  host.replaceChildren(uiEl("div", { class: "history-actions" }, [undoButton, redoButton]));

  function render() {
    const shown = layoutAllows("undo", getState().layout);
    host.hidden = !shown;
    if (!shown) return;
    undoButton.disabled = !canUndo();
    redoButton.disabled = !canRedo();
    // Отменять нечего — называть нечего: подсказка остаётся действием и
    // клавишей, без двоеточия в пустоту.
    const undoWhat = undoLabel();
    const redoWhat = redoLabel();
    undoButton.title = undoWhat ? text("tools.undoTitle", { label: undoWhat }) : strings.tools.undoTitlePlain;
    redoButton.title = redoWhat ? text("tools.redoTitle", { label: redoWhat }) : strings.tools.redoTitlePlain;
  }

  subscribe((state, changed) => {
    if ("layout" in changed) render();
  });
  onHistoryChange(render);
  render();
}

registerPanel(PANEL_IDS.tools, mountToolsPanel);
registerPanel(PANEL_IDS.headerHistory, mountHistoryPanel);
registerPanel(PANEL_IDS.sizes, mountSizesPanel);

// src/panels/warnings.js
// Предупреждения объекта: всё, что нашёл `model.validate`, одним списком со
// счётчиком в шапке.
//
// До этого таска `validate` считался и выбрасывался: повторы номеров,
// потерянные связи и типы со смешанными метками никто не видел. Панель их
// показывает и приводит к виновнику на плане — но не правит: решение за
// пользователем, и «починить всё» здесь нет и не будет.
//
// Строку можно закрыть крестиком «так и задумано»: повтор номера бывает
// приёмом, и программа обязана запомнить ответ. Запоминает его модель —
// `acceptProblem` кладёт запись в сам объект, а не в настройки браузера, —
// панель только показывает крестик и строку «Принято: N», из которой принятое
// возвращается в работу.
//
// Здесь же живут вопросы о виде типа, которые до этого задавало модальное
// окно при открытии объекта (таск 46). На слабо размеченном объекте это была
// простыня на полтора десятка строк поверх плана; строкой панели тот же вопрос
// ждёт, пока до него дойдут руки. Отметка «разобрано» как была в объекте
// (`type.kindGuessed`), так и осталась: она уезжает вместе с файлом.





// Подводит холст к метке — тем же занят поиск в шапке и список меток.

// Переключатель вида типа — тот же, что в справочнике: два вида, две кнопки.

// Кто виновник предупреждения. Код проблемы знает только `ref`, а что это за
// идентификатор — знание здесь: в модели ссылка нарочно без типа, чтобы
// `validate` оставался таблицей правил, а не картой интерфейса.
const WARNING_TARGETS = {
  duplicateCode: "type",
  typeWithoutCategory: "type",
  counterBehind: "type",
  typeKindMixed: "type",
  markWithoutType: "mark",
  markWithoutScheme: "mark",
  markWithoutRoom: "mark",
  emptyPoints: "mark",
  shortLine: "mark",
  controlsMissing: "mark",
  repeatedNumber: "mark",
  outlineWithoutScheme: "outline",
  outlineWithoutRoom: "outline",
  shortOutline: "outline",
  placementWithoutEquipment: "placement",
  placementWithoutMark: "placement",
  placementLinkMissing: "placement",
  smallGroup: "group",
  groupAcrossSchemes: "group",
};

// Ошибки сверху, вопросы о виде снизу: сперва то, что сломано, потом то, что
// сделано намеренно, и только потом то, о чём спрашивают.
const WARNING_LEVELS = ["error", "warning", "ask"];

function warningMarkPlace(project, markId) {
  const mark = markId ? findMark(project, markId) : null;
  if (!mark) return null;
  const point = Array.isArray(mark.points) && mark.points.length > 0 ? mark.points[0] : null;
  return { markId: mark.id, schemeId: mark.schemeId || null, typeId: mark.typeId || null, point };
}

// Тип: виновник — сам тип, но смотреть пользователю на метки. У смешанного
// типа ведём к метке не того вида: она и есть то, о чём предупреждение.
function warningTypePlace(project, typeId, code) {
  const type = findType(project, typeId);
  if (!type) return null;
  const kind = typeKindOf(project, typeId);
  const marks = project.marks.filter((mark) => mark.typeId === typeId);
  const wrong = code === "typeKindMixed" ? marks.find((mark) => mark.kind !== kind) : null;
  const place = warningMarkPlace(project, (wrong || marks[0] || {}).id);
  return { markId: null, schemeId: null, point: null, ...(place || {}), typeId };
}

/**
 * Где искать виновника предупреждения: метка, тип, контур и схема, на которой
 * это лежит. Чистая функция — по ней и проверяется, что переход ведёт куда
 * надо. `null` — перехода нет (виновник уже не существует).
 */
function warningPlace(project, problem) {
  if (!project || !problem || !problem.ref) return null;
  const target = WARNING_TARGETS[problem.code];
  if (target === "mark") return warningMarkPlace(project, problem.ref);
  if (target === "type") return warningTypePlace(project, problem.ref, problem.code);
  if (target === "group") {
    const group = findGroup(project, problem.ref);
    if (!group) return null;
    const first = (group.markIds || []).map((id) => warningMarkPlace(project, id)).find(Boolean);
    return first || null;
  }
  if (target === "outline") {
    const outline = findOutline(project, problem.ref);
    if (!outline) return null;
    const points = Array.isArray(outline.points) ? outline.points : [];
    return {
      markId: null,
      typeId: null,
      outlineId: outline.id,
      schemeId: outline.schemeId || null,
      point: points.length > 0 ? points[0] : null,
    };
  }
  if (target === "placement") {
    const placement = findPlacement(project, problem.ref);
    return placement ? warningMarkPlace(project, placement.markId) : null;
  }
  return null;
}

// Где это на объекте. Помещение — всегда, когда оно у метки есть; схему
// называем, только если планов больше одного: на объекте с единственным планом
// это слово в каждой строке и ни одного ответа.
function warningWhere(project, place) {
  if (!project || !place) return "";
  const mark = place.markId ? findMark(project, place.markId) : null;
  const room = mark && mark.roomId ? findRoom(project, mark.roomId) : null;
  const scheme = place.schemeId ? findScheme(project, place.schemeId) : null;
  const parts = [];
  if (room) parts.push(room.name);
  if (scheme && project.schemes.length > 1) parts.push(scheme.name);
  return parts.join(" · ");
}

/**
 * Список для панели: группы одинаковых предупреждений, внутри — по одной
 * строке на случай. Чистая функция от объекта — её и считает панель, один раз
 * на правку объекта, а не на кадр отрисовки.
 *
 * `{ total, level, groups: [{ key, code, level, title, count, items }], accepted }`
 *
 * Принятое («так и задумано») в группы не попадает и в `total` не считается:
 * счётчик в шапке показывает то, что ещё ждёт ответа. Сами ответы — списком
 * `accepted`, из него их и возвращают в работу.
 */
function warningsModel(project) {
  if (!project) return { total: 0, level: "ok", groups: [], accepted: [] };
  const byCode = new Map();
  for (const problem of validate(project)) {
    // Принятое не показывается вовсе — и не пересчитывается заново: ключ
    // принятия нарочно не знает, сколько меток под предупреждением, иначе
    // четвёртый светильник в группе вернул бы уже закрытую строку.
    if (problemAccepted(project, problem.key)) continue;
    const level = problem.kind === "warning" ? "warning" : "error";
    const key = level + ":" + problem.code;
    if (!byCode.has(key)) byCode.set(key, { key, code: problem.code, level, items: [] });
    const group = byCode.get(key);
    const place = warningPlace(project, problem);
    group.items.push({
      key: key + ":" + (problem.ref || group.items.length),
      code: problem.code,
      level,
      message: problem.message,
      // Сама проблема — ею и принимают: в ней ключ, вид и текст, который
      // пользователь видел, когда отвечал «так и задумано».
      problem,
      place,
      where: warningWhere(project, place),
    });
  }
  const groups = [...byCode.values()]
    .sort((a, b) => WARNING_LEVELS.indexOf(a.level) - WARNING_LEVELS.indexOf(b.level))
    .map((group) => ({
      ...group,
      count: group.items.length,
      title: text("warnings.groups." + group.code, { count: group.items.length }),
    }));

  // Вопросы о виде — отдельной группой в конце: это не поломка объекта, а
  // ответ, которого ждут от пользователя.
  const kinds = typeKindReview(project);
  if (kinds.length > 0) {
    groups.push({
      key: "ask:typeKind",
      code: "typeKind",
      level: "ask",
      count: kinds.length,
      title: text("warnings.kindGroup", { count: kinds.length }),
      items: kinds.map((row) => ({
        key: "ask:typeKind:" + row.typeId,
        code: "typeKind",
        level: "ask",
        typeId: row.typeId,
        typeCode: row.code,
        typeName: row.name,
        kind: typeKindOf(project, row.typeId),
        message: row.reason === "mixed" ? strings.warnings.kindMixed : strings.warnings.kindNoMarks,
        place: warningTypePlace(project, row.typeId, "typeKind"),
      })),
    });
  }

  const total = groups.reduce((sum, group) => sum + group.count, 0);
  // Принятые ошибки видно отдельно от принятых предупреждений: «принял и
  // забыл» не должно навсегда спрятать порванную связь.
  const accepted = acceptedProblems(project).map((record) => ({
    ...record,
    level: record.kind === "warning" ? "warning" : "error",
  }));
  return { total, level: total === 0 ? "ok" : groups[0].level, groups, accepted };
}

function mountWarningsPanel(host, api) {
  const { getState, setState, subscribe, notify } = api;
  let model = warningsModel(null);
  let open = false;
  // Раскрытые группы помнятся по ключу: правка объекта не должна схлопывать
  // список, который пользователь только что раскрыл.
  const expanded = new Set();
  // Метка, к которой ведём: картинка новой схемы приходит не мгновенно, и
  // холст вписывает план, когда её дождётся, — тогда центрируем ещё раз.
  let pending = null;

  const count = uiEl("span", { class: "warnings__count" });
  const toggle = uiIconButton("warning", {
    class: "ui-btn warnings__toggle",
    label: strings.warnings.open,
    title: strings.warnings.openHint,
    on: { click: () => setOpen(!open) },
  });
  toggle.setAttribute("aria-expanded", "false");
  const drop = uiEl("div", { class: "warnings__drop" });
  drop.hidden = true;
  host.replaceChildren(toggle, drop);

  function setOpen(value) {
    open = Boolean(value);
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    drop.hidden = !open;
    if (open) renderDrop();
    else drop.replaceChildren();
  }

  // ——— переход к виновнику ————————————————————————————————————————————

  function center(place) {
    const state = getState();
    if (!place || !place.point || !place.schemeId || state.schemeId !== place.schemeId) return false;
    const scheme = findScheme(state.project, place.schemeId);
    if (!scheme) return false;
    setState({ view: marksCenteredView(scheme, { points: [place.point] }, state.view) });
    return true;
  }

  function jump(place) {
    if (!place) return;
    const state = getState();
    if (!state.project) return;
    const patch = {};
    if (place.markId) {
      patch.selectedMarkIds = [place.markId];
      patch.selectedOutlineId = null;
    } else if (place.outlineId) {
      patch.selectedOutlineId = place.outlineId;
      patch.selectedMarkIds = [];
    }
    // Тип виновника делается выбранным: следующая правка в панели инструментов
    // и в справочнике окажется про него.
    if (place.typeId) patch.activeTypeId = place.typeId;
    if (place.schemeId && state.schemeId !== place.schemeId) patch.schemeId = place.schemeId;
    setState(patch);
    // Список закрывается: он занимает середину экрана, а подведённая метка
    // оказалась бы ровно под ним. Открыть его снова — один клик по счётчику,
    // и он на прежнем месте.
    setOpen(false);
    pending = place;
    queueMicrotask(() => {
      if (pending === place && center(place)) pending = null;
    });
  }

  // ——— правка вида типа ————————————————————————————————————————————————

  function setKind(typeId, kind) {
    const project = getState().project;
    if (!project) return;
    try {
      canvasCommit(project, updateType(project, typeId, { kind }).project, strings.history.typeKind);
    } catch (error) {
      notify(error && error.message ? error.message : String(error), "error");
    }
  }

  // ——— «так и задумано» ————————————————————————————————————————————————
  //
  // Принятие — правка объекта: `canvasCommit`, шаг истории, Ctrl+Z. Ответ
  // ложится в сам объект и уезжает с файлом; в настройках браузера ему делать
  // нечего — файл откроют на другой машине и вторым человеком.

  function accept(problem) {
    const project = getState().project;
    if (!project) return;
    const next = acceptProblem(project, problem).project;
    if (next === project) return;
    canvasCommit(project, next, strings.history.acceptProblem);
  }

  function unaccept(key) {
    const project = getState().project;
    if (!project) return;
    const next = unacceptProblem(project, key).project;
    if (next === project) return;
    canvasCommit(project, next, strings.history.unacceptProblem);
  }

  function dismissKinds() {
    const project = getState().project;
    if (!project) return;
    const cleared = closeTypeKindReview(project);
    if (cleared.project === project) return;
    canvasCommit(project, cleared.project, strings.history.typeKindReview);
  }

  // ——— отрисовка ————————————————————————————————————————————————————————

  function levelDot(level) {
    return uiEl("span", { class: "warnings__dot warnings__dot--" + level, attrs: { "aria-hidden": "true" } });
  }

  function problemRow(item) {
    const row = uiEl(
      "button",
      {
        class: "warnings__row warnings__row--" + item.level,
        type: "button",
        title: item.place ? strings.warnings.hint : item.message,
        on: { click: () => jump(item.place) },
      },
      [
        levelDot(item.level),
        uiEl("span", { class: "warnings__text", text: item.message }),
        // Где это на плане — второй строкой: «Р3» на объекте с тремя планами
        // глазами не находится, даже когда клик уже перенёс.
        item.where ? uiEl("span", { class: "warnings__where", text: item.where }) : null,
      ],
    );
    // Виновника уже нет — вести некуда, и обещать переход нечестно.
    row.disabled = !item.place;
    // Крестик — второй кнопкой рядом, а не внутри строки: кнопка в кнопке
    // разметкой не бывает, и клик по ней всё равно уходил бы в переход.
    // Принять можно и то, к чему уже некуда вести: ответ о самой проблеме.
    return uiEl("div", { class: "warnings__line" }, [
      row,
      uiIconButton("close", {
        class: "ui-btn warnings__accept",
        label: strings.warnings.accept,
        title: strings.warnings.acceptHint,
        on: { click: () => accept(item.problem) },
      }),
    ]);
  }

  // ——— принятое —————————————————————————————————————————————————————————

  // Строка принятого: текст — тот, который пользователь видел, когда отвечал.
  // Пересчитывать его нечем и незачем: виновника может уже не быть, а ответ
  // всё равно остаётся ответом.
  function acceptedRow(record) {
    return uiEl("div", { class: "warnings__line" }, [
      uiEl("div", { class: "warnings__row warnings__row--done warnings__row--" + record.level }, [
        levelDot(record.level),
        uiEl("span", { class: "warnings__text", text: record.label }),
        // Принятая ошибка помечена словами: точка уровня красная, но «принял и
        // забыл» не должно навсегда спрятать порванную связь.
        record.level === "error"
          ? uiEl("span", { class: "warnings__where", text: strings.warnings.acceptedError })
          : null,
      ]),
      uiIconButton("undo", {
        class: "ui-btn warnings__return",
        label: strings.warnings.acceptedReturn,
        title: strings.warnings.acceptedReturn,
        on: { click: () => unaccept(record.key) },
      }),
    ]);
  }

  // Строка «Принято: N» внизу панели. Свёрнута по умолчанию и раскрывается,
  // как группа предупреждений: без неё случайный крестик был бы необратим.
  function acceptedNode() {
    const key = "accepted";
    const isOpen = expanded.has(key);
    const body = uiEl("div", { class: "warnings__items" }, [
      uiEl("p", { class: "warnings__why warnings__kindHint", text: strings.warnings.acceptedHint }),
      ...model.accepted.map((record) => acceptedRow(record)),
    ]);
    body.hidden = !isOpen;
    const chevron = uiIcon("chevron");
    chevron.classList.add("warnings__chevron");
    const head = uiEl(
      "button",
      {
        class: "warnings__group warnings__row--accepted" + (isOpen ? " is-open" : ""),
        type: "button",
        title: isOpen ? strings.warnings.collapse : strings.warnings.expand,
        attrs: { "aria-expanded": isOpen ? "true" : "false" },
        on: {
          click: () => {
            if (expanded.has(key)) expanded.delete(key);
            else expanded.add(key);
            renderDrop();
          },
        },
      },
      [
        levelDot("accepted"),
        uiEl("span", {
          class: "warnings__text",
          text: text("warnings.acceptedGroup", { count: model.accepted.length }),
        }),
        chevron,
      ],
    );
    return uiEl("div", { class: "warnings__section" }, [head, body]);
  }

  // Строка вопроса о виде: сам вопрос ведёт к меткам типа, переключатель
  // отвечает на него. Ответ — команда справочника `updateType`, та же, что в
  // окне до этого таска: панель своей правки объекта не знает.
  function kindRow(item) {
    return uiEl("div", { class: "warnings__row warnings__row--ask warnings__row--kind" }, [
      uiEl(
        "button",
        {
          class: "warnings__jump",
          type: "button",
          title: strings.warnings.hint,
          on: { click: () => jump(item.place) },
        },
        [
          levelDot(item.level),
          uiEl("span", { class: "warnings__code", text: item.typeCode }),
          uiEl("span", { class: "warnings__text", text: item.typeName }),
          uiEl("span", { class: "warnings__why", text: item.message }),
        ],
      ),
      typesKindSwitch({
        kind: item.kind,
        // Выбранное руками — уже не догадка, и подтверждение того же вида тоже
        // ответ: строка уходит, отметка снимается с типа и уезжает в файл.
        allowSame: true,
        sameTitle: strings.warnings.kindConfirm,
        onPick: (value) => setKind(item.typeId, value),
      }),
    ]);
  }

  function groupNode(group) {
    const single = group.count === 1;
    const items = group.items.map((item) => (item.code === "typeKind" ? kindRow(item) : problemRow(item)));
    if (single && group.level !== "ask") return items[0];
    // Свёрнуто по умолчанию — в том числе вопросы о виде: полтора десятка
    // строк, развёрнутых самими собой, и были той простынёй, из-за которой
    // список уехал из модального окна сюда.
    const isOpen = expanded.has(group.key);
    const body = uiEl("div", { class: "warnings__items" }, items);
    body.hidden = !isOpen;
    const chevron = uiIcon("chevron");
    chevron.classList.add("warnings__chevron");
    const head = uiEl(
      "button",
      {
        class: "warnings__group warnings__row--" + group.level + (isOpen ? " is-open" : ""),
        type: "button",
        title: isOpen ? strings.warnings.collapse : strings.warnings.expand,
        attrs: { "aria-expanded": isOpen ? "true" : "false" },
        on: {
          click: () => {
            if (expanded.has(group.key)) expanded.delete(group.key);
            else expanded.add(group.key);
            renderDrop();
          },
        },
      },
      [levelDot(group.level), uiEl("span", { class: "warnings__text", text: group.title }), chevron],
    );
    // Вопросы о виде можно закрыть разом — тем же, чем их закрывала кнопка
    // «Понятно» в прежнем окне. Кнопка живёт внутри раскрытой группы: закрыть
    // разом то, чего не видел, — не ответ.
    if (group.level === "ask") {
      body.prepend(uiEl("p", { class: "warnings__why warnings__kindHint", text: strings.warnings.kindHint }));
      body.append(
        uiEl("div", { class: "warnings__foot" }, [
          uiButton(strings.warnings.kindAll, {
            title: strings.warnings.kindAllHint,
            on: { click: () => dismissKinds() },
          }),
        ]),
      );
    }
    return uiEl("div", { class: "warnings__section" }, [head, body]);
  }

  function renderDrop() {
    if (!open) return;
    // Список переписывается целиком на каждую правку объекта; место, до
    // которого пользователь долистал, при этом не теряется.
    const scroll = drop.scrollTop;
    renderDropBody();
    drop.scrollTop = scroll;
  }

  function renderDropBody() {
    // Принятое показывается и тогда, когда смотреть больше нечего: иначе
    // ответы «так и задумано» стали бы невидимыми, а вернуть их было бы нечем.
    const accepted = model.accepted.length > 0 ? acceptedNode() : null;
    if (model.total === 0) {
      const icon = uiIcon("ok");
      icon.classList.add("warnings__okIcon");
      drop.replaceChildren(
        uiEl("div", { class: "warnings__ok" }, [
          icon,
          uiEl("p", { class: "warnings__okTitle", text: strings.warnings.okTitle }),
          uiEl("p", { class: "warnings__why", text: strings.warnings.okText }),
        ]),
        ...(accepted ? [accepted] : []),
      );
      return;
    }
    drop.replaceChildren(
      uiEl("p", { class: "warnings__head", text: strings.warnings.title }),
      ...model.groups.map((group) => groupNode(group)),
      ...(accepted ? [accepted] : []),
      uiEl("p", { class: "warnings__why warnings__hint", text: strings.warnings.hint }),
    );
  }

  function renderToggle() {
    const level = model.level;
    toggle.classList.toggle("is-error", level === "error");
    toggle.classList.toggle("is-warning", level === "warning");
    toggle.classList.toggle("is-ask", level === "ask");
    toggle.classList.toggle("is-ok", level === "ok");
    const icon = uiIcon(level === "ok" ? "ok" : "warning");
    count.textContent = model.total > 0 ? String(model.total) : "";
    toggle.replaceChildren(icon, count);
    const label = model.total > 0 ? strings.warnings.open : strings.warnings.okLabel;
    toggle.setAttribute("aria-label", label);
    toggle.title = model.total > 0 ? strings.warnings.openHint : strings.warnings.okLabel;
  }

  // Пересчёт — только на смену объекта: на кадр отрисовки и на движение мыши
  // счётчик не реагирует, иначе он мигал бы на каждый ход.
  function refresh(state) {
    model = warningsModel(state.project);
    const shown = Boolean(state.project) && layoutAllows("warnings", state.layout);
    host.hidden = !shown;
    if (!shown && open) setOpen(false);
    renderToggle();
    if (open) renderDrop();
  }

  subscribe((state, changed) => {
    if ("project" in changed || "layout" in changed) refresh(state);
    // Картинка схемы доехала — холст вписал план и сбил наведение: повторяем.
    if ("schemeImage" in changed && pending && center(pending)) pending = null;
  });

  // Закрывается тем же, чем открывается: повторным нажатием, кликом мимо и
  // Escape. Диалогом панель не становится — клавиатура холста остаётся у
  // холста, пока список не открыт.
  document.addEventListener("pointerdown", (event) => {
    if (!open || host.contains(event.target)) return;
    setOpen(false);
  });
  document.addEventListener("keydown", (event) => {
    if (!open || event.key !== "Escape") return;
    // Пока открыт диалог, клавиатура принадлежит ему: Escape закрывает окно,
    // а не список под ним.
    if (uiDialogDepth() > 0) return;
    event.preventDefault();
    setOpen(false);
    toggle.focus();
  });

  refresh(getState());
}

registerPanel(PANEL_IDS.headerWarnings, mountWarningsPanel);
})();
    </script>
</body>
</html>
