// что превращается щелчок по галочке; сама панель собирается из них ниже.




// Порядок строк списка — порядок справочника: категории по своему order, типы
// внутри, метки по номеру. Тот же обход, что у легенды и таблиц.
function filtersMarkRows(project, schemeId, filter) {
  const scheme = project ? findScheme(project, schemeId) : null;
  if (!scheme) return [];
  const order = new Map();
  const categoryOf = new Map();
  let index = 0;
  for (const group of typesInOrder(project)) {
    for (const type of group.types) {
      order.set(type.id, index);
      categoryOf.set(type.id, group.category);
      index += 1;
    }
  }
  const last = index;
  return visibleMarks(project, scheme, filter)
    .map((mark) => ({
      mark,
      type: findType(project, mark.typeId),
      category: categoryOf.get(mark.typeId) || null,
      style: styleOf(project, mark.typeId),
      label: labelOf(project, mark.id),
    }))
    .sort((a, b) => {
      const orderA = order.has(a.mark.typeId) ? order.get(a.mark.typeId) : last;
      const orderB = order.has(b.mark.typeId) ? order.get(b.mark.typeId) : last;
      return orderA === orderB ? a.mark.number - b.mark.number : orderA - orderB;
    });
}

// Видимые типы — одно множество, из которого собираются оба поля фильтра.
// Галочка категории и галочка типа правят его, а `categoryIds`/`typeIds`
// пересчитываются заново: держать две независимые истины — значит рано или
// поздно показать метку, которую сняли галочкой, или наоборот.
function filtersTypeSet(project, filter) {
  const byType = filter && Array.isArray(filter.typeIds) ? new Set(filter.typeIds) : null;
  const byCategory = filter && Array.isArray(filter.categoryIds) ? new Set(filter.categoryIds) : null;
  const visible = new Set();
  for (const type of project.markTypes) {
    if (byType && !byType.has(type.id)) continue;
    if (byCategory && !byCategory.has(type.categoryId)) continue;
    visible.add(type.id);
  }
  return visible;
}

function filtersFromTypeSet(project, filter, visible) {
  const types = project.markTypes;
  const everyType = types.every((type) => visible.has(type.id));
  // Категория без типов — всегда отмечена: прятать в ней нечего.
  const categories = project.categories.filter((category) => {
    const own = types.filter((type) => type.categoryId === category.id);
    return own.length === 0 || own.some((type) => visible.has(type.id));
  });
  const everyCategory = categories.length === project.categories.length;
  return {
    ...(filter || {}),
    categoryIds: everyCategory ? null : categories.map((category) => category.id),
    typeIds: everyType ? null : types.filter((type) => visible.has(type.id)).map((type) => type.id),
  };
}
function filtersTypeChecked(project, filter, typeId) {
  return filtersTypeSet(project, filter).has(typeId);
}

// «on» — видны все типы категории, «off» — ни одного, «mixed» — часть.
function filtersCategoryChecked(project, filter, categoryId) {
  const visible = filtersTypeSet(project, filter);
  const own = project.markTypes.filter((type) => type.categoryId === categoryId);
  if (own.length === 0) return "on";
  const shown = own.filter((type) => visible.has(type.id)).length;
  if (shown === 0) return "off";
  return shown === own.length ? "on" : "mixed";
}
function filtersToggleType(project, filter, typeId, on) {
  const visible = filtersTypeSet(project, filter);
  if (on) visible.add(typeId);
  else visible.delete(typeId);
  return filtersFromTypeSet(project, filter, visible);
}
function filtersToggleCategory(project, filter, categoryId, on) {
  const visible = filtersTypeSet(project, filter);
  for (const type of project.markTypes) {
    if (type.categoryId !== categoryId) continue;
    if (on) visible.add(type.id);
    else visible.delete(type.id);
  }
  return filtersFromTypeSet(project, filter, visible);
}
function filtersSetAllTypes(project, filter, on) {
  const visible = new Set(on ? project.markTypes.map((type) => type.id) : []);
  return filtersFromTypeSet(project, filter, visible);
}
function filtersActive(filter) {
  if (!filter) return false;
  return Boolean(
    Array.isArray(filter.categoryIds) ||
      Array.isArray(filter.typeIds) ||
      filter.roomId ||
      (filter.query || "").trim(),
  );
}

// ——— панель фильтров ——————————————————————————————————————————————————

function filtersSignature(project) {
  if (!project) return "";
  return [
    project.categories.map((category) => [category.id, category.name, category.color, category.shape].join("~")).join("|"),
    project.markTypes.map((type) => [type.id, type.code, type.name, type.categoryId, type.shape].join("~")).join("|"),
    project.rooms.map((room) => [room.id, room.name].join("~")).join("|"),
  ].join("#");
}

// Дерево галочек перестраивается только при правке справочника: щелчок по
// галочке меняет фильтр, а не разметку панели — иначе чекбокс исчезал бы
// из-под курсора вместе с фокусом.
function filtersBox(api) {
  const { getState, setState, subscribe } = api;
  const node = uiEl("div", { class: "filters" });
  const search = uiEl("input", {
    class: "ui-input filters__search",
    type: "text",
    placeholder: strings.filters.searchPlaceholder,
    title: strings.filters.search,
    on: { input: () => patch({ query: search.value }) },
  });
  const rooms = uiEl("select", {
    class: "ui-select",
    title: strings.filters.room,
    on: { change: () => patch({ roomId: rooms.value || null }) },
  });
  const tree = uiEl("div", { class: "filters__tree" });
  const summary = uiEl("summary", { class: "filters__summary", text: strings.filters.types });
  const details = uiEl("details", { class: "filters__details" }, [summary, tree]);
  const reset = uiButton(strings.filters.showAll, {
    class: "ui-btn ui-btn--wide",
    on: {
      click: () => {
        const state = getState();
        setState({ filter: { ...filtersSetAllTypes(state.project, state.filter, true), roomId: null, query: "" } });
        search.value = "";
      },
    },
  });
  let signature = null;
  let checks = [];

  function patch(part) {
    const state = getState();
    setState({ filter: { ...state.filter, ...part } });
  }

  function toggle(state, next) {
    setState({ filter: { ...next, roomId: state.filter.roomId, query: state.filter.query } });
  }

  function buildTree(project) {
    checks = [];
    tree.replaceChildren();
    rooms.replaceChildren(uiEl("option", { value: "", text: strings.filters.allRooms }));
    for (const room of roomsInOrder(project)) {
      rooms.append(uiEl("option", { value: room.id, text: room.name }));
    }
    for (const { category, types } of project ? typesInOrder(project) : []) {
      const box = uiEl("input", { class: "filters__check", type: "checkbox" });
      box.addEventListener("change", () => {
        const state = getState();
        toggle(state, filtersToggleCategory(state.project, state.filter, category.id, box.checked));
      });
      checks.push({ box, kind: "category", id: category.id });
      const dot = uiEl("span", { class: "filters__dot" });
      dot.style.background = category.color;
      tree.append(
        uiEl("label", { class: "filters__category" }, [
          box,
          dot,
          uiEl("span", { class: "filters__name", text: category.name }),
        ]),
      );
      for (const type of types) {
        const typeBox = uiEl("input", { class: "filters__check", type: "checkbox" });
        typeBox.addEventListener("change", () => {
          const state = getState();
          toggle(state, filtersToggleType(state.project, state.filter, type.id, typeBox.checked));
        });
        checks.push({ box: typeBox, kind: "type", id: type.id });
        tree.append(
          uiEl("label", { class: "filters__type" }, [
            typeBox,
            uiEl("span", { class: "filters__code", text: type.code }),
            uiEl("span", { class: "filters__name", text: type.name }),
          ]),
        );
      }
    }
  }

  function syncChecks(state) {
    const project = state.project;
    if (!project) return;
    let hidden = 0;
    for (const item of checks) {
      if (item.kind === "category") {
        const mode = filtersCategoryChecked(project, state.filter, item.id);
        item.box.checked = mode !== "off";
        item.box.indeterminate = mode === "mixed";
      } else {
        const on = filtersTypeChecked(project, state.filter, item.id);
        item.box.checked = on;
        if (!on) hidden += 1;
      }
    }
    summary.textContent = hidden > 0
      ? strings.filters.types + " — " + text("filters.hidden", { count: hidden })
      : strings.filters.types;
    rooms.value = state.filter.roomId || "";
    if (search.value !== (state.filter.query || "") && document.activeElement !== search) {
      search.value = state.filter.query || "";
    }
    reset.disabled = !filtersActive(state.filter);
  }

  function render() {
    const state = getState();
    const next = filtersSignature(state.project);
    if (next !== signature) {
      signature = next;
      buildTree(state.project);
    }
    syncChecks(state);
  }

  node.replaceChildren(search, rooms, details, reset);
  subscribe((state, changed) => {
    if ("project" in changed || "filter" in changed) render();
  });
  render();
  return { node, render };
}

// src/panels/marks.js
// Список меток схемы: обозначение, помещение, расположение и обозначение из
// оригинального проекта — правятся прямо в строке.
//
// Почему список, а не карточка метки: заказчик заполняет «Расположение» и
// «В оригинальной схеме» не в момент постановки, а потом, разом, по списку.
// Поэтому правка здесь на месте, а отдельного окна у метки нет вовсе.








const MARKS_NEW_ROOM = "--new-room--";
// «По контуру» — метка отдана автоматике: помещение подставляется по контуру
// на схеме. Любой другой выбор в этом поле — ручная правка, и она главнее:
// такую метку автоматика больше не трогает.
const MARKS_AUTO_ROOM = "--auto-room--";

// Холст подводится к метке переводом координат из render.js: доли плана в
// пиксели экрана здесь руками не пересчитываются.
function marksCenteredView(scheme, mark, view) {
  const host = document.getElementById(PANEL_IDS.canvas);
  if (!host || !host.clientWidth || !host.clientHeight) return view;
  const local = planToScreen(mark.points[0], scheme, { ...view, offsetX: 0, offsetY: 0 });
  return { ...view, offsetX: host.clientWidth / 2 - local.x, offsetY: host.clientHeight / 2 - local.y };
}

function mountMarksPanel(host, api) {
  const { getState, setState, notify } = api;
  const filters = filtersBox(api);
  const list = uiEl("div", { class: "marks" });
  const count = uiEl("p", { class: "marks__count" });
  host.replaceChildren(filters.node, count, list);
  // Пока курсор стоит в текстовом поле строки, список не пересобирается: иначе
  // буква, набранная в «Расположении», выбрасывала бы фокус после каждой правки.
  // Поле поиска сюда не входит: оно живёт над списком, и набор в нём обязан
  // перестраивать список по ходу — ради этого он и набирается.
  let pending = false;
  let shownSelection = "";

  // Номер правится числовым полем — оно тоже держит список от пересборки,
  // иначе набранная цифра выбрасывала бы курсор из поля.
  function typing() {
    const active = document.activeElement;
    if (!active || !list.contains(active) || active.tagName !== "INPUT") return false;
    return active.type === "text" || active.type === "number";
  }

  function fail(error) {
    notify(error && error.message ? error.message : String(error), "error");
  }

  function selectMark(markId) {
    const state = getState();
    const scheme = state.project ? findScheme(state.project, state.schemeId) : null;
    const mark = state.project ? findMark(state.project, markId) : null;
    if (!scheme || !mark) return;
    setState({ selectedMarkIds: [markId], view: marksCenteredView(scheme, mark, state.view) });
  }

  function setField(markId, field, value) {
    const state = getState();
    const mark = state.project ? findMark(state.project, markId) : null;
    if (!mark) return;
    const next = value.trim();
    if ((mark[field] || "") === next) return;
    try {
      canvasCommit(state.project, updateMark(state.project, markId, { [field]: next }).project, strings.history.markField);
    } catch (error) {
      fail(error);
    }
  }

  // Номер метки ставится руками: несколько одинаковых светильников одной группы
  // носят один номер. Повтор модель разрешает и помечает предупреждением —
  // здесь он только доезжает до истории одним шагом отмены.
  function setNumber(markId, value) {
    const state = getState();
    const mark = state.project ? findMark(state.project, markId) : null;
    if (!mark) return;
    try {
      const next = setMarkNumber(state.project, markId, value);
      if (next.project === state.project) return;
      canvasCommit(state.project, next.project, strings.history.markNumber);
    } catch (error) {
      fail(error);
      render();
    }
  }

  // Комната заводится по ходу: новое название добавляется в справочник объекта
  // и тем же шагом истории проставляется метке.
  function setRoom(markId, name) {
    const state = getState();
    const mark = state.project ? findMark(state.project, markId) : null;
    if (!mark) return;
    try {
      const ensured = roomsEnsure(state.project, name);
      const roomId = ensured.room ? ensured.room.id : null;
      if (roomId === (mark.roomId || null) && markRoomManual(mark) && ensured.project === state.project) return;
      canvasCommit(
        state.project,
        updateMark(ensured.project, markId, { roomId, roomManual: true }).project,
        strings.history.markRoom,
      );
    } catch (error) {
      fail(error);
      render();
    }
  }

  // Возврат метки автоматике: снимаем признак ручной правки, а помещение
  // подставит по контуру canvasCommit — тем же шагом истории.
  function setAutoRoom(markId) {
    const state = getState();
    const mark = state.project ? findMark(state.project, markId) : null;
    if (!mark || !markRoomManual(mark)) return;
    try {
      canvasCommit(
        state.project,
        updateMark(state.project, markId, { roomManual: false }).project,
        strings.history.markRoomAuto,
      );
    } catch (error) {
      fail(error);
      render();
    }
  }

  async function askNewRoom(markId) {
    const name = await uiPrompt({ title: strings.rooms.newTitle, placeholder: strings.rooms.namePlaceholder });
    if (!name) {
      render();
      return;
    }
    setRoom(markId, name);
  }

  function roomField(state, mark) {
    const manual = markRoomManual(mark);
    const select = uiEl("select", {
      class: "ui-select marks__room" + (manual ? " is-manual" : ""),
      title: manual ? strings.marks.roomManual : strings.marks.roomAuto,
    });
    const auto = mark.roomId ? findRoom(state.project, mark.roomId) : null;
    select.append(
      uiEl("option", {
        value: MARKS_AUTO_ROOM,
        text: auto ? text("rooms.autoOf", { name: auto.name }) : strings.rooms.auto,
      }),
    );
    select.append(uiEl("option", { value: "", text: strings.rooms.none }));
    for (const room of roomsInOrder(state.project)) {
      select.append(uiEl("option", { value: room.id, text: room.name }));
    }
    select.append(uiEl("option", { value: MARKS_NEW_ROOM, text: strings.rooms.newRoom }));
    select.value = manual ? mark.roomId || "" : MARKS_AUTO_ROOM;
    select.addEventListener("change", () => {
      if (select.value === MARKS_NEW_ROOM) {
        askNewRoom(mark.id);
        return;
      }
      if (select.value === MARKS_AUTO_ROOM) {
        setAutoRoom(mark.id);
        return;
      }
      const room = select.value ? roomsInOrder(state.project).find((item) => item.id === select.value) : null;
      setRoom(mark.id, room ? room.name : "");
    });
    return select;
  }

  function markRow(state, row, selected, repeats) {
    const mark = row.mark;
    const repeat = repeats.get(mark.id) || 0;
    const node = uiEl("div", { class: "mark-row" + (selected ? " is-current" : ""), title: strings.marks.focus }, [
      uiEl("div", { class: "mark-row__head" }, [
        shapeIcon(row.style.shape, row.style.color, 20),
        uiEl("span", { class: "mark-row__label", text: row.type ? row.type.code : "?" }),
        uiEl("input", {
          class: "ui-input mark-row__number",
          type: "number",
          value: String(mark.number),
          title: strings.marks.number,
          attrs: { min: "1", max: String(MARK_NUMBER_MAX), step: "1" },
          on: { change: (event) => setNumber(mark.id, event.target.value) },
        }),
        repeat > 1
          ? uiEl("span", {
              class: "mark-row__repeat",
              text: text("marks.repeatBadge", { count: repeat }),
              title: text("problems.repeatedNumber", { label: row.label, count: repeat }),
            })
          : null,
        uiEl("span", { class: "mark-row__type", text: row.type ? row.type.name : "" }),
      ]),
      roomField(state, mark),
      uiEl("input", {
        class: "ui-input",
        type: "text",
        value: mark.location || "",
        placeholder: strings.marks.locationPlaceholder,
        title: strings.marks.location,
        on: { change: (event) => setField(mark.id, "location", event.target.value) },
      }),
      uiEl("input", {
        class: "ui-input",
        type: "text",
        value: mark.original || "",
        placeholder: strings.marks.originalPlaceholder,
        title: strings.marks.original,
        on: { change: (event) => setField(mark.id, "original", event.target.value) },
      }),
    ]);
    node.addEventListener("pointerdown", (event) => {
      if (event.target.closest("input, select, button, option")) return;
      selectMark(mark.id);
    });
    return node;
  }

  function render() {
    pending = false;
    const state = getState();
    if (!state.project || !state.schemeId) {
      count.textContent = "";
      list.replaceChildren(uiEl("p", { class: "panel__empty", text: strings.panels.canvasEmpty }));
      return;
    }
    const rows = filtersMarkRows(state.project, state.schemeId, state.filter);
    const total = state.project.marks.filter((mark) => mark.schemeId === state.schemeId).length;
    count.textContent = total > 0 ? text("marks.count", { shown: rows.length, total }) : "";
    if (rows.length === 0) {
      list.replaceChildren(
        uiEl("p", { class: "panel__empty", text: total > 0 ? strings.marks.nothingFound : strings.panels.marksEmpty }),
      );
      return;
    }
    const selected = new Set(state.selectedMarkIds);
    // Повтор номера ищется по всему объекту, а не по видимым строкам: два Т1 на
    // разных схемах — такой же повтор, и предупредить о нём надо в обеих.
    const repeats = new Map();
    for (const item of repeatedNumbers(state.project)) {
      for (const markId of item.markIds) repeats.set(markId, item.count);
    }
    list.replaceChildren(...rows.map((row) => markRow(state, row, selected.has(row.mark.id), repeats)));
    // Подводим список к выделенной строке только когда выделение сменилось:
    // иначе правка поля в одной строке уводила бы список к другой.
    const selection = state.selectedMarkIds.join(",");
    const current = list.querySelector(".mark-row.is-current");
    if (current && selection !== shownSelection) current.scrollIntoView({ block: "nearest" });
    shownSelection = selection;
  }

  // Отложенная перерисовка: то, что накопилось, пока пользователь печатал.
  host.addEventListener("focusout", () => {
    if (!pending) return;
    setTimeout(() => {
      if (!typing()) render();
    }, 0);
  });
  api.subscribe((state, changed) => {
    if (!("project" in changed || "schemeId" in changed || "filter" in changed || "selectedMarkIds" in changed)) return;
    if (typing()) {
      pending = true;
      return;
    }
    render();
  });
  render();
}

registerPanel(PANEL_IDS.marks, mountMarksPanel);

// src/panels/schemes.js
// Схемы объекта: список, загрузка плана кнопкой и перетаскиванием, поворот
// и обрезка, переименование, порядок, удаление.
// Холст рисует другой модуль — сюда он приходит только за картинкой:
// подготовленный план и его размер кладутся в состояние сеанса (`schemeImage`).







// Рамка меньше этой доли считается промахом мыши, а не обрезкой.
const PLAN_FRAME_MIN = 0.02;

function planNameFromFile(file, project) {
  const raw = String((file && file.name) || "").replace(/\.[^.]+$/, "").trim();
  if (raw) return raw.slice(0, 60);
  return text("schemes.defaultName", { number: project.schemes.length + 1 });
}

// Метка держит доли плана: одно накопленное преобразование двигает и их,
// иначе метки уедут с тех мест, куда их поставил инженер.
function remapMarkForTransform(mark, transform) {
  return {
    points: transformMarkPoints(mark.points || [], transform),
    labelOffset: mark.labelOffset ? transformOffset(mark.labelOffset, transform) : null,
  };
}

function marksPushedOutside(marks, transform) {
  return marks.filter((mark) => countPointsOutside(mark.points || [], transform) > 0).length;
}

// Диалог правки плана. Повороты и рамки копятся в одно преобразование и
// применяются к исходнику: JPEG пережимается один раз, сколько бы шагов ни
// сделал пользователь. `beforeApply` — последнее слово вызывающего перед
// применением (например, спросить про метки, которые вынесет за рамку).
function openPlanEditor({ blob, width, height, title, beforeApply }) {
  return new Promise((resolve) => {
    let transform = identityTransform();
    let preview = { blob, width, height };
    let url = URL.createObjectURL(blob);
    let frame = null;
    let busy = false;
    let modal = null;

    const image = uiEl("img", { class: "plan-stage__img", attrs: { src: url, alt: "" } });
    const box = uiEl("div", { class: "plan-frame" });
    box.hidden = true;
    const stage = uiEl("div", { class: "plan-stage" }, [image, box]);
    const hint = uiEl("p", { class: "modal__hint", text: strings.image.cropHint });

    const rotateLeft = uiButton("⟲", {
      title: strings.image.rotateLeft,
      on: { click: () => apply(rotateTransform(transform, -90)) },
    });
    const rotateRight = uiButton("⟳", {
      title: strings.image.rotateRight,
      on: { click: () => apply(rotateTransform(transform, 90)) },
    });
    const cropButton = uiButton(strings.image.crop, {
      on: { click: () => apply(cropTransform(transform, frame)) },
    });
    const resetButton = uiButton(strings.image.cropReset, { on: { click: () => setFrame(null) } });
    const cancelButton = uiButton(strings.dialog.cancel, { on: { click: () => finish(null) } });
    const applyButton = uiButton(strings.image.apply, {
      class: "ui-btn ui-btn--accent",
      on: { click: () => requestApply() },
    });

    function setFrame(next) {
      frame = next;
      box.hidden = !next;
      cropButton.disabled = !next || busy;
      resetButton.disabled = !next || busy;
      if (!next) return;
      const rect = image.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      box.style.left = rect.left - stageRect.left + next.x * rect.width + "px";
      box.style.top = rect.top - stageRect.top + next.y * rect.height + "px";
      box.style.width = next.width * rect.width + "px";
      box.style.height = next.height * rect.height + "px";
    }

    function setBusy(value) {
      busy = value;
      for (const button of [rotateLeft, rotateRight, applyButton, cancelButton]) button.disabled = value;
      cropButton.disabled = value || !frame;
      resetButton.disabled = value || !frame;
      hint.textContent = value ? strings.image.working : strings.image.cropHint;
    }

    // Предпросмотр всегда пересобирается из исходника по накопленному
    // преобразованию — что видно, то и получится, без цепочки пережатий.
    async function apply(next) {
      if (busy) return;
      setBusy(true);
      try {
        const result = await renderPlanImage(blob, next);
        URL.revokeObjectURL(url);
        preview = result;
        transform = next;
        url = URL.createObjectURL(result.blob);
        image.src = url;
        setFrame(null);
        setBusy(false);
      } catch (error) {
        setBusy(false);
        finish(null);
      }
    }

    async function requestApply() {
      if (busy) return;
      // Спрашиваем всегда, а не только после правки: замене подложки важен
      // итоговый размер, даже когда картинку не крутили.
      if (beforeApply) {
        setBusy(true);
        const agreed = await beforeApply(transform, { width: preview.width, height: preview.height });
        setBusy(false);
        if (!agreed) return;
      }
      finish({ blob: preview.blob, width: preview.width, height: preview.height, transform });
    }

    function finish(result) {
      URL.revokeObjectURL(url);
      if (modal) modal.close();
      resolve(result);
    }

    // Рамка тянется мышью прямо по картинке.
    stage.addEventListener("pointerdown", (event) => {
      if (busy || event.button !== 0) return;
      const rect = image.getBoundingClientRect();
      const startX = Math.min(Math.max(event.clientX, rect.left), rect.right);
      const startY = Math.min(Math.max(event.clientY, rect.top), rect.bottom);
      const move = (moveEvent) => {
        const x = Math.min(Math.max(moveEvent.clientX, rect.left), rect.right);
        const y = Math.min(Math.max(moveEvent.clientY, rect.top), rect.bottom);
        setFrame({
          x: (Math.min(startX, x) - rect.left) / rect.width,
          y: (Math.min(startY, y) - rect.top) / rect.height,
          width: Math.abs(x - startX) / rect.width,
          height: Math.abs(y - startY) / rect.height,
        });
      };
      const up = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        if (frame && (frame.width < PLAN_FRAME_MIN || frame.height < PLAN_FRAME_MIN)) setFrame(null);
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
      event.preventDefault();
    });

    modal = uiModal({
      title: title || strings.image.editTitle,
      body: uiEl("div", { class: "plan-editor" }, [
        uiEl("div", { class: "plan-editor__tools" }, [rotateLeft, rotateRight, cropButton, resetButton]),
        stage,
        hint,
      ]),
      actions: [cancelButton, applyButton],
      onCancel: () => {
        URL.revokeObjectURL(url);
        resolve(null);
      },
    });
    setFrame(null);
  });
}

function mountSchemesPanel(host, api) {
  const { getState, setState, notify, subscribe } = api;
  let decoded = null;
  let imageToken = 0;

  const list = uiEl("div", { class: "scheme-list" });
  const fileInput = uiEl("input", {
    class: "scheme-file",
    type: "file",
    attrs: { accept: "image/png,image/jpeg,.png,.jpg,.jpeg" },
    on: {
      change: async () => {
        const file = fileInput.files && fileInput.files[0];
        fileInput.value = "";
        if (file) await addPlanFromFile(file);
      },
    },
  });
  fileInput.hidden = true;
  let replaceTarget = null;
  const replaceInput = uiEl("input", {
    class: "scheme-file",
    type: "file",
    attrs: { accept: "image/png,image/jpeg,.png,.jpg,.jpeg" },
    on: {
      change: async () => {
        const file = replaceInput.files && replaceInput.files[0];
        const schemeId = replaceTarget;
        replaceInput.value = "";
        replaceTarget = null;
        if (file && schemeId) await replacePlanFromFile(schemeId, file);
      },
    },
  });
  replaceInput.hidden = true;
  const addButton = uiButton(strings.schemes.add, {
    class: "ui-btn ui-btn--accent ui-btn--wide",
    on: { click: () => fileInput.click() },
  });
  const hint = uiEl("p", { class: "panel__empty", text: strings.schemes.addHint });
  host.replaceChildren(addButton, fileInput, replaceInput, list, hint);

  function render() {
    const state = getState();
    const project = state.project;
    list.replaceChildren();
    addButton.disabled = !project;
    if (!project || project.schemes.length === 0) {
      hint.textContent = project ? strings.schemes.addHint : strings.projects.empty;
      return;
    }
    hint.textContent = "";
    const ordered = schemesInOrder(project);
    ordered.forEach((scheme, index) => {
      const marks = project.marks.filter((mark) => mark.schemeId === scheme.id).length;
      const row = uiEl("div", {
        class: "scheme-row" + (scheme.id === state.schemeId ? " scheme-row--current" : ""),
      });
      row.append(
        uiEl("button", {
          class: "scheme-row__name",
          type: "button",
          text: scheme.name,
          title: scheme.name,
          on: { click: () => setState({ schemeId: scheme.id, selectedMarkIds: [] }) },
        }),
        uiEl("span", {
          class: "scheme-row__meta",
          text: scheme.imageId
            ? text("schemes.size", { width: scheme.width, height: scheme.height })
            : strings.schemes.noImage,
        }),
        uiEl("div", { class: "scheme-row__tools" }, [
          uiButton("✂", { title: strings.schemes.edit, on: { click: () => editPlan(scheme.id) } }),
          uiButton("⇄", {
            title: strings.schemes.replace,
            on: {
              click: () => {
                replaceTarget = scheme.id;
                replaceInput.click();
              },
            },
          }),
          uiButton("✎", { title: strings.schemes.rename, on: { click: () => renameScheme(scheme.id) } }),
          uiButton("↑", {
            title: strings.schemes.up,
            attrs: index === 0 ? { disabled: "disabled" } : {},
            on: { click: () => moveScheme(scheme.id, -1) },
          }),
          uiButton("↓", {
            title: strings.schemes.down,
            attrs: index === ordered.length - 1 ? { disabled: "disabled" } : {},
            on: { click: () => moveScheme(scheme.id, 1) },
          }),
          uiButton("🗑", {
            class: "ui-btn ui-btn--danger",
            title: strings.schemes.remove,
            on: { click: () => removeScheme(scheme.id, marks) },
          }),
        ]),
      );
      list.append(row);
    });
  }

  // Новый план: проверка файла, правка картинки, только потом запись.
  async function addPlanFromFile(file) {
    const state = getState();
    if (!state.project) return;
    if (!isPlanImageFile(file)) {
      notify(strings.image.wrongType, "error");
      return;
    }
    let plan;
    hint.textContent = strings.schemes.loading;
    addButton.disabled = true;
    try {
      plan = await readPlanImage(file);
    } catch (error) {
      notify(strings.image.broken, "error");
      return;
    } finally {
      addButton.disabled = false;
      render();
    }
    const edited = await openPlanEditor({
      blob: plan.blob,
      width: plan.width,
      height: plan.height,
      title: strings.image.editTitle,
    });
    if (!edited) return;
    const imageId = await putImage(edited.blob);
    const fresh = getState().project;
    const added = addScheme(fresh, {
      name: planNameFromFile(file, fresh),
      imageId,
      width: edited.width,
      height: edited.height,
    });
    setState({ project: added.project, schemeId: added.scheme.id, selectedMarkIds: [] });
    notify(text("schemes.added", { name: added.scheme.name }), "success");
  }

  // Правка уже загруженного плана: метки пересчитываются тем же преобразованием.
  // Про метки, которые уедут за рамку, спрашиваем до применения — потом
  // прежних мест уже не вернуть.
  async function editPlan(schemeId) {
    const project = getState().project;
    const scheme = findScheme(project, schemeId);
    if (!scheme || !scheme.imageId) return;
    const blob = await getImage(scheme.imageId);
    if (!blob) {
      notify(strings.image.broken, "error");
      return;
    }
    const marksOfScheme = project.marks.filter((mark) => mark.schemeId === schemeId);
    const edited = await openPlanEditor({
      blob,
      width: scheme.width,
      height: scheme.height,
      title: scheme.name,
      beforeApply: async (transform) => {
        const count = marksPushedOutside(marksOfScheme, transform);
        if (count === 0) return true;
        return uiConfirm({
          title: strings.image.outsideTitle,
          message: text("image.marksOutsideAsk", { count }),
          confirmLabel: strings.image.cropAnyway,
        });
      },
    });
    if (!edited || isIdentityTransform(edited.transform)) return;
    const imageId = await putImage(edited.blob);
    let next = updateScheme(getState().project, schemeId, {
      imageId,
      width: edited.width,
      height: edited.height,
    }).project;
    const moved = next.marks.filter((mark) => mark.schemeId === schemeId);
    const pushed = marksPushedOutside(moved, edited.transform);
    for (const mark of moved) {
      const patch = remapMarkForTransform(mark, edited.transform);
      next = updateMark(next, mark.id, patch.labelOffset ? patch : { points: patch.points }).project;
    }
    await deleteImage(scheme.imageId);
    setState({ project: next, schemeImage: null });
    notify(pushed === 0 ? strings.image.applied : text("image.appliedClamped", { count: pushed }), "success");
  }

  // Замена подложки: картинка другая, разметка остаётся вся. Координаты — доли
  // плана, поэтому при той же пропорции всё встаёт само; при другой разметка
  // поедет, и об этом спрашивают до применения, а не показывают кашу после.
  // Прежнее преобразование не переносится: поворот и обрезка запечены в старой
  // картинке, самого преобразования нигде нет. Новый файл правится тем же
  // редактором и теми же руками — с предпросмотром, а не вслепую.
  async function replacePlanFromFile(schemeId, file) {
    const scheme = findScheme(getState().project, schemeId);
    if (!scheme) return;
    if (!isPlanImageFile(file)) {
      notify(strings.image.wrongType, "error");
      return;
    }
    let plan;
    try {
      plan = await readPlanImage(file);
    } catch (error) {
      notify(strings.image.broken, "error");
      return;
    }
    const wasSize = { width: scheme.width, height: scheme.height };
    const edited = await openPlanEditor({
      blob: plan.blob,
      width: plan.width,
      height: plan.height,
      title: text("image.replaceTitle", { name: scheme.name }),
      beforeApply: async (transform, size) => {
        if (sameAspect(wasSize, size)) return true;
        return uiConfirm({
          title: strings.image.aspectTitle,
          message: text("image.aspectAsk", {
            before: text("schemes.size", { width: wasSize.width, height: wasSize.height }),
            after: text("schemes.size", { width: size.width, height: size.height }),
          }),
          confirmLabel: strings.image.replaceAnyway,
        });
      },
    });
    if (!edited) return;
    const imageId = await putImage(edited.blob);
    const before = getState().project;
    if (!findScheme(before, schemeId)) return;
    let after;
    try {
      after = replaceSchemeImage(before, schemeId, {
        imageId,
        width: edited.width,
        height: edited.height,
      }).project;
    } catch (error) {
      notify(error.message, "error");
      return;
    }
    // Через canvasCommit: замену отменяет Ctrl+Z, как и всё остальное. Прежняя
    // картинка поэтому и остаётся в хранилище — её убирает уборка при запуске,
    // когда отменять уже нечего.
    canvasCommit(before, after, strings.history.replaceImage, { schemeId });
    notify(sameAspect(wasSize, edited) ? strings.image.replaced : strings.image.replacedShifted, "success");
  }

  async function renameScheme(schemeId) {
    const project = getState().project;
    const scheme = findScheme(project, schemeId);
    if (!scheme) return;
    const name = await uiPrompt({ title: strings.schemes.renameTitle, value: scheme.name });
    if (!name || name === scheme.name) return;
    setState({ project: updateScheme(getState().project, schemeId, { name }).project });
  }

  function moveScheme(schemeId, delta) {
    const project = getState().project;
    const ordered = schemesInOrder(project);
    const index = ordered.findIndex((scheme) => scheme.id === schemeId);
    const target = index + delta;
    if (index < 0 || target < 0 || target >= ordered.length) return;
    const moved = [...ordered];
    moved.splice(target, 0, moved.splice(index, 1)[0]);
    let next = project;
    moved.forEach((scheme, position) => {
      if (scheme.order !== position) next = updateScheme(next, scheme.id, { order: position }).project;
    });
    setState({ project: next });
  }

  async function removeScheme(schemeId, marks) {
    const project = getState().project;
    const scheme = findScheme(project, schemeId);
    if (!scheme) return;
    const agreed = await uiConfirm({
      title: strings.schemes.removeTitle,
      message: text("schemes.removeMessage", { name: scheme.name, marks }),
    });
    if (!agreed) return;
    const fresh = getState().project;
    const next = deleteScheme(fresh, schemeId).project;
    if (scheme.imageId) await deleteImage(scheme.imageId);
    const rest = schemesInOrder(next);
    setState({
      project: next,
      schemeId: getState().schemeId === schemeId ? (rest[0] ? rest[0].id : null) : getState().schemeId,
      selectedMarkIds: [],
    });
    notify(text("schemes.removed", { name: scheme.name }), "success");
  }

  // Картинка текущей схемы — единственное, что панель отдаёт холсту.
  async function loadSchemeImage(force) {
    const state = getState();
    const scheme = state.project && state.schemeId ? findScheme(state.project, state.schemeId) : null;
    const token = ++imageToken;
    if (!scheme || !scheme.imageId) {
      if (decoded) releasePlanImage(decoded);
      decoded = null;
      if (state.schemeImage) setState({ schemeImage: null });
      return;
    }
    const current = state.schemeImage;
    if (!force && current && current.schemeId === scheme.id && current.imageId === scheme.imageId) return;
    const blob = await getImage(scheme.imageId);
    if (!blob || token !== imageToken) return;
    let next;
    try {
      next = await decodePlanImage(blob);
    } catch (error) {
      notify(strings.image.broken, "error");
      return;
    }
    if (token !== imageToken) {
      releasePlanImage(next);
      return;
    }
    if (decoded) releasePlanImage(decoded);
    decoded = next;
    setState({
      schemeImage: {
        schemeId: scheme.id,
        imageId: scheme.imageId,
        image: next.image,
        url: next.url,
        width: next.width,
        height: next.height,
      },
    });
  }

  // Перетаскивание плана на холст — тот же путь, что и кнопка.
  const area = document.getElementById("canvas-area");
  if (area) {
    area.dataset.drop = strings.schemes.dropHere;
    area.addEventListener("dragover", (event) => {
      event.preventDefault();
      area.classList.add("is-dropping");
    });
    area.addEventListener("dragleave", (event) => {
      if (event.target === area) area.classList.remove("is-dropping");
    });
    area.addEventListener("drop", async (event) => {
      event.preventDefault();
      area.classList.remove("is-dropping");
      const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
      if (file) await addPlanFromFile(file);
    });
  }
  // Файл, брошенный мимо холста, не должен уводить страницу в просмотр картинки.
  document.addEventListener("dragover", (event) => event.preventDefault());
  document.addEventListener("drop", (event) => event.preventDefault());

  // Уборка ничьих подложек — один раз за сеанс, на первом открытом объекте:
  // стек отмены в этот момент пуст, несохранённых правок ещё нет, и удалять
  // безопасно. Мусор, нажитый за сеанс, уйдёт при следующем запуске.
  let swept = false;
  subscribe((state, changed) => {
    if ("project" in changed || "schemeId" in changed) {
      render();
      loadSchemeImage(false);
    }
    if (!swept && state.project) {
      swept = true;
      sweepOrphanImages([state.project]);
    }
  });
  render();
  loadSchemeImage(false);
}

registerPanel(PANEL_IDS.schemes, mountSchemesPanel);

// src/panels/typePicker.js
// Своё окно выбора типа метки: «буква — пояснение», поиск и ввод нового кода
// прямо здесь.
//
// Категории стоят колонками рядом — «Свет», «Выключатели», «Розетки» и так
// далее, — а не одним длинным столбцом: окно открывается десятки раз за сеанс,
// и цель — попасть в нужный тип одним взглядом и одним кликом, без листания.
// Ширину окна задаёт число колонок (`--picker-columns`), поэтому справа не
// остаётся пустого поля, а колонки не растягиваются, когда поиск оставил одну.
// Колонок больше шести — переносятся во второй ряд и прокручиваются по
// вертикали; горизонтальная прокрутка остаётся на крайний случай узкого окна.
//
// Окно открывается один раз на серию: выбранный тип «залипает» в панели
// инструментов, и дальше метки ставятся кликами без единого диалога.




// Значок типа — цвет категории и форма из справочника, нарисованные общим
// `render.shapeIcon`: в списке видно ровно то, что попадёт на план.
function pickerIcon(project, typeId, size = 22) {
  const style = styleOf(project, typeId);
  return shapeIcon(style.shape, style.color, size);
}

// Больше шести колонок в ряд не ставим: седьмая ужимает остальные до каши.
// Лишние переносятся во второй ряд — вертикальная прокрутка удобнее
// горизонтальной, когда справочник разросся.
const PICKER_MAX_COLUMNS = 6;

// Клавиатура по сетке: вверх-вниз — по колонке, вправо-влево — в соседнюю
// колонку на ту же строку (короткая колонка прижимает к последней строке).
function pickerMove(box, row, dx, dy) {
  const columns = [...box.children].filter((node) => node.classList.contains("picker__column"));
  const rowsOf = (node) => [...node.querySelectorAll(".picker__row")];
  const column = columns.findIndex((node) => node.contains(row));
  if (column < 0) return;
  const index = rowsOf(columns[column]).indexOf(row);
  const rows = rowsOf(columns[Math.min(columns.length - 1, Math.max(0, column + dx))]);
  const next = rows[Math.min(rows.length - 1, Math.max(0, index + dy))];
  if (next) next.focus();
}
function openTypePicker(project, options = {}) {
  return new Promise((resolve) => {
    let modal;
    let current = project;
    const done = (result) => {
      modal.close();
      resolve(result || null);
    };

    const box = uiEl("div", { class: "picker__columns" });
    const body = uiEl("div", { class: "picker picker--types" });
    const error = uiEl("p", { class: "picker__error" });
    const createBox = uiEl("div", { class: "picker__create" });
    const search = uiEl("input", {
      class: "ui-input",
      type: "text",
      placeholder: strings.picker.search,
      on: {
        input: () => renderList(),
        keydown: (event) => {
          // Стрелка вниз из поиска — в первую строку сетки: дальше по ней
          // ходят стрелками, не хватаясь за мышь.
          if (event.key === "ArrowDown") {
            const first = box.querySelector(".picker__row");
            if (!first) return;
            event.preventDefault();
            first.focus();
            return;
          }
          if (event.key !== "Enter") return;
          event.preventDefault();
          const first = box.querySelector(".picker__row");
          if (first) first.click();
          else if (createBox.firstChild) createType();
        },
      },
    });

    let createName = null;
    let createCategory = null;

    function createType() {
      const code = search.value.trim();
      if (!createName || !createCategory) return;
      try {
        const result = addType(current, {
          code,
          name: createName.value.trim() || code,
          categoryId: createCategory.value,
        });
        done({ typeId: result.type.id, project: result.project, created: true });
      } catch (failure) {
        error.textContent = failure.message;
      }
    }

    function renderCreate(query) {
      createBox.replaceChildren();
      error.textContent = "";
      // Годится ли код — знает модель, и только она: буквы, длина и занятость
      // проверяются там же, где их проверит `addType`. Своей копии правила
      // здесь нет намеренно — прежняя пережила снятие предела в две буквы и
      // отказывалась заводить «ПОДСВЕТКА».
      if (codeProblem(current, query)) return;
      createName = uiEl("input", {
        class: "ui-input",
        type: "text",
        placeholder: strings.picker.createNamePlaceholder,
      });
      createCategory = uiEl(
        "select",
        { class: "ui-select" },
        current.categories.map((category) =>
          uiEl("option", { text: category.name, value: category.id, attrs: { value: category.id } }),
        ),
      );
      createBox.append(
        uiEl("p", { class: "picker__createTitle", text: text("picker.createTitle", { code: query }) }),
        uiEl("p", { class: "picker__createTitle", text: text("picker.codeHint", { max: CODE_MAX_LENGTH }) }),
        uiEl("label", { class: "picker__field" }, [
          uiEl("span", { text: strings.picker.createName }),
          createName,
        ]),
        uiEl("label", { class: "picker__field" }, [
          uiEl("span", { text: strings.picker.createCategory }),
          createCategory,
        ]),
        uiButton(strings.picker.create, {
          class: "ui-btn ui-btn--accent",
          on: { click: createType },
        }),
      );
    }

    function typeRow(type) {
      const row = uiEl(
        "button",
        {
          class: "picker__row" + (type.id === options.activeTypeId ? " is-active" : ""),
          type: "button",
          // Длинный код не даёт названию места, и оно ужимается многоточием —
          // подсказка возвращает его целиком.
          title: type.code + " — " + type.name,
          on: { click: () => done({ typeId: type.id, project: current }) },
        },
        [
          pickerIcon(current, type.id),
          uiEl("span", { class: "picker__code", text: type.code }),
          uiEl("span", { class: "picker__name", text: type.name }),
        ],
      );
      return row;
    }

    function renderList() {
      const query = search.value.trim();
      // Что за чем показывать, решает модель: поиск по коду и названию,
      // точное совпадение кода первым. Своей сортировки здесь нет.
      const groups = searchTypes(current, query);
      box.replaceChildren(
        ...groups.map((group) => {
          const head = uiEl("div", { class: "picker__group", text: group.category.name });
          head.style.borderColor = group.category.color;
          head.style.color = group.category.color;
          return uiEl("div", { class: "picker__column" }, [head, ...group.types.map(typeRow)]);
        }),
      );
      if (groups.length === 0) box.append(uiEl("p", { class: "panel__empty", text: strings.picker.empty }));
      // Ширину окна задаёт число колонок: пять категорий — пять колонок и
      // никакого пустого поля справа, одна найденная — узкое окно.
      body.style.setProperty("--picker-columns", String(Math.min(Math.max(groups.length, 1), PICKER_MAX_COLUMNS)));
      renderCreate(query);
    }

    // Клавиатура по сетке. Enter здесь обязателен свой: основное действие
    // диалога — «Отмена», и оно сработало бы раньше, чем браузер превратит
    // Enter в клик по строке, — то есть выбор терялся бы.
    box.addEventListener("keydown", (event) => {
      const row = event.target;
      if (!row || !row.classList || !row.classList.contains("picker__row")) return;
      if (event.key === "Enter") {
        event.preventDefault();
        row.click();
        return;
      }
      const step = { ArrowDown: [0, 1], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowLeft: [-1, 0] }[event.key];
      if (!step) return;
      event.preventDefault();
      pickerMove(box, row, step[0], step[1]);
    });

    renderList();
    body.replaceChildren(search, box, createBox, error);
    modal = uiModal({
      title: options.title || strings.picker.title,
      body,
      actions: [uiButton(strings.dialog.cancel, { on: { click: () => done(null) } })],
      onCancel: () => resolve(null),
    });
    // Широкая карточка — только у этого окна: ширину внутри задаёт сетка колонок.
    if (modal.card) modal.card.classList.add("modal--wide");
    search.focus();
  });
}

// src/panels/tools.js
// Панель инструментов: выбранный тип, что ставим, режим блока, размеры,
// масштаб и отмена. Тип показан крупно и «залипает» — по нему видно, что
// следующий клик по плану поставит именно его.









const TOOLS_MARK_SIZE = { min: 4, max: 36 };
const TOOLS_LABEL_SIZE = { min: 8, max: 40 };
// Крупный значок выбранного типа: цвет категории и форма из справочника,
// нарисованные тем же `render.shapeIcon`, что в списках и на плане.
function toolsTypeIcon(project, typeId, size = 26) {
  const style = styleOf(project, typeId);
  return shapeIcon(style.shape, style.color, size);
}

// Ползунок двигается живьём, а в историю попадает одним действием на всё
// перетаскивание: иначе стек забивался бы тридцатью шагами на один жест.
function toolsSlider(value, range, onInput, onCommit) {
  return uiEl("input", {
    class: "tools__slider",
    type: "range",
    value: String(value),
    attrs: { min: String(range.min), max: String(range.max), step: "1" },
    on: {
      input: (event) => onInput(Number(event.target.value)),
      change: () => onCommit(),
    },
  });
}

function mountToolsPanel(host, api) {
  const { getState, setState, subscribe, notify } = api;
  const box = uiEl("div", { class: "tools" });
  host.replaceChildren(box);
  // Снимок объекта на время жеста ползунка: пока он есть, панель не
  // перерисовывается — иначе ползунок исчезал бы из-под пальца.
  let sizeBefore = null;

  function activeType(state) {
    return state.project && state.activeTypeId ? findType(state.project, state.activeTypeId) : null;
  }

  async function chooseType(nextMode) {
    const state = getState();
    if (!state.project) return;
    const picked = await openTypePicker(state.project, { activeTypeId: state.activeTypeId });
    if (!picked) return;
    const fresh = getState();
    const mode = nextMode || (fresh.mode === "line" ? "line" : "point");
    if (!picked.created) {
      setState({ activeTypeId: picked.typeId, mode });
      return;
    }
    // Новый тип — правка объекта, значит и шаг истории: иначе следующий Ctrl+Z
    // по метке вернул бы объект без этого типа, ни о чём не спросив.
    canvasCommit(fresh.project, picked.project, strings.history.addType, {
      patch: { activeTypeId: picked.typeId, mode },
    });
    const type = findType(picked.project, picked.typeId);
    notify(text("picker.created", { code: type.code, name: type.name }), "success");
  }

  // Смена типа у выделенной метки: модель выдаёт новый номер, старый остаётся
  // дырой — так распечатка вчерашнего дня не протухает.
  async function changeSelectedType() {
    const state = getState();
    const markId = state.selectedMarkIds[0];
    if (!state.project || !markId) return;
    const picked = await openTypePicker(state.project, { title: strings.tools.changeType });
    if (!picked) return;
    const before = picked.created ? state.project : getState().project;
    const base = picked.created ? picked.project : before;
    if (!findMark(base, markId)) return;
    try {
      const after = changeMarkType(base, markId, picked.typeId).project;
      canvasCommit(before, after, strings.history.changeType, { selection: [markId] });
      notify(text("canvas.typeChanged", { label: labelOf(after, markId) }), "success");
    } catch (error) {
      notify(error.message, "error");
    }
  }

  function activeRoom(state) {
    return state.project && state.activeRoomId ? findRoom(state.project, state.activeRoomId) : null;
  }

  // Помещение для обводки выбирается так же, как тип метки: один раз на серию.
  // Новая комната, заведённая прямо здесь, — правка объекта, значит и шаг
  // истории, иначе Ctrl+Z вернул бы объект без неё молча.
  async function chooseRoom(nextMode) {
    const state = getState();
    if (!state.project) return;
    const picked = await openRoomPicker(state.project, { activeRoomId: state.activeRoomId });
    if (!picked) return;
    const fresh = getState();
    const mode = nextMode || fresh.mode;
    if (!picked.created) {
      setState({ activeRoomId: picked.roomId, mode });
      return;
    }
    canvasCommit(fresh.project, picked.project, strings.history.addRoom, {
      patch: { activeRoomId: picked.roomId, mode },
    });
  }

  function setMode(mode) {
    const state = getState();
    if (mode !== "select" && !state.schemeId) {
      notify(strings.canvas.needScheme);
      return;
    }
    if (mode === "room") {
      if (!activeRoom(state)) {
        chooseRoom("room");
        return;
      }
      setState({ mode });
      return;
    }
    if (mode !== "select" && !state.activeTypeId) {
      chooseType(mode);
      return;
    }
    setState({ mode });
  }

  function setSize(key, value) {
    const state = getState();
    if (!state.project) return;
    if (!sizeBefore) sizeBefore = state.project;
    setState({ project: updateProject(state.project, { view: { ...state.project.view, [key]: value } }).project });
  }

  // Конец жеста: один шаг истории на всё перетаскивание ползунка.
  function commitSize() {
    if (!sizeBefore) return;
    const before = sizeBefore;
    sizeBefore = null;
    const after = getState().project;
    if (after !== before) canvasCommit(before, after, strings.history.viewSize);
    render();
  }

  function setBlockMode(mode) {
    const state = getState();
    const type = activeType(state);
    if (!type) return;
    canvasCommit(state.project, updateType(state.project, type.id, { blockMode: mode }).project, strings.history.blockMode);
  }

  function render() {
    const state = getState();
    const type = activeType(state);
    const sizes = state.project ? state.project.view : { markSize: 10, labelSize: 12 };
    // Метка, у которой можно сменить тип: пока её нет, кнопки нет тоже —
    // серая кнопка, которая никогда не оживает, хуже её отсутствия.
    const selectedId = state.selectedMarkIds[0];
    const selectedMark = state.project && selectedId ? findMark(state.project, selectedId) : null;

    const typeButton = uiEl(
      "button",
      {
        class: "tools__type" + (type ? " is-set" : ""),
        type: "button",
        title: strings.tools.chooseType,
        on: { click: () => chooseType() },
      },
      type
        ? [
            toolsTypeIcon(state.project, type.id),
            uiEl("span", { class: "tools__code", text: type.code }),
            uiEl("span", { class: "tools__typeName", text: type.name }),
            // Плашка и есть кнопка выбора типа — и должна выглядеть кнопкой:
            // пользователь нажимал её вслепую, а рядом серела мёртвая кнопка.
            uiEl("span", { class: "tools__pick", text: strings.tools.pick }),
          ]
        : [
            uiEl("span", { class: "tools__typeName", text: strings.tools.noType }),
            uiEl("span", { class: "tools__pick", text: strings.tools.pick }),
          ],
    );

    const modeRow = uiEl("div", { class: "tools__row tools__row--modes" }, [
      uiButton(strings.tools.selectMode, {
        class: "ui-btn" + (state.mode === "select" ? " is-active" : ""),
        on: { click: () => setMode("select") },
      }),
      uiButton(strings.tools.kindPoint, {
        class: "ui-btn" + (state.mode === "point" ? " is-active" : ""),
        title: strings.tools.kindPointHint,
        on: { click: () => setMode("point") },
      }),
      uiButton(strings.tools.kindLine, {
        class: "ui-btn" + (state.mode === "line" ? " is-active" : ""),
        title: strings.tools.kindLineHint,
        on: { click: () => setMode("line") },
      }),
      uiButton(strings.tools.kindOutline, {
        class: "ui-btn" + (state.mode === "room" ? " is-active" : ""),
        title: strings.tools.kindOutlineHint,
        on: { click: () => setMode("room") },
      }),
    ]);

    // Помещение для обводки: показано рядом с режимом, как выбранный тип метки.
    const room = activeRoom(state);
    const roomButton = uiEl(
      "button",
      {
        class: "tools__room" + (room ? " is-set" : ""),
        type: "button",
        title: strings.tools.chooseRoom,
        on: { click: () => chooseRoom() },
      },
      room
        ? [
            roomSwatch(room.color, 14),
            uiEl("span", { class: "tools__typeName", text: room.name }),
            uiEl("span", { class: "tools__pick", text: strings.tools.pick }),
          ]
        : [
            uiEl("span", { class: "tools__typeName", text: strings.tools.noRoom }),
            uiEl("span", { class: "tools__pick", text: strings.tools.pick }),
          ],
    );

    const blockSelect = uiEl(
      "select",
      {
        class: "ui-select",
        title: strings.tools.blockHint,
        on: { change: (event) => setBlockMode(event.target.value) },
      },
      BLOCK_MODES.map((mode) =>
        uiEl("option", { text: strings.blockMode[mode], value: mode, attrs: { value: mode } }),
      ),
    );
    if (type) blockSelect.value = type.blockMode || "each";
    blockSelect.disabled = !type;

    const undoButton = uiButton(strings.tools.undo, {
      title: text("tools.undoTitle", { label: undoLabel() }),
      on: { click: () => canvasUndoStep() },
    });
    const redoButton = uiButton(strings.tools.redo, {
      title: text("tools.redoTitle", { label: redoLabel() }),
      on: { click: () => canvasRedoStep() },
    });
    undoButton.disabled = !canUndo();
    redoButton.disabled = !canRedo();

    // Пустые места отсеиваются: «Сменить тип» появляется только при выделенной
    // метке, а replaceChildren на null вставил бы в панель слово «null».
    const parts = [
      uiEl("p", { class: "tools__label", text: strings.tools.type }),
      typeButton,
      selectedMark
        ? uiButton(text("tools.changeTypeOf", { label: labelOf(state.project, selectedMark.id) }), {
            class: "ui-btn ui-btn--wide",
            title: strings.tools.changeTypeHint,
            on: { click: () => changeSelectedType() },
          })
        : null,
      uiEl("p", { class: "tools__label", text: strings.tools.kind }),
      modeRow,
      uiEl("p", { class: "tools__label", text: strings.tools.room }),
      roomButton,
      uiEl("p", { class: "tools__label", text: strings.tools.block }),
      blockSelect,
      uiEl("p", { class: "tools__label", text: strings.tools.sizes }),
      uiEl("label", { class: "tools__field" }, [
        uiEl("span", { text: strings.tools.markSize }),
        toolsSlider(sizes.markSize, TOOLS_MARK_SIZE, (value) => setSize("markSize", value), commitSize),
      ]),
      uiEl("label", { class: "tools__field" }, [
        uiEl("span", { text: strings.tools.labelSize }),
        toolsSlider(sizes.labelSize, TOOLS_LABEL_SIZE, (value) => setSize("labelSize", value), commitSize),
      ]),
      uiEl("p", { class: "tools__label", text: strings.tools.zoom }),
      uiEl("div", { class: "tools__row" }, [
        uiButton("−", { title: strings.tools.zoomOut, on: { click: () => canvasZoomBy(1 / 1.25) } }),
        uiButton("+", { title: strings.tools.zoomIn, on: { click: () => canvasZoomBy(1.25) } }),
        uiButton(strings.tools.zoomFit, { on: { click: () => canvasFitPlan() } }),
        uiButton(strings.tools.zoomReset, { on: { click: () => canvasZoomReset() } }),
      ]),
      uiEl("div", { class: "tools__row" }, [undoButton, redoButton]),
    ];
    box.replaceChildren(...parts.filter(Boolean));
  }

  subscribe((state, changed) => {
    if (sizeBefore) return;
    if (
      "project" in changed ||
      "activeTypeId" in changed ||
      "activeRoomId" in changed ||
      "mode" in changed ||
      "selectedMarkIds" in changed ||
      "schemeId" in changed
    ) {
      render();
    }
  });
  onHistoryChange(render);
  render();
}

registerPanel(PANEL_IDS.tools, mountToolsPanel);
})();
    </script>
