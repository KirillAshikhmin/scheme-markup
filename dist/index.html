      clearTimeout(timer);
      finish(resolve, request.result);
    };
    request.onerror = () => {
      clearTimeout(timer);
      finish(reject, request.error || new Error("indexeddb-failed"));
    };

    };
  });

      .then((db) => {
        storeDb = db;
        storeModeValue = "idb";
        db.onclose = () => degradeToMemory(new Error("indexeddb-closed"));
        return storeModeValue;
      })
      .catch((error) => {
        degradeToMemory(error);
        return storeModeValue;
      });
  }
  return storeOpening;
}

function degradeToMemory(error) {
  storeDb = null;
  storeModeValue = "memory";
  if (storeReported) return;
  storeReported = true;
  reportStoreProblem("unavailable", error);
}

// Одна транзакция — одно действие: запись документа объекта атомарна, вкладка,
// закрытая посреди сохранения, оставляет прежнее состояние, а не половину.
async function runTransaction(name, mode, action) {
  await openStore();
  if (storeModeValue !== "idb" || !storeDb) return { ok: false, memory: true };
  try {
    return await new Promise((resolve, reject) => {
      const tx = storeDb.transaction(name, mode);
      let result;
      tx.oncomplete = () => {
        if (mode === "readwrite") storeWriteReported = false;
        resolve({ ok: true, result });
      };
      tx.onerror = () => reject(tx.error || new Error("indexeddb-failed"));
      tx.onabort = () => reject(tx.error || new Error("indexeddb-aborted"));
      Promise.resolve(action(tx.objectStore(name)))
        .then((value) => {
          result = value;
        })
        .catch((error) => {
          try {
            tx.abort();
          } catch (ignored) {
            /* транзакция уже завершилась */
          }
          reject(error);
        });
    });
  } catch (error) {
    // Автосохранение идёт на каждую правку: об отказавшей записи говорим один
    // раз — до тех пор, пока запись снова не пройдёт.
    if (mode === "readwrite" && !storeWriteReported) {
      storeWriteReported = true;
      reportStoreProblem("writeFailed", error);
    }
    return { ok: false, error };
  }
}

// ——— объекты ——————————————————————————————————————————————————————————
async function listProjects() {
  const summaries = new Map();
  const read = await runTransaction(STORE_NAMES.projects, "readonly", (store) => idbRequest(store.getAll()));
  if (read.ok) {
    for (const doc of read.result || []) summaries.set(doc.id, summaryOf(doc));
  }
  for (const doc of storeMemory.projects.values()) summaries.set(doc.id, summaryOf(doc));
  return [...summaries.values()].sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
}

function summaryOf(project) {
  return {
    id: project.id,
    name: project.name,
    updatedAt: project.updatedAt,
    schemes: (project.schemes || []).length,
    marks: (project.marks || []).length,
  };
}
async function loadProject(id) {
  if (!id) return null;
  if (storeMemory.projects.has(id)) return storeMemory.projects.get(id);
  const read = await runTransaction(STORE_NAMES.projects, "readonly", (store) => idbRequest(store.get(id)));
  return read.ok && read.result ? read.result : null;
}

// Отказ записи не теряет работу: документ остаётся в памяти сеанса, а панель
// получает повод предложить выгрузку в файл.
async function saveProject(project) {
  if (!project || !project.id) return { ok: false };
  const written = await runTransaction(STORE_NAMES.projects, "readwrite", (store) =>
    idbRequest(store.put(project)),
  );
  if (written.ok) {
    storeMemory.projects.delete(project.id);
    return { ok: true, mode: "idb" };
  }
  storeMemory.projects.set(project.id, project);
  return { ok: false, mode: "memory", error: written.error || null };
}
async function deleteProject(id) {
  storeMemory.projects.delete(id);
  const removed = await runTransaction(STORE_NAMES.projects, "readwrite", (store) => idbRequest(store.delete(id)));
  return { ok: removed.ok || storeModeValue === "memory" };
}

// ——— изображения ——————————————————————————————————————————————————————

// `imageId` задаётся, когда план приехал из чужого файла: в общей папке схема
// ссылается на картинку по идентификатору из файла, и переименовать его —
// значит развести ссылки двух браузеров.
async function putImage(blob, imageId) {
  const id = typeof imageId === "string" && imageId ? imageId : newStoreId();
  const createdAt = Date.now();
  const written = await runTransaction(STORE_NAMES.images, "readwrite", (store) =>
    idbRequest(store.put({ id, blob, type: blob.type || "", size: blob.size || 0, createdAt })),
  );
  if (!written.ok) storeMemory.images.set(id, { blob, createdAt });
  return id;
}
async function getImage(id) {
  if (!id) return null;
  if (storeMemory.images.has(id)) return storeMemory.images.get(id).blob;
  const read = await runTransaction(STORE_NAMES.images, "readonly", (store) => idbRequest(store.get(id)));
  return read.ok && read.result ? read.result.blob : null;
}
async function deleteImage(id) {
  if (!id) return { ok: true };
  storeMemory.images.delete(id);
  const removed = await runTransaction(STORE_NAMES.images, "readwrite", (store) => idbRequest(store.delete(id)));
  return { ok: removed.ok || storeModeValue === "memory" };
}

// ——— уборка ———————————————————————————————————————————————————————————

// Картинки лежат общей кучей на все объекты, поэтому «ничья» — та, на которую
// не ссылается ни один объект. Чистая половина уборки: её и проверяют тесты.
//
// Два правила, оба про «лучше не тронуть, чем потерять план»:
// список объектов пуст или не список — сирот нет вовсе (нечего сверять,
// значит нечего и удалять); картинка моложе `minAgeMs` — не сирота, её объект
// мог ещё не досохраниться, в том числе в соседней вкладке.
function orphanImageIds(projects, images, options = {}) {
  if (!Array.isArray(projects) || projects.length === 0) return [];
  const now = Number.isFinite(options.now) ? options.now : Date.now();
  const minAgeMs = Number.isFinite(options.minAgeMs) ? options.minAgeMs : STORE_IMAGE_GRACE_MS;
  const used = new Set();
  for (const project of projects) {
    for (const id of usedImageIds(project)) used.add(id);
  }
  const orphans = [];
  for (const entry of images || []) {
    const id = typeof entry === "string" ? entry : entry && entry.id;
    if (!id || used.has(id)) continue;
    const createdAt = typeof entry === "string" ? null : entry && entry.createdAt;
    // Без отметки — запись из прежних версий: она заведомо старше сеанса.
    if (Number.isFinite(createdAt) && now - createdAt < minAgeMs) continue;
    orphans.push(id);
  }
  return orphans;
}

// Не смогли прочитать — возвращаем null: удалять по неполному списку нельзя,
// так теряются чужие планы.
async function allProjectDocs() {
  const read = await runTransaction(STORE_NAMES.projects, "readonly", (store) => idbRequest(store.getAll()));
  if (!read.ok && storeModeValue === "idb") return null;
  const docs = new Map();
  for (const doc of read.result || []) docs.set(doc.id, doc);
  for (const doc of storeMemory.projects.values()) docs.set(doc.id, doc);
  return [...docs.values()];
}

// Записи, а не одни ключи: возраст картинки решает, можно ли её трогать.
async function listImageRecords() {
  const read = await runTransaction(STORE_NAMES.images, "readonly", (store) => idbRequest(store.getAll()));
  if (!read.ok && storeModeValue === "idb") return null;
  const records = (read.result || []).map((item) => ({ id: String(item.id), createdAt: item.createdAt }));
  for (const [id, item] of storeMemory.images) records.push({ id, createdAt: item.createdAt });
  return records;
}

// Убирает подложки, которые не нужны ни одному объекту. `extraProjects` —
// то, что ещё не доехало до хранилища (только что открытый объект): его
// картинки тоже не ничьи.
async function sweepOrphanImages(extraProjects = []) {
  const docs = await allProjectDocs();
  const stored = await listImageRecords();
  if (!docs || !stored) return { removed: 0, skipped: true };
  const orphans = orphanImageIds([...docs, ...extraProjects], stored);
  for (const id of orphans) await deleteImage(id);
  return { removed: orphans.length, skipped: false };
}

// ——— настройки ————————————————————————————————————————————————————————
async function getSetting(key) {
  if (storeMemory.settings.has(key)) return storeMemory.settings.get(key);
  const read = await runTransaction(STORE_NAMES.settings, "readonly", (store) => idbRequest(store.get(key)));
  return read.ok && read.result ? read.result.value : null;
}
async function setSetting(key, value) {
  const written = await runTransaction(STORE_NAMES.settings, "readwrite", (store) =>
    idbRequest(store.put({ key, value })),
  );
  if (written.ok) storeMemory.settings.delete(key);
  else storeMemory.settings.set(key, value);
  return { ok: written.ok };
}

// ——— место ————————————————————————————————————————————————————————————
async function estimateSpace() {
  const empty = { usage: null, quota: null, free: null, low: false };
  if (typeof navigator === "undefined" || !navigator.storage || !navigator.storage.estimate) return empty;
  try {
    const { usage, quota } = await navigator.storage.estimate();
    if (typeof quota !== "number" || typeof usage !== "number") return empty;
    const free = Math.max(0, quota - usage);
    return { usage, quota, free, low: free < STORE_LOW_SPACE_BYTES };
  } catch (error) {
    return empty;
  }
}

// src/projectFile.js
// Формат файла проекта: один zip с project.json, планами в schemes/ и README.txt.
// Zip пишется и читается здесь же, без библиотек: CompressionStream("deflate-raw")
// там, где он есть, и «stored» (без сжатия) там, где его нет. Читаются оба варианта.
const PROJECT_ENTRY = "project.json";
const SCHEMES_DIR = "schemes/";
const README_ENTRY = "README.txt";

const LOCAL_SIGNATURE = 0x04034b50;
const CENTRAL_SIGNATURE = 0x02014b50;
const END_SIGNATURE = 0x06054b50;
const LOCAL_HEADER_SIZE = 30;
const CENTRAL_HEADER_SIZE = 46;
const END_HEADER_SIZE = 22;
const METHOD_STORED = 0;
const METHOD_DEFLATE = 8;
const UTF8_FLAG = 0x0800;
const ZIP64_MARK = 0xffffffff;
const MAX_ZIP_BYTES = 0xfffffffe;

// Тип картинки восстанавливается по расширению: имя файла в архиве — всё,
// что о ней известно после распаковки.
const IMAGE_TYPES = [
  ["image/png", "png"],
  ["image/jpeg", "jpg"],
  ["image/jpeg", "jpeg"],
];

function fileError(key, vars) {
  const error = new Error(text("errors." + key, vars));
  error.code = key;
  return error;
}

// ——— байты ———————————————————————————————————————————————————————————

const utf8Encoder = new TextEncoder();
const utf8Decoder = new TextDecoder("utf-8");

function encodeText(value) {
  return utf8Encoder.encode(value);
}

function decodeText(bytes) {
  return utf8Decoder.decode(bytes);
}

async function toBytes(data) {
  if (data == null) return new Uint8Array(0);
  if (data instanceof Uint8Array) return data;
  if (typeof data === "string") return encodeText(data);
  if (data instanceof ArrayBuffer) return new Uint8Array(data);
  if (ArrayBuffer.isView(data)) return new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
  if (typeof data.arrayBuffer === "function") return new Uint8Array(await data.arrayBuffer());
  throw fileError("archiveBroken");
}

let crcTable = null;
function crc32(bytes) {
  if (!crcTable) {
    crcTable = new Uint32Array(256);
    for (let n = 0; n < 256; n += 1) {
      let value = n;
      for (let bit = 0; bit < 8; bit += 1) {
        value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
      }
      crcTable[n] = value >>> 0;
    }
  }
  let crc = 0xffffffff;
  for (let i = 0; i < bytes.length; i += 1) {
    crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xff];
  }
  return (crc ^ 0xffffffff) >>> 0;
}

function hasCompression() {
  return typeof CompressionStream === "function" && typeof DecompressionStream === "function";
}

async function collectStream(readable) {
  const reader = readable.getReader();
  const chunks = [];
  let total = 0;
  for (;;) {
    const step = await reader.read();
    if (step.done) break;
    const chunk = step.value instanceof Uint8Array ? step.value : new Uint8Array(step.value);
    chunks.push(chunk);
    total += chunk.length;
  }
  const out = new Uint8Array(total);
  let at = 0;
  for (const chunk of chunks) {
    out.set(chunk, at);
    at += chunk.length;
  }
  return out;
}

// Поток, а не один кусок: большой план не держит вкладку — между чтениями
// управление возвращается странице.
async function pipeBytes(bytes, transform) {
  const source = new Blob([bytes]).stream().pipeThrough(transform);
  return collectStream(source);
}

async function deflateRaw(bytes) {
  return pipeBytes(bytes, new CompressionStream("deflate-raw"));
}

async function inflateRaw(bytes) {
  try {
    return await pipeBytes(bytes, new DecompressionStream("deflate-raw"));
  } catch {
    throw fileError("archiveBroken");
  }
}

// ——— запись zip ——————————————————————————————————————————————————————

function dosStamp(date) {
  const year = date.getUTCFullYear();
  if (year < 1980) return { time: 0, date: (1 << 5) | 1 };
  return {
    time: (date.getUTCHours() << 11) | (date.getUTCMinutes() << 5) | (date.getUTCSeconds() >> 1),
    date: ((year - 1980) << 9) | ((date.getUTCMonth() + 1) << 5) | date.getUTCDate(),
  };
}

function headerBuffer(size) {
  const bytes = new Uint8Array(size);
  return { bytes, view: new DataView(bytes.buffer) };
}

/**
 * Собирает zip из списка {name, data, compress}. `data` — Uint8Array, ArrayBuffer,
 * строка или Blob. Размеры известны заранее, дескрипторов данных нет — архив
 * открывается штатным распаковщиком ОС.
 */
async function writeZip(files, options = {}) {
  const allowCompression = options.compress !== false && hasCompression();
  const stamp = dosStamp(options.date instanceof Date ? options.date : new Date());
  const onProgress = typeof options.onProgress === "function" ? options.onProgress : null;
  const list = [...files];

  const parts = [];
  const central = [];
  let offset = 0;

  for (let index = 0; index < list.length; index += 1) {
    const entry = list[index];
    const nameBytes = encodeText(entry.name);
    const source = await toBytes(entry.data);
    const wantCompression = entry.compress === false ? false : allowCompression;

    let method = METHOD_STORED;
    let payload = source;
    if (wantCompression && source.length > 0) {
      const packed = await deflateRaw(source);
      if (packed.length < source.length) {
        method = METHOD_DEFLATE;
        payload = packed;
      }
    }
    const crc = crc32(source);

    const local = headerBuffer(LOCAL_HEADER_SIZE + nameBytes.length);
    local.view.setUint32(0, LOCAL_SIGNATURE, true);
    local.view.setUint16(4, 20, true);
    local.view.setUint16(6, UTF8_FLAG, true);
    local.view.setUint16(8, method, true);
    local.view.setUint16(10, stamp.time, true);
    local.view.setUint16(12, stamp.date, true);
    local.view.setUint32(14, crc, true);
    local.view.setUint32(18, payload.length, true);
    local.view.setUint32(22, source.length, true);
    local.view.setUint16(26, nameBytes.length, true);
    local.view.setUint16(28, 0, true);
    local.bytes.set(nameBytes, LOCAL_HEADER_SIZE);

    parts.push(local.bytes, payload);
    central.push({ nameBytes, method, crc, packedSize: payload.length, size: source.length, offset });
    offset += local.bytes.length + payload.length;
    if (offset > MAX_ZIP_BYTES) throw fileError("archiveTooBig");
    if (onProgress) onProgress({ done: index + 1, total: list.length, name: entry.name });
  }

  const directoryOffset = offset;
  let directorySize = 0;
  for (const entry of central) {
    const header = headerBuffer(CENTRAL_HEADER_SIZE + entry.nameBytes.length);
    header.view.setUint32(0, CENTRAL_SIGNATURE, true);
    header.view.setUint16(4, 20, true);
    header.view.setUint16(6, 20, true);
    header.view.setUint16(8, UTF8_FLAG, true);
    header.view.setUint16(10, entry.method, true);
    header.view.setUint16(12, stamp.time, true);
    header.view.setUint16(14, stamp.date, true);
    header.view.setUint32(16, entry.crc, true);
    header.view.setUint32(20, entry.packedSize, true);
    header.view.setUint32(24, entry.size, true);
    header.view.setUint16(28, entry.nameBytes.length, true);
    header.view.setUint32(42, entry.offset, true);
    header.bytes.set(entry.nameBytes, CENTRAL_HEADER_SIZE);
    parts.push(header.bytes);
    directorySize += header.bytes.length;
  }

  const end = headerBuffer(END_HEADER_SIZE);
  end.view.setUint32(0, END_SIGNATURE, true);
  end.view.setUint16(8, central.length, true);
  end.view.setUint16(10, central.length, true);
  end.view.setUint32(12, directorySize, true);
  end.view.setUint32(16, directoryOffset, true);
  parts.push(end.bytes);
  if (directoryOffset + directorySize + END_HEADER_SIZE > MAX_ZIP_BYTES) throw fileError("archiveTooBig");

  return new Blob(parts, { type: "application/zip" });
}

// ——— чтение zip ——————————————————————————————————————————————————————

function findEndHeader(bytes, view) {
  const limit = Math.max(0, bytes.length - 0xffff - END_HEADER_SIZE);
  for (let at = bytes.length - END_HEADER_SIZE; at >= limit; at -= 1) {
    if (view.getUint32(at, true) === END_SIGNATURE) return at;
  }
  return -1;
}

/** Распаковывает zip в Map «имя файла → байты». Понимает stored и deflate. */
async function readZip(blob) {
  const bytes = await toBytes(blob);
  if (bytes.length < END_HEADER_SIZE) throw fileError("notAProject");
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

  const endAt = findEndHeader(bytes, view);
  if (endAt < 0) throw fileError("notAProject");

  const count = view.getUint16(endAt + 10, true);
  const directorySize = view.getUint32(endAt + 12, true);
  const directoryOffset = view.getUint32(endAt + 16, true);
  if (directoryOffset === ZIP64_MARK || directorySize === ZIP64_MARK || count === 0xffff) {
    throw fileError("zip64Unsupported");
  }
  if (directoryOffset + directorySize > bytes.length) throw fileError("archiveBroken");

  const entries = new Map();
  let at = directoryOffset;
  for (let index = 0; index < count; index += 1) {
    if (at + CENTRAL_HEADER_SIZE > bytes.length) throw fileError("archiveBroken");
    if (view.getUint32(at, true) !== CENTRAL_SIGNATURE) throw fileError("archiveBroken");
    const method = view.getUint16(at + 10, true);
    const crc = view.getUint32(at + 16, true);
    const packedSize = view.getUint32(at + 20, true);
    const size = view.getUint32(at + 24, true);
    const nameLength = view.getUint16(at + 28, true);
    const extraLength = view.getUint16(at + 30, true);
    const commentLength = view.getUint16(at + 32, true);
    const localOffset = view.getUint32(at + 42, true);
    const name = decodeText(bytes.subarray(at + CENTRAL_HEADER_SIZE, at + CENTRAL_HEADER_SIZE + nameLength));
    at += CENTRAL_HEADER_SIZE + nameLength + extraLength + commentLength;

    if (name.endsWith("/")) continue;
    if (packedSize === ZIP64_MARK || size === ZIP64_MARK || localOffset === ZIP64_MARK) {
      throw fileError("zip64Unsupported");
    }
    if (localOffset + LOCAL_HEADER_SIZE > bytes.length) throw fileError("archiveBroken");
    if (view.getUint32(localOffset, true) !== LOCAL_SIGNATURE) throw fileError("archiveBroken");

    const localNameLength = view.getUint16(localOffset + 26, true);
    const localExtraLength = view.getUint16(localOffset + 28, true);
    const dataAt = localOffset + LOCAL_HEADER_SIZE + localNameLength + localExtraLength;
    if (dataAt + packedSize > bytes.length) throw fileError("archiveBroken");

    const payload = bytes.subarray(dataAt, dataAt + packedSize);
    let content;
    if (method === METHOD_STORED) content = payload.slice();
    else if (method === METHOD_DEFLATE) content = await inflateRaw(payload);
    else throw fileError("archiveBroken");

    if (content.length !== size || crc32(content) !== crc) {
      // Имя записи едет вместе с ошибкой: сверке архива есть что назвать
      // пользователю, а «архив повреждён» без места ему ничего не говорит.
      const broken = fileError("archiveBroken");
      broken.entry = name;
      throw broken;
    }
    entries.set(name, content);
  }
  return entries;
}

// ——— файл проекта ————————————————————————————————————————————————————

function extensionFor(type) {
  const found = IMAGE_TYPES.find((pair) => pair[0] === String(type || "").toLowerCase());
  return found ? found[1] : "bin";
}

function typeForExtension(extension) {
  const found = IMAGE_TYPES.find((pair) => pair[1] === String(extension || "").toLowerCase());
  return found ? found[0] : "";
}

// Идентификатор изображения попадает в имя файла: кодируем, чтобы «/» и прочее
// не разъехались по папкам, и раскодируем обратно — id восстанавливается точно.
function encodeImageId(id) {
  return encodeURIComponent(String(id));
}

function decodeImageId(name) {
  try {
    return decodeURIComponent(name);
  } catch {
    return name;
  }
}

// Поставщик один — store отдаёт Map. Всё остальное отвергается: тихо вернуть
// пустой список значило бы упаковать объект без единого плана и промолчать.
function imageEntries(images) {
  if (images == null) return [];
  if (!(images instanceof Map)) throw fileError("imagesNotMap");
  return [...images.entries()];
}

function looksLikeProject(value) {
  return (
    Boolean(value) &&
    typeof value === "object" &&
    !Array.isArray(value) &&
    typeof value.id === "string" &&
    Array.isArray(value.categories) &&
    Array.isArray(value.markTypes) &&
    Array.isArray(value.schemes) &&
    Array.isArray(value.marks)
  );
}

// Единственное место, где живут миграции формата: версия из будущего отвергается,
// прошлые версии доводятся до текущей здесь.
function migrateProject(loaded) {
  const version = Number(loaded.formatVersion);
  if (!Number.isFinite(version) || version < 1) throw fileError("foreignProject");
  if (version > FORMAT_VERSION) {
    throw fileError("futureVersion", { version, current: FORMAT_VERSION });
  }
  const filled = {
    ...loaded,
    formatVersion: FORMAT_VERSION,
    rooms: Array.isArray(loaded.rooms) ? loaded.rooms : [],
    // Файл версии 1 контуров не знает: поле дописывается здесь, чтобы дальше
    // по коду `project.outlines` всегда был списком, а не «иногда undefined».
    outlines: Array.isArray(loaded.outlines) ? loaded.outlines : [],
    groups: Array.isArray(loaded.groups) ? loaded.groups : [],
    counters: loaded.counters && typeof loaded.counters === "object" ? loaded.counters : {},
  };
  // Вид типа (точка или линия) в файлах версий 1 и 2 не записан. Правило вывода
  // — в модели: тип с метками одного вида переводится молча, а догадка
  // отмечается и показывается пользователю списком на правку. Миграция
  // идемпотентна: у объекта, где вид уже проставлен, она возвращает тот же
  // объект — иначе упаковка правила бы то, что сама же и сверяет.
  return migrateTypeKinds(filled).project;
}

// Календарный день пользователя, а не UTC: разметку правят вечером, и
// `toISOString()` в UTC+3 после девяти вечера помечает файл вчерашним числом —
// в папке загрузок это путает сильнее, чем кажется.
function fileLocalDay(date) {
  const pad = (value) => String(value).padStart(2, "0");
  return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
}

// Отметка времени с местным смещением: «2026-09-16T01:19:00+03:00».
// По-прежнему ISO-8601 с зоной, но читается тем, кто файл и сделал.
function fileLocalStamp(date) {
  const pad = (value) => String(value).padStart(2, "0");
  const offset = -date.getTimezoneOffset();
  const sign = offset < 0 ? "-" : "+";
  const minutes = Math.abs(offset);
  return (
    fileLocalDay(date) +
    "T" +
    pad(date.getHours()) +
    ":" +
    pad(date.getMinutes()) +
    ":" +
    pad(date.getSeconds()) +
    sign +
    pad(Math.floor(minutes / 60)) +
    ":" +
    pad(minutes % 60)
  );
}

function readmeText(project, date) {
  return text("file.readme", {
    name: project.name || strings.project.untitled,
    date: fileLocalStamp(date),
    schemes: project.schemes.length,
    marks: project.marks.length,
    version: FORMAT_VERSION,
  }) + "\n";
}

// Имя записи плана в архиве: одно место и на упаковку, и на сверку.
function imageEntryName(id, blob) {
  return SCHEMES_DIR + encodeImageId(id) + "." + extensionFor(blob && blob.type);
}

// Текст project.json. Объект проводится через ту же нормализацию, что и при
// чтении: тогда сверка сравнивает текст с текстом, а не «почти то же самое».
function projectJsonText(project) {
  return JSON.stringify(migrateProject({ ...project, formatVersion: FORMAT_VERSION }), null, 2);
}

/** Имя для выгрузки: «<объект>-<дата>.zip». */
function projectFileName(project, now) {
  const date = now instanceof Date ? now : new Date();
  const day = fileLocalDay(date);
  const raw = String((project && project.name) || strings.project.untitled);
  const safe = raw
    .replace(/[\\/:*?"<>|\x00-\x1f]+/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .slice(0, 60);
  return (safe || strings.project.untitled) + "-" + day + ".zip";
}

/**
 * Упаковывает объект и планы в один zip.
 * `images` — Map «imageId → Blob» (или ничего, если планов нет); картинки кладутся
 * как есть, без пережатия. `options.onProgress({done, total, name})`.
 */
async function packProject(project, images, options = {}) {
  if (!looksLikeProject(project)) throw fileError("foreignProject");
  const date = options.date instanceof Date ? options.date : new Date();
  const forFile = migrateProject({ ...project, formatVersion: FORMAT_VERSION });
  const onProgress = typeof options.onProgress === "function" ? options.onProgress : null;

  const files = [{ name: PROJECT_ENTRY, data: projectJsonText(forFile) }];
  for (const [id, blob] of imageEntries(images)) {
    if (!id || !blob) continue;
    files.push({ name: imageEntryName(id, blob), data: blob, compress: false });
  }
  files.push({ name: README_ENTRY, data: readmeText(forFile, date) });

  const blob = await writeZip(files, {
    date,
    compress: options.compress,
    onProgress: onProgress ? (step) => onProgress({ ...step, phase: "pack" }) : undefined,
  });

  // Файл проекта — единственная настоящая резервная копия объекта. Отдать его,
  // не прочитав обратно, значит узнать о сбое записи в день восстановления,
  // когда восстанавливать будет уже нечего.
  if (options.verify !== false) await verifyProjectFile(blob, forFile, images, { onProgress });
  return blob;
}

/**
 * Сверяет собранный архив с тем, что в него клали: читает его обратно тем же
 * кодом, которым его прочитает пользователь, и сравнивает по существу — текст
 * `project.json`, разобранный объект, состав и содержимое планов, наличие
 * `README.txt`. Расхождение — ошибка `fileCheckFailed` с указанием места.
 *
 * Планы сверяются длиной и CRC32 исходных байтов против распакованных.
 * `readZip` уже сверил каждую запись с контрольной суммой из её заголовка;
 * здесь замыкается вторая половина — что в заголовок попала сумма тех самых
 * байтов, которые клали. Побайтовое сравнение дало бы ровно тот же ответ
 * дороже: лишний проход по всем планам и вторая их копия в памяти.
 */
async function verifyProjectFile(blob, project, images, options = {}) {
  const onProgress = typeof options.onProgress === "function" ? options.onProgress : null;
  const expected = imageEntries(images).filter(([id, image]) => id && image);
  const expectedJson = projectJsonText(project);

  let entries;
  let restored;
  try {
    // Полный проход чтения: сходятся CRC всех записей, разбирается project.json.
    entries = await readZip(blob);
    restored = readProjectEntries(entries, null);
  } catch (error) {
    throw fileError("fileCheckFailed", {
      part: (error && (error.entry || error.message)) || PROJECT_ENTRY,
    });
  }

  if (!entries.has(PROJECT_ENTRY) || decodeText(entries.get(PROJECT_ENTRY)) !== expectedJson) {
    throw fileError("fileCheckFailed", { part: PROJECT_ENTRY });
  }
  // И то же самое глазами читателя: объект, который поднимется из файла,
  // должен совпасть с упакованным, а не просто «разобраться без ошибок».
  if (JSON.stringify(restored.project, null, 2) !== expectedJson) {
    throw fileError("fileCheckFailed", { part: PROJECT_ENTRY });
  }
  if (!entries.has(README_ENTRY)) throw fileError("fileCheckFailed", { part: README_ENTRY });

  const packedNames = [...entries.keys()].filter((name) => name.startsWith(SCHEMES_DIR));
  if (packedNames.length !== expected.length || restored.images.size !== expected.length) {
    throw fileError("fileCheckFailed", { part: SCHEMES_DIR });
  }

  for (let index = 0; index < expected.length; index += 1) {
    const [id, image] = expected[index];
    const name = imageEntryName(id, image);
    const stored = entries.get(name);
    const source = await toBytes(image);
    if (!stored || !restored.images.has(id)) throw fileError("fileCheckFailed", { part: name });
    if (stored.length !== source.length || crc32(stored) !== crc32(source)) {
      throw fileError("fileCheckFailed", { part: name });
    }
    if (onProgress) onProgress({ done: index + 1, total: expected.length, name, phase: "check" });
  }

  return {
    ok: true,
    bytes: blob && typeof blob.size === "number" ? blob.size : 0,
    marks: restored.project.marks.length,
    schemes: restored.project.schemes.length,
    images: expected.length,
  };
}

// Свой архив кладёт project.json в корень; перепакованный вместе с папкой —
// на уровень глубже. Из нескольких кандидатов берётся самый неглубокий:
// сравниваются префиксы с префиксами, а не имя файла с префиксом.
function projectPrefix(entries) {
  let prefix = null;
  for (const name of entries.keys()) {
    if (name === PROJECT_ENTRY) return "";
    if (name.endsWith("/" + PROJECT_ENTRY)) {
      const candidate = name.slice(0, -PROJECT_ENTRY.length);
      if (prefix === null || candidate.length < prefix.length) prefix = candidate;
    }
  }
  return prefix;
}

/**
 * Читает файл проекта: `{project, images}`, где images — Map «imageId → Blob».
 * Чужой или битый файл отвергается ошибкой с `.code` из strings.errors,
 * текущий объект при этом не трогается — вызывающий получает исключение
 * до того, как что-то заменит.
 */
async function unpackProject(blob, options = {}) {
  if (!blob) throw fileError("notAProject");
  const entries = await readZip(blob);
  return readProjectEntries(entries, typeof options.onProgress === "function" ? options.onProgress : null);
}

// Сборка объекта из уже прочитанных записей. Отдельно от `unpackProject`
// потому, что сверка (`verifyProjectFile`) читает архив один раз и смотрит
// и на записи, и на собранный объект: второй полный проход по десятку планов
// стоит дороже всей упаковки.
function readProjectEntries(entries, onProgress) {
  const prefix = projectPrefix(entries);
  if (prefix === null) throw fileError("noProjectJson");

  let loaded;
  try {
    loaded = JSON.parse(decodeText(entries.get(prefix + PROJECT_ENTRY)));
  } catch {
    throw fileError("brokenProjectJson");
  }
  if (!looksLikeProject(loaded)) throw fileError("foreignProject");
  const project = migrateProject(loaded);

  const imageNames = [...entries.keys()].filter(
    (name) => name.startsWith(prefix + SCHEMES_DIR) && name.length > (prefix + SCHEMES_DIR).length,
  );
  const images = new Map();
  for (let index = 0; index < imageNames.length; index += 1) {
    const name = imageNames[index];
    const tail = name.slice((prefix + SCHEMES_DIR).length);
    const dot = tail.lastIndexOf(".");
    const id = decodeImageId(dot > 0 ? tail.slice(0, dot) : tail);
    const type = typeForExtension(dot > 0 ? tail.slice(dot + 1) : "");
    images.set(id, new Blob([entries.get(name)], type ? { type } : undefined));
    if (onProgress) onProgress({ done: index + 1, total: imageNames.length, name });
  }

  return { project, images };
}

// src/merge.js
// Слияние двух экземпляров одного объекта. Чистый модуль: ни DOM, ни файлов —
// на вход два объекта и общий предок (если он есть), на выход слитый объект и
// перечень того, что разошлось.
//
// Зачем оно вообще: общая папка (WebDAV, облачный диск) даёт двум инженерам
// один проект, но синхронизацию файлов делает не наш код. Кто записал
// последним, тот и затёр — если сливать по файлу целиком. Поэтому сливаем по
// сущностям: чаще всего двое ставят **разные** метки, и такие правки обязаны
// сложиться без единого вопроса; спорное — редкость, и о нём надо сказать.
//
// Правило на спор одно и симметричное: побеждает сторона, чей объект правился
// позже (`updatedAt`), при равенстве — та, у кого меньше `id`. Симметричное
// потому, что обе стороны считают его из одной и той же пары и приходят к
// одному ответу: иначе файлы в папке ходили бы по кругу, переписывая друг
// друга. Проигравший вариант не пропадает молча — он попадает в `conflicts`.
//
// Правка важнее удаления: если одна сторона сущность удалила, а вторая
// правила, сущность остаётся (с пометкой в `conflicts`). Вернуть лишнюю метку
// — минута работы, восстановить потерянную — некому.

// Сущности объекта, которые сливаются поимённо, по `id`.
//
// `equipmentTypes` здесь такой же справочник, как `categories` и `markTypes`:
// без него слитый объект брал бы типы только у «нас», и заведённое вторым
// участником («Реле 4 канала») пропадало бы молча вместе с колонкой типа у его
// моделей.
const MERGE_ENTITIES = [
  "categories",
  "markTypes",
  "rooms",
  "schemes",
  "marks",
  "groups",
  "outlines",
  "equipmentTypes",
  "equipment",
  "placements",
];

// Коллекции, у которых есть поле `order`: после слияния порядок пересобирается.
const MERGE_ORDERED = ["categories", "markTypes", "schemes", "equipmentTypes", "equipment"];

// Коллекции, которых у объекта прежней разметки нет вовсе. Слияние двух таких
// объектов не должно заводить их пустыми: это была бы правка на пустом месте,
// и два одинаковых файла перестали бы сливаться в «ничего не изменилось».
const MERGE_OPTIONAL = ["outlines", "equipmentTypes", "equipment", "placements"];

/**
 * Принятые предупреждения: **объединение по ключу, а не конфликт.**
 *
 * «Так и задумано» — это ответ на вопрос, а не правка разметки. Если один
 * ответил, а второй нет, вопрос уже отвечен, и повторно спрашивать второго
 * незачем: никто при этом не теряет работу, у обоих остаётся тот же объект.
 *
 * **Чего эта механика не умеет и почему.** Запись принятия либо есть, либо её
 * нет — следа от снятия не остаётся. Значит «второй ещё не принимал» и «второй
 * вернул принятое в работу» для слияния выглядят одинаково, и объединение в
 * обоих случаях оставит принятие. Сторона выбрана сознательно: лишняя строка
 * «принято» снимается одним нажатием и видна в панели целиком, а потерянные
 * ответы пришлось бы давать заново по всему объекту — и молча. Тому, кто
 * вернул строку в работу, достаточно вернуть её ещё раз после обмена файлами.
 *
 * Дублей не появляется: ключ у записи один, и повторный обмен файлами ничего
 * не добавляет. Своя запись при совпадении ключа остаётся своей — у неё своё
 * время принятия и свой текст на момент ответа.
 */
function mergeAccepted(merged, ours, theirs) {
  const mine = mergeList(ours, "accepted");
  const other = mergeList(theirs, "accepted");
  // Ни у кого нет даже поля — объект прежней разметки остаётся как был.
  if (mine.length === 0 && other.length === 0) {
    if (!Array.isArray(ours.accepted) && !Array.isArray(theirs.accepted)) return;
    merged.accepted = Array.isArray(ours.accepted) ? ours.accepted : [];
    return;
  }
  const keys = new Set(mine.map((item) => item && item.key).filter(Boolean));
  const added = other.filter((item) => item && item.key && !keys.has(item.key));
  merged.accepted = added.length === 0 ? mine : [...mine, ...added];
}

function mergeList(project, key) {
  return project && Array.isArray(project[key]) ? project[key] : [];
}

function mergeIndex(list) {
  const index = new Map();
  for (const item of list) {
    if (item && typeof item.id === "string") index.set(item.id, item);
  }
  return index;
}

// Сравнение по содержимому, устойчивое к порядку ключей: один и тот же объект,
// прошедший через JSON и миграцию на другой машине, обязан считаться равным.
function mergeText(value) {
  if (value === null || typeof value !== "object") return JSON.stringify(value) || "null";
  if (Array.isArray(value)) return "[" + value.map(mergeText).join(",") + "]";
  const keys = Object.keys(value).sort();
  return "{" + keys.map((key) => JSON.stringify(key) + ":" + mergeText(value[key])).join(",") + "}";
}

function mergeSame(a, b) {
  return mergeText(a) === mergeText(b);
}

// Кто выигрывает спор. Обе стороны считают это из одной пары и получают один
// ответ — иначе слияние не сходится.
function mergeWinner(ours, theirs) {
  const oursAt = String((ours && ours.updatedAt) || "");
  const theirsAt = String((theirs && theirs.updatedAt) || "");
  if (oursAt !== theirsAt) return theirsAt > oursAt ? "theirs" : "ours";
  const oursId = String((ours && ours.id) || "");
  const theirsId = String((theirs && theirs.id) || "");
  return theirsId < oursId ? "theirs" : "ours";
}

/**
 * Об одном ли объекте речь. Два человека получают проект из одного файла, и
 * идентификаторы схем и меток у них общие (свой `id` объекта и свои id картинок
 * каждый браузер выдаёт сам). Ничего общего — значит, это чужой файл, сливать
 * его нельзя.
 */
function areRelatedProjects(ours, theirs) {
  if (!ours || !theirs) return false;
  if (ours.id && ours.id === theirs.id) return true;
  for (const key of ["schemes", "marks", "rooms", "markTypes"]) {
    const mine = mergeIndex(mergeList(ours, key));
    for (const item of mergeList(theirs, key)) {
      if (mine.has(item.id)) return true;
    }
  }
  return false;
}

function mergeLabel(entity, item, typeCodes) {
  if (!item) return "";
  if (entity === "marks") {
    const code = typeCodes.get(item.typeId) || "";
    return code ? code + item.number : String(item.number || "");
  }
  if (entity === "markTypes") return item.code || item.name || "";
  return item.name || "";
}

// Слияние одной коллекции. Возвращает список сущностей и дописывает в отчёт
// то, что пришло со стороны и то, что разошлось.
function mergeCollection(entity, ours, theirs, base, report, winner) {
  const oursIndex = mergeIndex(mergeList(ours, entity));
  const theirsIndex = mergeIndex(mergeList(theirs, entity));
  const baseIndex = mergeIndex(mergeList(base, entity));
  const ids = [...oursIndex.keys()];
  for (const id of theirsIndex.keys()) {
    if (!oursIndex.has(id)) ids.push(id);
  }

  const result = [];
  for (const id of ids) {
    const mine = oursIndex.get(id) || null;
    const other = theirsIndex.get(id) || null;
    const was = baseIndex.get(id) || null;

    if (mine && other) {
      if (mergeSame(mine, other)) {
        result.push(mine);
      } else if (was && mergeSame(was, mine)) {
        result.push(other);
        report.changes.push({ entity, id, action: "updated", item: other });
      } else if (was && mergeSame(was, other)) {
        result.push(mine);
      } else {
        const kept = winner === "theirs" ? other : mine;
        result.push(kept);
        report.conflicts.push({ code: "bothChanged", entity, id, kept: winner, item: kept, other: winner === "theirs" ? mine : other });
        if (winner === "theirs") report.changes.push({ entity, id, action: "updated", item: other });
      }
      continue;
    }

    if (mine && !other) {
      // У них сущности нет. Либо они её удалили, либо у нас она только появилась.
      if (!was) {
        result.push(mine);
      } else if (mergeSame(was, mine)) {
        report.changes.push({ entity, id, action: "removed", item: mine });
      } else {
        result.push(mine);
        report.conflicts.push({ code: "deletedElsewhere", entity, id, kept: "ours", item: mine });
      }
      continue;
    }

    if (!mine && other) {
      if (!was) {
        result.push(other);
        report.changes.push({ entity, id, action: "added", item: other });
      } else if (mergeSame(was, other)) {
        // Удалили мы, они не трогали — сущность остаётся удалённой.
      } else {
        result.push(other);
        report.conflicts.push({ code: "deletedHere", entity, id, kept: "theirs", item: other });
        report.changes.push({ entity, id, action: "added", item: other });
      }
    }
  }

  if (MERGE_ORDERED.includes(entity)) {
    result.sort((a, b) => {
      const byOrder = (Number(a.order) || 0) - (Number(b.order) || 0);
      if (byOrder !== 0) return byOrder;
      return String(a.id) < String(b.id) ? -1 : 1;
    });
    return result.map((item, index) => (item.order === index ? item : { ...item, order: index }));
  }
  return result;
}

// Счётчики номеров: номер не переиспользуется, поэтому берётся больший.
function mergeCounters(ours, theirs) {
  const counters = { ...((ours && ours.counters) || {}) };
  for (const [code, value] of Object.entries((theirs && theirs.counters) || {})) {
    const mine = Number(counters[code]) || 0;
    const other = Number(value) || 0;
    counters[code] = Math.max(mine, other);
  }
  return counters;
}

/**
 * Кластеры совместного номера.
 *
 * Метки, уже стоявшие под одним обозначением **в одном объекте** — у нас, у
 * них или в общем предке, — спорить между собой не могут: это намеренный
 * повтор, приём заказчика (G25, G96), а не столкновение двух счётчиков.
 * Такие метки собираются в кластер и дальше живут одним номером на всех.
 *
 * Отношение считается по каждому обозначению отдельно: метки, делившие «Т1»,
 * не становятся роднёй под «С5», куда одна из них потом переехала.
 *
 * Возвращает `(key, markId) -> id кластера`; одиночка сама себе кластер.
 */
function mergeNumberClusters(sources, codes) {
  const byKey = new Map();
  const find = (parent, id) => {
    let root = id;
    while (parent.get(root) !== root) root = parent.get(root);
    let step = id;
    while (parent.get(step) !== root) {
      const next = parent.get(step);
      parent.set(step, root);
      step = next;
    }
    return root;
  };
  for (const source of sources) {
    if (!source) continue;
    const groups = new Map();
    for (const mark of mergeList(source, "marks")) {
      const code = mark && codes.get(mark.typeId);
      if (!code || typeof mark.id !== "string") continue;
      const key = code + "|" + mark.number;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(mark.id);
    }
    for (const [key, ids] of groups) {
      if (ids.length < 2) continue;
      let parent = byKey.get(key);
      if (!parent) {
        parent = new Map();
        byKey.set(key, parent);
      }
      for (const id of ids) if (!parent.has(id)) parent.set(id, id);
      const root = find(parent, ids[0]);
      for (const id of ids) {
        const other = find(parent, id);
        if (other !== root) parent.set(other, root);
      }
    }
  }
  return (key, markId) => {
    const parent = byKey.get(key);
    return parent && parent.has(markId) ? find(parent, markId) : markId;
  };
}

/**
 * Номера после слияния.
 *
 * Двое поставили по «Р15»: номер выдаётся счётчиком в пределах объекта, и в
 * разных браузерах он один и тот же. Разводить надо ровно такие метки — и
 * только их. Повтор номера сам по себе не поломка: несколько точечных
 * светильников одной группы носят «Т1» нарочно, модель это бережёт
 * (`compactNumbers`), и слияние обязано беречь тоже. Номер уже написан на
 * схеме, в таблице и в голове у монтажника, а результат слияния применяется
 * без спроса и обрывает историю — переписать его молча нельзя.
 *
 * Поэтому разводятся не метки, а **кластеры**: намеренная группа переезжает на
 * новый номер целиком, оставаясь группой. На номере остаётся кластер из общего
 * предка (его и написали на схеме), при равенстве — с меньшим id метки.
 * Правило симметрично: обе стороны считают его из одной пары и приходят к
 * одному ответу, иначе файлы в папке ходили бы по кругу.
 *
 * Возвращает `{marks, moves}`; `moves` — переезды намеренных повторов, по ним
 * переселяются принятые предупреждения.
 */
function mergeNumbers(marks, types, counters, sources, report) {
  const codes = new Map(types.map((type) => [type.id, type.code]));
  const known = mergeIndex(mergeList(sources.base, "marks"));
  const clusterOf = mergeNumberClusters([sources.base, sources.ours, sources.theirs], codes);

  const byKey = new Map();
  for (const mark of marks) {
    const code = codes.get(mark.typeId);
    if (!code || typeof mark.id !== "string") continue;
    const key = code + "|" + mark.number;
    let clusters = byKey.get(key);
    if (!clusters) {
      clusters = new Map();
      byKey.set(key, clusters);
    }
    const id = clusterOf(key, mark.id);
    let cluster = clusters.get(id);
    if (!cluster) {
      cluster = { key, code, number: mark.number, marks: [], inBase: false, minId: mark.id };
      clusters.set(id, cluster);
    }
    cluster.marks.push(mark);
    if (known.has(mark.id)) cluster.inBase = true;
    if (mark.id < cluster.minId) cluster.minId = mark.id;
  }

  // Занято всё, что в слитом объекте уже стоит: на каждом обозначении кто-то
  // да остаётся.
  const taken = new Set(byKey.keys());
  const moving = [];
  const staying = new Map();
  for (const [key, clusters] of byKey) {
    const list = [...clusters.values()];
    list.sort((a, b) => {
      const byBase = (a.inBase ? 0 : 1) - (b.inBase ? 0 : 1);
      if (byBase !== 0) return byBase;
      return a.minId < b.minId ? -1 : 1;
    });
    staying.set(key, list[0]);
    for (const cluster of list.slice(1)) moving.push(cluster);
  }
  if (moving.length === 0) return { marks, moves: [] };

  // Порядок выдачи не зависит от того, чей файл назвали «нашим».
  moving.sort((a, b) => (a.key === b.key ? (a.minId < b.minId ? -1 : 1) : a.key < b.key ? -1 : 1));

  const fixed = new Map();
  const moves = [];
  for (const cluster of moving) {
    const code = cluster.code;
    let next = Math.max(Number(counters[code]) || 0, Number(cluster.number) || 0);
    let candidate;
    do {
      next += 1;
      candidate = code + "|" + next;
    } while (taken.has(candidate));
    taken.add(candidate);
    counters[code] = Math.max(Number(counters[code]) || 0, next);
    for (const mark of cluster.marks) fixed.set(mark.id, next);
    report.renumbered.push({
      markId: cluster.marks[0].id,
      markIds: cluster.marks.map((mark) => mark.id),
      code,
      from: cluster.number,
      to: next,
    });
    // Переехал намеренный повтор — вместе с ним переезжает и ответ «так и
    // задумано». Одиночной метке переносить нечего: вопроса о повторе на её
    // новом номере не возникнет.
    const typeIds = new Set(cluster.marks.map((mark) => mark.typeId));
    if (cluster.marks.length > 1 && typeIds.size === 1) {
      const rest = staying.get(cluster.key);
      moves.push({
        typeId: cluster.marks[0].typeId,
        code,
        from: cluster.number,
        to: next,
        // Старый номер остаётся повтором — значит вопрос там не снят, и ответ
        // не переезжает, а копируется.
        keepFrom: rest.marks.length > 1 && rest.marks[0].typeId === cluster.marks[0].typeId,
      });
    }
  }
  return {
    marks: marks.map((mark) => (fixed.has(mark.id) ? { ...mark, number: fixed.get(mark.id) } : mark)),
    moves,
  };
}

// Ссылки на то, чего в слитом объекте нет: висячая ссылка хуже отсутствующей.
// Снимается одним проходом, каждая потеря — в отчёт.
function mergeReferences(merged, report) {
  const schemes = mergeIndex(merged.schemes);
  const rooms = mergeIndex(merged.rooms);
  const types = mergeIndex(merged.markTypes);
  const categories = mergeIndex(merged.categories);

  merged.markTypes = merged.markTypes.filter((type) => {
    if (categories.has(type.categoryId)) return true;
    report.conflicts.push({ code: "danglingRef", entity: "markTypes", id: type.id, kept: "none", item: type });
    return false;
  });
  const liveTypes = mergeIndex(merged.markTypes);

  merged.marks = merged.marks.filter((mark) => {
    if (schemes.has(mark.schemeId) && liveTypes.has(mark.typeId)) return true;
    report.conflicts.push({ code: "danglingRef", entity: "marks", id: mark.id, kept: "none", item: mark });
    return false;
  });
  const marks = mergeIndex(merged.marks);

  merged.groups = merged.groups
    .map((group) => {
      const markIds = (group.markIds || []).filter((id) => marks.has(id));
      return markIds.length === group.markIds.length ? group : { ...group, markIds };
    })
    .filter((group) => {
      if (schemes.has(group.schemeId) && (group.markIds || []).length > 1) return true;
      report.conflicts.push({ code: "danglingRef", entity: "groups", id: group.id, kept: "none", item: group });
      return false;
    });
  const groups = mergeIndex(merged.groups);

  merged.outlines = merged.outlines.filter((outline) => {
    if (schemes.has(outline.schemeId) && rooms.has(outline.roomId)) return true;
    report.conflicts.push({ code: "danglingRef", entity: "outlines", id: outline.id, kept: "none", item: outline });
    return false;
  });

  // Тип модели: у единицы он необязателен, и «тип не заполнен» — не поломка, а
  // ссылка в никуда — поломка (модель читает тип через `findEquipmentType` и
  // покажет пустую колонку, ничего не сказав). Тип могли удалить на одной
  // стороне, пока на другой его вешали на новую модель: сам справочник
  // сливается наравне с остальными, а вот такую ссылку снимаем — вслух.
  const equipmentTypes = mergeIndex(merged.equipmentTypes);
  merged.equipment = merged.equipment.map((item) => {
    if (!item.typeId || equipmentTypes.has(item.typeId)) return item;
    report.conflicts.push({ code: "danglingType", entity: "equipment", id: item.id, kept: "ours", item });
    return { ...item, typeId: "" };
  });

  const equipment = mergeIndex(merged.equipment);
  merged.placements = merged.placements
    .map((placement) => {
      const links = Array.isArray(placement.links) ? placement.links.filter((id) => marks.has(id)) : placement.links;
      return Array.isArray(links) && links.length !== placement.links.length ? { ...placement, links } : placement;
    })
    .filter((placement) => {
      if (equipment.has(placement.equipmentId) && marks.has(placement.markId)) return true;
      report.conflicts.push({ code: "danglingRef", entity: "placements", id: placement.id, kept: "none", item: placement });
      return false;
    });

  merged.marks = merged.marks.map((mark) => {
    const patch = {};
    if (mark.groupId && !groups.has(mark.groupId)) patch.groupId = null;
    if (mark.roomId && !rooms.has(mark.roomId)) patch.roomId = null;
    const controls = Array.isArray(mark.controls) ? mark.controls.filter((id) => marks.has(id)) : mark.controls;
    if (Array.isArray(controls) && controls.length !== mark.controls.length) patch.controls = controls;
    return Object.keys(patch).length === 0 ? mark : { ...mark, ...patch };
  });
  // Типы после чистки могли уехать: `types` держим ради ясности сравнения выше.
  void types;
  return merged;
}

/**
 * Сливает два экземпляра одного объекта.
 *
 * `base` — общий предок (последний снимок, который видели обе стороны); без
 * него слияние становится объединением: удаления не видны, потому что «нет
 * сущности» и «сущность удалили» снаружи выглядят одинаково.
 *
 * Возвращает `{project, changed, changes, conflicts, renumbered, counts}`:
 * `changes` — что пришло со стороны (added | updated | removed) с подписью
 * каждой сущности, `conflicts` — где стороны разошлись и чей вариант оставлен.
 */
function mergeProjects(ours, theirs, base, options = {}) {
  if (!ours || !theirs) return { project: ours || theirs || null, changed: false, changes: [], conflicts: [], renumbered: [], counts: { added: 0, updated: 0, removed: 0, conflicts: 0, renumbered: 0 } };

  const winner = options.winner === "ours" || options.winner === "theirs" ? options.winner : mergeWinner(ours, theirs);
  const ancestor = base && areRelatedProjects(ours, base) ? base : null;
  const report = { changes: [], conflicts: [], renumbered: [] };

  const merged = { ...ours };
  // Коллекция, которой не знала ни одна сторона, так и остаётся незаведённой:
  // список пуст и заводить его не на чем.
  const absent = [];
  for (const entity of MERGE_ENTITIES) {
    merged[entity] = mergeCollection(entity, ours, theirs, ancestor, report, winner);
    if (
      MERGE_OPTIONAL.includes(entity) &&
      !Array.isArray(ours[entity]) &&
      !Array.isArray(theirs[entity])
    ) {
      absent.push(entity);
    }
  }

  merged.counters = mergeCounters(ours, theirs);
  mergeAccepted(merged, ours, theirs);
  const numbered = mergeNumbers(merged.marks, merged.markTypes, merged.counters, { ours, theirs, base: ancestor }, report);
  merged.marks = numbered.marks;
  // Ответы «так и задумано» едут за своими обозначениями: вопрос уже задан и
  // закрыт, а переспросить слияние не может — оно применяется молча.
  const accepted = renumberAcceptedRepeats(merged, numbered.moves);
  if (accepted) merged.accepted = accepted;
  mergeReferences(merged, report);
  for (const entity of absent) {
    if (merged[entity].length === 0) delete merged[entity];
  }

  // Имя и настройки вида — те же правила, что и у сущностей.
  if (!mergeSame(ours.name, theirs.name)) {
    const keptName = winner === "theirs" ? theirs.name : ours.name;
    merged.name = keptName;
    report.conflicts.push({ code: "bothChanged", entity: "name", id: ours.id, kept: winner, item: { name: keptName }, other: { name: winner === "theirs" ? ours.name : theirs.name } });
  }
  if (!mergeSame(ours.view, theirs.view)) merged.view = winner === "theirs" ? theirs.view : ours.view;
  if (theirs.createdAt && (!merged.createdAt || theirs.createdAt < merged.createdAt)) merged.createdAt = theirs.createdAt;
  merged.updatedAt = String(theirs.updatedAt || "") > String(ours.updatedAt || "") ? theirs.updatedAt : ours.updatedAt;

  // Подписи для отчёта считаются по слитому справочнику: тип метки мог приехать
  // тем же слиянием.
  const typeCodes = new Map(merged.markTypes.map((type) => [type.id, type.code]));
  for (const change of report.changes) change.label = mergeLabel(change.entity, change.item, typeCodes);
  for (const conflict of report.conflicts) conflict.label = mergeLabel(conflict.entity, conflict.item, typeCodes);

  const counts = {
    added: report.changes.filter((change) => change.action === "added").length,
    updated: report.changes.filter((change) => change.action === "updated").length,
    removed: report.changes.filter((change) => change.action === "removed").length,
    conflicts: report.conflicts.length,
    renumbered: report.renumbered.length,
  };

  return {
    project: merged,
    changed: !mergeSame(ours, merged),
    changes: report.changes,
    conflicts: report.conflicts,
    renumbered: report.renumbered,
    counts,
  };
}

// src/autosave.js
// Файл проекта на диске: приёмка загруженного архива, автосохранение в папку
// и отметка «когда в последний раз выгружали».
//
// Почему отдельно от панели: здесь нет ни одной строки DOM — значит, приёмку
// загрузки (самое опасное место: чужие идентификаторы) можно проверить тестом,
// а панель остаётся тонкой. Zip читает и пишет только `projectFile.js`.





// Ключи настроек: ручка папки (структурно клонируется в IndexedDB как есть)
// и отметки последней выгрузки по объектам.
const AUTOSAVE_FOLDER_KEY = "autosaveFolder";
const AUTOSAVE_EXPORT_KEY = "lastFileExport";
// Задержка больше, чем у сохранения в браузер (400 мс): запись на диск дороже,
// и пачка правок должна уложиться в одну запись.
const AUTOSAVE_DELAY_MS = 1500;
// Как часто снимок в папке перечитывается с диска и сверяется с объектом.
const AUTOSAVE_VERIFY_MS = 10 * 60 * 1000;
// Как часто заглядывать в папку за чужими правками. Пять секунд: синхронизацию
// файлов делает не наш код (WebDAV, облачный диск), и до папки чужая правка
// доезжает секундами; человек за это время не успевает уйти далеко, а сам опрос
// читает только служебные данные о файлах — тела архивов не трогаются, пока не
// изменилось время записи.
const AUTOSAVE_WATCH_MS = 5000;

let autosaveHandle = null;
let autosavePermission = "none"; // none | prompt | granted | denied
let autosaveExports = null;
let autosaveTimer = null;
let autosaveRunning = false;
let autosavePending = null;
let autosaveLastError = null;
let autosaveVerified = null;
// Последний снимок, который видели обе стороны: общий предок для слияния.
let autosaveBase = null;
// Время записи нашего снимка в папку. Всё, что старше, мы уже учли — и это
// же защита от «протухшего» файла: вчерашний снимок, попавший в слияние как
// чужая правка, откатил бы нашу работу.
let autosaveSyncSince = 0;
// Что мы уже прочитали из папки: имя файла -> время его записи. Общая
// отметка времени тут не годится — в папке пишут трое, и файл второго,
// прочитанный после файла третьего, иначе остался бы незамеченным.
let autosaveSeen = new Map();
let autosaveWatchTimer = null;
let autosaveWatchBusy = false;
const autosaveListeners = new Set();

// ——— приёмка загруженного файла ———————————————————————————————————————

// Архив приходит с чужими идентификаторами: и объекта, и картинок. Оставить их
// как есть нельзя — вторая загрузка того же файла перезаписала бы объект в базе
// и перемешала картинки с чужими. Поэтому всё переприсваивается здесь, разом,
// вместе со ссылками `scheme.imageId`; ссылка на картинку, которой в архиве не
// оказалось, обнуляется — схема без плана честнее схемы со ссылкой в никуда.
function adoptLoadedProject(loaded, options = {}) {
  const source = loaded && loaded.project ? loaded.project : null;
  if (!source) throw new Error(strings.errors.foreignProject);
  const mode = options.mode === "replace" ? "replace" : "new";
  const newId = typeof options.newId === "function" ? options.newId : () => crypto.randomUUID();

  const sourceImages = loaded.images instanceof Map ? loaded.images : new Map(loaded.images || []);
  // Идентификаторы картинок приходят снаружи, когда их уже выдало хранилище
  // браузера (`store.putImage`): переприсваивание остаётся одной операцией,
  // и панели не приходится перекладывать ссылки второй раз.
  const given = options.imageIds instanceof Map ? options.imageIds : null;
  const remap = new Map();
  const images = new Map();
  for (const [oldId, blob] of sourceImages) {
    if (!blob) continue;
    const id = (given && given.get(oldId)) || newId();
    remap.set(oldId, id);
    images.set(id, blob);
  }

  const schemes = (source.schemes || []).map((scheme) => ({
    ...scheme,
    imageId: scheme.imageId && remap.has(scheme.imageId) ? remap.get(scheme.imageId) : null,
  }));

  const base = {
    ...source,
    id: mode === "replace" && options.currentId ? options.currentId : newId(),
    schemes,
  };
  // Отметку времени ставит модель: свой мутатор объекта в сборке не заводится.
  return { project: updateProject(base).project, images, mode };
}

// Картинки текущего объекта для упаковки: `packProject` принимает только Map.
async function autosaveCollectImages(project) {
  const images = new Map();
  for (const scheme of (project && project.schemes) || []) {
    if (!scheme.imageId || images.has(scheme.imageId)) continue;
    const blob = await getImage(scheme.imageId);
    if (blob) images.set(scheme.imageId, blob);
  }
  return images;
}

// Имя снимка в папке автосохранения. Файл в папке живёт рядом с чужими и
// переписывается сам, поэтому одного имени объекта мало: два объекта с
// одинаковым именем (а такие заводятся сами — например, файл, загруженный
// дважды) писали бы в один файл и затирали друг друга. Имя строит всё тот же
// `projectFileName`, идентификатор дописывается к нему.
function autosaveSnapshotName(project, date) {
  const base = projectFileName(project, date);
  const tag = String((project && project.id) || "").replace(/[^0-9a-z]/gi, "").slice(0, 8).toLowerCase();
  return tag ? base.replace(/\.zip$/, "-" + tag + ".zip") : base;
}

function autosaveVerifyKey(project, images) {
  const ids = images instanceof Map ? [...images.keys()] : [];
  return String((project && project.id) || "") + "|" + ids.sort().join(",");
}

// Сверять каждую запись в папку не нужно и вредно: правки идут пачками раз в
// полторы секунды, а сверка — полный проход по всем планам объекта (на десятке
// планов по паре мегабайт это сотни миллисекунд на каждую правку, и они лягут
// на тот же поток, что рисует холст). Сбой записи — свойство не отдельной
// правки, а пары «эти данные + этот браузер»: если архив из этих планов
// собрался верно, через минуту он соберётся так же. Меняется это ровно тогда,
// когда меняется состав планов. Поэтому сверяются: первая запись в папку,
// первая после ошибки, первая после смены состава планов — и дальше не реже
// раза в десять минут. Запись «Сохранить в файл» сверяется всегда: этот файл
// пользователь уносит с собой как резервную копию.
function autosaveVerifyDue(project, images, now) {
  if (autosaveLastError) return true;
  if (!autosaveVerified) return true;
  if (autosaveVerified.key !== autosaveVerifyKey(project, images)) return true;
  const moment = now instanceof Date ? now.getTime() : Date.now();
  return moment - autosaveVerified.at >= AUTOSAVE_VERIFY_MS;
}

// Новая папка — снимок в ней ещё ни разу не проверен.
function autosaveResetVerify() {
  autosaveVerified = null;
}

function autosaveMarkVerified(project, images, date) {
  autosaveVerified = {
    key: autosaveVerifyKey(project, images),
    at: (date instanceof Date ? date : new Date()).getTime(),
  };
}

// Один путь упаковки на всю панель: и «Сохранить в файл», и запись в папку.
async function autosavePack(project, options = {}) {
  const images = await autosaveCollectImages(project);
  const date = options.date instanceof Date ? options.date : new Date();
  const blob = await packProject(project, images, {
    date,
    onProgress: options.onProgress,
    verify: options.verify,
  });
  return { blob, name: projectFileName(project, date), images };
}

// ——— папка ————————————————————————————————————————————————————————————

function autosaveSupported() {
  return typeof window !== "undefined" && typeof window.showDirectoryPicker === "function";
}
function autosaveReady() {
  return Boolean(autosaveHandle) && autosavePermission === "granted";
}
function autosaveStatus() {
  return {
    supported: autosaveSupported(),
    folder: autosaveHandle ? autosaveHandle.name : null,
    permission: autosavePermission,
    busy: autosaveRunning,
    error: autosaveLastError,
  };
}
function onAutosaveChange(listener) {
  autosaveListeners.add(listener);
  return () => autosaveListeners.delete(listener);
}

function autosaveAnnounce() {
  const status = autosaveStatus();
  for (const listener of [...autosaveListeners]) {
    try {
      listener(status);
    } catch (ignored) {
      /* подписчик не должен ломать запись */
    }
  }
}

async function autosaveQueryPermission(handle) {
  if (!handle) return "none";
  if (typeof handle.queryPermission !== "function") return "granted";
  try {
    return await handle.queryPermission({ mode: "readwrite" });
  } catch (error) {
    return "denied";
  }
}

// При старте: ручка из прошлого сеанса ещё жива, но разрешение могло
// «остыть» — тогда панель покажет кнопку «Разрешить», и второй раз выбирать
// папку не придётся.
async function autosaveRestore() {
  autosaveExports = (await getSetting(AUTOSAVE_EXPORT_KEY)) || {};
  if (!autosaveSupported()) return autosaveStatus();
  let handle = null;
  try {
    handle = await getSetting(AUTOSAVE_FOLDER_KEY);
  } catch (error) {
    handle = null;
  }
  if (!handle || typeof handle.getFileHandle !== "function") {
    autosaveHandle = null;
    autosavePermission = "none";
    return autosaveStatus();
  }
  autosaveHandle = handle;
  autosavePermission = await autosaveQueryPermission(handle);
  autosaveAnnounce();
  return autosaveStatus();
}

// Только из обработчика клика: браузер спрашивает папку лишь по жесту.
async function autosavePickFolder() {
  if (!autosaveSupported()) return autosaveStatus();
  const handle = await window.showDirectoryPicker({ id: "scheme-markup", mode: "readwrite" });
  autosaveHandle = handle;
  autosavePermission = await autosaveQueryPermission(handle);
  if (autosavePermission !== "granted") await autosaveGrant();
  autosaveLastError = null;
  autosaveResetVerify();
  autosaveResetSync();
  await setSetting(AUTOSAVE_FOLDER_KEY, handle);
  autosaveAnnounce();
  return autosaveStatus();
}
async function autosaveGrant() {
  if (!autosaveHandle || typeof autosaveHandle.requestPermission !== "function") return autosaveStatus();
  try {
    autosavePermission = await autosaveHandle.requestPermission({ mode: "readwrite" });
  } catch (error) {
    autosavePermission = "denied";
  }
  autosaveAnnounce();
  return autosaveStatus();
}
async function autosaveForget() {
  autosaveHandle = null;
  autosavePermission = "none";
  autosaveLastError = null;
  autosaveResetVerify();
  autosaveResetSync();
  autosaveStopWatch();
  if (autosaveTimer) {
    clearTimeout(autosaveTimer);
    autosaveTimer = null;
  }
  autosavePending = null;
  await setSetting(AUTOSAVE_FOLDER_KEY, null);
  autosaveAnnounce();
  return autosaveStatus();
}

// ——— запись ———————————————————————————————————————————————————————————
async function autosaveWrite(project, options = {}) {
  if (!project) return { ok: false, reason: "noProject" };
  if (!autosaveReady()) return { ok: false, reason: "noFolder" };
  autosaveRunning = true;
  autosaveAnnounce();
  try {
    const date = options.date instanceof Date ? options.date : new Date();
    // Сверку здесь делает не упаковка, а чтение уже записанного файла: так
    // проверка захватывает и запись на диск, а не только сборку в памяти.
    const packedFile = await autosavePack(project, { ...options, date, verify: false });
    const name = autosaveSnapshotName(project, date);
    const fileHandle = await autosaveHandle.getFileHandle(name, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(packedFile.blob);
    await writable.close();
    const due =
      options.verify === true ||
      (options.verify !== false && autosaveVerifyDue(project, packedFile.images, date));
    if (due) {
      const written =
        typeof fileHandle.getFile === "function" ? await fileHandle.getFile() : packedFile.blob;
      await verifyProjectFile(written, project, packedFile.images);
      autosaveMarkVerified(project, packedFile.images, date);
    }
    autosaveLastError = null;
    // Записанный снимок — новая общая точка отсчёта: с ней сливаются чужие
    // правки, и по её времени отсекаются файлы, которые мы уже учли.
    autosaveBase = project;
    if (typeof fileHandle.getFile === "function") {
      const stamp = await fileHandle.getFile();
      autosaveSyncSince = Math.max(autosaveSyncSince, stamp.lastModified || 0);
      autosaveSeen.set(name, stamp.lastModified || 0);
    } else {
      autosaveSyncSince = Math.max(autosaveSyncSince, date.getTime());
    }
    const at = await autosaveNoteExport(project.id, options.at);
    // Объект возвращается вместе с результатом: пока шла запись, пользователь
    // мог успеть поправить ещё раз — панели надо знать, что именно легло в файл.
    return { ok: true, name, at, project };
  } catch (error) {
    // Разрешение могли отозвать между правками — тогда панель снова покажет
    // кнопку «Разрешить», а не будет молча терять записи.
    if (error && error.name === "NotAllowedError") autosavePermission = "prompt";
    autosaveLastError = error;
    return { ok: false, error };
  } finally {
    autosaveRunning = false;
    autosaveAnnounce();
  }
}

// Правки идут пачками: пишем не чаще, чем раз в AUTOSAVE_DELAY_MS, и никогда
// двумя записями сразу — правка, пришедшая во время записи, ждёт её конца.
function autosaveSchedule(project, options = {}) {
  if (!autosaveReady() || !project) return false;
  autosavePending = project;
  if (autosaveTimer) clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => {
    autosaveTimer = null;
    autosaveFlush(options);
  }, typeof options.delay === "number" ? options.delay : AUTOSAVE_DELAY_MS);
  return true;
}

// Есть ли незаписанная правка: отложенная, ожидающая очереди или та, что
// пишется прямо сейчас. Вкладка спрашивает об этом перед закрытием.
function autosavePendingWrite() {
  return Boolean(autosaveTimer || autosavePending || autosaveRunning);
}
async function autosaveFlush(options = {}) {
  if (autosaveTimer) {
    clearTimeout(autosaveTimer);
    autosaveTimer = null;
  }
  if (autosaveRunning || !autosavePending) return { ok: false, reason: "idle" };
  const project = autosavePending;
  autosavePending = null;
  const result = await autosaveWrite(project, options);
  if (typeof options.onDone === "function") options.onDone(result);
  // Пока писали, могла прийти новая правка — её запись ставим в очередь.
  if (autosavePending) autosaveSchedule(autosavePending, options);
  return result;
}

// ——— общая папка: чужие правки ————————————————————————————————————————
//
// Папку кладут в WebDAV или облачный диск, и над объектом работают вдвоём.
// Синхронизацию файлов делает не наш код: наше дело — заметить, что файл в
// папке изменился не нами, и слить чужую работу со своей, а не затереть.
// У каждого браузера свой файл снимка (имя включает идентификатор объекта):
// у файла ровно один писатель, а читают файлы все. Двум писателям в один файл
// поверх WebDAV всё равно никто не даст договориться — блокировок там нет.
function autosaveBaseProject() {
  return autosaveBase;
}

// Забыть общую точку: другая папка — другая история.
function autosaveResetSync() {
  autosaveBase = null;
  autosaveSyncSince = 0;
  autosaveSeen = new Map();
}

async function autosaveFolderEntries() {
  const entries = [];
  if (!autosaveHandle || typeof autosaveHandle.values !== "function") return entries;
  for await (const entry of autosaveHandle.values()) {
    if (entry.kind === "file" && /\.zip$/i.test(entry.name)) entries.push(entry);
  }
  return entries;
}

// Планы из чужого файла кладутся в хранилище под своими идентификаторами:
// схема ссылается на картинку по id из файла, и переименовать его значит
// развести ссылки двух браузеров.
async function autosaveAdoptImages(project, images) {
  if (!(images instanceof Map)) return 0;
  const needed = new Set((project.schemes || []).map((scheme) => scheme.imageId).filter(Boolean));
  let added = 0;
  for (const [id, blob] of images) {
    if (!needed.has(id) || !blob) continue;
    if (await getImage(id)) continue;
    await putImage(blob, id);
    added += 1;
  }
  return added;
}

/**
 * Один проход по папке: ищет файлы, записанные после нашего снимка, и сливает
 * первый, в котором действительно есть чужая работа. Возвращает результат
 * слияния (`merge.js`) с именем файла и числом принятых планов — или `null`,
 * если сливать нечего.
 */
async function autosaveScanExternal(project, options = {}) {
  if (!project || !autosaveReady() || autosaveRunning || autosaveWatchBusy) return null;
  autosaveWatchBusy = true;
  try {
    const since = typeof options.since === "number" ? options.since : autosaveSyncSince;
    for (const entry of await autosaveFolderEntries()) {
      const file = await entry.getFile();
      const at = file.lastModified || 0;
      // Файл, который мы уже читали, интересен только если его переписали;
      // незнакомый — только если он новее нашего снимка. Второе и есть защита
      // от протухшего файла: всё, что старше, мы либо писали сами, либо учли.
      const seenAt = autosaveSeen.get(entry.name);
      if (seenAt !== undefined ? at <= seenAt : at <= since) continue;
      autosaveSeen.set(entry.name, at);
      let loaded = null;
      try {
        loaded = await unpackProject(file);
      } catch (error) {
        // В общей папке лежит и чужое: битый или посторонний архив — не повод
        // ломать сеанс, просто не наш файл.
        continue;
      }
      if (!areRelatedProjects(project, loaded.project)) continue;
      const merged = mergeProjects(project, loaded.project, autosaveBase);
      if (!merged.changed) continue;
      const plans = await autosaveAdoptImages(merged.project, loaded.images);
      return { ...merged, file: entry.name, at, plans };
    }
    return null;
  } finally {
    autosaveWatchBusy = false;
  }
}

// Опрос папки. Останавливается сам, когда папку забыли или сменили.
function autosaveWatch(options = {}) {
  const getProject = typeof options.getProject === "function" ? options.getProject : () => null;
  const onExternal = typeof options.onExternal === "function" ? options.onExternal : () => {};
  const delay = typeof options.interval === "number" ? options.interval : AUTOSAVE_WATCH_MS;
  autosaveStopWatch();

  const tick = async () => {
    autosaveWatchTimer = null;
    // Вкладка в фоне не опрашивает папку: вернётся — и сразу посмотрит.
    const hidden = typeof document !== "undefined" && document.hidden;
    if (!hidden) {
      try {
        const result = await autosaveScanExternal(getProject());
        if (result) onExternal(result);
      } catch (error) {
        autosaveLastError = error;
      }
    }
    autosaveWatchTimer = setTimeout(tick, delay);
  };
  autosaveWatchTimer = setTimeout(tick, delay);
  return autosaveStopWatch;
}
function autosaveStopWatch() {
  if (autosaveWatchTimer) clearTimeout(autosaveWatchTimer);
  autosaveWatchTimer = null;
}

// ——— «выгружено N назад» ———————————————————————————————————————————————
async function autosaveNoteExport(projectId, at) {
  const stamp = at || new Date().toISOString();
  if (!projectId) return stamp;
  if (!autosaveExports) autosaveExports = (await getSetting(AUTOSAVE_EXPORT_KEY)) || {};
  autosaveExports = { ...autosaveExports, [projectId]: stamp };
  await setSetting(AUTOSAVE_EXPORT_KEY, autosaveExports);
  autosaveAnnounce();
  return stamp;
}
function autosaveLastExport(projectId) {
  if (!projectId || !autosaveExports) return null;
  return autosaveExports[projectId] || null;
}

// Русские числительные: «1 минуту», «2 минуты», «5 минут». Одиннадцать —
// исключение из правила последней цифры, поэтому второй десяток проверяется
// отдельно.
function autosavePlural(count, forms) {
  const tail = Math.abs(count) % 100;
  const last = tail % 10;
  if (tail > 10 && tail < 20) return forms[2];
  if (last === 1) return forms[0];
  if (last > 1 && last < 5) return forms[1];
  return forms[2];
}

// «в файл выгружено: 3 дня назад». Момент сравнения передаётся явно — так
// строку можно проверить тестом, не подменяя часы.
function autosaveAgoText(at, now) {
  const words = strings.autosave.ago;
  const stamp = at ? Date.parse(at) : Number.NaN;
  if (Number.isNaN(stamp)) return words.never;
  const moment = now instanceof Date ? now.getTime() : Date.now();
  const minutes = Math.floor(Math.max(0, moment - stamp) / 60000);
  if (minutes < 1) return words.justNow;
  if (minutes < 60) return text("autosave.ago.pattern", { count: minutes, word: autosavePlural(minutes, words.minutes) });
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return text("autosave.ago.pattern", { count: hours, word: autosavePlural(hours, words.hours) });
  const days = Math.floor(hours / 24);
  return text("autosave.ago.pattern", { count: days, word: autosavePlural(days, words.days) });
}

// src/app.js
// Каркас сеанса: состояние, реестр панелей, уведомления.
// Панели других тасков монтируются по идентификатору контейнера из index.html
// и не правят ни этот файл, ни разметку.

  tools: "panel-tools",

  sizes: "panel-sizes",

// пользователь ищет, куда делись инструменты.
const SECTION_DEFAULT_COLLAPSED = [SECTION_IDS.sizes];

const LAYOUT_MODES = ["desktop", "mobile"];

const LAYOUT_PHONE_SIDE = 560;

// умение нужно назвать здесь, иначе оно считается правкой и на телефон не идёт.
const LAYOUT_ABILITIES = {
  viewPlan: ["desktop", "mobile"],
  switchProject: ["desktop", "mobile"],
  switchScheme: ["desktop", "mobile"],
  markList: ["desktop", "mobile"],
  filters: ["desktop", "mobile"],
  tables: ["desktop", "mobile"],
  exportFiles: ["desktop", "mobile"],
  openFile: ["desktop", "mobile"],
  search: ["desktop", "mobile"],
  // Предупреждения — про правку объекта: в них отвечают на вопрос о виде типа

  warnings: ["desktop"],
  undo: ["desktop"],
  saveFile: ["desktop"],
  editMarks: ["desktop"],
  editSchemes: ["desktop"],
  editRooms: ["desktop"],
  editProject: ["desktop"],

function layoutModeFor(view, override) {
  if (override === "mobile" || override === "desktop") return override;
  const source = view || {};
  const width = Number(source.width) || 0;
  const height = Number(source.height) || 0;
  const shortSide = height > 0 ? Math.min(width, height) : width;
  if (source.coarsePointer && shortSide > 0 && shortSide <= LAYOUT_PHONE_SIDE) return "mobile";
  if (width > 0 && width <= LAYOUT_NARROW_WIDTH) return "mobile";

// Неизвестное умение доступным не считается: опечатка в имени спрячет кнопку,

  const modes = LAYOUT_ABILITIES[ability];

}

const appCollapsed = new Set();
let appLayoutOverride = null;
let appSheet = "none";

// Что кладётся в настройки: список свёрнутых разделов. Мусор из хранилища
// (чужая версия, битое значение) не должен схлопывать панель — он отбрасывается.
function sectionListFrom(value) {
  if (!Array.isArray(value)) return [];
  const known = new Set(Object.values(SECTION_IDS));
  return [...new Set(value.filter((id) => typeof id === "string" && known.has(id)))];
}

// Чего ещё не выбирал пользователь — то показываем по умолчанию; пустой

const appSubscribers = new Set();
const appPanels = new Map();
const appMounted = new Map();

// Снимок: вложенные filter/view/selectedMarkIds копируются, чтобы правка
// на месте в панели не меняла состояние сеанса мимо setState.
function getState() {
  return {
    ...appState,
    selectedMarkIds: [...appState.selectedMarkIds],
    filter: { ...appState.filter },
    view: { ...appState.view },

}

  if (!patch) return getState();
  const changed = {};
  for (const [key, value] of Object.entries(patch)) {
    if (appState[key] !== value) {
      appState[key] = value;
      changed[key] = value;
    }
  }
  if (Object.keys(changed).length === 0) return getState();
  const snapshot = getState();
  for (const subscriber of [...appSubscribers]) {
    try {
      subscriber(snapshot, changed);
    } catch (error) {
      reportAppError(error);
    }
  }
