<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-text="app.title"></title>
    <style>
/* Холст разметки, подсказка поверх него и панель инструментов. */

.canvas {
  display: block;
  touch-action: none; /* щипок и панорама разбираются сами, браузер не мешает */
  background: transparent;
}

.canvas-hint {
  position: absolute;
  left: 12px;
  top: 12px;
  max-width: 460px;
  padding: 6px 10px;
  border: 1px solid var(--canvas-line);
  border-left-width: 4px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.92);
  color: #57606a;
  font-size: 12px;
  line-height: 1.35;
}

.tools {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.tools__label {
  margin: 6px 0 0;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--panel-muted);
}

.tools__type {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--panel-line);
  background: #21262d;
  color: var(--panel-text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.tools__type.is-set {
  border-color: var(--accent);
}

.tools__type:hover {
  border-color: var(--panel-muted);
}

.tools__code {
  font-weight: 700;
  font-size: 15px;
}

.tools__typeName {
  color: var(--panel-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tools__row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tools__row--modes .ui-btn {
  flex: 1 1 auto;
}

.ui-btn.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.tools__field {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--panel-muted);
}

.tools__field > span {
  min-width: 68px;
}

.tools__slider {
  flex: 1 1 auto;
  min-width: 0;
  accent-color: var(--accent);
}

/* Окно выбора типа */

.picker {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(420px, 78vw);
}

.picker__list {
  max-height: 46vh;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.picker__group {
  margin-top: 8px;
  padding: 2px 0 2px 8px;
  border-left: 3px solid var(--panel-line);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.picker__row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--panel-text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.picker__row:hover,
.picker__row.is-active {
  background: #21262d;
  border-color: var(--panel-line);
}

.picker__swatch {
  flex: 0 0 auto;
}

.picker__code {
  font-weight: 700;
  min-width: 26px;
}

.picker__name {
  color: var(--panel-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.picker__create {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--panel-line);
}

.picker__create:empty {
  display: none;
}

.picker__createTitle {
  margin: 0;
  font-size: 12px;
  color: var(--panel-muted);
}

.picker__field {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--panel-muted);
}

.picker__field > span {
  min-width: 82px;
}

.picker__error {
  margin: 0;
  color: #ff9aa2;
  font-size: 12px;
}

.picker__error:empty {
  display: none;
}

/* Кнопки, поля, диалоги и списки панелей. Тёмная панель — светлый холст. */

.ui-btn {
  font: inherit;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--panel-line);
  background: #21262d;
  color: var(--panel-text);
  cursor: pointer;
  white-space: nowrap;
}

.ui-btn:hover:not(:disabled) {
  border-color: var(--panel-muted);
}

.ui-btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.ui-btn--accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.ui-btn--danger:hover:not(:disabled) {
  border-color: var(--danger);
  color: #ff9aa2;
}

.ui-btn--wide {
  display: block;
  width: 100%;
  padding: 7px 8px;
  margin-bottom: 10px;
}

.ui-select,
.ui-input {
  font: inherit;
  padding: 4px 6px;
  border-radius: 6px;
  border: 1px solid var(--panel-line);
  background: #21262d;
  color: var(--panel-text);
  max-width: 220px;
}

.ui-input {
  width: 100%;
  max-width: none;
}

#project-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ——— диалоги ——————————————————————————————————————————————————————— */

.modal {
  width: min(92vw, 720px);
  max-height: 90vh;
  overflow: auto;
  padding: 16px 18px;
  border-radius: 10px;
  border: 1px solid var(--panel-line);
  background: var(--panel-bg);
  color: var(--panel-text);
  box-shadow: 0 24px 64px rgba(1, 4, 9, 0.6);
}

.modal__title {
  margin: 0 0 10px;
  font-size: 15px;
}

.modal__text {
  margin: 0;
  color: var(--panel-text);
}

.modal__hint {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--panel-muted);
}

.modal__actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 14px;
}

/* ——— правка плана ——————————————————————————————————————————————————— */

.plan-editor__tools {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

.plan-stage {
  position: relative;
  display: flex;
  justify-content: center;
  background: var(--panel-bg-deep);
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  padding: 8px;
  user-select: none;
  touch-action: none;
}

.plan-stage__img {
  max-width: 100%;
  max-height: 58vh;
  display: block;
  cursor: crosshair;
}

.plan-frame {
  position: absolute;
  border: 1px dashed var(--accent);
  background: rgba(31, 111, 235, 0.18);
  pointer-events: none;
}

/* ——— список схем ————————————————————————————————————————————————————— */

.scheme-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.scheme-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 2px 6px;
  padding: 5px 6px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: #1c2129;
}

.scheme-row--current {
  border-color: var(--accent);
}

.scheme-row__name {
  font: inherit;
  text-align: left;
  padding: 0;
  border: 0;
  background: none;
  color: var(--panel-text);
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.scheme-row__meta {
  grid-column: 1;
  font-size: 11px;
  color: var(--panel-muted);
}

.scheme-row__tools {
  grid-column: 2;
  grid-row: 1 / span 2;
  display: flex;
  gap: 2px;
}

.scheme-row__tools .ui-btn {
  padding: 2px 5px;
  font-size: 12px;
}

#canvas-area.is-dropping::after {
  content: attr(data-drop);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #0b4ea2;
  font-weight: 600;
  position: absolute;
  inset: 8px;
  border: 2px dashed var(--accent);
  border-radius: 10px;
  background: rgba(31, 111, 235, 0.08);
  pointer-events: none;
  z-index: 5;
}

:root {
  --panel-bg: #161b22;
  --panel-bg-deep: #0d1117;
  --panel-line: #30363d;
  --panel-text: #e6edf3;
  --panel-muted: #8b949e;
  --canvas-bg: #f6f8fa;
  --canvas-line: #d0d7de;
  --canvas-text: #1f2328;
  --accent: #1f6feb;
  --danger: #d1242f;
  --ok: #2da44e;
  --panel-width: 264px;
  --header-height: 48px;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--canvas-text);
  background: var(--panel-bg-deep);
  overflow: hidden;
}

#app {
  display: grid;
  grid-template-columns: var(--panel-width) 1fr var(--panel-width);
  grid-template-rows: var(--header-height) 1fr;
  grid-template-areas:
    "header header header"
    "left canvas right";
  height: 100vh;
}

#app-header {
  grid-area: header;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 12px;
  background: var(--panel-bg-deep);
  border-bottom: 1px solid var(--panel-line);
  color: var(--panel-text);
}

#app-brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  white-space: nowrap;
}

#app-title {
  font-weight: 600;
}

#app-subtitle,
#project-label {
  color: var(--panel-muted);
  font-size: 12px;
}

#project-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

#project-name {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 40vw;
}

#header-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel {
  background: var(--panel-bg);
  color: var(--panel-text);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

#panel-left {
  grid-area: left;
  border-right: 1px solid var(--panel-line);
}

#panel-right {
  grid-area: right;
  border-left: 1px solid var(--panel-line);
}

.panel__section {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-bottom: 1px solid var(--panel-line);
}

.panel__section--grow {
  flex: 1 1 auto;
}

.panel__title {
  margin: 0;
  padding: 10px 12px 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--panel-muted);
}

.panel__body {
  padding: 0 12px 12px;
  overflow: auto;
  min-height: 0;
}

#canvas-area {
  grid-area: canvas;
  position: relative;
  background: var(--canvas-bg);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#canvas-host,
#canvas-overlay {
  position: absolute;
  inset: 0;
}

#canvas-overlay {
  pointer-events: none;
}

#canvas-empty {
  position: relative;
  max-width: 280px;
  padding: 16px 20px;
  border: 1px dashed var(--canvas-line);
  border-radius: 8px;
  color: #57606a;
  background: #fff;
  text-align: center;
}

#app.has-scheme #canvas-empty {
  display: none;
}

#dialog-host:empty {
  display: none;
}

#dialog-host {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(1, 4, 9, 0.55);
}

#notifications {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 360px;
}

.toast {
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid var(--panel-line);
  background: var(--panel-bg);
  color: var(--panel-text);
  box-shadow: 0 8px 24px rgba(1, 4, 9, 0.4);
}

.toast--error {
  border-color: var(--danger);
}

.toast--success {
  border-color: var(--ok);
}

.panel__empty {
  color: var(--panel-muted);
  font-size: 12px;
  margin: 4px 0 0;
}

    </style>
</head>
  <body>
    <div id="app">
      <header id="app-header">
        <div id="app-brand">
          <span id="app-title" data-text="app.title"></span>
          <span id="app-subtitle" data-text="app.subtitle"></span>
        </div>
        <div id="project-bar">
          <span id="project-label" data-text="header.project"></span>
          <span id="project-name" data-text="header.noProject"></span>
          <div id="project-actions" class="mount"></div>
        </div>
        <div id="header-actions" class="mount"></div>
      </header>

      <aside id="panel-left" class="panel">
        <section class="panel__section">
          <h2 class="panel__title" data-text="panels.tools"></h2>
          <div id="panel-tools" class="panel__body mount"></div>
        </section>
        <section class="panel__section panel__section--grow">
          <h2 class="panel__title" data-text="panels.schemes"></h2>
          <div id="panel-schemes" class="panel__body mount"></div>
        </section>
      </aside>

      <main id="canvas-area">
        <div id="canvas-host" class="mount"></div>
        <div id="canvas-overlay" class="mount"></div>
        <p id="canvas-empty" data-text="panels.canvasEmpty"></p>
      </main>

      <aside id="panel-right" class="panel">
        <section class="panel__section panel__section--grow">
          <h2 class="panel__title" data-text="panels.marks"></h2>
          <div id="panel-marks" class="panel__body mount"></div>
        </section>
        <section class="panel__section">
          <h2 class="panel__title" data-text="panels.properties"></h2>
          <div id="panel-properties" class="panel__body mount"></div>
        </section>
      </aside>

      <div id="dialog-host" class="mount"></div>
      <div id="notifications"></div>
    </div>

// strings.errors.codeTaken и подобные — шаблоны с {переменными}.
function text(key, vars) {
  let value = key.split(".").reduce((node, part) => (node == null ? node : node[part]), strings);
  if (typeof value !== "string") return key;
  if (vars) {
    for (const [name, replacement] of Object.entries(vars)) {
      value = value.split("{" + name + "}").join(String(replacement));
    }
  }
  return value;
}

// src/app.js
// Каркас сеанса: состояние, реестр панелей, уведомления.
// Панели других тасков монтируются по идентификатору контейнера из index.html
// и не правят ни этот файл, ни разметку.

// Контейнеры-точки монтирования (идентификаторы из src/index.html).
const PANEL_IDS = {
  tools: "panel-tools",
  schemes: "panel-schemes",
  marks: "panel-marks",
  properties: "panel-properties",
  canvas: "canvas-host",
  overlay: "canvas-overlay",
  headerActions: "header-actions",
  projectActions: "project-actions",
  dialogs: "dialog-host",
};

const appState = {
  project: null,
  schemeId: null,
  selectedMarkIds: [],
  activeTypeId: null,
  mode: "select",
  filter: { categoryIds: null, typeIds: null, roomId: null, query: "" },
  view: { zoom: 1, offsetX: 0, offsetY: 0 },
  dirty: false,
};

const appSubscribers = new Set();
const appPanels = new Map();
const appMounted = new Map();
let appStarted = false;

// Снимок: вложенные filter/view/selectedMarkIds копируются, чтобы правка
// на месте в панели не меняла состояние сеанса мимо setState.
function getState() {
  return {
    ...appState,
    selectedMarkIds: [...appState.selectedMarkIds],
    filter: { ...appState.filter },
    view: { ...appState.view },
  };
}
function setState(patch) {
  if (!patch) return getState();
  const changed = {};
  for (const [key, value] of Object.entries(patch)) {
    if (appState[key] !== value) {
      appState[key] = value;
      changed[key] = value;
    }
  }
  if (Object.keys(changed).length === 0) return getState();
  const snapshot = getState();
  for (const subscriber of [...appSubscribers]) {
    try {
      subscriber(snapshot, changed);
    } catch (error) {
      reportAppError(error);
    }
  }
  syncCanvasClass();
  syncProjectName();
  return snapshot;
}
function subscribe(listener) {
  appSubscribers.add(listener);
  return () => appSubscribers.delete(listener);
}

// Регистрация панели: если каркас уже поднят — монтируем сразу.
function registerPanel(id, mountFn) {
  if (typeof mountFn !== "function") return;
  appPanels.set(id, mountFn);
  if (appStarted) mountPanel(id);
}
function panelApi() {
  return { getState, setState, subscribe, notify, strings, text };
}

function mountPanel(id) {
  const mountFn = appPanels.get(id);
  const host = document.getElementById(id);
  if (!mountFn || !host || appMounted.get(id) === mountFn) return;
  try {
    mountFn(host, panelApi());
    appMounted.set(id, mountFn);
  } catch (error) {
    reportAppError(error);
  }
}
function notify(message, kind = "info") {
  const host = typeof document === "undefined" ? null : document.getElementById("notifications");
  if (!host) return null;
  const toast = document.createElement("div");
  toast.className = "toast toast--" + kind;
  toast.textContent = String(message);
  toast.title = strings.notify.close;
  toast.addEventListener("click", () => toast.remove());
  host.append(toast);
  setTimeout(() => toast.remove(), kind === "error" ? 12000 : 6000);
  return toast;
}

function reportAppError(error) {
  notify(error && error.message ? error.message : String(error), "error");
}

// Все видимые строки приходят из словаря: разметка держит только ключи.
function applyStrings(root) {
  const scope = root || document;
  for (const node of scope.querySelectorAll("[data-text]")) {
    node.textContent = text(node.dataset.text);
  }
  for (const node of scope.querySelectorAll("[data-title]")) {
    node.title = text(node.dataset.title);
  }
}

function syncProjectName() {
  const node = document.getElementById("project-name");
  if (!node) return;
  node.textContent = appState.project ? appState.project.name : strings.header.noProject;
}

function syncCanvasClass() {
  const app = document.getElementById("app");
  if (!app) return;
  app.classList.toggle("has-scheme", Boolean(appState.schemeId));
}
function startApp() {
  if (appStarted) return;
  appStarted = true;
  applyStrings(document);
  syncProjectName();
  syncCanvasClass();
  for (const id of appPanels.keys()) mountPanel(id);
}

// Старт откладывается за границу текущего скрипта: в собранном файле панели
// и модели определяются ниже по бандлу, и каркас не должен опережать их.
if (typeof document !== "undefined") {
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startApp, { once: true });
  } else {
    setTimeout(startApp, 0);
  }
}

// src/model.js
// Правила объекта: справочники, метки, группы, нумерация.
// Чистый модуль: ни DOM, ни хранилища. Все функции возвращают новый объект,
// исходный не меняется.
const FORMAT_VERSION = 1;
const SHAPE_NAMES = ["circle", "circle-cross", "square", "triangle", "star", "diamond", "hexagon"];
const BLOCK_MODES = ["each", "single"];
const MARK_KINDS = ["point", "line"];

// Шаг соседней точки блока в пикселях плана (доля считается от размера схемы).
const BLOCK_STEP_PX = 28;
// Размер плана, по которому считается шаг, пока схема не знает своих пикселей.
const BLOCK_FALLBACK_SIZE_PX = 1000;
// Цвет метки, когда категория недоступна.
const FALLBACK_COLOR = "#8B949E";
const BLOCK_SIDES = ["left", "right", "up", "down"];

const DEFAULT_VIEW = { markSize: 10, labelSize: 12 };

const TEMPLATE_CATEGORIES = [
  { key: "light", name: strings.categories.light, color: "#1F6FEB", shape: "circle-cross" },
  { key: "switches", name: strings.categories.switches, color: "#2DA44E", shape: "circle" },
  { key: "sockets", name: strings.categories.sockets, color: "#D1242F", shape: "square" },
  { key: "climate", name: strings.categories.climate, color: "#E36209", shape: "triangle" },
  { key: "network", name: strings.categories.network, color: "#8250DF", shape: "star" },
];

const TEMPLATE_TYPES = [
  { category: "light", code: "Т", name: strings.types.spot },
  { category: "light", code: "С", name: strings.types.lamp },
  { category: "light", code: "ПК", name: strings.types.bedLight },
  { category: "light", code: "ТР", name: strings.types.track },
  { category: "light", code: "П", name: strings.types.backlight },
  { category: "light", code: "Л", name: strings.types.strip },
  { category: "light", code: "ПШ", name: strings.types.wardrobeLight },
  { category: "switches", code: "В", name: strings.types.switch },
  { category: "switches", code: "ВВ", name: strings.types.switchDouble },
  { category: "sockets", code: "Р", name: strings.types.socket },
  { category: "climate", code: "Б", name: strings.types.breezer },
  { category: "climate", code: "К", name: strings.types.conditioner },
  { category: "network", code: "W", name: strings.types.wifi },
];

function newId() {
  return globalThis.crypto.randomUUID();
}

function nowIso() {
  return new Date().toISOString();
}

function modelError(key, vars) {
  const error = new Error(text("errors." + key, vars));
  error.code = key;
  return error;
}

function clone(value) {
  return value == null ? value : structuredClone(value);
}

// Новый объект проекта с обновлённым updatedAt; списки подменяются поштучно.
function withProject(project, patch) {
  return { ...project, ...patch, updatedAt: nowIso() };
}
function defaultTemplate() {
  // Идентификаторы новые на каждый вызов: два объекта не делят ни категорию, ни тип.
  const categoryIds = new Map(TEMPLATE_CATEGORIES.map((category) => [category.key, newId()]));
  const categories = TEMPLATE_CATEGORIES.map((category, index) => ({
    id: categoryIds.get(category.key),
    name: category.name,
    color: category.color,
    shape: category.shape,
    order: index,
  }));
  const markTypes = TEMPLATE_TYPES.map((type, index) => ({
    id: newId(),
    categoryId: categoryIds.get(type.category),
    code: type.code,
    name: type.name,
    shape: null,
    blockMode: "each",
    order: index,
  }));
  return { categories, markTypes };
}
function createProject(template) {
  const source = template && template.categories && template.markTypes ? clone(template) : defaultTemplate();
  const stamp = nowIso();
  return {
    formatVersion: FORMAT_VERSION,
    id: newId(),
    name: (template && template.name) || strings.project.untitled,
    createdAt: stamp,
    updatedAt: stamp,
    categories: source.categories.map((category, index) => ({ ...category, order: index })),
    markTypes: source.markTypes.map((type, index) => ({
      shape: null,
      blockMode: "each",
      ...type,
      order: index,
    })),
    rooms: source.rooms ? clone(source.rooms) : [],
    schemes: [],
    marks: [],
    groups: [],
    counters: {},
    view: { ...DEFAULT_VIEW, ...(source.view || {}) },
  };
}

// ——— поиск ———————————————————————————————————————————————————————————
function findScheme(project, schemeId) {
  return project.schemes.find((scheme) => scheme.id === schemeId) || null;
}
function findType(project, typeId) {
  return project.markTypes.find((type) => type.id === typeId) || null;
}
function findCategory(project, categoryId) {
  return project.categories.find((category) => category.id === categoryId) || null;
}
function findMark(project, markId) {
  return project.marks.find((mark) => mark.id === markId) || null;
}
function findGroup(project, groupId) {
  return project.groups.find((group) => group.id === groupId) || null;
}
function findRoom(project, roomId) {
  return project.rooms.find((room) => room.id === roomId) || null;
}
function markByCode(project, code, number) {
  return (
    project.marks.find((mark) => {
      const type = findType(project, mark.typeId);
      return type && type.code === code && mark.number === number;
    }) || null
  );
}

function requireScheme(project, schemeId) {
  const scheme = findScheme(project, schemeId);
  if (!scheme) throw modelError("schemeNotFound");
  return scheme;
}

function requireType(project, typeId) {
  const type = findType(project, typeId);
  if (!type) throw modelError("typeNotFound");
  return type;
}

function requireMark(project, markId) {
  const mark = findMark(project, markId);
  if (!mark) throw modelError("markNotFound");
  return mark;
}

// ——— схемы ———————————————————————————————————————————————————————————
function addScheme(project, { name, imageId = null, width = 0, height = 0 } = {}) {
  const scheme = {
    id: newId(),
    name: String(name || "").trim() || strings.project.defaultSchemeName,
    imageId,
    width,
    height,
    order: project.schemes.length,
  };
  return { project: withProject(project, { schemes: [...project.schemes, scheme] }), scheme };
}
function updateScheme(project, schemeId, patch) {
  requireScheme(project, schemeId);
  const allowed = ["name", "imageId", "width", "height", "order"];
  const schemes = project.schemes.map((scheme) =>
    scheme.id === schemeId ? { ...scheme, ...pick(patch, allowed) } : scheme,
  );
  return { project: withProject(project, { schemes }), scheme: schemes.find((s) => s.id === schemeId) };
}
function deleteScheme(project, schemeId) {
  requireScheme(project, schemeId);
  const marks = project.marks.filter((mark) => mark.schemeId !== schemeId);
  const groups = project.groups.filter((group) => group.schemeId !== schemeId);
  const schemes = project.schemes
    .filter((scheme) => scheme.id !== schemeId)
    .map((scheme, index) => ({ ...scheme, order: index }));
  return { project: withProject(project, { schemes, marks, groups }) };
}

// Единственный порядок справочника: категории по своему order, типы внутри —
// по своему. Им пользуются и окно выбора типа, и легенда в выгрузке, и таблицы:
// разойдись они — на бумаге окажется не тот порядок, что на экране.
function typesInOrder(project) {
  if (!project) return [];
  return project.categories
    .map((category, index) => ({ category, order: category.order == null ? index : category.order }))
    .sort((a, b) => a.order - b.order)
    .map(({ category }) => ({
      category,
      types: project.markTypes
        .filter((type) => type.categoryId === category.id)
        .map((type, index) => ({ type, order: type.order == null ? index : type.order }))
        .sort((a, b) => a.order - b.order)
        .map((item) => item.type),
    }))
    .filter((group) => group.types.length > 0);
}

// Порядок схем объекта — одно правило на всех: нумерация, панели и выгрузки
// обходят схемы одинаково.
function schemesInOrder(project) {
  return project.schemes
    .map((scheme, index) => ({ scheme, index }))
    .sort((a, b) => {
      const orderA = a.scheme.order ?? a.index;
      const orderB = b.scheme.order ?? b.index;
      return orderA === orderB ? a.index - b.index : orderA - orderB;
    })
    .map((item) => item.scheme);
}

function pick(source, allowed) {
  const result = {};
  if (!source) return result;
  for (const key of allowed) {
    if (Object.prototype.hasOwnProperty.call(source, key)) result[key] = clone(source[key]);
  }
  return result;
}

// ——— метки ———————————————————————————————————————————————————————————

function normalizePoints(points) {
  if (!Array.isArray(points) || points.length === 0) throw modelError("noPoints");
  return points.map((point) => ({ x: Number(point.x), y: Number(point.y) }));
}

function nextNumber(counters, code) {
  return (counters[code] || 0) + 1;
}

function makeMark({ schemeId, typeId, kind, points, number, groupId = null }) {
  return {
    id: newId(),
    schemeId,
    typeId,
    number,
    kind,
    points,
    closed: false,
    groupId,
    labelOffset: null,
    roomId: null,
    location: "",
    original: "",
  };
}
function addMark(project, { schemeId, typeId, kind = "point", points, blockMode } = {}) {
  requireScheme(project, schemeId);
  const type = requireType(project, typeId);
  if (!MARK_KINDS.includes(kind)) throw modelError("unknownKind");
  const vertices = normalizePoints(points);
  if (kind === "line" && vertices.length < 2) throw modelError("shortLine");

  const mode = blockMode || type.blockMode || "each";
  if (!BLOCK_MODES.includes(mode)) throw modelError("unknownBlockMode");

  const counters = { ...project.counters };
  const created = [];

  if (kind === "point" && vertices.length > 1 && mode === "each") {
    for (const point of vertices) {
      const number = nextNumber(counters, type.code);
      counters[type.code] = number;
      created.push(makeMark({ schemeId, typeId, kind, points: [point], number }));
    }
  } else {
    const number = nextNumber(counters, type.code);
    counters[type.code] = number;
    created.push(makeMark({ schemeId, typeId, kind, points: vertices, number }));
  }

  let groups = project.groups;
  let group = null;
  if (created.length > 1) {
    group = {
      id: newId(),
      schemeId,
      markIds: created.map((mark) => mark.id),
      labelOffset: null,
    };
    for (const mark of created) mark.groupId = group.id;
    groups = [...groups, group];
  }

  const next = withProject(project, { marks: [...project.marks, ...created], groups, counters });
  return { project: next, mark: created[0], marks: created, group };
}

// ——— обозначения —————————————————————————————————————————————————————
function labelOf(project, id) {
  const mark = findMark(project, id);

  const group = findGroup(project, id);

    else seenCodes.set(key, type.id);

// src/render.js
// Рисование схемы и попадание по метке.
//
// Две системы координат. В объекте метки лежат долями плана (0…1) — так поворот
// и обрезка картинки не двигают разметку. На экране (и в экспорте) точка плана

// умноженная на размер плана и на масштаб.
//
// `view` для рисования — это `{zoom, offsetX, offsetY, markSize, labelSize}`:
// первые три приходят из состояния сеанса (`state.view`), последние два — из
// объекта (`project.view`), их двигает ползунок в панели инструментов. Размер
// метки задан в пикселях плана, поэтому метка живёт на плане как наклейка:
// приближение увеличивает и её, а экспорт в двойном разрешении даёт тот же вид.
const SHAPES = SHAPE_NAMES;

const STAR_INNER = 0.45;

const LABEL_GAP = 1.5;

const SHAPE_ANGLES = {
  square: [-135, -45, 45, 135],
  triangle: [-90, 30, 150],
  diamond: [-90, 0, 90, 180],
  hexagon: [-90, -30, 30, 90, 150, 210],

function polarPoint(x, y, radius, degrees) {
  const angle = (degrees * Math.PI) / 180;
  return { x: x + radius * Math.cos(angle), y: y + radius * Math.sin(angle) };

// Геометрия фигуры в экранных пикселях: круг или список вершин.
function shapeGeometry(shape, x, y, size) {
  const radius = Math.max(1, size);
  if (shape === "star") {
    const points = [];
    for (let index = 0; index < 10; index += 1) {
      const long = index % 2 === 0;
      points.push(polarPoint(x, y, long ? radius : radius * STAR_INNER, -90 + index * 36));
    }
    return { kind: "polygon", points, cx: x, cy: y, r: radius, cross: false };
  }
  const angles = SHAPE_ANGLES[shape];

    return {
      kind: "polygon",

// Одна фигура — одним кодом и на экране, и в экспорте.
function drawShape(ctx, shape, x, y, size, color) {
  const geometry = shapeGeometry(shape, x, y, size);

  ctx.lineWidth = line;
  ctx.fillStyle = "#ffffff";
  ctx.strokeStyle = color;
  ctx.beginPath();
  if (geometry.kind === "circle") {
    ctx.arc(geometry.cx, geometry.cy, geometry.r, 0, Math.PI * 2);

    geometry.points.forEach((point, index) => {
      if (index === 0) ctx.moveTo(point.x, point.y);
      else ctx.lineTo(point.x, point.y);

    ctx.closePath();

  ctx.fill();
  ctx.stroke();
  if (geometry.cross) {
    const arm = geometry.r * Math.SQRT1_2;
    ctx.beginPath();
    ctx.moveTo(geometry.cx - arm, geometry.cy - arm);
    ctx.lineTo(geometry.cx + arm, geometry.cy + arm);
    ctx.moveTo(geometry.cx + arm, geometry.cy - arm);
    ctx.lineTo(geometry.cx - arm, geometry.cy + arm);

function visibleMarks(project, scheme, filter) {
  if (!project || !scheme) return [];
  return project.marks.filter((mark) => mark.schemeId === scheme.id && markVisible(project, mark, filter));
}

// ——— подписи —————————————————————————————————————————————————————————

// Точка привязки подписи: для одиночной метки — её точка, для группы — середина
// между входящими метками. Смещение подписи хранится в пикселях плана, поэтому
// поворот плана уносит её вместе с меткой.
function labelOrigin(project, target) {
  if (target.markIds) {
    const points = target.markIds
      .map((id) => project.marks.find((mark) => mark.id === id))
      .filter(Boolean)
      .map((mark) => mark.points[0]);
    if (points.length === 0) return { x: 0, y: 0 };
    const sum = points.reduce((acc, point) => ({ x: acc.x + point.x, y: acc.y + point.y }), { x: 0, y: 0 });
    return { x: sum.x / points.length, y: sum.y / points.length };
  }
  return target.points[0];
}

// Смещение подписи. У группы своего поля модель не заводит — её подпись стоит
// по смещению первой метки блока (собственной подписи у этой метки нет,
// подпись у блока одна), и правится оно обычным updateMark.
function labelOffsetOf(project, target) {
  if (!target.markIds) return target.labelOffset || null;
  if (target.labelOffset) return target.labelOffset;
  const first = project.marks.find((mark) => mark.id === target.markIds[0]);
  return first && first.labelOffset ? first.labelOffset : null;
}
function labelBox(project, scheme, target, view) {
  const state = renderView(view);
  const font = labelFontSize(state);
  const radius = markRadius(state);
  const anchor = planToScreen(labelOrigin(project, target), scheme, state);
  const offset = labelOffsetOf(project, target);
  const dx = offset ? offset.dx * state.zoom : radius * LABEL_GAP;
  const dy = offset ? offset.dy * state.zoom : -radius * LABEL_GAP;
  const value = labelOf(project, target.id) || "";
  return {
    text: value,
    x: anchor.x + dx,
    y: anchor.y + dy,
    width: Math.max(font * 0.8, value.length * font * LABEL_CHAR_RATIO),
    height: font * 1.2,
    font,
  };
}

// Подписи рисуются у меток без группы и по одной на группу.
function labelTargets(project, scheme, filter) {
  const marks = visibleMarks(project, scheme, filter);
  const targets = [];
  const seenGroups = new Set();
  for (const mark of marks) {
    if (!mark.groupId) {
      targets.push(mark);
      continue;
    }
    if (seenGroups.has(mark.groupId)) continue;
    seenGroups.add(mark.groupId);
    const group = findGroup(project, mark.groupId);
    if (group) targets.push(group);
    else targets.push(mark);
  }
  return targets;
}

// ——— попадание ———————————————————————————————————————————————————————

function pointInPolygon(point, points) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i, i += 1) {
    const a = points[i];
    const b = points[j];
    const crosses = a.y > point.y !== b.y > point.y;
    if (crosses && point.x < ((b.x - a.x) * (point.y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}

function distanceToSegment(point, a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const lengthSq = dx * dx + dy * dy;
  if (lengthSq === 0) return Math.hypot(point.x - a.x, point.y - a.y);
  let t = ((point.x - a.x) * dx + (point.y - a.y) * dy) / lengthSq;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(point.x - (a.x + t * dx), point.y - (a.y + t * dy));
}

function insideBox(point, box) {
  return (
    point.x >= box.x - 2 &&
    point.x <= box.x + box.width + 2 &&
    point.y >= box.y - box.height / 2 &&
    point.y <= box.y + box.height / 2
  );
}

// Точка — в экранных пикселях холста. Возвращает `{markId, part, index}`:
// `part` — `label` (подпись, её таскают отдельно), `mark` (точка или вершина
// линии), `line` (сегмент ломаной). Сверху вниз: подписи, потом метки в обратном
// порядке постановки — поздняя метка лежит выше ранней.
function hitTest(project, scheme, point, view, filter) {
  if (!project || !scheme) return null;
  const state = renderView(view);
  const radius = markRadius(state);
  const slack = radius + HIT_SLACK_PX;

  const targets = labelTargets(project, scheme, filter);
  for (let index = targets.length - 1; index >= 0; index -= 1) {
    const target = targets[index];
    const box = labelBox(project, scheme, target, state);
    if (box.text && insideBox(point, box)) {
      const markId = target.markIds ? target.markIds[0] : target.id;
      return { markId, part: "label", groupId: target.markIds ? target.id : null, index: 0 };
    }
  }

  const marks = visibleMarks(project, scheme, filter);
  for (let index = marks.length - 1; index >= 0; index -= 1) {
    const mark = marks[index];
    const style = styleOf(project, mark.typeId);
    const screen = mark.points.map((item) => planToScreen(item, scheme, state));
    for (let vertex = 0; vertex < screen.length; vertex += 1) {
      const geometry = shapeGeometry(style.shape, screen[vertex].x, screen[vertex].y, radius);
      const near =
        geometry.kind === "circle"
          ? Math.hypot(point.x - geometry.cx, point.y - geometry.cy) <= slack
          : pointInPolygon(point, geometry.points) ||
            Math.hypot(point.x - geometry.cx, point.y - geometry.cy) <= slack;
      if (near) return { markId: mark.id, part: "mark", groupId: mark.groupId, index: vertex };
    }
    if (mark.kind === "line" && screen.length > 1) {
      const last = mark.closed ? screen.length : screen.length - 1;
      for (let segment = 0; segment < last; segment += 1) {
        const a = screen[segment];
        const b = screen[(segment + 1) % screen.length];
        if (distanceToSegment(point, a, b) <= Math.max(4, radius * 0.6)) {
          return { markId: mark.id, part: "line", groupId: mark.groupId, index: segment };
        }
      }
    }
  }
  return null;
}

// ——— ручки блока —————————————————————————————————————————————————————

// Четыре «+» вокруг выделенной точки: клик ставит соседнюю точку блока.
// Ради них таск и существует: два десятка розеток ставятся без диалогов.
function handlePositions(scheme, mark, view) {
  if (!mark || mark.kind !== "point") return [];
  const state = renderView(view);
  const radius = markRadius(state);
  const gap = radius * HANDLE_GAP;
  const base = planToScreen(mark.points[mark.points.length - 1], scheme, state);
  const handleRadius = Math.max(7, Math.min(HANDLE_RADIUS, radius));
  return [
    { side: "left", x: base.x - gap, y: base.y, r: handleRadius },
    { side: "right", x: base.x + gap, y: base.y, r: handleRadius },
    { side: "up", x: base.x, y: base.y - gap, r: handleRadius },
    { side: "down", x: base.x, y: base.y + gap, r: handleRadius },
  ];
}
function hitHandle(scheme, mark, point, view) {
  for (const handle of handlePositions(scheme, mark, view)) {
    if (Math.hypot(point.x - handle.x, point.y - handle.y) <= handle.r + 2) return handle.side;
  }
  return null;
}

// ——— рисование ———————————————————————————————————————————————————————

function drawLabel(ctx, box, color) {
  if (!box.text) return;
  ctx.save();
  ctx.font = `600 ${box.font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  // Обводка-подложка: подпись читается и поверх тёмных линий плана.
  ctx.lineWidth = Math.max(2, box.font * 0.3);
  ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(255, 255, 255, 0.92)";
  ctx.strokeText(box.text, box.x, box.y);
  ctx.fillStyle = color;
  ctx.fillText(box.text, box.x, box.y);
  ctx.restore();
}

function drawMarkBody(ctx, project, scheme, mark, view, selected) {
  const style = styleOf(project, mark.typeId);
  const radius = markRadius(view);
  const screen = mark.points.map((point) => planToScreen(point, scheme, view));
  if (mark.kind === "line" && screen.length > 1) {
    ctx.save();
    ctx.strokeStyle = style.color;
    ctx.lineWidth = Math.max(2, radius * 0.5);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    screen.forEach((point, index) => (index === 0 ? ctx.moveTo(point.x, point.y) : ctx.lineTo(point.x, point.y)));
    if (mark.closed) ctx.closePath();
    ctx.stroke();
    ctx.restore();
    for (const point of screen) drawShape(ctx, "circle", point.x, point.y, Math.max(2, radius * 0.45), style.color);
  } else {
    for (const point of screen) drawShape(ctx, style.shape, point.x, point.y, radius, style.color);
  }
  if (!selected) return;
  ctx.save();
  ctx.strokeStyle = "#0969da";
  ctx.setLineDash([4, 3]);
  ctx.lineWidth = 2;
  for (const point of screen) {
    ctx.beginPath();
    ctx.arc(point.x, point.y, radius * 1.6, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

// Ручки «+» рисуются только у выделенной точки.
function drawHandles(ctx, scheme, mark, view) {
  for (const handle of handlePositions(scheme, mark, view)) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(handle.x, handle.y, handle.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
    ctx.strokeStyle = "#0969da";
    ctx.lineWidth = 1.5;
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    const arm = handle.r * 0.5;
    ctx.moveTo(handle.x - arm, handle.y);
    ctx.lineTo(handle.x + arm, handle.y);
    ctx.moveTo(handle.x, handle.y - arm);
    ctx.lineTo(handle.x, handle.y + arm);
    ctx.strokeStyle = "#0969da";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }
}

// Черновик линии: уже поставленные вершины плюс резинка до курсора.
function drawDraft(ctx, scheme, draft, view, color) {
  if (!draft || draft.points.length === 0) return;
  const radius = markRadius(view);
  const screen = draft.points.map((point) => planToScreen(point, scheme, view));
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(2, radius * 0.5);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  screen.forEach((point, index) => (index === 0 ? ctx.moveTo(point.x, point.y) : ctx.lineTo(point.x, point.y)));
  if (draft.cursor) {
    const cursor = planToScreen(draft.cursor, scheme, view);
    ctx.lineTo(cursor.x, cursor.y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  for (const point of screen) drawShape(ctx, "circle", point.x, point.y, Math.max(3, radius * 0.5), color);
  // Первая вершина крупнее: по ней замыкают контур.
  drawShape(ctx, "circle", screen[0].x, screen[0].y, Math.max(4, radius * 0.75), color);
}

function legendRows(project, scheme, filter) {
  const used = new Set(visibleMarks(project, scheme, filter).map((mark) => mark.typeId));
  const rows = [];
  for (const group of typesInOrder(project)) {
    for (const type of group.types) {
      if (!used.has(type.id)) continue;
      rows.push({ code: type.code, name: type.name, category: group.category.name, ...styleOf(project, type.id) });
    }
  }
  return rows;
}

// Легенда — для выгрузки: список типов, встреченных на схеме.
function drawLegend(ctx, { project, scheme, filter, view, box }) {
  const rows = legendRows(project, scheme, filter);
  if (rows.length === 0) return;
  const state = renderView(view);
  const font = Math.max(11, labelFontSize(state) * 0.9);
  const step = font * 1.7;
  const width = font * 16;
  const height = step * rows.length + font;
  const x = box ? box.x : 12;
  const y = box ? box.y : 12;
  ctx.save();
  ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
  ctx.strokeStyle = "#d0d7de";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.rect(x, y, width, height);
  ctx.fill();
  ctx.stroke();
  ctx.font = `${font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  rows.forEach((row, index) => {
    const lineY = y + font * 0.6 + step * (index + 0.5);
    drawShape(ctx, row.shape, x + font * 1.1, lineY, font * 0.55, row.color);
    ctx.fillStyle = "#1f2328";
    ctx.fillText(`${row.code} — ${row.name}`, x + font * 2.2, lineY);
  });
  ctx.restore();
}

// Весь кадр: план, метки, подписи, при надобности легенда. Тот же код и на
// экране, и в экспорте — меняется только масштаб во `view`.
function drawScheme(ctx, { project, scheme, image, filter, view, legend, selectedIds, draft, draftColor }) {
  const state = renderView(view);
  if (image) {
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(
      image,
      state.offsetX,
      state.offsetY,
      schemeWidth(scheme) * state.zoom,
      schemeHeight(scheme) * state.zoom,
    );
    ctx.restore();
  }
  if (!project || !scheme) return;
  const selected = new Set(selectedIds || []);
  for (const mark of visibleMarks(project, scheme, filter)) {
    drawMarkBody(ctx, project, scheme, mark, state, selected.has(mark.id));
  }
  for (const target of labelTargets(project, scheme, filter)) {
    const typeId = target.markIds
      ? (project.marks.find((mark) => mark.id === target.markIds[0]) || {}).typeId
      : target.typeId;
    drawLabel(ctx, labelBox(project, scheme, target, state), styleOf(project, typeId).color);
  }
  if (draft) drawDraft(ctx, scheme, draft, state, draftColor || "#0969da");
  if (legend) drawLegend(ctx, { project, scheme, filter, view: state, box: legend === true ? null : legend });
}

// Дверь для тестов — не для панелей: за ней внутренности drawScheme, которые
// снаружи вызывать незачем, но проверить нужно (геометрия, видимость, запас
// попадания). Панели и экспорт берут только именованные экспорты выше.
const renderInternals = {
  shapeGeometry,
  labelFontSize,
  labelTargets,
  labelOrigin,
  markVisible,
  handlePositions,
  drawDraft,
  HIT_SLACK_PX,
  LABEL_CHAR_RATIO,
  LABEL_GAP,
  HANDLE_GAP,
};

// src/history.js
// Отмена — стек команд в памяти. В файл история не пишется: пользователь просил
// отмену, а не версии.
//
// Команда — это пара функций: `undo()` возвращает как было, `redo()` — как стало.
// Холст кладёт сюда снимки объекта, которые вернула модель; своего мутатора
// объекта здесь нет и быть не должно.
const HISTORY_DEPTH = 100;

const historyDone = [];
const historyUndone = [];
const historyListeners = new Set();

function historyChanged() {
  for (const listener of [...historyListeners]) listener();
}
function pushCommand(command) {
  if (!command || typeof command.undo !== "function" || typeof command.redo !== "function") return null;
  historyDone.push(command);
  // Ветка «отменил и сделал иначе»: возвращать уже нечего.
  historyUndone.length = 0;
  while (historyDone.length > HISTORY_DEPTH) historyDone.shift();
  historyChanged();
  return command;
}
function undo() {
  const command = historyDone.pop();
  if (!command) return null;
  command.undo();
  historyUndone.push(command);
  historyChanged();
  return command;
}
function redo() {
  const command = historyUndone.pop();
  if (!command) return null;
  command.redo();
  historyDone.push(command);
  historyChanged();
  return command;
}
function canUndo() {
  return historyDone.length > 0;
}
function canRedo() {
  return historyUndone.length > 0;
}
function undoLabel() {
  const command = historyDone[historyDone.length - 1];
  return command && command.label ? command.label : "";
}
function redoLabel() {
  const command = historyUndone[historyUndone.length - 1];
  return command && command.label ? command.label : "";
}

// Стек живёт в пределах объекта: при переключении объекта его чистят.
function clearHistory() {
  historyDone.length = 0;
  historyUndone.length = 0;
  historyChanged();
}

// Кнопки «Отменить»/«Вернуть» подсвечиваются по этому событию, и слушателей у
// него столько, сколько подписалось: панель инструментов, список меток и всё,
// что появится дальше. Возвращённая функция снимает только свою подписку.
function onHistoryChange(listener) {
  if (typeof listener !== "function") return () => {};
  historyListeners.add(listener);
  return () => historyListeners.delete(listener);
}

// src/panels/ui.js
// Общие кирпичи панелей: элементы, кнопки, модальные диалоги.
// Отдельный модуль, потому что ими пользуются все панели: тянуть их из чужой
// панели значило бы тянуть вместе с ней её регистрацию и подписки.
function uiEl(tag, options = {}, children = []) {
  const node = document.createElement(tag);
  if (options.class) node.className = options.class;
  if (options.text != null) node.textContent = options.text;
  if (options.title) node.title = options.title;
  if (options.type) node.type = options.type;
  if (options.value != null) node.value = options.value;
  if (options.placeholder) node.placeholder = options.placeholder;
  if (options.attrs) {
    for (const [name, value] of Object.entries(options.attrs)) node.setAttribute(name, value);
  }
  if (options.on) {
    for (const [name, handler] of Object.entries(options.on)) node.addEventListener(name, handler);
  }
  for (const child of Array.isArray(children) ? children : [children]) {
    if (child) node.append(child);
  }
  return node;
}
function uiButton(label, options = {}) {
  return uiEl("button", {
    class: options.class || "ui-btn",
    text: label,
    title: options.title || "",
    type: "button",
    on: options.on,
    attrs: options.attrs,
  });
}

// Диалоги складываются стопкой: подтверждение поверх редактора плана —
// обычное дело. Виден верхний, Escape закрывает только его, Enter нажимает его
// основное действие, нижние ждут своей очереди и закрываются своими же close().
// Пока стопка не пуста, #dialog-host не пустой — значит затемнение на месте
// (правило `:empty` из styles.css). Клавиатура не должна оставаться в панели
// под затемнением: диалог забирает фокус, а закрываясь — возвращает его тому,
// кто его открыл.
const uiDialogs = [];
let uiEscapeListener = null;
function uiDialogDepth() {
  return uiDialogs.length;
}

function uiRefreshDialogs() {
  const host = document.getElementById("dialog-host");
  uiDialogs.forEach((entry, index) => {
    entry.card.hidden = index !== uiDialogs.length - 1;
  });
  if (uiDialogs.length === 0) {
    if (host) host.replaceChildren();
    if (uiEscapeListener) {
      document.removeEventListener("keydown", uiEscapeListener);
      uiEscapeListener = null;
    }
    return;
  }
  if (uiEscapeListener) return;
  uiEscapeListener = (event) => {
    const top = uiDialogs[uiDialogs.length - 1];
    if (!top) return;
    if (event.key === "Escape") {
      if (top.dismissable === false) return;
      event.preventDefault();
      top.close();
      if (top.onCancel) top.onCancel();
      return;
    }
    // Enter подтверждает основное действие. Поле ввода, которое обработало
    // Enter само (uiPrompt), помечает событие — второй раз не срабатываем.
    if (event.key !== "Enter" || event.defaultPrevented || !top.primary) return;
    const target = event.target;
    if (target && (target.tagName === "TEXTAREA" || target.isContentEditable)) return;
    event.preventDefault();
    top.primary.click();
  };
  document.addEventListener("keydown", uiEscapeListener);
}

function uiFocusEntry(entry) {
  const target = entry.card.querySelector("input, select, textarea") || entry.primary || entry.card;
  if (target && typeof target.focus === "function") target.focus();
}

// Фокус возвращается открывшему, если он ещё на странице (кнопка панели могла
// исчезнуть при перерисовке); иначе — диалогу, который снова стал верхним.
function uiReturnFocus(entry) {
  const opener = entry.opener;
  if (opener && typeof opener.focus === "function" && opener.isConnected) {
    opener.focus();
    return;
  }
  const top = uiDialogs[uiDialogs.length - 1];
  if (top) uiFocusEntry(top);
}
function uiModal(options) {
  const host = document.getElementById("dialog-host");
  const actions = options.actions || [];
  const card = uiEl("div", { class: "modal", attrs: { tabindex: "-1" } }, [
    uiEl("h3", { class: "modal__title", text: options.title || "" }),
    uiEl("div", { class: "modal__body" }, options.body || null),
    uiEl("div", { class: "modal__actions" }, actions),
  ]);
  const entry = {
    card,
    dismissable: options.dismissable,
    onCancel: options.onCancel,
    // Основное действие — последняя кнопка в ряду (в uiConfirm и uiPrompt это
    // подтверждение, в редакторе плана — «Готово»).
    primary: options.primary || [...actions].reverse().find((node) => node && node.tagName === "BUTTON") || null,
    opener: typeof document !== "undefined" ? document.activeElement : null,
    close() {
      const index = uiDialogs.indexOf(entry);
      if (index < 0) return;
      uiDialogs.splice(index, 1);
      card.remove();
      uiRefreshDialogs();
      uiReturnFocus(entry);
    },
  };
  if (!host) return { close() {}, card };
  uiDialogs.push(entry);
  host.append(card);
  uiRefreshDialogs();
  uiFocusEntry(entry);
  return { close: entry.close, card };
}
function uiConfirm({ title, message, confirmLabel }) {
  return new Promise((resolve) => {
    let modal;
    const answer = (value) => {
      modal.close();
      resolve(value);
    };
    modal = uiModal({
      title,

// src/canvas.js
// Холст разметки: план, метки, блоки, ломаные, выделение и отмена.
//
// Главное правило места: заказчик сегодня размечает план ручкой по распечатке.
// Поэтому диалог тут ровно один — выбор типа, и открывается он один раз на серию.
// Дальше клик ставит метку, а ручки «+» у поставленной точки продолжают блок,
// не спрашивая ничего. Всё остальное (панель инструментов, список меток) —
// вокруг, но не между рукой и планом.
//
// Координаты: в объекте — доли плана (0…1), на экране — пиксели холста.
// Переводит их только render.js; здесь координаты не пересчитываются руками.






const CANVAS_ZOOM_MIN = 0.04;
const CANVAS_ZOOM_MAX = 24;
// Смещение курсора, после которого клик считается перетаскиванием.
const CANVAS_DRAG_SLOP = 3;

let canvasHost = null;
let canvasNode = null;
let canvasCtx = null;
let canvasApi = null;
let canvasDraft = null; // черновик ломаной: {points, cursor}
let canvasDrag = null;
let canvasPreview = null; // объект во время перетаскивания — в состояние не пишется

let canvasPinch = null;
let canvasSpace = false;
let canvasFrame = 0;
let canvasFitted = null;
let canvasProjectId = null;

function canvasState() {
  return canvasApi ? canvasApi.getState() : null;
}

// Во `view` для рисования сходятся две половины: масштаб и сдвиг — сеансовые,
// размеры метки и подписи — из объекта (их двигает ползунок в панели).
function canvasViewOf(state) {
  const sizes = state.project && state.project.view ? state.project.view : {};
  return { ...state.view, markSize: sizes.markSize, labelSize: sizes.labelSize };
}

function canvasScheme(state) {
  return state.project && state.schemeId ? findScheme(state.project, state.schemeId) : null;
}

function canvasImage(state) {
  const loaded = state.schemeImage;
  return loaded && loaded.schemeId === state.schemeId ? loaded.image : null;
}

function canvasProject(state) {
  return canvasPreview || state.project;
}

function canvasPointOf(event) {
  const box = canvasNode.getBoundingClientRect();
  return { x: event.clientX - box.left, y: event.clientY - box.top };
}

// ——— рисование ———————————————————————————————————————————————————————

function canvasRedraw() {
  if (canvasFrame || !canvasNode) return;
  const schedule = typeof requestAnimationFrame === "function" ? requestAnimationFrame : (fn) => setTimeout(fn, 16);
  canvasFrame = schedule(() => {
    canvasFrame = 0;
    canvasPaint();
  });
}

function canvasResize() {
  if (!canvasNode || !canvasHost) return;
  const ratio = window.devicePixelRatio || 1;
  const width = Math.max(1, canvasHost.clientWidth);
  const height = Math.max(1, canvasHost.clientHeight);
  canvasNode.style.width = width + "px";
  canvasNode.style.height = height + "px";
  canvasNode.width = Math.round(width * ratio);
  canvasNode.height = Math.round(height * ratio);
  canvasPaint();
}

function canvasPaint() {
  if (!canvasCtx || !canvasNode) return;
  const ratio = window.devicePixelRatio || 1;
  const state = canvasState();
  canvasCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
  canvasCtx.clearRect(0, 0, canvasNode.width, canvasNode.height);
  const scheme = canvasScheme(state);
  if (!scheme) return;
  const project = canvasProject(state);
  const view = canvasViewOf(state);
  const draftColor = state.activeTypeId ? styleOf(project, state.activeTypeId).color : "#0969da";
  drawScheme(canvasCtx, {
    project,
    scheme,
    image: canvasImage(state),
    filter: state.filter,
    view,
    selectedIds: state.selectedMarkIds,
    draft: canvasDraft,
    draftColor,
  });
  // Ручки «+» — только у одной выделенной точки: у линии блока не бывает.
  if (state.selectedMarkIds.length === 1 && !canvasDrag) {
    const mark = findMark(project, state.selectedMarkIds[0]);
    if (mark && mark.kind === "point" && mark.schemeId === scheme.id) {
      drawHandles(canvasCtx, scheme, mark, view);

// ——— изменения объекта ————————————————————————————————————————————————

// Любая правка объекта проходит здесь — и с холста, и из панели инструментов:
// команда отмены получает снимки «до» и «после», которые вернула модель, плюс
// схему и выделение, на которых действие произошло. Иначе Ctrl+Z после
// переключения схемы правит метки на той, которую не видно.
// Своего мутатора объекта в холсте нет.
function canvasCommit(before, after, label, options = {}) {
  const { setState } = canvasApi;
  const state = canvasState();
  const selectionBefore = state.selectedMarkIds;
  const schemeBefore = state.schemeId;
  const keep = options.selection || selectionBefore;
  const schemeAfter = options.schemeId || schemeBefore;
  // Правка сеансовых полей (активный тип, режим) едет вместе с командой:
  // возвращать объект без них — значит оставить панель показывать то, чего нет.
  // «До» для них снимается здесь же, по именам переданных полей, — вызывающий
  // передаёт только «после», иначе две половинки пары разъедутся молча.
  const patch = options.patch || {};
  const patchBefore = {};
  for (const key of Object.keys(patch)) patchBefore[key] = state[key];
  const apply = () =>
    setState({ project: after, schemeId: schemeAfter, selectedMarkIds: canvasAlive(after, keep), ...patch });
  apply();
  pushCommand({
    label,
    undo: () =>
      setState({
        project: before,
        schemeId: schemeBefore,
        selectedMarkIds: canvasAlive(before, selectionBefore),
        ...patchBefore,
      }),
    redo: apply,
  });
}

function canvasAlive(project, ids) {
  return ids.filter((id) => project.marks.some((mark) => mark.id === id));
}

function canvasFail(error) {
  canvasApi.notify(error && error.message ? error.message : String(error), "error");
}

function canvasPlacePoint(plan) {
  const state = canvasState();
  if (!state.activeTypeId) {
    canvasApi.notify(strings.canvas.needType);
    return;
  }
  try {
    const result = addMark(state.project, {
      schemeId: state.schemeId,
      typeId: state.activeTypeId,
      kind: "point",
      points: [plan],
    });
    canvasCommit(state.project, result.project, strings.history.addMark, [result.mark.id]);
  } catch (error) {
    canvasFail(error);
  }
}

// Шаг блока — не меньше умолчания модели и не меньше двух радиусов метки,
// иначе соседние точки блока сливаются в одну кляксу.
function canvasBlockStep(state) {
  const size = state.project && state.project.view ? state.project.view.markSize : 10;
  return Math.max(BLOCK_STEP_PX, size * 2.6);
}

function canvasBlockPoint(markId, side) {
  const state = canvasState();
  try {
    const result = addToGroup(state.project, markId, side, { step: canvasBlockStep(state) });
    canvasCommit(state.project, result.project, strings.history.addBlock, [result.mark.id]);
  } catch (error) {
    canvasFail(error);
  }
}

function canvasCancelDraft() {
  if (!canvasDraft) return false;
  canvasDraft = null;
  canvasRedraw();
  return true;
}

function canvasLineClick(plan, screen) {
  const state = canvasState();
  if (!state.activeTypeId) {
    canvasApi.notify(strings.canvas.needType);
    return;
  }
  if (!canvasDraft) {
    canvasDraft = { points: [plan], cursor: plan };
    canvasRedraw();
    return;
  }
  const scheme = canvasScheme(state);
  const view = canvasViewOf(state);
  const threshold = markRadius(view) + 6;
  const points = canvasDraft.points;
  const last = planToScreen(points[points.length - 1], scheme, view);
  const first = planToScreen(points[0], scheme, view);
  // Клик по последней или первой вершине ничего не добавляет: это первая
  // половина двойного клика, который завершает или замыкает линию.
  if (Math.hypot(screen.x - last.x, screen.y - last.y) <= threshold) return;
  if (points.length >= 2 && Math.hypot(screen.x - first.x, screen.y - first.y) <= threshold) return;
  points.push(plan);
  canvasRedraw();
}

function canvasLineFinish(closed) {
  if (!canvasDraft) return;
  const points = canvasDraft.points;
  const state = canvasState();
  if (points.length < 2) {
    canvasApi.notify(strings.canvas.lineTooShort);
    canvasCancelDraft();
    return;
  }
  try {
    const result = addMark(state.project, {
      schemeId: state.schemeId,
      typeId: state.activeTypeId,
      kind: "line",
      points,
    });
    let project = result.project;
    if (closed) project = updateMark(project, result.mark.id, { closed: true }).project;
    canvasDraft = null;
    canvasCommit(state.project, project, strings.history.addLine, [result.mark.id]);
  } catch (error) {
    canvasCancelDraft();
    canvasFail(error);
  }
}

async function canvasDeleteSelected() {
  const state = canvasState();
  const markId = state.selectedMarkIds[0];
  const mark = markId ? findMark(state.project, markId) : null;
  if (!mark) return;
  const group = mark.groupId ? findGroup(state.project, mark.groupId) : null;
  if (group) {
    const agreed = await uiConfirm({
      title: strings.canvas.deleteBlockTitle,
      message: text("canvas.deleteBlockMessage", {
        label: labelOf(state.project, mark.id),
        count: group.markIds.length,
      }),
      confirmLabel: strings.canvas.deleteConfirm,
    });
    if (!agreed) return;
  }
  const fresh = canvasState().project;
  if (!findMark(fresh, markId)) return;
  try {
    const result = deleteMark(fresh, markId);
    canvasCommit(fresh, result.project, strings.history.remove, []);
  } catch (error) {
    canvasFail(error);
  }
}

// ——— отмена ——————————————————————————————————————————————————————————
function canvasUndoStep() {
  if (!canUndo()) {
    canvasApi.notify(strings.canvas.nothingToUndo);
    return;
  }
  const command = undo();
  canvasApi.notify(text("canvas.undone", { label: command.label }));
}
function canvasRedoStep() {
  if (!canRedo()) {
    canvasApi.notify(strings.canvas.nothingToRedo);
    return;
  }
  const command = redo();
  canvasApi.notify(text("canvas.redone", { label: command.label }));
}

// ——— масштаб —————————————————————————————————————————————————————————

function canvasClampZoom(zoom) {
  return Math.min(CANVAS_ZOOM_MAX, Math.max(CANVAS_ZOOM_MIN, zoom));
}

// Приближение к точке: точка плана под курсором остаётся под курсором.
function canvasZoomAt(point, factor) {
  const state = canvasState();
  const view = state.view;
  const zoom = canvasClampZoom(view.zoom * factor);
  const ratio = zoom / view.zoom;
  canvasApi.setState({
    view: {
      zoom,
      offsetX: point.x - (point.x - view.offsetX) * ratio,
      offsetY: point.y - (point.y - view.offsetY) * ratio,
    },
  });
}
function canvasZoomBy(factor) {
  if (!canvasNode) return;
  canvasZoomAt({ x: canvasNode.clientWidth / 2, y: canvasNode.clientHeight / 2 }, factor);
}
function canvasFitPlan() {
  const state = canvasState();
  const scheme = canvasScheme(state);
  if (!scheme || !canvasNode) return;
  canvasApi.setState({
    view: fitView(scheme, { width: canvasNode.clientWidth, height: canvasNode.clientHeight }),
  });
  canvasFitted = scheme.id;
}
function canvasZoomReset() {
  if (!canvasNode) return;
  const state = canvasState();
  const scheme = canvasScheme(state);
  if (!scheme) return;
  canvasApi.setState({
    view: {
      zoom: 1,
      offsetX: (canvasNode.clientWidth - scheme.width) / 2,
      offsetY: (canvasNode.clientHeight - scheme.height) / 2,
    },
  });
}

// ——— указатель ———————————————————————————————————————————————————————

function canvasStartPan(point) {
  const state = canvasState();
  canvasDrag = { kind: "pan", start: point, view: { ...state.view }, moved: false };
}

function canvasPointerDown(event) {
  if (uiDialogDepth() > 0 || !canvasScheme(canvasState())) return;
  // Захват может не дать браузер (например, у синтетического события) — это не повод
  // терять клик.
  try {
    canvasNode.setPointerCapture(event.pointerId);
  } catch (error) {
    /* работаем без захвата */
  }
  canvasPointers.set(event.pointerId, canvasPointOf(event));

  // Планшет: разметка остаётся десктопной, пальцы только смотрят.
  if (event.pointerType === "touch") {
    if (canvasPointers.size === 2) {
      const [a, b] = [...canvasPointers.values()];
      canvasPinch = {
        distance: Math.hypot(a.x - b.x, a.y - b.y),
        center: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
      };
      canvasDrag = null;
      return;
    }
    canvasStartPan(canvasPointOf(event));
    return;
  }
  if (event.button === 2) return;
  const point = canvasPointOf(event);
  if (event.button === 1 || canvasSpace) {
    event.preventDefault();
    canvasStartPan(point);
    return;
  }
  if (event.button !== 0) return;

  const state = canvasState();
  const scheme = canvasScheme(state);
  const view = canvasViewOf(state);

  // Ручка «+» важнее всего остального: она и есть быстрый путь.
  if (state.selectedMarkIds.length === 1) {
    const selected = findMark(state.project, state.selectedMarkIds[0]);
    if (selected && selected.kind === "point" && selected.schemeId === scheme.id) {
      const side = hitHandle(scheme, selected, point, view);
      if (side) {
        canvasBlockPoint(selected.id, side);
        canvasDrag = { kind: "done", start: point, moved: false };
        return;
      }
    }
  }

  if (state.mode === "line") {
    canvasDrag = { kind: "line", start: point, view: { ...state.view }, moved: false };
    return;
  }

  const hit = hitTest(state.project, scheme, point, view, state.filter);
  if (hit) {
    if (state.selectedMarkIds[0] !== hit.markId) canvasApi.setState({ selectedMarkIds: [hit.markId] });
    canvasDrag = {
      kind: hit.part === "label" ? "label" : "mark",
      markId: hit.markId,
      groupId: hit.groupId,
      start: point,
      before: state.project,
      moved: false,
    };
    return;
  }
  canvasDrag = {
    kind: state.mode === "point" ? "place" : "empty",
    start: point,
    view: { ...state.view },
    moved: false,
  };
}

// Перетаскивание метки: новые точки считаются от снимка «до», а не от
// предыдущего кадра, — иначе метка уползает от курсора накопленной ошибкой.
function canvasDragTo(point) {
  const state = canvasState();
  const scheme = canvasScheme(state);
  const view = canvasViewOf(state);
  const before = canvasDrag.before;
  const origin = screenToPlan(canvasDrag.start, scheme, view);
  const now = screenToPlan(point, scheme, view);
  const dx = now.x - origin.x;
  const dy = now.y - origin.y;
  try {
    if (canvasDrag.kind === "label") {
      const target = canvasDrag.groupId ? findGroup(before, canvasDrag.groupId) : findMark(before, canvasDrag.markId);
      const current = target ? labelOffsetOf(before, target) : null;
      const size = view.markSize || 10;
      const base = current || { dx: size * 1.5, dy: -size * 1.5 };
      const offset = { dx: base.dx + dx * scheme.width, dy: base.dy + dy * scheme.height };
      // Подпись блока стоит по смещению его первой метки — своего поля у группы
      // модель не заводит, а собственной подписи у этой метки нет.
      const holder = canvasDrag.groupId && target ? target.markIds[0] : canvasDrag.markId;
      canvasPreview = updateMark(before, holder, { labelOffset: offset }).project;
    } else {
      const mark = findMark(before, canvasDrag.markId);
      const points = mark.points.map((item) => ({ x: item.x + dx, y: item.y + dy }));
      canvasPreview = updateMark(before, canvasDrag.markId, { points }).project;
    }
  } catch (error) {
    canvasPreview = null;
  }
  canvasRedraw();
}

function canvasPointerMove(event) {
  if (!canvasNode) return;
  const point = canvasPointOf(event);
  if (canvasPointers.has(event.pointerId)) canvasPointers.set(event.pointerId, point);

  if (canvasPinch && canvasPointers.size === 2) {
    const [a, b] = [...canvasPointers.values()];
    const distance = Math.hypot(a.x - b.x, a.y - b.y);
    const center = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (canvasPinch.distance > 0) canvasZoomAt(center, distance / canvasPinch.distance);
    const state = canvasState();
    canvasApi.setState({
      view: {
        ...state.view,
        offsetX: state.view.offsetX + (center.x - canvasPinch.center.x),
        offsetY: state.view.offsetY + (center.y - canvasPinch.center.y),
      },
    });
    canvasPinch = { distance, center };
    return;
  }

  const state = canvasState();
  if (canvasDraft) {
    const scheme = canvasScheme(state);
    canvasDraft.cursor = screenToPlan(point, scheme, canvasViewOf(state));
    canvasRedraw();
  }
  if (!canvasDrag) return;
  const shift = Math.hypot(point.x - canvasDrag.start.x, point.y - canvasDrag.start.y);
  if (shift > CANVAS_DRAG_SLOP) canvasDrag.moved = true;
  if (!canvasDrag.moved) return;

  if (canvasDrag.kind === "mark" || canvasDrag.kind === "label") {
    canvasDragTo(point);
    return;
  }
  if (canvasDrag.kind === "pan" || canvasDrag.kind === "empty" || canvasDrag.kind === "place" || canvasDrag.kind === "line") {
    canvasApi.setState({
      view: {
        ...state.view,
        offsetX: canvasDrag.view.offsetX + (point.x - canvasDrag.start.x),
        offsetY: canvasDrag.view.offsetY + (point.y - canvasDrag.start.y),
      },
    });
  }
}

function canvasPointerUp(event) {
  canvasPointers.delete(event.pointerId);
  if (canvasPointers.size < 2) canvasPinch = null;
  const drag = canvasDrag;
  canvasDrag = null;
  if (!drag) return;
  const point = canvasPointOf(event);
  const state = canvasState();

  if (drag.moved) {
    if ((drag.kind === "mark" || drag.kind === "label") && canvasPreview) {
      const label = drag.kind === "label" ? strings.history.moveLabel : strings.history.move;
      const after = canvasPreview;
      canvasPreview = null;
      canvasCommit(drag.before, after, label, [drag.markId]);
    }
    canvasPreview = null;
    canvasRedraw();
    return;
  }
  canvasPreview = null;

  if (event.pointerType === "touch" || drag.kind === "done") return;
  const scheme = canvasScheme(state);
  const plan = screenToPlan(point, scheme, canvasViewOf(state));
  if (drag.kind === "line") {
    canvasLineClick(plan, point);
    return;
  }
  if (drag.kind === "place") {
    canvasPlacePoint(plan);
    return;
  }
  if (drag.kind === "empty" && state.selectedMarkIds.length > 0) {
    canvasApi.setState({ selectedMarkIds: [] });
  }
}

function canvasDoubleClick(event) {
  const state = canvasState();
  if (state.mode !== "line" || !canvasDraft) return;
  const scheme = canvasScheme(state);
  const view = canvasViewOf(state);
  const point = canvasPointOf(event);
  const threshold = markRadius(view) + 6;
  const points = canvasDraft.points;
  const first = planToScreen(points[0], scheme, view);
  const last = planToScreen(points[points.length - 1], scheme, view);
  const onFirst = Math.hypot(point.x - first.x, point.y - first.y) <= threshold;
  const onLast = Math.hypot(point.x - last.x, point.y - last.y) <= threshold;
  // Двойной клик в стороне — это просто две вершины подряд: рисование
  // продолжается, ничего не теряется и не замыкается.
  if (!onFirst && !onLast) return;
  event.preventDefault();
  // По первой точке — замкнутый контур (лента по периметру комнаты),
  // по последней — открытая линия, ровно как в брифе.
  canvasLineFinish(onFirst && !onLast && points.length >= 3);
}

function canvasWheel(event) {
  if (uiDialogDepth() > 0) return;
  event.preventDefault();
  const step = event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY;
  canvasZoomAt(canvasPointOf(event), Math.exp(-step * 0.0015));
}

// ——— клавиатура ——————————————————————————————————————————————————————

function canvasTypingTarget(target) {
  if (!target || !target.tagName) return false;

    target.tagName === "INPUT" ||
    target.tagName === "TEXTAREA" ||
    target.tagName === "SELECT" ||
    target.isContentEditable
  );
}

function canvasKeyDown(event) {

  if (uiDialogDepth() > 0 || canvasTypingTarget(event.target)) return;

  const control = event.ctrlKey || event.metaKey;
  if (control && event.code === "KeyZ") {
    event.preventDefault();
    if (event.shiftKey) canvasRedoStep();

    return;
  }
  if (control && event.code === "KeyY") {
    event.preventDefault();
    canvasRedoStep();
    return;
  }
  if (control) return;

    canvasSpace = true;
    if (canvasNode) canvasNode.style.cursor = "grab";
    return;
  }
  if (event.key === "Escape") {
    if (canvasCancelDraft()) return;
    // Первый Esc снимает выделение: пока метка выделена, вокруг неё ручки «+»,
    // и отдельную метку вплотную к блоку не поставить. Второй — выходит из режима.
    if (state.selectedMarkIds.length > 0) {
      canvasApi.setState({ selectedMarkIds: [] });
      return;
    }
    if (state.mode !== "select") canvasApi.setState({ mode: "select" });
    return;
  }
  if (event.key === "Backspace" && canvasDraft) {
    event.preventDefault();
    canvasDraft.points.pop();
    if (canvasDraft.points.length === 0) canvasDraft = null;
    canvasRedraw();
    return;
  }
  if ((event.key === "Delete" || event.key === "Backspace") && state.selectedMarkIds.length > 0) {
    event.preventDefault();
    canvasDeleteSelected();
  }
}

function canvasKeyUp(event) {
