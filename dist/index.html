  if (table && table.title) out.push("# " + table.title, "");
  if (table && table.room) out.push("**" + tableMarkdownCell(table.room) + "**", "");
  if (table && table.note) out.push("_" + tableMarkdownCell(table.note) + "_", "");
  const header = "| " + table.columns.map(tableMarkdownCell).join(" | ") + " |";
  const divider = "| " + table.columns.map(() => "---").join(" | ") + " |";
  for (const section of tableSections(table)) {
    if (section.title) out.push("#".repeat(1 + (section.level || 1)) + " " + tableMarkdownCell(section.title), "");
    // Заголовок помещения строк не несёт — пустая шапка таблицы под ним
    // выглядела бы как потерянные строки.
    if (section.rows.length === 0) continue;
    out.push(header, divider);
    for (const row of section.rows) out.push("| " + row.cells.map(tableMarkdownCell).join(" | ") + " |");
    out.push("");
  }
  if (table && Array.isArray(table.totals) && table.totals.length > 0) {
    out.push("## " + strings.tables.totals, "");
    // Заголовок счётной колонки — у таблицы: у меток это точки, у оборудования штуки.
    const countTitle = (table.totalsColumns && table.totalsColumns[2]) || strings.tables.points;
    out.push("| " + strings.tables.name + " | " + countTitle + " |", "| --- | --- |");
    for (const row of table.totals) {
      const title = row.level === 2 ? "— " + row.title : row.title;
      out.push("| " + tableMarkdownCell(title) + " | " + row.count + " |");
    }
    out.push("| " + (table.totalLabel || strings.tables.totalAll) + " | " + table.totalCount + " |", "");
  }
  return out.join("\n");
}

// Ячейка буфера — одна строка без табуляций: и перевод строки, и табуляция
// внутри «Расположения» разорвали бы вставку в Таблицы на лишнюю строку
// или на лишнюю колонку.
function tableTsvCell(value) {
  return (value == null ? "" : String(value)).replace(/[\t\r\n]+/g, " ").trim();
}

// Буфер обмена: табуляции вставляются в Google Таблицы колонками.
function toTsv(table) {
  const lines = [table.columns.join("\t")];
  for (const section of tableSections(table)) {
    if (section.title) lines.push(section.title);
    for (const row of section.rows) {
      lines.push(row.cells.map(tableTsvCell).join("\t"));
    }
  }
  return lines.join("\n");
}

// src/exporter.js
// Выгрузка на бумагу и в файлы: PNG схемы, PNG таблицы, zip всех схем, печать.
//
// Схема рисуется тем же `render.drawScheme`, что и холст: во `view` уходит
// `zoom = scale`, поэтому метки и подписи на выгруженной картинке выглядят
// ровно так, как их видел инженер на экране, только в большем разрешении.
// Своего рисования меток здесь нет и быть не должно.
//
// Zip берётся из `projectFile.writeZip` — второй реализации zip в сборке нет.
const EXPORT_SCALES = [1, 2, 4];
// Разрешение печати, по которому пиксели пересчитываются в миллиметры.
const EXPORT_DPI = 300;
// Предел стороны холста в браузерах: за ним toBlob молча отдаёт пустое.
const EXPORT_MAX_SIDE = 16384;
const EXPORT_MM_PER_INCH = 25.4;

// ——— размеры ——————————————————————————————————————————————————————————
function exportSize(width, height, scale) {
  const factor = scale > 0 ? scale : 1;
  const pixelWidth = Math.round(Math.max(1, width) * factor);
  const pixelHeight = Math.round(Math.max(1, height) * factor);
  return {
    width: pixelWidth,
    height: pixelHeight,
    mmWidth: Math.round((pixelWidth / EXPORT_DPI) * EXPORT_MM_PER_INCH),
    mmHeight: Math.round((pixelHeight / EXPORT_DPI) * EXPORT_MM_PER_INCH),
  };
}

// «2560 × 3956 px · 217 × 335 мм при 300 dpi» — чтобы было видно, что
// получится при печати, до того как файл выгружен.
function exportSizeText(width, height, scale) {
  return text("exportPanel.size", exportSize(width, height, scale));
}

// ——— холст ————————————————————————————————————————————————————————————

function exportCanvas(width, height) {
  const side = Math.max(width, height);
  if (side > EXPORT_MAX_SIDE) throw new Error(strings.exportPanel.tooBig);
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(width));
  canvas.height = Math.max(1, Math.round(height));
  return canvas;
}

function exportBlob(canvas) {
  return new Promise((resolve, reject) => {
    if (typeof canvas.toBlob !== "function") {
      reject(new Error(strings.exportPanel.failed));
      return;
    }
    canvas.toBlob((blob) => {
      if (blob) resolve(blob);
      else reject(new Error(strings.exportPanel.failed));
    }, "image/png");
  });
}

// Область выгрузки в пикселях плана: вся схема или прямоугольник, который
// панель сняла с экрана («как вижу»). Прямоугольник обрезается планом —
// белые поля вокруг схемы на бумаге не нужны.
function exportArea(scheme, area) {
  const width = scheme && scheme.width > 0 ? scheme.width : 1000;
  const height = scheme && scheme.height > 0 ? scheme.height : 1000;
  if (!area || area === "all") return { x: 0, y: 0, width, height };
  const x = Math.max(0, Math.min(width, area.x || 0));
  const y = Math.max(0, Math.min(height, area.y || 0));
  return {
    x,
    y,
    width: Math.max(1, Math.min(width - x, area.width || width)),
    height: Math.max(1, Math.min(height - y, area.height || height)),
  };
}

// Поля вокруг контура: доля большей стороны комнаты, но не меньше запаса
// в пикселях плана — на узкой кладовке процент дал бы рамку в пару точек.
const EXPORT_ROOM_PAD = 0.06;
const EXPORT_ROOM_PAD_MIN = 24;

/**
 * Габариты помещения на схеме в пикселях плана — рамка по контурам комнаты
 * плюс поля. `null`, когда контура этой комнаты на схеме нет.
 *
 * Метки внутри рамки при этом **не фильтруются**: лист режется по комнате, а
 * показывает всё, что попало в кадр. Иначе розетка соседней комнаты, физически
 * стоящая в кадре, исчезла бы с бумаги, и монтажник решил бы, что там пусто.
 */
function exportRoomArea(project, scheme, roomId) {
  if (!project || !scheme || !roomId) return null;
  const outlines = outlinesInOrder(project, scheme.id).filter((outline) => outline.roomId === roomId);
  if (outlines.length === 0) return null;
  const width = scheme.width > 0 ? scheme.width : 1000;
  const height = scheme.height > 0 ? scheme.height : 1000;
  let minX = Infinity;
  let minY = Infinity;
  let maxX = -Infinity;
  let maxY = -Infinity;
  for (const outline of outlines) {
    for (const point of outline.points || []) {
      minX = Math.min(minX, point.x);
      minY = Math.min(minY, point.y);
      maxX = Math.max(maxX, point.x);
      maxY = Math.max(maxY, point.y);
    }
  }
  if (!Number.isFinite(minX) || !Number.isFinite(maxX)) return null;
  const box = { x: minX * width, y: minY * height, width: (maxX - minX) * width, height: (maxY - minY) * height };
  const pad = Math.max(EXPORT_ROOM_PAD_MIN, Math.max(box.width, box.height) * EXPORT_ROOM_PAD);
  return { x: box.x - pad, y: box.y - pad, width: box.width + pad * 2, height: box.height + pad * 2 };
}

// Имя помещения для заголовка листа схемы: комната названа там же, где и на
// таблице, иначе лист по комнате не отличить от листа по всей схеме.
function exportRoomName(project, roomId) {
  const room = roomId ? findRoom(project, roomId) : null;
  return room ? room.name : "";
}

// ——— поля под подписи ——————————————————————————————————————————————————

// Запас вокруг рамки, чтобы подпись не липла к обрезу (в пикселях плана).
const EXPORT_FIT_PAD = 6;
// Насколько лист может вырасти на сторону — доля стороны кадра. Подпись,
// оттащенную мышью на полплана, догонять белым полем незачем: о ней лучше
// предупредить.
const EXPORT_FIT_MAX = 0.25;

function exportPlanSize(scheme) {
  return {
    width: scheme && scheme.width > 0 ? scheme.width : 1000,
    height: scheme && scheme.height > 0 ? scheme.height : 1000,
  };
}

// Цели подписей: метка без группы — своя подпись, блок — одна на всех.
// Правило то же, что у холста; для блока берётся сама группа, поэтому подпись
// считается по всем её меткам — рамка выходит не уже настоящей.
function exportLabelTargets(project, scheme, filter) {
  const targets = [];
  const seen = new Set();
  for (const mark of visibleMarks(project, scheme, filter)) {
    if (!mark.groupId) {
      targets.push(mark);
      continue;
    }
    if (seen.has(mark.groupId)) continue;
    seen.add(mark.groupId);
    targets.push(findGroup(project, mark.groupId) || mark);
  }
  return targets;
}

function exportUnion(box, rect) {
  const right = Math.max(box.x + box.width, rect.x + rect.width);
  const bottom = Math.max(box.y + box.height, rect.y + rect.height);
  box.x = Math.min(box.x, rect.x);
  box.y = Math.min(box.y, rect.y);
  box.width = right - box.x;
  box.height = bottom - box.y;
}

/**
 * Кадр листа с полями под подписи.
 *
 * Холст, равный площади плана, срезал подписи меток у стен — а у стен их
 * больше всего: розетки и выключатели стоят по периметру. Поэтому кадр растёт
 * ровно настолько, чтобы поместились метки и подписи, попавшие в него: у края
 * плана появляется белое поле, в середине не меняется ничего.
 *
 * Рамка подписи считается симметрично вокруг её точки: подпись бывает повёрнута
 * на 90°, и «шире, чем выше» — не то, на что можно опираться.
 *
 * Возвращает `{area, missed}`; `missed` — подписи, которые не влезли и в
 * выросший кадр (оттащены далеко): о них панель предупреждает до выгрузки,
 * потому что молча потерянное обозначение хуже белого поля.
 */
function exportFitArea(project, scheme, options = {}) {
  const base = exportArea(scheme, options.area);
  if (!project || !scheme || options.fit === false) return { area: base, missed: [] };

  const plan = exportPlanSize(scheme);
  const sizes = project.view || {};
  const view = { zoom: 1, offsetX: 0, offsetY: 0, markSize: sizes.markSize, labelSize: sizes.labelSize };
  const filter = options.filter || null;
  const radius = markRadius(view);
  const inBase = (point) =>
    point.x >= base.x - 1 &&
    point.x <= base.x + base.width + 1 &&
    point.y >= base.y - 1 &&
    point.y <= base.y + base.height + 1;
  const planPoints = (target) => {
    const marks = target.markIds
      ? target.markIds.map((id) => (project.marks || []).find((mark) => mark.id === id)).filter(Boolean)
      : [target];
    const points = [];
    for (const mark of marks) {
      for (const point of mark.points || []) points.push({ x: point.x * plan.width, y: point.y * plan.height });
    }
    return points;
  };

  const rects = [];
  for (const mark of visibleMarks(project, scheme, filter)) {
    for (const point of planPoints(mark)) {
      if (!inBase(point)) continue;
      rects.push({ text: "", x: point.x - radius, y: point.y - radius, width: radius * 2, height: radius * 2 });
    }
  }
  for (const target of exportLabelTargets(project, scheme, filter)) {
    if (!planPoints(target).some(inBase)) continue;
    const box = labelBox(project, scheme, target, view, filter);
    if (!box.text) continue;
    // Подложка-обводка подписи шире самих букв — её тоже нельзя срезать.
    const halo = Math.max(2, box.font * 0.3);
    const reach = box.width + box.height / 2 + halo + EXPORT_FIT_PAD;
    rects.push({ text: box.text, x: box.x - reach, y: box.y - reach, width: reach * 2, height: reach * 2 });
  }

  // Подпись комнаты считается так же: её тоже таскают руками, и срезать её
  // обрезом листа нельзя. Контур, целиком лежащий вне кадра, в счёт не идёт.
  for (const outline of visibleOutlines(project, scheme, filter)) {
    const points = (outline.points || []).map((point) => ({ x: point.x * plan.width, y: point.y * plan.height }));
    if (!points.some(inBase)) continue;
    const box = outlineLabelBox(project, scheme, outline, view);
    if (!box || !box.text) continue;
    const halo = Math.max(2, box.font * 0.3);
    const reach = box.width + box.height / 2 + halo + EXPORT_FIT_PAD;
    rects.push({ text: box.text, x: box.x - reach, y: box.y - reach, width: reach * 2, height: reach * 2 });
  }

  const area = { ...base };
  for (const rect of rects) exportUnion(area, rect);

  // Потолок роста: иначе одна оттащенная подпись раздувает лист вдвое.
  const limitX = base.width * EXPORT_FIT_MAX;
  const limitY = base.height * EXPORT_FIT_MAX;
  const left = Math.min(base.x - area.x, limitX);
  const top = Math.min(base.y - area.y, limitY);
  const right = Math.min(area.x + area.width - (base.x + base.width), limitX);
  const bottom = Math.min(area.y + area.height - (base.y + base.height), limitY);
  const capped = {
    x: base.x - left,
    y: base.y - top,
    width: base.width + left + right,
    height: base.height + top + bottom,
  };

  const missed = [];
  for (const rect of rects) {
    if (!rect.text) continue;
    const fits =
      rect.x >= capped.x &&
      rect.y >= capped.y &&
      rect.x + rect.width <= capped.x + capped.width &&
      rect.y + rect.height <= capped.y + capped.height;
    if (!fits && !missed.includes(rect.text)) missed.push(rect.text);
  }
  return { area: capped, missed };
}

/**
 * PNG схемы с метками. `area` — «all» или прямоугольник в пикселях плана,
 * `scale` — множитель, `legend` — рисовать ли легенду в углу, `outlines` —
 * печатать ли контуры помещений (по умолчанию да, бледной линией), `filter` —
 * тот же фильтр, что на экране: скрытое им не попадает ни в картинку,
 * ни в легенду.
 */
async function schemePng(project, scheme, image, options = {}) {
  const scale = options.scale > 0 ? options.scale : 1;
  // Кадр берётся с полями под подписи — тем же расчётом, что показал размер
  // в диалоге, иначе на бумаге окажется не то, что обещали миллиметры.
  const { area } = exportFitArea(project, scheme, {
    area: options.area,
    filter: options.filter,
    fit: options.fit,
  });
  const canvas = exportCanvas(area.width * scale, area.height * scale);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const sizes = project && project.view ? project.view : {};
  const view = {
    zoom: scale,
    offsetX: -area.x * scale,
    offsetY: -area.y * scale,
    markSize: sizes.markSize,
    labelSize: sizes.labelSize,
  };
  drawScheme(ctx, {
    project,
    scheme,
    image,
    filter: options.filter || null,
    view,
    legend: options.legend ? { x: 16 * scale, y: 16 * scale } : null,
    // Контуры помещений на бумаге — бледной линией: на листе главное метки,
    // а обводка комнаты подсказывает, где они стоят. Галочка в диалоге её снимает.
    outlines: options.outlines === false ? false : "pale",
  });
  return exportBlob(canvas);
}

// ——— таблица картинкой ————————————————————————————————————————————————

const EXPORT_TABLE = {
  font: 14,
  titleFont: 22,
  roomFont: 17,
  groupFont: 16,
  rowHeight: 26,
  padding: 24,
  gap: 12,
  stripe: 4,
  cellGap: 18,
  maxColumn: 420,
  ink: "#1f2328",
  muted: "#57606a",
  line: "#d0d7de",
};

// Проба для measureText — одна на модуль: при выгрузке 4× замеров десятки,
// и каждый свой <canvas> ничем не лучше одного общего.
let exportProbeCtx = null;

function exportProbe() {
  if (!exportProbeCtx) exportProbeCtx = document.createElement("canvas").getContext("2d");
  return exportProbeCtx;
}

function exportMeasure(ctx, table) {
  const widths = table.columns.map((column) => {
    ctx.font = `600 ${EXPORT_TABLE.font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    return ctx.measureText(String(column)).width;
  });
  ctx.font = `${EXPORT_TABLE.font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
  for (const section of tableSections(table)) {
    for (const row of section.rows) {
      row.cells.forEach((cell, index) => {
        const value = String(cell == null ? "" : cell);
        const width = ctx.measureText(value).width;
        if (width > widths[index]) widths[index] = width;
      });
    }
  }
  return widths.map((width) => Math.min(EXPORT_TABLE.maxColumn, Math.ceil(width) + EXPORT_TABLE.cellGap));
}

function exportClip(ctx, value, limit) {
  const cell = value == null ? "" : String(value);
  if (ctx.measureText(cell).width <= limit) return cell;
  let cut = cell;
  while (cut.length > 1 && ctx.measureText(cut + "…").width > limit) cut = cut.slice(0, -1);
  return cut + "…";
}

// Раскладка таблицы в единицах вёрстки: ширины колонок по самому длинному
// значению, высота — по числу строк и заголовков групп.
function exportTableLayout(table, options = {}) {
  const widths = exportMeasure(exportProbe(), table);
  const sections = tableSections(table);
  const title = options.title || table.title || "";
  const room = options.room != null ? options.room : table.room || "";
  const note = options.note != null ? options.note : table.note || "";
  const subtitle = options.subtitle || "";

  const bodyWidth = widths.reduce((sum, width) => sum + width, 0) + EXPORT_TABLE.stripe + EXPORT_TABLE.gap;
  const width = bodyWidth + EXPORT_TABLE.padding * 2;
  let height = EXPORT_TABLE.padding;
  if (title) height += EXPORT_TABLE.titleFont * 1.6;
  if (room) height += EXPORT_TABLE.roomFont * 1.6;
  if (note) height += EXPORT_TABLE.font * 1.6;
  if (subtitle) height += EXPORT_TABLE.font * 1.6;
  height += EXPORT_TABLE.rowHeight; // строка названий колонок
  for (const section of sections) {
    if (section.title) height += EXPORT_TABLE.rowHeight + EXPORT_TABLE.gap;
    height += section.rows.length * EXPORT_TABLE.rowHeight + EXPORT_TABLE.gap;
  }
  const totals = table && Array.isArray(table.totals) ? table.totals : [];
  if (totals.length > 0) height += EXPORT_TABLE.rowHeight * (totals.length + 2) + EXPORT_TABLE.gap * 2;
  height += EXPORT_TABLE.padding;
  return { width, height, bodyWidth, widths, sections, title, room, note, subtitle, totals };
}

// Размер будущей картинки таблицы — чтобы множитель рядом с кнопкой показывал
// пиксели и миллиметры до того, как файл собран.
function exportTableSizeText(table, scale) {
  const layout = exportTableLayout(table, {});
  return exportSizeText(layout.width, layout.height, scale);
}

/**
 * Таблица картинкой в большом разрешении: заголовок объекта, заголовки групп
 * цветом категории, цветная полоса слева у строк — как на рукописном листе.
 */
async function tablePng(table, options = {}) {
  const scale = options.scale > 0 ? options.scale : 1;
  const layout = exportTableLayout(table, options);
  const { widths, sections, title, room, note, subtitle, bodyWidth, totals } = layout;
  const layoutWidth = layout.width;
  const layoutHeight = layout.height;

  const canvas = exportCanvas(layoutWidth * scale, layoutHeight * scale);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(scale, scale);
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";

  const left = EXPORT_TABLE.padding;
  let y = EXPORT_TABLE.padding;

  if (title) {
    ctx.fillStyle = EXPORT_TABLE.ink;
    ctx.font = `600 ${EXPORT_TABLE.titleFont}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.fillText(title, left, y + EXPORT_TABLE.titleFont * 0.8);
    y += EXPORT_TABLE.titleFont * 1.6;
  }
  // Комната — сразу под именем объекта и тем же весом, что заголовок: лист по
  // одной комнате должен и на бумаге читаться как лист по комнате.
  if (room) {
    ctx.fillStyle = EXPORT_TABLE.ink;
    ctx.font = `600 ${EXPORT_TABLE.roomFont}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.fillText(room, left, y + EXPORT_TABLE.roomFont * 0.8);
    y += EXPORT_TABLE.roomFont * 1.6;
  }
  // Лист, сужённый фильтром, признаётся в этом на бумаге — иначе неполная
  // таблица неотличима от полной.
  if (note) {
    ctx.fillStyle = EXPORT_TABLE.ink;
    ctx.font = `600 ${EXPORT_TABLE.font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.fillText(note, left, y + EXPORT_TABLE.font * 0.8);
    y += EXPORT_TABLE.font * 1.6;
  }
  if (subtitle) {
    ctx.fillStyle = EXPORT_TABLE.muted;
    ctx.font = `${EXPORT_TABLE.font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.fillText(subtitle, left, y + EXPORT_TABLE.font * 0.8);
    y += EXPORT_TABLE.font * 1.6;
  }

  // Цвет строки на бумаге показывает полоса слева, а не квадратик в ячейке:
  // колонки с кодом краски в листах больше нет, и рисовать его негде.
  const drawCells = (cells, textLeft, bold) => {
    ctx.font = `${bold ? "600 " : ""}${EXPORT_TABLE.font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    let x = textLeft;
    cells.forEach((cell, index) => {
      const limit = widths[index] - EXPORT_TABLE.cellGap;
      ctx.fillText(exportClip(ctx, cell, limit), x, y + EXPORT_TABLE.rowHeight / 2);
      x += widths[index];
    });
  };

  ctx.fillStyle = EXPORT_TABLE.muted;
  drawCells(table.columns, left + EXPORT_TABLE.stripe + EXPORT_TABLE.gap, true);
  y += EXPORT_TABLE.rowHeight;
  ctx.strokeStyle = EXPORT_TABLE.line;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(left, y);
  ctx.lineTo(left + bodyWidth, y);
  ctx.stroke();

  for (const section of sections) {
    const color = section.color || EXPORT_TABLE.ink;
    if (section.title) {
      // Уровень заголовка: помещение — крупнее и с жирной чертой, разбивка
      // внутри него — мельче и тоньше. Вложенность на бумаге видна размером,
      // а не отступом: отступ увёл бы строки от колонок.
      const level = section.level || 1;
      y += EXPORT_TABLE.gap;
      ctx.fillStyle = color;
      const groupFont = level === 2 ? EXPORT_TABLE.groupFont - 2 : EXPORT_TABLE.groupFont;
      ctx.font = `600 ${groupFont}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
      ctx.fillText(section.title, left, y + EXPORT_TABLE.rowHeight / 2);
      const lineY = y + EXPORT_TABLE.rowHeight - 2;
      ctx.strokeStyle = color;
      ctx.lineWidth = level === 2 ? 1 : 2;
      ctx.beginPath();
      ctx.moveTo(left, lineY);
      ctx.lineTo(left + bodyWidth, lineY);
      ctx.stroke();
      y += EXPORT_TABLE.rowHeight;
    }
    for (const row of section.rows) {
      ctx.fillStyle = row.color || section.color || EXPORT_TABLE.line;
      ctx.fillRect(left, y + 4, EXPORT_TABLE.stripe, EXPORT_TABLE.rowHeight - 8);
      ctx.fillStyle = EXPORT_TABLE.ink;
      drawCells(row.cells, left + EXPORT_TABLE.stripe + EXPORT_TABLE.gap, false);
      y += EXPORT_TABLE.rowHeight;
    }
    y += EXPORT_TABLE.gap;
  }

  // Подвал «сколько чего»: по нему заказывают оборудование, поэтому он стоит
  // под таблицей на том же листе, а не отдельным файлом.
  if (totals.length > 0) {
    y += EXPORT_TABLE.gap;
    ctx.fillStyle = EXPORT_TABLE.ink;
    ctx.font = `600 ${EXPORT_TABLE.groupFont}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.fillText(strings.tables.totals, left, y + EXPORT_TABLE.rowHeight / 2);
    const lineY = y + EXPORT_TABLE.rowHeight - 2;
    ctx.strokeStyle = EXPORT_TABLE.ink;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(left, lineY);
    ctx.lineTo(left + bodyWidth, lineY);
    ctx.stroke();
    y += EXPORT_TABLE.rowHeight;

    const line = (label, value, bold, color, indent) => {
      ctx.font = `${bold ? "600 " : ""}${EXPORT_TABLE.font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
      ctx.fillStyle = color || EXPORT_TABLE.ink;
      ctx.textAlign = "left";
      ctx.fillText(label, left + indent, y + EXPORT_TABLE.rowHeight / 2);
      ctx.textAlign = "right";
      ctx.fillText(String(value), left + bodyWidth, y + EXPORT_TABLE.rowHeight / 2);
      ctx.textAlign = "left";
      y += EXPORT_TABLE.rowHeight;
    };
    for (const row of totals) {
      const sub = row.level === 2;
      line(row.title, row.count, !sub, sub ? EXPORT_TABLE.muted : row.color || EXPORT_TABLE.ink, sub ? EXPORT_TABLE.gap : 0);
    }
    line(table.totalLabel || strings.tables.totalAll, table.totalCount, true, EXPORT_TABLE.ink, 0);
  }

  return exportBlob(canvas);
}

// ——— все схемы разом ——————————————————————————————————————————————————

// Картинка для рисования: Blob декодируется, готовый ImageBitmap или <img>
// берётся как есть.
async function exportImageOf(source) {
  if (!source) return null;
  if (typeof Blob !== "undefined" && source instanceof Blob) {
    if (typeof createImageBitmap === "function") return createImageBitmap(source);
    return null;
  }
  return source;
}

// Хвост «-ГГГГ-ММ-ДД.zip», который ставит projectFileName.
const EXPORT_DATED_TAIL = /-\d{4}-\d{2}-\d{2}\.zip$/;

/**
 * Имя файла с датой во всей сборке собирает `projectFile.projectFileName`:
 * там же чистятся запрещённые символы и обрезается длина. Здесь у готового
 * имени меняется расширение, а к имени объекта приписывается то, что отличит
 * выгрузку: `part` — схема или слово-пометка («схемы»).
 *
 * Без такой пометки архив схем назывался бы «<Объект>-<дата>.zip» — ровно тем
 * же именем, что и файл проекта, и в папке загрузок один молча затирал бы
 * другой. Файл проекта открывается назад в сервисе, архив схем — картинки
 * монтажнику, и по имени это должно быть видно сразу.
 */
function exportFileName(project, part, extension) {
  const base = (project && project.name) || "";
  const suffix = typeof part === "string" ? part : part ? part.name : "";
  return projectFileName({ name: suffix ? base + " — " + suffix : base }).replace(/zip$/, extension);
}

// Имя записи внутри архива: та же чистка, но без даты — дата стоит на самом архиве.
function exportEntryName(value) {
  return projectFileName({ name: value }).replace(EXPORT_DATED_TAIL, "");
}

/**
 * Zip с картинками всех схем объекта. `images` — Map «imageId → Blob»
 * (или ImageBitmap). Zip пишется общим `writeZip`: PNG уже сжат, поэтому
 * хранится как есть.
 */
async function allSchemesZip(project, images, options = {}) {
  // Форма входа одна — Map «imageId → Blob», как у packProject: разбирать
  // четыре формы одного и того же было бы вторым правилом на тот же вход.
  if (images != null && !(images instanceof Map)) throw new Error(strings.errors.imagesNotMap);
  const map = images || new Map();
  const schemes = schemesInOrder(project);
  const files = [];
  const onProgress = typeof options.onProgress === "function" ? options.onProgress : null;
  for (let index = 0; index < schemes.length; index += 1) {
    const scheme = schemes[index];
    const image = await exportImageOf(map.get(scheme.imageId));
    const blob = await schemePng(project, scheme, image, { ...options, area: "all" });
    const name = String(index + 1).padStart(2, "0") + "-" + exportEntryName(scheme.name) + ".png";
    files.push({ name, data: blob, compress: false });
    if (onProgress) onProgress({ done: index + 1, total: schemes.length, name });
  }
  return writeZip(files, { compress: false });
}

// ——— печать ———————————————————————————————————————————————————————————

function exportNode(tag, className, textValue) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (textValue != null) node.textContent = String(textValue);
  return node;
}

/**
 * Готовая раскладка таблицы: заголовок объекта, заголовки групп цветом
 * категории, колонки шапкой. Один и тот же узел идёт и в предпросмотр
 * диалога, и в печать — печатается ровно то, что видно.
 */
function exportTableNode(table, options = {}) {
  const doc = exportNode("div", "print-doc");
  const head = exportNode("header", "print-doc__head");
  head.append(exportNode("h1", "print-doc__title", options.title || table.title || ""));
  const room = options.room != null ? options.room : table.room || "";
  if (room) head.append(exportNode("p", "print-doc__room", room));
  const note = options.note != null ? options.note : table.note || "";
  if (note) head.append(exportNode("p", "print-doc__note", note));
  const subtitle = options.subtitle || text("exportPanel.rows", { count: tableRowCount(table) });
  head.append(exportNode("p", "print-doc__sub", subtitle));
  doc.append(head);

  for (const section of tableSections(table)) {
    const level = section.level || 1;
    const block = exportNode("section", level === 2 ? "print-doc__group print-doc__group--sub" : "print-doc__group");
    if (section.color) block.style.setProperty("--print-color", section.color);
    if (section.title) {
      block.append(exportNode(level === 2 ? "h3" : "h2", "print-doc__group-title", section.title));
    }
    // Заголовок помещения строк не несёт: пустая шапка таблицы под ним
    // читалась бы как потерянные строки.
    if (section.rows.length === 0) {
      doc.append(block);
      continue;
    }
    const tableNode = exportNode("table", "print-doc__table");
    const thead = exportNode("thead");
    const headRow = exportNode("tr");
    for (const column of table.columns) headRow.append(exportNode("th", null, column));
    thead.append(headRow);
    tableNode.append(thead);
    const tbody = exportNode("tbody");
    for (const row of section.rows) {
      // Строка с потерянной ссылкой помечена и на вид: на бумаге она не должна
      // читаться как обычная связь.
      const tr = exportNode("tr", row.problem ? "print-doc__row print-doc__row--problem" : "print-doc__row");
      if (row.color) tr.style.setProperty("--print-row-color", row.color);
      row.cells.forEach((cell, index) => {
        tr.append(exportNode("td", index === 0 ? "print-doc__label" : null, cell));
      });
      tbody.append(tr);
    }
    tableNode.append(tbody);
    block.append(tableNode);
    doc.append(block);
  }

  const totals = Array.isArray(table.totals) ? table.totals : [];
  if (totals.length > 0) {
    const block = exportNode("section", "print-doc__group print-doc__totals");
    block.append(exportNode("h2", "print-doc__group-title", strings.tables.totals));
    const totalsTable = exportNode("table", "print-doc__table");
    const body = exportNode("tbody");
    const line = (title, count, className, color) => {
      const tr = exportNode("tr", className);
      if (color) tr.style.setProperty("--print-row-color", color);
      tr.append(exportNode("td", null, title));
      tr.append(exportNode("td", "print-doc__count", count));
      body.append(tr);
    };
    for (const row of totals) {
      line(
        row.title,
        row.count,
        row.level === 2 ? "print-doc__totals-row print-doc__totals-row--sub" : "print-doc__totals-row",
        row.level === 2 ? null : row.color,
      );
    }
    line(
      table.totalLabel || strings.tables.totalAll,
      table.totalCount,
      "print-doc__totals-row print-doc__totals-row--all",
      null,
    );
    totalsTable.append(body);
    block.append(totalsTable);
    doc.append(block);
  }

  if (options.extra) doc.append(options.extra);
  if (options.footer) doc.append(exportNode("footer", "print-doc__foot", options.footer));
  return doc;
}

function exportPrintRoot() {
  let root = document.getElementById("print-root");
  if (!root) {
    root = exportNode("div", null);
    root.id = "print-root";
    document.body.append(root);
  }
  return root;
}

function exportPrintRun(root) {
  document.body.classList.add("printing");
  const restore = () => document.body.classList.remove("printing");
  const cleanup = () => {
    restore();
    root.replaceChildren();
    window.removeEventListener("afterprint", cleanup);
  };
  window.addEventListener("afterprint", cleanup);
  window.print();
  // Раскладку убирает только afterprint: в Safari window.print() не держит
  // поток, и уборка по таймеру вычистила бы лист из-под открытого диалога
  // печати — на бумагу ушла бы пустая страница. Таймер возвращает экран,
  // содержимое #print-root ждёт следующей печати (на экране оно скрыто).
  setTimeout(restore, 2000);
}

/**
 * Печать без второго окна: раскладка кладётся в #print-root, экран прячется
 * правилами print.css. `kind` — «table» (данные: `{table, title, subtitle,
 * extra}`) или «scheme» (данные: `{blob, title}`).
 */
async function printView(kind, data = {}) {
  const root = exportPrintRoot();
  if (kind === "scheme") {
    const url = URL.createObjectURL(data.blob);
    const wrap = exportNode("div", "print-doc print-doc--scheme");
    if (data.title) wrap.append(exportNode("h1", "print-doc__title", data.title));
    const image = document.createElement("img");
    image.className = "print-doc__image";
    image.src = url;
    wrap.append(image);
    root.replaceChildren(wrap);
    await new Promise((resolve) => {
      image.addEventListener("load", resolve, { once: true });
      image.addEventListener("error", resolve, { once: true });
    });
    exportPrintRun(root);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return;
  }
  root.replaceChildren(
    exportTableNode(data.table, {
      title: data.title,
      subtitle: data.subtitle,
      extra: data.extra,
      footer: data.footer,
    }),
  );
  exportPrintRun(root);
}

// ——— скачивание ———————————————————————————————————————————————————————
function exportDownload(blob, name) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportText(value, name, type) {
  exportDownload(new Blob([value], { type: type || "text/plain;charset=utf-8" }), name);
}

// Буфер обмена доступен не везде (file:// без разрешения) — запасной путь
// через скрытое поле, иначе кнопка «Копировать» молча ничего не делает.
async function exportCopy(value) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(value);
      return true;
    } catch (error) {
      // падаем в запасной путь ниже
    }
  }
  const area = document.createElement("textarea");
  area.value = value;
  area.setAttribute("readonly", "readonly");
  area.style.position = "fixed";
  area.style.opacity = "0";
  document.body.append(area);
  area.select();
  let ok = false;
  try {
    ok = document.execCommand("copy");
  } catch (error) {
    ok = false;
  }
  area.remove();
  return ok;
}

// src/imagePrep.js
// Подготовка плана: проверка файла, поворот на четверть оборота и обрезка рамкой.
// Координаты меток — доли от размера плана, поэтому вместе с картинкой нужно
// пересчитать и доли: метка обязана остаться на том же месте изображения.
// Арифметика здесь чистая (проверяется тестами), браузерные части — ниже.
const PLAN_IMAGE_TYPES = ["image/png", "image/jpeg"];
const PLAN_IMAGE_EXTENSIONS = [".png", ".jpg", ".jpeg"];
const ROTATION_STEPS = [0, 90, 180, 270];

// Тип у перетащенного файла иногда пустой — тогда решает расширение.
function isPlanImageFile(file) {
  if (!file) return false;
  const type = String(file.type || "").toLowerCase();
  if (PLAN_IMAGE_TYPES.includes(type)) return true;
  if (type && type !== "application/octet-stream") return false;
  const name = String(file.name || "").toLowerCase();
  return PLAN_IMAGE_EXTENSIONS.some((extension) => name.endsWith(extension));
}

// Тип берётся из расширения, когда браузер его не назвал: у перетащенного
// файла type часто пуст, и JPEG иначе уехал бы в хранилище и в zip как png.
function planTypeOf(file) {
  const type = String((file && file.type) || "").toLowerCase();
  if (PLAN_IMAGE_TYPES.includes(type)) return type;
  const name = String((file && file.name) || "").toLowerCase();
  if (name.endsWith(".jpg") || name.endsWith(".jpeg")) return "image/jpeg";
  return "image/png";
}

// Пропорция плана. Замена подложки на картинку другой пропорции сдвигает всю
// разметку относительно плана: доли остаются прежними, а содержимое картинки
// растянуто иначе. Допуск закрывает округление пикселей при экспорте плана.
function planAspect(size) {
  const width = Number(size && size.width);
  const height = Number(size && size.height);
  return width > 0 && height > 0 ? width / height : 0;
}
function sameAspect(before, after, tolerance = 0.01) {
  const first = planAspect(before);
  const second = planAspect(after);
  if (!first || !second) return true;
  return Math.abs(first - second) / Math.max(first, second) <= tolerance;
}
function identityTransform() {
  return { rotate: 0, crop: null };
}

function clampUnit(value, fallback) {
  const number = Number(value);
  if (!Number.isFinite(number)) return fallback;
  return Math.min(1, Math.max(0, number));
}

// Поворот приводится к четверти оборота, рамка — к прямоугольнику внутри плана.
function normalizeTransform(transform) {
  const source = transform || {};
  const turns = Math.round(Number(source.rotate || 0) / 90);
  const rotate = ((turns % 4) + 4) % 4 * 90;
  const raw = source.crop;
  if (!raw) return { rotate, crop: null };
  const x = clampUnit(raw.x, 0);
  const y = clampUnit(raw.y, 0);
  const width = Math.min(clampUnit(raw.width, 1), 1 - x);
  const height = Math.min(clampUnit(raw.height, 1), 1 - y);
  if (width <= 0 || height <= 0) return { rotate, crop: null };
  if (x === 0 && y === 0 && width === 1 && height === 1) return { rotate, crop: null };
  return { rotate, crop: { x, y, width, height } };
}

// Доли в системе повёрнутого плана: вправо (x,y) -> (1−y, x), влево -> (y, 1−x).
function rotateFraction(point, rotate) {
  if (rotate === 90) return { x: 1 - point.y, y: point.x };
  if (rotate === 180) return { x: 1 - point.x, y: 1 - point.y };
  if (rotate === 270) return { x: point.y, y: 1 - point.x };
  return { x: point.x, y: point.y };
}

// Поворот и обрезка копятся в одно преобразование: (поворот на R, затем рамка
// в долях повёрнутого плана). Так исходник пережимается один раз, а метки
// пересчитываются одним шагом — и считаются один раз, а не на каждом шаге.
function rotateTransform(transform, degrees) {
  const current = normalizeTransform(transform);
  const turns = ((Math.round(Number(degrees || 0) / 90) % 4) + 4) % 4;
  const rotate = (current.rotate + turns * 90) % 360;
  if (!current.crop) return { rotate, crop: null };
  const a = rotateFraction({ x: current.crop.x, y: current.crop.y }, turns * 90);
  const b = rotateFraction(
    { x: current.crop.x + current.crop.width, y: current.crop.y + current.crop.height },
    turns * 90,
  );
  return {
    rotate,
    crop: {
      x: Math.min(a.x, b.x),
      y: Math.min(a.y, b.y),
      width: Math.abs(a.x - b.x),
      height: Math.abs(a.y - b.y),
    },
  };
}

// Рамка задаётся в долях того, что видно сейчас, — то есть внутри прежней рамки.
function cropTransform(transform, frame) {
  const current = normalizeTransform(transform);
  const box = normalizeTransform({ crop: frame }).crop;
  if (!box) return current;
  const base = current.crop || { x: 0, y: 0, width: 1, height: 1 };
  return normalizeTransform({
    rotate: current.rotate,
    crop: {
      x: base.x + box.x * base.width,
      y: base.y + box.y * base.height,
      width: box.width * base.width,
      height: box.height * base.height,
    },
  });
}
function transformPoint(point, transform) {
  const { rotate, crop } = normalizeTransform(transform);
  const turned = rotateFraction({ x: Number(point.x), y: Number(point.y) }, rotate);
  if (!crop) return turned;
  return { x: (turned.x - crop.x) / crop.width, y: (turned.y - crop.y) / crop.height };
}

// Смещение подписи задано в пикселях экрана: обрезка его не трогает, поворот —
// поворачивает так же, как саму картинку, иначе подпись уедет на другую сторону.
function transformOffset(offset, transform) {
  if (!offset) return offset;
  const { rotate } = normalizeTransform(transform);
  const dx = Number(offset.dx) || 0;
  const dy = Number(offset.dy) || 0;
  if (rotate === 90) return { dx: -dy, dy: dx };
  if (rotate === 180) return { dx: -dx, dy: -dy };
  if (rotate === 270) return { dx: dy, dy: -dx };
  return { dx, dy };
}

// Ничего не менялось — значит и переписывать план незачем.
function isIdentityTransform(transform) {
  const settings = normalizeTransform(transform);
  return settings.rotate === 0 && !settings.crop;
}
function transformSize(size, transform) {
  const { rotate, crop } = normalizeTransform(transform);
  const turned =
    rotate === 90 || rotate === 270
      ? { width: Number(size.height), height: Number(size.width) }
      : { width: Number(size.width), height: Number(size.height) };
  if (!crop) return { width: Math.round(turned.width), height: Math.round(turned.height) };
  return {
    width: Math.max(1, Math.round(turned.width * crop.width)),
    height: Math.max(1, Math.round(turned.height * crop.height)),
  };
}

// Пересчёт всех точек одной метки: используется панелью схем перед updateMark.
function transformMarkPoints(points, transform) {
  return (points || []).map((point) => {
    const next = transformPoint(point, transform);
    return { x: Math.min(1, Math.max(0, next.x)), y: Math.min(1, Math.max(0, next.y)) };
  });
}

// Метка за рамкой обрезки была бы потеряна: считаем такие, чтобы предупредить.
function countPointsOutside(points, transform) {
  let outside = 0;
  for (const point of points || []) {
    const next = transformPoint(point, transform);
    if (next.x < 0 || next.x > 1 || next.y < 0 || next.y > 1) outside += 1;
  }
  return outside;
}

// ——— браузерная часть ————————————————————————————————————————————————

function planOutputType(blob) {
  return planTypeOf(blob);
}

// createImageBitmap есть не везде (и не всегда по file://) — запасной путь <img>.
async function decodePlanImage(blob) {
  const url = URL.createObjectURL(blob);
  try {
    if (typeof createImageBitmap === "function") {
      const bitmap = await createImageBitmap(blob);
      return { image: bitmap, width: bitmap.width, height: bitmap.height, url };
    }
    const image = await new Promise((resolve, reject) => {
      const element = new Image();
      element.onload = () => resolve(element);
      element.onerror = () => reject(new Error("decode"));
      element.src = url;
    });
    return { image, width: image.naturalWidth, height: image.naturalHeight, url };
  } catch (error) {
    URL.revokeObjectURL(url);
    throw error;
  }
}
function releasePlanImage(decoded) {
  if (!decoded) return;
  if (decoded.url) URL.revokeObjectURL(decoded.url);
  if (decoded.image && typeof decoded.image.close === "function") decoded.image.close();
}

// Файл плана: проверка типа и настоящий размер картинки в пикселях.
async function readPlanImage(file) {
  const blob = file.slice ? file.slice(0, file.size, planTypeOf(file)) : file;
  const decoded = await decodePlanImage(blob);
  const size = { width: decoded.width, height: decoded.height };
  releasePlanImage(decoded);
  return { blob, width: size.width, height: size.height };
}

function blobFromCanvas(canvas, type) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(
      (blob) => (blob ? resolve(blob) : reject(new Error("toBlob"))),
      type,
      type === "image/jpeg" ? 0.92 : undefined,
    );
  });
}

// Новая картинка плана по тому же преобразованию, что и доли меток.
async function renderPlanImage(blob, transform) {
  const settings = normalizeTransform(transform);
  const decoded = await decodePlanImage(blob);
  try {
    const turned = transformSize({ width: decoded.width, height: decoded.height }, { rotate: settings.rotate });
    const size = transformSize({ width: decoded.width, height: decoded.height }, settings);
    const canvas = document.createElement("canvas");
    canvas.width = size.width;
    canvas.height = size.height;
    const ctx = canvas.getContext("2d");
    if (settings.crop) {
      ctx.translate(-Math.round(turned.width * settings.crop.x), -Math.round(turned.height * settings.crop.y));
    }
    if (settings.rotate === 90) {
      ctx.translate(turned.width, 0);
      ctx.rotate(Math.PI / 2);
    } else if (settings.rotate === 180) {
      ctx.translate(turned.width, turned.height);
      ctx.rotate(Math.PI);
    } else if (settings.rotate === 270) {
      ctx.translate(0, turned.height);
      ctx.rotate(-Math.PI / 2);
    }
    ctx.drawImage(decoded.image, 0, 0);
    const out = await blobFromCanvas(canvas, planOutputType(blob));
    return { blob: out, width: size.width, height: size.height };
  } finally {
    releasePlanImage(decoded);
  }
}

// src/panels/colorPicker.js
// Своё окно выбора цвета: слева палитра объекта, справа — поле оттенка
// и точная правка по числам.
//
// Системное `<input type="color">` здесь не годится по двум причинам.
// Во-первых, оно ничего не знает о палитре объекта и о том, какие цвета уже
// заняты соседними комнатами, — а повтор цвета на плане и есть главная беда.
// Во-вторых, оно выглядит по-разному в каждой системе и в каждом браузере,
// а в части из них его вовсе не открыть с клавиатуры. Поэтому поле
// «насыщенность/яркость» и полоса оттенка рисуются холстом, а любое движение
// мыши здесь повторяется стрелками и полями R, G, B.




const COLOR_FIELD_SIZE = { width: 232, height: 168 };
const COLOR_HUE_HEIGHT = 18;
// Шаг стрелок: мелкий для точной подгонки, крупный с Shift.
const COLOR_STEP = { fine: 0.02, coarse: 0.1, hue: 2, hueCoarse: 12 };
const COLOR_FALLBACK = "#8B949E";
// Плотность заливки контура на белом плане: окно показывает цвет и линией,
// и заливкой — так видно, как он ляжет на схему.
const COLOR_PLAN_ALPHA = 0.12;

function colorHexOf(hsv) {
  return rgbToHex(hsvToRgb(hsv));
}

// Подсказка цвета — одним местом на всё окно и на кнопку. Голый hex человеку
// не говорит ничего: «#164E63» узнаётся только сверкой кодов, а «тёмно-
// бирюзовый» — с первого взгляда. Код при этом остаётся: по нему тот же цвет
// ищут в другом окне и в таблице.
//
// Имя есть у любого цвета, включая заведённый пользователем (`colorName.js`),
// но `colorNameHex` возвращает пустую строку на мусоре вместо кода — тогда
// подсказка остаётся прежней подписью, а не превращается в «Цвет: ».
function colorLabel(label, value) {
  const named = colorNameHex(value);
  if (!named) return label || "";
  if (!label) return named;
  return text("colorPicker.named", { label, color: named });
}

// Подсказка плитки палитры. Занятость дописывается к имени, а не заменяет его:
// у занятого цвета человеку нужно и то и другое — как он называется и почему
// он помечен. Поэтому и пометка здесь же, а не отдельной веткой у плитки.
function colorSwatchTitle(color, busy) {
  const named = colorLabel("", color);
  return busy ? text("colorPicker.taken", { color: named }) : named;
}

// Поле насыщенности и яркости: заливка чистым оттенком, поверх — белый
// градиент слева направо и чёрный сверху вниз. Кружок-курсор рисуется тем же
// холстом: отдельный слой поверх canvas пришлось бы двигать вручную.
function colorDrawField(canvas, hsv) {
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  const { width, height } = canvas;
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = colorHexOf({ h: hsv.h, s: 1, v: 1 });
  ctx.fillRect(0, 0, width, height);
  const white = ctx.createLinearGradient(0, 0, width, 0);
  white.addColorStop(0, "rgba(255, 255, 255, 1)");
  white.addColorStop(1, "rgba(255, 255, 255, 0)");
  ctx.fillStyle = white;
  ctx.fillRect(0, 0, width, height);
  const black = ctx.createLinearGradient(0, 0, 0, height);
  black.addColorStop(0, "rgba(0, 0, 0, 0)");
  black.addColorStop(1, "rgba(0, 0, 0, 1)");
  ctx.fillStyle = black;
  ctx.fillRect(0, 0, width, height);

  const place = colorHsvToField(hsv);
  const x = place.x * width;
  const y = place.y * height;
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(0, 0, 0, 0.55)";
  ctx.beginPath();
  ctx.arc(x, y, 7.5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(x, y, 6, 0, Math.PI * 2);
  ctx.stroke();
}

function colorDrawHue(canvas, hsv) {
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  const { width, height } = canvas;
  const rainbow = ctx.createLinearGradient(0, 0, width, 0);
  for (let stop = 0; stop <= 6; stop += 1) {
    rainbow.addColorStop(stop / 6, colorHexOf({ h: stop * 60, s: 1, v: 1 }));
  }
  ctx.fillStyle = rainbow;
  ctx.fillRect(0, 0, width, height);

  const x = (((hsv.h % 360) + 360) % 360) / 360 * width;
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(0, 0, 0, 0.55)";
  ctx.strokeRect(x - 3, 1, 6, height - 2);
  ctx.strokeStyle = "#FFFFFF";
  ctx.strokeRect(x - 2, 2, 4, height - 4);
}

// Мышь, палец и перо — один и тот же обработчик: холст забирает указатель
// себе, поэтому линия ведётся даже когда курсор ушёл за край поля.
function colorDrag(canvas, onPoint) {
  const at = (event) => {
    const box = canvas.getBoundingClientRect();
    onPoint((event.clientX - box.left) / box.width, (event.clientY - box.top) / box.height);
  };
  canvas.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    canvas.setPointerCapture(event.pointerId);
    canvas.focus();
    at(event);
  });
  canvas.addEventListener("pointermove", (event) => {
    if (canvas.hasPointerCapture(event.pointerId)) at(event);
  });
  const release = (event) => {
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
  };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);
}

function colorTakenList(used) {
  return (Array.isArray(used) ? used : []).filter((value) => hexToRgb(value)).map((value) => String(value).trim());
}

// Enter внутри диалога нажимает его основное действие («ОК»), и делает это
// раньше, чем браузер успевает превратить Enter в клик по кнопке под фокусом.
// Поэтому кнопки самого окна обрабатывают Enter сами: выбор цвета с клавиатуры
// не должен заодно закрывать окно, отдав прежний цвет.
function colorEnter(node, run) {
  node.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    event.preventDefault();
    run();
  });
  return node;
}
function openColorPicker(options = {}) {
  return new Promise((resolve) => {
    const before = hexToRgb(options.color) ? String(options.color).trim().toUpperCase() : COLOR_FALLBACK;
    const taken = colorTakenList(options.used).filter(
      (value) => String(value).toUpperCase() !== before,
    );
    let hsv = rgbToHsv(hexToRgb(before));
    let modal;

    const field = uiEl("canvas", {
      class: "colorpick__field",
      title: strings.colorPicker.field,
      attrs: {
        width: String(COLOR_FIELD_SIZE.width),
        height: String(COLOR_FIELD_SIZE.height),
        tabindex: "0",
        role: "application",
        "aria-label": strings.colorPicker.field,
      },
    });
    const hue = uiEl("canvas", {
      class: "colorpick__hue",
      title: strings.colorPicker.hue,
      attrs: {
        width: String(COLOR_FIELD_SIZE.width),
        height: String(COLOR_HUE_HEIGHT),
        tabindex: "0",
        role: "application",
        "aria-label": strings.colorPicker.hue,
      },
    });
    const chip = uiEl("span", { class: "colorpick__chip" });
    // «Было» называет прежний цвет словом: рядом с новым сразу видно, что
    // меняешь, — а не два кружка, отличие которых надо угадывать.
    const chipBefore = uiEl("span", {
      class: "colorpick__chip colorpick__chip--before",
      title: colorLabel(strings.colorPicker.before, before),
      attrs: { style: "background:" + before },
    });
    const value = uiEl("span", { class: "colorpick__value" });
    const onPlan = uiEl("span", { class: "colorpick__plan", title: strings.colorPicker.onPlan });
    const swatches = uiEl("div", {
      class: "colorpick__palette",
      attrs: { role: "group", "aria-label": strings.colorPicker.palette },
    });
    const numbers = {};

    function numberField(key, label) {
      const input = uiEl("input", {
        class: "ui-input colorpick__number",
        type: "number",
        attrs: { min: "0", max: "255", step: "1", "aria-label": label },
        on: {
          input: () => {
            const rgb = {
              r: Number(numbers.r.value),
              g: Number(numbers.g.value),
              b: Number(numbers.b.value),
            };
            setColor(rgbToHex(rgb), input);
          },
          blur: () => sync(),
        },
      });
      numbers[key] = input;
      return uiEl("label", { class: "colorpick__number-box" }, [
        uiEl("span", { class: "colorpick__number-label", text: label }),
        input,
      ]);
    }

    // Единственное место, где перерисовывается всё сразу: поле, полоса,
    // превью, числа и отметка в палитре. Поле, в котором сейчас печатают,
    // не трогаем — иначе «12» на пути к «120» прыгало бы обратно.
    function sync(skip) {
      const color = colorHexOf(hsv);
      const rgb = hsvToRgb(hsv);
      colorDrawField(field, hsv);
      colorDrawHue(hue, hsv);
      chip.setAttribute("style", "background:" + color);
      // Кружок нового цвета зовётся так же, как прежний, — иначе «Было»
      // называлось бы словом, а «стало» оставалось кодом.
      chip.title = colorLabel("", color);
      // Так цвет ляжет на белый план: линия контура и заливка помещения.
      onPlan.setAttribute(
        "style",
        "border-color:" + color + ";background:" + colorBlend(color, "#FFFFFF", COLOR_PLAN_ALPHA),
      );
      value.textContent = color;
      for (const [key, input] of Object.entries(numbers)) {
        if (input === skip) continue;
        input.value = String(rgb[key]);
      }
      for (const button of swatches.children) {
        const same = colorDistance(button.dataset.color, color) < 1;
        button.classList.toggle("is-active", same);
        button.setAttribute("aria-pressed", same ? "true" : "false");
      }
    }

    function setHsv(next, skip) {
      // Стрелки и полоса оттенка выезжают за края так же, как мышь, поэтому
      // и приводит их к цвету та же функция, что переводит курсор поля.
      hsv = colorFieldToHsv({ h: next.h, x: next.s, y: 1 - next.v });
      sync(skip);
    }

    function setColor(color, skip) {
      const rgb = hexToRgb(color);
      if (!rgb) return;
      const next = rgbToHsv(rgb);
      // Серый и чёрный не хранят оттенка — иначе ползунок прыгал бы к красному.
      setHsv({ h: next.s === 0 ? hsv.h : next.h, s: next.s, v: next.v }, skip);
    }

    for (const color of ROOM_PALETTE) {
      const busy = colorTaken(color, taken);
      // Плитка называется словом и кодом — и занятая тоже.
      const hint = colorSwatchTitle(color, busy);
      const button = uiEl("button", {
        class: "colorpick__swatch" + (busy ? " is-used" : ""),
        type: "button",
        title: hint,
        attrs: { style: "background:" + color, "aria-label": hint, "aria-pressed": "false" },
        on: { click: () => setColor(color) },
      });
      button.dataset.color = color;
      colorEnter(button, () => setColor(color));
      swatches.append(button);
    }

    colorDrag(field, (x, y) => setHsv(colorFieldToHsv({ h: hsv.h, x, y })));
    colorDrag(hue, (x) => setHsv({ h: x * 360, s: hsv.s, v: hsv.v }));

    field.addEventListener("keydown", (event) => {
      const step = event.shiftKey ? COLOR_STEP.coarse : COLOR_STEP.fine;
      const moves = {
        ArrowLeft: { s: -step, v: 0 },
        ArrowRight: { s: step, v: 0 },
        ArrowUp: { s: 0, v: step },
        ArrowDown: { s: 0, v: -step },
      };
      const move = moves[event.key];
      if (!move) return;
      event.preventDefault();
      setHsv({ h: hsv.h, s: hsv.s + move.s, v: hsv.v + move.v });
    });

    hue.addEventListener("keydown", (event) => {
      const step = event.shiftKey ? COLOR_STEP.hueCoarse : COLOR_STEP.hue;
      const moves = { ArrowLeft: -step, ArrowDown: -step, ArrowRight: step, ArrowUp: step };
      const move = moves[event.key];
      if (move == null) return;
      event.preventDefault();
      setHsv({ h: hsv.h + move, s: hsv.s, v: hsv.v });
    });

    const roll = () => setColor(randomColor([...taken, colorHexOf(hsv)]));
    const shuffle = colorEnter(
      uiButton(strings.colorPicker.random, { class: "ui-btn colorpick__random", on: { click: roll } }),
      roll,
    );

    const body = uiEl("div", { class: "colorpick" }, [
      uiEl("div", { class: "colorpick__side" }, [
        uiEl("p", { class: "colorpick__caption", text: strings.colorPicker.palette }),
        swatches,
      ]),
      uiEl("div", { class: "colorpick__side colorpick__side--custom" }, [
        uiEl("p", { class: "colorpick__caption", text: strings.colorPicker.custom }),
        field,
        hue,
        uiEl("div", { class: "colorpick__bottom" }, [
          uiEl("div", { class: "colorpick__preview" }, [chipBefore, chip, onPlan, value]),
          uiEl("div", { class: "colorpick__numbers" }, [
            numberField("r", strings.colorPicker.red),
            numberField("g", strings.colorPicker.green),
            numberField("b", strings.colorPicker.blue),
          ]),
        ]),
        shuffle,
      ]),
    ]);

    const done = (result) => {
      modal.close();
      resolve(result);
    };
    modal = uiModal({
      title: options.title || strings.colorPicker.title,
      body,
      actions: [
        uiButton(strings.dialog.cancel, { on: { click: () => done(null) } }),
        uiButton(strings.colorPicker.apply, {
          class: "ui-btn ui-btn--accent",
          on: { click: () => done(colorHexOf(hsv)) },
        }),
      ],
      dismissable: true,
      onCancel: () => resolve(null),
    });
    // Ширину задаёт содержимое — палитра и поле оттенка: общая мера диалогов
    // оставляла справа пустое поле. Та же мера, что у сеток формы и начертания.
    if (modal.card) modal.card.classList.add("modal--fit");
    sync();
    field.focus();
  });
}

// Кнопка цвета в строке справочника или помещения: показывает текущий цвет
// и открывает окно выбора. Никаких `<input type="color">` в сборке больше нет.
//
// Подсказка называет не только назначение кнопки, но и сам цвет — «Цвет
// категории: пурпурный (#E80098)»: цветного квадратика хватает, чтобы отличить
// две строки друг от друга, и не хватает, чтобы назвать цвет вслух или найти
// тот же в другом окне. Кнопка от этого не растёт: подсказка живёт в `title`,
// а ширину квадратику задаёт CSS.
function colorPickerButton({ value, used, title, dialogTitle, onPick }) {
  const label = title || strings.colorPicker.title;
  let color = value;
  const hint = () => colorLabel(label, color);
  const button = uiEl("button", {
    class: "colorpick__button",
    type: "button",
    title: hint(),
    attrs: { style: "background:" + (color || COLOR_FALLBACK), "aria-label": hint() },
    on: {
      click: async () => {
        const picked = await openColorPicker({ color, used, title: dialogTitle || title });
        if (!picked) return;
        color = picked;
        button.setAttribute("style", "background:" + picked);
        // Имя в подсказке держится выбранного цвета: кнопку после выбора никто
        // не перестраивает, и без этой строки она называла бы прежний.
        button.title = hint();
        button.setAttribute("aria-label", button.title);
        onPick(picked);
      },
    },
  });
  return button;
}

// src/panels/filters.js
// Фильтры списка меток: галочки категорий и типов, помещение и поиск.
//
// Фильтр живёт в состоянии сеанса (`state.filter`) и один на всех: по нему
// рисует холст, по нему же строится список сбоку и легенда в выгрузке.
// Поэтому здесь только чистые функции над ним — что видно, что отмечено и во
// что превращается щелчок по галочке; сама панель собирается из них ниже.




// Порядок строк списка — порядок справочника: категории по своему order, типы
// внутри, метки по номеру. Тот же обход, что у легенды и таблиц.
function filtersMarkRows(project, schemeId, filter) {
  const scheme = project ? findScheme(project, schemeId) : null;
  if (!scheme) return [];
  const order = new Map();
  const categoryOf = new Map();
  let index = 0;
  for (const group of typesInOrder(project)) {
    for (const type of group.types) {
      order.set(type.id, index);
      categoryOf.set(type.id, group.category);
      index += 1;
    }
  }
  const last = index;
  return visibleMarks(project, scheme, filter)
    .map((mark) => ({
      mark,
      type: findType(project, mark.typeId),
      category: categoryOf.get(mark.typeId) || null,
      style: styleOf(project, mark.typeId),
      label: labelOf(project, mark.id),
    }))
    .sort((a, b) => {
      const orderA = order.has(a.mark.typeId) ? order.get(a.mark.typeId) : last;
      const orderB = order.has(b.mark.typeId) ? order.get(b.mark.typeId) : last;
      return orderA === orderB ? a.mark.number - b.mark.number : orderA - orderB;
    });
}

// Видимые типы — одно множество, из которого собираются оба поля фильтра.
// Галочка категории и галочка типа правят его, а `categoryIds`/`typeIds`
// пересчитываются заново: держать две независимые истины — значит рано или
// поздно показать метку, которую сняли галочкой, или наоборот.
function filtersTypeSet(project, filter) {
  const byType = filter && Array.isArray(filter.typeIds) ? new Set(filter.typeIds) : null;
  const byCategory = filter && Array.isArray(filter.categoryIds) ? new Set(filter.categoryIds) : null;
  const visible = new Set();
  for (const type of project.markTypes) {
    if (byType && !byType.has(type.id)) continue;
    if (byCategory && !byCategory.has(type.categoryId)) continue;
    visible.add(type.id);
  }
  return visible;
}

function filtersFromTypeSet(project, filter, visible) {
  const types = project.markTypes;
  const everyType = types.every((type) => visible.has(type.id));
  // Категория без типов — всегда отмечена: прятать в ней нечего.
  const categories = project.categories.filter((category) => {
    const own = types.filter((type) => type.categoryId === category.id);
    return own.length === 0 || own.some((type) => visible.has(type.id));
  });
  const everyCategory = categories.length === project.categories.length;
  return {
    ...(filter || {}),
    categoryIds: everyCategory ? null : categories.map((category) => category.id),
    typeIds: everyType ? null : types.filter((type) => visible.has(type.id)).map((type) => type.id),
  };
}
function filtersTypeChecked(project, filter, typeId) {
  return filtersTypeSet(project, filter).has(typeId);
}

// «on» — видны все типы категории, «off» — ни одного, «mixed» — часть.
function filtersCategoryChecked(project, filter, categoryId) {
  const visible = filtersTypeSet(project, filter);
  const own = project.markTypes.filter((type) => type.categoryId === categoryId);
  if (own.length === 0) return "on";
  const shown = own.filter((type) => visible.has(type.id)).length;
  if (shown === 0) return "off";
  return shown === own.length ? "on" : "mixed";
}
function filtersToggleType(project, filter, typeId, on) {
  const visible = filtersTypeSet(project, filter);
  if (on) visible.add(typeId);
  else visible.delete(typeId);
  return filtersFromTypeSet(project, filter, visible);
}
function filtersToggleCategory(project, filter, categoryId, on) {
  const visible = filtersTypeSet(project, filter);
  for (const type of project.markTypes) {
    if (type.categoryId !== categoryId) continue;
    if (on) visible.add(type.id);
    else visible.delete(type.id);
  }
  return filtersFromTypeSet(project, filter, visible);
}
function filtersSetAllTypes(project, filter, on) {
  const visible = new Set(on ? project.markTypes.map((type) => type.id) : []);
  return filtersFromTypeSet(project, filter, visible);
}
function filtersActive(filter) {
  if (!filter) return false;
  return Boolean(
    Array.isArray(filter.categoryIds) ||
      Array.isArray(filter.typeIds) ||
      filter.roomId ||
      (filter.query || "").trim(),
  );
}

// ——— панель фильтров ——————————————————————————————————————————————————

function filtersSignature(project) {
  if (!project) return "";
  return [
    project.categories.map((category) => [category.id, category.name, category.color, category.shape].join("~")).join("|"),
    project.markTypes.map((type) => [type.id, type.code, type.name, type.categoryId, type.shape].join("~")).join("|"),
    project.rooms.map((room) => [room.id, room.name].join("~")).join("|"),
  ].join("#");
}

// Дерево галочек перестраивается только при правке справочника: щелчок по
// галочке меняет фильтр, а не разметку панели — иначе чекбокс исчезал бы
// из-под курсора вместе с фокусом.
function filtersBox(api) {
  const { getState, setState, subscribe } = api;
  const node = uiEl("div", { class: "filters" });
  const search = uiEl("input", {
    class: "ui-input filters__search",
    type: "text",
    placeholder: strings.filters.searchPlaceholder,
    title: strings.filters.searchHint,
    on: { input: () => patch({ query: search.value }) },
  });
  const rooms = uiEl("select", {
    class: "ui-select",
    title: strings.filters.room,
    on: { change: () => patch({ roomId: rooms.value || null }) },
  });
  const tree = uiEl("div", { class: "filters__tree" });
  const summary = uiEl("summary", { class: "filters__summary", text: strings.filters.types });
  const details = uiEl("details", { class: "filters__details" }, [summary, tree]);
  const reset = uiButton(strings.filters.showAll, {
    class: "ui-btn ui-btn--wide",
    on: {
      click: () => {
        const state = getState();
        setState({ filter: { ...filtersSetAllTypes(state.project, state.filter, true), roomId: null, query: "" } });
        search.value = "";
      },
    },
  });
  let signature = null;
  let checks = [];

  function patch(part) {
    const state = getState();
    setState({ filter: { ...state.filter, ...part } });
  }

  function toggle(state, next) {
    setState({ filter: { ...next, roomId: state.filter.roomId, query: state.filter.query } });
  }

  function buildTree(project) {
    checks = [];
    tree.replaceChildren();
    rooms.replaceChildren(uiEl("option", { value: "", text: strings.filters.allRooms }));
    for (const room of roomsInOrder(project)) {
      rooms.append(uiEl("option", { value: room.id, text: room.name }));
    }
    for (const { category, types } of project ? typesInOrder(project) : []) {
      const box = uiEl("input", { class: "filters__check", type: "checkbox" });
      box.addEventListener("change", () => {
        const state = getState();
        toggle(state, filtersToggleCategory(state.project, state.filter, category.id, box.checked));
      });
      checks.push({ box, kind: "category", id: category.id });
      const dot = uiEl("span", { class: "filters__dot" });
      dot.style.background = category.color;
      tree.append(
        uiEl("label", { class: "filters__category" }, [
          box,
          dot,
          uiEl("span", { class: "filters__name", text: category.name }),
        ]),
      );
      for (const type of types) {
        const typeBox = uiEl("input", { class: "filters__check", type: "checkbox" });
        typeBox.addEventListener("change", () => {
          const state = getState();
          toggle(state, filtersToggleType(state.project, state.filter, type.id, typeBox.checked));
        });
        checks.push({ box: typeBox, kind: "type", id: type.id });
        tree.append(
          uiEl("label", { class: "filters__type" }, [
            typeBox,
            uiEl("span", { class: "filters__code", text: type.code }),
            uiEl("span", { class: "filters__name", text: type.name }),
          ]),
        );
      }
    }
  }

  function syncChecks(state) {
    const project = state.project;
    if (!project) return;
    let hidden = 0;
    for (const item of checks) {
      if (item.kind === "category") {
        const mode = filtersCategoryChecked(project, state.filter, item.id);
        item.box.checked = mode !== "off";
        item.box.indeterminate = mode === "mixed";
      } else {
        const on = filtersTypeChecked(project, state.filter, item.id);
        item.box.checked = on;
        if (!on) hidden += 1;
      }
    }
    summary.textContent = hidden > 0
      ? strings.filters.types + " — " + text("filters.hidden", { count: hidden })
      : strings.filters.types;
    rooms.value = state.filter.roomId || "";
    if (search.value !== (state.filter.query || "") && document.activeElement !== search) {
      search.value = state.filter.query || "";
    }
    reset.disabled = !filtersActive(state.filter);
  }

  function render() {
    const state = getState();
    const next = filtersSignature(state.project);
    if (next !== signature) {
      signature = next;
      buildTree(state.project);
    }
    syncChecks(state);
  }

  node.replaceChildren(search, rooms, details, reset);
  subscribe((state, changed) => {
    if ("project" in changed || "filter" in changed) render();
  });
  render();
  return { node, render };
}

// src/panels/markControls.js
// Окно выбора метки: с фильтром по помещению, значком и обозначением — тем же,
// что на плане. Одно на всю сборку: им выбирают и подчинённые метки для
// «чем управляет», и метку места для единицы оборудования, и связанные с ней.
//
// Отдельный файл, потому что это диалог со своей жизнью: список меток сбоку
// открывает его и получает ответ, а как он устроен внутри — его дело. В самом
// списке этому коду тесно: строка метки и так собирает семь полей.





// Кандидаты: метки объекта в том же порядке, что и список сбоку, — схема за
// схемой, внутри по справочнику и номеру. Помещение сужает список: с
// рукописного листа «В3 — на В33 (Т1, Т2, Т3)» видно, что выключатель ищут
// среди светильников своей комнаты.
function markControlsCandidates(project, excludeId, roomId) {
  const rows = [];
  for (const scheme of schemesInOrder(project)) {
    for (const row of filtersMarkRows(project, scheme.id, { roomId: roomId || null })) {
      if (row.mark.id !== excludeId) rows.push({ ...row, scheme });
    }
  }
  return rows;
}

/**
 * Помещение, с которым окно открывается «для метки».
 *
 * Слова заказчика: «при открытии окна Чем управляет у метки — сразу фильтруй
 * по метке комнаты, для которой выбираем». Случай у него частый: выключатель
 * включает свет в своей же комнате, и выбирать помещение руками каждый раз —
 * лишнее движение.
 *
 * Пустая строка — «Все помещения»: у метки помещения нет, метка не нашлась
 * или помещение успели удалить. Значение только начальное — фильтр остаётся
 * живым, и на «Все помещения» пользователь переключается как раньше.
 */
function markControlsInitialRoom(project, markId) {
  const mark = markId ? findMark(project, markId) : null;
  if (!mark || !mark.roomId) return "";
  return findRoom(project, mark.roomId) ? mark.roomId : "";
}

/**
 * Окно выбора меток — кирпичами из ui.js: стопка диалогов, Escape и возврат
 * фокуса у них общие.
 * `options`: `{title, hint, chosen: [markId], exclude: markId, multiple,
 * roomId}`, где `roomId` — помещение, на котором фильтр стоит при открытии.
 * Отвечает списком отмеченных меток (в режиме одной — списком из одной) или
 * `null`, если передумали. В режиме одной выбор сразу закрывает окно: лишнее
 * подтверждение там, где выбирают одну строку, только мешает.
 */
function openMarkPicker(project, options = {}) {
  return new Promise((resolve) => {
    const multiple = options.multiple !== false;
    const excludeId = options.exclude || null;
    const chosen = new Set(Array.isArray(options.chosen) ? options.chosen : []);
    const manySchemes = schemesInOrder(project).length > 1;
    const list = uiEl("div", { class: "controls-pick__list" });
    const note = uiEl("p", { class: "controls-pick__note" });
    const rooms = uiEl("select", {
      class: "ui-select",
      title: strings.controls.room,
      on: { change: () => renderList() },
    });
    rooms.append(uiEl("option", { value: "", text: strings.filters.allRooms }));
    for (const room of roomsInOrder(project)) {
      rooms.append(uiEl("option", { value: room.id, text: room.name }));
    }
    // Начальное помещение ставится до первой отрисовки списка — иначе окно
    // моргнуло бы полным списком и тут же сузило его. Значения без своего
    // пункта select не примет и останется на «Все помещения».
    rooms.value = options.roomId || "";

    function renderNote() {
      note.textContent = multiple ? text("controls.chosen", { count: chosen.size }) : "";
    }

    function markLine(row) {
      const room = row.mark.roomId ? findRoom(project, row.mark.roomId) : null;
      // Где метка стоит: помещение, а для многоэтажного объекта — и схема.
      const where = [room ? room.name : "", manySchemes ? row.scheme.name : ""].filter(Boolean).join(" · ");
      return [
        // Метка узнаётся так же, как на плане: обозначение, цвет, форма.
        shapeIcon(row.style.shape, row.style.color, 20),
        uiEl("span", { class: "controls-pick__label", text: row.label }),
        uiEl("span", { class: "controls-pick__name", text: row.type ? row.type.name : "" }),
        uiEl("span", { class: "controls-pick__room", text: where }),
      ];
    }

    function renderList() {
      const rows = markControlsCandidates(project, excludeId, rooms.value);
      if (rows.length === 0) {
        const others = project.marks.some((item) => item.id !== excludeId);
        list.replaceChildren(
          uiEl("p", { class: "panel__empty", text: others ? strings.controls.nothingFound : strings.controls.empty }),
        );
        return;
      }
      list.replaceChildren(
        ...rows.map((row) => {
          if (!multiple) {
            return uiEl(
              "button",
              {
                class: "controls-pick__row controls-pick__row--one" + (chosen.has(row.mark.id) ? " is-active" : ""),
                type: "button",
                on: { click: () => done([row.mark.id]) },
              },
              markLine(row),
            );
          }
          const box = uiEl("input", { class: "controls-pick__check", type: "checkbox" });
          box.checked = chosen.has(row.mark.id);
          box.addEventListener("change", () => {
            if (box.checked) chosen.add(row.mark.id);
            else chosen.delete(row.mark.id);
            renderNote();
          });
          return uiEl("label", { class: "controls-pick__row" }, [box, ...markLine(row)]);
        }),
      );
    }

    renderList();
    renderNote();
    let modal;
    const done = (value) => {
      modal.close();
      resolve(value);
    };
    const actions = [uiButton(strings.dialog.cancel, { on: { click: () => done(null) } })];
    if (multiple) {
      actions.push(
        uiButton(strings.controls.save, {
          class: "ui-btn ui-btn--accent",
          on: { click: () => done([...chosen]) },
        }),
      );
    }
    modal = uiModal({
      title: options.title || strings.controls.room,
      body: uiEl("div", { class: "controls-pick" }, [
        options.hint ? uiEl("p", { class: "modal__hint", text: options.hint }) : null,
        rooms,
        list,
        note,
      ]),
      actions,
      onCancel: () => resolve(null),
    });
  });
}

// «Чем управляет» — тот же выбор, только список берётся у самой метки, а
// фильтр при открытии стоит на её помещении.
//
// Уже отмеченные метки из других помещений фильтр с глаз убирает, но не
// теряет: отмеченное живёт отдельно от списка, счётчик «Отмечено: N» считает
// их все, и «Сохранить связь» возвращает их вместе с новыми.
function openMarkControlsPicker(project, markId) {
  return openMarkPicker(project, {
    title: text("controls.title", { label: labelOf(project, markId) }),
    hint: strings.controls.hint,
    chosen: markControlIds(findMark(project, markId)),
    exclude: markId,
    multiple: true,
    roomId: markControlsInitialRoom(project, markId),
  });
}

// src/panels/equipmentPicker.js
// Окно выбора модели оборудования: поиск, фильтры по типу и производителю,
// строки с клавиатурой.
//
// Слова заказчика: «при нажатии у метки Оборудование — не показывай Справочник
// моделей, просто выбор, но выбор сделай красивым окном, с фильтрацией по
// модели, типом и т.д.». Человек у метки пришёл выбрать, а не править: в
// справочнике он видел поля ввода, кнопки удаления и чужие модели — всё, что
// на этом шаге только мешает.
//
// Отдельный файл по той же причине, что `markControls.js` и `typePicker.js`:
// это диалог со своей жизнью. Третьего вида окна здесь нет — приёмы взяты у
// уже существующих: поиск сверху, Enter берёт первую строку, стрелка вниз
// уводит в список, Escape и возврат фокуса общие от `uiModal`. Разметка та же
// (`picker`, `picker__list`, `picker__group`, `picker__row`) — своего набора
// классов и своего CSS у окна нет намеренно.
//
// ——— дорога к заведению новой модели ———
//
// Человек часто понимает, что модели ещё нет, ровно в момент выбора. Возвращать
// его в справочник значило бы потерять шаг, ради которого окно и заведено.
// Поэтому строка заведения живёт прямо здесь — ровно тем же приёмом, что в
// окне выбора типа метки: она **появляется только тогда, когда набранного в
// поиске среди моделей нет**, называет то, что будет заведено, и по кнопке
// заводит модель и сразу её выбирает.
//
// Справочником окно от этого не становится, и разница не на словах: заводить
// можно только то, чего нет, — правки чужих моделей, удаления и списка всех
// полей здесь не появляется. Пустой поиск строки заведения не показывает
// вовсе: «Завести» без названия — это и есть справочник.



// Значение пункта «Без производителя» в фильтре. Один пробел, а не пустая
// строка: пустая уже занята пунктом «Все производители». Совпасть с настоящим
// производителем он не может — у модели тот обрезан по краям (`equipmentText`),
// и одним пробелом быть не бывает.
const PICKER_NO_VENDOR = " ";

// Производитель и артикул в одной строке под названием: по ним модель узнают
// в прайсе, и в списке они нужны рядом, а не вместо названия.
function equipmentPickerAbout(item) {
  return [item.vendor, item.code].map((value) => String(value || "").trim()).filter(Boolean).join(" · ");
}

/**
 * Окно выбора модели. Отвечает `{equipmentId, project}` — `project` новый,
 * если модель завели прямо здесь, — или `null`, если передумали.
 *
 * `options`: `{title, activeId}`.
 */
function openEquipmentPicker(project, options = {}) {
  return new Promise((resolve) => {
    let modal;
    let current = project;
    const done = (result) => {
      modal.close();
      resolve(result || null);
    };

    const list = uiEl("div", { class: "picker__list" });
    const body = uiEl("div", { class: "picker" });
    const error = uiEl("p", { class: "picker__error" });
    const createBox = uiEl("div", { class: "picker__create" });

    const search = uiEl("input", {
      class: "ui-input",
      type: "text",
      placeholder: strings.equipmentPicker.search,
      on: {
        input: () => renderList(),
        keydown: (event) => {
          // Стрелка вниз из поиска — в первую строку списка: дальше по нему
          // ходят стрелками, не хватаясь за мышь.
          if (event.key === "ArrowDown") {
            const first = list.querySelector(".picker__row");
            if (!first) return;
            event.preventDefault();
            first.focus();
            return;
          }
          if (event.key !== "Enter") return;
          event.preventDefault();
          const first = list.querySelector(".picker__row");
          if (first) first.click();
          else if (createBox.firstChild) createModel();
        },
      },
    });

    // Фильтры — те же `ui-select`, что фильтр помещения в окне выбора метки.
    const typeFilter = uiEl("select", {
      class: "ui-select",
      title: strings.equipment.type,
      on: { change: () => renderList() },
    });
    const vendorFilter = uiEl("select", {
      class: "ui-select",
      title: strings.equipment.vendor,
      on: { change: () => renderList() },
    });

    // Список фильтров пересобирается вместе со списком: модель, заведённая
    // прямо здесь, могла принести и новый тип, и нового производителя.
    function renderFilters() {
      const type = typeFilter.value;
      typeFilter.replaceChildren(uiEl("option", { value: "", text: strings.equipmentPicker.anyType }));
      for (const item of equipmentTypesInOrder(current)) {
        typeFilter.append(uiEl("option", { value: item.id, text: item.name }));
      }
      typeFilter.value = type;

      const vendor = vendorFilter.value;
