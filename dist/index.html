  // клик считают магнит одной функцией, разойтись им негде.
  const snap = canvasDraftSnap(plan, free);
  const scheme = canvasScheme(state);
  const view = canvasViewOf(state);
  const threshold = markRadius(view) + 6;
  const points = canvasDraft.points;
  const last = planToScreen(points[points.length - 1], scheme, view);
  const first = planToScreen(points[0], scheme, view);
  // Клик по последней или первой вершине ничего не добавляет: это первая
  // половина двойного клика, который завершает или замыкает линию.
  if (Math.hypot(screen.x - last.x, screen.y - last.y) <= threshold) return;
  if (points.length >= 2 && Math.hypot(screen.x - first.x, screen.y - first.y) <= threshold) return;
  points.push(snap.point);
  canvasDraft.cursor = snap.point;
  canvasDraft.snapped = false;
  // Вершина поставлена — подсказки гаснут до следующего движения руки: висеть
  // им не над чем, курсор стоит ровно на только что поставленной точке.
  canvasDraft.guides = [];
  canvasRedraw();
}

// `typeId` передаётся только тогда, когда линию дочерчивают не тем типом, что
// выбран сейчас: черновик закончился, потому что тип на панели сменили.
function canvasLineFinish(closed, typeId) {
  if (!canvasDraft) return null;
  const points = canvasDraft.points;
  const state = canvasState();
  if (points.length < 2) {
    canvasApi.notify(strings.canvas.lineTooShort);
    canvasCancelDraft();
    return null;
  }
  try {
    const result = addMark(state.project, {
      schemeId: state.schemeId,
      typeId: typeId || state.activeTypeId,
      kind: "line",
      points,
    });
    let project = result.project;
    if (closed) project = updateMark(project, result.mark.id, { closed: true }).project;
    canvasDraft = null;
    canvasCommit(state.project, project, strings.history.addLine, { selection: [result.mark.id] });
    return result.mark.id;
  } catch (error) {
    canvasCancelDraft();
    canvasFail(error);
    return null;
  }
}

// ——— незаконченный черновик при смене того, что рисуем ————————————————
//
// Пользователь ведёт ломаную и посреди неё выбирает точечный тип. Бросить
// начатое молча нельзя: это его работа, а в стеке отмены её нет — черновик
// живёт вне истории, и Ctrl+Z его не вернёт. Поэтому начатое **дочерчивается**
// тем типом, которым рисовали: линия становится обычной меткой, попадает в
// историю одним шагом и отменяется тем же Ctrl+Z, если была лишней. Пропадает
// только черновик из одной вершины — линии в нём нет, сохранять нечего.
//
// Контур помещения так не спасти: комната с открытой стенкой — не комната,
// и незамкнутый контур модель не примет. Его черновик отменяется.
function canvasSettleDraft() {
  if (!canvasDraft) return false;
  const draft = canvasDraft;
  if (draft.kind !== "line" || draft.points.length < 2) {
    canvasCancelDraft();
    canvasApi.notify(strings.canvas.draftDropped);
    return true;
  }
  // `canvasLineFinish` обнуляет черновик до записи в историю, поэтому вложенная
  // подписка, которую разбудит `canvasCommit`, сюда уже не вернётся.
  const markId = canvasLineFinish(false, draft.typeId);
  if (markId) {
    canvasApi.notify(text("canvas.draftFinished", { label: labelOf(canvasState().project, markId) }), "success");
  }
  return true;
}

// Чем должен быть черновик при нынешнем состоянии: ломаной, контуром или
// ничем. Одно место на весь холст — режим, тип и вид типа спрашиваются здесь.
function canvasDraftWanted(state) {
  if (state.mode === "room") return "room";
  return canvasAddKind(state) === "line" ? "line" : null;
}

// Черновик приведён в согласие с тем, что рисуем сейчас. Вызывается на каждую
// смену режима, типа и объекта: вид типа меняют и в справочнике, и это тоже
// обязано долететь до руки, которая ведёт линию.
function canvasSyncDraft(state) {
  if (!canvasDraft) return;
  // Объект сменился целиком — черновик остался от прежнего, и дочерчивать его
  // в новый объект нельзя: там ему не место ни схемой, ни типом.
  const projectId = state.project ? state.project.id : null;
  if (canvasDraft.projectId !== projectId) {
    canvasCancelDraft();
    return;
  }
  const wanted = canvasDraftWanted(state);
  if (canvasDraft.kind === wanted) {
    // Линейный тип сменили на другой линейный — рисование продолжается, и
    // линия достанется новому типу: так было и до двух режимов.
    if (wanted === "line") canvasDraft.typeId = state.activeTypeId;
    return;
  }
  canvasSettleDraft();
}

function canvasOutlineFinish() {
  if (!canvasDraft) return;
  const points = canvasDraft.points;
  const state = canvasState();
  if (points.length < OUTLINE_MIN_POINTS) {
    canvasApi.notify(strings.canvas.outlineTooShort);
    return;
  }
  try {
    const result = addOutline(state.project, {
      schemeId: state.schemeId,
      roomId: state.activeRoomId,
      points,
    });
    canvasDraft = null;
    // Контур нарисован — дальше его правят, а не рисуют второй: режим
    // переключается на выделение, и ручки вершин сразу под рукой.
    canvasCommit(state.project, result.project, strings.history.addOutline, {
      selection: [],
      patch: { mode: "select", selectedOutlineId: result.outline.id },
    });
  } catch (error) {
    canvasCancelDraft();
    canvasFail(error);
  }
}

// Правка вершин выделенного контура: «+» на стенке добавляет вершину,
// двойной клик по вершине убирает её. Перетаскивание вершины — в canvasDragTo.
function canvasOutlineInsert(outlineId, index, plan) {
  const state = canvasState();
  try {
    const result = insertOutlinePoint(state.project, outlineId, index, plan);
    canvasCommit(state.project, result.project, strings.history.outlineVertexAdd, {
      patch: { selectedOutlineId: outlineId },
    });
  } catch (error) {
    canvasFail(error);
  }
}

function canvasOutlineRemovePoint(outlineId, index) {
  const state = canvasState();
  try {
    const result = removeOutlinePoint(state.project, outlineId, index);
    canvasCommit(state.project, result.project, strings.history.outlineVertexRemove, {
      patch: { selectedOutlineId: outlineId },
    });
  } catch (error) {
    canvasFail(error);
  }
}

async function canvasDeleteOutline() {
  const state = canvasState();
  if (!canvasEditAllowed(state)) return canvasViewOnly();
  const outline = state.selectedOutlineId ? findOutline(state.project, state.selectedOutlineId) : null;
  // Контур с другой схемы удалять нечего: выделение могло остаться с прошлой.
  if (!outline || outline.schemeId !== state.schemeId) return;
  const room = findRoom(state.project, outline.roomId);
  const agreed = await uiConfirm({
    title: strings.canvas.deleteOutlineTitle,
    message: text("canvas.deleteOutlineMessage", { name: room ? room.name : "" }),
    confirmLabel: strings.canvas.deleteOutlineConfirm,
  });
  if (!agreed) return;
  const fresh = canvasState().project;
  if (!findOutline(fresh, outline.id)) return;
  try {
    const result = deleteOutline(fresh, outline.id);
    canvasCommit(fresh, result.project, strings.history.removeOutline, {
      patch: { selectedOutlineId: null },
    });
  } catch (error) {
    canvasFail(error);
  }
}

async function canvasDeleteSelected() {
  const state = canvasState();
  // Отказ до диалога: спрашивать «удалить метку?» там, где удалить нельзя, —
  // обещание, которого холст не выполнит.
  if (!canvasEditAllowed(state)) return canvasViewOnly();
  const markId = state.selectedMarkIds[0];
  const mark = markId ? findMark(state.project, markId) : null;
  if (!mark) return;
  const group = mark.groupId ? findGroup(state.project, mark.groupId) : null;
  if (group) {
    const agreed = await uiConfirm({
      title: strings.canvas.deleteBlockTitle,
      message: text("canvas.deleteBlockMessage", {
        label: labelOf(state.project, mark.id),
        count: group.markIds.length,
      }),
      confirmLabel: strings.canvas.deleteConfirm,
    });
    if (!agreed) return;
  }
  const fresh = canvasState().project;
  if (!findMark(fresh, markId)) return;
  try {
    const result = deleteMark(fresh, markId);
    canvasCommit(fresh, result.project, strings.history.remove, { selection: [] });
  } catch (error) {
    canvasFail(error);
  }
}

// ——— отмена ——————————————————————————————————————————————————————————
function canvasUndoStep() {
  if (!canvasEditAllowed(canvasState())) return canvasViewOnly();
  if (!canUndo()) {
    canvasApi.notify(strings.canvas.nothingToUndo);
    return;
  }
  const command = undo();
  canvasApi.notify(text("canvas.undone", { label: command.label }));
}
function canvasRedoStep() {
  if (!canvasEditAllowed(canvasState())) return canvasViewOnly();
  if (!canRedo()) {
    canvasApi.notify(strings.canvas.nothingToRedo);
    return;
  }
  const command = redo();
  canvasApi.notify(text("canvas.redone", { label: command.label }));
}

// ——— масштаб —————————————————————————————————————————————————————————

function canvasClampZoom(zoom) {
  return Math.min(CANVAS_ZOOM_MAX, Math.max(CANVAS_ZOOM_MIN, zoom));
}

// Приближение к точке: точка плана под курсором остаётся под курсором.
function canvasZoomAt(point, factor) {
  const state = canvasState();
  const view = state.view;
  const zoom = canvasClampZoom(view.zoom * factor);
  const ratio = zoom / view.zoom;
  canvasApi.setState({
    view: {
      zoom,
      offsetX: point.x - (point.x - view.offsetX) * ratio,
      offsetY: point.y - (point.y - view.offsetY) * ratio,
    },
  });
}
function canvasZoomBy(factor) {
  if (!canvasNode) return;
  canvasZoomAt({ x: canvasNode.clientWidth / 2, y: canvasNode.clientHeight / 2 }, factor);
}
function canvasFitPlan() {
  const state = canvasState();
  const scheme = canvasScheme(state);
  if (!scheme || !canvasNode) return;
  canvasApi.setState({
    view: fitView(scheme, { width: canvasNode.clientWidth, height: canvasNode.clientHeight }),
  });
  canvasFitted = scheme.id;
}
function canvasZoomReset() {
  if (!canvasNode) return;
  const state = canvasState();
  const scheme = canvasScheme(state);
  if (!scheme) return;
  canvasApi.setState({
    view: {
      zoom: 1,
      offsetX: (canvasNode.clientWidth - scheme.width) / 2,
      offsetY: (canvasNode.clientHeight - scheme.height) / 2,
    },
  });
}

// ——— указатель ———————————————————————————————————————————————————————

function canvasStartPan(point) {
  const state = canvasState();
  canvasDrag = { kind: "pan", start: point, view: { ...state.view }, moved: false };
}

function canvasPointerDown(event) {
  if (uiDialogDepth() > 0 || !canvasScheme(canvasState())) return;
  // Захват может не дать браузер (например, у синтетического события) — это не повод
  // терять клик.
  try {
    canvasNode.setPointerCapture(event.pointerId);
  } catch (error) {
    /* работаем без захвата */
  }
  canvasPointers.set(event.pointerId, canvasPointOf(event));

  // Планшет: разметка остаётся десктопной, пальцы только смотрят.
  if (event.pointerType === "touch") {
    if (canvasPointers.size === 2) {
      const [a, b] = [...canvasPointers.values()];
      canvasPinch = {
        distance: Math.hypot(a.x - b.x, a.y - b.y),
        center: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
      };
      canvasDrag = null;
      return;
    }
    canvasStartPan(canvasPointOf(event));
    return;
  }
  if (event.button === 2) return;
  const point = canvasPointOf(event);
  if (event.button === 1 || canvasSpace) {
    event.preventDefault();
    canvasStartPan(point);
    return;
  }
  if (event.button !== 0) return;

  const state = canvasState();
  const scheme = canvasScheme(state);
  const view = canvasViewOf(state);

  // В режиме просмотра открыты только две двери: выделить метку, чтобы прочитать
  // её поля, и возить план. Всё остальное — правка, и начинаться она не должна:
  // ни ручки блока, ни черновика, ни перетаскивания.
  const editable = canvasEditAllowed(state);

  if (editable && state.selectedMarkIds.length === 1) {
    const target = labelTargetOf(state.project, scheme, state.selectedMarkIds[0], state.filter);
    if (target && hitLabelTurn(state.project, scheme, target, point, view, state.filter)) {
      canvasRotateLabel(state.selectedMarkIds[0]);
      canvasDrag = { kind: "done", start: point, moved: false };
      return;
    }
  }

  if (editable && state.selectedOutlineId) {
    const selected = findOutline(state.project, state.selectedOutlineId);
    if (selected && selected.schemeId === scheme.id && hitOutlineLabelTurn(state.project, scheme, selected, point, view)) {
      canvasRotateOutlineLabel(selected.id);
      canvasDrag = { kind: "done", start: point, moved: false };
      return;
    }
  }

  // Линейка забирает клик себе: с неё тянут новую направляющую. Она лежит
  // поверх плана, и отдавать её клик метке нельзя.
  const rulerUnder = editable && canvasGuidesShown(state) ? rulerAxis(point) : null;
  if (rulerUnder) {
    const axis = rulerUnder;
    canvasDrag = {
      kind: "guideNew",
      axis,
      at: canvasGuideAt(axis, point, scheme, view),
      start: point,
      moved: false,
    };
    return;
  }

  // Вершина правимого пути важнее клика по самому объекту: пока ручки видны,
  // за вершину тащат её одну, а не всю линию и не весь контур.
  const editedPath = editable ? canvasEditedPath(state, scheme) : null;
  if (editedPath) {
    const handle = hitPathHandle(pathVertexHandles(scheme, editedPath.points, view), point);
    if (handle) {
      canvasDrag = {
        kind: "pathVertex",
        path: editedPath,
        index: handle.index,
        start: point,
        before: state.project,
        guides: [],
        moved: false,
      };
      return;
    }
  }

  // Ручка «+» важнее всего остального: она и есть быстрый путь.
  if (editable && state.selectedMarkIds.length === 1) {
    const selected = findMark(state.project, state.selectedMarkIds[0]);
    if (selected && selected.kind === "point" && selected.schemeId === scheme.id) {
      const side = hitHandle(scheme, selected, point, view);
      if (side) {
        canvasBlockPoint(selected.id, side);
        canvasDrag = { kind: "done", start: point, moved: false };
        return;
      }
    }
  }

  // Ломаную рисует режим добавления с линейным типом; контур помещения — свой
  // режим. Жест у них один, и дальше он разбирается по `canvasDrag.kind`.
  const drawing = state.mode === "room" ? "room" : canvasAddKind(state) === "line" ? "line" : null;
  if (editable && drawing) {
    canvasDrag = { kind: drawing, start: point, view: { ...state.view }, moved: false };
    return;
  }

  // Клик по метке важнее клика по контуру: попадание по меткам считается
  // первым, и контур перехватывает клик только там, где метки нет.
  const hit = hitTest(state.project, scheme, point, view, state.filter);
  if (!hit && state.mode === "select") {
    // Ручки вершин у контура те же, что у линии, и разбираются выше — здесь
    // контур отвечает только за стенку и подпись.
    const outlineHit = hitOutline(state.project, scheme, point, view, state.filter, null);
    if (outlineHit) {
      if (state.selectedOutlineId !== outlineHit.outlineId || state.selectedMarkIds.length > 0) {
        // Выбрали другой контур — правка прежнего пути закончена.
        canvasApi.setState({
          selectedOutlineId: outlineHit.outlineId,
          selectedMarkIds: [],
          editPathId: state.editPathId === outlineHit.outlineId ? state.editPathId : null,
        });
      }
      // Подпись комнаты таскается отдельно от контура — тем же жестом, что
      // подпись метки.
      if (outlineHit.part === "label" && editable) {
        canvasDrag = {
          kind: "outlineLabel",
          outlineId: outlineHit.outlineId,
          start: point,
          before: state.project,
          moved: false,
        };
        return;
      }
      canvasDrag = { kind: "outline", start: point, view: { ...state.view }, moved: false };
      return;
    }
  }
  if (hit) {
    // Выделили метку — выделение контура снимается: две пары ручек рядом
    // означали бы, что непонятно, чью вершину сейчас потащат.
    if (state.selectedMarkIds[0] !== hit.markId || state.selectedOutlineId) {
      // Выбрали другой объект — правка прежней линии закончена.
      canvasApi.setState({
        selectedMarkIds: [hit.markId],
        selectedOutlineId: null,
        editPathId: state.editPathId === hit.markId ? hit.markId : null,
      });
    }
    if (!editable) {
      // Метка выделена — её поля можно прочитать; тащить её при этом нельзя,
      // и жест уходит в панораму, а не в перемещение.
      canvasDrag = { kind: "pan", start: point, view: { ...state.view }, moved: false };
      return;
    }
    canvasDrag = {
      kind: hit.part === "label" ? "label" : "mark",
      markId: hit.markId,
      groupId: hit.groupId,
      anchor: canvasNearestVertex(findMark(state.project, hit.markId), point, scheme, view),
      start: point,
      before: state.project,
      moved: false,
    };
    return;
  }
  // Направляющую берут под руку только в выделении: в добавлении клик по плану
  // ставит метку, и отбирать его у постановки нельзя — в перекрестия и целятся.
  if (editable && canvasGuidesShown(state) && state.mode === "select") {
    const guide = hitSchemeGuide(canvasSchemeGuides(state, scheme), point, scheme, view);
    if (guide) {
      canvasDrag = {
        kind: "guideMove",
        guideId: guide.id,
        axis: guide.axis,
        start: point,
        before: state.project,
        moved: false,
      };
      return;
    }
  }

  canvasDrag = {
    kind: canvasAddKind(state) === "point" && editable ? "place" : "empty",
    start: point,
    view: { ...state.view },
    moved: false,
  };
}

// Перетаскивание метки: новые точки считаются от снимка «до», а не от
// предыдущего кадра, — иначе метка уползает от курсора накопленной ошибкой.
function canvasDragTo(point, free) {
  const state = canvasState();
  const scheme = canvasScheme(state);
  const view = canvasViewOf(state);
  const before = canvasDrag.before;
  const from = screenToPlan(canvasDrag.start, scheme, view);
  const now = screenToPlan(point, scheme, view);
  const dx = now.x - from.x;
  const dy = now.y - from.y;
  try {
    if (canvasDrag.kind === "pathVertex") {
      const path = canvasDrag.path;
      const origin = path.points[canvasDrag.index];
      const snap = canvasVertexSnap(path, canvasDrag.index, { x: origin.x + dx, y: origin.y + dy }, free);
      canvasDrag.guides = snap.guides;
      canvasPreview = canvasPathVertexMove(path, before, canvasDrag.index, snap.point);
    } else if (canvasDrag.kind === "outlineLabel") {
      const outline = findOutline(before, canvasDrag.outlineId);
      // База — там, где подпись видна сейчас: у неподвинутой это середина
      // контура, у подвинутой — её смещение.
      const seen = outline ? outlineLabelBox(before, scheme, outline, view) : null;
      const base = seen ? { dx: seen.dx, dy: seen.dy } : { dx: 0, dy: 0 };
      canvasPreview = updateOutline(before, canvasDrag.outlineId, {
        labelOffset: { dx: base.dx + dx * scheme.width, dy: base.dy + dy * scheme.height },
      }).project;
    } else if (canvasDrag.kind === "label") {
      const target = canvasDrag.groupId ? findGroup(before, canvasDrag.groupId) : findMark(before, canvasDrag.markId);
      // База — там, где подпись сейчас видна, а не там, где лежит её смещение:
      // подпись, отведённую раскладкой от соседа, нельзя дёргать обратно
      // в стандартное место в тот миг, когда за неё взялись мышью.
      const size = view.markSize || 10;
      const seen = target ? labelBox(before, scheme, target, view, state.filter) : null;
      const base = seen ? { dx: seen.dx, dy: seen.dy } : { dx: size * 1.5, dy: 0 };
      const offset = { dx: base.dx + dx * scheme.width, dy: base.dy + dy * scheme.height };
      // Подпись блока стоит по смещению его первой метки — своего поля у группы
      // модель не заводит, а собственной подписи у этой метки нет.
      const holder = canvasDrag.groupId && target ? target.markIds[0] : canvasDrag.markId;
      canvasPreview = updateMark(before, holder, { labelOffset: offset }).project;
    } else {
      const mark = findMark(before, canvasDrag.markId);
      const shifted = mark.points.map((item) => ({ x: item.x + dx, y: item.y + dy }));
      // Притяжка к направляющим считается по той вершине, за которую взялись:
      // её пользователь и ведёт глазами. Вся метка едет за ней, форма цела.
      const anchor = shifted[canvasDrag.anchor] || shifted[0];
      const snapped = canvasGuideSnap(anchor, free);
      const fix = { x: snapped.x - anchor.x, y: snapped.y - anchor.y };
      const points = shifted.map((item) => ({ x: item.x + fix.x, y: item.y + fix.y }));
      canvasPreview = updateMark(before, canvasDrag.markId, { points }).project;
    }
  } catch (error) {
    // Модель отказала на полпути — картинка замерла бы под рукой, а по
    // отпусканию перенос потерялся бы молча. Пусть скажет, в чём дело.
    canvasPreview = null;
    canvasFail(error);
  }
  canvasRedraw();
}

function canvasPointerMove(event) {
  if (!canvasNode) return;
  const point = canvasPointOf(event);
  if (canvasPointers.has(event.pointerId)) canvasPointers.set(event.pointerId, point);

  if (canvasPinch && canvasPointers.size === 2) {
    const [a, b] = [...canvasPointers.values()];
    const distance = Math.hypot(a.x - b.x, a.y - b.y);
    const center = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (canvasPinch.distance > 0) canvasZoomAt(center, distance / canvasPinch.distance);
    const state = canvasState();
    canvasApi.setState({
      view: {
        ...state.view,
        offsetX: state.view.offsetX + (center.x - canvasPinch.center.x),
        offsetY: state.view.offsetY + (center.y - canvasPinch.center.y),
      },
    });
    canvasPinch = { distance, center };
    return;
  }

  const state = canvasState();
  if (canvasDraft) {
    const scheme = canvasScheme(state);
    const snap = canvasDraftSnap(screenToPlan(point, scheme, canvasViewOf(state)), event.altKey);
    canvasDraft.cursor = snap.point;
    canvasDraft.snapped = snap.snapped;
    canvasDraft.guides = snap.guides || [];
    canvasRedraw();
  }
  if (!canvasDrag) return;
  const shift = Math.hypot(point.x - canvasDrag.start.x, point.y - canvasDrag.start.y);
  if (shift > CANVAS_DRAG_SLOP) canvasDrag.moved = true;
  if (!canvasDrag.moved) return;

  if (canvasDrag.kind === "guideNew" || canvasDrag.kind === "guideMove") {
    const scheme = canvasScheme(state);
    const view = canvasViewOf(state);
    const at = canvasGuideAt(canvasDrag.axis, point, scheme, view);
    if (canvasDrag.kind === "guideNew") canvasDrag.at = at;
    else {
      try {
        canvasPreview = moveSchemeGuide(canvasDrag.before, state.schemeId, canvasDrag.guideId, at).project;
      } catch (error) {
        canvasPreview = null;
      }
    }
    // Утащенная обратно на линейку направляющая снимается — это её «корзина».
    canvasDrag.drop = canvasOnRuler(point);
    canvasRedraw();
    return;
  }
  if (["mark", "label", "outlineLabel", "pathVertex"].includes(canvasDrag.kind)) {
    canvasDragTo(point, event.altKey);
    return;
  }
  if (["pan", "empty", "place", "line", "room", "outline"].includes(canvasDrag.kind)) {
    canvasApi.setState({
      view: {
        ...state.view,
        offsetX: canvasDrag.view.offsetX + (point.x - canvasDrag.start.x),
        offsetY: canvasDrag.view.offsetY + (point.y - canvasDrag.start.y),
      },
    });
  }
}

function canvasPointerUp(event) {
  canvasPointers.delete(event.pointerId);
  if (canvasPointers.size < 2) canvasPinch = null;
  const drag = canvasDrag;
  canvasDrag = null;
  if (!drag) return;
  const point = canvasPointOf(event);
  const state = canvasState();

  if (drag.kind === "guideNew") {
    // Не вытянули с линейки — направляющей и не было: клик по самой линейке
    // ничего не создаёт.
    if (drag.moved && !canvasOnRuler(point)) canvasGuideAdd(drag.axis, drag.at);
    canvasRedraw();
    return;
  }
  if (drag.kind === "guideMove") {
    const after = canvasPreview;
    canvasPreview = null;
    if (canvasOnRuler(point)) canvasGuideRemove(drag.guideId);
    else if (drag.moved && after) canvasCommit(drag.before, after, strings.history.guideMove);
    canvasRedraw();
    return;
  }
  if (drag.moved) {
    if ((drag.kind === "mark" || drag.kind === "label") && canvasPreview) {
      const label = drag.kind === "label" ? strings.history.moveLabel : strings.history.move;
      const after = canvasPreview;
      canvasPreview = null;
      canvasCommit(drag.before, after, label, { selection: [drag.markId] });
    }
    if (drag.kind === "pathVertex" && canvasPreview) {
      const after = canvasPreview;
      canvasPreview = null;
      // Ярлык шага — свой у линии и у контура: в отмене видно, что вернётся.
      const outlinePath = drag.path.kind === "outline";
      canvasCommit(drag.before, after, outlinePath ? strings.history.outlineVertexMove : strings.history.markVertexMove, {
        ...(outlinePath ? { patch: { selectedOutlineId: drag.path.id } } : { selection: [drag.path.id] }),
      });
    }
    if (drag.kind === "outlineLabel" && canvasPreview) {
      const after = canvasPreview;
      canvasPreview = null;
      canvasCommit(drag.before, after, strings.history.moveOutlineLabel, {
        patch: { selectedOutlineId: drag.outlineId },
      });
    }
    canvasPreview = null;
    canvasRedraw();
    return;
  }
  canvasPreview = null;

  if (event.pointerType === "touch" || drag.kind === "done") return;
  const scheme = canvasScheme(state);
  const plan = screenToPlan(point, scheme, canvasViewOf(state));
  if (drag.kind === "line") {
    canvasLineClick(plan, point, event.altKey);
    return;
  }
  if (drag.kind === "room") {
    canvasOutlineClick(plan, point, event.altKey);
    return;
  }
  if (drag.kind === "place") {
    canvasPlacePoint(plan);
    return;
  }
  if (drag.kind === "empty" && (state.selectedMarkIds.length > 0 || state.selectedOutlineId || state.editPathId)) {
    canvasApi.setState({ selectedMarkIds: [], selectedOutlineId: null, editPathId: null });
  }
}

function canvasDoubleClick(event) {
  const state = canvasState();
  if (!canvasEditAllowed(state)) return;
  const scheme = canvasScheme(state);
  const view = canvasViewOf(state);
  // Двойной клик по линейке ставит направляющую в точке клика — это второй
  // способ к перетаскиванию, и просил его пользователь: «двойной клик по
  // линейке должен создавать линию».
  if (canvasGuidesShown(state)) {
    const at = canvasPointOf(event);
    const axis = rulerAxis(at);
    if (axis) {
      event.preventDefault();
      canvasGuideAdd(axis, canvasGuideAt(axis, at, scheme, view));
      return;
    }
  }
  // Правка пути — один жест на ломаную метки и на контур помещения. Двойной
  // клик по объекту включает правку, по вершине — убирает её, по сегменту или
  // стенке — добавляет новую в точке клика. Пользователь: «у линий при
  // выделении позволь редактировать её, например двойным кликом на линию» и
  // «двойной клик по контуру комнаты — тоже давай править его».
  if (state.mode === "select") {
    const at = canvasPointOf(event);
    const plan = screenToPlan(at, scheme, view);
    const edited = canvasEditedPath(state, scheme);
    if (edited) {
      const handle = hitPathHandle(pathVertexHandles(scheme, edited.points, view), at);
      if (handle) {
        event.preventDefault();
        canvasPathVertexRemove(edited, handle.index);
        return;
      }
    }
    // Метка важнее контура — тот же порядок, что у одиночного клика.
    const hit = hitTest(state.project, scheme, at, view, state.filter);
    if (hit && edited && edited.kind === "mark" && hit.markId === edited.id && hit.part === "line") {
      event.preventDefault();
      canvasPathVertexInsert(edited, hit.index, plan);
      return;
    }
    if (hit && hit.part !== "label") {
      const mark = findMark(state.project, hit.markId);
      if (mark && mark.kind === "line" && (!edited || hit.markId !== edited.id)) {
        event.preventDefault();
        canvasEditPath("mark", mark.id);
        return;
      }
    }
    if (!hit && canvasGuidesShown(state)) {
      const guide = hitSchemeGuide(canvasSchemeGuides(state, scheme), at, scheme, view);
      if (guide) {
        event.preventDefault();
        canvasGuideRemove(guide.id);
        return;
      }
    }
    if (!hit) {
      const outlineHit = hitOutline(state.project, scheme, at, view, state.filter, null);
      if (outlineHit && outlineHit.part === "edge") {
        event.preventDefault();
        if (edited && edited.kind === "outline" && edited.id === outlineHit.outlineId) {
          canvasPathVertexInsert(edited, outlineHit.index, plan);
        } else {
          canvasEditPath("outline", outlineHit.outlineId);
        }
        return;
      }
    }
  }
  // Двойной клик по подписи возвращает её на место — там же, где её и таскают:
  // в рисовании линии и контура двойной клик занят завершением ломаной.
  const drawing = state.mode === "room" || canvasAddKind(state) === "line";
  if (!drawing && canvasResetLabel(canvasPointOf(event))) {
    event.preventDefault();
    return;
  }
  if ((canvasAddKind(state) !== "line" && state.mode !== "room") || !canvasDraft) return;
  const point = canvasPointOf(event);
  const threshold = markRadius(view) + 6;
  const points = canvasDraft.points;
  const first = planToScreen(points[0], scheme, view);
  const last = planToScreen(points[points.length - 1], scheme, view);
  const onFirst = Math.hypot(point.x - first.x, point.y - first.y) <= threshold;
  const onLast = Math.hypot(point.x - last.x, point.y - last.y) <= threshold;
  // Двойной клик в стороне — это просто две вершины подряд: рисование
  // продолжается, ничего не теряется и не замыкается.
  if (!onFirst && !onLast) return;
  event.preventDefault();
  // Контур помещения замкнут всегда: комната с открытой стенкой — не комната.
  if (state.mode === "room") {
    canvasOutlineFinish();
    return;
  }
  // По первой точке — замкнутый контур (лента по периметру комнаты),
  // по последней — открытая линия, ровно как в брифе.
  canvasLineFinish(onFirst && !onLast && points.length >= 3);
}

function canvasWheel(event) {
  if (uiDialogDepth() > 0) return;
  event.preventDefault();
  const kind = canvasWheelKind(event, canvasWheelStreak);
  canvasWheelStreak = { kind, time: event.timeStamp };
  if (kind === "pan") {
    // Листаем как прокрутка — в ту же сторону, что и стрелки: жест вниз
    // показывает то, что ниже, поэтому содержимое уезжает вверх.
    canvasPanBy(-event.deltaX, -event.deltaY);
    return;
  }
  canvasZoomAt(canvasPointOf(event), canvasZoomFactor(event, canvasPinchWheel(event)));
}

// ——— клавиатура ——————————————————————————————————————————————————————

function canvasTypingTarget(target) {
  if (!target || !target.tagName) return false;
  return (
    target.tagName === "INPUT" ||
    target.tagName === "TEXTAREA" ||
    target.tagName === "SELECT" ||
    target.isContentEditable
  );
}

function canvasKeyDown(event) {
  // Пока открыт диалог, клавиатура принадлежит ему.
  if (uiDialogDepth() > 0 || canvasTypingTarget(event.target)) return;
  const state = canvasState();
  const control = event.ctrlKey || event.metaKey;
  if (control && event.code === "KeyZ") {
    event.preventDefault();
    if (event.shiftKey) canvasRedoStep();
    else canvasUndoStep();
    return;
  }
  if (control && event.code === "KeyY") {
    event.preventDefault();
    canvasRedoStep();
    return;
  }
  if (control) return;
  // Ход и масштаб — до всего остального, но только когда клавиатура ничья.
  if (canvasKeyboardOwner(event)) {
    if (canvasPanKeyDown(event.code)) {
      event.preventDefault();
      return;
    }
    const factor = canvasZoomKey(event);
    if (factor) {
      event.preventDefault();
      canvasZoomBy(factor);
      return;
    }
  }
  if (event.code === "Space") {
    canvasSpace = true;
    if (canvasNode) canvasNode.style.cursor = "grab";
    return;
  }
  if (event.key === "Escape") {
    if (canvasCancelDraft()) return;
    // Первый Esc заканчивает правку линии: выделение при этом остаётся — за ним
    // стоят панель свойств и кнопки, и сносить его заодно нельзя.
    if (state.editPathId) {
      canvasApi.setState({ editPathId: null });
      return;
    }
    if (state.selectedOutlineId) {
      canvasApi.setState({ selectedOutlineId: null });
      return;
    }
    // Первый Esc снимает выделение: пока метка выделена, вокруг неё ручки «+»,
    // и отдельную метку вплотную к блоку не поставить. Второй — выходит из режима.
    if (state.selectedMarkIds.length > 0) {
      canvasApi.setState({ selectedMarkIds: [] });
      return;
    }
    if (state.mode !== "select") canvasApi.setState({ mode: "select" });
    return;
  }
  if (event.key === "Backspace" && canvasDraft) {
    event.preventDefault();
    canvasDraft.points.pop();
    if (canvasDraft.points.length === 0) canvasDraft = null;
    // Убрали вершину — прежняя пометка магнита и прежние направляющие
    // относились к прежнему отрезку.
    else {
      canvasDraft.snapped = false;
      canvasDraft.guides = [];
    }
    canvasRedraw();
    return;
  }
  if ((event.key === "Delete" || event.key === "Backspace") && state.selectedMarkIds.length > 0) {
    event.preventDefault();
    canvasDeleteSelected();
    return;
  }
  if ((event.key === "Delete" || event.key === "Backspace") && state.selectedOutlineId) {
    event.preventDefault();
    canvasDeleteOutline();
  }
}

function canvasKeyUp(event) {
  canvasPanRelease(event.code);
  if (event.code !== "Space") return;
  canvasSpace = false;
  canvasSyncCursor();
}

// Окно увели — зажатые клавиши отпустить некому: своего keyup они уже не
// пришлют, и план уехал бы дальше сам по себе.
function canvasWindowBlur() {
  canvasPanRelease(null);
  canvasSpace = false;
  canvasSyncCursor();
}

function canvasSyncCursor() {
  if (!canvasNode) return;
  const state = canvasState();
  if (canvasSpace) canvasNode.style.cursor = "grab";
  else canvasNode.style.cursor = state.mode === "select" ? "default" : "crosshair";
}

// ——— монтирование ————————————————————————————————————————————————————

function mountCanvas(host, api) {
  canvasApi = api;
  canvasHost = host;
  canvasNode = document.createElement("canvas");
  canvasNode.className = "canvas";
  host.replaceChildren(canvasNode);
  canvasCtx = canvasNode.getContext("2d");

  canvasNode.addEventListener("pointerdown", canvasPointerDown);
  canvasNode.addEventListener("pointermove", canvasPointerMove);
  canvasNode.addEventListener("pointerup", canvasPointerUp);
  canvasNode.addEventListener("pointercancel", canvasPointerUp);
  canvasNode.addEventListener("dblclick", canvasDoubleClick);
  canvasNode.addEventListener("wheel", canvasWheel, { passive: false });
  canvasNode.addEventListener("contextmenu", (event) => event.preventDefault());
  document.addEventListener("keydown", canvasKeyDown);
  document.addEventListener("keyup", canvasKeyUp);

  if (typeof ResizeObserver === "function") {
    new ResizeObserver(() => canvasResize()).observe(host);
  } else {
    window.addEventListener("blur", canvasWindowBlur);
    window.addEventListener("resize", canvasResize);
  }

  api.subscribe((state, changed) => {
    if ("project" in changed) {
      const id = state.project ? state.project.id : null;
      // Стек отмены живёт в пределах объекта: сменили объект — история пуста.
      if (id !== canvasProjectId) {
        canvasProjectId = id;
        clearHistory();
        canvasFitted = null;
      }
    }
    if ("schemeId" in changed) {
      canvasCancelDraft();
      canvasPreview = null;
    }
    // Режим, выбранный тип и его вид в справочнике — всё это меняет то, что
    // рисует рука. Черновик подтягивается к новому положению дел здесь, в
    // одном месте, а не на каждой кнопке, которая что-то из этого правит.
    if ("mode" in changed || "activeTypeId" in changed || "project" in changed) canvasSyncDraft(state);
    if ("mode" in changed) canvasSyncCursor();
    if ("schemeId" in changed || "schemeImage" in changed) canvasAutoFit(state);
    canvasRedraw();
  });
  canvasResize();
  canvasSyncCursor();
  canvasAutoFit(canvasState());
}

// Новый план показывается целиком: подгонка один раз на схему, дальше масштаб
// принадлежит пользователю.
function canvasAutoFit(state) {
  const scheme = canvasScheme(state);
  if (!scheme || !canvasNode) return;
  if (canvasFitted === scheme.id) return;
  if (!canvasImage(state)) return;
  canvasFitted = scheme.id;
  canvasApi.setState({
    view: fitView(scheme, { width: canvasNode.clientWidth, height: canvasNode.clientHeight }),
  });
}

// Подсказка поверх холста: что сейчас ставим и чем это закончить. Сворачивается
// в одну кнопку со значком — текст её читают один раз, а место она занимает всё
// время работы.
function mountCanvasHint(host, api) {
  const hint = document.createElement("div");
  hint.className = "canvas-hint";
  const body = uiEl("p", { class: "canvas-hint__text" });
  const toggle = uiEl(
    "button",
    {
      class: "canvas-hint__toggle",
      type: "button",
      on: {
        click: () => {
          canvasHintCollapsed = !canvasHintCollapsed;
          setSetting(CANVAS_HINT_SETTING, canvasHintCollapsed);
          render();
        },
      },
    },
    uiIcon("hint"),
  );
  hint.append(toggle, body);
  host.replaceChildren(hint);
  const render = () => {
    const state = api.getState();
    const value = canvasHintText(state);
    // Отступ от линейки — до проверки на пустоту: он нужен подсказке в любом
    // виде, и свёрнутой тоже.
    hint.style.setProperty("--canvas-hint-inset", canvasHintInset(state) + "px");
    // Условие показа живёт здесь, а не в чужих стилях: подсказки нет, когда
    // нечего подсказывать, а в просмотре она говорит про просмотр.
    hint.hidden = value === null;
    if (value === null) return;
    body.textContent = value;
    hint.classList.toggle("is-collapsed", canvasHintCollapsed);
    body.hidden = canvasHintCollapsed;
    // Развёрнутую подсказку пользователь видит — значит, этот текст прочитан.
    if (!canvasHintCollapsed) canvasHintSeen = value;
    const unseen = canvasHintCollapsed && canvasHintUnseen(canvasHintSeen, value);
    toggle.classList.toggle("is-new", unseen);
    let label = strings.canvas.hintCollapse;
    if (canvasHintCollapsed) label = unseen ? strings.canvas.hintExpandNew : strings.canvas.hintExpand;
    toggle.title = label;
    toggle.setAttribute("aria-label", label);
    toggle.setAttribute("aria-expanded", canvasHintCollapsed ? "false" : "true");
    const type = state.project && state.activeTypeId ? findType(state.project, state.activeTypeId) : null;
    const room = state.project && state.activeRoomId ? findRoom(state.project, state.activeRoomId) : null;
    // Цвет достаётся и кнопке: свёрнутой подсказки, кроме неё, не видно, а
    // цвет типа — единственное, что говорит, чем сейчас размечают. В просмотре
    // цвета нет вовсе: размечать там нечем.
    let color = "";
    if (canvasEditAllowed(state)) {
      if (state.mode === "room" && room) color = room.color;
      else if (type) color = styleOf(state.project, type.id).color;
    }
    hint.style.borderColor = color;
    toggle.style.borderColor = color;
  };
  api.subscribe((state, changed) => {
    if (
      "mode" in changed ||
      "activeTypeId" in changed ||
      "activeRoomId" in changed ||
      "schemeId" in changed ||
      "layout" in changed ||
      // Линейка пришла или ушла — отступ подсказки меняется вместе с ней.
      "guidesShown" in changed ||
      // Правка ломаной — такой же режим руки, как «Добавление»: началась или
      // закончилась, и подсказка обязана это сказать.
      "editPathId" in changed ||
      "project" in changed
    ) {
      render();
    }
  });
  render();
  // Настройка читается асинхронно: подсказка стартует развёрнутой и
  // схлопывается, когда хранилище ответит. Ждать его с пустым углом хуже.
  Promise.resolve(getSetting(CANVAS_HINT_SETTING))
    .then((saved) => {
      if (saved !== true) return;
      canvasHintCollapsed = true;
      // То, что пользователь успел увидеть до ответа хранилища, прочитанным не
      // считается: он на подсказку не смотрел, она мигнула сама.
      canvasHintSeen = null;
      render();
    })
    .catch(() => {});
}

registerPanel(PANEL_IDS.canvas, mountCanvas);
registerPanel(PANEL_IDS.overlay, mountCanvasHint);

// src/colorName.js
// Русское имя цвета — вычислением, а не таблицей соответствий.
//
// Имя нужно там, где hex человеку ничего не говорит: заголовок категории в
// справочнике типов, подпись в палитре, будущее окно выбора цвета. Словарь
// «значение → название» здесь не годится принципиально: цвета категорий и
// помещений пользователь заводит сам, и для #7A3B12, которого нет ни в одном
// списке, название обязано найтись ровно так же, как для #FF0000.
//
// Считается по трём числам:
//   тон (hue)   — основа: красный, оранжевый, жёлтый, зелёный, бирюзовый,
//                 голубой, синий, фиолетовый, пурпурный, розовый;
//   светлота    — уточнение «тёмно-» и «светло-»; берётся как (max+min)/2,
//                 а не `v` из HSV: у чистого зелёного `v` = 1, и по нему он
//                 назвался бы «светло-зелёным», хотя он просто зелёный;
//   насыщенность — уход в серое: ниже порога цветность не читается вовсе,
//                 и остаётся шкала от чёрного до белого.
//
// Четыре места, где вместо «тёмно-» и «светло-» в русском стоит своё слово,
// сделаны исключениями — иначе цвета сборки называются неузнаваемо:
//   тёмный или приглушённый оранжевый — коричневый (#6E4B1F — щит, #664733,
//     #B38F59 — светло-коричневый, а не «светло-оранжевый»);
//   тёмный жёлтый — оливковый (#5B6624, #9C931A);
//   светлый бирюзовый и светлый синий — голубой (#289EC9, #00FFFF);
//   светлый красный и светлый пурпур — розовый (#D169B9, #D17669, #FFC0CB).
// Границы тонов подобраны по палитрам сборки: пурпур сантехники #E80098
// (321°) — пурпурный, а #D1247A (330°) — уже розовый; #BE123C (345°) —
// красный. Двигать их можно, но сверяясь с `test/colorName.test.js`: там
// записано, как называются все восемь цветов категорий и все 24 цвета
// помещений.
//
// Разбор hex здесь не свой: `hexToRgb` и `rgbToHsv` живут в модели рядом с
// `colorDistance`, и второй парсер цвета в сборке заводить незачем.


// Ниже этой цветности (max − min в долях) краска не читается как краска:
// #8B949E с его 0,07 глаз зовёт серым, а не синим.
const COLOR_GREY_CHROMA = 0.12;

// Шкала серого по светлоте. Верхняя граница включительно снизу: цвет попадает
// в первый диапазон, чью границу не перешагнул.
const COLOR_GREY_STEPS = [
  { upTo: 0.04, key: "black" },
  { upTo: 0.18, key: "nearBlack" },
  { upTo: 0.38, key: "darkGrey" },
  { upTo: 0.62, key: "grey" },
  { upTo: 0.82, key: "lightGrey" },
  { upTo: 0.97, key: "nearWhite" },
  { upTo: 1.01, key: "white" },
];

// Тон по градусам круга. Красный разорван нулём, поэтому он и первый, и
// последний: всё от 345° и выше — снова красное.
const COLOR_HUE_BANDS = [
  { from: 0, key: "red" },
  { from: 15, key: "orange" },
  { from: 45, key: "yellow" },
  { from: 72, key: "green" },
  { from: 165, key: "teal" },
  { from: 205, key: "blue" },
  { from: 250, key: "violet" },
  { from: 290, key: "purple" },
  { from: 325, key: "pink" },
  { from: 345, key: "red" },
];

// Пороги «тёмно-» и «светло-» у каждого имени свои: «коричневый» и
// «оливковый» темноту уже называют сами, «голубой» и «розовый» — светлоту,
// и общий порог 0,36/0,70 приписал бы им лишнее слово.
const COLOR_TONE_LIMITS = {
  brown: { dark: 0.18, light: 0.45 },
  olive: { dark: 0.3, light: 2 },
  cyan: { dark: -1, light: 0.82 },
  pink: { dark: 0.36, light: 0.82 },
};
const COLOR_TONE_DEFAULT = { dark: 0.36, light: 0.7 };

// Светлота HSL: середина между самым ярким и самым тусклым каналом.
function colorLightness(rgb) {
  const max = Math.max(rgb.r, rgb.g, rgb.b);
  const min = Math.min(rgb.r, rgb.g, rgb.b);
  return (max + min) / 2 / 255;
}

// Цветность: насколько каналы разошлись. Ноль — чистый серый.
function colorChroma(rgb) {
  return (Math.max(rgb.r, rgb.g, rgb.b) - Math.min(rgb.r, rgb.g, rgb.b)) / 255;
}

function colorGreyKey(light) {
  const step = COLOR_GREY_STEPS.find((item) => light <= item.upTo);
  return step ? step.key : "white";
}

function colorBandKey(hue) {
  let key = COLOR_HUE_BANDS[0].key;
  for (const band of COLOR_HUE_BANDS) {
    if (hue >= band.from) key = band.key;
  }
  return key;
}

// Исключения тона: там, где в русском для тёмного или светлого варианта есть
// отдельное слово, берётся оно, а не приставка.
function colorToneKey(hue, sat, val, light) {
  const base = colorBandKey(hue);
  if (base === "orange") {
    // Коричневый — это оранжевый, который либо потемнел, либо выцвел:
    // #B45309 при насыщенности 0,95 остаётся оранжевым, #B38F59 при 0,50 —
    // уже светло-коричневый.
    if (light < 0.36 || (sat < 0.6 && light < 0.62)) return "brown";
    return base;
  }
  if (base === "yellow") return light < 0.36 ? "olive" : base;
  if (base === "teal") {
    // Тёмная бирюза (#164E63, #0F766E) голубой не бывает, а светлый циан —
    // наоборот, только голубой. Зелёная половина полосы (до 178°) остаётся
    // бирюзовой при любой яркости: #5EEAD4 — бирюза, а не голубизна.
    return hue >= 178 && val >= 0.75 ? "cyan" : base;
  }
  if (base === "blue") {
    // Светлый ненасыщенный синий по-русски — голубой, а не «светло-синий».
    return val >= 0.85 && sat <= 0.6 ? "cyan" : base;
  }
  if (base === "red" || (base === "purple" && hue >= 305)) {
    // Розовый — светлый красный или светлый пурпур: так читаются и лососёвый
    // #D17669, и орхидея #D169B9, и сам #FFC0CB.
    return light >= 0.6 ? "pink" : base;
  }
  return base;
}

/**
 * Русское название цвета: «красный», «тёмно-бирюзовый», «светло-серый».
 * Принимает hex `#RRGGBB` в любом регистре; на всём остальном возвращает
 * пустую строку — называть нечего, и подписывать цвет в интерфейсе тогда
 * просто нечем.
 */
function colorName(value) {
  const rgb = hexToRgb(value);
  if (!rgb) return "";
  const light = colorLightness(rgb);
  if (colorChroma(rgb) < COLOR_GREY_CHROMA) return strings.colors[colorGreyKey(light)];

  const { h, s, v } = rgbToHsv(rgb);
  const key = colorToneKey(h, s, v, light);
  const limits = COLOR_TONE_LIMITS[key] || COLOR_TONE_DEFAULT;
  const name = strings.colors[key];
  if (light < limits.dark) return text("colors.dark", { name });
  if (light > limits.light) return text("colors.light", { name });
  return name;
}

/**
 * Название вместе с кодом — «красный (#BE123C)». Это та подпись, которую
 * заказчик просил у категории: слово читается, а hex остаётся для того, кто
 * будет искать тот же цвет в другом месте. Регистр кода приводится к
 * верхнему — в объекте цвет мог быть записан и строчными.
 */
function colorNameHex(value) {
  const rgb = hexToRgb(value);
  if (!rgb) return "";
  return text("colors.withHex", { name: colorName(value), hex: rgbToHex(rgb) });
}

// src/tables.js
// Таблицы объекта: список меток и справочник типов.
//
// Чистый модуль без DOM — это тот шов, по которому проверяется, что в таблице
// у заказчика окажется ровно то же, что инженер написал бы от руки: строка
// «ПК1 — подсв. кровати — В31», разбивка цветными заголовками категорий,
// справочник типов отдельным списком.
//
// Видимость меток берётся у `render.visibleMarks` — тем же кодом, что решает,
// рисовать метку на холсте или нет. Своего фильтра здесь нет намеренно:
// разойдись они, на картинке и в таблице оказалось бы разное.
const TABLE_GROUP_BY = ["category", "type", "room"];

// Колонки списка меток — дословно из спецификации.
function tableMarkColumns() {
  return [
    strings.tables.label,
    strings.tables.points,
    strings.tables.type,
    strings.tables.room,
    strings.tables.location,
    strings.tables.original,
  ];
}

// Плоский порядок типов: индекс типа в справочнике задаёт порядок строк
// внутри любой группы. Порядок один на всё приложение — model.typesInOrder.
function tableTypeOrder(project) {
  const order = new Map();
  let index = 0;
  for (const { types } of typesInOrder(project)) {
    for (const type of types) order.set(type.id, index++);
  }
  return order;
}

// Метки, прошедшие фильтр, по всем схемам объекта — или по одной, если
// в фильтре назван `schemeId` (панель зовёт так для «только текущая схема»).
function tableVisibleMarks(project, filter) {
  const only = filter && filter.schemeId ? String(filter.schemeId) : null;
  const marks = [];
  for (const scheme of schemesInOrder(project)) {
    if (only && scheme.id !== only) continue;
    marks.push(...visibleMarks(project, scheme, filter));
  }
  return marks;
}

// Строка — на метку, а не на блок. Блок «Р1 Р2 Р3» заказчик читает как три
// позиции и требует три строки: в таблице метки блока не сводятся.
// Сводятся только метки с одинаковым **обозначением** — тот же тип и тот же
// номер: несколько светильников одной группы, которым проставлен Т1, остаются
// одной позицией «Т1», где бы они ни стояли. Подпись блока на плане это не
// трогает — там она по-прежнему одна на блок (model.blockLabel).
function tableEntries(project, filter) {
  const marks = tableVisibleMarks(project, filter);
  const order = tableTypeOrder(project);
  const byLabel = new Map();
  const entries = [];

  for (const mark of marks) {
    // Ключ — обозначение: тип (код у типов не повторяется) и номер.
    const key = mark.typeId + "\u0000" + mark.number;
    let entry = byLabel.get(key);
    if (!entry) {
      entry = { id: mark.id, marks: [] };
      byLabel.set(key, entry);
      entries.push(entry);
    }
    entry.marks.push(mark);
  }

  for (const entry of entries) {
    const [head] = entry.marks;
    entry.head = head;
    entry.order = [order.has(head.typeId) ? order.get(head.typeId) : 999, head.number];
  }

  entries.sort((a, b) => (a.order[0] === b.order[0] ? a.order[1] - b.order[1] : a.order[0] - b.order[0]));
  return entries;
}

// Сколько физических точек стоит за меткой. «Одна метка на блок» — это одна
// запись с несколькими точками: три розетки в одной рамке под общим
// обозначением, и без счёта строка неотличима от одиночной розетки.
// Линия — всегда одна: у ленты из четырёх вершин не четыре ленты.
function tableMarkCount(mark) {
  if (!mark) return 0;
  if (mark.kind === "line") return 1;
  return Array.isArray(mark.points) && mark.points.length > 0 ? mark.points.length : 1;
}

function tableEntryCount(entry) {
  return entry.marks.reduce((sum, mark) => sum + tableMarkCount(mark), 0);
}

// Несколько значений в одной ячейке (блок из разных типов или комнат) —
// перечисление без повторов: пустая ячейка лучше, чем «, , ».
function tableJoin(values, separator) {
  const seen = [];
  for (const value of values) {
    const clean = (value || "").trim();
    if (clean && !seen.includes(clean)) seen.push(clean);
  }
  return seen.join(separator);
}

// Обозначение строки — обозначение метки. У сведённых меток оно одно на всех
// (на том и сведены), поэтому берётся у ведущей.
function tableEntryLabel(project, entry) {
  return labelOf(project, entry.head.id);
}

// Тип у строки один: обозначение назвало его однозначно. Склейка осталась
// там, где сведённые метки правда расходятся, — помещение, расположение
// и «в оригинале» у одного обозначения бывают разные.
function tableEntryRow(project, entry) {
  const type = findType(project, entry.head.typeId);
  const category = type ? findCategory(project, type.categoryId) : null;
  const count = tableEntryCount(entry);
  const cells = [
    tableEntryLabel(project, entry),
    String(count),
    type ? type.name : "",
    tableJoin(
      entry.marks.map((mark) => {
        const room = mark.roomId ? findRoom(project, mark.roomId) : null;
        return room ? room.name : "";
      }),
      ", ",
    ),
    tableJoin(entry.marks.map((mark) => mark.location), "; "),
    tableJoin(entry.marks.map((mark) => mark.original), ", "),
  ];
  return {
    id: entry.id,
    cells,
    count,
    // Категория строкой: в CSV она становится колонкой, и заголовки-строки
    // между данными исчезают — фильтр Excel их больше не подхватывает.
    group: category ? category.name : "",
    color: styleOf(project, entry.head.typeId).color,
  };
}

// Итоги «сколько чего»: точки по типам и категориям. Считать по последнему
// номеру нельзя — он врёт после удалений и при ручной правке номеров.
// Итоги живут подвалом таблицы меток, а не отдельным листом: вопрос «сколько
// розеток закупать» задают тому же листу, который уже сужен помещением и
// фильтром, и второй лист пришлось бы сужать теми же руками ещё раз.
function tableTotals(project, entries) {
  const counts = new Map();
  for (const entry of entries) {
    counts.set(entry.head.typeId, (counts.get(entry.head.typeId) || 0) + tableEntryCount(entry));
  }
  const rows = [];
  let total = 0;
  for (const { category, types } of typesInOrder(project)) {
    const used = types.filter((type) => counts.get(type.id));
    if (used.length === 0) continue;
    const sum = used.reduce((acc, type) => acc + counts.get(type.id), 0);
    rows.push({
      id: category.id,
      level: 1,
      title: category.name,
      category: category.name,
      count: sum,
      color: category.color || null,
    });
    for (const type of used) {
      rows.push({
        id: type.id,
        level: 2,
        title: type.code + " — " + type.name,
        category: category.name,
        count: counts.get(type.id),
        color: styleOf(project, type.id).color,
      });
    }
    total += sum;
  }
  return { rows, total };
}

function tableGroupOf(project, entry, groupBy) {
  const type = findType(project, entry.head.typeId);
  if (groupBy === "type") {
    return type
      ? { key: type.id, title: `${type.code} — ${type.name}`, color: styleOf(project, type.id).color }
      : { key: "none", title: strings.tables.type, color: null };
  }
  if (groupBy === "room") {
    const room = entry.head.roomId ? findRoom(project, entry.head.roomId) : null;
    // Цвет помещения — тот же, которым обведён его контур на плане: лист
    // и схема должны узнаваться одним цветом.
    return room
      ? { key: room.id, title: room.name, color: room.color || null }
      : { key: "none", title: strings.tables.noRoom, color: null };
  }
  const category = type ? findCategory(project, type.categoryId) : null;
  return category
    ? { key: category.id, title: category.name, color: category.color }
    : { key: "none", title: strings.tables.category, color: null };
}

// Порядок групп — порядок справочника и помещений объекта; группа без строк
// на бумагу не попадает.
function tableGroupOrder(project, groupBy) {
  const keys = [];
  if (groupBy === "room") {
    for (const room of roomsInOrder(project)) keys.push(room.id);
  } else {
    for (const { category, types } of typesInOrder(project)) {
      if (groupBy === "type") for (const type of types) keys.push(type.id);
      else keys.push(category.id);
    }
  }
  keys.push("none");
  return keys;
}

// Помещение, по которому сужен лист. На рукописном листе заказчика комната
// стоит сверху, и без неё распечатка по одной комнате внешне не отличается от
// полной — монтажник не увидит, что лист неполный.
function tableRoomTitle(project, filter) {
  if (!filter || !filter.roomId) return "";
  const room = findRoom(project, filter.roomId);
  return room ? room.name : "";
}

function tableTypeAllowed(filter, type) {
  if (Array.isArray(filter.typeIds) && !filter.typeIds.includes(type.id)) return false;
  if (Array.isArray(filter.categoryIds) && !filter.categoryIds.includes(type.categoryId)) return false;
  return true;
}

// Та же беда, что и с комнатой: лист, сужённый галочками или поиском, внешне
// не отличается от полного, и монтажник не узнает, что часть меток скрыта.
// Когда скрыты целые категории — лист называет оставшиеся; когда выключена
// часть типов внутри категории или идёт поиск, перечислять нечестно, и лист
// просто признаётся, что он неполный.
function tableFilterNote(project, filter) {
  if (!filter) return "";
  const query = (filter.query || "").trim();
  const byLists = Array.isArray(filter.typeIds) || Array.isArray(filter.categoryIds);
  if (!query && !byLists) return "";
  if (!query && byLists) {
    const all = typesInOrder(project);
    const names = [];
    let whole = true;
    for (const { category, types } of all) {
      const shown = types.filter((type) => tableTypeAllowed(filter, type));
      if (shown.length === 0) continue;
      if (shown.length < types.length) whole = false;
      names.push(category.name);
    }
    if (whole && names.length === all.length) return "";
    if (whole && names.length > 0) return text("tables.onlyShown", { names: names.join(", ") });
  }
  return strings.tables.partial;
}

// Один уровень разбивки: категории, типы или помещения — как было и как
// остаётся, когда галка «по помещениям» снята.
function tableFlatGroups(project, entries, kind) {
  const buckets = new Map();
  for (const entry of entries) {
    const group = tableGroupOf(project, entry, kind);
    if (!buckets.has(group.key)) {
      buckets.set(group.key, { id: group.key, title: group.title, color: group.color, rows: [], level: 1 });
    }
    buckets.get(group.key).rows.push(tableEntryRow(project, entry));
  }
  return tableGroupOrder(project, kind)
    .map((key) => buckets.get(key))
    .filter(Boolean);
}

// Два уровня: помещение, внутри — прежняя разбивка. Список остаётся плоским,
// уровень написан в `level` — так его одинаково читают и печать, и PNG, и
// текстовые форматы, и ни один из них не учит обход вложенности.
// Заголовок помещения строк не несёт: строки живут во внутренних группах.
// Метки без помещения — последней группой «Без помещения»: потерять их на
// листе хуже, чем показать отдельно, и на плане они тоже никуда не делись.
function tableRoomGroups(project, entries, kind) {
  const byRoomKey = new Map();
  for (const entry of entries) {
    const room = entry.head.roomId ? findRoom(project, entry.head.roomId) : null;
    const key = room ? room.id : "none";
    if (!byRoomKey.has(key)) byRoomKey.set(key, []);
    byRoomKey.get(key).push(entry);
  }

  const groups = [];
  for (const key of [...roomsInOrder(project).map((room) => room.id), "none"]) {
    const list = byRoomKey.get(key);
    if (!list || list.length === 0) continue;
    const room = key === "none" ? null : findRoom(project, key);
    groups.push({
      id: key,
      title: room ? room.name : strings.tables.noRoom,
      color: room ? room.color || null : null,
      rows: [],
      level: 1,
    });
    for (const inner of tableFlatGroups(project, list, kind)) {
      groups.push({ ...inner, id: key + ":" + inner.id, level: 2 });
    }
  }
  return groups;
}

/**
 * Таблица меток. `groupBy` — разбивка (`category` | `type` | `room`);
 * `options.byRoom` поднимает над ней второй уровень — помещения, и тогда
 * `groupBy` задаёт разбивку **внутри** помещения. С `groupBy: "room"` галка
 * не складывается (помещения уже и есть разбивка) и молча гасится.
 */
function marksTable(project, filter, groupBy, options = {}) {
  const kind = TABLE_GROUP_BY.includes(groupBy) ? groupBy : "category";
  const byRoom = Boolean(options.byRoom) && kind !== "room";
  const columns = tableMarkColumns();
  if (!project) {
    return {
      kind: "marks",
      groupBy: kind,
      byRoom,
      groupColumn: strings.tables.category,
      totals: [],
      totalsColumns: [strings.tables.category, strings.tables.type, strings.tables.points],
      totalLabel: strings.tables.totalAll,
      totalCount: 0,
      title: "",
      room: "",
      note: "",
      columns,
      groups: [],
    };
  }

  const entries = tableEntries(project, filter);
  const groups = byRoom ? tableRoomGroups(project, entries, kind) : tableFlatGroups(project, entries, kind);
  const totals = tableTotals(project, entries);
  return {
    kind: "marks",
    groupBy: kind,
    byRoom,
    // Колонка, которой в CSV заменяются заголовки-строки: помещение и тип
    // уже стоят колонками, категория — нет.
    groupColumn: strings.tables.category,
    totals: totals.rows,
    totalsColumns: [strings.tables.category, strings.tables.type, strings.tables.points],
    totalLabel: strings.tables.totalAll,
    totalCount: totals.total,
    title: project.name || strings.tables.marksTitle,
    room: tableRoomTitle(project, filter),
    note: tableFilterNote(project, filter),
    columns,
    groups,
  };
}

// ——— связи ————————————————————————————————————————————————————————————

// Ссылка на метку: обозначение, а для метки из другого помещения — ещё и
// помещение. На объекте в три этажа «С1» само по себе не говорит ничего.
function tableLinkLabel(project, mark, roomId) {
  const label = labelOf(project, mark.id);
  if (!mark.roomId || mark.roomId === roomId) return label;
  const room = findRoom(project, mark.roomId);
  return room ? label + " (" + room.name + ")" : label;
}

function tableLinkRow(project, mark, related, broken, side) {
  const type = findType(project, mark.typeId);
  const room = mark.roomId ? findRoom(project, mark.roomId) : null;
  const linked = related.map((item) => tableLinkLabel(project, item, mark.roomId));
  // Ссылка в никуда не должна выглядеть обычной строкой: её видно словами,
  // а не только в проверке объекта.
  if (broken) linked.push(strings.tables.brokenLink);
  return {
    id: mark.id,
    cells: [
      labelOf(project, mark.id),
      type ? type.name : "",
      room ? room.name : "",
      mark.location || "",
      linked.join(", "),
    ],
    color: styleOf(project, mark.typeId).color,
    // Сторона листа колонкой: в CSV заголовки-строки не выживают.
    group: side || "",
    problem: Boolean(broken),
  };
}

// Сторона листа: «Управляет» или «Управляется от». С галкой «по помещениям»
// внутри стороны появляются помещения — вторым уровнем, как в таблице меток.
function tableLinkSide(project, id, title, items, byRoom) {
  if (items.length === 0) return [];
  if (!byRoom) return [{ id, title, color: null, rows: items.map((item) => item.row), level: 1 }];

  const groups = [{ id, title, color: null, rows: [], level: 1 }];
  const byRoomKey = new Map();
  for (const item of items) {
    const room = item.mark.roomId ? findRoom(project, item.mark.roomId) : null;
    const key = room ? room.id : "none";
    if (!byRoomKey.has(key)) byRoomKey.set(key, []);
    byRoomKey.get(key).push(item);
  }
  for (const key of [...roomsInOrder(project).map((room) => room.id), "none"]) {
    const list = byRoomKey.get(key);
    if (!list || list.length === 0) continue;
    const room = key === "none" ? null : findRoom(project, key);
    groups.push({
      id: id + ":" + key,
      title: room ? room.name : strings.tables.noRoom,
      color: room ? room.color || null : null,
      rows: list.map((item) => item.row),
      level: 2,
    });
  }
  return groups;
}

/**
 * Таблица связей: чем метка управляет и от чего управляется.
 *
 * Лист читают у щита или у выключателя, поэтому сторон две: «В1 → Т1, Т2» и
 * обратная «Т1 → В1». Строки — только у меток, которые в связях участвуют:
 * светильники без связей утопили бы лист, а сколько их, сказано числом
 * `unlinked`. Разбивка внутри стороны (категории или типы) здесь не нужна —
 * верхний уровень уже занят направлением, и по такому листу ищут обозначение,
 * а не категорию; помещения вторым уровнем, наоборот, помогают.
 *
 * Связанные метки перечисляются целиком, даже если фильтр их скрыл: строка
 * «В1 →» без продолжения хуже, чем строка с меткой, которой сейчас не видно.
 */
function linksTable(project, filter, options = {}) {
  const byRoom = Boolean(options.byRoom);
  const columns = [
    strings.tables.label,
    strings.tables.type,
    strings.tables.room,
    strings.tables.location,
    strings.tables.linked,
  ];
  if (!project) {
    return {
      kind: "links",
      byRoom,
      groupColumn: strings.tables.linkSide,
      title: "",
      room: "",
      note: "",
      unlinked: 0,
      columns,
      groups: [],
    };
  }

  const order = tableTypeOrder(project);
  const marks = [...tableVisibleMarks(project, filter)].sort((a, b) => {
    const orderA = order.has(a.typeId) ? order.get(a.typeId) : 999;
    const orderB = order.has(b.typeId) ? order.get(b.typeId) : 999;
    return orderA === orderB ? a.number - b.number : orderA - orderB;
  });

  const forward = [];
  const back = [];
  let unlinked = 0;
  for (const mark of marks) {
    const wanted = markControlIds(mark);
    const controls = wanted.length > 0 ? markControls(project, mark.id) : [];
    const controlledBy = markControlledBy(project, mark.id);
    if (wanted.length > 0) {
      forward.push({
        mark,
        row: tableLinkRow(project, mark, controls, wanted.length > controls.length, strings.tables.controls),
      });
    }
    if (controlledBy.length > 0) {
      back.push({ mark, row: tableLinkRow(project, mark, controlledBy, false, strings.tables.controlledBy) });
    }
    if (wanted.length === 0 && controlledBy.length === 0) unlinked += 1;
  }

  return {
    kind: "links",
    byRoom,
    groupColumn: strings.tables.linkSide,
    title: project.name || strings.tables.linksTitle,
    room: tableRoomTitle(project, filter),
    note: tableFilterNote(project, filter),
    unlinked,
    columns,
    groups: [
      ...tableLinkSide(project, "controls", strings.tables.controls, forward, byRoom),
      ...tableLinkSide(project, "controlledBy", strings.tables.controlledBy, back, byRoom),
    ],
  };
}

// ——— оборудование —————————————————————————————————————————————————————

// Название модели для закупки: с артикулом, если он заведён, — по нему заказ
// и оформляют.
function tableEquipmentName(item) {
  if (!item) return "";
  return item.code ? item.name + " (" + item.code + ")" : item.name;
}

// Сужен ли лист чем-нибудь, кроме схемы объекта. Размещение с потерянной
// меткой отнести к помещению или категории нечем, поэтому на сужённом листе
// его нет, а на полном — есть: чинить его всё равно придётся.
function tableFilterNarrows(filter) {
  if (!filter) return false;
  return Boolean(
    filter.roomId ||
      filter.schemeId ||
      (filter.query || "").trim() ||
      Array.isArray(filter.typeIds) ||
      Array.isArray(filter.categoryIds),
  );
}

/**
 * Таблица оборудования: строка на размещение — что и куда ставить, с чем
 * связывать, — а подвал «Итого» отвечает на второй вопрос заказчика, сколько
 * каких моделей закупать.
 *
 * Лист плоский, как лист меток: модель стоит **колонкой** в каждой строке, а не
 * заголовком группы. Так просил заказчик — «не объединяй по устройству, а так
 * же как в таблице Метки, отдельным столбцом». Объединение по модели прятало
 * то, ради чего лист и печатают: подряд шли три строки одного реле, и чтобы
 * узнать, что стоит в этой точке, приходилось искать заголовок выше. Закупку
 * по моделям при этом никто не отменял — она в подвале, и считается по тем же
 * размещениям, а не по группам.
 *
 * Одна таблица, а не две: закупка — это те же размещения, посчитанные по
 * моделям, и отдельным листом она разошлась бы с монтажным, как только лист
 * сузили помещением. Подвал уже умеет доезжать в CSV, Markdown, PNG и печать,
 * и сужение фильтром доезжает вместе с ним.
 */
function equipmentTable(project, filter, options = {}) {
  const byRoom = Boolean(options.byRoom);
  // Модель — вторым столбцом, как «Тип» в листе меток: сперва обозначение,
  // которым метку зовут на плане, сразу за ним — что именно там стоит.
  // Тип стоит сразу за моделью: он про неё и отвечает на вопрос «что это
  // вообще за железка» раньше, чем «где она стоит». В подвале «Итого» типа
  // нет намеренно — там закупка, и она разложена по производителям: заказ
  // оформляют у поставщика, а не у «реле на два канала».
  const columns = [
    strings.tables.label,
    strings.tables.model,
    strings.tables.equipmentType,
    strings.tables.room,
    strings.tables.location,
    strings.tables.linked,
  ];
  const empty = {
    kind: "equipment",
    byRoom,
    // Колонки группы у этого листа нет: и модель, и помещение стоят столбцами,
    // а `groupColumn` добавил бы в CSV шестую, пустую.
    groupColumn: "",
    totals: [],
    totalsColumns: [strings.tables.vendor, strings.tables.model, strings.tables.pieces],
    totalLabel: strings.tables.totalItems,
    totalCount: 0,
    title: "",
    room: "",
    note: "",
    columns,
    groups: [],
  };
  if (!project) return empty;

  const order = tableTypeOrder(project);
  const visible = new Set(tableVisibleMarks(project, filter).map((mark) => mark.id));
  const keepLost = !tableFilterNarrows(filter);
  const counts = new Map();
  const items = [];

  for (const placement of placementsInOrder(project)) {
    const mark = findMark(project, placement.markId);
    if (mark ? !visible.has(mark.id) : !keepLost) continue;
    const item = findEquipment(project, placement.equipmentId);
    const room = mark && mark.roomId ? findRoom(project, mark.roomId) : null;
    const links = [];
    let broken = !mark || !item;
    for (const id of placementLinkIds(placement)) {
      const linked = findMark(project, id);
      if (linked) links.push(tableLinkLabel(project, linked, mark ? mark.roomId : null));
      else broken = true;
    }
    if (placementLinkIds(placement).length > links.length) links.push(strings.tables.brokenLink);
    const kind = item ? findEquipmentType(project, item.typeId) : null;
    const row = {
      id: placement.id,
      cells: [
        mark ? labelOf(project, mark.id) : strings.tables.brokenLink,
        // Модель потеряна — так и написано в строке: пустая ячейка читалась бы
        // как «оборудования тут нет», а оно есть, просто его запись пропала.
        item ? item.name : strings.tables.equipmentLost,
        // Пустой тип — пустая ячейка, а не пометка: у моделей, заведённых до
        // появления справочника, типа нет, и это не поломка.
        kind ? kind.name : "",
        room ? room.name : "",
        mark ? mark.location || "" : "",
        links.join(", "),
      ],
      color: mark ? styleOf(project, mark.typeId).color : null,
      problem: broken,
    };
    items.push({
      row,
      mark,
      item,
      roomId: room ? room.id : "none",
      sort: mark ? [order.has(mark.typeId) ? order.get(mark.typeId) : 999, mark.number] : [1e6, 0],
    });
    if (item) counts.set(item.id, (counts.get(item.id) || 0) + 1);
  }

  items.sort((a, b) => (a.sort[0] === b.sort[0] ? a.sort[1] - b.sort[1] : a.sort[0] - b.sort[0]));

  // Разбивка осталась одна — по помещениям, и работает она как в листе меток:
  // секция на помещение, метки без помещения последней секцией. Выключена —
  // один список без заголовков, в порядке типов справочника.
  const groups = [];
  if (byRoom) {
    const byRoomKey = new Map();
    for (const entry of items) {
      if (!byRoomKey.has(entry.roomId)) byRoomKey.set(entry.roomId, []);
      byRoomKey.get(entry.roomId).push(entry);
    }
    for (const roomKey of [...roomsInOrder(project).map((room) => room.id), "none"]) {
      const list = byRoomKey.get(roomKey);
      if (!list || list.length === 0) continue;
      const room = roomKey === "none" ? null : findRoom(project, roomKey);
      groups.push({
        id: roomKey,
        title: room ? room.name : strings.tables.noRoom,
        color: room ? room.color || null : null,
        rows: list.map((entry) => entry.row),
        level: 1,
      });
    }
  } else {
    groups.push({ id: "all", title: "", color: null, rows: items.map((entry) => entry.row), level: 1 });
  }

  // Закупка: производитель — заголовком, модели под ним. Размещения с
  // потерянной моделью в закупку не попадают: заказывать по ним нечего,
  // их видно строкой-проблемой.
  const byVendor = new Map();
  for (const item of equipmentInOrder(project)) {
    const count = counts.get(item.id) || 0;
    if (count === 0) continue;
    const vendor = (item.vendor || "").trim() || strings.tables.noVendor;
    if (!byVendor.has(vendor)) byVendor.set(vendor, []);
    byVendor.get(vendor).push({ item, count });
  }
  const totals = [];
  let totalCount = 0;
  for (const [vendor, list] of byVendor) {
    const sum = list.reduce((acc, entry) => acc + entry.count, 0);
    totals.push({ id: "vendor:" + vendor, level: 1, title: vendor, category: vendor, count: sum, color: null });
    for (const entry of list) {
      totals.push({
        id: entry.item.id,
        level: 2,
        title: tableEquipmentName(entry.item),
        category: vendor,
        count: entry.count,
        color: null,
      });
    }
    totalCount += sum;
  }

  return {
    ...empty,
    title: project.name || strings.tables.equipmentTitle,
    room: tableRoomTitle(project, filter),
    note: tableFilterNote(project, filter),
    totals,
    totalCount,
    groups,
  };
}

// Знак типа одной строкой — то, чем тип узнают на плане.
//
// Что именно знак, решает вид типа, и спрашивается он у `typeKindOf`: у
// объекта прежнего формата поля `kind` нет вовсе. У точечного знак — фигура,
// у линейного — начертание, и к нему приписано слово «линия»: иначе
// «Двойная» в колонке «Форма» читалась бы как ещё одна фигура.
//
// Унаследованный знак назван унаследованным. Без этого правка формы категории
// молча меняла бы восемь строк листа из двадцати восьми, а по распечатке было
// бы не понять, какие именно.
//
// Сам знак идёт первым, пометка — следом в скобках: «Квадрат (как у
// категории)». Слова заказчика: «пусть название будет первым». Колонку
// читают сверху вниз, ища знак, и приставка отодвигала бы его вправо на
// восьми строках из двадцати восьми — столбец переставал быть столбцом.
// В сетке выбора справочника порядок обратный, и это не разнобой: там клетка
// и есть наследование, а название объясняет, чем оно обернулось.
function tableTypeSign(project, type) {
  const style = styleOf(project, type.id);
  const line = typeKindOf(project, type.id) === "line";
  const own = line ? type.lineStyle : type.shape;
  const name = line
    ? text("tables.lineSign", { name: strings.lineStyles[style.lineStyle] || style.lineStyle })
    : strings.shapes[style.shape] || style.shape;
  return own ? name : text("tables.inheritSign", { name });
}

// Справочник разбит по категориям, как остальные листы: категория —
// заголовок секции, а не колонка в каждой строке. Колонка её дублировала —
// двадцать восемь строк подряд повторяли «Свет», «Свет», «Свет».
//
// В заголовке рядом с названием стоит цвет категории словами и кодом —
// «Розетки · красный (#D1242F)». Так просил заказчик: один hex читателю
// листа ничего не говорил, а по слову цвет узнаётся и на чёрно-белой
// распечатке, где цветной полосы попросту нет. Имя считает `colorName.js` —
// оно находится и для цвета, который пользователь завёл сам.
//
// Отдельной колонки «Цвет» по-прежнему нет: у строки цвет остался полосой
// слева (`row.color`), а у секции — полосой и чертой заголовка.
//
// Колонка знака одна, и это не экономия места. Слова заказчика: «зачем в
// таблице справочника типов указывать у типа и форму и тип линии, если оно
// что-то одно?» У типа либо вид «точка» — и работает фигура, либо «линия» —
// и работает начертание; при двух колонках одна в каждой строке пустовала.
function typesTable(project) {
  const columns = [strings.tables.code, strings.tables.name, strings.tables.shape];
  const groups = [];
  if (project) {
    for (const { category, types } of typesInOrder(project)) {
      const color = category.color || null;
      const named = colorNameHex(color);
      groups.push({
        id: category.id,
        title: named ? text("tables.groupColor", { title: category.name, color: named }) : category.name,
        color,
        level: 1,
        rows: types.map((type) => {
          const style = styleOf(project, type.id);
          return {
            id: type.id,
            cells: [type.code, type.name, tableTypeSign(project, type)],
            // Категория строкой — для CSV: там заголовков-секций нет, и
            // категория возвращается колонкой. Название без цвета: в таблице
            // Excel по ней фильтруют и сортируют, а «Свет · синий (#1F6FEB)»
            // фильтровать неудобно.
            group: category.name,
            color: style.color,
            shape: style.shape,
          };
        }),
      });
    }
  }
  return {
    kind: "types",
    title: strings.tables.typesTitle,
    byRoom: false,
    room: "",
    note: "",
    groupColumn: strings.tables.category,
    columns,
    groups,
  };
}

// Обе таблицы читаются одинаково: список секций с заголовком и строками.
// У справочника секция одна и без заголовка.
function tableSections(table) {
  if (!table) return [];
  if (Array.isArray(table.groups)) return table.groups;
  return [{ id: "all", title: "", color: null, rows: table.rows || [], level: 1 }];
}
function tableRowCount(table) {
  return tableSections(table).reduce((total, section) => total + section.rows.length, 0);
}

// ——— текстовые форматы ————————————————————————————————————————————————

// CSV для русского Excel: BOM, точка с запятой, переводы строк CRLF.
// Без BOM Excel читает кириллицу как «ÐŸÐš1», без «;» — валит строку в одну
// колонку: обе пляски с кодировкой пользователь и просил убрать.
const TABLE_CSV_BOM = "\uFEFF";
const TABLE_CSV_SEPARATOR = ";";

function tableCsvCell(value) {
  const cell = value == null ? "" : String(value);
  if (!/[;"\n\r]/.test(cell) && cell.trim() === cell) return cell;
  return '"' + cell.split('"').join('""') + '"';
}

// CSV — не документ, а таблица: человек её сортирует, фильтрует и суммирует.
// Поэтому заголовков групп между строками здесь нет (фильтр Excel утаскивал
// «Свет» в данные) — вместо них колонка: категория у меток, сторона у связей.
// Название объекта, помещение и пометка о сужении остаются сверху, но
// отделены пустой строкой: так область данных начинается ровно с шапки.
// Итоги идут после данных, тоже за пустой строкой, — фильтр их не захватывает.
function toCsv(table) {
  const lines = [];
  if (table && table.title) lines.push(tableCsvCell(table.title));
  if (table && table.room) lines.push(tableCsvCell(table.room));
  if (table && table.note) lines.push(tableCsvCell(table.note));
  if (lines.length > 0) lines.push("");

  const groupColumn = (table && table.groupColumn) || "";
  const header = groupColumn ? [groupColumn, ...table.columns] : [...table.columns];
  lines.push(header.map(tableCsvCell).join(TABLE_CSV_SEPARATOR));
  for (const section of tableSections(table)) {
    for (const row of section.rows) {
      const cells = groupColumn ? [row.group || section.title || "", ...row.cells] : row.cells;
      lines.push(cells.map(tableCsvCell).join(TABLE_CSV_SEPARATOR));
    }
  }

  if (table && Array.isArray(table.totals) && table.totals.length > 0) {
    lines.push("", tableCsvCell(strings.tables.totals));
    const totalsColumns = table.totalsColumns || [
      strings.tables.category,
      strings.tables.type,
      strings.tables.points,
    ];
    lines.push(totalsColumns.map(tableCsvCell).join(TABLE_CSV_SEPARATOR));
    // В Excel строками идут типы: по ним считают закупку, а подытог категории
    // там собирают сами. Двухуровневый список — для бумаги.
    for (const row of table.totals) {
      if (row.level !== 2) continue;
      lines.push([row.category, row.title, row.count].map(tableCsvCell).join(TABLE_CSV_SEPARATOR));
    }
    lines.push(
      [table.totalLabel || strings.tables.totalAll, "", table.totalCount]
        .map(tableCsvCell)
        .join(TABLE_CSV_SEPARATOR),
    );
  }
  return TABLE_CSV_BOM + lines.join("\r\n") + "\r\n";
}

function tableMarkdownCell(value) {
  return (value == null ? "" : String(value)).split("|").join("\\|").split("\n").join(" ");
}
function toMarkdown(table) {
  const out = [];
