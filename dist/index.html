    }
    return;
  }
  if (uiEscapeListener) return;
  uiEscapeListener = (event) => {
    const top = uiDialogs[uiDialogs.length - 1];
    if (!top) return;
    if (event.key === "Escape") {
      if (top.dismissable === false) return;
      event.preventDefault();
      top.close();
      if (top.onCancel) top.onCancel();
      return;
    }
    // Enter подтверждает основное действие. Поле ввода, которое обработало
    // Enter само (uiPrompt), помечает событие — второй раз не срабатываем.
    if (event.key !== "Enter" || event.defaultPrevented || !top.primary) return;
    const target = event.target;
    if (target && (target.tagName === "TEXTAREA" || target.isContentEditable)) return;
    event.preventDefault();
    top.primary.click();
  };
  document.addEventListener("keydown", uiEscapeListener);
}

function uiFocusEntry(entry) {
  const target = entry.card.querySelector("input, select, textarea") || entry.primary || entry.card;
  if (target && typeof target.focus === "function") target.focus();
}

// Фокус возвращается открывшему, если он ещё на странице (кнопка панели могла
// исчезнуть при перерисовке); иначе — диалогу, который снова стал верхним.
function uiReturnFocus(entry) {
  const opener = entry.opener;
  if (opener && typeof opener.focus === "function" && opener.isConnected) {
    opener.focus();
    return;
  }
  const top = uiDialogs[uiDialogs.length - 1];
  if (top) uiFocusEntry(top);
}
function uiModal(options) {
  const host = document.getElementById("dialog-host");
  const actions = options.actions || [];
  const card = uiEl("div", { class: "modal", attrs: { tabindex: "-1" } }, [
    uiEl("h3", { class: "modal__title", text: options.title || "" }),
    uiEl("div", { class: "modal__body" }, options.body || null),
    uiEl("div", { class: "modal__actions" }, actions),
  ]);
  const entry = {
    card,
    dismissable: options.dismissable,
    onCancel: options.onCancel,
    // Основное действие — последняя кнопка в ряду (в uiConfirm и uiPrompt это
    // подтверждение, в редакторе плана — «Готово»).
    primary: options.primary || [...actions].reverse().find((node) => node && node.tagName === "BUTTON") || null,
    opener: typeof document !== "undefined" ? document.activeElement : null,
    close() {
      const index = uiDialogs.indexOf(entry);
      if (index < 0) return;
      uiDialogs.splice(index, 1);
      card.remove();
      uiRefreshDialogs();
      uiReturnFocus(entry);
    },
  };
  if (!host) return { close() {}, card };
  uiDialogs.push(entry);
  host.append(card);
  uiRefreshDialogs();
  uiFocusEntry(entry);
  return { close: entry.close, card };
}
function uiConfirm({ title, message, confirmLabel }) {
  return new Promise((resolve) => {
    let modal;
    const answer = (value) => {
      modal.close();
      resolve(value);
    };
    modal = uiModal({
      title,
      body: uiEl("p", { class: "modal__text", text: message }),
      actions: [
        uiButton(strings.dialog.cancel, { on: { click: () => answer(false) } }),
        uiButton(confirmLabel || strings.dialog.confirm, {
          class: "ui-btn ui-btn--danger",
          on: { click: () => answer(true) },
        }),
      ],
      onCancel: () => resolve(false),
    });
  });
}
function uiPrompt({ title, value, placeholder, submitLabel }) {
  return new Promise((resolve) => {
    let modal;
    const done = (result) => {
      modal.close();
      resolve(result || null);
    };
    const input = uiEl("input", {
      class: "ui-input",
      type: "text",
      value: value || "",
      placeholder: placeholder || "",
      on: {
        keydown: (event) => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          done(input.value.trim());
        },
      },
    });
    modal = uiModal({
      title,
      body: input,
      actions: [
        uiButton(strings.dialog.cancel, { on: { click: () => done(null) } }),
        uiButton(submitLabel || strings.dialog.save, {
          class: "ui-btn ui-btn--accent",
          on: { click: () => done(input.value.trim()) },
        }),
      ],
      onCancel: () => resolve(null),
    });
    input.select();
  });
}
function formatMegabytes(bytes) {
  return text("units.megabytes", { value: Math.round(bytes / (1024 * 1024)) });
}

// src/canvas.js
// Холст разметки: план, метки, блоки, ломаные, выделение и отмена.
//
// Главное правило места: заказчик сегодня размечает план ручкой по распечатке.
// Поэтому диалог тут ровно один — выбор типа, и открывается он один раз на серию.
// Дальше клик ставит метку, а ручки «+» у поставленной точки продолжают блок,
// не спрашивая ничего. Всё остальное (панель инструментов, список меток) —
// вокруг, но не между рукой и планом.
//
// Координаты: в объекте — доли плана (0…1), на экране — пиксели холста.
// Переводит их только render.js; здесь координаты не пересчитываются руками.






const CANVAS_ZOOM_MIN = 0.04;
const CANVAS_ZOOM_MAX = 24;
// Смещение курсора, после которого клик считается перетаскиванием.
const CANVAS_DRAG_SLOP = 3;

let canvasHost = null;
let canvasNode = null;
let canvasCtx = null;
let canvasApi = null;
let canvasDraft = null; // черновик ломаной: {points, cursor}
let canvasDrag = null;
let canvasPreview = null; // объект во время перетаскивания — в состояние не пишется
let canvasPointers = new Map();
let canvasPinch = null;
let canvasSpace = false;
let canvasFrame = 0;
let canvasFitted = null;
let canvasProjectId = null;

function canvasState() {
  return canvasApi ? canvasApi.getState() : null;
}

// Во `view` для рисования сходятся две половины: масштаб и сдвиг — сеансовые,
// размеры метки и подписи — из объекта (их двигает ползунок в панели).
function canvasViewOf(state) {
  const sizes = state.project && state.project.view ? state.project.view : {};
  return { ...state.view, markSize: sizes.markSize, labelSize: sizes.labelSize };
}

function canvasScheme(state) {
  return state.project && state.schemeId ? findScheme(state.project, state.schemeId) : null;
}

function canvasImage(state) {
  const loaded = state.schemeImage;
  return loaded && loaded.schemeId === state.schemeId ? loaded.image : null;
}

function canvasProject(state) {
  return canvasPreview || state.project;
}

function canvasPointOf(event) {
  const box = canvasNode.getBoundingClientRect();
  return { x: event.clientX - box.left, y: event.clientY - box.top };
}

// ——— рисование ———————————————————————————————————————————————————————

function canvasRedraw() {
  if (canvasFrame || !canvasNode) return;
  const schedule = typeof requestAnimationFrame === "function" ? requestAnimationFrame : (fn) => setTimeout(fn, 16);
  canvasFrame = schedule(() => {
    canvasFrame = 0;
    canvasPaint();
  });
}

function canvasResize() {
  if (!canvasNode || !canvasHost) return;
  const ratio = window.devicePixelRatio || 1;
  const width = Math.max(1, canvasHost.clientWidth);
  const height = Math.max(1, canvasHost.clientHeight);
  canvasNode.style.width = width + "px";
  canvasNode.style.height = height + "px";

  canvasNode.height = Math.round(height * ratio);

function canvasPaint() {

  canvasCtx.clearRect(0, 0, canvasNode.width, canvasNode.height);

  if (!scheme) return;
  const project = canvasProject(state);
  const view = canvasViewOf(state);
  const draftColor = canvasDraftColor(state, project);
  drawScheme(canvasCtx, {
    project,
    scheme,
    image: canvasImage(state),
    filter: state.filter,
    view,
    selectedIds: state.selectedMarkIds,
    selectedOutlineId: state.selectedOutlineId || null,
    draft: canvasDraft,
    draftColor,
  });
  // Ручки контура — у выделенного помещения: вершину двигают, «+» на стенке
  // добавляет новую. Обводка по стенам с первого раза не выходит.
  const outline = state.selectedOutlineId ? findOutline(project, state.selectedOutlineId) : null;
  if (outline && outline.schemeId === scheme.id && !canvasDrag) {
    drawOutlineHandles(canvasCtx, scheme, outline, view);
  }
  // Ручки «+» — только у одной выделенной точки: у линии блока не бывает.
  if (state.selectedMarkIds.length === 1 && !canvasDrag) {
    const mark = findMark(project, state.selectedMarkIds[0]);
    if (mark && mark.kind === "point" && mark.schemeId === scheme.id) {
      drawHandles(canvasCtx, scheme, mark, view, canvasHandleColor(state, mark));
    }
  }
}

// Цвет черновика: у контура помещения — цвет комнаты, у метки — цвет её типа.
function canvasDraftColor(state, project) {
  if (state.mode === "room") {
    const room = state.activeRoomId ? findRoom(project, state.activeRoomId) : null;
    return (room && room.color) || "#0969da";
  }
  return state.activeTypeId ? styleOf(project, state.activeTypeId).color : "#0969da";
}

// ——— изменения объекта ————————————————————————————————————————————————

// Любая правка объекта проходит здесь — и с холста, и из панели инструментов:
// команда отмены получает снимки «до» и «после», которые вернула модель, плюс
// схему и выделение, на которых действие произошло. Иначе Ctrl+Z после
// переключения схемы правит метки на той, которую не видно.
// Своего мутатора объекта в холсте нет.
// Ключи, которые понимает команда. Список закрытый нарочно: четвёртым
// аргументом когда-то был список выделения, потом стал объект опций — и массив
// от старого вызова молча превращался в опции без `selection`. Поставленная
// метка переставала выделяться: ни ручек «+» рядом с ней, ни живой кнопки
// «Сменить тип», и так четыре таска. Опечатка `selecton:` дала бы то же самое
// молчание, поэтому неизвестный ключ — отказ, а не подстановка по умолчанию.
const CANVAS_COMMIT_KEYS = ["selection", "schemeId", "patch"];
function canvasCommitOptions(options) {
  if (options == null) return {};
  if (typeof options !== "object" || Array.isArray(options)) {
    throw canvasOptionError("commitOptionsNotObject", { keys: CANVAS_COMMIT_KEYS.join(", ") });
  }
  const unknown = Object.keys(options).filter((key) => !CANVAS_COMMIT_KEYS.includes(key));
  if (unknown.length > 0) {
    throw canvasOptionError("unknownCommitOption", { keys: unknown.join(", "), known: CANVAS_COMMIT_KEYS.join(", ") });
  }
  return options;
}

function canvasOptionError(key, vars) {
  const error = new Error(text("errors." + key, vars));
  error.code = key;
  return error;
}
function canvasCommit(before, after, label, options = {}) {
  const { setState } = canvasApi;
  let settings;
  try {
    settings = canvasCommitOptions(options);
  } catch (error) {
    // Отказ виден и в интерфейсе: ошибка в опциях — это правка, которая не
    // случилась, и промолчать о ней значит повторить ту же историю.
    canvasFail(error);
    throw error;
  }
  const state = canvasState();
  const selectionBefore = state.selectedMarkIds;
  const schemeBefore = state.schemeId;
  const keep = settings.selection || selectionBefore;
  const schemeAfter = settings.schemeId || schemeBefore;
  // Правка сеансовых полей (активный тип, режим) едет вместе с командой:
  // возвращать объект без них — значит оставить панель показывать то, чего нет.
  // «До» для них снимается здесь же, по именам переданных полей, — вызывающий
  // передаёт только «после», иначе две половинки пары разъедутся молча.
  const patch = settings.patch || {};
  const patchBefore = {};
  for (const key of Object.keys(patch)) patchBefore[key] = state[key];
  // Единственное место, где срабатывает автопривязка меток к помещениям:
  // любая правка объекта проходит здесь, поэтому и поставленная метка, и
  // перерисованный контур доводят поля «Помещение» до порядка одним шагом
  // истории. Метка с вписанным руками помещением автоматике не достаётся.
  const binding = after && Array.isArray(after.marks) ? applyRoomOutlines(after) : { project: after, changed: [] };
  const bound = binding.project;
  // Ярлык шага называет и автопривязку, когда она что-то поменяла: «смена типа»
  // в списке отмены, за которой переехали помещения полудюжины меток, врёт.
  const step = binding.changed.length > 0 ? text("history.withRooms", { label }) : label;
  const apply = () =>
    setState({ project: bound, schemeId: schemeAfter, selectedMarkIds: canvasAlive(bound, keep), ...patch });
  apply();
  pushCommand({
    label: step,
    undo: () =>
      setState({
        project: before,
        schemeId: schemeBefore,
        selectedMarkIds: canvasAlive(before, selectionBefore),
        ...patchBefore,
      }),
    redo: apply,
  });
}

function canvasAlive(project, ids) {
  return ids.filter((id) => project.marks.some((mark) => mark.id === id));
}

function canvasFail(error) {
  canvasApi.notify(error && error.message ? error.message : String(error), "error");
}

function canvasPlacePoint(plan) {
  const state = canvasState();
  if (!state.activeTypeId) {
    canvasApi.notify(strings.canvas.needType);
    return;
  }
  try {
    const result = addMark(state.project, {
      schemeId: state.schemeId,
      typeId: state.activeTypeId,
      kind: "point",
      points: [plan],
    });
    canvasCommit(state.project, result.project, strings.history.addMark, { selection: [result.mark.id] });
  } catch (error) {
    canvasFail(error);
  }
}

// Тип, который поставит следующий клик: выбранный в панели, пока он жив
// в справочнике. Иначе — ничего, и модель повторит тип соседней метки.
function canvasPlacedTypeId(state) {
  const typeId = state.activeTypeId;
  if (!typeId || !state.project || !findType(state.project, typeId)) return null;
  return typeId;
}

// Цвет ручек «+»: выбран тип, отличный от типа метки, — ручка красится в его
// цвет, и по ней видно, что рядом встанет розетка, а не второй выключатель.
// Тип тот же или не выбран — ручка синяя, как выделение.
function canvasHandleColor(state, mark) {
  const typeId = canvasPlacedTypeId(state);
  return typeId && typeId !== mark.typeId ? styleOf(state.project, typeId).color : null;
}

// Шаг блока — не меньше умолчания модели и не меньше двух радиусов метки,
// иначе соседние точки блока сливаются в одну кляксу.
function canvasBlockStep(state) {
  const size = state.project && state.project.view ? state.project.view.markSize : 10;
  return Math.max(BLOCK_STEP_PX, size * 2.6);
}

// Ручка «+» ставит метку выбранного типа: выбрана «Р» — рядом с выключателем
// встаёт розетка со своим номером, как в настоящем подрозетнике. Активного типа
// нет (режим выделения) — модель берёт тип соседней метки.
function canvasBlockPoint(markId, side) {
  const state = canvasState();
  try {
    const result = addToGroup(state.project, markId, side, {
      step: canvasBlockStep(state),
      typeId: canvasPlacedTypeId(state),
    });
    canvasCommit(state.project, result.project, strings.history.addBlock, { selection: [result.mark.id] });
  } catch (error) {
    canvasFail(error);
  }
}

function canvasCancelDraft() {
  if (!canvasDraft) return false;
  canvasDraft = null;
  canvasRedraw();
  return true;
}

function canvasLineClick(plan, screen) {
  const state = canvasState();
  if (!state.activeTypeId) {
    canvasApi.notify(strings.canvas.needType);
    return;
  }
  canvasDraftClick(plan, screen);
}

// Контур помещения рисуется той же рукой, что и ломаная: клик — вершина,
// двойной клик по первой замыкает, Backspace убирает последнюю, Esc отменяет.
// Отличается только то, чем это заканчивается: замкнутым многоугольником
// помещения, а не линией-меткой.
function canvasOutlineClick(plan, screen) {
  const state = canvasState();
  if (!state.activeRoomId || !findRoom(state.project, state.activeRoomId)) {
    canvasApi.notify(strings.canvas.needRoom);
    return;
  }
  canvasDraftClick(plan, screen);
}

function canvasDraftClick(plan, screen) {
  const state = canvasState();
  if (!canvasDraft) {
    canvasDraft = { points: [plan], cursor: plan };
    canvasRedraw();
    return;
  }
  const scheme = canvasScheme(state);
  const view = canvasViewOf(state);
  const threshold = markRadius(view) + 6;
  const points = canvasDraft.points;
  const last = planToScreen(points[points.length - 1], scheme, view);
  const first = planToScreen(points[0], scheme, view);
  // Клик по последней или первой вершине ничего не добавляет: это первая
  // половина двойного клика, который завершает или замыкает линию.
  if (Math.hypot(screen.x - last.x, screen.y - last.y) <= threshold) return;
  if (points.length >= 2 && Math.hypot(screen.x - first.x, screen.y - first.y) <= threshold) return;
  points.push(plan);
  canvasRedraw();
}

function canvasLineFinish(closed) {
  if (!canvasDraft) return;
  const points = canvasDraft.points;
  const state = canvasState();
  if (points.length < 2) {
    canvasApi.notify(strings.canvas.lineTooShort);
    canvasCancelDraft();
    return;
  }
  try {
    const result = addMark(state.project, {
      schemeId: state.schemeId,
      typeId: state.activeTypeId,
      kind: "line",
      points,
    });
    let project = result.project;
    if (closed) project = updateMark(project, result.mark.id, { closed: true }).project;
    canvasDraft = null;
    canvasCommit(state.project, project, strings.history.addLine, { selection: [result.mark.id] });
  } catch (error) {
    canvasCancelDraft();
    canvasFail(error);
  }
}

function canvasOutlineFinish() {
  if (!canvasDraft) return;
  const points = canvasDraft.points;
  const state = canvasState();
  if (points.length < OUTLINE_MIN_POINTS) {
    canvasApi.notify(strings.canvas.outlineTooShort);
    return;
  }
  try {
    const result = addOutline(state.project, {
      schemeId: state.schemeId,
      roomId: state.activeRoomId,
      points,
    });
    canvasDraft = null;
    // Контур нарисован — дальше его правят, а не рисуют второй: режим
    // переключается на выделение, и ручки вершин сразу под рукой.
    canvasCommit(state.project, result.project, strings.history.addOutline, {
      selection: [],
      patch: { mode: "select", selectedOutlineId: result.outline.id },
    });
  } catch (error) {
    canvasCancelDraft();
    canvasFail(error);
  }
}

// Правка вершин выделенного контура: «+» на стенке добавляет вершину,
// двойной клик по вершине убирает её. Перетаскивание вершины — в canvasDragTo.
function canvasOutlineInsert(outlineId, index, plan) {
  const state = canvasState();
  try {
    const result = insertOutlinePoint(state.project, outlineId, index, plan);
    canvasCommit(state.project, result.project, strings.history.outlineVertexAdd, {
      patch: { selectedOutlineId: outlineId },
    });
  } catch (error) {
    canvasFail(error);
  }
}

function canvasOutlineRemovePoint(outlineId, index) {
  const state = canvasState();
  try {
    const result = removeOutlinePoint(state.project, outlineId, index);
    canvasCommit(state.project, result.project, strings.history.outlineVertexRemove, {
      patch: { selectedOutlineId: outlineId },
    });
  } catch (error) {
    canvasFail(error);
  }
}

async function canvasDeleteOutline() {
  const state = canvasState();
  const outline = state.selectedOutlineId ? findOutline(state.project, state.selectedOutlineId) : null;
  // Контур с другой схемы удалять нечего: выделение могло остаться с прошлой.
  if (!outline || outline.schemeId !== state.schemeId) return;
  const room = findRoom(state.project, outline.roomId);
  const agreed = await uiConfirm({
    title: strings.canvas.deleteOutlineTitle,
    message: text("canvas.deleteOutlineMessage", { name: room ? room.name : "" }),
    confirmLabel: strings.canvas.deleteOutlineConfirm,
  });
  if (!agreed) return;
  const fresh = canvasState().project;
  if (!findOutline(fresh, outline.id)) return;
  try {
    const result = deleteOutline(fresh, outline.id);
    canvasCommit(fresh, result.project, strings.history.removeOutline, {
      patch: { selectedOutlineId: null },
    });
  } catch (error) {
    canvasFail(error);
  }
}

async function canvasDeleteSelected() {
  const state = canvasState();
  const markId = state.selectedMarkIds[0];
  const mark = markId ? findMark(state.project, markId) : null;
  if (!mark) return;
  const group = mark.groupId ? findGroup(state.project, mark.groupId) : null;
  if (group) {
    const agreed = await uiConfirm({
      title: strings.canvas.deleteBlockTitle,
      message: text("canvas.deleteBlockMessage", {
        label: labelOf(state.project, mark.id),
        count: group.markIds.length,
      }),
      confirmLabel: strings.canvas.deleteConfirm,
    });
    if (!agreed) return;
  }
  const fresh = canvasState().project;
  if (!findMark(fresh, markId)) return;
  try {
    const result = deleteMark(fresh, markId);
    canvasCommit(fresh, result.project, strings.history.remove, { selection: [] });
  } catch (error) {
    canvasFail(error);
  }
}

// ——— отмена ——————————————————————————————————————————————————————————
function canvasUndoStep() {
  if (!canUndo()) {
    canvasApi.notify(strings.canvas.nothingToUndo);
    return;
  }
  const command = undo();
  canvasApi.notify(text("canvas.undone", { label: command.label }));
}
function canvasRedoStep() {
  if (!canRedo()) {
    canvasApi.notify(strings.canvas.nothingToRedo);
    return;
  }
  const command = redo();
  canvasApi.notify(text("canvas.redone", { label: command.label }));
}

// ——— масштаб —————————————————————————————————————————————————————————

function canvasClampZoom(zoom) {
  return Math.min(CANVAS_ZOOM_MAX, Math.max(CANVAS_ZOOM_MIN, zoom));
}

// Приближение к точке: точка плана под курсором остаётся под курсором.
function canvasZoomAt(point, factor) {
  const state = canvasState();
  const view = state.view;
  const zoom = canvasClampZoom(view.zoom * factor);
  const ratio = zoom / view.zoom;
  canvasApi.setState({
    view: {
      zoom,
      offsetX: point.x - (point.x - view.offsetX) * ratio,
      offsetY: point.y - (point.y - view.offsetY) * ratio,
    },
  });
}
function canvasZoomBy(factor) {
  if (!canvasNode) return;
  canvasZoomAt({ x: canvasNode.clientWidth / 2, y: canvasNode.clientHeight / 2 }, factor);
}
function canvasFitPlan() {
  const state = canvasState();
  const scheme = canvasScheme(state);
  if (!scheme || !canvasNode) return;
  canvasApi.setState({
    view: fitView(scheme, { width: canvasNode.clientWidth, height: canvasNode.clientHeight }),
  });
  canvasFitted = scheme.id;
}
function canvasZoomReset() {
  if (!canvasNode) return;
  const state = canvasState();
  const scheme = canvasScheme(state);
  if (!scheme) return;
  canvasApi.setState({
    view: {
      zoom: 1,
      offsetX: (canvasNode.clientWidth - scheme.width) / 2,
      offsetY: (canvasNode.clientHeight - scheme.height) / 2,
    },
  });
}

// ——— указатель ———————————————————————————————————————————————————————

function canvasStartPan(point) {
  const state = canvasState();
  canvasDrag = { kind: "pan", start: point, view: { ...state.view }, moved: false };
}

function canvasPointerDown(event) {
  if (uiDialogDepth() > 0 || !canvasScheme(canvasState())) return;
  // Захват может не дать браузер (например, у синтетического события) — это не повод
  // терять клик.
  try {
    canvasNode.setPointerCapture(event.pointerId);
  } catch (error) {
    /* работаем без захвата */
  }
  canvasPointers.set(event.pointerId, canvasPointOf(event));

  // Планшет: разметка остаётся десктопной, пальцы только смотрят.
  if (event.pointerType === "touch") {
    if (canvasPointers.size === 2) {
      const [a, b] = [...canvasPointers.values()];
      canvasPinch = {
        distance: Math.hypot(a.x - b.x, a.y - b.y),
        center: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
      };
      canvasDrag = null;
      return;
    }
    canvasStartPan(canvasPointOf(event));
    return;
  }
  if (event.button === 2) return;
  const point = canvasPointOf(event);
  if (event.button === 1 || canvasSpace) {
    event.preventDefault();
    canvasStartPan(point);
    return;
  }
  if (event.button !== 0) return;

  const state = canvasState();
  const scheme = canvasScheme(state);
  const view = canvasViewOf(state);

  // Ручка «+» важнее всего остального: она и есть быстрый путь.
  if (state.selectedMarkIds.length === 1) {
    const selected = findMark(state.project, state.selectedMarkIds[0]);
    if (selected && selected.kind === "point" && selected.schemeId === scheme.id) {
      const side = hitHandle(scheme, selected, point, view);
      if (side) {
        canvasBlockPoint(selected.id, side);
        canvasDrag = { kind: "done", start: point, moved: false };
        return;
      }
    }
  }

  if (state.mode === "line" || state.mode === "room") {
    canvasDrag = { kind: state.mode, start: point, view: { ...state.view }, moved: false };
    return;
  }

  // Клик по метке важнее клика по контуру: попадание по меткам считается
  // первым, и контур перехватывает клик только там, где метки нет.
  const hit = hitTest(state.project, scheme, point, view, state.filter);
  if (!hit && state.mode === "select") {
    const outlineHit = hitOutline(state.project, scheme, point, view, state.filter, state.selectedOutlineId || null);
    if (outlineHit) {
      if (outlineHit.part === "vertex") {
        canvasDrag = {
          kind: "outlineVertex",
          outlineId: outlineHit.outlineId,
          index: outlineHit.index,
          start: point,
          before: state.project,
          moved: false,
        };
        return;
      }
      if (outlineHit.part === "insert") {
        canvasOutlineInsert(outlineHit.outlineId, outlineHit.index, screenToPlan(point, scheme, view));
        canvasDrag = { kind: "done", start: point, moved: false };
        return;
      }
      if (state.selectedOutlineId !== outlineHit.outlineId || state.selectedMarkIds.length > 0) {
        canvasApi.setState({ selectedOutlineId: outlineHit.outlineId, selectedMarkIds: [] });
      }
      canvasDrag = { kind: "outline", start: point, view: { ...state.view }, moved: false };
      return;
    }
  }
  if (hit) {
    // Выделили метку — выделение контура снимается: две пары ручек рядом
    // означали бы, что непонятно, чью вершину сейчас потащат.
    if (state.selectedMarkIds[0] !== hit.markId || state.selectedOutlineId) {
      canvasApi.setState({ selectedMarkIds: [hit.markId], selectedOutlineId: null });
    }
    canvasDrag = {
      kind: hit.part === "label" ? "label" : "mark",
      markId: hit.markId,
      groupId: hit.groupId,
      start: point,
      before: state.project,
      moved: false,
    };
    return;
  }
  canvasDrag = {
    kind: state.mode === "point" ? "place" : "empty",
    start: point,
    view: { ...state.view },
    moved: false,
  };
}

// Перетаскивание метки: новые точки считаются от снимка «до», а не от
// предыдущего кадра, — иначе метка уползает от курсора накопленной ошибкой.
function canvasDragTo(point) {
  const state = canvasState();
  const scheme = canvasScheme(state);
  const view = canvasViewOf(state);
  const before = canvasDrag.before;
  const from = screenToPlan(canvasDrag.start, scheme, view);
  const now = screenToPlan(point, scheme, view);
  const dx = now.x - from.x;
  const dy = now.y - from.y;
  try {
    if (canvasDrag.kind === "outlineVertex") {
      const outline = findOutline(before, canvasDrag.outlineId);
      const origin = outline.points[canvasDrag.index];
      canvasPreview = moveOutlinePoint(before, canvasDrag.outlineId, canvasDrag.index, {
        x: origin.x + dx,
        y: origin.y + dy,
      }).project;
    } else if (canvasDrag.kind === "label") {
      const target = canvasDrag.groupId ? findGroup(before, canvasDrag.groupId) : findMark(before, canvasDrag.markId);
      // База — там, где подпись сейчас видна, а не там, где лежит её смещение:
      // подпись, отведённую раскладкой от соседа, нельзя дёргать обратно
      // в стандартное место в тот миг, когда за неё взялись мышью.
      const size = view.markSize || 10;
      const seen = target ? labelBox(before, scheme, target, view, state.filter) : null;
      const base = seen ? { dx: seen.dx, dy: seen.dy } : { dx: size * 1.5, dy: -size * 1.5 };
      const offset = { dx: base.dx + dx * scheme.width, dy: base.dy + dy * scheme.height };
      // Подпись блока стоит по смещению его первой метки — своего поля у группы
      // модель не заводит, а собственной подписи у этой метки нет.
      const holder = canvasDrag.groupId && target ? target.markIds[0] : canvasDrag.markId;
      canvasPreview = updateMark(before, holder, { labelOffset: offset }).project;
    } else {
      const mark = findMark(before, canvasDrag.markId);
      const points = mark.points.map((item) => ({ x: item.x + dx, y: item.y + dy }));
      canvasPreview = updateMark(before, canvasDrag.markId, { points }).project;
    }
  } catch (error) {
    canvasPreview = null;
  }
  canvasRedraw();
}

function canvasPointerMove(event) {
  if (!canvasNode) return;
  const point = canvasPointOf(event);
  if (canvasPointers.has(event.pointerId)) canvasPointers.set(event.pointerId, point);

  if (canvasPinch && canvasPointers.size === 2) {
    const [a, b] = [...canvasPointers.values()];
    const distance = Math.hypot(a.x - b.x, a.y - b.y);
    const center = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (canvasPinch.distance > 0) canvasZoomAt(center, distance / canvasPinch.distance);
    const state = canvasState();
    canvasApi.setState({
      view: {
        ...state.view,
        offsetX: state.view.offsetX + (center.x - canvasPinch.center.x),
        offsetY: state.view.offsetY + (center.y - canvasPinch.center.y),
      },
    });
    canvasPinch = { distance, center };
    return;
  }

  const state = canvasState();
  if (canvasDraft) {
    const scheme = canvasScheme(state);
    canvasDraft.cursor = screenToPlan(point, scheme, canvasViewOf(state));
    canvasRedraw();
  }
  if (!canvasDrag) return;
  const shift = Math.hypot(point.x - canvasDrag.start.x, point.y - canvasDrag.start.y);
  if (shift > CANVAS_DRAG_SLOP) canvasDrag.moved = true;
  if (!canvasDrag.moved) return;

  if (canvasDrag.kind === "mark" || canvasDrag.kind === "label" || canvasDrag.kind === "outlineVertex") {
    canvasDragTo(point);
    return;
  }
  if (["pan", "empty", "place", "line", "room", "outline"].includes(canvasDrag.kind)) {
    canvasApi.setState({
      view: {
        ...state.view,
        offsetX: canvasDrag.view.offsetX + (point.x - canvasDrag.start.x),
        offsetY: canvasDrag.view.offsetY + (point.y - canvasDrag.start.y),
      },
    });
  }
}

function canvasPointerUp(event) {
  canvasPointers.delete(event.pointerId);
  if (canvasPointers.size < 2) canvasPinch = null;
  const drag = canvasDrag;
  canvasDrag = null;
  if (!drag) return;
  const point = canvasPointOf(event);
  const state = canvasState();

  if (drag.moved) {
    if ((drag.kind === "mark" || drag.kind === "label") && canvasPreview) {
      const label = drag.kind === "label" ? strings.history.moveLabel : strings.history.move;
      const after = canvasPreview;
      canvasPreview = null;
      canvasCommit(drag.before, after, label, { selection: [drag.markId] });
    }
    if (drag.kind === "outlineVertex" && canvasPreview) {
      const after = canvasPreview;
      canvasPreview = null;
      canvasCommit(drag.before, after, strings.history.outlineVertexMove, {
        patch: { selectedOutlineId: drag.outlineId },
      });
    }
    canvasPreview = null;
    canvasRedraw();
    return;
  }
  canvasPreview = null;

  if (event.pointerType === "touch" || drag.kind === "done") return;
  const scheme = canvasScheme(state);
  const plan = screenToPlan(point, scheme, canvasViewOf(state));
  if (drag.kind === "line") {
    canvasLineClick(plan, point);
    return;
  }
  if (drag.kind === "room") {
    canvasOutlineClick(plan, point);
    return;
  }
  if (drag.kind === "place") {
    canvasPlacePoint(plan);
    return;
  }
  if (drag.kind === "empty" && (state.selectedMarkIds.length > 0 || state.selectedOutlineId)) {
    canvasApi.setState({ selectedMarkIds: [], selectedOutlineId: null });
  }
}

function canvasDoubleClick(event) {
  const state = canvasState();
  const scheme = canvasScheme(state);
  const view = canvasViewOf(state);
  // Двойной клик по вершине выделенного контура убирает её: обводка по стенам
  // с первого раза не выходит, и лишняя вершина — обычное дело.
  if (state.mode === "select" && state.selectedOutlineId) {
    const hit = hitOutline(state.project, scheme, canvasPointOf(event), view, state.filter, state.selectedOutlineId);
    if (hit && hit.part === "vertex" && hit.outlineId === state.selectedOutlineId) {
      event.preventDefault();
      canvasOutlineRemovePoint(hit.outlineId, hit.index);
      return;
    }
  }
  if ((state.mode !== "line" && state.mode !== "room") || !canvasDraft) return;
  const point = canvasPointOf(event);
  const threshold = markRadius(view) + 6;
  const points = canvasDraft.points;
  const first = planToScreen(points[0], scheme, view);
  const last = planToScreen(points[points.length - 1], scheme, view);
  const onFirst = Math.hypot(point.x - first.x, point.y - first.y) <= threshold;
  const onLast = Math.hypot(point.x - last.x, point.y - last.y) <= threshold;
  // Двойной клик в стороне — это просто две вершины подряд: рисование
  // продолжается, ничего не теряется и не замыкается.
  if (!onFirst && !onLast) return;
  event.preventDefault();
  // Контур помещения замкнут всегда: комната с открытой стенкой — не комната.
  if (state.mode === "room") {
    canvasOutlineFinish();
    return;
  }
  // По первой точке — замкнутый контур (лента по периметру комнаты),
  // по последней — открытая линия, ровно как в брифе.
  canvasLineFinish(onFirst && !onLast && points.length >= 3);
}

function canvasWheel(event) {
  if (uiDialogDepth() > 0) return;
  event.preventDefault();
  const step = event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY;
  canvasZoomAt(canvasPointOf(event), Math.exp(-step * 0.0015));
}

// ——— клавиатура ——————————————————————————————————————————————————————

function canvasTypingTarget(target) {
  if (!target || !target.tagName) return false;
  return (
    target.tagName === "INPUT" ||
    target.tagName === "TEXTAREA" ||
    target.tagName === "SELECT" ||
    target.isContentEditable
  );
}

function canvasKeyDown(event) {
  // Пока открыт диалог, клавиатура принадлежит ему.
  if (uiDialogDepth() > 0 || canvasTypingTarget(event.target)) return;
  const state = canvasState();
  const control = event.ctrlKey || event.metaKey;
  if (control && event.code === "KeyZ") {
    event.preventDefault();
    if (event.shiftKey) canvasRedoStep();
    else canvasUndoStep();
    return;
  }
  if (control && event.code === "KeyY") {
    event.preventDefault();
    canvasRedoStep();
    return;
  }
  if (control) return;
  if (event.code === "Space") {
    canvasSpace = true;
    if (canvasNode) canvasNode.style.cursor = "grab";
    return;
  }
  if (event.key === "Escape") {
    if (canvasCancelDraft()) return;
    if (state.selectedOutlineId) {
      canvasApi.setState({ selectedOutlineId: null });
      return;
    }
    // Первый Esc снимает выделение: пока метка выделена, вокруг неё ручки «+»,
    // и отдельную метку вплотную к блоку не поставить. Второй — выходит из режима.
    if (state.selectedMarkIds.length > 0) {
      canvasApi.setState({ selectedMarkIds: [] });
      return;
    }
    if (state.mode !== "select") canvasApi.setState({ mode: "select" });
    return;
  }
  if (event.key === "Backspace" && canvasDraft) {
    event.preventDefault();
    canvasDraft.points.pop();
    if (canvasDraft.points.length === 0) canvasDraft = null;
    canvasRedraw();
    return;
  }
  if ((event.key === "Delete" || event.key === "Backspace") && state.selectedMarkIds.length > 0) {
    event.preventDefault();
    canvasDeleteSelected();
    return;
  }
  if ((event.key === "Delete" || event.key === "Backspace") && state.selectedOutlineId) {
    event.preventDefault();
    canvasDeleteOutline();
  }
}

function canvasKeyUp(event) {
  if (event.code !== "Space") return;
  canvasSpace = false;
  canvasSyncCursor();
}

function canvasSyncCursor() {
  if (!canvasNode) return;
  const state = canvasState();
  if (canvasSpace) canvasNode.style.cursor = "grab";
  else canvasNode.style.cursor = state.mode === "select" ? "default" : "crosshair";
}

// ——— монтирование ————————————————————————————————————————————————————

function mountCanvas(host, api) {
  canvasApi = api;
  canvasHost = host;
  canvasNode = document.createElement("canvas");
  canvasNode.className = "canvas";
  host.replaceChildren(canvasNode);
  canvasCtx = canvasNode.getContext("2d");

  canvasNode.addEventListener("pointerdown", canvasPointerDown);
  canvasNode.addEventListener("pointermove", canvasPointerMove);
  canvasNode.addEventListener("pointerup", canvasPointerUp);
  canvasNode.addEventListener("pointercancel", canvasPointerUp);
  canvasNode.addEventListener("dblclick", canvasDoubleClick);
  canvasNode.addEventListener("wheel", canvasWheel, { passive: false });
  canvasNode.addEventListener("contextmenu", (event) => event.preventDefault());
  document.addEventListener("keydown", canvasKeyDown);
  document.addEventListener("keyup", canvasKeyUp);

  if (typeof ResizeObserver === "function") {
    new ResizeObserver(() => canvasResize()).observe(host);
  } else {
    window.addEventListener("resize", canvasResize);
  }

  api.subscribe((state, changed) => {
    if ("project" in changed) {
      const id = state.project ? state.project.id : null;
      // Стек отмены живёт в пределах объекта: сменили объект — история пуста.
      if (id !== canvasProjectId) {
        canvasProjectId = id;
        clearHistory();
        canvasFitted = null;
      }
    }
    if ("schemeId" in changed) {
      canvasCancelDraft();
      canvasPreview = null;
    }
    if ("mode" in changed) {
      if (state.mode !== "line" && state.mode !== "room") canvasCancelDraft();
      canvasSyncCursor();
    }
    if ("schemeId" in changed || "schemeImage" in changed) canvasAutoFit(state);
    canvasRedraw();
  });
  canvasResize();
  canvasSyncCursor();
  canvasAutoFit(canvasState());
}

// Новый план показывается целиком: подгонка один раз на схему, дальше масштаб
// принадлежит пользователю.
function canvasAutoFit(state) {
  const scheme = canvasScheme(state);
  if (!scheme || !canvasNode) return;
  if (canvasFitted === scheme.id) return;
  if (!canvasImage(state)) return;
  canvasFitted = scheme.id;
  canvasApi.setState({
    view: fitView(scheme, { width: canvasNode.clientWidth, height: canvasNode.clientHeight }),
  });
}

// Подсказка поверх холста: что сейчас ставим и чем это закончить.
function mountCanvasHint(host, api) {
  const hint = document.createElement("div");
  hint.className = "canvas-hint";
  host.replaceChildren(hint);
  const render = () => {
    const state = api.getState();
    if (!state.schemeId) {
      hint.hidden = true;
      return;
    }
    const type = state.project && state.activeTypeId ? findType(state.project, state.activeTypeId) : null;
    const label = type ? type.code + " — " + type.name : "";
    const room = state.project && state.activeRoomId ? findRoom(state.project, state.activeRoomId) : null;
    if (state.mode === "room") hint.textContent = text("canvas.hintRoom", { name: room ? room.name : "" });
    else if (state.mode === "point" && type) hint.textContent = text("canvas.hintPoint", { label });
    else if (state.mode === "line" && type) hint.textContent = strings.canvas.hintLine;
    else if (type) hint.textContent = strings.canvas.hintSelectMode;
    else hint.textContent = strings.canvas.hintSelect;
    hint.hidden = false;
    if (state.mode === "room" && room) hint.style.borderColor = room.color;
    else if (type) hint.style.borderColor = styleOf(state.project, type.id).color;
  };
  api.subscribe((state, changed) => {
    if (
      "mode" in changed ||
      "activeTypeId" in changed ||
      "activeRoomId" in changed ||
      "schemeId" in changed ||
      "project" in changed
    ) {
      render();
    }
  });
  render();
}

registerPanel(PANEL_IDS.canvas, mountCanvas);
registerPanel(PANEL_IDS.overlay, mountCanvasHint);

// src/tables.js
// Таблицы объекта: список меток и справочник типов.
//
// Чистый модуль без DOM — это тот шов, по которому проверяется, что в таблице
// у заказчика окажется ровно то же, что инженер написал бы от руки: строка
// «ПК1 — подсв. кровати — В31», разбивка цветными заголовками категорий,
// справочник типов отдельным списком.
//
// Видимость меток берётся у `render.visibleMarks` — тем же кодом, что решает,
// рисовать метку на холсте или нет. Своего фильтра здесь нет намеренно:
// разойдись они, на картинке и в таблице оказалось бы разное.
const TABLE_GROUP_BY = ["category", "type", "room"];

// Колонки списка меток — дословно из спецификации.
function tableMarkColumns() {
  return [
    strings.tables.label,
    strings.tables.type,
    strings.tables.room,
    strings.tables.location,
    strings.tables.original,
  ];
}

// Плоский порядок типов: индекс типа в справочнике задаёт порядок строк
// внутри любой группы. Порядок один на всё приложение — model.typesInOrder.
function tableTypeOrder(project) {
  const order = new Map();
  let index = 0;
  for (const { types } of typesInOrder(project)) {
    for (const type of types) order.set(type.id, index++);
  }
  return order;
}

// Метки, прошедшие фильтр, по всем схемам объекта — или по одной, если
// в фильтре назван `schemeId` (панель зовёт так для «только текущая схема»).
function tableVisibleMarks(project, filter) {
  const only = filter && filter.schemeId ? String(filter.schemeId) : null;
  const marks = [];
  for (const scheme of schemesInOrder(project)) {
    if (only && scheme.id !== only) continue;
    marks.push(...visibleMarks(project, scheme, filter));
  }
  return marks;
}

// Строка — на метку, а не на блок. Блок «Р1 Р2 Р3» заказчик читает как три
// позиции и требует три строки: в таблице метки блока не сводятся.
// Сводятся только метки с одинаковым **обозначением** — тот же тип и тот же
// номер: несколько светильников одной группы, которым проставлен Т1, остаются
// одной позицией «Т1», где бы они ни стояли. Подпись блока на плане это не
// трогает — там она по-прежнему одна на блок (model.blockLabel).
function tableEntries(project, filter) {
  const marks = tableVisibleMarks(project, filter);
  const order = tableTypeOrder(project);
  const byLabel = new Map();
  const entries = [];

  for (const mark of marks) {
    // Ключ — обозначение: тип (код у типов не повторяется) и номер.
    const key = mark.typeId + "\u0000" + mark.number;
    let entry = byLabel.get(key);
    if (!entry) {
      entry = { id: mark.id, marks: [] };
      byLabel.set(key, entry);
      entries.push(entry);
    }
    entry.marks.push(mark);
  }

  for (const entry of entries) {
    const [head] = entry.marks;
    entry.head = head;
    entry.order = [order.has(head.typeId) ? order.get(head.typeId) : 999, head.number];
  }

  entries.sort((a, b) => (a.order[0] === b.order[0] ? a.order[1] - b.order[1] : a.order[0] - b.order[0]));
  return entries;
}

// Несколько значений в одной ячейке (блок из разных типов или комнат) —
// перечисление без повторов: пустая ячейка лучше, чем «, , ».
function tableJoin(values, separator) {
  const seen = [];
  for (const value of values) {
    const clean = (value || "").trim();
    if (clean && !seen.includes(clean)) seen.push(clean);
  }
  return seen.join(separator);
}

// Обозначение строки — обозначение метки. У сведённых меток оно одно на всех
// (на том и сведены), поэтому берётся у ведущей.
function tableEntryLabel(project, entry) {
  return labelOf(project, entry.head.id);
}

// Тип у строки один: обозначение назвало его однозначно. Склейка осталась
// там, где сведённые метки правда расходятся, — помещение, расположение
// и «в оригинале» у одного обозначения бывают разные.
function tableEntryRow(project, entry) {
  const type = findType(project, entry.head.typeId);
  const cells = [
    tableEntryLabel(project, entry),
    type ? type.name : "",
    tableJoin(
      entry.marks.map((mark) => {
        const room = mark.roomId ? findRoom(project, mark.roomId) : null;
        return room ? room.name : "";
      }),
      ", ",
    ),
    tableJoin(entry.marks.map((mark) => mark.location), "; "),
    tableJoin(entry.marks.map((mark) => mark.original), ", "),
  ];
  return { id: entry.id, cells, color: styleOf(project, entry.head.typeId).color };
}

function tableGroupOf(project, entry, groupBy) {
  const type = findType(project, entry.head.typeId);
  if (groupBy === "type") {
    return type
      ? { key: type.id, title: `${type.code} — ${type.name}`, color: styleOf(project, type.id).color }
      : { key: "none", title: strings.tables.type, color: null };
  }
  if (groupBy === "room") {
    const room = entry.head.roomId ? findRoom(project, entry.head.roomId) : null;
    // Цвет помещения — тот же, которым обведён его контур на плане: лист
    // и схема должны узнаваться одним цветом.
    return room
      ? { key: room.id, title: room.name, color: room.color || null }
      : { key: "none", title: strings.tables.noRoom, color: null };
  }
  const category = type ? findCategory(project, type.categoryId) : null;
  return category
    ? { key: category.id, title: category.name, color: category.color }
    : { key: "none", title: strings.tables.category, color: null };
}

// Порядок групп — порядок справочника и помещений объекта; группа без строк
// на бумагу не попадает.
function tableGroupOrder(project, groupBy) {
  const keys = [];
  if (groupBy === "room") {
    for (const room of roomsInOrder(project)) keys.push(room.id);
  } else {
    for (const { category, types } of typesInOrder(project)) {
      if (groupBy === "type") for (const type of types) keys.push(type.id);
      else keys.push(category.id);
    }
  }
  keys.push("none");
  return keys;
}

// Помещение, по которому сужен лист. На рукописном листе заказчика комната
// стоит сверху, и без неё распечатка по одной комнате внешне не отличается от
// полной — монтажник не увидит, что лист неполный.
function tableRoomTitle(project, filter) {
  if (!filter || !filter.roomId) return "";
  const room = findRoom(project, filter.roomId);
  return room ? room.name : "";
}

function tableTypeAllowed(filter, type) {
  if (Array.isArray(filter.typeIds) && !filter.typeIds.includes(type.id)) return false;
  if (Array.isArray(filter.categoryIds) && !filter.categoryIds.includes(type.categoryId)) return false;
  return true;
}

// Та же беда, что и с комнатой: лист, сужённый галочками или поиском, внешне
// не отличается от полного, и монтажник не узнает, что часть меток скрыта.
// Когда скрыты целые категории — лист называет оставшиеся; когда выключена
// часть типов внутри категории или идёт поиск, перечислять нечестно, и лист
// просто признаётся, что он неполный.
function tableFilterNote(project, filter) {
  if (!filter) return "";
  const query = (filter.query || "").trim();
  const byLists = Array.isArray(filter.typeIds) || Array.isArray(filter.categoryIds);
  if (!query && !byLists) return "";
  if (!query && byLists) {
    const all = typesInOrder(project);
    const names = [];
    let whole = true;
    for (const { category, types } of all) {
      const shown = types.filter((type) => tableTypeAllowed(filter, type));
      if (shown.length === 0) continue;
      if (shown.length < types.length) whole = false;
      names.push(category.name);
    }
    if (whole && names.length === all.length) return "";
    if (whole && names.length > 0) return text("tables.onlyShown", { names: names.join(", ") });
  }
  return strings.tables.partial;
}
function marksTable(project, filter, groupBy) {
  const kind = TABLE_GROUP_BY.includes(groupBy) ? groupBy : "category";
  const columns = tableMarkColumns();
  if (!project) return { kind: "marks", groupBy: kind, title: "", room: "", note: "", columns, groups: [] };

  const buckets = new Map();
  for (const entry of tableEntries(project, filter)) {
    const group = tableGroupOf(project, entry, kind);
    if (!buckets.has(group.key)) buckets.set(group.key, { id: group.key, title: group.title, color: group.color, rows: [] });
    buckets.get(group.key).rows.push(tableEntryRow(project, entry));
  }

  const groups = tableGroupOrder(project, kind)
    .map((key) => buckets.get(key))
    .filter(Boolean);
  return {
    kind: "marks",
    groupBy: kind,
    title: project.name || strings.tables.marksTitle,
    room: tableRoomTitle(project, filter),
    note: tableFilterNote(project, filter),
    columns,
    groups,
  };
}
function typesTable(project) {
  const columns = [
    strings.tables.code,
    strings.tables.name,
    strings.tables.category,
    strings.tables.color,
    strings.tables.shape,
  ];
  const rows = [];
  if (project) {
    for (const { category, types } of typesInOrder(project)) {
      for (const type of types) {
        const style = styleOf(project, type.id);
        rows.push({
          id: type.id,
          cells: [type.code, type.name, category.name, style.color, strings.shapes[style.shape] || style.shape],
          color: style.color,
          shape: style.shape,
        });
      }
    }
  }
  return { kind: "types", title: strings.tables.typesTitle, room: "", note: "", columns, rows };
}

// Обе таблицы читаются одинаково: список секций с заголовком и строками.
// У справочника секция одна и без заголовка.
function tableSections(table) {
  if (!table) return [];
  if (Array.isArray(table.groups)) return table.groups;
  return [{ id: "all", title: "", color: null, rows: table.rows || [] }];
}
function tableRowCount(table) {
  return tableSections(table).reduce((total, section) => total + section.rows.length, 0);
}

// ——— текстовые форматы ————————————————————————————————————————————————

// CSV для русского Excel: BOM, точка с запятой, переводы строк CRLF.
// Без BOM Excel читает кириллицу как «ÐŸÐš1», без «;» — валит строку в одну
// колонку: обе пляски с кодировкой пользователь и просил убрать.
const TABLE_CSV_BOM = "\uFEFF";
const TABLE_CSV_SEPARATOR = ";";

function tableCsvCell(value) {
  const cell = value == null ? "" : String(value);
  if (!/[;"\n\r]/.test(cell) && cell.trim() === cell) return cell;
  return '"' + cell.split('"').join('""') + '"';
}
function toCsv(table) {
  const lines = [];
  if (table && table.title) lines.push(tableCsvCell(table.title));
  if (table && table.room) lines.push(tableCsvCell(table.room));
  if (table && table.note) lines.push(tableCsvCell(table.note));
  lines.push(table.columns.map(tableCsvCell).join(TABLE_CSV_SEPARATOR));
  for (const section of tableSections(table)) {
    if (section.title) lines.push(tableCsvCell(section.title));
    for (const row of section.rows) lines.push(row.cells.map(tableCsvCell).join(TABLE_CSV_SEPARATOR));
  }
  return TABLE_CSV_BOM + lines.join("\r\n") + "\r\n";
}

function tableMarkdownCell(value) {
  return (value == null ? "" : String(value)).split("|").join("\\|").split("\n").join(" ");
}
function toMarkdown(table) {
  const out = [];
  if (table && table.title) out.push("# " + table.title, "");
  if (table && table.room) out.push("**" + tableMarkdownCell(table.room) + "**", "");
  if (table && table.note) out.push("_" + tableMarkdownCell(table.note) + "_", "");
  const header = "| " + table.columns.map(tableMarkdownCell).join(" | ") + " |";
  const divider = "| " + table.columns.map(() => "---").join(" | ") + " |";
  for (const section of tableSections(table)) {
    if (section.title) out.push("## " + tableMarkdownCell(section.title), "");
    out.push(header, divider);
    for (const row of section.rows) out.push("| " + row.cells.map(tableMarkdownCell).join(" | ") + " |");
    out.push("");
  }
  return out.join("\n");
}

// Ячейка буфера — одна строка без табуляций: и перевод строки, и табуляция
// внутри «Расположения» разорвали бы вставку в Таблицы на лишнюю строку
// или на лишнюю колонку.
function tableTsvCell(value) {
  return (value == null ? "" : String(value)).replace(/[\t\r\n]+/g, " ").trim();
}

// Буфер обмена: табуляции вставляются в Google Таблицы колонками.
function toTsv(table) {
  const lines = [table.columns.join("\t")];
  for (const section of tableSections(table)) {
    if (section.title) lines.push(section.title);
    for (const row of section.rows) {
      lines.push(row.cells.map(tableTsvCell).join("\t"));
    }
  }
  return lines.join("\n");
}

// src/exporter.js
// Выгрузка на бумагу и в файлы: PNG схемы, PNG таблицы, zip всех схем, печать.
//
// Схема рисуется тем же `render.drawScheme`, что и холст: во `view` уходит
// `zoom = scale`, поэтому метки и подписи на выгруженной картинке выглядят
// ровно так, как их видел инженер на экране, только в большем разрешении.
// Своего рисования меток здесь нет и быть не должно.
//
// Zip берётся из `projectFile.writeZip` — второй реализации zip в сборке нет.
const EXPORT_SCALES = [1, 2, 4];
// Разрешение печати, по которому пиксели пересчитываются в миллиметры.
const EXPORT_DPI = 300;
// Предел стороны холста в браузерах: за ним toBlob молча отдаёт пустое.
const EXPORT_MAX_SIDE = 16384;
const EXPORT_MM_PER_INCH = 25.4;

// ——— размеры ——————————————————————————————————————————————————————————
function exportSize(width, height, scale) {
  const factor = scale > 0 ? scale : 1;
  const pixelWidth = Math.round(Math.max(1, width) * factor);
  const pixelHeight = Math.round(Math.max(1, height) * factor);
  return {
    width: pixelWidth,
    height: pixelHeight,
    mmWidth: Math.round((pixelWidth / EXPORT_DPI) * EXPORT_MM_PER_INCH),
    mmHeight: Math.round((pixelHeight / EXPORT_DPI) * EXPORT_MM_PER_INCH),
  };
}

// «2560 × 3956 px · 217 × 335 мм при 300 dpi» — чтобы было видно, что
// получится при печати, до того как файл выгружен.
function exportSizeText(width, height, scale) {
  return text("exportPanel.size", exportSize(width, height, scale));
}

// ——— холст ————————————————————————————————————————————————————————————

function exportCanvas(width, height) {
  const side = Math.max(width, height);
  if (side > EXPORT_MAX_SIDE) throw new Error(strings.exportPanel.tooBig);
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(width));
  canvas.height = Math.max(1, Math.round(height));
  return canvas;
}

function exportBlob(canvas) {
  return new Promise((resolve, reject) => {
    if (typeof canvas.toBlob !== "function") {
      reject(new Error(strings.exportPanel.failed));
      return;
    }
    canvas.toBlob((blob) => {
      if (blob) resolve(blob);
      else reject(new Error(strings.exportPanel.failed));
    }, "image/png");
  });
}

// Область выгрузки в пикселях плана: вся схема или прямоугольник, который
// панель сняла с экрана («как вижу»). Прямоугольник обрезается планом —
// белые поля вокруг схемы на бумаге не нужны.
function exportArea(scheme, area) {
  const width = scheme && scheme.width > 0 ? scheme.width : 1000;
  const height = scheme && scheme.height > 0 ? scheme.height : 1000;
  if (!area || area === "all") return { x: 0, y: 0, width, height };
  const x = Math.max(0, Math.min(width, area.x || 0));
  const y = Math.max(0, Math.min(height, area.y || 0));
  return {
    x,
    y,
    width: Math.max(1, Math.min(width - x, area.width || width)),
    height: Math.max(1, Math.min(height - y, area.height || height)),
  };
}

/**
 * PNG схемы с метками. `area` — «all» или прямоугольник в пикселях плана,
 * `scale` — множитель, `legend` — рисовать ли легенду в углу, `outlines` —
 * печатать ли контуры помещений (по умолчанию да, бледной линией), `filter` —
 * тот же фильтр, что на экране: скрытое им не попадает ни в картинку,
 * ни в легенду.
 */
async function schemePng(project, scheme, image, options = {}) {
  const scale = options.scale > 0 ? options.scale : 1;
  const area = exportArea(scheme, options.area);
  const canvas = exportCanvas(area.width * scale, area.height * scale);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const sizes = project && project.view ? project.view : {};
  const view = {
    zoom: scale,
    offsetX: -area.x * scale,
    offsetY: -area.y * scale,
    markSize: sizes.markSize,
    labelSize: sizes.labelSize,
  };
  drawScheme(ctx, {
    project,
    scheme,
    image,
    filter: options.filter || null,
    view,
    legend: options.legend ? { x: 16 * scale, y: 16 * scale } : null,
    // Контуры помещений на бумаге — бледной линией: на листе главное метки,
    // а обводка комнаты подсказывает, где они стоят. Галочка в диалоге её снимает.
    outlines: options.outlines === false ? false : "pale",
  });
  return exportBlob(canvas);
}

// ——— таблица картинкой ————————————————————————————————————————————————

const EXPORT_TABLE = {
  font: 14,
  titleFont: 22,
  roomFont: 17,
  groupFont: 16,
  rowHeight: 26,
  padding: 24,
  gap: 12,
  stripe: 4,
  swatch: 11,
  cellGap: 18,
  maxColumn: 420,
  ink: "#1f2328",
  muted: "#57606a",
  line: "#d0d7de",
};

// Проба для measureText — одна на модуль: при выгрузке 4× замеров десятки,
// и каждый свой <canvas> ничем не лучше одного общего.
let exportProbeCtx = null;

function exportProbe() {
  if (!exportProbeCtx) exportProbeCtx = document.createElement("canvas").getContext("2d");
  return exportProbeCtx;
}

// Прибавка к ячейке, в которой печатается код краски: квадратик плюс зазор.
// Одна на замер ширины и на рисование — иначе колонка мерится по тексту,
// а текст рисуется со сдвигом, и «#1F6FEB» уезжает в многоточие.
function exportSwatchShift(rowColor, cell) {
  return rowColor && String(cell) === rowColor ? EXPORT_TABLE.swatch + 6 : 0;
}

function exportMeasure(ctx, table) {
  const widths = table.columns.map((column) => {
    ctx.font = `600 ${EXPORT_TABLE.font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    return ctx.measureText(String(column)).width;
  });
  ctx.font = `${EXPORT_TABLE.font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
  for (const section of tableSections(table)) {
    for (const row of section.rows) {
      row.cells.forEach((cell, index) => {
        const value = String(cell == null ? "" : cell);
        const width = ctx.measureText(value).width + exportSwatchShift(row.color, value);
        if (width > widths[index]) widths[index] = width;
      });
    }
  }
  return widths.map((width) => Math.min(EXPORT_TABLE.maxColumn, Math.ceil(width) + EXPORT_TABLE.cellGap));
}

function exportClip(ctx, value, limit) {
  const cell = value == null ? "" : String(value);
  if (ctx.measureText(cell).width <= limit) return cell;
  let cut = cell;
  while (cut.length > 1 && ctx.measureText(cut + "…").width > limit) cut = cut.slice(0, -1);
  return cut + "…";
}

// Раскладка таблицы в единицах вёрстки: ширины колонок по самому длинному
// значению, высота — по числу строк и заголовков групп.
function exportTableLayout(table, options = {}) {
  const widths = exportMeasure(exportProbe(), table);
  const sections = tableSections(table);
  const title = options.title || table.title || "";
  const room = options.room != null ? options.room : table.room || "";
  const note = options.note != null ? options.note : table.note || "";
  const subtitle = options.subtitle || "";

  const bodyWidth = widths.reduce((sum, width) => sum + width, 0) + EXPORT_TABLE.stripe + EXPORT_TABLE.gap;
  const width = bodyWidth + EXPORT_TABLE.padding * 2;
  let height = EXPORT_TABLE.padding;
  if (title) height += EXPORT_TABLE.titleFont * 1.6;
  if (room) height += EXPORT_TABLE.roomFont * 1.6;
  if (note) height += EXPORT_TABLE.font * 1.6;
  if (subtitle) height += EXPORT_TABLE.font * 1.6;
  height += EXPORT_TABLE.rowHeight; // строка названий колонок
  for (const section of sections) {
    if (section.title) height += EXPORT_TABLE.rowHeight + EXPORT_TABLE.gap;
    height += section.rows.length * EXPORT_TABLE.rowHeight + EXPORT_TABLE.gap;
  }
  height += EXPORT_TABLE.padding;
  return { width, height, bodyWidth, widths, sections, title, room, note, subtitle };
}

// Размер будущей картинки таблицы — чтобы множитель рядом с кнопкой показывал
// пиксели и миллиметры до того, как файл собран.
function exportTableSizeText(table, scale) {
  const layout = exportTableLayout(table, {});
  return exportSizeText(layout.width, layout.height, scale);
}

/**
 * Таблица картинкой в большом разрешении: заголовок объекта, заголовки групп
 * цветом категории, цветная полоса слева у строк — как на рукописном листе.
 */
async function tablePng(table, options = {}) {
  const scale = options.scale > 0 ? options.scale : 1;
  const layout = exportTableLayout(table, options);
  const { widths, sections, title, room, note, subtitle, bodyWidth } = layout;
  const layoutWidth = layout.width;
  const layoutHeight = layout.height;

  const canvas = exportCanvas(layoutWidth * scale, layoutHeight * scale);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(scale, scale);
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";

  const left = EXPORT_TABLE.padding;
  let y = EXPORT_TABLE.padding;

  if (title) {
    ctx.fillStyle = EXPORT_TABLE.ink;
    ctx.font = `600 ${EXPORT_TABLE.titleFont}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.fillText(title, left, y + EXPORT_TABLE.titleFont * 0.8);
    y += EXPORT_TABLE.titleFont * 1.6;
  }
  // Комната — сразу под именем объекта и тем же весом, что заголовок: лист по
  // одной комнате должен и на бумаге читаться как лист по комнате.
  if (room) {
    ctx.fillStyle = EXPORT_TABLE.ink;
    ctx.font = `600 ${EXPORT_TABLE.roomFont}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.fillText(room, left, y + EXPORT_TABLE.roomFont * 0.8);
    y += EXPORT_TABLE.roomFont * 1.6;
  }
  // Лист, сужённый фильтром, признаётся в этом на бумаге — иначе неполная
  // таблица неотличима от полной.
  if (note) {
    ctx.fillStyle = EXPORT_TABLE.ink;
    ctx.font = `600 ${EXPORT_TABLE.font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.fillText(note, left, y + EXPORT_TABLE.font * 0.8);
    y += EXPORT_TABLE.font * 1.6;
  }
  if (subtitle) {
    ctx.fillStyle = EXPORT_TABLE.muted;
    ctx.font = `${EXPORT_TABLE.font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.fillText(subtitle, left, y + EXPORT_TABLE.font * 0.8);
    y += EXPORT_TABLE.font * 1.6;
  }

  // Ячейка, в которой напечатан код краски («#1F6FEB»), показывает и саму
  // краску: на бумаге монтажнику говорит квадратик, а не шестнадцатеричный код.
  const drawCells = (cells, textLeft, bold, rowColor) => {
    ctx.font = `${bold ? "600 " : ""}${EXPORT_TABLE.font}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
    let x = textLeft;
    cells.forEach((cell, index) => {
      const shift = exportSwatchShift(rowColor, cell);
      if (shift) {
        const ink = ctx.fillStyle;
        ctx.fillStyle = rowColor;
        ctx.fillRect(x, y + (EXPORT_TABLE.rowHeight - EXPORT_TABLE.swatch) / 2, EXPORT_TABLE.swatch, EXPORT_TABLE.swatch);
        ctx.fillStyle = ink;
      }
      const limit = widths[index] - EXPORT_TABLE.cellGap - shift;
      ctx.fillText(exportClip(ctx, cell, limit), x + shift, y + EXPORT_TABLE.rowHeight / 2);
      x += widths[index];
    });
  };

  ctx.fillStyle = EXPORT_TABLE.muted;
  drawCells(table.columns, left + EXPORT_TABLE.stripe + EXPORT_TABLE.gap, true);
  y += EXPORT_TABLE.rowHeight;
  ctx.strokeStyle = EXPORT_TABLE.line;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(left, y);
  ctx.lineTo(left + bodyWidth, y);
  ctx.stroke();

  for (const section of sections) {
    const color = section.color || EXPORT_TABLE.ink;
    if (section.title) {
      y += EXPORT_TABLE.gap;
      ctx.fillStyle = color;
      ctx.font = `600 ${EXPORT_TABLE.groupFont}px system-ui, -apple-system, "Segoe UI", Arial, sans-serif`;
      ctx.fillText(section.title, left, y + EXPORT_TABLE.rowHeight / 2);
      const lineY = y + EXPORT_TABLE.rowHeight - 2;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(left, lineY);
      ctx.lineTo(left + bodyWidth, lineY);
      ctx.stroke();
      y += EXPORT_TABLE.rowHeight;
    }
    for (const row of section.rows) {
      ctx.fillStyle = row.color || section.color || EXPORT_TABLE.line;
      ctx.fillRect(left, y + 4, EXPORT_TABLE.stripe, EXPORT_TABLE.rowHeight - 8);
      ctx.fillStyle = EXPORT_TABLE.ink;
      drawCells(row.cells, left + EXPORT_TABLE.stripe + EXPORT_TABLE.gap, false, row.color);
      y += EXPORT_TABLE.rowHeight;
    }
    y += EXPORT_TABLE.gap;
  }

  return exportBlob(canvas);
}

// ——— все схемы разом ——————————————————————————————————————————————————

// Картинка для рисования: Blob декодируется, готовый ImageBitmap или <img>
// берётся как есть.
async function exportImageOf(source) {
  if (!source) return null;
  if (typeof Blob !== "undefined" && source instanceof Blob) {
    if (typeof createImageBitmap === "function") return createImageBitmap(source);
    return null;
  }
  return source;
}

// Хвост «-ГГГГ-ММ-ДД.zip», который ставит projectFileName.
const EXPORT_DATED_TAIL = /-\d{4}-\d{2}-\d{2}\.zip$/;

/**
 * Имя файла с датой во всей сборке собирает `projectFile.projectFileName`:
 * там же чистятся запрещённые символы и обрезается длина. Здесь у готового
 * имени меняется расширение, а к имени объекта приписывается то, что отличит
 * выгрузку: `part` — схема или слово-пометка («схемы»).
 *
 * Без такой пометки архив схем назывался бы «<Объект>-<дата>.zip» — ровно тем
 * же именем, что и файл проекта, и в папке загрузок один молча затирал бы
 * другой. Файл проекта открывается назад в сервисе, архив схем — картинки
 * монтажнику, и по имени это должно быть видно сразу.
 */
function exportFileName(project, part, extension) {
  const base = (project && project.name) || "";
  const suffix = typeof part === "string" ? part : part ? part.name : "";
  return projectFileName({ name: suffix ? base + " — " + suffix : base }).replace(/zip$/, extension);
}

// Имя записи внутри архива: та же чистка, но без даты — дата стоит на самом архиве.
function exportEntryName(value) {
  return projectFileName({ name: value }).replace(EXPORT_DATED_TAIL, "");
}

/**
 * Zip с картинками всех схем объекта. `images` — Map «imageId → Blob»
 * (или ImageBitmap). Zip пишется общим `writeZip`: PNG уже сжат, поэтому
 * хранится как есть.
 */
async function allSchemesZip(project, images, options = {}) {
  // Форма входа одна — Map «imageId → Blob», как у packProject: разбирать
  // четыре формы одного и того же было бы вторым правилом на тот же вход.
  if (images != null && !(images instanceof Map)) throw new Error(strings.errors.imagesNotMap);
  const map = images || new Map();
  const schemes = schemesInOrder(project);
  const files = [];
  const onProgress = typeof options.onProgress === "function" ? options.onProgress : null;
  for (let index = 0; index < schemes.length; index += 1) {
    const scheme = schemes[index];
    const image = await exportImageOf(map.get(scheme.imageId));
    const blob = await schemePng(project, scheme, image, { ...options, area: "all" });
    const name = String(index + 1).padStart(2, "0") + "-" + exportEntryName(scheme.name) + ".png";
    files.push({ name, data: blob, compress: false });
    if (onProgress) onProgress({ done: index + 1, total: schemes.length, name });
  }
  return writeZip(files, { compress: false });
}

// ——— печать ———————————————————————————————————————————————————————————

function exportNode(tag, className, textValue) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (textValue != null) node.textContent = String(textValue);
  return node;
}

/**
 * Готовая раскладка таблицы: заголовок объекта, заголовки групп цветом
 * категории, колонки шапкой. Один и тот же узел идёт и в предпросмотр
 * диалога, и в печать — печатается ровно то, что видно.
 */
function exportTableNode(table, options = {}) {
  const doc = exportNode("div", "print-doc");
  const head = exportNode("header", "print-doc__head");
  head.append(exportNode("h1", "print-doc__title", options.title || table.title || ""));
  const room = options.room != null ? options.room : table.room || "";
  if (room) head.append(exportNode("p", "print-doc__room", room));
  const note = options.note != null ? options.note : table.note || "";
  if (note) head.append(exportNode("p", "print-doc__note", note));
  const subtitle = options.subtitle || text("exportPanel.rows", { count: tableRowCount(table) });
  head.append(exportNode("p", "print-doc__sub", subtitle));
  doc.append(head);

  for (const section of tableSections(table)) {
    const block = exportNode("section", "print-doc__group");
    if (section.color) block.style.setProperty("--print-color", section.color);
    if (section.title) block.append(exportNode("h2", "print-doc__group-title", section.title));
    const tableNode = exportNode("table", "print-doc__table");
    const thead = exportNode("thead");
    const headRow = exportNode("tr");
    for (const column of table.columns) headRow.append(exportNode("th", null, column));
    thead.append(headRow);
    tableNode.append(thead);
    const tbody = exportNode("tbody");
    for (const row of section.rows) {
      const tr = exportNode("tr", "print-doc__row");
      if (row.color) tr.style.setProperty("--print-row-color", row.color);
      row.cells.forEach((cell, index) => {
        const td = exportNode("td", index === 0 ? "print-doc__label" : null, cell);
        if (row.color && String(cell) === row.color) {
          const swatch = exportNode("span", "print-doc__swatch");
          swatch.style.background = row.color;
          td.prepend(swatch);
        }
        tr.append(td);
      });
      tbody.append(tr);
    }
    tableNode.append(tbody);
    block.append(tableNode);
    doc.append(block);
  }

  if (options.extra) doc.append(options.extra);
  if (options.footer) doc.append(exportNode("footer", "print-doc__foot", options.footer));
  return doc;
}

function exportPrintRoot() {
  let root = document.getElementById("print-root");
  if (!root) {
    root = exportNode("div", null);
    root.id = "print-root";
    document.body.append(root);
  }
  return root;
}

function exportPrintRun(root) {
  document.body.classList.add("printing");
  const restore = () => document.body.classList.remove("printing");
  const cleanup = () => {
    restore();
    root.replaceChildren();
    window.removeEventListener("afterprint", cleanup);
  };
  window.addEventListener("afterprint", cleanup);
  window.print();
  // Раскладку убирает только afterprint: в Safari window.print() не держит
  // поток, и уборка по таймеру вычистила бы лист из-под открытого диалога
  // печати — на бумагу ушла бы пустая страница. Таймер возвращает экран,
  // содержимое #print-root ждёт следующей печати (на экране оно скрыто).
  setTimeout(restore, 2000);
}

/**
 * Печать без второго окна: раскладка кладётся в #print-root, экран прячется
 * правилами print.css. `kind` — «table» (данные: `{table, title, subtitle,
 * extra}`) или «scheme» (данные: `{blob, title}`).
 */
async function printView(kind, data = {}) {
  const root = exportPrintRoot();
  if (kind === "scheme") {
    const url = URL.createObjectURL(data.blob);
    const wrap = exportNode("div", "print-doc print-doc--scheme");
    if (data.title) wrap.append(exportNode("h1", "print-doc__title", data.title));
    const image = document.createElement("img");
    image.className = "print-doc__image";
    image.src = url;
    wrap.append(image);
    root.replaceChildren(wrap);
    await new Promise((resolve) => {
      image.addEventListener("load", resolve, { once: true });
      image.addEventListener("error", resolve, { once: true });
    });
    exportPrintRun(root);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return;
  }
  root.replaceChildren(
    exportTableNode(data.table, {
      title: data.title,
      subtitle: data.subtitle,
      extra: data.extra,
      footer: data.footer,
    }),
  );
  exportPrintRun(root);
}

// ——— скачивание ———————————————————————————————————————————————————————
function exportDownload(blob, name) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportText(value, name, type) {
  exportDownload(new Blob([value], { type: type || "text/plain;charset=utf-8" }), name);
}

// Буфер обмена доступен не везде (file:// без разрешения) — запасной путь
// через скрытое поле, иначе кнопка «Копировать» молча ничего не делает.
async function exportCopy(value) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(value);
      return true;
    } catch (error) {
      // падаем в запасной путь ниже
    }
  }
  const area = document.createElement("textarea");
  area.value = value;
  area.setAttribute("readonly", "readonly");
  area.style.position = "fixed";
  area.style.opacity = "0";
  document.body.append(area);
  area.select();
  let ok = false;
  try {
    ok = document.execCommand("copy");
  } catch (error) {
    ok = false;
  }
  area.remove();
  return ok;
}

// src/imagePrep.js
// Подготовка плана: проверка файла, поворот на четверть оборота и обрезка рамкой.
// Координаты меток — доли от размера плана, поэтому вместе с картинкой нужно
// пересчитать и доли: метка обязана остаться на том же месте изображения.
// Арифметика здесь чистая (проверяется тестами), браузерные части — ниже.
const PLAN_IMAGE_TYPES = ["image/png", "image/jpeg"];
const PLAN_IMAGE_EXTENSIONS = [".png", ".jpg", ".jpeg"];
const ROTATION_STEPS = [0, 90, 180, 270];

// Тип у перетащенного файла иногда пустой — тогда решает расширение.
function isPlanImageFile(file) {
  if (!file) return false;
  const type = String(file.type || "").toLowerCase();
  if (PLAN_IMAGE_TYPES.includes(type)) return true;
  if (type && type !== "application/octet-stream") return false;
  const name = String(file.name || "").toLowerCase();
  return PLAN_IMAGE_EXTENSIONS.some((extension) => name.endsWith(extension));
}

// Тип берётся из расширения, когда браузер его не назвал: у перетащенного
// файла type часто пуст, и JPEG иначе уехал бы в хранилище и в zip как png.
function planTypeOf(file) {
  const type = String((file && file.type) || "").toLowerCase();
  if (PLAN_IMAGE_TYPES.includes(type)) return type;
  const name = String((file && file.name) || "").toLowerCase();
  if (name.endsWith(".jpg") || name.endsWith(".jpeg")) return "image/jpeg";
  return "image/png";
}

// Пропорция плана. Замена подложки на картинку другой пропорции сдвигает всю
// разметку относительно плана: доли остаются прежними, а содержимое картинки
// растянуто иначе. Допуск закрывает округление пикселей при экспорте плана.
function planAspect(size) {
  const width = Number(size && size.width);
  const height = Number(size && size.height);
  return width > 0 && height > 0 ? width / height : 0;
}
function sameAspect(before, after, tolerance = 0.01) {
  const first = planAspect(before);
  const second = planAspect(after);
  if (!first || !second) return true;
  return Math.abs(first - second) / Math.max(first, second) <= tolerance;
}
function identityTransform() {
  return { rotate: 0, crop: null };
}

function clampUnit(value, fallback) {
  const number = Number(value);
  if (!Number.isFinite(number)) return fallback;
  return Math.min(1, Math.max(0, number));
}

// Поворот приводится к четверти оборота, рамка — к прямоугольнику внутри плана.
function normalizeTransform(transform) {
  const source = transform || {};
  const turns = Math.round(Number(source.rotate || 0) / 90);
  const rotate = ((turns % 4) + 4) % 4 * 90;
  const raw = source.crop;
  if (!raw) return { rotate, crop: null };
  const x = clampUnit(raw.x, 0);
  const y = clampUnit(raw.y, 0);
  const width = Math.min(clampUnit(raw.width, 1), 1 - x);
  const height = Math.min(clampUnit(raw.height, 1), 1 - y);
  if (width <= 0 || height <= 0) return { rotate, crop: null };
  if (x === 0 && y === 0 && width === 1 && height === 1) return { rotate, crop: null };
  return { rotate, crop: { x, y, width, height } };
}

// Доли в системе повёрнутого плана: вправо (x,y) -> (1−y, x), влево -> (y, 1−x).
function rotateFraction(point, rotate) {
  if (rotate === 90) return { x: 1 - point.y, y: point.x };
  if (rotate === 180) return { x: 1 - point.x, y: 1 - point.y };
  if (rotate === 270) return { x: point.y, y: 1 - point.x };
  return { x: point.x, y: point.y };
}

// Поворот и обрезка копятся в одно преобразование: (поворот на R, затем рамка
// в долях повёрнутого плана). Так исходник пережимается один раз, а метки
// пересчитываются одним шагом — и считаются один раз, а не на каждом шаге.
function rotateTransform(transform, degrees) {
  const current = normalizeTransform(transform);
  const turns = ((Math.round(Number(degrees || 0) / 90) % 4) + 4) % 4;
  const rotate = (current.rotate + turns * 90) % 360;
  if (!current.crop) return { rotate, crop: null };
  const a = rotateFraction({ x: current.crop.x, y: current.crop.y }, turns * 90);
  const b = rotateFraction(
    { x: current.crop.x + current.crop.width, y: current.crop.y + current.crop.height },
    turns * 90,
  );
  return {
    rotate,
    crop: {
      x: Math.min(a.x, b.x),
      y: Math.min(a.y, b.y),
      width: Math.abs(a.x - b.x),
      height: Math.abs(a.y - b.y),
    },
  };
}

// Рамка задаётся в долях того, что видно сейчас, — то есть внутри прежней рамки.
function cropTransform(transform, frame) {
  const current = normalizeTransform(transform);
  const box = normalizeTransform({ crop: frame }).crop;
  if (!box) return current;
  const base = current.crop || { x: 0, y: 0, width: 1, height: 1 };
  return normalizeTransform({
    rotate: current.rotate,
    crop: {
      x: base.x + box.x * base.width,
      y: base.y + box.y * base.height,
      width: box.width * base.width,
      height: box.height * base.height,
    },
  });
}
function transformPoint(point, transform) {
  const { rotate, crop } = normalizeTransform(transform);
  const turned = rotateFraction({ x: Number(point.x), y: Number(point.y) }, rotate);
  if (!crop) return turned;
  return { x: (turned.x - crop.x) / crop.width, y: (turned.y - crop.y) / crop.height };
}

// Смещение подписи задано в пикселях экрана: обрезка его не трогает, поворот —
// поворачивает так же, как саму картинку, иначе подпись уедет на другую сторону.
function transformOffset(offset, transform) {
  if (!offset) return offset;
  const { rotate } = normalizeTransform(transform);
  const dx = Number(offset.dx) || 0;
  const dy = Number(offset.dy) || 0;
  if (rotate === 90) return { dx: -dy, dy: dx };
  if (rotate === 180) return { dx: -dx, dy: -dy };
  if (rotate === 270) return { dx: dy, dy: -dx };
  return { dx, dy };
}

// Ничего не менялось — значит и переписывать план незачем.
function isIdentityTransform(transform) {
  const settings = normalizeTransform(transform);
  return settings.rotate === 0 && !settings.crop;
}
function transformSize(size, transform) {
  const { rotate, crop } = normalizeTransform(transform);
  const turned =
    rotate === 90 || rotate === 270
      ? { width: Number(size.height), height: Number(size.width) }
      : { width: Number(size.width), height: Number(size.height) };
  if (!crop) return { width: Math.round(turned.width), height: Math.round(turned.height) };
  return {
    width: Math.max(1, Math.round(turned.width * crop.width)),
    height: Math.max(1, Math.round(turned.height * crop.height)),
  };
}

// Пересчёт всех точек одной метки: используется панелью схем перед updateMark.
function transformMarkPoints(points, transform) {
  return (points || []).map((point) => {
    const next = transformPoint(point, transform);
    return { x: Math.min(1, Math.max(0, next.x)), y: Math.min(1, Math.max(0, next.y)) };
  });
}
