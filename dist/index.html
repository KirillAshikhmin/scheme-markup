<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-text="app.title"></title>
    <style>
/* Кнопки, поля, диалоги и списки панелей. Тёмная панель — светлый холст. */

.ui-btn {
  font: inherit;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--panel-line);
  background: #21262d;
  color: var(--panel-text);
  cursor: pointer;
  white-space: nowrap;
}

.ui-btn:hover:not(:disabled) {
  border-color: var(--panel-muted);
}

.ui-btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.ui-btn--accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.ui-btn--danger:hover:not(:disabled) {
  border-color: var(--danger);
  color: #ff9aa2;
}

.ui-btn--wide {
  display: block;
  width: 100%;
  padding: 7px 8px;
  margin-bottom: 10px;
}

.ui-select,
.ui-input {
  font: inherit;
  padding: 4px 6px;
  border-radius: 6px;
  border: 1px solid var(--panel-line);
  background: #21262d;
  color: var(--panel-text);
  max-width: 220px;
}

.ui-input {
  width: 100%;
  max-width: none;
}

#project-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ——— диалоги ——————————————————————————————————————————————————————— */

.modal {
  width: min(92vw, 720px);
  max-height: 90vh;
  overflow: auto;
  padding: 16px 18px;
  border-radius: 10px;
  border: 1px solid var(--panel-line);
  background: var(--panel-bg);
  color: var(--panel-text);
  box-shadow: 0 24px 64px rgba(1, 4, 9, 0.6);
}

.modal__title {
  margin: 0 0 10px;
  font-size: 15px;
}

.modal__text {
  margin: 0;
  color: var(--panel-text);
}

.modal__hint {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--panel-muted);
}

.modal__actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 14px;
}

/* ——— правка плана ——————————————————————————————————————————————————— */

.plan-editor__tools {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

.plan-stage {
  position: relative;
  display: flex;
  justify-content: center;
  background: var(--panel-bg-deep);
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  padding: 8px;
  user-select: none;
  touch-action: none;
}

.plan-stage__img {
  max-width: 100%;
  max-height: 58vh;
  display: block;
  cursor: crosshair;
}

.plan-frame {
  position: absolute;
  border: 1px dashed var(--accent);
  background: rgba(31, 111, 235, 0.18);
  pointer-events: none;
}

/* ——— список схем ————————————————————————————————————————————————————— */

.scheme-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.scheme-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 2px 6px;
  padding: 5px 6px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: #1c2129;
}

.scheme-row--current {
  border-color: var(--accent);
}

.scheme-row__name {
  font: inherit;
  text-align: left;
  padding: 0;
  border: 0;
  background: none;
  color: var(--panel-text);
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.scheme-row__meta {
  grid-column: 1;
  font-size: 11px;
  color: var(--panel-muted);
}

.scheme-row__tools {
  grid-column: 2;
  grid-row: 1 / span 2;
  display: flex;
  gap: 2px;
}

.scheme-row__tools .ui-btn {
  padding: 2px 5px;
  font-size: 12px;
}

#canvas-area.is-dropping::after {
  content: attr(data-drop);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #0b4ea2;
  font-weight: 600;
  position: absolute;
  inset: 8px;
  border: 2px dashed var(--accent);
  border-radius: 10px;
  background: rgba(31, 111, 235, 0.08);
  pointer-events: none;
  z-index: 5;
}

:root {
  --panel-bg: #161b22;
  --panel-bg-deep: #0d1117;
  --panel-line: #30363d;
  --panel-text: #e6edf3;
  --panel-muted: #8b949e;
  --canvas-bg: #f6f8fa;
  --canvas-line: #d0d7de;
  --canvas-text: #1f2328;
  --accent: #1f6feb;
  --danger: #d1242f;
  --ok: #2da44e;
  --panel-width: 264px;
  --header-height: 48px;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--canvas-text);
  background: var(--panel-bg-deep);
  overflow: hidden;
}

#app {
  display: grid;
  grid-template-columns: var(--panel-width) 1fr var(--panel-width);
  grid-template-rows: var(--header-height) 1fr;
  grid-template-areas:
    "header header header"
    "left canvas right";
  height: 100vh;
}

#app-header {
  grid-area: header;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 12px;
  background: var(--panel-bg-deep);
  border-bottom: 1px solid var(--panel-line);
  color: var(--panel-text);
}

#app-brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  white-space: nowrap;
}

#app-title {
  font-weight: 600;
}

#app-subtitle,
#project-label {
  color: var(--panel-muted);
  font-size: 12px;
}

#project-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

#project-name {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 40vw;
}

#header-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel {
  background: var(--panel-bg);
  color: var(--panel-text);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

#panel-left {
  grid-area: left;
  border-right: 1px solid var(--panel-line);
}

#panel-right {
  grid-area: right;
  border-left: 1px solid var(--panel-line);
}

.panel__section {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-bottom: 1px solid var(--panel-line);
}

.panel__section--grow {
  flex: 1 1 auto;
}

.panel__title {
  margin: 0;
  padding: 10px 12px 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--panel-muted);
}

.panel__body {
  padding: 0 12px 12px;
  overflow: auto;
  min-height: 0;
}

#canvas-area {
  grid-area: canvas;
  position: relative;
  background: var(--canvas-bg);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#canvas-host,
#canvas-overlay {
  position: absolute;
  inset: 0;
}

#canvas-overlay {
  pointer-events: none;
}

#canvas-empty {
  position: relative;
  max-width: 280px;
  padding: 16px 20px;
  border: 1px dashed var(--canvas-line);
  border-radius: 8px;
  color: #57606a;
  background: #fff;
  text-align: center;
}

#app.has-scheme #canvas-empty {
  display: none;
}

#dialog-host:empty {
  display: none;
}

#dialog-host {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(1, 4, 9, 0.55);
}

#notifications {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 360px;
}

.toast {
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid var(--panel-line);
  background: var(--panel-bg);
  color: var(--panel-text);
  box-shadow: 0 8px 24px rgba(1, 4, 9, 0.4);
}

.toast--error {
  border-color: var(--danger);
}

.toast--success {
  border-color: var(--ok);
}

.panel__empty {
  color: var(--panel-muted);
  font-size: 12px;
  margin: 4px 0 0;
}

    </style>
</head>

    <div id="app">
      <header id="app-header">
        <div id="app-brand">
          <span id="app-title" data-text="app.title"></span>
          <span id="app-subtitle" data-text="app.subtitle"></span>
        </div>
        <div id="project-bar">
          <span id="project-label" data-text="header.project"></span>
          <span id="project-name" data-text="header.noProject"></span>
          <div id="project-actions" class="mount"></div>
        </div>
        <div id="header-actions" class="mount"></div>
      </header>

      <aside id="panel-left" class="panel">
        <section class="panel__section">
          <h2 class="panel__title" data-text="panels.tools"></h2>
          <div id="panel-tools" class="panel__body mount"></div>
        </section>
        <section class="panel__section panel__section--grow">
          <h2 class="panel__title" data-text="panels.schemes"></h2>
          <div id="panel-schemes" class="panel__body mount"></div>
        </section>
      </aside>

      <main id="canvas-area">
        <div id="canvas-host" class="mount"></div>
        <div id="canvas-overlay" class="mount"></div>
        <p id="canvas-empty" data-text="panels.canvasEmpty"></p>
      </main>

      <aside id="panel-right" class="panel">
        <section class="panel__section panel__section--grow">
          <h2 class="panel__title" data-text="panels.marks"></h2>
          <div id="panel-marks" class="panel__body mount"></div>
        </section>
        <section class="panel__section">
          <h2 class="panel__title" data-text="panels.properties"></h2>
          <div id="panel-properties" class="panel__body mount"></div>
        </section>
      </aside>

      <div id="dialog-host" class="mount"></div>
      <div id="notifications"></div>
    </div>
    <script>
(function () {
// src/imagePrep.js
// Подготовка плана: проверка файла, поворот на четверть оборота и обрезка рамкой.
// Координаты меток — доли от размера плана, поэтому вместе с картинкой нужно
// пересчитать и доли: метка обязана остаться на том же месте изображения.
// Арифметика здесь чистая (проверяется тестами), браузерные части — ниже.
const PLAN_IMAGE_TYPES = ["image/png", "image/jpeg"];
const PLAN_IMAGE_EXTENSIONS = [".png", ".jpg", ".jpeg"];
const ROTATION_STEPS = [0, 90, 180, 270];

// Тип у перетащенного файла иногда пустой — тогда решает расширение.
function isPlanImageFile(file) {
  if (!file) return false;
  const type = String(file.type || "").toLowerCase();
  if (PLAN_IMAGE_TYPES.includes(type)) return true;
  if (type && type !== "application/octet-stream") return false;
  const name = String(file.name || "").toLowerCase();
  return PLAN_IMAGE_EXTENSIONS.some((extension) => name.endsWith(extension));
}

// Тип берётся из расширения, когда браузер его не назвал: у перетащенного
// файла type часто пуст, и JPEG иначе уехал бы в хранилище и в zip как png.
function planTypeOf(file) {
  const type = String((file && file.type) || "").toLowerCase();
  if (PLAN_IMAGE_TYPES.includes(type)) return type;
  const name = String((file && file.name) || "").toLowerCase();
  if (name.endsWith(".jpg") || name.endsWith(".jpeg")) return "image/jpeg";
  return "image/png";
}
function identityTransform() {
  return { rotate: 0, crop: null };
}

function clampUnit(value, fallback) {
  const number = Number(value);
  if (!Number.isFinite(number)) return fallback;
  return Math.min(1, Math.max(0, number));
}

// Поворот приводится к четверти оборота, рамка — к прямоугольнику внутри плана.
function normalizeTransform(transform) {
  const source = transform || {};
  const turns = Math.round(Number(source.rotate || 0) / 90);
  const rotate = ((turns % 4) + 4) % 4 * 90;
  const raw = source.crop;
  if (!raw) return { rotate, crop: null };
  const x = clampUnit(raw.x, 0);
  const y = clampUnit(raw.y, 0);
  const width = Math.min(clampUnit(raw.width, 1), 1 - x);
  const height = Math.min(clampUnit(raw.height, 1), 1 - y);
  if (width <= 0 || height <= 0) return { rotate, crop: null };
  if (x === 0 && y === 0 && width === 1 && height === 1) return { rotate, crop: null };
  return { rotate, crop: { x, y, width, height } };
}

// Доли в системе повёрнутого плана: вправо (x,y) -> (1−y, x), влево -> (y, 1−x).
function rotateFraction(point, rotate) {
  if (rotate === 90) return { x: 1 - point.y, y: point.x };
  if (rotate === 180) return { x: 1 - point.x, y: 1 - point.y };
  if (rotate === 270) return { x: point.y, y: 1 - point.x };
  return { x: point.x, y: point.y };
}

// Поворот и обрезка копятся в одно преобразование: (поворот на R, затем рамка
// в долях повёрнутого плана). Так исходник пережимается один раз, а метки
// пересчитываются одним шагом — и считаются один раз, а не на каждом шаге.
function rotateTransform(transform, degrees) {
  const current = normalizeTransform(transform);
  const turns = ((Math.round(Number(degrees || 0) / 90) % 4) + 4) % 4;
  const rotate = (current.rotate + turns * 90) % 360;
  if (!current.crop) return { rotate, crop: null };
  const a = rotateFraction({ x: current.crop.x, y: current.crop.y }, turns * 90);
  const b = rotateFraction(
    { x: current.crop.x + current.crop.width, y: current.crop.y + current.crop.height },
    turns * 90,
  );
  return {
    rotate,
    crop: {
      x: Math.min(a.x, b.x),
      y: Math.min(a.y, b.y),
      width: Math.abs(a.x - b.x),
      height: Math.abs(a.y - b.y),
    },
  };
}

// Рамка задаётся в долях того, что видно сейчас, — то есть внутри прежней рамки.
function cropTransform(transform, frame) {
  const current = normalizeTransform(transform);
  const box = normalizeTransform({ crop: frame }).crop;
  if (!box) return current;
  const base = current.crop || { x: 0, y: 0, width: 1, height: 1 };
  return normalizeTransform({
    rotate: current.rotate,
    crop: {
      x: base.x + box.x * base.width,
      y: base.y + box.y * base.height,
      width: box.width * base.width,
      height: box.height * base.height,
    },
  });
}
function transformPoint(point, transform) {
  const { rotate, crop } = normalizeTransform(transform);
  const turned = rotateFraction({ x: Number(point.x), y: Number(point.y) }, rotate);
  if (!crop) return turned;
  return { x: (turned.x - crop.x) / crop.width, y: (turned.y - crop.y) / crop.height };
}

// Смещение подписи задано в пикселях экрана: обрезка его не трогает, поворот —
// поворачивает так же, как саму картинку, иначе подпись уедет на другую сторону.
function transformOffset(offset, transform) {
  if (!offset) return offset;
  const { rotate } = normalizeTransform(transform);
  const dx = Number(offset.dx) || 0;
  const dy = Number(offset.dy) || 0;
  if (rotate === 90) return { dx: -dy, dy: dx };
  if (rotate === 180) return { dx: -dx, dy: -dy };
  if (rotate === 270) return { dx: dy, dy: -dx };
  return { dx, dy };
}

// Ничего не менялось — значит и переписывать план незачем.
function isIdentityTransform(transform) {
  const settings = normalizeTransform(transform);
  return settings.rotate === 0 && !settings.crop;
}
function transformSize(size, transform) {
  const { rotate, crop } = normalizeTransform(transform);
  const turned =
    rotate === 90 || rotate === 270
      ? { width: Number(size.height), height: Number(size.width) }
      : { width: Number(size.width), height: Number(size.height) };
  if (!crop) return { width: Math.round(turned.width), height: Math.round(turned.height) };
  return {
    width: Math.max(1, Math.round(turned.width * crop.width)),
    height: Math.max(1, Math.round(turned.height * crop.height)),
  };
}

// Пересчёт всех точек одной метки: используется панелью схем перед updateMark.
function transformMarkPoints(points, transform) {
  return (points || []).map((point) => {
    const next = transformPoint(point, transform);
    return { x: Math.min(1, Math.max(0, next.x)), y: Math.min(1, Math.max(0, next.y)) };
  });
}

// Метка за рамкой обрезки была бы потеряна: считаем такие, чтобы предупредить.
function countPointsOutside(points, transform) {
  let outside = 0;
  for (const point of points || []) {
    const next = transformPoint(point, transform);
    if (next.x < 0 || next.x > 1 || next.y < 0 || next.y > 1) outside += 1;
  }
  return outside;
}

// ——— браузерная часть ————————————————————————————————————————————————

function planOutputType(blob) {
  return planTypeOf(blob);
}

// createImageBitmap есть не везде (и не всегда по file://) — запасной путь <img>.
async function decodePlanImage(blob) {
  const url = URL.createObjectURL(blob);
  try {
    if (typeof createImageBitmap === "function") {
      const bitmap = await createImageBitmap(blob);
      return { image: bitmap, width: bitmap.width, height: bitmap.height, url };
    }
    const image = await new Promise((resolve, reject) => {
      const element = new Image();
      element.onload = () => resolve(element);
      element.onerror = () => reject(new Error("decode"));
      element.src = url;
    });
    return { image, width: image.naturalWidth, height: image.naturalHeight, url };
  } catch (error) {
    URL.revokeObjectURL(url);
    throw error;
  }
}
function releasePlanImage(decoded) {
  if (!decoded) return;
  if (decoded.url) URL.revokeObjectURL(decoded.url);
  if (decoded.image && typeof decoded.image.close === "function") decoded.image.close();
}

// Файл плана: проверка типа и настоящий размер картинки в пикселях.
async function readPlanImage(file) {
  const blob = file.slice ? file.slice(0, file.size, planTypeOf(file)) : file;
  const decoded = await decodePlanImage(blob);
  const size = { width: decoded.width, height: decoded.height };
  releasePlanImage(decoded);
  return { blob, width: size.width, height: size.height };
}

function blobFromCanvas(canvas, type) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(
      (blob) => (blob ? resolve(blob) : reject(new Error("toBlob"))),
      type,
      type === "image/jpeg" ? 0.92 : undefined,
    );
  });
}

// Новая картинка плана по тому же преобразованию, что и доли меток.
async function renderPlanImage(blob, transform) {
  const settings = normalizeTransform(transform);
  const decoded = await decodePlanImage(blob);
  try {
    const turned = transformSize({ width: decoded.width, height: decoded.height }, { rotate: settings.rotate });
    const size = transformSize({ width: decoded.width, height: decoded.height }, settings);
    const canvas = document.createElement("canvas");
    canvas.width = size.width;
    canvas.height = size.height;
    const ctx = canvas.getContext("2d");
    if (settings.crop) {
      ctx.translate(-Math.round(turned.width * settings.crop.x), -Math.round(turned.height * settings.crop.y));
    }
    if (settings.rotate === 90) {
      ctx.translate(turned.width, 0);
      ctx.rotate(Math.PI / 2);
    } else if (settings.rotate === 180) {
      ctx.translate(turned.width, turned.height);
      ctx.rotate(Math.PI);
    } else if (settings.rotate === 270) {
      ctx.translate(0, turned.height);
      ctx.rotate(-Math.PI / 2);
    }
    ctx.drawImage(decoded.image, 0, 0);
    const out = await blobFromCanvas(canvas, planOutputType(blob));
    return { blob: out, width: size.width, height: size.height };
  } finally {
    releasePlanImage(decoded);
  }
}

// src/strings.js
// Единственный словарь видимых строк. В остальных файлах русских текстов нет.
const strings = {

    backlight: "Подсветка",
    strip: "Лента",
    wardrobeLight: "Подсветка шкафа",
    switch: "Выключатель",
    switchDouble: "Выключатель двойной",

  },
  shapes: {

    "circle-cross": "Круг с крестом",
    square: "Квадрат",
    triangle: "Треугольник",

// strings.errors.codeTaken и подобные — шаблоны с {переменными}.
function text(key, vars) {
  let value = key.split(".").reduce((node, part) => (node == null ? node : node[part]), strings);
  if (typeof value !== "string") return key;
  if (vars) {
    for (const [name, replacement] of Object.entries(vars)) {
      value = value.split("{" + name + "}").join(String(replacement));
    }
  }
  return value;
}

// src/model.js
// Правила объекта: справочники, метки, группы, нумерация.
// Чистый модуль: ни DOM, ни хранилища. Все функции возвращают новый объект,
// исходный не меняется.
const FORMAT_VERSION = 1;
const SHAPE_NAMES = ["circle", "circle-cross", "square", "triangle", "star", "diamond", "hexagon"];
const BLOCK_MODES = ["each", "single"];
const MARK_KINDS = ["point", "line"];

// Шаг соседней точки блока в пикселях плана (доля считается от размера схемы).
const BLOCK_STEP_PX = 28;
// Размер плана, по которому считается шаг, пока схема не знает своих пикселей.
const BLOCK_FALLBACK_SIZE_PX = 1000;
// Цвет метки, когда категория недоступна.
const FALLBACK_COLOR = "#8B949E";
const BLOCK_SIDES = ["left", "right", "up", "down"];

const DEFAULT_VIEW = { markSize: 10, labelSize: 12 };

const TEMPLATE_CATEGORIES = [
  { key: "light", name: strings.categories.light, color: "#1F6FEB", shape: "circle-cross" },
  { key: "switches", name: strings.categories.switches, color: "#2DA44E", shape: "circle" },
  { key: "sockets", name: strings.categories.sockets, color: "#D1242F", shape: "square" },
  { key: "climate", name: strings.categories.climate, color: "#E36209", shape: "triangle" },
  { key: "network", name: strings.categories.network, color: "#8250DF", shape: "star" },
];

const TEMPLATE_TYPES = [
  { category: "light", code: "Т", name: strings.types.spot },
  { category: "light", code: "С", name: strings.types.lamp },
  { category: "light", code: "ПК", name: strings.types.bedLight },
  { category: "light", code: "ТР", name: strings.types.track },
  { category: "light", code: "П", name: strings.types.backlight },
  { category: "light", code: "Л", name: strings.types.strip },
  { category: "light", code: "ПШ", name: strings.types.wardrobeLight },
  { category: "switches", code: "В", name: strings.types.switch },
  { category: "switches", code: "ВВ", name: strings.types.switchDouble },
  { category: "sockets", code: "Р", name: strings.types.socket },
  { category: "climate", code: "Б", name: strings.types.breezer },
  { category: "climate", code: "К", name: strings.types.conditioner },
  { category: "network", code: "W", name: strings.types.wifi },
];

function newId() {
  return globalThis.crypto.randomUUID();
}

function nowIso() {
  return new Date().toISOString();
}

function modelError(key, vars) {
  const error = new Error(text("errors." + key, vars));
  error.code = key;
  return error;
}

function clone(value) {
  return value == null ? value : structuredClone(value);
}

// Новый объект проекта с обновлённым updatedAt; списки подменяются поштучно.
function withProject(project, patch) {
  return { ...project, ...patch, updatedAt: nowIso() };
}
function defaultTemplate() {
  // Идентификаторы новые на каждый вызов: два объекта не делят ни категорию, ни тип.
  const categoryIds = new Map(TEMPLATE_CATEGORIES.map((category) => [category.key, newId()]));
  const categories = TEMPLATE_CATEGORIES.map((category, index) => ({
    id: categoryIds.get(category.key),
    name: category.name,
    color: category.color,
    shape: category.shape,
    order: index,
  }));
  const markTypes = TEMPLATE_TYPES.map((type, index) => ({
    id: newId(),
    categoryId: categoryIds.get(type.category),
    code: type.code,
    name: type.name,
    shape: null,
    blockMode: "each",
    order: index,
  }));
  return { categories, markTypes };
}
function createProject(template) {
  const source = template && template.categories && template.markTypes ? clone(template) : defaultTemplate();
  const stamp = nowIso();
  return {
    formatVersion: FORMAT_VERSION,
    id: newId(),
    name: (template && template.name) || strings.project.untitled,
    createdAt: stamp,
    updatedAt: stamp,
    categories: source.categories.map((category, index) => ({ ...category, order: index })),
    markTypes: source.markTypes.map((type, index) => ({
      shape: null,
      blockMode: "each",
      ...type,
      order: index,
    })),
    rooms: source.rooms ? clone(source.rooms) : [],
    schemes: [],
    marks: [],
    groups: [],
    counters: {},
    view: { ...DEFAULT_VIEW, ...(source.view || {}) },
  };
}

// ——— поиск ———————————————————————————————————————————————————————————
function findScheme(project, schemeId) {
  return project.schemes.find((scheme) => scheme.id === schemeId) || null;
}
function findType(project, typeId) {
  return project.markTypes.find((type) => type.id === typeId) || null;
}
function findCategory(project, categoryId) {
  return project.categories.find((category) => category.id === categoryId) || null;
}
function findMark(project, markId) {
  return project.marks.find((mark) => mark.id === markId) || null;
}
function findGroup(project, groupId) {
  return project.groups.find((group) => group.id === groupId) || null;
}
function findRoom(project, roomId) {
  return project.rooms.find((room) => room.id === roomId) || null;
}
function markByCode(project, code, number) {
  return (
    project.marks.find((mark) => {
      const type = findType(project, mark.typeId);
      return type && type.code === code && mark.number === number;
    }) || null
  );
}

function requireScheme(project, schemeId) {
  const scheme = findScheme(project, schemeId);
  if (!scheme) throw modelError("schemeNotFound");
  return scheme;
}

function requireType(project, typeId) {
  const type = findType(project, typeId);
  if (!type) throw modelError("typeNotFound");
  return type;
}

function requireMark(project, markId) {
  const mark = findMark(project, markId);
  if (!mark) throw modelError("markNotFound");
  return mark;
}

// ——— схемы ———————————————————————————————————————————————————————————
function addScheme(project, { name, imageId = null, width = 0, height = 0 } = {}) {
  const scheme = {
    id: newId(),
    name: String(name || "").trim() || strings.project.defaultSchemeName,
    imageId,
    width,
    height,
    order: project.schemes.length,
  };
  return { project: withProject(project, { schemes: [...project.schemes, scheme] }), scheme };
}
function updateScheme(project, schemeId, patch) {
  requireScheme(project, schemeId);
  const allowed = ["name", "imageId", "width", "height", "order"];
  const schemes = project.schemes.map((scheme) =>
    scheme.id === schemeId ? { ...scheme, ...pick(patch, allowed) } : scheme,
  );
  return { project: withProject(project, { schemes }), scheme: schemes.find((s) => s.id === schemeId) };
}
function deleteScheme(project, schemeId) {
  requireScheme(project, schemeId);
  const marks = project.marks.filter((mark) => mark.schemeId !== schemeId);
  const groups = project.groups.filter((group) => group.schemeId !== schemeId);
  const schemes = project.schemes
    .filter((scheme) => scheme.id !== schemeId)
    .map((scheme, index) => ({ ...scheme, order: index }));
  return { project: withProject(project, { schemes, marks, groups }) };
}

// Порядок схем объекта — одно правило на всех: нумерация, панели и выгрузки
// обходят схемы одинаково.
function schemesInOrder(project) {
  return project.schemes
    .map((scheme, index) => ({ scheme, index }))
    .sort((a, b) => {
      const orderA = a.scheme.order ?? a.index;
      const orderB = b.scheme.order ?? b.index;
      return orderA === orderB ? a.index - b.index : orderA - orderB;
    })
    .map((item) => item.scheme);
}

function pick(source, allowed) {
  const result = {};
  if (!source) return result;
  for (const key of allowed) {
    if (Object.prototype.hasOwnProperty.call(source, key)) result[key] = clone(source[key]);
  }
  return result;
}

// ——— метки ———————————————————————————————————————————————————————————

function normalizePoints(points) {
  if (!Array.isArray(points) || points.length === 0) throw modelError("noPoints");
  return points.map((point) => ({ x: Number(point.x), y: Number(point.y) }));
}

function nextNumber(counters, code) {
  return (counters[code] || 0) + 1;
}

function makeMark({ schemeId, typeId, kind, points, number, groupId = null }) {
  return {
    id: newId(),
    schemeId,
    typeId,
    number,
    kind,
    points,
    closed: false,
    groupId,
    labelOffset: null,
    roomId: null,
    location: "",
    original: "",
  };
}
function addMark(project, { schemeId, typeId, kind = "point", points, blockMode } = {}) {
  requireScheme(project, schemeId);
  const type = requireType(project, typeId);
  if (!MARK_KINDS.includes(kind)) throw modelError("unknownKind");
  const vertices = normalizePoints(points);
  if (kind === "line" && vertices.length < 2) throw modelError("shortLine");

  const mode = blockMode || type.blockMode || "each";
  if (!BLOCK_MODES.includes(mode)) throw modelError("unknownBlockMode");

  const counters = { ...project.counters };
  const created = [];

  if (kind === "point" && vertices.length > 1 && mode === "each") {
    for (const point of vertices) {
      const number = nextNumber(counters, type.code);
      counters[type.code] = number;
      created.push(makeMark({ schemeId, typeId, kind, points: [point], number }));
    }
  } else {
    const number = nextNumber(counters, type.code);
    counters[type.code] = number;
    created.push(makeMark({ schemeId, typeId, kind, points: vertices, number }));
  }

  let groups = project.groups;
  let group = null;
  if (created.length > 1) {
    group = {
      id: newId(),
      schemeId,
      markIds: created.map((mark) => mark.id),
      labelOffset: null,
    };
    for (const mark of created) mark.groupId = group.id;
    groups = [...groups, group];
  }

  const next = withProject(project, { marks: [...project.marks, ...created], groups, counters });
  return { project: next, mark: created[0], marks: created, group };
}

// ——— обозначения —————————————————————————————————————————————————————
function labelOf(project, id) {
  const mark = findMark(project, id);
  if (mark) return markLabel(project, mark);
  const group = findGroup(project, id);
  if (group) return groupLabel(project, group);
  return "";
}

function markLabel(project, mark) {
  const type = findType(project, mark.typeId);
  return (type ? type.code : "?") + mark.number;
}

// Подряд идущие номера одного типа склеиваются слитно, остальное — через запятую.
function groupLabel(project, group) {
  const members = group.markIds
    .map((markId) => findMark(project, markId))
    .filter(Boolean)
    .map((mark) => ({ mark, type: findType(project, mark.typeId) }))
    .sort((a, b) => {
      const orderA = a.type ? a.type.order : 0;
      const orderB = b.type ? b.type.order : 0;
      return orderA === orderB ? a.mark.number - b.mark.number : orderA - orderB;
    });

  const runs = [];
  let previous = null;
  for (const member of members) {
    const code = member.type ? member.type.code : "?";
    const sameRun =
      previous && previous.code === code && member.mark.number === previous.number + 1;
    if (sameRun) runs[runs.length - 1] += code + member.mark.number;
    else runs.push(code + member.mark.number);
    previous = { code, number: member.mark.number };
  }
  return runs.join(", ");
}

// Соседняя точка блока: сдвиг на шаг плана в долях от размера схемы.
function addToGroup(project, markId, side, options = {}) {
  const mark = requireMark(project, markId);
  if (mark.kind !== "point") throw modelError("blockOnlyForPoints");
  if (!BLOCK_SIDES.includes(side)) throw modelError("unknownSide");
  const scheme = requireScheme(project, mark.schemeId);
  const type = requireType(project, mark.typeId);
  const stepPx = options.step || BLOCK_STEP_PX;
  const dx = stepPx / (scheme.width > 0 ? scheme.width : BLOCK_FALLBACK_SIZE_PX);
  const dy = stepPx / (scheme.height > 0 ? scheme.height : BLOCK_FALLBACK_SIZE_PX);
  const from = mark.points[mark.points.length - 1];
  const point = {
    x: clampFraction(from.x + (side === "left" ? -dx : side === "right" ? dx : 0)),
    y: clampFraction(from.y + (side === "up" ? -dy : side === "down" ? dy : 0)),
  };

  // Метка, уже собранная как «одна на блок», растёт точками независимо от
  // умолчания типа: её собственная форма важнее справочника.
  const alreadySingle = mark.kind === "point" && mark.points.length > 1;
  const mode = options.blockMode || (alreadySingle ? "single" : type.blockMode || "each");
  if (mode === "single") {
    const grown = updateMark(project, markId, { points: [...mark.points, point] });
    return { project: grown.project, mark: grown.mark, group: findGroup(project, mark.groupId) };
  }

  const counters = { ...project.counters };
  const number = nextNumber(counters, type.code);
  counters[type.code] = number;
  const created = makeMark({
    schemeId: mark.schemeId,
    typeId: mark.typeId,
    kind: "point",
    points: [point],
    number,
    groupId: mark.groupId,
  });

  let groups = project.groups;
  let group = findGroup(project, mark.groupId);
  let marks = [...project.marks, created];
  if (group) {
    groups = groups.map((item) =>
      item.id === group.id ? { ...item, markIds: [...item.markIds, created.id] } : item,
    );
    group = groups.find((item) => item.id === group.id);
  } else {
    group = { id: newId(), schemeId: mark.schemeId, markIds: [markId, created.id], labelOffset: null };
    created.groupId = group.id;
    groups = [...groups, group];
    marks = marks.map((item) => (item.id === markId ? { ...item, groupId: group.id } : item));
  }
  return { project: withProject(project, { marks, groups, counters }), mark: created, group };
}

function clampFraction(value) {

// Счётчик не трогаем: номер остаётся дырой, чтобы распечатка не протухла.

// ——— нумерация ———————————————————————————————————————————————————————

// Порядок обхода: схемы по order, внутри схемы — порядок постановки меток.
function marksInOrder(project, filter) {
  const schemeOrder = new Map(schemesInOrder(project).map((scheme, index) => [scheme.id, index]));
  return project.marks
    .map((mark, index) => ({ mark, index }))
    .filter((item) => (filter ? filter(item.mark) : true))
    .sort((a, b) => {
      const orderA = schemeOrder.has(a.mark.schemeId) ? schemeOrder.get(a.mark.schemeId) : Number.MAX_SAFE_INTEGER;
      const orderB = schemeOrder.has(b.mark.schemeId) ? schemeOrder.get(b.mark.schemeId) : Number.MAX_SAFE_INTEGER;
      return orderA === orderB ? a.index - b.index : orderA - orderB;
    })
    .map((item) => item.mark);

// Возвращает список замен и уже уплотнённый объект; применять или нет —
// решает вызывающий: исходный project не меняется.

  const changes = [];
  const numbers = new Map();
  ordered.forEach((mark, index) => {
    const number = index + 1;
    numbers.set(mark.id, number);
    if (mark.number !== number) {
      changes.push({
        markId: mark.id,
        code: type.code,
        from: mark.number,
        to: number,
        fromLabel: type.code + mark.number,
        toLabel: type.code + number,
      });
    }
  });
  const marks = project.marks.map((mark) =>
    numbers.has(mark.id) ? { ...mark, number: numbers.get(mark.id) } : mark,
  );

// Новый номер по новому типу; старый номер остаётся дырой.

  const mark = requireMark(project, markId);
  const type = requireType(project, typeId);
  if (mark.typeId === typeId) return { project, mark };
  const counters = { ...project.counters };
  const number = nextNumber(counters, type.code);
  counters[type.code] = number;
  const marks = project.marks.map((item) =>
    item.id === markId ? { ...item, typeId, number } : item,
  );
  return { project: withProject(project, { marks, counters }), mark: marks.find((m) => m.id === markId) };
}

function normalizeCode(code, project, exceptTypeId) {
  const value = String(code == null ? "" : code).trim();
  if (!value) throw modelError("codeRequired");
  if (value.length > 2) throw modelError("codeTooLong");
  if (!/^[A-Za-zА-Яа-яЁё]{1,2}$/u.test(value)) throw modelError("codeLetters");
  const taken = project.markTypes.some(
    (type) => type.id !== exceptTypeId && type.code.toUpperCase() === value.toUpperCase(),
  );
  if (taken) throw modelError("codeTaken", { code: value });
  return value;
}

function normalizeName(name) {
  const value = String(name == null ? "" : name).trim();

  return value;
}

  return shape;
}

    name: normalizeName(name),
    shape: checkShape(shape, { allowNull: true }),
    blockMode: checkBlockMode(blockMode),
    order: project.markTypes.length,

}

  const next = { ...current };
  if (Object.prototype.hasOwnProperty.call(patch, "code")) next.code = normalizeCode(patch.code, project, typeId);
  if (Object.prototype.hasOwnProperty.call(patch, "name")) next.name = normalizeName(patch.name);
  if (Object.prototype.hasOwnProperty.call(patch, "shape")) next.shape = checkShape(patch.shape, { allowNull: true });
  if (Object.prototype.hasOwnProperty.call(patch, "blockMode")) next.blockMode = checkBlockMode(patch.blockMode);
  if (Object.prototype.hasOwnProperty.call(patch, "categoryId")) {
    if (!findCategory(project, patch.categoryId)) throw modelError("categoryNotFound");
    next.categoryId = patch.categoryId;

  if (Object.prototype.hasOwnProperty.call(patch, "order")) next.order = patch.order;

  const markTypes = project.markTypes.map((type) => (type.id === typeId ? next : type));

    .filter((item) => item.id !== typeId)

// Цвет — всегда у категории; форма у типа, если задана, иначе у категории.

// ——— проверка объекта —————————————————————————————————————————————————

function problem(code, vars, ref) {
  return { code, message: text("problems." + code, vars), ref: ref || null };
}
function validate(project) {
  const problems = [];

  const seenCodes = new Map();
  for (const type of project.markTypes) {
    const key = type.code.toUpperCase();
    if (seenCodes.has(key)) problems.push(problem("duplicateCode", { code: type.code }, type.id));
    else seenCodes.set(key, type.id);
    if (!findCategory(project, type.categoryId)) problems.push(problem("typeWithoutCategory", null, type.id));
  }

  const used = new Map();
  const behindTypes = new Map();
  for (const mark of project.marks) {
    const type = findType(project, mark.typeId);
    if (!type) problems.push(problem("markWithoutType", null, mark.id));
    if (!findScheme(project, mark.schemeId)) problems.push(problem("markWithoutScheme", null, mark.id));
    if (mark.roomId && !findRoom(project, mark.roomId)) problems.push(problem("markWithoutRoom", null, mark.id));
    if (!Array.isArray(mark.points) || mark.points.length === 0) problems.push(problem("emptyPoints", null, mark.id));
    else if (mark.kind === "line" && mark.points.length < 2) problems.push(problem("shortLine", null, mark.id));

    if (type) {
      const label = type.code + mark.number;
      if (used.has(label)) problems.push(problem("duplicateNumber", { label }, mark.id));
      else used.set(label, mark.id);
      const counter = project.counters[type.code] || 0;
      if (mark.number > counter) behindTypes.set(type.id, type.code);
    }
  }

  // Отставший счётчик — свойство типа, а не каждой его метки.
  for (const [id, code] of behindTypes) problems.push(problem("counterBehind", { code }, id));

  for (const group of project.groups) {
    const members = group.markIds.map((markId) => findMark(project, markId)).filter(Boolean);
    if (members.length < 2) problems.push(problem("smallGroup", null, group.id));
    if (new Set(members.map((mark) => mark.schemeId)).size > 1) {
      problems.push(problem("groupAcrossSchemes", null, group.id));
    }
  }

  return problems;
}

// src/app.js
// Каркас сеанса: состояние, реестр панелей, уведомления.
// Панели других тасков монтируются по идентификатору контейнера из index.html
// и не правят ни этот файл, ни разметку.

// Контейнеры-точки монтирования (идентификаторы из src/index.html).
const PANEL_IDS = {
  tools: "panel-tools",
  schemes: "panel-schemes",
  marks: "panel-marks",
  properties: "panel-properties",
  canvas: "canvas-host",
  overlay: "canvas-overlay",
  headerActions: "header-actions",
  projectActions: "project-actions",
  dialogs: "dialog-host",
};

const appState = {
  project: null,
  schemeId: null,
  selectedMarkIds: [],
  activeTypeId: null,
  mode: "select",
  filter: { categoryIds: null, typeIds: null, roomId: null, query: "" },
  view: { zoom: 1, offsetX: 0, offsetY: 0 },
  dirty: false,
};

const appSubscribers = new Set();
const appPanels = new Map();
const appMounted = new Map();

// Снимок: вложенные filter/view/selectedMarkIds копируются, чтобы правка
// на месте в панели не меняла состояние сеанса мимо setState.
function getState() {
  return {
    ...appState,
    selectedMarkIds: [...appState.selectedMarkIds],
    filter: { ...appState.filter },
    view: { ...appState.view },
  };
}
function setState(patch) {
  if (!patch) return getState();
  const changed = {};
  for (const [key, value] of Object.entries(patch)) {
    if (appState[key] !== value) {
      appState[key] = value;
      changed[key] = value;
    }
  }
  if (Object.keys(changed).length === 0) return getState();
  const snapshot = getState();
  for (const subscriber of [...appSubscribers]) {
    try {
      subscriber(snapshot, changed);
    } catch (error) {
      reportAppError(error);
    }
  }
  syncCanvasClass();
  syncProjectName();
  return snapshot;
}
function subscribe(listener) {
  appSubscribers.add(listener);
  return () => appSubscribers.delete(listener);
}

// Регистрация панели: если каркас уже поднят — монтируем сразу.
function registerPanel(id, mountFn) {
  if (typeof mountFn !== "function") return;
  appPanels.set(id, mountFn);
  if (appStarted) mountPanel(id);
}

  return { getState, setState, subscribe, notify, strings, text };
}

function mountPanel(id) {
  const mountFn = appPanels.get(id);
  const host = document.getElementById(id);
  if (!mountFn || !host || appMounted.get(id) === mountFn) return;
  try {
    mountFn(host, panelApi());
    appMounted.set(id, mountFn);
  } catch (error) {
    reportAppError(error);
  }
}
function notify(message, kind = "info") {
  const host = typeof document === "undefined" ? null : document.getElementById("notifications");
  if (!host) return null;
  const toast = document.createElement("div");
  toast.className = "toast toast--" + kind;
  toast.textContent = String(message);
  toast.title = strings.notify.close;
  toast.addEventListener("click", () => toast.remove());
  host.append(toast);
  setTimeout(() => toast.remove(), kind === "error" ? 12000 : 6000);
  return toast;
}

function reportAppError(error) {
  notify(error && error.message ? error.message : String(error), "error");
}

// Все видимые строки приходят из словаря: разметка держит только ключи.
function applyStrings(root) {
  const scope = root || document;
  for (const node of scope.querySelectorAll("[data-text]")) {
    node.textContent = text(node.dataset.text);
  }
  for (const node of scope.querySelectorAll("[data-title]")) {
    node.title = text(node.dataset.title);
  }
}

function syncProjectName() {
  const node = document.getElementById("project-name");
  if (!node) return;
  node.textContent = appState.project ? appState.project.name : strings.header.noProject;
}

function syncCanvasClass() {
  const app = document.getElementById("app");
  if (!app) return;
  app.classList.toggle("has-scheme", Boolean(appState.schemeId));
}
function startApp() {
  if (appStarted) return;
  appStarted = true;
  applyStrings(document);
  syncProjectName();
  syncCanvasClass();
  for (const id of appPanels.keys()) mountPanel(id);
}

// Старт откладывается за границу текущего скрипта: в собранном файле панели
// и модели определяются ниже по бандлу, и каркас не должен опережать их.
if (typeof document !== "undefined") {
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startApp, { once: true });
  } else {
    setTimeout(startApp, 0);
  }
}

// src/store.js
// Хранение в браузере: IndexedDB своими руками, без единой зависимости.
// База `scheme-markup`, хранилища `projects` (документ объекта), `images`
// (Blob планов) и `settings` (ключ-значение).
//
// Правило файла: потеря хранилища не должна ронять приложение. По file://
// IndexedDB доступен не везде, в приватном окне запись может отказать в любой
// момент — тогда store переходит в память, сообщает о беде подписчикам
// (панель показывает строку и советует выгрузить проект в файл) и продолжает
// работать. Данные сеанса живут в памяти в любом случае.
const STORE_DB_NAME = "scheme-markup";
const STORE_DB_VERSION = 1;
const STORE_NAMES = { projects: "projects", images: "images", settings: "settings" };
// Ниже этого порога свободного места пользователя предупреждают заранее.
const STORE_LOW_SPACE_BYTES = 50 * 1024 * 1024;
// Открытие базы иногда не отвечает вовсе (приватное окно, заблокированная
// вкладка): ждём ограниченное время и уходим в память.
const STORE_OPEN_TIMEOUT_MS = 4000;

const storeMemory = { projects: new Map(), images: new Map(), settings: new Map() };
const storeListeners = new Set();
let storeDb = null;
let storeModeValue = "unknown";
let storeOpening = null;
let storeReported = false;
let storeWriteReported = false;
function storeMode() {
  return storeModeValue;
}
function onStoreProblem(listener) {
  storeListeners.add(listener);
  return () => storeListeners.delete(listener);
}

function reportStoreProblem(kind, error) {
  const problem = { kind, error: error || null };
  for (const listener of [...storeListeners]) {
    try {
      listener(problem);
    } catch (ignored) {
      /* подписчик не должен ломать запись */
    }
  }
}

function newStoreId() {
  return crypto.randomUUID();
}

function idbRequest(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("indexeddb-failed"));
  });
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined" || indexedDB === null) {
      reject(new Error("indexeddb-unavailable"));
      return;
    }
    let settled = false;
    const finish = (fn, value) => {
      if (settled) return;
      settled = true;
      fn(value);
    };
    const timer = setTimeout(() => finish(reject, new Error("indexeddb-timeout")), STORE_OPEN_TIMEOUT_MS);
    let request;
    try {
      request = indexedDB.open(STORE_DB_NAME, STORE_DB_VERSION);
    } catch (error) {
      clearTimeout(timer);
      finish(reject, error);
      return;
    }
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(STORE_NAMES.projects)) {
        db.createObjectStore(STORE_NAMES.projects, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(STORE_NAMES.images)) {
        db.createObjectStore(STORE_NAMES.images, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(STORE_NAMES.settings)) {
        db.createObjectStore(STORE_NAMES.settings, { keyPath: "key" });
      }
    };
    request.onsuccess = () => {
      clearTimeout(timer);
      finish(resolve, request.result);
    };
    request.onerror = () => {
      clearTimeout(timer);
      finish(reject, request.error || new Error("indexeddb-failed"));
    };
    request.onblocked = () => {
      clearTimeout(timer);
      finish(reject, new Error("indexeddb-blocked"));
    };
  });
}
async function openStore() {
  if (storeModeValue !== "unknown") return storeModeValue;
  if (!storeOpening) {
    storeOpening = openDatabase()
      .then((db) => {
        storeDb = db;
        storeModeValue = "idb";
        db.onclose = () => degradeToMemory(new Error("indexeddb-closed"));
        return storeModeValue;
      })
      .catch((error) => {
        degradeToMemory(error);
        return storeModeValue;
      });
  }
  return storeOpening;
}

function degradeToMemory(error) {
  storeDb = null;
  storeModeValue = "memory";
  if (storeReported) return;
  storeReported = true;
  reportStoreProblem("unavailable", error);
}

// Одна транзакция — одно действие: запись документа объекта атомарна, вкладка,
// закрытая посреди сохранения, оставляет прежнее состояние, а не половину.
async function runTransaction(name, mode, action) {
  await openStore();
  if (storeModeValue !== "idb" || !storeDb) return { ok: false, memory: true };
  try {
    return await new Promise((resolve, reject) => {
      const tx = storeDb.transaction(name, mode);
      let result;
      tx.oncomplete = () => {
        if (mode === "readwrite") storeWriteReported = false;
        resolve({ ok: true, result });
      };
      tx.onerror = () => reject(tx.error || new Error("indexeddb-failed"));
      tx.onabort = () => reject(tx.error || new Error("indexeddb-aborted"));
      Promise.resolve(action(tx.objectStore(name)))
        .then((value) => {
          result = value;
        })
        .catch((error) => {
          try {
            tx.abort();
          } catch (ignored) {
            /* транзакция уже завершилась */
          }
          reject(error);
        });
    });
  } catch (error) {
    // Автосохранение идёт на каждую правку: об отказавшей записи говорим один
    // раз — до тех пор, пока запись снова не пройдёт.
    if (mode === "readwrite" && !storeWriteReported) {
      storeWriteReported = true;
      reportStoreProblem("writeFailed", error);
    }
    return { ok: false, error };
  }
}

// ——— объекты ——————————————————————————————————————————————————————————
async function listProjects() {
  const summaries = new Map();
  const read = await runTransaction(STORE_NAMES.projects, "readonly", (store) => idbRequest(store.getAll()));
  if (read.ok) {
    for (const doc of read.result || []) summaries.set(doc.id, summaryOf(doc));
  }
  for (const doc of storeMemory.projects.values()) summaries.set(doc.id, summaryOf(doc));
  return [...summaries.values()].sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
}

function summaryOf(project) {
  return {
    id: project.id,
    name: project.name,
    updatedAt: project.updatedAt,
    schemes: (project.schemes || []).length,
    marks: (project.marks || []).length,
  };
}
async function loadProject(id) {
  if (!id) return null;
  if (storeMemory.projects.has(id)) return storeMemory.projects.get(id);
  const read = await runTransaction(STORE_NAMES.projects, "readonly", (store) => idbRequest(store.get(id)));
  return read.ok && read.result ? read.result : null;
}

// Отказ записи не теряет работу: документ остаётся в памяти сеанса, а панель
// получает повод предложить выгрузку в файл.
async function saveProject(project) {
  if (!project || !project.id) return { ok: false };
  const written = await runTransaction(STORE_NAMES.projects, "readwrite", (store) =>
    idbRequest(store.put(project)),
  );
  if (written.ok) {
    storeMemory.projects.delete(project.id);
    return { ok: true, mode: "idb" };
  }
  storeMemory.projects.set(project.id, project);
  return { ok: false, mode: "memory", error: written.error || null };
}
async function deleteProject(id) {
  storeMemory.projects.delete(id);
  const removed = await runTransaction(STORE_NAMES.projects, "readwrite", (store) => idbRequest(store.delete(id)));
  return { ok: removed.ok || storeModeValue === "memory" };
}

// ——— изображения ——————————————————————————————————————————————————————
async function putImage(blob) {
  const id = newStoreId();
  const written = await runTransaction(STORE_NAMES.images, "readwrite", (store) =>
    idbRequest(store.put({ id, blob, type: blob.type || "", size: blob.size || 0 })),
  );
  if (!written.ok) storeMemory.images.set(id, blob);
  return id;
}
async function getImage(id) {
  if (!id) return null;
  if (storeMemory.images.has(id)) return storeMemory.images.get(id);
  const read = await runTransaction(STORE_NAMES.images, "readonly", (store) => idbRequest(store.get(id)));
  return read.ok && read.result ? read.result.blob : null;
}
async function deleteImage(id) {
  if (!id) return { ok: true };
  storeMemory.images.delete(id);
  const removed = await runTransaction(STORE_NAMES.images, "readwrite", (store) => idbRequest(store.delete(id)));
  return { ok: removed.ok || storeModeValue === "memory" };
}

// ——— настройки ————————————————————————————————————————————————————————
async function getSetting(key) {
  if (storeMemory.settings.has(key)) return storeMemory.settings.get(key);
  const read = await runTransaction(STORE_NAMES.settings, "readonly", (store) => idbRequest(store.get(key)));
  return read.ok && read.result ? read.result.value : null;
}
async function setSetting(key, value) {
  const written = await runTransaction(STORE_NAMES.settings, "readwrite", (store) =>
    idbRequest(store.put({ key, value })),
  );
  if (written.ok) storeMemory.settings.delete(key);
  else storeMemory.settings.set(key, value);
  return { ok: written.ok };
}

// ——— место ————————————————————————————————————————————————————————————
async function estimateSpace() {
  const empty = { usage: null, quota: null, free: null, low: false };
  if (typeof navigator === "undefined" || !navigator.storage || !navigator.storage.estimate) return empty;
  try {
    const { usage, quota } = await navigator.storage.estimate();
    if (typeof quota !== "number" || typeof usage !== "number") return empty;
    const free = Math.max(0, quota - usage);
    return { usage, quota, free, low: free < STORE_LOW_SPACE_BYTES };
  } catch (error) {
    return empty;
  }
}

// src/panels/ui.js
// Общие кирпичи панелей: элементы, кнопки, модальные диалоги.
// Отдельный модуль, потому что ими пользуются все панели: тянуть их из чужой
// панели значило бы тянуть вместе с ней её регистрацию и подписки.
function uiEl(tag, options = {}, children = []) {
  const node = document.createElement(tag);
  if (options.class) node.className = options.class;
  if (options.text != null) node.textContent = options.text;
  if (options.title) node.title = options.title;
  if (options.type) node.type = options.type;
  if (options.value != null) node.value = options.value;
  if (options.placeholder) node.placeholder = options.placeholder;
  if (options.attrs) {
    for (const [name, value] of Object.entries(options.attrs)) node.setAttribute(name, value);
  }
  if (options.on) {
    for (const [name, handler] of Object.entries(options.on)) node.addEventListener(name, handler);
  }
  for (const child of Array.isArray(children) ? children : [children]) {
    if (child) node.append(child);
  }
  return node;
}
function uiButton(label, options = {}) {
  return uiEl("button", {
    class: options.class || "ui-btn",
    text: label,
    title: options.title || "",
    type: "button",
    on: options.on,
    attrs: options.attrs,
  });
}

// Диалоги складываются стопкой: подтверждение поверх редактора плана —
// обычное дело. Виден верхний, Escape закрывает только его, Enter нажимает его
// основное действие, нижние ждут своей очереди и закрываются своими же close().
// Пока стопка не пуста, #dialog-host не пустой — значит затемнение на месте
// (правило `:empty` из styles.css). Клавиатура не должна оставаться в панели
// под затемнением: диалог забирает фокус, а закрываясь — возвращает его тому,
// кто его открыл.
const uiDialogs = [];
let uiEscapeListener = null;
function uiDialogDepth() {
  return uiDialogs.length;
}

function uiRefreshDialogs() {
  const host = document.getElementById("dialog-host");
  uiDialogs.forEach((entry, index) => {
    entry.card.hidden = index !== uiDialogs.length - 1;
  });
  if (uiDialogs.length === 0) {
    if (host) host.replaceChildren();
    if (uiEscapeListener) {
      document.removeEventListener("keydown", uiEscapeListener);
      uiEscapeListener = null;
    }
    return;
  }
  if (uiEscapeListener) return;
  uiEscapeListener = (event) => {
    const top = uiDialogs[uiDialogs.length - 1];
    if (!top) return;
    if (event.key === "Escape") {
      if (top.dismissable === false) return;
      event.preventDefault();
      top.close();
      if (top.onCancel) top.onCancel();
      return;
    }
    // Enter подтверждает основное действие. Поле ввода, которое обработало
    // Enter само (uiPrompt), помечает событие — второй раз не срабатываем.
    if (event.key !== "Enter" || event.defaultPrevented || !top.primary) return;
    const target = event.target;
    if (target && (target.tagName === "TEXTAREA" || target.isContentEditable)) return;
    event.preventDefault();
    top.primary.click();
  };
  document.addEventListener("keydown", uiEscapeListener);
}

function uiFocusEntry(entry) {
  const target = entry.card.querySelector("input, select, textarea") || entry.primary || entry.card;
  if (target && typeof target.focus === "function") target.focus();
}

// Фокус возвращается открывшему, если он ещё на странице (кнопка панели могла
// исчезнуть при перерисовке); иначе — диалогу, который снова стал верхним.
function uiReturnFocus(entry) {
  const opener = entry.opener;
  if (opener && typeof opener.focus === "function" && opener.isConnected) {
    opener.focus();
    return;
  }
  const top = uiDialogs[uiDialogs.length - 1];
  if (top) uiFocusEntry(top);
}
function uiModal(options) {
  const host = document.getElementById("dialog-host");
  const actions = options.actions || [];
  const card = uiEl("div", { class: "modal", attrs: { tabindex: "-1" } }, [
    uiEl("h3", { class: "modal__title", text: options.title || "" }),
    uiEl("div", { class: "modal__body" }, options.body || null),
    uiEl("div", { class: "modal__actions" }, actions),
  ]);
  const entry = {
    card,
    dismissable: options.dismissable,
    onCancel: options.onCancel,
    // Основное действие — последняя кнопка в ряду (в uiConfirm и uiPrompt это
    // подтверждение, в редакторе плана — «Готово»).
    primary: options.primary || [...actions].reverse().find((node) => node && node.tagName === "BUTTON") || null,
    opener: typeof document !== "undefined" ? document.activeElement : null,
    close() {
      const index = uiDialogs.indexOf(entry);
      if (index < 0) return;
      uiDialogs.splice(index, 1);
      card.remove();
      uiRefreshDialogs();
      uiReturnFocus(entry);
    },
  };
  if (!host) return { close() {}, card };
  uiDialogs.push(entry);
  host.append(card);
  uiRefreshDialogs();
  uiFocusEntry(entry);
  return { close: entry.close, card };
}
function uiConfirm({ title, message, confirmLabel }) {
  return new Promise((resolve) => {
    let modal;
    const answer = (value) => {
      modal.close();
      resolve(value);
    };
    modal = uiModal({
      title,
      body: uiEl("p", { class: "modal__text", text: message }),
      actions: [
        uiButton(strings.dialog.cancel, { on: { click: () => answer(false) } }),
        uiButton(confirmLabel || strings.dialog.confirm, {
          class: "ui-btn ui-btn--danger",
          on: { click: () => answer(true) },
        }),
      ],
      onCancel: () => resolve(false),
    });
  });
}
function uiPrompt({ title, value, placeholder, submitLabel }) {
  return new Promise((resolve) => {
    let modal;
    const done = (result) => {
      modal.close();
      resolve(result || null);
    };
    const input = uiEl("input", {
      class: "ui-input",
      type: "text",
      value: value || "",
      placeholder: placeholder || "",
      on: {
        keydown: (event) => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          done(input.value.trim());
        },
      },
    });
    modal = uiModal({
      title,
      body: input,
      actions: [
        uiButton(strings.dialog.cancel, { on: { click: () => done(null) } }),
        uiButton(submitLabel || strings.dialog.save, {
          class: "ui-btn ui-btn--accent",
          on: { click: () => done(input.value.trim()) },
        }),
      ],
      onCancel: () => resolve(null),
    });
    input.select();
  });
}
function formatMegabytes(bytes) {
  return text("units.megabytes", { value: Math.round(bytes / (1024 * 1024)) });
}

// src/panels/projects.js
// Объекты: список в шапке, переключение, переименование, удаление,
// первый запуск и автосохранение в браузер.
const LAST_PROJECT_KEY = "lastProjectId";
const SAVE_DELAY_MS = 400;

function uniqueProjectName(list) {
  const base = strings.project.untitled;
  const taken = new Set(list.map((item) => item.name));
  if (!taken.has(base)) return base;
  let index = 2;
  while (taken.has(base + " " + index)) index += 1;
  return base + " " + index;
}

function mountProjectsPanel(host, api) {
  const { getState, setState, notify, subscribe } = api;
  let known = [];
  let saveTimer = null;
  let lowSpaceReported = false;

  const select = uiEl("select", {
    class: "ui-select",
    title: strings.projects.switch,
    on: {
      change: () => {
        const id = select.value;
        if (id && id !== currentId()) openProjectById(id);
      },
    },
  });
  const renameButton = uiButton("✎", {
    title: strings.projects.rename,
    on: { click: () => renameCurrent() },
  });
  const createButton = uiButton("＋", {
    title: strings.projects.create,
    on: { click: () => createAndOpen() },
  });
  const removeButton = uiButton("🗑", {
    class: "ui-btn ui-btn--danger",
    title: strings.projects.remove,
    on: { click: () => removeCurrent() },
  });
  host.replaceChildren(select, createButton, renameButton, removeButton);

  function currentId() {
    const state = getState();
    return state.project ? state.project.id : "";
  }

  function renderList() {
    const id = currentId();
    select.replaceChildren();
    if (known.length === 0) {
      select.append(uiEl("option", { value: "", text: strings.projects.empty }));
    }
    for (const item of known) {
      select.append(uiEl("option", { value: item.id, text: item.name }));
    }
    select.value = id;
    const has = Boolean(id);
    renameButton.disabled = !has;
    removeButton.disabled = !has;
  }

  async function refreshList() {
    known = await listProjects();
    renderList();
  }

  async function openProjectById(id) {
    const project = await loadProject(id);
    if (!project) {
      await refreshList();
      return;
    }
    setState({
      project,
      schemeId: project.schemes.length > 0 ? project.schemes[0].id : null,
      selectedMarkIds: [],
      activeTypeId: null,
    });
    await setSetting(LAST_PROJECT_KEY, id);
    renderList();
  }

  async function createAndOpen() {
    const project = createProject({ name: uniqueProjectName(known) });
    await saveProject(project);
    await refreshList();
    setState({ project, schemeId: null, selectedMarkIds: [], activeTypeId: null });
    await setSetting(LAST_PROJECT_KEY, project.id);
    renderList();
    notify(text("projects.created", { name: project.name }), "success");
    return project;
  }

  async function renameCurrent() {
    const state = getState();
    if (!state.project) return;
    const name = await uiPrompt({
      title: strings.projects.renameTitle,
      value: state.project.name,
      placeholder: strings.projects.namePlaceholder,
    });
    if (!name || name === state.project.name) return;
    const next = updateProject(state.project, { name });
    setState({ project: next.project });
    await refreshList();
  }

  async function removeCurrent() {
    const state = getState();
    if (!state.project) return;
    const project = state.project;
    const agreed = await uiConfirm({
      title: strings.projects.removeTitle,
      message: text("projects.removeMessage", { name: project.name }),
      confirmLabel: strings.dialog.confirm,
    });
    if (!agreed) return;
    for (const scheme of project.schemes) {
      if (scheme.imageId) await deleteImage(scheme.imageId);
    }
    await deleteProject(project.id);
    setState({ project: null, schemeId: null, selectedMarkIds: [], activeTypeId: null });
    notify(text("projects.removed", { name: project.name }), "success");
    await refreshList();
    if (known.length > 0) await openProjectById(known[0].id);
    else showWelcome();
  }

  // Первый запуск: не пустая серая страница, а одна кнопка.
  function showWelcome() {
    const modal = uiModal({
      title: strings.projects.welcomeTitle,
      dismissable: false,
      body: uiEl("p", { class: "modal__text", text: strings.projects.welcomeText }),
      actions: [
        uiButton(strings.projects.createTitle, {
          class: "ui-btn ui-btn--accent",
          on: {
            click: async () => {
              modal.close();
              await createAndOpen();
            },
          },
        }),
      ],
    });
  }

  function scheduleSave(project) {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      saveTimer = null;
      const result = await saveProject(project);
      if (result.ok) {
        known = known.map((item) =>
          item.id === project.id
            ? { ...item, name: project.name, updatedAt: project.updatedAt, schemes: project.schemes.length, marks: project.marks.length }
            : item,
        );
        renderList();
        await checkSpace();
      }
    }, SAVE_DELAY_MS);
  }

  async function checkSpace() {
    if (lowSpaceReported) return;
    const space = await estimateSpace();
    if (!space.low) return;
    lowSpaceReported = true;
    notify(text("storage.lowSpace", { free: formatMegabytes(space.free) }), "error");
  }

  onStoreProblem((problem) => {
    notify(problem.kind === "unavailable" ? strings.storage.memory : strings.storage.writeFailed, "error");
  });

  subscribe((state, changed) => {
    if (!("project" in changed)) return;
    renderList();
    if (state.project) scheduleSave(state.project);
  });

  (async () => {
    await openStore();
    await refreshList();
    const lastId = await getSetting(LAST_PROJECT_KEY);
    const target = known.find((item) => item.id === lastId) || known[0] || null;
    if (target) await openProjectById(target.id);
    else showWelcome();
    await checkSpace();
    if (storeMode() === "memory") renderList();
  })();
}
