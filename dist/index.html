// Метка за рамкой обрезки была бы потеряна: считаем такие, чтобы предупредить.
function countPointsOutside(points, transform) {
  let outside = 0;
  for (const point of points || []) {
    const next = transformPoint(point, transform);
    if (next.x < 0 || next.x > 1 || next.y < 0 || next.y > 1) outside += 1;
  }
  return outside;
}

// ——— браузерная часть ————————————————————————————————————————————————

function planOutputType(blob) {
  return planTypeOf(blob);
}

// createImageBitmap есть не везде (и не всегда по file://) — запасной путь <img>.
async function decodePlanImage(blob) {
  const url = URL.createObjectURL(blob);
  try {
    if (typeof createImageBitmap === "function") {
      const bitmap = await createImageBitmap(blob);
      return { image: bitmap, width: bitmap.width, height: bitmap.height, url };
    }
    const image = await new Promise((resolve, reject) => {
      const element = new Image();
      element.onload = () => resolve(element);
      element.onerror = () => reject(new Error("decode"));
      element.src = url;
    });
    return { image, width: image.naturalWidth, height: image.naturalHeight, url };
  } catch (error) {
    URL.revokeObjectURL(url);
    throw error;
  }
}
function releasePlanImage(decoded) {
  if (!decoded) return;
  if (decoded.url) URL.revokeObjectURL(decoded.url);
  if (decoded.image && typeof decoded.image.close === "function") decoded.image.close();
}

// Файл плана: проверка типа и настоящий размер картинки в пикселях.
async function readPlanImage(file) {
  const blob = file.slice ? file.slice(0, file.size, planTypeOf(file)) : file;
  const decoded = await decodePlanImage(blob);
  const size = { width: decoded.width, height: decoded.height };
  releasePlanImage(decoded);
  return { blob, width: size.width, height: size.height };
}

function blobFromCanvas(canvas, type) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(
      (blob) => (blob ? resolve(blob) : reject(new Error("toBlob"))),
      type,
      type === "image/jpeg" ? 0.92 : undefined,
    );
  });
}

// Новая картинка плана по тому же преобразованию, что и доли меток.
async function renderPlanImage(blob, transform) {
  const settings = normalizeTransform(transform);
  const decoded = await decodePlanImage(blob);
  try {
    const turned = transformSize({ width: decoded.width, height: decoded.height }, { rotate: settings.rotate });
    const size = transformSize({ width: decoded.width, height: decoded.height }, settings);
    const canvas = document.createElement("canvas");
    canvas.width = size.width;
    canvas.height = size.height;
    const ctx = canvas.getContext("2d");
    if (settings.crop) {
      ctx.translate(-Math.round(turned.width * settings.crop.x), -Math.round(turned.height * settings.crop.y));
    }
    if (settings.rotate === 90) {
      ctx.translate(turned.width, 0);
      ctx.rotate(Math.PI / 2);
    } else if (settings.rotate === 180) {
      ctx.translate(turned.width, turned.height);
      ctx.rotate(Math.PI);
    } else if (settings.rotate === 270) {
      ctx.translate(0, turned.height);
      ctx.rotate(-Math.PI / 2);
    }
    ctx.drawImage(decoded.image, 0, 0);
    const out = await blobFromCanvas(canvas, planOutputType(blob));
    return { blob: out, width: size.width, height: size.height };
  } finally {
    releasePlanImage(decoded);
  }
}

// src/panels/colorPicker.js
// Своё окно выбора цвета: слева палитра объекта, справа — поле оттенка
// и точная правка по числам.
//
// Системное `<input type="color">` здесь не годится по двум причинам.
// Во-первых, оно ничего не знает о палитре объекта и о том, какие цвета уже
// заняты соседними комнатами, — а повтор цвета на плане и есть главная беда.
// Во-вторых, оно выглядит по-разному в каждой системе и в каждом браузере,
// а в части из них его вовсе не открыть с клавиатуры. Поэтому поле
// «насыщенность/яркость» и полоса оттенка рисуются холстом, а любое движение
// мыши здесь повторяется стрелками и полями R, G, B.



const COLOR_FIELD_SIZE = { width: 232, height: 168 };
const COLOR_HUE_HEIGHT = 18;
// Шаг стрелок: мелкий для точной подгонки, крупный с Shift.
const COLOR_STEP = { fine: 0.02, coarse: 0.1, hue: 2, hueCoarse: 12 };
const COLOR_FALLBACK = "#8B949E";
// Плотность заливки контура на белом плане: окно показывает цвет и линией,
// и заливкой — так видно, как он ляжет на схему.
const COLOR_PLAN_ALPHA = 0.12;

function colorHexOf(hsv) {
  return rgbToHex(hsvToRgb(hsv));
}

// Поле насыщенности и яркости: заливка чистым оттенком, поверх — белый
// градиент слева направо и чёрный сверху вниз. Кружок-курсор рисуется тем же
// холстом: отдельный слой поверх canvas пришлось бы двигать вручную.
function colorDrawField(canvas, hsv) {
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  const { width, height } = canvas;
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = colorHexOf({ h: hsv.h, s: 1, v: 1 });
  ctx.fillRect(0, 0, width, height);
  const white = ctx.createLinearGradient(0, 0, width, 0);
  white.addColorStop(0, "rgba(255, 255, 255, 1)");
  white.addColorStop(1, "rgba(255, 255, 255, 0)");
  ctx.fillStyle = white;
  ctx.fillRect(0, 0, width, height);
  const black = ctx.createLinearGradient(0, 0, 0, height);
  black.addColorStop(0, "rgba(0, 0, 0, 0)");
  black.addColorStop(1, "rgba(0, 0, 0, 1)");
  ctx.fillStyle = black;
  ctx.fillRect(0, 0, width, height);

  const place = colorHsvToField(hsv);
  const x = place.x * width;
  const y = place.y * height;
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(0, 0, 0, 0.55)";
  ctx.beginPath();
  ctx.arc(x, y, 7.5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(x, y, 6, 0, Math.PI * 2);
  ctx.stroke();
}

function colorDrawHue(canvas, hsv) {
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  const { width, height } = canvas;
  const rainbow = ctx.createLinearGradient(0, 0, width, 0);
  for (let stop = 0; stop <= 6; stop += 1) {
    rainbow.addColorStop(stop / 6, colorHexOf({ h: stop * 60, s: 1, v: 1 }));
  }
  ctx.fillStyle = rainbow;
  ctx.fillRect(0, 0, width, height);

  const x = (((hsv.h % 360) + 360) % 360) / 360 * width;
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(0, 0, 0, 0.55)";
  ctx.strokeRect(x - 3, 1, 6, height - 2);
  ctx.strokeStyle = "#FFFFFF";
  ctx.strokeRect(x - 2, 2, 4, height - 4);
}

// Мышь, палец и перо — один и тот же обработчик: холст забирает указатель
// себе, поэтому линия ведётся даже когда курсор ушёл за край поля.
function colorDrag(canvas, onPoint) {
  const at = (event) => {
    const box = canvas.getBoundingClientRect();
    onPoint((event.clientX - box.left) / box.width, (event.clientY - box.top) / box.height);
  };
  canvas.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    canvas.setPointerCapture(event.pointerId);
    canvas.focus();
    at(event);
  });
  canvas.addEventListener("pointermove", (event) => {
    if (canvas.hasPointerCapture(event.pointerId)) at(event);
  });
  const release = (event) => {
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
  };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);
}

function colorTakenList(used) {
  return (Array.isArray(used) ? used : []).filter((value) => hexToRgb(value)).map((value) => String(value).trim());
}

// Enter внутри диалога нажимает его основное действие («ОК»), и делает это
// раньше, чем браузер успевает превратить Enter в клик по кнопке под фокусом.
// Поэтому кнопки самого окна обрабатывают Enter сами: выбор цвета с клавиатуры
// не должен заодно закрывать окно, отдав прежний цвет.
function colorEnter(node, run) {
  node.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    event.preventDefault();
    run();
  });
  return node;
}
function openColorPicker(options = {}) {
  return new Promise((resolve) => {
    const before = hexToRgb(options.color) ? String(options.color).trim().toUpperCase() : COLOR_FALLBACK;
    const taken = colorTakenList(options.used).filter(
      (value) => String(value).toUpperCase() !== before,
    );
    let hsv = rgbToHsv(hexToRgb(before));
    let modal;

    const field = uiEl("canvas", {
      class: "colorpick__field",
      title: strings.colorPicker.field,
      attrs: {
        width: String(COLOR_FIELD_SIZE.width),
        height: String(COLOR_FIELD_SIZE.height),
        tabindex: "0",
        role: "application",
        "aria-label": strings.colorPicker.field,
      },
    });
    const hue = uiEl("canvas", {
      class: "colorpick__hue",
      title: strings.colorPicker.hue,
      attrs: {
        width: String(COLOR_FIELD_SIZE.width),
        height: String(COLOR_HUE_HEIGHT),
        tabindex: "0",
        role: "application",
        "aria-label": strings.colorPicker.hue,
      },
    });
    const chip = uiEl("span", { class: "colorpick__chip" });
    const chipBefore = uiEl("span", {
      class: "colorpick__chip colorpick__chip--before",
      title: strings.colorPicker.before,
      attrs: { style: "background:" + before },
    });
    const value = uiEl("span", { class: "colorpick__value" });
    const onPlan = uiEl("span", { class: "colorpick__plan", title: strings.colorPicker.onPlan });
    const swatches = uiEl("div", {
      class: "colorpick__palette",
      attrs: { role: "group", "aria-label": strings.colorPicker.palette },
    });
    const numbers = {};

    function numberField(key, label) {
      const input = uiEl("input", {
        class: "ui-input colorpick__number",
        type: "number",
        attrs: { min: "0", max: "255", step: "1", "aria-label": label },
        on: {
          input: () => {
            const rgb = {
              r: Number(numbers.r.value),
              g: Number(numbers.g.value),
              b: Number(numbers.b.value),
            };
            setColor(rgbToHex(rgb), input);
          },
          blur: () => sync(),
        },
      });
      numbers[key] = input;
      return uiEl("label", { class: "colorpick__number-box" }, [
        uiEl("span", { class: "colorpick__number-label", text: label }),
        input,
      ]);
    }

    // Единственное место, где перерисовывается всё сразу: поле, полоса,
    // превью, числа и отметка в палитре. Поле, в котором сейчас печатают,
    // не трогаем — иначе «12» на пути к «120» прыгало бы обратно.
    function sync(skip) {
      const color = colorHexOf(hsv);
      const rgb = hsvToRgb(hsv);
      colorDrawField(field, hsv);
      colorDrawHue(hue, hsv);
      chip.setAttribute("style", "background:" + color);
      chip.title = color;
      // Так цвет ляжет на белый план: линия контура и заливка помещения.
      onPlan.setAttribute(
        "style",
        "border-color:" + color + ";background:" + colorBlend(color, "#FFFFFF", COLOR_PLAN_ALPHA),
      );
      value.textContent = color;
      for (const [key, input] of Object.entries(numbers)) {
        if (input === skip) continue;
        input.value = String(rgb[key]);
      }
      for (const button of swatches.children) {
        const same = colorDistance(button.dataset.color, color) < 1;
        button.classList.toggle("is-active", same);
        button.setAttribute("aria-pressed", same ? "true" : "false");
      }
    }

    function setHsv(next, skip) {
      // Стрелки и полоса оттенка выезжают за края так же, как мышь, поэтому
      // и приводит их к цвету та же функция, что переводит курсор поля.
      hsv = colorFieldToHsv({ h: next.h, x: next.s, y: 1 - next.v });
      sync(skip);
    }

    function setColor(color, skip) {
      const rgb = hexToRgb(color);
      if (!rgb) return;
      const next = rgbToHsv(rgb);
      // Серый и чёрный не хранят оттенка — иначе ползунок прыгал бы к красному.
      setHsv({ h: next.s === 0 ? hsv.h : next.h, s: next.s, v: next.v }, skip);
    }

    for (const color of ROOM_PALETTE) {
      const busy = colorTaken(color, taken);
      const button = uiEl("button", {
        class: "colorpick__swatch" + (busy ? " is-used" : ""),
        type: "button",
        title: busy ? color + " — " + strings.colorPicker.used : color,
        attrs: { style: "background:" + color, "aria-label": color, "aria-pressed": "false" },
        on: { click: () => setColor(color) },
      });
      button.dataset.color = color;
      colorEnter(button, () => setColor(color));
      swatches.append(button);
    }

    colorDrag(field, (x, y) => setHsv(colorFieldToHsv({ h: hsv.h, x, y })));
    colorDrag(hue, (x) => setHsv({ h: x * 360, s: hsv.s, v: hsv.v }));

    field.addEventListener("keydown", (event) => {
      const step = event.shiftKey ? COLOR_STEP.coarse : COLOR_STEP.fine;
      const moves = {
        ArrowLeft: { s: -step, v: 0 },
        ArrowRight: { s: step, v: 0 },
        ArrowUp: { s: 0, v: step },
        ArrowDown: { s: 0, v: -step },
      };
      const move = moves[event.key];
      if (!move) return;
      event.preventDefault();
      setHsv({ h: hsv.h, s: hsv.s + move.s, v: hsv.v + move.v });
    });

    hue.addEventListener("keydown", (event) => {
      const step = event.shiftKey ? COLOR_STEP.hueCoarse : COLOR_STEP.hue;
      const moves = { ArrowLeft: -step, ArrowDown: -step, ArrowRight: step, ArrowUp: step };
      const move = moves[event.key];
      if (move == null) return;
      event.preventDefault();
      setHsv({ h: hsv.h + move, s: hsv.s, v: hsv.v });
    });

    const roll = () => setColor(randomColor([...taken, colorHexOf(hsv)]));
    const shuffle = colorEnter(
      uiButton(strings.colorPicker.random, { class: "ui-btn colorpick__random", on: { click: roll } }),
      roll,
    );

    const body = uiEl("div", { class: "colorpick" }, [
      uiEl("div", { class: "colorpick__side" }, [
        uiEl("p", { class: "colorpick__caption", text: strings.colorPicker.palette }),
        swatches,
      ]),
      uiEl("div", { class: "colorpick__side colorpick__side--custom" }, [
        uiEl("p", { class: "colorpick__caption", text: strings.colorPicker.custom }),
        field,
        hue,
        uiEl("div", { class: "colorpick__bottom" }, [
          uiEl("div", { class: "colorpick__preview" }, [chipBefore, chip, onPlan, value]),
          uiEl("div", { class: "colorpick__numbers" }, [
            numberField("r", strings.colorPicker.red),
            numberField("g", strings.colorPicker.green),
            numberField("b", strings.colorPicker.blue),
          ]),
        ]),
        shuffle,
      ]),
    ]);

    const done = (result) => {
      modal.close();
      resolve(result);
    };
    modal = uiModal({
      title: options.title || strings.colorPicker.title,
      body,
      actions: [
        uiButton(strings.dialog.cancel, { on: { click: () => done(null) } }),
        uiButton(strings.colorPicker.apply, {
          class: "ui-btn ui-btn--accent",
          on: { click: () => done(colorHexOf(hsv)) },
        }),
      ],
      dismissable: true,
      onCancel: () => resolve(null),
    });
    sync();
    field.focus();
  });
}

// Кнопка цвета в строке справочника или помещения: показывает текущий цвет
// и открывает окно выбора. Никаких `<input type="color">` в сборке больше нет.
function colorPickerButton({ value, used, title, dialogTitle, onPick }) {
  const button = uiEl("button", {
    class: "colorpick__button",
    type: "button",
    title: title || strings.colorPicker.title,
    attrs: { style: "background:" + (value || COLOR_FALLBACK), "aria-label": title || strings.colorPicker.title },
    on: {
      click: async () => {
        const picked = await openColorPicker({ color: value, used, title: dialogTitle || title });
        if (!picked) return;
        button.setAttribute("style", "background:" + picked);
        onPick(picked);
      },

// Панель выгрузки: две кнопки в шапке и два диалога — таблица и схема.
//
// Панель ничего не считает сама: таблицу строит `tables.js`, картинку и печать
// делает `exporter.js`. Здесь — выбор разбивки, области и множителя, да связь
// с состоянием сеанса: фильтр, схема и её план берутся ровно те, что на экране,
// поэтому скрытое фильтром не попадает ни в таблицу, ни в картинку, ни в легенду.









// Выбор пользователя живёт между открытиями диалога: разбивку и множитель
// выставляют один раз на объект, а выгружают много раз.
const exportChoice = {
  kind: "marks",
  groupBy: "category",
  currentScheme: false,
  area: "all",
  legend: true,
  outlines: true,
  tableScale: 2,
  schemeScale: 2,
};

function exportField(labelText, control) {
  return uiEl("label", { class: "export__field" }, [
    uiEl("span", { class: "export__field-label", text: labelText }),
    control,
  ]);
}

function exportSelect(options, value, onChange) {
  const select = uiEl("select", { class: "ui-input export__select", on: { change: () => onChange(select.value) } });
  for (const option of options) {
    const node = uiEl("option", { text: option.label, value: option.value });
    node.value = option.value;
    if (option.value === value) node.selected = true;
    select.append(node);
  }
  return select;
}

function exportCheck(labelText, checked, onChange) {
  const input = uiEl("input", { class: "export__check", type: "checkbox", on: { change: () => onChange(input.checked) } });
  input.checked = checked;
  return uiEl("label", { class: "export__toggle" }, [input, uiEl("span", { text: labelText })]);
}

function exportScaleSelect(value, onChange) {
  return exportSelect(
    EXPORT_SCALES.map((scale) => ({ value: String(scale), label: scale + "×" })),
    String(value),
    (next) => onChange(Number(next)),
  );
}

// Прямоугольник «как вижу» в пикселях плана: углы холста переводятся в доли
// плана тем же screenToPlan, что и клики по холсту.
function exportViewArea(state, scheme) {
  const host = document.getElementById("canvas-host");
  if (!host) return "all";
  const box = host.getBoundingClientRect();
  if (box.width < 2 || box.height < 2) return "all";
  const width = scheme.width > 0 ? scheme.width : 1000;
  const height = scheme.height > 0 ? scheme.height : 1000;
  const from = screenToPlan({ x: 0, y: 0 }, scheme, state.view);
  const to = screenToPlan({ x: box.width, y: box.height }, scheme, state.view);
  return {
    x: from.x * width,
    y: from.y * height,
    width: (to.x - from.x) * width,
    height: (to.y - from.y) * height,
  };
}

function exportAreaSize(state, scheme) {
  const area = exportChoice.area === "view" ? exportViewArea(state, scheme) : "all";
  if (area === "all") {
    return {
      width: scheme.width > 0 ? scheme.width : 1000,
      height: scheme.height > 0 ? scheme.height : 1000,
    };
  }
  const width = scheme.width > 0 ? scheme.width : 1000;
  const height = scheme.height > 0 ? scheme.height : 1000;
  return {
    width: Math.min(width, Math.max(1, area.width)),
    height: Math.min(height, Math.max(1, area.height)),
  };
}

// План схемы для рисования: уже разобранный на холсте — как есть, чужой —
// из хранилища. Разобранный здесь план здесь же и освобождается.
async function exportSchemeImage(state, scheme) {
  const loaded = state.schemeImage;
  if (loaded && loaded.schemeId === scheme.id && loaded.image) return { image: loaded.image, release: null };
  if (!scheme.imageId) return { image: null, release: null };
  const blob = await getImage(scheme.imageId);
  if (!blob) return { image: null, release: null };
  const decoded = await decodePlanImage(blob);
  return { image: decoded.image, release: () => releasePlanImage(decoded) };
}

function exportFilterOf(state) {
  return exportChoice.currentScheme && state.schemeId
    ? { ...state.filter, schemeId: state.schemeId }
    : state.filter;
}

function exportTableOf(state) {
  if (exportChoice.kind === "types") return typesTable(state.project);
  return marksTable(state.project, exportFilterOf(state), exportChoice.groupBy);
}

function exportSubtitleOf(state, table) {
  const scheme = state.schemeId ? findScheme(state.project, state.schemeId) : null;
  const parts = [text("exportPanel.rows", { count: tableRowCount(table) })];
  if (exportChoice.currentScheme && scheme) parts.push(scheme.name);
  return parts.join(" · ");
}

function exportBaseName(state, suffix) {
  const scheme = exportChoice.currentScheme && state.schemeId ? findScheme(state.project, state.schemeId) : null;
  return exportFileName(state.project, scheme, suffix);
}

function exportTableDialog(api) {
  const { getState, notify } = api;
  const state = getState();
  const preview = uiEl("div", { class: "export__preview" });
  const hint = uiEl("p", { class: "export__hint" });
  let table = exportTableOf(state);

  const refresh = () => {
    table = exportTableOf(state);
    preview.replaceChildren(
      exportTableNode(table, { title: table.title || state.project.name, subtitle: exportSubtitleOf(state, table) }),
    );
    hint.textContent = exportTableSizeText(table, exportChoice.tableScale);
  };

  const groupSelect = exportSelect(
    [
      { value: "category", label: strings.exportPanel.groupByCategory },
      { value: "type", label: strings.exportPanel.groupByType },
      { value: "room", label: strings.exportPanel.groupByRoom },
    ],
    exportChoice.groupBy,
    (value) => {
      exportChoice.groupBy = value;
      refresh();
    },
  );

  const kindSelect = exportSelect(
    [
      { value: "marks", label: strings.exportPanel.kindMarks },
      { value: "types", label: strings.exportPanel.kindTypes },
    ],
    exportChoice.kind,
    (value) => {
      exportChoice.kind = value;
      groupSelect.disabled = value === "types";
      refresh();
    },
  );
  groupSelect.disabled = exportChoice.kind === "types";

  const controls = uiEl("div", { class: "export__controls" }, [
    exportField(strings.exportPanel.kind, kindSelect),
    exportField(strings.exportPanel.groupBy, groupSelect),
    exportField(
      strings.exportPanel.scale,
      exportScaleSelect(exportChoice.tableScale, (value) => {
        exportChoice.tableScale = value;
        hint.textContent = exportTableSizeText(table, value);
      }),
    ),
    exportCheck(strings.exportPanel.currentScheme, exportChoice.currentScheme, (on) => {
      exportChoice.currentScheme = on;
      refresh();
    }),
  ]);

  const saved = (name) => notify(text("exportPanel.saved", { name }), "success");
  const guard = async (run) => {
    try {
      await run();
    } catch (error) {
      notify(error && error.message ? error.message : strings.exportPanel.failed, "error");
    }
  };

  const actions = [
    uiButton(strings.exportPanel.csv, {
      on: {
        click: () =>
          guard(async () => {
            const name = exportBaseName(state, "csv");
            exportText(toCsv(table), name, "text/csv;charset=utf-8");
            saved(name);
          }),
      },
    }),
    uiButton(strings.exportPanel.markdown, {
      on: {
        click: () =>
          guard(async () => {
            const name = exportBaseName(state, "md");
            exportText(toMarkdown(table), name, "text/markdown;charset=utf-8");
            saved(name);
          }),
      },
    }),
    uiButton(strings.exportPanel.copy, {
      on: {
        click: () =>
          guard(async () => {
            const ok = await exportCopy(toTsv(table));
            notify(ok ? strings.exportPanel.copied : strings.exportPanel.copyFailed, ok ? "success" : "error");
          }),
      },
    }),
    uiButton(strings.exportPanel.png, {
      on: {
        click: () =>
          guard(async () => {
            const blob = await tablePng(table, {
              scale: exportChoice.tableScale,
              title: table.title || state.project.name,
              subtitle: exportSubtitleOf(state, table),
            });
            const name = exportBaseName(state, "png");
            exportDownload(blob, name);
            saved(name);
          }),
      },
    }),
    uiButton(strings.exportPanel.print, {
      class: "ui-btn ui-btn--accent",
      on: {
        click: () =>
          guard(() =>
            printView("table", {
              table,
              title: table.title || state.project.name,
              subtitle: exportSubtitleOf(state, table),
              footer: state.project.name,
            }),
          ),
      },
    }),

  const modal = uiModal({
    title: strings.exportPanel.tableDialog,
    body: uiEl("div", { class: "export__body" }, [controls, hint, preview]),
    actions: [uiButton(strings.dialog.close, { on: { click: () => modal.close() } }), ...actions],
    primary: actions[actions.length - 1],
  });
  refresh();
}

function exportSchemeDialog(api) {
  const { getState, notify } = api;
  const state = getState();
  const scheme = findScheme(state.project, state.schemeId);
  const hint = uiEl("p", { class: "export__hint" });

  const refreshHint = () => {
    const size = exportAreaSize(state, scheme);
    hint.textContent = exportSizeText(size.width, size.height, exportChoice.schemeScale);
  };

  const controls = uiEl("div", { class: "export__controls" }, [
    exportField(
      strings.exportPanel.area,
      exportSelect(
        [
          { value: "all", label: strings.exportPanel.areaAll },
          { value: "view", label: strings.exportPanel.areaView },
        ],
        exportChoice.area,
        (value) => {
          exportChoice.area = value;
          refreshHint();
        },
      ),
    ),
    exportField(
      strings.exportPanel.scale,
      exportScaleSelect(exportChoice.schemeScale, (value) => {
        exportChoice.schemeScale = value;
        refreshHint();
      }),
    ),
    exportCheck(strings.exportPanel.withLegend, exportChoice.legend, (on) => {
      exportChoice.legend = on;
    }),
    exportCheck(strings.exportPanel.withRooms, exportChoice.outlines, (on) => {
      exportChoice.outlines = on;
    }),
  ]);

  const guard = async (run) => {
    try {
      await run();
    } catch (error) {
      notify(error && error.message ? error.message : strings.exportPanel.failed, "error");
    }
  };

  const renderScheme = async () => {
    const { image, release } = await exportSchemeImage(state, scheme);
    // План может быть не загружен — метки тогда лягут на белый лист, и лучше
    // сказать об этом, чем отдать «пустую» на вид картинку молча.
    if (!image) notify(strings.exportPanel.noImage, "info");
    try {
      return await schemePng(state.project, scheme, image, {
        area: exportChoice.area === "view" ? exportViewArea(state, scheme) : "all",
        scale: exportChoice.schemeScale,
        legend: exportChoice.legend,
        outlines: exportChoice.outlines,
        filter: state.filter,
      });
    } finally {
      if (release) release();
    }
  };

  const actions = [
    uiButton(strings.exportPanel.allSchemes, {
      on: {
        click: () =>
          guard(async () => {
            notify(strings.exportPanel.busy, "info");
            const images = new Map();
            for (const item of schemesInOrder(state.project)) {
              if (!item.imageId || images.has(item.imageId)) continue;
              const blob = await getImage(item.imageId);
              if (blob) images.set(item.imageId, blob);
            }
            const zip = await allSchemesZip(state.project, images, {
              scale: exportChoice.schemeScale,
              legend: exportChoice.legend,
              outlines: exportChoice.outlines,
              filter: state.filter,
            });
            const name = exportFileName(state.project, strings.exportPanel.schemesSuffix, "zip");
            exportDownload(zip, name);
            notify(text("exportPanel.schemesDone", { count: state.project.schemes.length }), "success");
          }),
      },
    }),
    uiButton(strings.exportPanel.print, {
      on: {
        click: () =>
          guard(async () => {
            const blob = await renderScheme();
            await printView("scheme", { blob, title: state.project.name + " · " + scheme.name });
          }),
      },
    }),
    uiButton(strings.exportPanel.download, {
      class: "ui-btn ui-btn--accent",
      on: {
        click: () =>
          guard(async () => {
            const blob = await renderScheme();
            const name = exportFileName(state.project, scheme, "png");
            exportDownload(blob, name);
            notify(text("exportPanel.saved", { name }), "success");
          }),
      },
    }),
  ];

  const modal = uiModal({
    title: strings.exportPanel.schemeDialog,
    body: uiEl("div", { class: "export__body" }, [controls, hint]),
    actions: [uiButton(strings.dialog.close, { on: { click: () => modal.close() } }), ...actions],
    primary: actions[actions.length - 1],
  });
  refreshHint();
}

  subscribe(sync);

}

// src/panels/rooms.js
// Помещения объекта: заводятся на ходу из поля «Помещение» в списке меток,
// правятся и удаляются в своём окне.
//
// Своего справочника комнат пользователь не заполняет заранее — он пишет
// «Спальная Оли» в строке метки, и комната появляется. Поэтому главное здесь —
// не окно, а `roomsEnsure`: одно и то же название не должно плодить двойников.





// Кружок цвета помещения: тем же цветом обводится его контур на схеме.
function roomSwatch(color, size = 14) {
  return uiEl("span", {
    class: "rooms__swatch",
    attrs: { style: `width:${size}px;height:${size}px;background:${color || "#8B949E"}` },
  });
}

// Кнопка цвета помещения: открывает своё окно выбора. Занятыми в него уходят
// и цвета соседних комнат, и цвета категорий: контуров на плане бывает
// десяток, а метка своей же комнаты не должна повторять цвет её заливки.
function roomColorField(project, room, onChange) {
  return colorPickerButton({
    value: room.color,
    used: colorsInUse(project, { exceptRoomId: room.id }),
    title: strings.rooms.color,
    onPick: onChange,
  });
}

function roomsKey(name) {
  return String(name == null ? "" : name).trim().toLowerCase();
}
function roomsFind(project, name) {
  const key = roomsKey(name);
  if (!key) return null;
  return project.rooms.find((room) => roomsKey(room.name) === key) || null;
}

// «Было или заведём»: пустое название — это «без помещения», а не комната
// с пустым именем.
function roomsEnsure(project, name) {
  const found = roomsFind(project, name);
  if (found) return { project, room: found };
  if (!roomsKey(name)) return { project, room: null };
  const created = addRoom(project, name);
  return { project: created.project, room: created.room };
}
function roomsUsage(project, roomId) {
  return project.marks.filter((mark) => mark.roomId === roomId).length;
}
function openRoomsEditor(api) {
  const list = uiEl("div", { class: "rooms" });
  const input = uiEl("input", {
    class: "ui-input",
    type: "text",
    placeholder: strings.rooms.namePlaceholder,
    on: {
      keydown: (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        addFromInput();
      },
    },
  });

  function project() {
    return api.getState().project;
  }

  // Перерисовка приходит подпиской на объект: так окно обновляется и от своей
  // команды, и от чужой — например, от Ctrl+Z, пока оно открыто.
  function commit(after, label) {
    canvasCommit(project(), after, label);
  }

  function fail(error) {
    api.notify(error && error.message ? error.message : String(error), "error");
  }

  function addFromInput() {
    const name = input.value.trim();
    if (!name) return;
    if (roomsFind(project(), name)) {
      input.value = "";
      return;
    }
    try {
      commit(addRoom(project(), name).project, strings.history.addRoom);
      input.value = "";
    } catch (error) {
      fail(error);
    }
  }

  function rename(roomId, name) {
    const current = findRoom(project(), roomId);
    if (!current || name.trim() === current.name) return;
    try {
      commit(updateRoom(project(), roomId, { name }).project, strings.history.renameRoom);
    } catch (error) {
      fail(error);
      render();
    }
  }

  function recolor(roomId, color) {
    const current = findRoom(project(), roomId);
    // Поле цвета отдаёт значение в нижнем регистре, модель хранит в верхнем:
    // сравнение без учёта регистра бережёт историю от пустого шага.
    if (!current || String(current.color || "").toUpperCase() === String(color).toUpperCase()) return;
    try {
      commit(updateRoom(project(), roomId, { color }).project, strings.history.roomColor);
    } catch (error) {
      fail(error);
      render();
    }
  }

  async function remove(roomId) {
    const current = findRoom(project(), roomId);
    if (!current) return;
    const agreed = await uiConfirm({
      title: strings.rooms.removeTitle,
      message: text("rooms.removeMessage", { name: current.name, count: roomsUsage(project(), roomId) }),
      confirmLabel: strings.dialog.confirm,
    });
    if (!agreed) return;
    commit(deleteRoom(project(), roomId).project, strings.history.removeRoom);
  }

  function render() {
    const rooms = roomsInOrder(project());
    if (rooms.length === 0) {
      list.replaceChildren(uiEl("p", { class: "panel__empty", text: strings.rooms.empty }));
      return;
    }
    list.replaceChildren(
      ...rooms.map((room) =>
        uiEl("div", { class: "rooms__row" }, [
          uiEl("input", {
            class: "ui-input",
            type: "text",
            value: room.name,
            on: { change: (event) => rename(room.id, event.target.value) },
          }),
          roomColorField(project(), room, (color) => recolor(room.id, color)),
          uiEl("span", {
            class: "rooms__count",
            text: text("rooms.marks", { count: roomsUsage(project(), room.id) }),
          }),
          uiButton("🗑", {
            class: "ui-btn ui-btn--danger",
            title: strings.rooms.remove,
            on: { click: () => remove(room.id) },
          }),
        ]),
      ),
    );
  }

  render();
  const unsubscribe = api.subscribe((state, changed) => {
    if ("project" in changed) render();
  });
  const modal = uiModal({
    title: strings.rooms.title,
    body: uiEl("div", { class: "rooms__box" }, [
      list,
      uiEl("div", { class: "rooms__add" }, [
        input,
        uiButton(strings.rooms.add, { class: "ui-btn ui-btn--accent", on: { click: () => addFromInput() } }),
      ]),
    ]),
    actions: [uiButton(strings.dialog.close, { on: { click: () => close() } })],
    onCancel: () => unsubscribe(),
  });
  function close() {
    unsubscribe();
    modal.close();
  }
  return { close };
}

// Окно выбора помещения для обводки: список комнат объекта плюс поле «новое».
// Устроено как выбор типа метки — по той же причине: выбранное помещение
// «залипает», и следующий контур рисуется без диалога.
function openRoomPicker(project, options = {}) {
  return new Promise((resolve) => {
    let modal;
    let current = project;
    const done = (result) => {
      modal.close();
      resolve(result || null);
    };

    const list = uiEl("div", { class: "picker__list" });
    const input = uiEl("input", {
      class: "ui-input",
      type: "text",
      placeholder: strings.rooms.namePlaceholder,
      on: {
        keydown: (event) => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          create();
        },
      },
    });

    function create() {
      const name = input.value.trim();
      if (!name) return;
      const found = roomsFind(current, name);
      if (found) {
        done({ roomId: found.id, project: current, created: false });
        return;
      }
      const result = addRoom(current, name);
      done({ roomId: result.room.id, project: result.project, created: true });
    }

    function renderList() {
      const rooms = roomsInOrder(current);
      if (rooms.length === 0) {
        list.replaceChildren(uiEl("p", { class: "panel__empty", text: strings.rooms.empty }));
        return;
      }
      list.replaceChildren(
        ...rooms.map((room) =>
          uiEl(
            "button",
            {
              class: "picker__row" + (room.id === options.activeRoomId ? " is-active" : ""),
              type: "button",
              on: { click: () => done({ roomId: room.id, project: current, created: false }) },
            },
            [roomSwatch(room.color, 16), uiEl("span", { class: "picker__name", text: room.name })],
          ),
        ),
      );
    }

    renderList();
    modal = uiModal({
      title: options.title || strings.rooms.pickTitle,
      body: uiEl("div", { class: "picker" }, [
        list,
        uiEl("div", { class: "rooms__add" }, [
          input,
          uiButton(strings.rooms.add, { class: "ui-btn ui-btn--accent", on: { click: () => create() } }),
        ]),
      ]),
      actions: [uiButton(strings.dialog.cancel, { on: { click: () => done(null) } })],
      dismissable: true,
      onCancel: () => resolve(null),
    });
  });
}

// src/panels/types.js
// Справочник объекта: типы меток, категории, помещения и шаблон для новых
// объектов.
//
// Справочник у каждого объекта свой — правка типов здесь не трогает соседние
// объекты. Общим остаётся только шаблон: снимок справочника в настройках
// браузера, с которого панель объектов создаёт следующий объект; уже
// созданные остаются как были.
const TYPE_TEMPLATE_KEY = "typeTemplate";
const TYPES_SWATCH_SIZE = 34;

function typesSnapshot(project) {
  return {
    categories: project.categories.map((category) => ({
      id: category.id,
      name: category.name,
      color: category.color,
      shape: category.shape,
    })),
    markTypes: project.markTypes.map((type) => ({
      categoryId: type.categoryId,
      code: type.code,
      name: type.name,
      shape: type.shape,
      blockMode: type.blockMode,
    })),
  };
}

// Шаблон для `createProject`: те же категории и типы, но с новыми
// идентификаторами — два объекта не должны делить ни одну запись справочника.
// Форма и режим блока сверяются со списками модели: шаблон мог быть сохранён
// давно, а неизвестное значение объект бы уже не принял.
function typesTemplateFrom(template) {
  if (!template || !Array.isArray(template.categories) || !Array.isArray(template.markTypes)) return null;
  const ids = new Map();
  const categories = template.categories.map((category, index) => {
    const id = globalThis.crypto.randomUUID();
    ids.set(category.id, id);
    return {
      id,
      name: category.name,
      color: category.color,
      shape: SHAPE_NAMES.includes(category.shape) ? category.shape : SHAPE_NAMES[0],
      order: index,
    };
  });
  const markTypes = template.markTypes
    .filter((type) => ids.has(type.categoryId))
    .map((type, index) => ({
      id: globalThis.crypto.randomUUID(),
      categoryId: ids.get(type.categoryId),
      code: type.code,
      name: type.name,
      shape: SHAPE_NAMES.includes(type.shape) ? type.shape : null,
      blockMode: BLOCK_MODES.includes(type.blockMode) ? type.blockMode : BLOCK_MODES[0],
      order: index,
    }));
  if (categories.length === 0 || markTypes.length === 0) return null;
  return { categories, markTypes };
}

function typesShapeCell({ shape, color, active, inherit, onPick }) {
  const cell = uiEl(
    "button",
    {
      class: "shapes__cell" + (active ? " is-active" : "") + (inherit ? " shapes__cell--inherit" : ""),
      type: "button",
      title: inherit ? strings.shapes.inherit : strings.shapes[shape] || shape,
      on: { click: onPick },
    },
    [shapeIcon(shape, color, TYPES_SWATCH_SIZE)],
  );
  return cell;
}

// Выбор формы — сетка нарисованных фигур, а не список названий: обозначение
// узнают в лицо, а не по слову. Вариант «как у категории» стоит первой ячейкой
// и показывает фигуру категории с пометкой.
function openTypesShapePicker({ shape, color, allowInherit, inheritShape }) {
  return new Promise((resolve) => {
    let modal;
    const done = (result) => {
      modal.close();
      resolve(result);
    };
    const cells = [];
    if (allowInherit) {
      cells.push(
        typesShapeCell({
          shape: inheritShape || SHAPE_PALETTE[0],
          color,
          active: !shape,
          inherit: true,
          onPick: () => done({ shape: null }),
        }),
      );
    }
    for (const name of SHAPE_PALETTE) {
      cells.push(
        typesShapeCell({ shape: name, color, active: shape === name, onPick: () => done({ shape: name }) }),
      );
    }
    modal = uiModal({
      title: strings.dictionary.shape,
      body: uiEl("div", { class: "shapes" }, cells),
      actions: [uiButton(strings.dialog.cancel, { on: { click: () => done(null) } })],
      onCancel: () => resolve(null),
    });
  });
}

function typesShapeButton({ shape, color, allowInherit, inheritShape, onPick }) {
  const button = uiEl(
    "button",
    {
      class: "dict__shape" + (allowInherit && !shape ? " dict__shape--inherit" : ""),
      type: "button",
      // В подсказке — имя того, что выбрано сейчас: у снятых с палитры фигур
      // это единственное место, где видно, как называется старое значение.
      title: shape ? strings.shapes[shape] || shape : allowInherit ? strings.shapes.inherit : strings.dictionary.shape,
      on: {
        click: async () => {
          const picked = await openTypesShapePicker({ shape, color, allowInherit, inheritShape });
          if (picked) onPick(picked.shape);
        },
      },
    },
    [shapeIcon(shape || inheritShape || SHAPE_PALETTE[0], color, 26)],
  );
  return button;
}

// Предпросмотр уплотнения: строка на обозначение, а не на метку. И старый
// номер, и новый берутся из ответа `compactNumbers` — своей нумерации у панели
// нет, иначе окно обещало бы одно, а команда делала другое. `count` показывает
// намеренный повтор: две метки Т1 останутся двумя Т1, и это видно до нажатия.
// Строки идут по новому номеру: так виден будущий ряд, а не прошлый.
function typesCompactPreview(project, typeId) {
  const type = findType(project, typeId);
  if (!type) return { code: "", rows: [], changes: [] };
  const result = compactNumbers(project, typeId);
  const rows = new Map();
  for (const mark of project.marks) {
    if (mark.typeId !== typeId) continue;
    const after = findMark(result.project, mark.id);
    const to = after ? after.number : mark.number;
    let row = rows.get(mark.number);
    if (!row) {
      row = { from: mark.number, to, fromLabel: type.code + mark.number, toLabel: type.code + to, count: 0 };
      rows.set(mark.number, row);
    }
    row.count += 1;
  }
  return {
    code: type.code,
    rows: [...rows.values()].sort((a, b) => (a.to === b.to ? a.from - b.from : a.to - b.to)),
    changes: result.changes,
  };
}

// Подпись списка замен: по ней окно и применение договариваются, что речь об
// одном и том же. Сравниваются обозначения и число меток за каждым — ровно то,
// что пользователь видел и одобрил; правка, не трогающая номера, подпись не
// меняет и переспрашивать не заставляет.
function typesCompactSignature(preview) {
  return [preview.code, ...preview.rows.map((row) => row.from + ">" + row.to + "*" + row.count)].join("|");
}

// Уплотнение разрушающее (ADR 003): после него распечатка на руках у монтажника
// начинает врать. Поэтому окно показывает замены целиком и говорит о цене —
// подтверждение здесь не украшение, а часть команды.
function openTypesCompactPreview(preview, { stale } = {}) {
  return new Promise((resolve) => {
    let modal;
    const done = (value) => {
      modal.close();
      resolve(value);
    };
    const rows = preview.rows.map((row) =>
      uiEl("div", { class: "compact__row" + (row.from === row.to ? " is-same" : "") }, [
        uiEl("span", { class: "compact__label", text: row.fromLabel }),
        uiEl("span", { class: "compact__arrow", text: "→" }),
        uiEl("span", { class: "compact__label", text: row.toLabel }),
        row.count > 1
          ? uiEl("span", { class: "compact__repeat", text: text("dictionary.compactRepeat", { count: row.count }) })
          : null,
      ]),
    );
    modal = uiModal({
      title: text("dictionary.compactTitle", { code: preview.code }),
      body: uiEl("div", { class: "compact" }, [
        stale ? uiEl("p", { class: "compact__warning", text: strings.dictionary.compactStale }) : null,
        uiEl("p", { class: "modal__text", text: text("dictionary.compactSummary", { count: preview.changes.length }) }),
        uiEl("div", { class: "compact__rows" }, rows),
        uiEl("p", { class: "compact__warning", text: strings.dictionary.compactWarning }),
      ]),
      actions: [
        uiButton(strings.dialog.cancel, { on: { click: () => done(false) } }),
        uiButton(strings.dictionary.compactApply, {
          class: "ui-btn ui-btn--danger",
          on: { click: () => done(true) },
        }),
      ],
      onCancel: () => resolve(false),
    });
  });
}
function openTypesDictionary(api) {
  const body = uiEl("div", { class: "dict" });

  function project() {
    return api.getState().project;
  }

  function fail(error) {
    api.notify(error && error.message ? error.message : String(error), "error");
    render();
  }

  // Своей перерисовки после команды не нужно: правка объекта приходит подпиской,
  // и тем же путём приходит чужая — Ctrl+Z при открытом окне.
  function commit(build, label) {
    try {
      canvasCommit(project(), build(project()), label);
    } catch (error) {
      fail(error);
    }
  }

  function categorySelect(value, onPick) {
    const select = uiEl("select", {
      class: "ui-select",
      title: strings.dictionary.category,
      on: { change: (event) => onPick(event.target.value) },
    });
    for (const category of project().categories) {
      select.append(uiEl("option", { value: category.id, text: category.name }));
    }
    select.value = value || "";
    return select;
  }

  // Уплотнение — по одному типу, как просил заказчик: тип назван явно, строкой
  // справочника, а не «весь объект разом».
  async function compactType(type) {
    let preview = typesCompactPreview(project(), type.id);
    let stale = false;
    // Пока окно висит открытым, объект могли поменять — поставить метку, вернуть
    // номера чужим Ctrl+Z. Применяем по свежему объекту (иначе уплотняли бы
    // вчерашнее состояние), но молча подменить одобренный список нельзя: если
    // замены разошлись, показываем новые и спрашиваем заново.
    for (;;) {
      if (preview.changes.length === 0) {
        api.notify(text("dictionary.compactNothing", { code: type.code }), "info");
        return;
      }
      const agreed = await openTypesCompactPreview(preview, { stale });
      if (!agreed) return;
      const fresh = typesCompactPreview(project(), type.id);
      if (typesCompactSignature(fresh) === typesCompactSignature(preview)) {
        commit((current) => compactNumbers(current, type.id).project, strings.history.compact);
        return;
      }
      preview = fresh;
      stale = true;
    }
  }

  async function removeType(type) {
    const agreed = await uiConfirm({
      title: strings.dictionary.removeTypeTitle,
      message: text("dictionary.removeTypeMessage", { code: type.code, name: type.name }),
      confirmLabel: strings.dialog.confirm,
    });
    if (!agreed) return;
    commit((current) => deleteType(current, type.id).project, strings.history.removeType);
  }

  async function removeCategory(category) {
    const agreed = await uiConfirm({
      title: strings.dictionary.removeCategoryTitle,
      message: text("dictionary.removeCategoryMessage", { name: category.name }),
      confirmLabel: strings.dialog.confirm,
    });
    if (!agreed) return;
    commit((current) => deleteCategory(current, category.id).project, strings.history.removeCategory);
  }

  function typeRow(type, count) {
    const category = findCategory(project(), type.categoryId);
    const style = styleOf(project(), type.id);
    // Невозможное действие видно невозможным: тип с метками не удаляется,
    // и кнопка об этом говорит до нажатия, а не после.
    const removeButton = uiButton("🗑", {
      class: "ui-btn ui-btn--danger",
      title: count > 0 ? text("errors.typeHasMarks", { code: type.code, count }) : strings.dictionary.removeType,
      on: { click: () => removeType(type) },
    });
    removeButton.disabled = count > 0;
    // Уплотнение живёт в строке типа: тип назван, и рядом видно, скольких меток
    // команда коснётся.
    const compactButton = uiButton("№", {
      class: "ui-btn",
      title:
        count > 0
          ? text("dictionary.compactHint", { code: type.code })
          : text("dictionary.compactEmpty", { code: type.code }),
      on: { click: () => compactType(type) },
    });
    compactButton.disabled = count === 0;
    return uiEl("div", { class: "dict__row" }, [
      shapeIcon(style.shape, style.color, 20),
      uiEl("input", {
        class: "ui-input dict__code",
        type: "text",
        value: type.code,
        title: strings.dictionary.code,
        attrs: { maxlength: String(CODE_MAX_LENGTH) },
        on: {
          change: (event) =>
            commit((current) => updateType(current, type.id, { code: event.target.value }).project, strings.history.editType),
        },
      }),
      uiEl("input", {
        class: "ui-input",
        type: "text",
        value: type.name,
        title: strings.dictionary.name,
        on: {
          change: (event) =>
            commit((current) => updateType(current, type.id, { name: event.target.value }).project, strings.history.editType),
        },
      }),
      categorySelect(type.categoryId, (categoryId) =>
        commit((current) => updateType(current, type.id, { categoryId }).project, strings.history.editType),
      ),
      typesShapeButton({
        shape: type.shape,
        color: category ? category.color : "#57606A",
        allowInherit: true,
        inheritShape: category ? category.shape : SHAPE_PALETTE[0],
        onPick: (shape) =>
          commit((current) => updateType(current, type.id, { shape }).project, strings.history.editType),
      }),
      uiEl("span", { class: "dict__count", text: String(count), title: strings.dictionary.marks }),
      compactButton,
      removeButton,
    ]);
  }

  function categoryRow(category) {
    const types = project().markTypes.filter((type) => type.categoryId === category.id).length;
    const removeButton = uiButton("🗑", {
      class: "ui-btn ui-btn--danger",
      title: types > 0 ? strings.errors.categoryHasTypes : strings.dictionary.removeCategory,
      on: { click: () => removeCategory(category) },
    });
    removeButton.disabled = types > 0;
    return uiEl("div", { class: "dict__row" }, [
      colorPickerButton({
        value: category.color,
        used: colorsInUse(project(), { exceptCategoryId: category.id }),
        title: strings.dictionary.color,
        onPick: (color) =>
          commit(
            (current) => updateCategory(current, category.id, { color }).project,
            strings.history.editCategory,
          ),
      }),
      uiEl("input", {
        class: "ui-input",
        type: "text",
        value: category.name,
        title: strings.dictionary.name,
        on: {
          change: (event) =>
            commit(
              (current) => updateCategory(current, category.id, { name: event.target.value }).project,
              strings.history.editCategory,
            ),
        },
      }),
      typesShapeButton({
        shape: category.shape,
        color: category.color,
        allowInherit: false,
        onPick: (shape) =>
          commit((current) => updateCategory(current, category.id, { shape }).project, strings.history.editCategory),
      }),
      removeButton,
    ]);
  }

  function addTypeRow() {
    const code = uiEl("input", {
      class: "ui-input dict__code",
      type: "text",
      placeholder: strings.dictionary.codePlaceholder,
      attrs: { maxlength: String(CODE_MAX_LENGTH) },
    });
    const name = uiEl("input", {
      class: "ui-input",
      type: "text",
      placeholder: strings.dictionary.typeNamePlaceholder,
    });
    let categoryId = project().categories.length > 0 ? project().categories[0].id : "";
    const add = () =>
      commit(
        (current) => addType(current, { code: code.value, name: name.value, categoryId }).project,
        strings.history.addType,
      );
    return uiEl("div", { class: "dict__row dict__row--add" }, [
      code,
      name,
      categorySelect(categoryId, (value) => {
        categoryId = value;
      }),
      uiButton(strings.dictionary.addType, { class: "ui-btn ui-btn--accent", on: { click: add } }),
    ]);
  }

  function addCategoryRow() {
    const name = uiEl("input", {
      class: "ui-input",
      type: "text",
      placeholder: strings.dictionary.categoryNamePlaceholder,
    });
    // Цвет новой категории — незанятый цвет палитры: метки новой категории
    // должны быть видны отдельно и от соседних меток, и от заливки помещений.
    const busy = colorsInUse(project());
    let color = freeColor(busy);
    let shape = SHAPE_PALETTE[0];
    const colorButton = colorPickerButton({
      value: color,
      used: busy,
      title: strings.dictionary.color,
      onPick: (picked) => {
        color = picked;
        shapeButton.replaceChildren(shapeIcon(shape, color, 26));
      },
    });
    const shapeButton = typesShapeButton({
      shape,
      color,
      allowInherit: false,
      onPick: (picked) => {
        shape = picked || SHAPE_PALETTE[0];
        shapeButton.replaceChildren(shapeIcon(shape, color, 26));
      },
    });
    const add = () =>
      commit(
        (current) => addCategory(current, { name: name.value, color, shape }).project,
        strings.history.addCategory,
      );
    return uiEl("div", { class: "dict__row dict__row--add" }, [
      colorButton,
      name,
      shapeButton,
      uiButton(strings.dictionary.addCategory, { class: "ui-btn ui-btn--accent", on: { click: add } }),
    ]);
  }

  function render() {
    const current = project();
    if (!current) {
      body.replaceChildren();
      return;
    }
    const counts = new Map();
    for (const mark of current.marks) counts.set(mark.typeId, (counts.get(mark.typeId) || 0) + 1);
    const typeRows = [];
    const shown = new Set();
    for (const { category, types } of typesInOrder(current)) {
      typeRows.push(uiEl("p", { class: "dict__group", text: category.name }));
      for (const type of types) {
        shown.add(type.id);
        typeRows.push(typeRow(type, counts.get(type.id) || 0));
      }
    }
    for (const type of current.markTypes) {
      if (!shown.has(type.id)) typeRows.push(typeRow(type, counts.get(type.id) || 0));
    }
    if (typeRows.length === 0) typeRows.push(uiEl("p", { class: "panel__empty", text: strings.dictionary.noTypes }));

    body.replaceChildren(
      uiEl("h4", { class: "dict__title", text: strings.dictionary.categories }),
      ...current.categories.map((category) => categoryRow(category)),
      addCategoryRow(),
      uiEl("h4", { class: "dict__title", text: strings.dictionary.types }),
      ...typeRows,
      addTypeRow(),
    );
  }

  render();
  // Окно живёт, пока его не закрыли, и показывает объект таким, какой он сейчас:
  // отмена чужого действия обновляет список, а не оставляет вчерашний.
  const unsubscribe = api.subscribe((state, changed) => {
    if ("project" in changed) render();
  });
  const modal = uiModal({
    title: strings.dictionary.title,
    body,
    actions: [uiButton(strings.dialog.close, { on: { click: () => close() } })],
    onCancel: () => unsubscribe(),
  });
  function close() {
    unsubscribe();
    modal.close();
  }
  return { close };
}

function mountTypesPanel(host, api) {
  const { getState, notify, subscribe } = api;

  const dictionaryButton = uiButton(strings.dictionary.open, {
    class: "ui-btn ui-btn--wide",
    on: { click: () => openTypesDictionary(api) },
  });
  const roomsButton = uiButton(strings.rooms.open, {
    class: "ui-btn ui-btn--wide",
    on: { click: () => openRoomsEditor(api) },
  });
  const saveButton = uiButton(strings.dictionary.saveTemplate, {
    class: "ui-btn ui-btn--wide",
    title: strings.dictionary.saveTemplateHint,
    on: { click: () => saveTemplate() },
  });
  const resetButton = uiButton(strings.dictionary.resetTemplate, {
    class: "ui-btn ui-btn--wide",
    on: { click: () => resetTemplate() },
  });
  // Кнопка возврата показывается, только когда шаблон и правда сохранён.
  resetButton.hidden = true;
  host.replaceChildren(uiEl("div", { class: "dict-panel" }, [dictionaryButton, roomsButton, saveButton, resetButton]));

  async function saveTemplate() {
    const state = getState();
    if (!state.project) return;
    await setSetting(TYPE_TEMPLATE_KEY, typesSnapshot(state.project));
    notify(strings.dictionary.templateSaved, "success");
    syncButtons();
  }

  async function resetTemplate() {
    await setSetting(TYPE_TEMPLATE_KEY, null);
    notify(strings.dictionary.templateReset, "success");
    syncButtons();
  }

  async function syncButtons() {
    const template = await getSetting(TYPE_TEMPLATE_KEY);
    resetButton.hidden = !template;
    const state = getState();
    dictionaryButton.disabled = !state.project;
    saveButton.disabled = !state.project;
  }

  subscribe((state, changed) => {
    if ("project" in changed) syncButtons();
  });
  syncButtons();
}

// src/panels/projects.js
// Объекты: список в шапке, переключение, переименование, удаление,
// первый запуск и автосохранение в браузер.
const LAST_PROJECT_KEY = "lastProjectId";
const SAVE_DELAY_MS = 400;

function uniqueProjectName(list) {
  const base = strings.project.untitled;
  const taken = new Set(list.map((item) => item.name));
  if (!taken.has(base)) return base;
  let index = 2;
  while (taken.has(base + " " + index)) index += 1;
  return base + " " + index;
}

function mountProjectsPanel(host, api) {
  const { getState, setState, notify, subscribe } = api;
  let known = [];
  let saveTimer = null;
  let lowSpaceReported = false;

  const select = uiEl("select", {
    class: "ui-select",
    title: strings.projects.switch,
    on: {
      change: () => {
        const id = select.value;
        if (id && id !== currentId()) openProjectById(id);
      },
    },
  });
  const renameButton = uiButton("✎", {
    title: strings.projects.rename,
    on: { click: () => renameCurrent() },
  });
  const createButton = uiButton("＋", {
    title: strings.projects.create,
    on: { click: () => createAndOpen() },
  });
  const removeButton = uiButton("🗑", {
    class: "ui-btn ui-btn--danger",
    title: strings.projects.remove,
    on: { click: () => removeCurrent() },
  });
  host.replaceChildren(select, createButton, renameButton, removeButton);

  function currentId() {
    const state = getState();
    return state.project ? state.project.id : "";
  }

  function renderList() {
    const id = currentId();
    select.replaceChildren();
    if (known.length === 0) {
      select.append(uiEl("option", { value: "", text: strings.projects.empty }));
    }
    for (const item of known) {
      select.append(uiEl("option", { value: item.id, text: item.name }));
    }
    select.value = id;
    const has = Boolean(id);
    renameButton.disabled = !has;
    removeButton.disabled = !has;
  }

  async function refreshList() {
    known = await listProjects();
    renderList();
  }

  async function openProjectById(id) {
    const project = await loadProject(id);
    if (!project) {
      await refreshList();
      return;
    }
    setState({
      project,
      schemeId: project.schemes.length > 0 ? project.schemes[0].id : null,
      selectedMarkIds: [],
      activeTypeId: null,
    });
    await setSetting(LAST_PROJECT_KEY, id);
    renderList();
  }

  // Новый объект начинается с сохранённого справочника, если он есть: копия
  // шаблона с новыми идентификаторами, дальше объект живёт своей жизнью.
  async function createAndOpen() {
    const saved = await getSetting(TYPE_TEMPLATE_KEY);
    const template = typesTemplateFrom(saved);
    const project = createProject({ name: uniqueProjectName(known), ...(template || {}) });
    await saveProject(project);
    await refreshList();
    setState({ project, schemeId: null, selectedMarkIds: [], activeTypeId: null });
    await setSetting(LAST_PROJECT_KEY, project.id);
    renderList();
    notify(text("projects.created", { name: project.name }), "success");
    return project;
  }

  async function renameCurrent() {
    const state = getState();
    if (!state.project) return;
    const name = await uiPrompt({
      title: strings.projects.renameTitle,
      value: state.project.name,
      placeholder: strings.projects.namePlaceholder,
    });
    if (!name || name === state.project.name) return;
    const next = updateProject(state.project, { name });
    setState({ project: next.project });
    await refreshList();
  }

  async function removeCurrent() {
    const state = getState();
    if (!state.project) return;
    const project = state.project;
    const agreed = await uiConfirm({
      title: strings.projects.removeTitle,
      message: text("projects.removeMessage", { name: project.name }),
      confirmLabel: strings.dialog.confirm,
    });
    if (!agreed) return;
    for (const scheme of project.schemes) {
      if (scheme.imageId) await deleteImage(scheme.imageId);
    }
    await deleteProject(project.id);
    setState({ project: null, schemeId: null, selectedMarkIds: [], activeTypeId: null });
    notify(text("projects.removed", { name: project.name }), "success");
    await refreshList();
    if (known.length > 0) await openProjectById(known[0].id);
    else showWelcome();
  }

  // Первый запуск: не пустая серая страница, а одна кнопка.
  function showWelcome() {
    const modal = uiModal({
      title: strings.projects.welcomeTitle,
      dismissable: false,
      body: uiEl("p", { class: "modal__text", text: strings.projects.welcomeText }),
      actions: [
        uiButton(strings.projects.createTitle, {
          class: "ui-btn ui-btn--accent",
          on: {
            click: async () => {
              modal.close();
              await createAndOpen();
            },
          },
        }),
      ],
    });
  }

  function scheduleSave(project) {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      saveTimer = null;
      const result = await saveProject(project);
      if (result.ok) {
        known = known.map((item) =>
          item.id === project.id
            ? { ...item, name: project.name, updatedAt: project.updatedAt, schemes: project.schemes.length, marks: project.marks.length }
            : item,
        );
        renderList();
        await checkSpace();
      }
    }, SAVE_DELAY_MS);
  }

  async function checkSpace() {
    if (lowSpaceReported) return;
    const space = await estimateSpace();
    if (!space.low) return;
    lowSpaceReported = true;
    notify(text("storage.lowSpace", { free: formatMegabytes(space.free) }), "error");
  }

  onStoreProblem((problem) => {
    notify(problem.kind === "unavailable" ? strings.storage.memory : strings.storage.writeFailed, "error");
  });

  subscribe((state, changed) => {
    if (!("project" in changed)) return;
    renderList();
    if (state.project) scheduleSave(state.project);
  });

  (async () => {
    await openStore();
    await refreshList();
    const lastId = await getSetting(LAST_PROJECT_KEY);
    const target = known.find((item) => item.id === lastId) || known[0] || null;
    if (target) await openProjectById(target.id);
    else showWelcome();
    await checkSpace();
    if (storeMode() === "memory") renderList();
  })();
}

registerPanel(PANEL_IDS.projectActions, mountProjectsPanel);

// src/panels/file.js
// Файл проекта: «Сохранить в файл», «Открыть файл», папка автосохранения
// и строка «в файл выгружено: N назад» в шапке.
//
// Панель тонкая: zip пишет и читает `projectFile.js`, переприсваивание
// идентификаторов и работу с папкой держит `autosave.js`. Здесь — кнопки,
// диалоги и связь с состоянием сеанса.
//
// Своей точки монтирования в разметке у панели нет: она создаёт контейнер в
// шапке сама, после того как каркас поднялся (`startApp` откладывается на конец
// загрузки, и наш обработчик встаёт в очередь следом).









// Строка «выгружено N назад» стареет сама по себе: раз в минуту обновляем.
const FILE_TICK_MS = 60000;

// Выбор при загрузке: по умолчанию новый объект, перезапись — отдельной
// кнопкой и с подтверждением. Возвращает "new" | "replace" | null.
function fileAskMode(project, hasCurrent) {
  return new Promise((resolve) => {
    let modal;
    const answer = (value) => {
      modal.close();
      resolve(value);
    };
    const asNew = uiButton(strings.file.loadAsNew, {
      class: "ui-btn ui-btn--accent",
      on: { click: () => answer("new") },
    });
    const actions = [uiButton(strings.dialog.cancel, { on: { click: () => answer(null) } })];
    if (hasCurrent) {
      actions.push(uiButton(strings.file.loadReplace, { on: { click: () => answer("replace") } }));
    }
    actions.push(asNew);
    modal = uiModal({
      title: strings.file.loadTitle,
      body: [
        uiEl("p", {
          class: "modal__text",
          text: text("file.loadSummary", {
            name: project.name,
            schemes: (project.schemes || []).length,
            marks: (project.marks || []).length,
          }),
        }),
        uiEl("p", { class: "modal__hint", text: strings.file.loadHint }),
      ],
      actions,
      primary: asNew,
      onCancel: () => resolve(null),
    });
  });
}

function mountFilePanel(host, api) {
  const { getState, setState, notify, subscribe } = api;
  // Ссылка на объект, который целиком уехал в файл: сравнение по ссылке
  // честнее флага — правка, пришедшая во время упаковки, оставит dirty.
  let fileSavedProject = null;
  let fileFailReported = false;

  const saveButton = uiButton(strings.file.save, {
    class: "ui-btn ui-btn--accent",
    title: strings.file.saveHint,
    on: { click: () => saveToFile() },
  });
  const openButton = uiButton(strings.file.open, {
    title: strings.file.openHint,
    on: { click: () => picker.click() },
  });
  const folderButton = uiButton(strings.autosave.pick, {
    title: strings.autosave.pickHint,
    on: { click: () => folderClick() },
  });
  const statusNode = uiEl("span", { class: "file__status" });
  const picker = uiEl("input", {
    class: "file__picker",
    type: "file",
    attrs: { accept: ".zip,application/zip", hidden: "hidden" },
    on: {
      change: async () => {
        const chosen = picker.files && picker.files[0];
        picker.value = "";
        if (chosen) await openFromFile(chosen);
      },
    },
  });

  const row = uiEl("div", { class: "file" }, [statusNode, folderButton, openButton, saveButton, picker]);
  host.replaceChildren(row);

  // ——— сохранение в файл ————————————————————————————————————————————

  async function saveToFile() {
    const project = getState().project;
    if (!project) {
      notify(strings.file.noProject, "error");
      return;
    }
    const line = uiEl("p", { class: "modal__text", text: strings.file.packing });
    const modal = uiModal({
      title: strings.file.packingTitle,
      body: line,
      actions: [],
      dismissable: false,
    });
    try {
      // Упаковка идёт через await на каждой записи: вкладка остаётся живой,
      // а строка прогресса успевает перерисоваться.
      const packedFile = await autosavePack(project, {
        onProgress: ({ done, total }) => {
          line.textContent = text("file.packingProgress", { done, total });
        },
      });
      exportDownload(packedFile.blob, packedFile.name);
      await autosaveNoteExport(project.id);
      markSaved(project);
      notify(text("file.saved", { name: packedFile.name }), "success");
    } catch (error) {
      notify((error && error.message) || strings.file.saveFailed, "error");
    } finally {
      modal.close();
      renderStatus();
    }
  }

  // ——— загрузка из файла ————————————————————————————————————————————

  async function openFromFile(chosen) {
    const line = uiEl("p", { class: "modal__text", text: strings.file.reading });
    const modal = uiModal({
      title: strings.file.readingTitle,
      body: line,
      actions: [],
      dismissable: false,
    });
    let loaded = null;
    try {
      loaded = await unpackProject(chosen, {
        onProgress: ({ done, total }) => {
          line.textContent = text("file.packingProgress", { done, total });
        },
      });
    } catch (error) {
      // Отказ ничего не трогает: текущий объект на экране и в базе как был.
      modal.close();
      notify((error && error.message) || strings.errors.notAProject, "error");
      return;
    }
    modal.close();

    const current = getState().project;
    const mode = await fileAskMode(loaded.project, Boolean(current));
    if (!mode) return;
    if (mode === "replace") {
      const agreed = await uiConfirm({
        title: strings.file.replaceTitle,
        message: text("file.replaceMessage", { name: current.name }),
        confirmLabel: strings.file.replaceConfirm,
      });
      if (!agreed) return;
    }
    await applyLoaded(loaded, mode, current);
  }

  async function applyLoaded(loaded, mode, current) {
    const line = uiEl("p", { class: "modal__text", text: strings.file.reading });
    const modal = uiModal({ title: strings.file.readingTitle, body: line, actions: [], dismissable: false });
    try {
      // Картинки сперва ложатся в хранилище — идентификаторы выдаёт оно,
      // и ровно эти идентификаторы получает приёмка объекта. Второго
      // переприсваивания в сборке нет: ссылки схем чинятся один раз.
      const imageIds = new Map();
      for (const [oldId, blob] of loaded.images) imageIds.set(oldId, await putImage(blob));
      const adopted = adoptLoadedProject(loaded, {
        mode,
        currentId: current ? current.id : null,
        imageIds,
      });
      await saveProject(adopted.project);
      await setSetting(LAST_PROJECT_KEY, adopted.project.id);

      const schemes = schemesInOrder(adopted.project);
      setState({
        project: adopted.project,
        schemeId: schemes.length > 0 ? schemes[0].id : null,
        selectedMarkIds: [],
        activeTypeId: null,
      });
      // Объект только что пришёл из файла — он и есть копия файла,
      // и отметка выгрузки принадлежит уже новому идентификатору.
      await autosaveNoteExport(adopted.project.id);
      markSaved(adopted.project);
      // Заменённый объект унёс с собой свои планы: картинки под старыми
      // идентификаторами больше никому не нужны.
      if (mode === "replace" && current) {
        for (const scheme of current.schemes || []) {
          if (scheme.imageId) await deleteImage(scheme.imageId);
        }
      }
      notify(text("file.loaded", { name: adopted.project.name }), "success");
    } catch (error) {
      notify((error && error.message) || strings.errors.notAProject, "error");
    } finally {
      modal.close();
      renderStatus();
    }
  }

  // ——— папка автосохранения ————————————————————————————————————————

  async function folderClick() {
    const status = autosaveStatus();
    if (!status.supported) {
      notify(strings.autosave.unsupported, "info");
      return;
    }
    if (status.folder && status.permission !== "granted") {
      await autosaveGrant();
      if (autosaveReady()) await writeToFolder();
      renderStatus();
      return;
    }
    if (status.folder) {
      folderDialog();
      return;
    }
    await pickFolder();
  }

  async function pickFolder() {
    try {
      await autosavePickFolder();
    } catch (error) {
      // Отмена в системном окне выбора папки — не ошибка. Отказ по file://
      // (SecurityError) — не поломка, а известное ограничение: страница,
      // открытая с диска, в папку сохранять не умеет.
      const name = error && error.name;
      if (name === "SecurityError" || name === "NotAllowedError") notify(strings.autosave.unsupported, "info");
      else if (name !== "AbortError") notify(strings.autosave.failed, "error");
      renderStatus();
      return;
    }
    if (autosaveReady()) await writeToFolder();
    renderStatus();
  }

  function folderDialog() {
    const status = autosaveStatus();
    let modal;
    modal = uiModal({
      title: strings.autosave.dialogTitle,
      body: uiEl("p", {
        class: "modal__text",
        text: text("autosave.dialogText", { name: status.folder, file: currentFileName() }),
      }),
      actions: [
        uiButton(strings.dialog.close, { on: { click: () => modal.close() } }),
        uiButton(strings.autosave.off, {
          class: "ui-btn ui-btn--danger",
          on: {
            click: async () => {
              modal.close();
              await autosaveForget();
              notify(strings.autosave.offDone, "info");
              renderStatus();
            },
          },
        }),
        uiButton(strings.autosave.change, {
          class: "ui-btn ui-btn--accent",
          on: {
            click: async () => {
              modal.close();
              await pickFolder();
            },
          },
        }),
      ],
    });
  }

  function currentFileName() {
    const project = getState().project;
    return project ? autosaveSnapshotName(project) : "";
  }

  // Первая запись сразу после выбора папки: пользователь должен увидеть файл
  // на месте, а не ждать следующей правки.
  async function writeToFolder() {
    const project = getState().project;
    if (!project || !autosaveReady()) return;
    onFolderWritten(await autosaveWrite(project));
  }

  // Об отказавшей записи говорим один раз — правок много, а беда одна.
  function onFolderWritten(result) {
    if (result && result.ok) {
      fileFailReported = false;
      if (result.project) markSaved(result.project);
    } else if (result && result.error && !fileFailReported) {
      fileFailReported = true;
      notify(strings.autosave.failed, "error");
    }
    renderStatus();
  }

  // ——— состояние и строка в шапке ————————————————————————————————————

  function markSaved(project) {
    fileSavedProject = project;
    if (getState().project === project) setState({ dirty: false });
  }

  function renderStatus() {
    const state = getState();
    const status = autosaveStatus();
    const projectId = state.project ? state.project.id : null;
    statusNode.textContent = text("file.exported", { ago: autosaveAgoText(autosaveLastExport(projectId)) });
    statusNode.title = status.supported ? "" : strings.autosave.unsupported;
    row.classList.toggle("is-busy", Boolean(status.busy));
    row.classList.toggle("is-dirty", Boolean(state.dirty));

    folderButton.hidden = !status.supported;
    if (!status.supported) return;
    if (!status.folder) {
      folderButton.textContent = strings.autosave.pick;
      folderButton.title = strings.autosave.pickHint;
      folderButton.classList.remove("is-on");
      return;
    }
    if (status.permission !== "granted") {
      folderButton.textContent = strings.autosave.allow;
      folderButton.title = text("autosave.allowHint", { name: status.folder });
      folderButton.classList.remove("is-on");
      return;
    }
    folderButton.textContent = text("autosave.folder", { name: status.folder });
    folderButton.title = strings.autosave.dialogTitle;
    folderButton.classList.add("is-on");
  }

  // Список объектов держит своя панель и перечитывает его по своим поводам:
  // объект, пришедший из файла, ей неизвестен. Чиним ровно одно — чтобы в
  // выпадающем списке стоял тот объект, который на экране.
  function syncProjectSelect(project) {
    const select = document.querySelector("#project-actions select");
    if (!select || !project) return;
    let option = [...select.options].find((item) => item.value === project.id);
    if (!option) {
      option = uiEl("option", { value: project.id, text: project.name });
      select.append(option);
    }
    option.textContent = project.name;
    select.value = project.id;
  }

  // Панель объектов перечитывает свой список только по своим поводам, в том
  // числе отложенно, после сохранения в браузер, — и объект, пришедший из
  // файла, ей неизвестен. Поэтому чиним не однажды, а на каждую перерисовку
  // списка: в нём должен стоять тот объект, который сейчас на экране.
  const projectSelect = document.querySelector("#project-actions select");
  if (projectSelect && typeof MutationObserver === "function") {
    new MutationObserver(() => syncProjectSelect(getState().project)).observe(projectSelect, { childList: true });
  }

  subscribe((state, changed) => {
    if (!("project" in changed)) {
      if ("dirty" in changed) row.classList.toggle("is-dirty", Boolean(state.dirty));
      return;
    }
    syncProjectSelect(state.project);
    if (state.project && state.project !== fileSavedProject) {
      // Не вложенным вызовом: подписчики сейчас в середине обхода.
      queueMicrotask(() => {
        if (getState().project !== fileSavedProject) setState({ dirty: true });
      });
      // Пока папка выбрана, «несохранённого» состояния почти не бывает:
      // запись уходит сама, с задержкой и по одной за раз.
      autosaveSchedule(state.project, { onDone: onFolderWritten });
    }
    renderStatus();
  });

  // Ctrl+S — привычка, а не сюрприз: браузерное «сохранить страницу» здесь
  // бесполезно. Пока открыт диалог, горячие клавиши молчат.
  document.addEventListener("keydown", (event) => {
    if (!(event.ctrlKey || event.metaKey) || event.key !== "s") return;
    if (uiDialogDepth() > 0) return;
    event.preventDefault();
    saveToFile();
  });

  // Вкладку прячут чаще, чем закрывают, и это единственный момент, когда
  // дослать отложенную запись можно по-настоящему: обработчик закрытия уже
  // ничего не дождётся.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && autosavePendingWrite()) autosaveFlush({ onDone: onFolderWritten });
  });

  // Работа, которой нет ни в папке, ни в файле, не должна уезжать молча.
  // Отложенную запись досылаем прямо здесь — она успеет, если пользователь
  // задержится на вопросе или передумает закрывать. Пообещать это нельзя,
  // поэтому, пока запись не легла, вопрос задаётся и при выбранной папке.
  window.addEventListener("beforeunload", (event) => {
    const waiting = autosavePendingWrite();
    if (waiting) autosaveFlush({ onDone: onFolderWritten });
    if (!getState().dirty) return;
    if (autosaveReady() && !waiting) return;
    event.preventDefault();
    event.returnValue = "";
  });

  onAutosaveChange(() => renderStatus());
  setInterval(() => renderStatus(), FILE_TICK_MS);

  (async () => {
    await autosaveRestore();
    renderStatus();
  })();
  renderStatus();
}

// Контейнер в шапке панель заводит сама: точки монтирования для неё в разметке
// нет, а править разметку последним таском — лишний повод сломать сборку.
function startFilePanel() {
  const header = document.getElementById("app-header");
  if (!header || document.getElementById("file-actions")) return;
  const host = uiEl("div", { class: "mount" });
  host.id = "file-actions";
  header.append(host);
  mountFilePanel(host, panelApi());
}

if (typeof document !== "undefined") {
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startFilePanel, { once: true });
  } else {
    setTimeout(startFilePanel, 0);
  }
}

// src/panels/filters.js
// Фильтры списка меток: галочки категорий и типов, помещение и поиск.
//
// Фильтр живёт в состоянии сеанса (`state.filter`) и один на всех: по нему
// рисует холст, по нему же строится список сбоку и легенда в выгрузке.
// Поэтому здесь только чистые функции над ним — что видно, что отмечено и во
