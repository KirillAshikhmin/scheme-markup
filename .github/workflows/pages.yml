name: Сборка и публикация страницы

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # dist/ лежит в git ради запуска с диска (file://), а прод собирается заново.
  # Правка src/ без пересборки dist/ на проде не видна, а у того, кто открыл
  # папку с диска, страница старая. Отдельная работа: публикацию она не держит,
  # но краснеет, пока dist/ не пересобран и не закоммичен.
  dist:
    name: dist/ в git — свежая сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Сборка
        run: npm run build
      - name: Сверка с git
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ в git отстал от исходников: выполните node build.js и закоммитьте dist/ вместе с src/"
            git status --short -- dist
            exit 1
          fi
